      - name: Build Final MBMS APK
        working-directory: mbms_android
        shell: bash
        run: |
          set -e

          for attempt in 1 2; do
            echo "APK build attempt $attempt/2"
            if gradle --no-daemon --stacktrace clean :app:assembleDebug; then
              echo "GRADLE APK BUILD PASSED."
              break
            fi

            if [ "$attempt" -lt 2 ]; then
              echo "APK build failed; retrying after 5 seconds..."
              sleep 5
            else
              echo "ERROR: APK build failed after 2 attempts."
              exit 1
            fi
          done

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"

          mkdir -p ../release

          cp \
            "$APK" \
            "../release/MBMS-V130-ALL-REPORTS-PRINT-PDF-FIXED.apk"

          test -s \
            "../release/MBMS-V130-ALL-REPORTS-PRINT-PDF-FIXED.apk"

          ls -lh \
            "../release/MBMS-V130-ALL-REPORTS-PRINT-PDF-FIXED.apk"


      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="release/MBMS-V130-ALL-REPORTS-PRINT-PDF-FIXED.apk"

          test -s "$APK"

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify \
            --verbose \
            "$APK"

          unzip -t "$APK" >/dev/null

          sha256sum "$APK" \
            | tee release/SHA256.txt

          test -s release/SHA256.txt

          echo "APK SIGNATURE AND ZIP VERIFICATION PASSED."


      - name: Upload APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: MBMS-V130-ALL-REPORTS-PRINT-PDF-FIXED
          path: |
            release/MBMS-V130-ALL-REPORTS-PRINT-PDF-FIXED.apk
            release/SHA256.txt
          if-no-files-found: error
