name: MBMS V118 Android APK Build - FINAL FIX

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:

  build-apk:

    name: Build MBMS V118 APK

    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # 1. CHECKOUT
      # =========================================================

      - name: Checkout repository
        uses: actions/checkout@v7


      # =========================================================
      # 2. JAVA 17
      # =========================================================

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'


      # =========================================================
      # 3. ANDROID SDK
      # =========================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4


      - name: Install Android SDK packages
        shell: bash
        run: |

          set -e

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"


      # =========================================================
      # 4. GRADLE 8.7
      # =========================================================

      - name: Install Gradle 8.7
        shell: bash
        run: |

          set -e

          wget -q \
            https://services.gradle.org/distributions/gradle-8.7-bin.zip

          unzip -q \
            gradle-8.7-bin.zip \
            -d "$HOME/gradle"

          echo "$HOME/gradle/gradle-8.7/bin" >> "$GITHUB_PATH"

          gradle --version


      # =========================================================
      # 5. LOCATE V118 HTML
      # =========================================================

      - name: Locate MBMS V118 HTML
        shell: bash
        run: |

          set -e

          HTML=""

          if [ -f "Measurement_Book_Management_System_FINAL_V118_PRINT_BACKUP_ANDROID.html" ]; then
              HTML="Measurement_Book_Management_System_FINAL_V118_PRINT_BACKUP_ANDROID.html"
          fi

          if [ -z "$HTML" ] && [ -f "Measurement_Book_Management_System_FINAL_V115_MB_HISTORY_ONLY_DATE-6.html" ]; then
              HTML="Measurement_Book_Management_System_FINAL_V115_MB_HISTORY_ONLY_DATE-6.html"
          fi

          if [ -z "$HTML" ]; then
              echo "ERROR: MBMS HTML file not found."
              echo ""
              echo "Expected:"
              echo "Measurement_Book_Management_System_FINAL_V118_PRINT_BACKUP_ANDROID.html"
              exit 1
          fi

          echo "HTML_FILE=$HTML" >> "$GITHUB_ENV"

          echo "=========================================="
          echo "MBMS HTML:"
          echo "$HTML"
          echo "=========================================="


      # =========================================================
      # 6. PREPARE HTML
      # NO PYTHON PATCH
      # =========================================================

      - name: Prepare MBMS HTML
        shell: bash
        run: |

          set -e

          mkdir -p mbms_source

          cp \
            "$HTML_FILE" \
            mbms_source/index.html

          test -s mbms_source/index.html

          echo "HTML copied successfully."

          echo ""
          echo "HTML size:"
          wc -c mbms_source/index.html

          echo ""
          echo "Checking HTML..."

          grep -qi "</body>" mbms_source/index.html

          echo "HTML validation PASSED."


      # =========================================================
      # 7. CREATE ANDROID BRIDGE JS
      # =========================================================

      - name: Create Android Bridge
        shell: bash
        run: |

          set -e

          cat > mbms_source/mbms_android_bridge.js <<'EOF'

          (function(){

              "use strict";


              /* =================================================
                 BACKUP SAVE
                 ================================================= */

              window.downloadSettingsBackup = function(){

                  try{

                      if(
                          typeof mbmsSettingsSnapshot !== "function"
                      ){

                          alert(
                              "MBMS Backup function उपलब्ध नाही."
                          );

                          return;
                      }


                      var data =
                          JSON.stringify(
                              mbmsSettingsSnapshot(),
                              null,
                              2
                          );


                      var filename =
                          "MBMS_Backup_" +
                          new Date()
                              .toISOString()
                              .slice(0,10) +
                          "_" +
                          String(Date.now())
                              .slice(-6) +
                          ".json";


                      /* Native Android */

                      if(
                          window.MBMSAndroid &&
                          typeof window.MBMSAndroid.saveBackup ===
                          "function"
                      ){

                          window.MBMSAndroid.saveBackup(
                              data,
                              filename
                          );

                          return;
                      }


                      /* Browser fallback */

                      var blob =
                          new Blob(
                              [data],
                              {
                                  type:
                                      "application/json"
                              }
                          );


                      var url =
                          URL.createObjectURL(blob);


                      var a =
                          document.createElement("a");


                      a.href =
                          url;


                      a.download =
                          filename;


                      document.body.appendChild(a);


                      a.click();


                      a.remove();


                      setTimeout(
                          function(){

                              URL.revokeObjectURL(
                                  url
                              );

                          },
                          1000
                      );


                  }catch(error){

                      console.error(
                          "Backup Save error:",
                          error
                      );


                      alert(
                          "Backup Save करण्यात अडचण आली."
                      );

                  }

              };


              /* =================================================
                 RESTORE
                 ================================================= */

              window.startSettingsBackupRestore =
                  function(){

                      try{

                          if(
                              window.MBMSAndroid &&
                              typeof
                              window.MBMSAndroid.requestRestore ===
                              "function"
                          ){

                              window.MBMSAndroid.requestRestore();

                              return;
                          }

                      }catch(error){

                          console.warn(error);

                      }


                      var input =
                          document.getElementById(
                              "settingsBackupFile"
                          );


                      if(input){

                          input.click();

                      }

                  };


              /* =================================================
                 NATIVE RESTORE
                 ================================================= */

              window.mbmsNativeRestoreBase64 =
                  function(base64){

                      try{

                          var raw =
                              atob(
                                  String(
                                      base64 || ""
                                  )
                              );


                          var bytes =
                              new Uint8Array(
                                  raw.length
                              );


                          for(
                              var i = 0;
                              i < raw.length;
                              i++
                          ){

                              bytes[i] =
                                  raw.charCodeAt(i);

                          }


                          var json;


                          if(
                              typeof TextDecoder ===
                              "function"
                          ){

                              json =
                                  new TextDecoder(
                                      "utf-8"
                                  ).decode(
                                      bytes
                                  );

                          }else{

                              var encoded = "";


                              for(
                                  var j = 0;
                                  j < bytes.length;
                                  j++
                              ){

                                  encoded +=
                                      "%" +
                                      (
                                          "00" +
                                          bytes[j]
                                              .toString(16)
                                      )
                                      .slice(-2);

                              }


                              json =
                                  decodeURIComponent(
                                      encoded
                                  );

                          }


                          if(
                              typeof
                              window.restoreSettingsBackupText ===
                              "function"
                          ){

                              window.restoreSettingsBackupText(
                                  json,
                                  null
                              );

                              return;
                          }


                          alert(
                              "Restore function उपलब्ध नाही."
                          );


                      }catch(error){

                          console.error(
                              "Restore error:",
                              error
                          );


                          alert(
                              "Backup Restore करण्यात अडचण आली."
                          );

                      }

                  };


              /* =================================================
                 NATIVE PRINT
                 ================================================= */

              var oldPrint =
                  window.print;


              window.print =
                  function(){

                      try{

                          if(
                              window.MBMSAndroid &&
                              typeof
                              window.MBMSAndroid.print ===
                              "function"
                          ){

                              window.MBMSAndroid.print();

                              return;
                          }

                      }catch(error){

                          console.warn(
                              "Native print error:",
                              error
                          );

                      }


                      if(
                          typeof oldPrint ===
                          "function"
                      ){

                          oldPrint.call(
                              window
                          );

                      }

                  };


          })();

          EOF


          echo "Android Bridge JS created."

          wc -c mbms_source/mbms_android_bridge.js


      # =========================================================
      # 8. INSERT BRIDGE INTO HTML
      # =========================================================

      - name: Insert Android Bridge into HTML
        shell: bash
        run: |

          set -e

          cp \
            mbms_source/mbms_android_bridge.js \
            mbms_source/bridge.js


          sed -i \
            's#</body>#<script src="bridge.js"></script></body>#I' \
            mbms_source/index.html


          grep -qi \
            'bridge.js' \
            mbms_source/index.html


          echo "Android bridge inserted into HTML."


      # =========================================================
      # 9. CREATE ANDROID PROJECT
      # =========================================================

      - name: Create Android Project
        shell: bash
        run: |

          set -e

          rm -rf mbms_android


          mkdir -p \
            mbms_android/app/src/main/java/com/mbms/app


          mkdir -p \
            mbms_android/app/src/main/res/values


          mkdir -p \
            mbms_android/app/src/main/assets


          cp \
            mbms_source/index.html \
            mbms_android/app/src/main/assets/index.html


          cp \
            mbms_source/bridge.js \
            mbms_android/app/src/main/assets/bridge.js


          # =====================================================
          # settings.gradle
          # =====================================================

          cat > mbms_android/settings.gradle <<'EOF'

          pluginManagement {

              repositories {

                  google()

                  mavenCentral()

                  gradlePluginPortal()

              }

          }


          dependencyResolutionManagement {

              repositoriesMode.set(
                  RepositoriesMode.FAIL_ON_PROJECT_REPOS
              )


              repositories {

                  google()

                  mavenCentral()

              }

          }


          rootProject.name =
              "MBMSAndroid"


          include(":app")

          EOF


          # =====================================================
          # build.gradle
          # =====================================================

          cat > mbms_android/build.gradle <<'EOF'

          plugins {

              id 'com.android.application'
              version '8.6.1'
              apply false

          }

          EOF


          # =====================================================
          # gradle.properties
          # =====================================================

          cat > mbms_android/gradle.properties <<'EOF'

          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

          android.useAndroidX=false

          android.nonTransitiveRClass=true

          EOF


          # =====================================================
          # app/build.gradle
          # =====================================================

          cat > mbms_android/app/build.gradle <<'EOF'

          plugins {

              id 'com.android.application'

          }


          android {

              namespace 'com.mbms.app'


              compileSdk 35


              defaultConfig {

                  applicationId 'com.mbms.app'

                  minSdk 26

                  targetSdk 35

                  versionCode 118

                  versionName 'V118'

              }


              buildTypes {

                  debug {

                      minifyEnabled false

                  }


                  release {

                      minifyEnabled false

                      shrinkResources false

                  }

              }


              compileOptions {

                  sourceCompatibility =
                      JavaVersion.VERSION_17

                  targetCompatibility =
                      JavaVersion.VERSION_17

              }

          }

          EOF


          # =====================================================
          # PROGUARD
          # =====================================================

          cat > \
            mbms_android/app/proguard-rules.pro <<'EOF'

          # MBMS V118
          # No custom ProGuard rules.

          EOF


          # =====================================================
          # STRINGS
          # =====================================================

          cat > \
            mbms_android/app/src/main/res/values/strings.xml <<'EOF'

          <resources>

              <string name="app_name">
                  Measurement Book Management System
              </string>

          </resources>

          EOF


          # =====================================================
          # STYLES
          # =====================================================

          cat > \
            mbms_android/app/src/main/res/values/styles.xml <<'EOF'

          <resources>

              <style
                  name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">

                  <item name="android:fontFamily">
                      sans
                  </item>


                  <item name="android:colorAccent">
                      #1976D2
                  </item>


                  <item name="android:windowLightStatusBar">
                      false
                  </item>


                  <item name="android:navigationBarColor">
                      #0D47A1
                  </item>

              </style>

          </resources>

          EOF


          # =====================================================
          # ANDROID MANIFEST
          # =====================================================

          cat > \
            mbms_android/app/src/main/AndroidManifest.xml <<'EOF'

          <?xml version="1.0" encoding="utf-8"?>

          <manifest
              xmlns:android="http://schemas.android.com/apk/res/android">


              <uses-permission
                  android:name="android.permission.INTERNET" />


              <uses-permission
                  android:name="android.permission.WRITE_EXTERNAL_STORAGE"
                  android:maxSdkVersion="28" />


              <application

                  android:allowBackup="true"

                  android:label="@string/app_name"

                  android:theme="@style/AppTheme"

                  android:usesCleartextTraffic="true">


                  <activity

                      android:name=".MainActivity"

                      android:screenOrientation="portrait"

                      android:exported="true">


                      <intent-filter>

                          <action
                              android:name="android.intent.action.MAIN" />


                          <category
                              android:name="android.intent.category.LAUNCHER" />

                      </intent-filter>


                  </activity>


              </application>


          </manifest>

          EOF


      # =========================================================
      # 10. MAIN ACTIVITY
      # =========================================================

      - name: Create MainActivity
        shell: bash
        run: |

          set -e

          cat > \
            mbms_android/app/src/main/java/com/mbms/app/MainActivity.java <<'EOF'

          package com.mbms.app;


          import android.app.Activity;

          import android.app.DownloadManager;

          import android.app.PrintAttributes;

          import android.content.ActivityNotFoundException;

          import android.content.ContentValues;

          import android.content.Context;

          import android.content.Intent;

          import android.net.Uri;

          import android.os.Bundle;

          import android.os.Environment;

          import android.provider.MediaStore;

          import android.print.PrintManager;

          import android.webkit.DownloadListener;

          import android.webkit.JavascriptInterface;

          import android.webkit.ValueCallback;

          import android.webkit.WebChromeClient;

          import android.webkit.WebResourceRequest;

          import android.webkit.WebSettings;

          import android.webkit.WebView;

          import android.webkit.WebViewClient;

          import android.widget.Toast;


          import java.io.ByteArrayOutputStream;

          import java.io.File;

          import java.io.FileOutputStream;

          import java.io.InputStream;

          import java.io.OutputStream;

          import java.nio.charset.StandardCharsets;



          public class MainActivity extends Activity {


              private static final int REQUEST_RESTORE = 9101;

              private static final int REQUEST_FILE = 9102;


              private WebView webView;


              private ValueCallback<Uri[]> filePathCallback;



              @Override

              protected void onCreate(
                      Bundle savedInstanceState) {

                  super.onCreate(
                      savedInstanceState
                  );


                  webView =
                      new WebView(this);


                  setContentView(
                      webView
                  );


                  WebSettings settings =
                      webView.getSettings();


                  settings.setJavaScriptEnabled(
                      true
                  );


                  settings.setDomStorageEnabled(
                      true
                  );


                  settings.setAllowFileAccess(
                      true
                  );


                  settings.setAllowContentAccess(
                      true
                  );


                  settings.setBuiltInZoomControls(
                      false
                  );


                  settings.setDisplayZoomControls(
                      false
                  );


                  settings.setSupportZoom(
                      false
                  );


                  settings.setDatabaseEnabled(
                      true
                  );


                  webView.addJavascriptInterface(
                      new AndroidBridge(),
                      "MBMSAndroid"
                  );


                  webView.setWebViewClient(
                      new WebViewClient(){

                          @Override

                          public boolean
                          shouldOverrideUrlLoading(

                              WebView view,

                              WebResourceRequest request){

                              return false;

                          }

                      }
                  );


                  webView.setWebChromeClient(
                      new WebChromeClient(){

                          @Override

                          public boolean
                          onShowFileChooser(

                              WebView view,

                              ValueCallback<Uri[]> callback,

                              FileChooserParams params){


                              if(
                                  filePathCallback != null
                              ){

                                  filePathCallback
                                      .onReceiveValue(
                                          null
                                      );

                              }


                              filePathCallback =
                                  callback;


                              try{

                                  Intent intent =
                                      new Intent(
                                          Intent.ACTION_OPEN_DOCUMENT
                                      );


                                  intent.addCategory(
                                      Intent.CATEGORY_OPENABLE
                                  );


                                  intent.setType(
                                      "*/*"
                                  );


                                  startActivityForResult(

                                      intent,

                                      REQUEST_FILE

                                  );


                                  return true;


                              }catch(Exception e){

                                  filePathCallback =
                                      null;

                                  return false;

                              }

                          }

                      }
                  );


                  webView.setDownloadListener(

                      new DownloadListener(){

                          @Override

                          public void
                          onDownloadStart(

                              String url,

                              String userAgent,

                              String contentDisposition,

                              String mimeType,

                              long contentLength){


                              try{


                                  DownloadManager.Request request =

                                      new DownloadManager.Request(

                                          Uri.parse(url)

                                      );


                                  if(
                                      mimeType != null
                                  ){

                                      request.setMimeType(
                                          mimeType
                                      );

                                  }


                                  request.setTitle(
                                      "MBMS Download"
                                  );


                                  request.setDescription(
                                      "MBMS file download"
                                  );


                                  request.setNotificationVisibility(

                                      DownloadManager.Request
                                          .VISIBILITY_VISIBLE_NOTIFY_COMPLETED

                                  );


                                  request.setDestinationInExternalPublicDir(

                                      Environment
                                          .DIRECTORY_DOWNLOADS,

                                      "MBMS_Download_" +
                                      System.currentTimeMillis() +
                                      ".json"

                                  );


                                  DownloadManager dm =

                                      (DownloadManager)
                                          getSystemService(
                                              DOWNLOAD_SERVICE
                                          );


                                  if(dm != null){

                                      dm.enqueue(
                                          request
                                      );


                                      Toast.makeText(

                                          MainActivity.this,

                                          "Download सुरू झाले.",

                                          Toast.LENGTH_SHORT

                                      ).show();

                                  }


                              }catch(Exception e){

                                  Toast.makeText(

                                      MainActivity.this,

                                      "Download सुरू करता आले नाही.",

                                      Toast.LENGTH_LONG

                                  ).show();

                              }

                          }

                      }

                  );


                  webView.loadUrl(

                      "file:///android_asset/index.html"

                  );

              }



              /* =================================================
                 ANDROID BRIDGE
                 ================================================= */


              public class AndroidBridge {


                  /* =============================================
                     PRINT
                     ============================================= */


                  @JavascriptInterface

                  public void print(){


                      runOnUiThread(

                          new Runnable(){

                              @Override

                              public void run(){


                                  try{


                                      PrintManager printManager =

                                          (PrintManager)
                                              getSystemService(
                                                  Context.PRINT_SERVICE
                                              );


                                      if(
                                          printManager == null
                                      ){

                                          throw new Exception(
                                              "Print service unavailable"
                                          );

                                      }


                                      String jobName =
                                          "MBMS Report";


                                      android.print
                                          .PrintDocumentAdapter adapter =

                                          webView
                                              .createPrintDocumentAdapter(
                                                  jobName
                                              );


                                      PrintAttributes attributes =

                                          new PrintAttributes
                                              .Builder()

                                              .setMediaSize(

                                                  PrintAttributes
                                                      .MediaSize
                                                      .ISO_A4

                                              )

                                              .setMinMargins(

                                                  PrintAttributes
                                                      .Margins
                                                      .NO_MARGINS

                                              )

                                              .build();


                                      printManager.print(

                                          jobName,

                                          adapter,

                                          attributes

                                      );


                                  }catch(Exception e){


                                      Toast.makeText(

                                          MainActivity.this,

                                          "Print सुरू करता आले नाही.",

                                          Toast.LENGTH_LONG

                                      ).show();

                                  }

                              }

                          }

                      );

                  }



                  /* =============================================
                     BACKUP SAVE
                     ============================================= */


                  @JavascriptInterface

                  public void saveBackup(

                      final String json,

                      final String filename){


                      new Thread(

                          new Runnable(){

                              @Override

                              public void run(){


                                  boolean success =
                                      false;


                                  try{


                                      if(

                                          android.os.Build.VERSION.SDK_INT
                                              >= 29

                                      ){


                                          ContentValues values =
                                              new ContentValues();


                                          values.put(

                                              MediaStore
                                                  .MediaColumns
                                                  .DISPLAY_NAME,

                                              filename

                                          );


                                          values.put(

                                              MediaStore
                                                  .MediaColumns
                                                  .MIME_TYPE,

                                              "application/json"

                                          );


                                          values.put(

                                              MediaStore
                                                  .MediaColumns
                                                  .RELATIVE_PATH,

                                              Environment
                                                  .DIRECTORY_DOWNLOADS

                                          );


                                          values.put(

                                              MediaStore
                                                  .MediaColumns
                                                  .IS_PENDING,

                                              1

                                          );


                                          Uri uri =

                                              getContentResolver()
                                                  .insert(

                                                      MediaStore
                                                          .Downloads
                                                          .EXTERNAL_CONTENT_URI,

                                                      values

                                                  );


                                          if(uri == null){

                                              throw new Exception(
                                                  "MediaStore insert failed"
                                              );

                                          }


                                          OutputStream output =

                                              getContentResolver()
                                                  .openOutputStream(
                                                      uri
                                                  );


                                          if(output == null){

                                              throw new Exception(
                                                  "Output stream unavailable"
                                              );

                                          }


                                          try{


                                              output.write(

                                                  json.getBytes(

                                                      StandardCharsets.UTF_8

                                                  )

                                              );


                                              output.flush();


                                          }finally{

                                              output.close();

                                          }


                                          ContentValues complete =
                                              new ContentValues();


                                          complete.put(

                                              MediaStore
                                                  .MediaColumns
                                                  .IS_PENDING,

                                              0

                                          );


                                          getContentResolver()
                                              .update(

                                                  uri,

                                                  complete,

                                                  null,

                                                  null

                                              );


                                          success =
                                              true;


                                      }else{


                                          File folder =

                                              Environment
                                                  .getExternalStoragePublicDirectory(

                                                      Environment
                                                          .DIRECTORY_DOWNLOADS

                                                  );


                                          if(

                                              !folder.exists() &&
                                              !folder.mkdirs()

                                          ){

                                              throw new Exception(
                                                  "Downloads folder error"
                                              );

                                          }


                                          File file =

                                              new File(

                                                  folder,

                                                  filename

                                              );


                                          FileOutputStream output =

                                              new FileOutputStream(
                                                  file
                                              );


                                          try{


                                              output.write(

                                                  json.getBytes(

                                                      StandardCharsets.UTF_8

                                                  )

                                              );


                                              output.flush();


                                          }finally{

                                              output.close();

                                          }


                                          success =
                                              true;

                                      }


                                  }catch(Exception e){

                                      e.printStackTrace();

                                  }


                                  final boolean result =
                                      success;


                                  runOnUiThread(

                                      new Runnable(){

                                          @Override

                                          public void run(){


                                              Toast.makeText(

                                                  MainActivity.this,

                                                  result

                                                      ? "Backup Downloads मध्ये Save झाला."

                                                      : "Backup Save करण्यात अडचण आली.",

                                                  Toast.LENGTH_LONG

                                              ).show();

                                          }

                                      }

                                  );

                              }

                          }

                      ).start();

                  }



                  /* =============================================
                     RESTORE PICKER
                     ============================================= */


                  @JavascriptInterface

                  public void requestRestore(){


                      runOnUiThread(

                          new Runnable(){

                              @Override

                              public void run(){


                                  try{


                                      Intent intent =

                                          new Intent(

                                              Intent.ACTION_OPEN_DOCUMENT

                                          );


                                      intent.addCategory(

                                          Intent.CATEGORY_OPENABLE

                                      );


                                      intent.setType(

                                          "application/json"

                                      );


                                      startActivityForResult(

                                          intent,

                                          REQUEST_RESTORE

                                      );


                                  }catch(

                                      ActivityNotFoundException e

                                  ){


                                      Intent intent =

                                          new Intent(

                                              Intent.ACTION_GET_CONTENT

                                          );


                                      intent.addCategory(

                                          Intent.CATEGORY_OPENABLE

                                      );


                                      intent.setType("*/*");


                                      startActivityForResult(

                                          intent,

                                          REQUEST_RESTORE

                                      );

                                  }

                              }

                          }

                      );

                  }

              }



              /* =================================================
                 READ FILE
                 ================================================= */


              private String readText(
                  Uri uri
              ) throws Exception{


                  InputStream input =

                      getContentResolver()
                          .openInputStream(
                              uri
                          );


                  if(input == null){

                      throw new Exception(
                          "Cannot open file"
                      );

                  }


                  try{


                      ByteArrayOutputStream output =

                          new ByteArrayOutputStream();


                      byte[] buffer =
                          new byte[8192];


                      int count;


                      while(

                          (count =
                              input.read(buffer))

                          != -1

                      ){

                          output.write(

                              buffer,

                              0,

                              count

                          );

                      }


                      return output.toString(

                          StandardCharsets
                              .UTF_8
                              .name()

                      );


                  }finally{

                      input.close();

                  }

              }



              /* =================================================
                 BASE64
                 ================================================= */


              private String base64Utf8(
                  String text
              ){

                  return

                      android.util.Base64
                          .encodeToString(

                              text.getBytes(

                                  StandardCharsets.UTF_8

                              ),

                              android.util.Base64.NO_WRAP

                          );

              }



              /* =================================================
                 ACTIVITY RESULT
                 ================================================= */


              @Override

              protected void onActivityResult(

                  int requestCode,

                  int resultCode,

                  Intent data

              ){


                  super.onActivityResult(

                      requestCode,

                      resultCode,

                      data

                  );


                  /* =============================================
                     BACKUP RESTORE
                     ============================================= */


                  if(

                      requestCode ==
                      REQUEST_RESTORE

                  ){


                      if(

                          resultCode ==
                          RESULT_OK &&

                          data != null &&

                          data.getData() != null

                      ){


                          try{


                              String json =

                                  readText(

                                      data.getData()

                                  );


                              String base64 =

                                  base64Utf8(
                                      json
                                  );


                              String safe =

                                  base64
                                      .replace(
                                          "\\",
                                          "\\\\"
                                      )
                                      .replace(
                                          "'",
                                          "\\'"
                                      );


                              webView.evaluateJavascript(

                                  "window.mbmsNativeRestoreBase64 && " +

                                  "window.mbmsNativeRestoreBase64('" +

                                  safe +

                                  "')",

                                  null

                              );


                          }catch(Exception e){


                              Toast.makeText(

                                  this,

                                  "Backup file वाचता आली नाही.",

                                  Toast.LENGTH_LONG

                              ).show();

                          }

                      }


                      return;

                  }



                  /* =============================================
                     HTML FILE PICKER
                     ============================================= */


                  if(

                      requestCode ==
                      REQUEST_FILE

                  ){


                      if(
                          filePathCallback == null
                      ){

                          return;

                      }


                      Uri[] result =
                          null;


                      if(

                          resultCode ==
                          RESULT_OK &&

                          data != null &&

                          data.getData() != null

                      ){

                          result =
                              new Uri[]{

                                  data.getData()

                              };

                      }


                      filePathCallback
                          .onReceiveValue(
                              result
                          );


                      filePathCallback =
                          null;

                  }

              }



              /* =================================================
                 BACK BUTTON
                 ================================================= */


              @Override

              public void onBackPressed(){


                  if(

                      webView != null &&

                      webView.canGoBack()

                  ){

                      webView.goBack();


                  }else{

                      super.onBackPressed();

                  }

              }

          }

