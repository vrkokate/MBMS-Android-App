      - name: Deep Audit - Existing Reports and Print Paths
        shell: bash
        run: |
          set -Eeuo pipefail

          HTML="mbms_work/index.html"
          test -s "$HTML"

          python3 <<'PY'
          from pathlib import Path
          import re, sys

          p = Path("mbms_work/index.html")
          text = p.read_text(encoding="utf-8")

          checks = {
              "window.print": len(re.findall(r"window\.print", text, re.I)),
              "printArea": len(re.findall(r'id=["\']printArea["\']', text, re.I)),
              "REPORT/PDF text": len(re.findall(r"REPORT\s*/\s*(?:PDF|PRINT)", text, re.I)),
              "print-related handlers": len(re.findall(r"(?:printReport|printHomeRelationshipReport|window\.print)", text, re.I)),
              "native bridge references": len(re.findall(r"(?:MBMSAndroid|AndroidBridge)\.print", text, re.I)),
          }

          for k, v in checks.items():
              print(f"{k}: {v}")

          errors = []
          if checks["window.print"] < 1:
              errors.append("No window.print reference found")
          if checks["printArea"] < 1:
              errors.append("#printArea is missing")
          if checks["REPORT/PDF text"] < 1 and checks["print-related handlers"] < 1:
              errors.append("No report/print path found")

          # Do NOT require one particular historical marker such as
          # V118_ANDROID_NATIVE_IO_PRINT_COMPAT. The Android bridge is
          # supplied by MainActivity in this workflow, and forcing a
          # legacy marker caused false-negative audit failures.
          if errors:
              print("ERROR: Report/print audit failed:")
              for e in errors:
                  print(" - " + e)
              sys.exit(1)

          print("DEEP REPORT / PRINT AUDIT PASSED.")
          PY


