      - name: Create MainActivity.java
        shell: bash
        run: |
          set -e

          cat > mbms_android/app/src/main/java/com/mbms/app/MainActivity.java <<'EOF'
          package com.mbms.app;

          import android.app.Activity;
          import android.content.ContentValues;
          import android.content.Context;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Environment;
          import android.provider.MediaStore;
          import android.print.PrintAttributes;
          import android.print.PrintDocumentAdapter;
          import android.print.PrintManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Toast;

          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.OutputStream;
          import java.nio.charset.StandardCharsets;

          public class MainActivity extends Activity {

              private static final int REQUEST_FILE = 9102;

              private WebView webView;

              private ValueCallback<Uri[]> filePathCallback;

              @Override
              protected void onCreate(
                      Bundle savedInstanceState) {

                  super.onCreate(savedInstanceState);

                  webView =
                          new WebView(this);

                  setContentView(webView);

                  WebSettings settings =
                          webView.getSettings();

                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);
                  settings.setBuiltInZoomControls(false);
                  settings.setDisplayZoomControls(false);
                  settings.setSupportZoom(false);
                  settings.setLoadWithOverviewMode(false);
                  settings.setUseWideViewPort(false);
                  settings.setTextZoom(100);

                  webView.addJavascriptInterface(
                          new AndroidBridge(),
                          "MBMSAndroid"
                  );

                  webView.setWebChromeClient(
                          new WebChromeClient() {

                              @Override
                              public boolean onShowFileChooser(
                                      WebView view,
                                      ValueCallback<Uri[]> callback,
                                      FileChooserParams params) {

                                  if(
                                      filePathCallback != null
                                  ) {
                                      filePathCallback
                                              .onReceiveValue(null);
                                  }

                                  filePathCallback =
                                          callback;

                                  try {

                                      Intent intent =
                                              new Intent(
                                                  Intent.ACTION_OPEN_DOCUMENT
                                              );

                                      intent.addCategory(
                                          Intent.CATEGORY_OPENABLE
                                      );

                                      intent.setType(
                                          "application/json"
                                      );

                                      startActivityForResult(
                                          intent,
                                          REQUEST_FILE
                                      );

                                      return true;

                                  } catch(Exception e) {

                                      filePathCallback =
                                              null;

                                      return false;
                                  }
                              }
                          }
                  );

                  webView.setWebViewClient(
                          new WebViewClient() {

                              @Override
                              public boolean
                              shouldOverrideUrlLoading(
                                      WebView view,
                                      WebResourceRequest request) {

                                  return false;
                              }

                              @Override
                              public void onPageFinished(
                                      WebView view,
                                      String url) {

                                  super.onPageFinished(
                                      view,
                                      url
                                  );

                                  installNativeBridge();
                              }
                          }
                  );

                  webView.loadUrl(
                      "file:///android_asset/index.html"
                  );
              }

              private void installNativeBridge() {

                  if(webView == null) {
                      return;
                  }

                  String js =
                          "(function(){"
                        + "try{"

                        + "window.print=function(){"
                        + "try{"
                        + "if(window.MBMSAndroid&&"
                        + "typeof window.MBMSAndroid.print"
                        + "==='function'){"
                        + "window.MBMSAndroid.print();"
                        + "return;"
                        + "}"
                        + "}catch(e){"
                        + "console.error(e);"
                        + "}"
                        + "};"

                        + "window.downloadSettingsBackup="
                        + "function(){"
                        + "try{"

                        + "var data="
                        + "JSON.stringify("
                        + "window.mbmsSettingsSnapshot(),"
                        + "null,2);"

                        + "var filename="
                        + "'MBMS_Backup_'"
                        + "+new Date()"
                        + ".toISOString()"
                        + ".slice(0,10)"
                        + "+'.json';"

                        + "if(window.MBMSAndroid&&"
                        + "typeof window.MBMSAndroid.saveBackup"
                        + "==='function'){"

                        + "window.MBMSAndroid.saveBackup("
                        + "data,filename);"

                        + "return;"
                        + "}"

                        + "}catch(e){"

                        + "alert("
                        + "'Backup Save मध्ये त्रुटी आली.'"
                        + ");"

                        + "}"
                        + "};"

                        + "}catch(e){"
                        + "console.error(e);"
                        + "}"
                        + "})();";

                  webView.evaluateJavascript(
                      js,
                      null
                  );
              }

              public class AndroidBridge {

                  @JavascriptInterface
                  public void print() {

                      runOnUiThread(
                          new Runnable() {

                              @Override
                              public void run() {

                                  try {

                                      PrintManager manager =
                                          (PrintManager)
                                          getSystemService(
                                              Context.PRINT_SERVICE
                                          );

                                      if(manager == null) {

                                          throw new Exception(
                                              "Print service unavailable"
                                          );
                                      }

                                      PrintDocumentAdapter adapter =
                                          webView
                                          .createPrintDocumentAdapter(
                                              "MBMS Report"
                                          );

                                      PrintAttributes attributes =
                                          new PrintAttributes.Builder()

                                          .setMediaSize(
                                              PrintAttributes.MediaSize.ISO_A4
                                          )

                                          .setMinMargins(
                                              PrintAttributes.Margins.NO_MARGINS
                                          )

                                          .build();

                                      manager.print(
                                          "MBMS Report",
                                          adapter,
                                          attributes
                                      );

                                  } catch(Exception e) {

                                      Toast.makeText(
                                          MainActivity.this,
                                          "Print सुरू करता आले नाही.",
                                          Toast.LENGTH_LONG
                                      ).show();
                                  }
                              }
                          }
                      );
                  }

                  @JavascriptInterface
                  public void saveBackup(
                          final String json,
                          final String filename) {

                      new Thread(
                          new Runnable() {

                              @Override
                              public void run() {

                                  boolean success =
                                          false;

                                  try {

                                      if(
                                          Build.VERSION.SDK_INT >= 29
                                      ) {

                                          ContentValues values =
                                              new ContentValues();

                                          values.put(
                                              MediaStore.Downloads.DISPLAY_NAME,
                                              filename
                                          );

                                          values.put(
                                              MediaStore.Downloads.MIME_TYPE,
                                              "application/json"
                                          );

                                          values.put(
                                              MediaStore.Downloads.RELATIVE_PATH,
                                              Environment.DIRECTORY_DOWNLOADS
                                          );

                                          values.put(
                                              MediaStore.Downloads.IS_PENDING,
                                              1
                                          );

                                          Uri uri =
                                              getContentResolver()
                                              .insert(
                                                  MediaStore.Downloads.EXTERNAL_CONTENT_URI,
                                                  values
                                              );

                                          if(uri == null) {

                                              throw new Exception(
                                                  "Unable to create backup"
                                              );
                                          }

                                          OutputStream output =
                                              getContentResolver()
                                              .openOutputStream(
                                                  uri
                                              );

                                          if(output == null) {

                                              throw new Exception(
                                                  "Unable to open backup"
                                              );
                                          }

                                          try {

                                              output.write(
                                                  json.getBytes(
                                                      StandardCharsets.UTF_8
                                                  )
                                              );

                                              output.flush();

                                          } finally {

                                              output.close();
                                          }

                                          ContentValues done =
                                              new ContentValues();

                                          done.put(
                                              MediaStore.Downloads.IS_PENDING,
                                              0
                                          );

                                          getContentResolver()
                                          .update(
                                              uri,
                                              done,
                                              null,
                                              null
                                          );

                                          success =
                                              true;

                                      } else {

                                          File directory =
                                              Environment
                                              .getExternalStoragePublicDirectory(
                                                  Environment
                                                  .DIRECTORY_DOWNLOADS
                                              );

                                          if(
                                              !directory.exists()
                                          ) {
                                              directory.mkdirs();
                                          }

                                          File file =
                                              new File(
                                                  directory,
                                                  filename
                                              );

                                          FileOutputStream output =
                                              new FileOutputStream(
                                                  file
                                              );

                                          try {

                                              output.write(
                                                  json.getBytes(
                                                      StandardCharsets.UTF_8
                                                  )
                                              );

                                              output.flush();

                                          } finally {

                                              output.close();
                                          }

                                          success =
                                              true;
                                      }

                                  } catch(Exception e) {

                                      e.printStackTrace();
                                  }

                                  final boolean result =
                                      success;

                                  runOnUiThread(
                                      new Runnable() {

                                          @Override
                                          public void run() {

                                              Toast.makeText(
                                                  MainActivity.this,
                                                  result
                                                  ?
                                                  "Backup Downloads मध्ये Save झाला."
                                                  :
                                                  "Backup Save मध्ये त्रुटी आली.",
                                                  Toast.LENGTH_LONG
                                              ).show();

                                          }
                                      }
                                  );
                              }
                          }
                      ).start();
                  }
              }

              @Override
              protected void onActivityResult(
                      int requestCode,
                      int resultCode,
                      Intent data) {

                  super.onActivityResult(
                      requestCode,
                      resultCode,
                      data
                  );

                  if(
                      requestCode != REQUEST_FILE
                  ) {
                      return;
                  }

                  if(
                      filePathCallback == null
                  ) {
                      return;
                  }

                  Uri[] results =
                          null;

                  if(
                      resultCode == RESULT_OK &&
                      data != null &&
                      data.getData() != null
                  ) {

                      results =
                          new Uri[]{
                              data.getData()
                          };
                  }

                  filePathCallback
                      .onReceiveValue(results);

                  filePathCallback =
                          null;
              }

              @Override
              public void onBackPressed() {

                  if(
                      webView != null &&
                      webView.canGoBack()
                  ) {

                      webView.goBack();

                  } else {

                      super.onBackPressed();
                  }
              }

              @Override
              protected void onDestroy() {

                  if(webView != null) {

                      webView.stopLoading();
                      webView.destroy();
                      webView = null;
                  }

                  super.onDestroy();
              }
          }
          EOF

      - name: Verify Android project
        shell: bash
        run: |
          set -e

          test -s mbms_android/settings.gradle
          test -s mbms_android/build.gradle
          test -s mbms_android/gradle.properties
          test -s mbms_android/app/build.gradle
          test -s mbms_android/app/src/main/AndroidManifest.xml
          test -s mbms_android/app/src/main/java/com/mbms/app/MainActivity.java
          test -s mbms_android/app/src/main/res/values/strings.xml
          test -s mbms_android/app/src/main/res/values/styles.xml
          test -s mbms_android/app/src/main/assets/index.html

          python3 <<'PY'
          import xml.etree.ElementTree as ET

          files = [
              "mbms_android/app/src/main/res/values/strings.xml",
              "mbms_android/app/src/main/res/values/styles.xml",
              "mbms_android/app/src/main/AndroidManifest.xml"
          ]

          for f in files:
              ET.parse(f)
              print("XML OK:", f)

          PY

          echo "ANDROID PROJECT VALIDATION PASSED."

      - name: Verify generated Android project
        working-directory: mbms_android
        shell: bash
        run: |
          set -Eeuo pipefail

          test -f settings.gradle
          test -f build.gradle
          test -f gradle.properties
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/mbms/app/MainActivity.java
          test -s app/src/main/assets/index.html

          echo "ANDROID PROJECT FILES VERIFIED."

      - name: Compile Android Java
        working-directory: mbms_android
        shell: bash
        run: |
          set -e

          for attempt in 1 2
          do

            echo "Java compilation attempt $attempt/2"

            if gradle \
                --no-daemon \
                --stacktrace \
                :app:compileDebugJavaWithJavac
            then

              echo "JAVA COMPILATION PASSED."
              exit 0

            fi

            if [ "$attempt" -lt 2 ]
            then
              echo "Java compilation failed; retrying..."
              sleep 5
            fi

          done

          echo "ERROR: Java compilation failed."
          exit 1

      - name: Build Final MBMS APK
        working-directory: mbms_android
        shell: bash
        run: |
          set -e

          for attempt in 1 2
          do

            echo "APK build attempt $attempt/2"

            if gradle \
                --no-daemon \
                --stacktrace \
                clean \
                :app:assembleDebug
            then

              echo "GRADLE APK BUILD PASSED."
              break

            fi

            if [ "$attempt" -lt 2 ]
            then
              echo "APK build failed; retrying..."
              sleep 5

            else
              echo "ERROR: APK build failed."
              exit 1
            fi

          done

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"

          cp \
            "$APK" \
            "../release/MBMS-V127-MB-SUMMARY-LINKED-STABLE.apk"

          ls -lh \
            "../release/MBMS-V127-MB-SUMMARY-LINKED-STABLE.apk"

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="release/MBMS-V127-MB-SUMMARY-LINKED-STABLE.apk"

          test -s "$APK"

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify \
            --verbose \
            "$APK"

          unzip -t \
            "$APK" \
            >/dev/null

          sha256sum \
            "$APK" \
            | tee release/SHA256.txt

          echo "APK SIGNATURE AND ZIP VERIFICATION PASSED."

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: MBMS-V127-MB-SUMMARY-LINKED-STABLE
          path: |
            release/MBMS-V127-MB-SUMMARY-LINKED-STABLE.apk
            release/SHA256.txt
          if-no-files-found: error
