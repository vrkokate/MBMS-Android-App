          cat > mbms_android/app/src/main/java/com/mbms/app/MainActivity.java <<'JAVA'
package com.mbms.app;

import android.app.Activity;
import android.content.ContentValues;
import android.content.Context;
import android.content.Intent;
import android.net.Uri;
import android.os.Build;
import android.os.Bundle;
import android.os.Environment;
import android.provider.MediaStore;
import android.print.PrintAttributes;
import android.print.PrintDocumentAdapter;
import android.print.PrintManager;
import android.webkit.CookieManager;
import android.webkit.JavascriptInterface;
import android.webkit.WebChromeClient;
import android.webkit.WebSettings;
import android.webkit.WebView;
import android.webkit.WebViewClient;
import android.webkit.WebResourceRequest;
import android.webkit.WebResourceError;
import android.widget.Toast;

import java.io.ByteArrayOutputStream;
import java.io.File;
import java.io.FileOutputStream;
import java.io.InputStream;
import java.io.OutputStream;
import java.nio.charset.StandardCharsets;

public class MainActivity {

    private WebView webView;

    private static final int REQUEST_BACKUP_RESTORE = 7001;

    @Override
    public void onCreate(Bundle savedInstanceState) {
        super.onCreate(savedInstanceState);

        getWindow().setStatusBarColor(
                android.graphics.Color.rgb(4, 54, 111)
        );

        getWindow().setNavigationBarColor(
                android.graphics.Color.rgb(6, 69, 142)
        );

        webView = new WebView(this);

        setContentView(webView);

        WebSettings s = webView.getSettings();

        s.setJavaScriptEnabled(true);
        s.setDomStorageEnabled(true);
        s.setDatabaseEnabled(true);
        s.setAllowFileAccess(true);
        s.setAllowContentAccess(true);
        s.setBuiltInZoomControls(false);
        s.setDisplayZoomControls(false);
        s.setSupportZoom(false);
        s.setLoadWithOverviewMode(false);
        s.setUseWideViewPort(false);
        s.setTextZoom(100);
        s.setMediaPlaybackRequiresUserGesture(false);

        CookieManager.getInstance().setAcceptCookie(true);

        webView.setBackgroundColor(
                android.graphics.Color.rgb(238, 246, 255)
        );

        webView.setWebChromeClient(new WebChromeClient());

        webView.addJavascriptInterface(
                new AndroidBridge(),
                "MBMSAndroid"
        );

        webView.setWebViewClient(new WebViewClient() {

            @Override
            public boolean shouldOverrideUrlLoading(
                    WebView view,
                    WebResourceRequest request) {
                return false;
            }

            @Override
            public void onReceivedError(
                    WebView view,
                    WebResourceRequest request,
                    WebResourceError error) {
                super.onReceivedError(view, request, error);
            }

            @Override
            public void onPageFinished(
                    WebView view,
                    String url) {

                super.onPageFinished(view, url);

                injectPrintAndBackupBridge();
            }
        });

        if (savedInstanceState == null) {

            webView.loadUrl(
                    "file:///android_asset/index.html"
            );

        } else {

            webView.restoreState(savedInstanceState);

            webView.postDelayed(
                    new Runnable() {
                        @Override
                        public void run() {
                            injectPrintAndBackupBridge();
                        }
                    },
                    300
            );
        }
    }

    private void injectPrintAndBackupBridge() {

        if (webView == null) {
            return;
        }

        String js =
                "(function(){"

                + "if(window.__MBMS_ANDROID_PRINT_BACKUP__)return;"
                + "window.__MBMS_ANDROID_PRINT_BACKUP__=true;"

                + "window.print=function(){"
                + "try{"
                + "if(window.MBMSAndroid&&"
                + "typeof window.MBMSAndroid.print==='function'){"
                + "window.MBMSAndroid.print();"
                + "}"
                + "}catch(e){"
                + "console.error(e);"
                + "}"
                + "};"

                + "window.downloadSettingsBackup=function(){"
                + "try{"
                + "var data=JSON.stringify("
                + "window.mbmsSettingsSnapshot(),null,2);"
                + "var filename='MBMS_Backup_'+"
                + "new Date().toISOString().slice(0,10)+'.json';"
                + "if(window.MBMSAndroid&&"
                + "typeof window.MBMSAndroid.saveBackup==='function'){"
                + "window.MBMSAndroid.saveBackup(data,filename);"
                + "return;"
                + "}"
                + "var blob=new Blob([data],{type:'application/json'});"
                + "var url=URL.createObjectURL(blob);"
                + "var a=document.createElement('a');"
                + "a.href=url;"
                + "a.download=filename;"
                + "document.body.appendChild(a);"
                + "a.click();"
                + "a.remove();"
                + "setTimeout(function(){URL.revokeObjectURL(url);},1000);"
                + "}catch(e){"
                + "alert('Backup Save करण्यात अडचण आली.');"
                + "}"
                + "};"

                + "window.startSettingsBackupRestore=function(){"
                + "if(window.MBMSAndroid&&"
                + "typeof window.MBMSAndroid.requestRestore==='function'){"
                + "window.MBMSAndroid.requestRestore();"
                + "return;"
                + "}"
                + "var input=document.getElementById('settingsBackupFile');"
                + "if(input)input.click();"
                + "};"

                + "window.mbmsNativeRestoreBase64=function(b64){"
                + "try{"
                + "var raw=atob(String(b64||''));"
                + "var bytes=new Uint8Array(raw.length);"
                + "for(var i=0;i<raw.length;i++){bytes[i]=raw.charCodeAt(i);}"
                + "var json=new TextDecoder('utf-8').decode(bytes);"
                + "var obj=JSON.parse(json);"
                + "if(!obj||!obj.data||"
                + "!Array.isArray(obj.data.mb)||"
                + "!Array.isArray(obj.data.je)||"
                + "!Array.isArray(obj.data.work)||"
                + "!Array.isArray(obj.data.assignment)||"
                + "!Array.isArray(obj.data.bills)||"
                + "!Array.isArray(obj.data.transfer)){"
                + "throw new Error('Invalid backup');"
                + "}"
                + "if(!confirm("
                + "'Backup मधील पूर्ण data restore करायचा आहे?\\n\\n'"
                + "+'सध्याचा MBMS data replace होईल.'"
                + ")){return;}"
                + "saveMBs(obj.data.mb);"
                + "saveJEs(obj.data.je);"
                + "saveWorkList(obj.data.work);"
                + "saveAssignments(obj.data.assignment);"
                + "saveBills(obj.data.bills);"
                + "saveTransferHistory(obj.data.transfer);"
                + "try{renderMBSummary();}catch(e){}"
                + "try{loadWorkOptions();renderWorkList();}catch(e){}"
                + "try{loadAssignOptions();renderAssignments();}catch(e){}"
                + "try{renderJEList();}catch(e){}"
                + "try{refreshSettingsDataCheck();}catch(e){}"
                + "alert('Backup data यशस्वीपणे restore झाला आहे.');"
                + "}catch(e){"
                + "alert('ही valid MBMS backup file नाही.');"
                + "}"
                + "};"

                + "function hookRestoreButton(){"
                + "var buttons=document.querySelectorAll('button');"
                + "for(var i=0;i<buttons.length;i++){"
                + "var text=(buttons[i].textContent||'').trim().toUpperCase();"
                + "if(text==='BACKUP RESTORE'&&"
                + "buttons[i].getAttribute('data-mbms-native')!=='1'){"
                + "buttons[i].setAttribute('data-mbms-native','1');"
                + "buttons[i].addEventListener('click',function(event){"
                + "event.preventDefault();"
                + "event.stopImmediatePropagation();"
                + "window.startSettingsBackupRestore();"
                + "},true);"
                + "}"
                + "}"
                + "}"

                + "hookRestoreButton();"

                + "if(window.MutationObserver&&document.body){"
                + "new MutationObserver(function(){hookRestoreButton();})"
                + ".observe(document.body,{childList:true,subtree:true});"
                + "}"

                + "})();";

        webView.evaluateJavascript(js, null);
    }

    public class AndroidBridge {

        @JavascriptInterface
        public void print() {

            runOnUiThread(
                    new Runnable() {

                        @Override
                        public void run() {

                            try {

                                PrintManager manager =
                                        (PrintManager)
                                                getSystemService(
                                                        Context.PRINT_SERVICE
                                                );

                                if (manager == null) {
                                    throw new Exception(
                                            "Print service unavailable"
                                    );
                                }

                                PrintDocumentAdapter adapter =
                                        webView.createPrintDocumentAdapter(
                                                "MBMS Report"
                                        );

                                PrintAttributes attributes =
                                        new PrintAttributes.Builder()
                                                .setMediaSize(
                                                        PrintAttributes
                                                                .MediaSize
                                                                .ISO_A4
                                                )
                                                .setMinMargins(
                                                        PrintAttributes
                                                                .Margins
                                                                .NO_MARGINS
                                                )
                                                .build();

                                manager.print(
                                        "MBMS Report",
                                        adapter,
                                        attributes
                                );

                            } catch (Exception e) {

                                Toast.makeText(
                                        MainActivity.this,
                                        "Print सुरू करता आले नाही.",
                                        Toast.LENGTH_LONG
                                ).show();
                            }
                        }
                    }
            );
        }

        @JavascriptInterface
        public void saveBackup(
                final String json,
                final String filename) {

            new Thread(
                    new Runnable() {

                        @Override
                        public void run() {

                            boolean success = false;

                            try {

                                if (Build.VERSION.SDK_INT >= 29) {

                                    ContentValues values =
                                            new ContentValues();

                                    values.put(
                                            MediaStore.MediaColumns
                                                    .DISPLAY_NAME,
                                            filename
                                    );

                                    values.put(
                                            MediaStore.MediaColumns
                                                    .MIME_TYPE,
                                            "application/json"
                                    );

                                    values.put(
                                            MediaStore.MediaColumns
                                                    .RELATIVE_PATH,
                                            Environment
                                                    .DIRECTORY_DOWNLOADS
                                    );

                                    values.put(
                                            MediaStore.MediaColumns
                                                    .IS_PENDING,
                                            1
                                    );

                                    Uri uri =
                                            getContentResolver().insert(
                                                    MediaStore.Downloads
                                                            .EXTERNAL_CONTENT_URI,
                                                    values
                                            );

                                    if (uri == null) {
                                        throw new Exception(
                                                "Unable to create backup"
                                        );
                                    }

                                    OutputStream output =
                                            getContentResolver()
                                                    .openOutputStream(uri);

                                    if (output == null) {
                                        throw new Exception(
                                                "Unable to open backup"
                                        );
                                    }

                                    try {

                                        output.write(
                                                json.getBytes(
                                                        StandardCharsets.UTF_8
                                                )
                                        );

                                        output.flush();

                                    } finally {

                                        output.close();
                                    }

                                    ContentValues done =
                                            new ContentValues();

                                    done.put(
                                            MediaStore.MediaColumns
                                                    .IS_PENDING,
                                            0
                                    );

                                    getContentResolver().update(
                                            uri,
                                            done,
                                            null,
                                            null
                                    );

                                    success = true;

                                } else {

                                    File directory =
                                            Environment
                                                    .getExternalStoragePublicDirectory(
                                                            Environment
                                                                    .DIRECTORY_DOWNLOADS
                                                    );

                                    if (!directory.exists() &&
                                            !directory.mkdirs()) {

                                        throw new Exception(
                                                "Downloads unavailable"
                                        );
                                    }

                                    File file =
                                            new File(
                                                    directory,
                                                    filename
                                            );

                                    FileOutputStream output =
                                            new FileOutputStream(file);

                                    try {

                                        output.write(
                                                json.getBytes(
                                                        StandardCharsets.UTF_8
                                                )
                                        );

                                        output.flush();

                                    } finally {

                                        output.close();
                                    }

                                    success = true;
                                }

                            } catch (Exception e) {

                                e.printStackTrace();
                            }

                            final boolean result =
                                    success;

                            runOnUiThread(
                                    new Runnable() {

                                        @Override
                                        public void run() {

                                            Toast.makeText(
                                                    MainActivity.this,
                                                    result
                                                            ? "Backup Downloads मध्ये Save झाला."
                                                            : "Backup Save करण्यात अडचण आली.",
                                                    Toast.LENGTH_LONG
                                            ).show();
                                        }
                                    }
                            );
                        }
                    }
            ).start();
        }

        @JavascriptInterface
        public void requestRestore() {

            runOnUiThread(
                    new Runnable() {

                        @Override
                        public void run() {

                            try {

                                Intent intent =
                                        new Intent(
                                                Intent.ACTION_OPEN_DOCUMENT
                                        );

                                intent.addCategory(
                                        Intent.CATEGORY_OPENABLE
                                );

                                intent.setType("*/*");

                                startActivityForResult(
                                        intent,
                                        REQUEST_BACKUP_RESTORE
                                );

                            } catch (Exception e) {

                                Toast.makeText(
                                        MainActivity.this,
                                        "Backup Restore सुरू करता आले नाही.",
                                        Toast.LENGTH_LONG
                                ).show();
                            }
                        }
                    }
            );
        }
    }

    private String readText(Uri uri)
            throws Exception {

        InputStream input =
                getContentResolver()
                        .openInputStream(uri);

        if (input == null) {
            throw new Exception(
                    "Cannot open backup file"
            );
        }

        try {

            ByteArrayOutputStream output =
                    new ByteArrayOutputStream();

            byte[] buffer =
                    new byte[8192];

            int count;

            while ((count =
                    input.read(buffer)) != -1) {

                output.write(
                        buffer,
                        0,
                        count
                );
            }

            return output.toString("UTF-8");

        } finally {

            input.close();
        }
    }

    private String base64Utf8(String text) {

        return android.util.Base64
                .encodeToString(
                        text.getBytes(
                                StandardCharsets.UTF_8
                        ),
                        android.util.Base64.NO_WRAP
                );
    }

    @Override
    protected void onActivityResult(
            int requestCode,
            int resultCode,
            Intent data) {

        super.onActivityResult(
                requestCode,
                resultCode,
                data
        );

        if (requestCode != REQUEST_BACKUP_RESTORE) {
            return;
        }

        if (resultCode != RESULT_OK ||
                data == null ||
                data.getData() == null) {
            return;
        }

        try {

            String json =
                    readText(
                            data.getData()
                    );

            String encoded =
                    base64Utf8(json);

            String javascript =
                    "if(window.mbmsNativeRestoreBase64)" +
                    "{window.mbmsNativeRestoreBase64('" +
                    encoded +
                    "');}";

            webView.evaluateJavascript(
                    javascript,
                    null
            );

        } catch (Exception e) {

            Toast.makeText(
                    this,
                    "Backup file वाचता आली नाही.",
                    Toast.LENGTH_LONG
            ).show();
        }
    }

    @Override
    protected void onSaveInstanceState(
            Bundle outState) {

        webView.saveState(outState);

        super.onSaveInstanceState(outState);
    }

    @Override
    protected void onDestroy() {

        if (webView != null) {

            webView.stopLoading();
            webView.destroy();
            webView = null;
        }

        super.onDestroy();
    }

    @Override
    public void onBackPressed() {

        if (webView != null &&
                webView.canGoBack()) {

            webView.goBack();

        } else {

            super.onBackPressed();
        }
    }
}
