name: MBMS V118 Android APK Build - VERIFIED FINAL

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    name: Build MBMS V118 APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        shell: bash
        run: |
          set -e
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle 8.7
        shell: bash
        run: |
          set -e

          wget -q \
            https://services.gradle.org/distributions/gradle-8.7-bin.zip

          unzip -q gradle-8.7-bin.zip \
            -d "$HOME/gradle"

          echo "$HOME/gradle/gradle-8.7/bin" >> "$GITHUB_PATH"

          "$HOME/gradle/gradle-8.7/bin/gradle" --version

      - name: Locate MBMS V118 HTML
        shell: bash
        run: |
          set -e

          if [ -f "Measurement_Book_Management_System_FINAL_V118_PRINT_BACKUP_ANDROID.html" ]; then

            echo "HTML_FILE=Measurement_Book_Management_System_FINAL_V118_PRINT_BACKUP_ANDROID.html" \
              >> "$GITHUB_ENV"

          elif [ -f "Measurement_Book_Management_System_FINAL_V115_MB_HISTORY_ONLY_DATE-6.html" ]; then

            echo "HTML_FILE=Measurement_Book_Management_System_FINAL_V115_MB_HISTORY_ONLY_DATE-6.html" \
              >> "$GITHUB_ENV"

          else

            echo "ERROR: Required MBMS HTML file was not found."
            exit 1

          fi

          echo "Using MBMS HTML:"
          echo "$HTML_FILE"

      - name: Prepare MBMS assets
        shell: bash
        run: |
          set -e

          mkdir -p \
            mbms_android/app/src/main/assets

          cp "$HTML_FILE" \
            mbms_android/app/src/main/assets/index.html

          test -s \
            mbms_android/app/src/main/assets/index.html

          echo "HTML size:"
          wc -c \
            mbms_android/app/src/main/assets/index.html

          echo "Checking MBMS functions..."

          grep -q "mbmsSettingsSnapshot" \
            mbms_android/app/src/main/assets/index.html

          grep -q "generateWorkReport" \
            mbms_android/app/src/main/assets/index.html

          echo "MBMS HTML validation PASSED."

      - name: Create Android project
        shell: bash
        run: |
          set -e

          mkdir -p \
            mbms_android/app/src/main/java/com/mbms/app

          mkdir -p \
            mbms_android/app/src/main/res/values

          cat > mbms_android/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)

              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "MBMSAndroid"

          include(":app")
          EOF

          cat > mbms_android/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF

          cat > mbms_android/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=false
          android.nonTransitiveRClass=true
          EOF

          cat > mbms_android/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {

              namespace 'com.mbms.app'

              compileSdk 35

              defaultConfig {

                  applicationId 'com.mbms.app'

                  minSdk 26

                  targetSdk 35

                  versionCode 118

                  versionName 'V118'
              }

              buildTypes {

                  debug {

                      minifyEnabled false
                  }

                  release {

                      minifyEnabled false

                      shrinkResources false
                  }
              }

              compileOptions {

                  sourceCompatibility JavaVersion.VERSION_17

                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat > mbms_android/app/src/main/res/values/strings.xml <<'EOF'
          <resources>

              <string name="app_name">
                  Measurement Book Management System
              </string>

          </resources>
          EOF

          cat > mbms_android/app/src/main/res/values/styles.xml <<'EOF'
          <resources>

              <style
                  name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">

                  <item name="android:fontFamily">sans</item>

                  <item name="android:colorAccent">
                      #1976D2
                  </item>

                  <item name="android:windowLightStatusBar">
                      false
                  </item>

                  <item name="android:navigationBarColor">
                      #0D47A1
                  </item>

              </style>

          </resources>
          EOF

          cat > mbms_android/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <manifest
              xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission
                  android:name="android.permission.INTERNET" />

              <uses-permission
                  android:name="android.permission.WRITE_EXTERNAL_STORAGE"
                  android:maxSdkVersion="28" />

              <application

                  android:allowBackup="true"

                  android:label="@string/app_name"

                  android:theme="@style/AppTheme"

                  android:usesCleartextTraffic="true">

                  <activity

                      android:name=".MainActivity"

                      android:screenOrientation="portrait"

                      android:exported="true">

                      <intent-filter>

                          <action
                              android:name="android.intent.action.MAIN" />

                          <category
                              android:name="android.intent.category.LAUNCHER" />

                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cat > mbms_android/app/src/main/java/com/mbms/app/MainActivity.java <<'EOF'
          package com.mbms.app;

          import android.app.Activity;
          import android.app.DownloadManager;
          import android.app.PrintAttributes;
          import android.content.ActivityNotFoundException;
          import android.content.ContentValues;
          import android.content.Context;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.os.Environment;
          import android.provider.MediaStore;
          import android.print.PrintManager;
          import android.webkit.DownloadListener;
          import android.webkit.JavascriptInterface;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Toast;

          import java.io.ByteArrayOutputStream;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.InputStream;
          import java.io.OutputStream;
          import java.nio.charset.StandardCharsets;

          public class MainActivity extends Activity {

              private static final int REQUEST_RESTORE = 9101;

              private static final int REQUEST_FILE = 9102;

              private WebView webView;

              private ValueCallback<Uri[]> filePathCallback;


              @Override
              protected void onCreate(Bundle savedInstanceState) {

                  super.onCreate(savedInstanceState);

                  webView = new WebView(this);

                  setContentView(webView);


                  WebSettings settings =
                          webView.getSettings();

                  settings.setJavaScriptEnabled(true);

                  settings.setDomStorageEnabled(true);

                  settings.setAllowFileAccess(true);

                  settings.setAllowContentAccess(true);

                  settings.setBuiltInZoomControls(false);

                  settings.setDisplayZoomControls(false);

                  settings.setSupportZoom(false);


                  webView.addJavascriptInterface(
                          new AndroidBridge(),
                          "MBMSAndroid");


                  webView.setWebViewClient(
                          new WebViewClient() {

                      @Override
                      public boolean shouldOverrideUrlLoading(
                              WebView view,
                              WebResourceRequest request) {

                          return false;
                      }
                  });


                  webView.setWebChromeClient(
                          new WebChromeClient() {

                      @Override
                      public boolean onShowFileChooser(

                              WebView view,

                              ValueCallback<Uri[]> callback,

                              FileChooserParams params) {


                          if (filePathCallback != null) {

                              filePathCallback
                                      .onReceiveValue(null);
                          }


                          filePathCallback = callback;


                          try {

                              Intent intent =
                                      new Intent(
                                              Intent.ACTION_OPEN_DOCUMENT);

                              intent.addCategory(
                                      Intent.CATEGORY_OPENABLE);

                              intent.setType("*/*");


                              startActivityForResult(

                                      intent,

                                      REQUEST_FILE);


                              return true;

                          } catch (Exception e) {

                              filePathCallback = null;

                              return false;
                          }
                      }
                  });


                  webView.setDownloadListener(
                          new DownloadListener() {

                      @Override
                      public void onDownloadStart(

                              String url,

                              String userAgent,

                              String contentDisposition,

                              String mimeType,

                              long contentLength) {


                          try {

                              DownloadManager.Request request =

                                      new DownloadManager.Request(
                                              Uri.parse(url));


                              if (mimeType != null) {

                                  request.setMimeType(mimeType);
                              }


                              request.setTitle(
                                      "MBMS Download");


                              request.setDescription(
                                      "MBMS file download");


                              request.setNotificationVisibility(

                                      DownloadManager.Request
                                              .VISIBILITY_VISIBLE_NOTIFY_COMPLETED);


                              String extension = ".bin";


                              if (mimeType != null &&

                                  mimeType
                                      .toLowerCase()
                                      .contains("json")) {

                                  extension = ".json";
                              }


                              request.setDestinationInExternalPublicDir(

                                      Environment.DIRECTORY_DOWNLOADS,

                                      "MBMS_Download_" +

                                      System.currentTimeMillis() +

                                      extension);


                              DownloadManager manager =

                                      (DownloadManager)
                                      getSystemService(
                                              DOWNLOAD_SERVICE);


                              if (manager != null) {

                                  manager.enqueue(request);


                                  Toast.makeText(

                                          MainActivity.this,

                                          "Download सुरू झाले.",

                                          Toast.LENGTH_SHORT).show();
                              }


                          } catch (Exception e) {

                              Toast.makeText(

                                      MainActivity.this,

                                      "Download सुरू करता आले नाही.",

                                      Toast.LENGTH_LONG).show();
                          }
                      }
                  });


                  webView.loadUrl(
                          "file:///android_asset/index.html");
              }


              public class AndroidBridge {


                  @JavascriptInterface
                  public void print() {

                      runOnUiThread(
                              new Runnable() {

                          @Override
                          public void run() {

                              try {

                                  PrintManager manager =

                                          (PrintManager)
                                          getSystemService(
                                                  Context.PRINT_SERVICE);


                                  if (manager == null) {

                                      throw new Exception(
                                              "Print service unavailable");
                                  }


                                  String jobName =
                                          "MBMS Report";


                                  android.print.PrintDocumentAdapter adapter =

                                          webView
                                              .createPrintDocumentAdapter(
                                                      jobName);


                                  PrintAttributes attributes =

                                          new PrintAttributes.Builder()

                                              .setMediaSize(

                                                  PrintAttributes
                                                      .MediaSize
                                                      .ISO_A4)

                                              .setMinMargins(

                                                  PrintAttributes
                                                      .Margins
                                                      .NO_MARGINS)

                                              .build();


                                  manager.print(

                                          jobName,

                                          adapter,

                                          attributes);


                              } catch (Exception e) {

                                  Toast.makeText(

                                          MainActivity.this,

                                          "Print सुरू करता आले नाही.",

                                          Toast.LENGTH_LONG).show();
                              }
                          }
                      });
                  }


                  @JavascriptInterface
                  public void saveBackup(

                          final String json,

                          final String filename) {


                      new Thread(
                              new Runnable() {

                          @Override
                          public void run() {


                              boolean success = false;


                              try {


                                  if (android.os.Build.VERSION.SDK_INT
                                          >= 29) {


                                      ContentValues values =
                                              new ContentValues();


                                      values.put(

                                              MediaStore.MediaColumns
                                                  .DISPLAY_NAME,

                                              filename);


                                      values.put(

                                              MediaStore.MediaColumns
                                                  .MIME_TYPE,

                                              "application/json");


                                      values.put(

                                              MediaStore.MediaColumns
                                                  .RELATIVE_PATH,

                                              Environment
                                                  .DIRECTORY_DOWNLOADS);


                                      values.put(

                                              MediaStore.MediaColumns
                                                  .IS_PENDING,

                                              1);


                                      Uri uri =

                                              getContentResolver()
                                                  .insert(

                                                      MediaStore
                                                          .Downloads
                                                          .EXTERNAL_CONTENT_URI,

                                                      values);


                                      if (uri == null) {

                                          throw new Exception(
                                                  "MediaStore insert failed");
                                      }


                                      OutputStream output =

                                              getContentResolver()
                                                  .openOutputStream(uri);


                                      if (output == null) {

                                          throw new Exception(
                                                  "Output stream unavailable");
                                      }


                                      try {

                                          output.write(

                                              json.getBytes(
                                                  StandardCharsets.UTF_8));

                                          output.flush();

                                      } finally {

                                          output.close();
                                      }


                                      ContentValues done =
                                              new ContentValues();


                                      done.put(

                                              MediaStore.MediaColumns
                                                  .IS_PENDING,

                                              0);


                                      getContentResolver().update(

                                              uri,

                                              done,

                                              null,

                                              null);


                                      success = true;


                                  } else {


                                      File directory =

                                              Environment
                                                  .getExternalStoragePublicDirectory(

                                                      Environment
                                                          .DIRECTORY_DOWNLOADS);


                                      if (!directory.exists() &&

                                          !directory.mkdirs()) {

                                          throw new Exception(
                                                  "Downloads unavailable");
                                      }


                                      File file =

                                              new File(

                                                      directory,

                                                      filename);


                                      FileOutputStream output =

                                              new FileOutputStream(file);


                                      try {

                                          output.write(

                                              json.getBytes(
                                                  StandardCharsets.UTF_8));

                                          output.flush();

                                      } finally {

                                          output.close();
                                      }


                                      success = true;
                                  }


                              } catch (Exception e) {

                                  e.printStackTrace();
                              }


                              final boolean result = success;


                              runOnUiThread(
                                      new Runnable() {

                                  @Override
                                  public void run() {


                                      Toast.makeText(

                                              MainActivity.this,

                                              result

                                                  ? "Backup Downloads मध्ये Save झाला."

                                                  : "Backup Save करण्यात अडचण आली.",

                                              Toast.LENGTH_LONG).show();
                                  }
                              });
                          }
                      }).start();
                  }


                  @JavascriptInterface
                  public void requestRestore() {


                      runOnUiThread(
                              new Runnable() {

                          @Override
                          public void run() {


                              try {


                                  Intent intent =

                                          new Intent(
                                              Intent.ACTION_OPEN_DOCUMENT);


                                  intent.addCategory(

                                          Intent.CATEGORY_OPENABLE);


                                  intent.setType(
                                          "application/json");


                                  startActivityForResult(

                                          intent,

                                          REQUEST_RESTORE);


                              } catch (ActivityNotFoundException e) {


                                  Intent intent =

                                          new Intent(
                                              Intent.ACTION_GET_CONTENT);


                                  intent.addCategory(

                                          Intent.CATEGORY_OPENABLE);


                                  intent.setType("*/*");


                                  startActivityForResult(

                                          intent,

                                          REQUEST_RESTORE);
                              }
                          }
                      });
                  }
              }


              private String readText(Uri uri)
                      throws Exception {


                  InputStream input =

                          getContentResolver()
                              .openInputStream(uri);


                  if (input == null) {

                      throw new Exception(
                              "Cannot open backup file");
                  }


                  try {


                      ByteArrayOutputStream output =

                              new ByteArrayOutputStream();


                      byte[] buffer = new byte[8192];

                      int count;


                      while ((count =
                              input.read(buffer)) != -1) {

                          output.write(
                                  buffer,
                                  0,
                                  count);
                      }


                      return output.toString(

                              StandardCharsets
                                  .UTF_8
                                  .name());


                  } finally {

                      input.close();
                  }
              }


              private String base64Utf8(String text) {


                  return android.util.Base64
                          .encodeToString(

                              text.getBytes(
                                  StandardCharsets.UTF_8),

                              android.util.Base64.NO_WRAP);
              }


              @Override
              protected void onActivityResult(

                      int requestCode,

                      int resultCode,

                      Intent data) {


                  super.onActivityResult(

                          requestCode,

                          resultCode,

                          data);


                  if (requestCode == REQUEST_RESTORE) {


                      if (resultCode == RESULT_OK &&

                          data != null &&

                          data.getData() != null) {


                          try {


                              String json =
                                      readText(
                                              data.getData());


                              String encoded =
                                      base64Utf8(json);


                              webView.evaluateJavascript(

                                      "window.mbmsNativeRestoreBase64" +

                                      " && " +

                                      "window.mbmsNativeRestoreBase64('" +

                                      encoded +

                                      "')",

                                      null);


                          } catch (Exception e) {


                              Toast.makeText(

                                      this,

                                      "Backup file वाचता आली नाही.",

                                      Toast.LENGTH_LONG).show();
                          }
                      }


                      return;
                  }


                  if (requestCode == REQUEST_FILE) {


                      if (filePathCallback == null) {

                          return;
                      }


                      Uri[] results = null;


                      if (resultCode == RESULT_OK &&

                          data != null &&

                          data.getData() != null) {


                          results = new Uri[]{

                                  data.getData()

                          };
                      }


                      filePathCallback
                              .onReceiveValue(results);


                      filePathCallback = null;
                  }
              }


              @Override
              public void onBackPressed() {


                  if (webView != null &&

                      webView.canGoBack()) {

                      webView.goBack();

                  } else {

                      super.onBackPressed();
                  }
              }
          }
          EOF

          echo "Android project created."


      - name: Validate Android files
        shell: bash
        run: |
          set -e

          test -s \
            mbms_android/app/src/main/AndroidManifest.xml

          test -s \
            mbms_android/app/src/main/res/values/styles.xml

          test -s \
            mbms_android/app/src/main/res/values/strings.xml

          test -s \
            mbms_android/app/src/main/java/com/mbms/app/MainActivity.java

          test -s \
            mbms_android/app/src/main/assets/index.html


          grep -q \
            "com.android.application' version '8.6.1' apply false" \
            mbms_android/build.gradle


          grep -q \
            "class MainActivity extends Activity" \
            mbms_android/app/src/main/java/com/mbms/app/MainActivity.java


          grep -q \
            "createPrintDocumentAdapter" \
            mbms_android/app/src/main/java/com/mbms/app/MainActivity.java


          grep -q \
            "saveBackup" \
            mbms_android/app/src/main/java/com/mbms/app/MainActivity.java


          grep -q \
            "requestRestore" \
            mbms_android/app/src/main/java/com/mbms/app/MainActivity.java


          if grep -Riq "androidx.appcompat" mbms_android; then

              echo "ERROR: AppCompat detected."

              exit 1

          fi


          if grep -Riq \
              "implementation.*appcompat" \
              mbms_android; then

              echo "ERROR: AppCompat dependency detected."

              exit 1

          fi


          echo "Android project validation PASSED."


      - name: Build MBMS V118 Debug APK
        shell: bash
        run: |
          set -e

          cd mbms_android


          gradle \
            --no-daemon \
            --stacktrace \
            clean \
            assembleDebug


          APK="app/build/outputs/apk/debug/app-debug.apk"


          test -s "$APK"


          echo "APK generated:"

          ls -lh "$APK"


          mkdir -p ../release


          cp \
            "$APK" \
            "../release/MBMS-V118-Android.apk"


      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="release/MBMS-V118-Android.apk"


          test -s "$APK"


          echo "APK size:"

          ls -lh "$APK"


          echo "SHA256:"

          sha256sum "$APK" \
            | tee release/SHA256.txt


          echo "APK ZIP validation:"

          unzip -t "$APK" >/dev/null


          echo "APK verification PASSED."


      - name: Upload MBMS V118 APK
        uses: actions/upload-artifact@v4
        with:

          name: MBMS-V118-Android-APK

          path: |

            release/MBMS-V118-Android.apk

            release/SHA256.txt

          if-no-files-found: error
