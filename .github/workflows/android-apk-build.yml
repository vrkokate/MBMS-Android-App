                        b?.billType||'-'
                      )
                      +line(
                        'Bill क्रमांक',
                        b?.billNo||'-'
                      )
                      +line(
                        'Bill दिनांक',
                        date(
                          b?.billDate||
                          b?.savedAt
                        )
                      )
                      +line(
                        'M.B. क्रमांक',
                        b?.mb||'-'
                      )
                      +line(
                        'कामाचे नाव',
                        workName(b)||'-'
                      )
                      +line(
                        'Junior Engineer',
                        b?.je||'-'
                      )
                      +line(
                        'Contractor / Agency',
                        b?.contractor||'-'
                      )
                      +line(
                        'Bill रक्कम',
