        shell: bash
        run: |
          set -e

          APK="release/MBMS-V122-FINAL-TRANSFER-REPORT.apk"

          test -s "$APK"


          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify \
            --verbose \
            "$APK"


          unzip -t "$APK" >/dev/null


          sha256sum "$APK" \
            | tee release/SHA256.txt


          echo "APK SIGNATURE AND ZIP VERIFICATION PASSED."


