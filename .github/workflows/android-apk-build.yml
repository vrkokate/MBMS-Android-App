name: MBMS V131 FINAL - PRINT AUDIT HARDENED

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:

  build:
    name: Build Final MBMS APK
    runs-on: ubuntu-24.04

    steps:

      - name: Checkout repository
        uses: actions/checkout@v7


      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'


      - name: Setup Android SDK
        uses: android-actions/setup-android@v4


      - name: Install Android SDK 35
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"


      - name: Install Gradle 8.7
        shell: bash
        run: |
          set -e

          wget -q \
            https://services.gradle.org/distributions/gradle-8.7-bin.zip

          mkdir -p "$HOME/gradle"

          unzip -q \
            gradle-8.7-bin.zip \
            -d "$HOME/gradle"

          echo "$HOME/gradle/gradle-8.7/bin" >> "$GITHUB_PATH"

          "$HOME/gradle/gradle-8.7/bin/gradle" --version


      - name: Verify Java and Gradle
        shell: bash
        run: |
          set -e

          java -version
          gradle --version


      - name: Find MBMS HTML
        shell: bash
        run: |
          set -e

          HTML_FILE=""

          for f in \
            "Measurement_Book_Management_System_FINAL_V120_TRANSFER_REPORT_FINAL.html" \
            "Measurement_Book_Management_System_FINAL_V118_PRINT_BACKUP_ANDROID.html" \
            "Measurement_Book_Management_System_FINAL_V115_MB_HISTORY_ONLY_DATE-6.html" \
            "Measurement_Book_Management_System_FINAL_V115_MB_HISTORY_ONLY_DATE.html" \
            "Measurement_Book_Management_System_FINAL_V115.html" \
            "V115.html" \
            "index.html"
          do
            if [ -f "$f" ]; then
              HTML_FILE="$f"
              break
            fi
          done

          if [ -z "$HTML_FILE" ]; then
            HTML_FILE=$(find . \
              -maxdepth 3 \
              -type f \
              -iname "*.html" \
              -not -path "./.git/*" \
              | head -n 1 || true)
          fi

          if [ -z "$HTML_FILE" ]; then
            echo "ERROR: MBMS HTML file not found."
            exit 1
          fi

          echo "HTML_FILE=$HTML_FILE" >> "$GITHUB_ENV"

          echo "Using HTML:"
          echo "$HTML_FILE"


      - name: Prepare Final MBMS HTML
        shell: bash
        run: |
          set -e

          mkdir -p mbms_work

          cp \
            "$HTML_FILE" \
            mbms_work/index.html

          test -s mbms_work/index.html

          echo "HTML size:"
          wc -c mbms_work/index.html


      - name: Apply ONLY Received JE List Correction
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path

          p = Path("mbms_work/index.html")

          text = p.read_text(encoding="utf-8")

          # ---------------------------------------------------------
          # ONLY REQUESTED CORRECTION
          #
          # RECEIVED -> JE -> JE Name
          #
          # Existing code was disabling the JE dropdown:
          #
          # if(isJE){loadTransferJEs();if(je){
          #     je.value=sourceName;
          #     je.disabled=true;
          # }}
          #
          # Now the complete JE list remains selectable.
          # ---------------------------------------------------------

          old1 = (
              "if(isJE){loadTransferJEs();"
              "if(je){je.value=sourceName;je.disabled=true;}}"
          )

          new1 = (
              "if(isJE){loadTransferJEs();"
              "if(je){je.value=sourceName;je.disabled=false;}}"
          )

          if old1 in text:

              text = text.replace(
                  old1,
                  new1,
                  1
              )

              print(
                  "Correction 1 applied: "
                  "Received JE dropdown remains enabled."
              )

          # ---------------------------------------------------------
          # Second safety correction:
          # updateTransferMode() also disabled the JE dropdown.
          # ---------------------------------------------------------

          old2 = "if(isJE&&je)je.disabled=true;"

          new2 = "if(isJE&&je)je.disabled=false;"

          if old2 in text:

              text = text.replace(
                  old2,
                  new2,
                  1
              )

              print(
                  "Correction 2 applied: "
                  "Received JE dropdown remains enabled."
              )

          # ---------------------------------------------------------
          # DO NOT modify any other functionality.
          # ---------------------------------------------------------

          p.write_text(
              text,
              encoding="utf-8"
          )

          print("ONLY JE LIST CORRECTION COMPLETED.")
          print("Final HTML size:")
          print(p.stat().st_size)

          PY


      - name: Verify Requested Correction
        shell: bash
        run: |
          set -e

          HTML="mbms_work/index.html"

          test -s "$HTML"

          grep -q \
            "loadTransferJEs()" \
            "$HTML"

          grep -q \
            "transferFromJEName" \
            "$HTML"

          grep -q \
            "je.disabled=false" \
            "$HTML"

          grep -q \
            "if(isJE&&je)je.disabled=false;" \
            "$HTML"

          echo "RECEIVED JE FULL LIST CORRECTION VERIFIED."


      - name: Verify MBMS Core Functions
        shell: bash
        run: |
          set -e

          HTML="mbms_work/index.html"

          grep -q \
            "mbmsSettingsSnapshot" \
            "$HTML"

          grep -q \
            "downloadSettingsBackup" \
            "$HTML"

          grep -q \
            "restoreSettingsBackup" \
            "$HTML"

          grep -q \
            "generateTransferReport" \
            "$HTML"

          grep -q \
            "saveTransferMB" \
            "$HTML"

          grep -q \
            "getTransferHistory" \
            "$HTML"

          echo "MBMS CORE FUNCTIONS VERIFIED."

      - name: Apply ONLY MB Summary Relationship and Detail Fix
        shell: bash
        run: |
          set -Eeuo pipefail

          # IMPORTANT: Keep the patch as plain JavaScript.
          # Do NOT use Base64 here; malformed Base64 was the cause of
          # the previous "Incorrect padding" build failure.
          cat > /tmp/mbms_summary_patch.js <<'PATCH_JS'
          /* V128 - ONLY M.B. SUMMARY LINKED DRILL-DOWN FIX */
          (function(){
            'use strict';

            const TYPE_LABELS={
              MB:'M.B.',
              JE:'Junior Engineer',
              WORK:'कामाचे नाव',
              CONTRACTOR:'Contractor / Agency',
              BILL:'Bill',
              TRANSFER:'Transfer / History'
            };

            const DETAIL_ALL='__ALL_DETAIL__';
            const MB_SMALL='__SMALL_MB__';
            const MB_LARGE='__LARGE_MB__';
            const MB_PREFIX='__MBNO__::';

            function A(v){return Array.isArray(v)?v:[];}
            function S(v){return v==null?'':String(v).trim();}
            function N(v){try{return hrNorm(v)}catch(e){return S(v).toLowerCase().replace(/\s+/g,' ');}}
            function E(v){try{return escapeHtml(S(v))}catch(e){return S(v).replace(/[&<>"']/g,function(c){return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]})}}
            function D(v){try{return hrDate(v||'')}catch(e){return S(v)||'-';}}
            function amount(v){try{return billAmountText(v)}catch(e){return '₹ '+(Number(v)||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});}}
            function uniq(a){return [...new Set(a.map(S).filter(Boolean))].sort((x,y)=>x.localeCompare(y,undefined,{numeric:true,sensitivity:'base'}));}
            function mbNo(x){return S(x?.number||x?.mbNumber||x?.mb);}
            function workName(x){return S(x?.name||x?.workName||x?.work);}
            function jeName(x){return S(x?.je||x?.jeName||x?.juniorEngineer);}
            function contractor(x){return S(x?.contractor||x?.agency||x?.contractorName||x?.agencyName);}
            function billType(x){return S(x?.billType||x?.type||x?.billName);}
            function billNo(x){return S(x?.billNo||x?.number||x?.billNumber);}
            function transferNo(x){return S(x?.number||x?.mb||x?.mbNumber);}
            function size(x){const z=N(x);if(z==='small'||z.includes('small')||z.includes('लहान'))return 'SMALL';if(z==='large'||z.includes('large')||z.includes('big')||z.includes('मोठ'))return 'LARGE';return '';}

            function data(){
              try{
                const d=homeRelData();
                return {mbs:A(d.mbs),jes:A(d.jes),works:A(d.works),assigns:A(d.assigns),transfers:A(d.transfers),bills:A(d.bills)};
              }catch(e){return {mbs:[],jes:[],works:[],assigns:[],transfers:[],bills:[]};}
            }

            function ctx(){
              const type=document.getElementById('homeRelType')?.value||'';
              const target=document.getElementById('homeRelTarget')?.value||'';
              const cv=document.getElementById('homeRelComponent')?.value||'';
              const parts=cv.split('::');
              return {type,target,ctype:parts[0]||'',cvalue:parts.slice(1).join('::'),detail:document.getElementById('homeRelDetail')?.value||'',billType:document.getElementById('homeRelBillType')?.value||''};
            }

            function inRange(v,from,to){try{return homeRelInRange(v,from,to)}catch(e){const k=S(v);return (!from||k>=from)&&(!to||k<=to)}}
            function dateFilter(d){
              const from=document.getElementById('homeRelFrom')?.value||'';
              const to=document.getElementById('homeRelTo')?.value||'';
              if(!from&&!to)return d;
              return {
                mbs:d.mbs.filter(x=>inRange(x.receivedDate||x.date||x.createdAt,from,to)),
                jes:d.jes,
                works:d.works.filter(x=>inRange(x.createdAt||x.date||x.workDate,from,to)),
                assigns:d.assigns.filter(x=>inRange(x.date||x.assignedDate||x.createdAt,from,to)),
                transfers:d.transfers.filter(x=>inRange(x.date||x.transferDate||x.savedAt,from,to)),
                bills:d.bills.filter(x=>inRange(x.billDate||x.date||x.savedAt,from,to))
              };
            }

            function linkedByMB(d,mbs){
              const set=new Set(mbs.map(N).filter(Boolean));
              return {
                mbs:d.mbs.filter(x=>set.has(N(mbNo(x)))),
                works:d.works.filter(x=>set.has(N(x?.mb))),
                assigns:d.assigns.filter(x=>set.has(N(x?.mb))),
                transfers:d.transfers.filter(x=>set.has(N(transferNo(x)))),
                bills:d.bills.filter(x=>set.has(N(x?.mb)))
              };
            }

            function baseFor(c,d){
              const all=c.target==='__ALL__';
              const t=N(c.target);
              let out={mbs:[],works:[],assigns:[],transfers:[],bills:[],jes:d.jes};

              if(c.type==='MB'){
                out.mbs=all?d.mbs:d.mbs.filter(x=>N(mbNo(x))===t);
                return Object.assign(out,linkedByMB(d,out.mbs.map(mbNo)));
              }
              if(c.type==='JE'){
                const w=all?d.works:d.works.filter(x=>N(jeName(x))===t);
                const b=all?d.bills:d.bills.filter(x=>N(jeName(x))===t);
                const a=all?d.assigns:d.assigns.filter(x=>N(jeName(x))===t);
                const mbs=uniq(w.map(x=>x?.mb).concat(b.map(x=>x?.mb),a.map(x=>x?.mb)));
                out={mbs:d.mbs.filter(x=>mbs.some(m=>N(mbNo(x))===N(m))),works:w,assigns:a,transfers:d.transfers.filter(x=>mbs.some(m=>N(transferNo(x))===N(m))),bills:b,jes:d.jes};
                return out;
              }
              if(c.type==='WORK'){
                const w=all?d.works:d.works.filter(x=>N(workName(x))===t);
                const names=new Set(w.map(x=>N(workName(x))));
                const b=all?d.bills:d.bills.filter(x=>names.has(N(workName(x)))||N(x?.work)===t);
                const mbs=uniq(w.map(x=>x?.mb).concat(b.map(x=>x?.mb)));
                return {mbs:d.mbs.filter(x=>mbs.some(m=>N(mbNo(x))===N(m))),works:w,assigns:d.assigns.filter(x=>mbs.some(m=>N(x?.mb)===N(m))),transfers:d.transfers.filter(x=>mbs.some(m=>N(transferNo(x))===N(m))),bills:b,jes:d.jes};
              }
              if(c.type==='CONTRACTOR'){
                const w=all?d.works:d.works.filter(x=>N(contractor(x))===t);
                const b=all?d.bills:d.bills.filter(x=>N(contractor(x))===t);
                const a=all?d.assigns:d.assigns.filter(x=>N(contractor(x))===t);
                const mbs=uniq(w.map(x=>x?.mb).concat(b.map(x=>x?.mb),a.map(x=>x?.mb)));
                return {mbs:d.mbs.filter(x=>mbs.some(m=>N(mbNo(x))===N(m))),works:w,assigns:a,transfers:d.transfers.filter(x=>mbs.some(m=>N(transferNo(x))===N(m))),bills:b,jes:d.jes};
              }
              if(c.type==='BILL'){
                const b=all?d.bills:d.bills.filter(x=>N(billNo(x))===t||N(billType(x))===t);
                const mbs=uniq(b.map(x=>x?.mb));
                return {mbs:d.mbs.filter(x=>mbs.some(m=>N(mbNo(x))===N(m))),works:d.works.filter(x=>mbs.some(m=>N(x?.mb)===N(m))||b.some(bb=>N(workName(bb))===N(workName(x)))),assigns:d.assigns.filter(x=>mbs.some(m=>N(x?.mb)===N(m))),transfers:d.transfers.filter(x=>mbs.some(m=>N(transferNo(x))===N(m))),bills:b,jes:d.jes};
              }
              if(c.type==='TRANSFER'){
                const tr=all?d.transfers:d.transfers.filter(x=>N(transferNo(x))===t);
                const mbs=uniq(tr.map(transferNo));
                return {mbs:d.mbs.filter(x=>mbs.some(m=>N(mbNo(x))===N(m))),works:d.works.filter(x=>mbs.some(m=>N(x?.mb)===N(m))),assigns:d.assigns.filter(x=>mbs.some(m=>N(x?.mb)===N(m))),transfers:tr,bills:d.bills.filter(x=>mbs.some(m=>N(x?.mb)===N(m))),jes:d.jes};
              }
              return out;
            }

            function applyComponentFilter(c,b){
              const detail=c.detail;
              if(c.ctype==='ALL'||!c.ctype)return b;
              if(c.ctype==='MB'){
                let m=b.mbs;
                if(detail===MB_SMALL)m=m.filter(x=>size(x?.size)==='SMALL');
                else if(detail===MB_LARGE)m=m.filter(x=>size(x?.size)==='LARGE');
                else if(detail.startsWith(MB_PREFIX))m=m.filter(x=>N(mbNo(x))===N(detail.slice(MB_PREFIX.length)));
                return linkedByMB(Object.assign({},b,{mbs:b.mbs}),m.map(mbNo));
              }
              if(c.ctype==='WORK'&&detail&&detail!==DETAIL_ALL){
                const w=b.works.filter(x=>N(workName(x))===N(detail));
                const names=new Set(w.map(x=>N(workName(x))));
                return {mbs:b.mbs.filter(x=>w.some(y=>N(y?.mb)===N(mbNo(x)))),works:w,assigns:b.assigns.filter(x=>w.some(y=>N(y?.mb)===N(x?.mb))),transfers:b.transfers.filter(x=>w.some(y=>N(y?.mb)===N(transferNo(x)))),bills:b.bills.filter(x=>names.has(N(workName(x)))),jes:b.jes};
              }
              if(c.ctype==='JE'&&detail&&detail!==DETAIL_ALL){
                const w=b.works.filter(x=>N(jeName(x))===N(detail));
                const bills=b.bills.filter(x=>N(jeName(x))===N(detail));
                const nums=uniq(w.map(x=>x?.mb).concat(bills.map(x=>x?.mb)));
                return {mbs:b.mbs.filter(x=>nums.some(m=>N(mbNo(x))===N(m))),works:w,assigns:b.assigns.filter(x=>nums.some(m=>N(x?.mb)===N(m))),transfers:b.transfers.filter(x=>nums.some(m=>N(transferNo(x))===N(m))),bills,jes:b.jes};
              }
              if(c.ctype==='CONTRACTOR'&&detail&&detail!==DETAIL_ALL){
                const w=b.works.filter(x=>N(contractor(x))===N(detail));
                const bills=b.bills.filter(x=>N(contractor(x))===N(detail));
                const nums=uniq(w.map(x=>x?.mb).concat(bills.map(x=>x?.mb)));
                return {mbs:b.mbs.filter(x=>nums.some(m=>N(mbNo(x))===N(m))),works:w,assigns:b.assigns.filter(x=>nums.some(m=>N(x?.mb)===N(m))),transfers:b.transfers.filter(x=>nums.some(m=>N(transferNo(x))===N(m))),bills,jes:b.jes};
              }
              if(c.ctype==='BILL'&&detail&&detail!==DETAIL_ALL){
                const bills=b.bills.filter(x=>N(billType(x))===N(detail)||N(billNo(x))===N(detail));
                const nums=uniq(bills.map(x=>x?.mb));
                return {mbs:b.mbs.filter(x=>nums.some(m=>N(mbNo(x))===N(m))),works:b.works.filter(x=>nums.some(m=>N(x?.mb)===N(m))||bills.some(bb=>N(workName(bb))===N(workName(x)))),assigns:b.assigns.filter(x=>nums.some(m=>N(x?.mb)===N(m))),transfers:b.transfers.filter(x=>nums.some(m=>N(transferNo(x))===N(m))),bills,jes:b.jes};
              }
              return b;
            }

            function current(){return applyComponentFilter(ctx(),dateFilter(baseFor(ctx(),data())));}

            function relatedOptions(c,d){
              const b=baseFor(c,d);
              const o=[];
              if(c.ctype==='MB'){
                o.push([DETAIL_ALL,'सर्व M.B.'],[MB_SMALL,'Small M.B.'],[MB_LARGE,'Big M.B.']);
                uniq(b.mbs.map(mbNo)).forEach(x=>o.push([MB_PREFIX+x,'M.B. क्रमांक '+x]));
              }else if(c.ctype==='WORK'){
                o.push([DETAIL_ALL,'सर्व कामे']);uniq(b.works.map(workName)).forEach(x=>o.push([x,x]));
              }else if(c.ctype==='JE'){
                o.push([DETAIL_ALL,'सर्व JE']);uniq(b.works.map(jeName).concat(b.bills.map(jeName),b.assigns.map(jeName))).forEach(x=>o.push([x,x]));
              }else if(c.ctype==='CONTRACTOR'){
                o.push([DETAIL_ALL,'सर्व Contractor / Agency']);uniq(b.works.map(contractor).concat(b.bills.map(contractor),b.assigns.map(contractor))).forEach(x=>o.push([x,x]));
              }else if(c.ctype==='BILL'){
                o.push([DETAIL_ALL,'सर्व Bill']);uniq(b.bills.map(billType).concat(b.bills.map(billNo))).forEach(x=>o.push([x,x]));
              }else if(c.ctype==='TRANSFER'){
                o.push([DETAIL_ALL,'सर्व Transfer / History']);uniq(b.transfers.map(transferNo)).forEach(x=>o.push([x,'M.B. '+x+' — Transfer History']));
              }
              return o;
            }

            function componentOptions(c){
              const map={
                MB:[['ALL','सर्व माहिती'],['WORK','कामाचे नाव'],['JE','JE चे नाव'],['CONTRACTOR','Contractor / Agency'],['BILL','Bill'],['TRANSFER','Transfer / History']],
                JE:[['ALL','सर्व माहिती'],['WORK','कामाचे नाव'],['MB','M.B.'],['CONTRACTOR','Contractor / Agency'],['BILL','Bill'],['TRANSFER','Transfer / History']],
                WORK:[['ALL','सर्व माहिती'],['JE','JE चे नाव'],['MB','M.B.'],['CONTRACTOR','Contractor / Agency'],['BILL','Bill'],['TRANSFER','Transfer / History']],
                CONTRACTOR:[['ALL','सर्व माहिती'],['WORK','कामाचे नाव'],['JE','JE चे नाव'],['MB','M.B.'],['BILL','Bill'],['TRANSFER','Transfer / History']],
                BILL:[['ALL','सर्व माहिती'],['MB','M.B.'],['WORK','कामाचे नाव'],['JE','JE चे नाव'],['CONTRACTOR','Contractor / Agency'],['TRANSFER','Transfer / History']],
                TRANSFER:[['ALL','सर्व माहिती'],['MB','M.B.'],['WORK','कामाचे नाव'],['JE','JE चे नाव'],['CONTRACTOR','Contractor / Agency'],['BILL','Bill']]
              };
              return map[c.type]||[];
            }

            function renderType(){
              const type=document.getElementById('homeRelType');if(!type)return;
              type.innerHTML='<option value="">संबंधित प्रकार निवडा</option>'+Object.keys(TYPE_LABELS).map(k=>`<option value="${k}">${E(TYPE_LABELS[k])}</option>`).join('');
              type.disabled=false;
            }

            function renderTargets(){
              const c=ctx(),sel=document.getElementById('homeRelTarget');if(!sel)return;
              if(typeof homeRelRangeValid==='function'&&!homeRelRangeValid()){
                sel.innerHTML='<option value="">दिनांक कालावधी निवडा</option>';sel.disabled=true;return;
              }
              const d=dateFilter(data());
              const arrays={
                MB:uniq(d.mbs.map(mbNo).concat(d.works.map(x=>x?.mb),d.bills.map(x=>x?.mb),d.assigns.map(x=>x?.mb),d.transfers.map(transferNo))),
                JE:uniq(d.jes.map(S).concat(d.works.map(jeName),d.bills.map(jeName),d.assigns.map(jeName))),
                WORK:uniq(d.works.map(workName).concat(d.bills.map(workName))),
                CONTRACTOR:uniq(d.works.map(contractor).concat(d.assigns.map(contractor),d.bills.map(contractor))),
                BILL:uniq(d.bills.map(billNo).concat(d.bills.map(billType))),
                TRANSFER:uniq(d.transfers.map(transferNo))
              };
              const list=arrays[c.type]||[];
              sel.innerHTML='<option value="__ALL__">'+E(TYPE_LABELS[c.type]||'सर्व')+' — सर्व</option>'+list.map(x=>`<option value="${E(x)}">${E(x)}</option>`).join('');
              sel.disabled=false;
              sel.value='__ALL__';
            }

            function renderComponents(){
              const c=ctx(),sel=document.getElementById('homeRelComponent'),detail=document.getElementById('homeRelDetail');if(!sel)return;
              const opts=componentOptions(c);
              sel.innerHTML='<option value="">संबंधित प्रकार निवडा</option>'+opts.map(x=>`<option value="${x[0]}::${x[0]}">${E(x[1])}</option>`).join('');
              sel.disabled=!c.target||!c.type;
              if(detail){detail.style.display='none';detail.innerHTML='<option value="">तपशील निवडा</option>';detail.value='';}
              const bs=document.getElementById('homeRelBillType');if(bs){bs.style.display='none';bs.value='';}
            }

            function renderDetails(){
              const c=ctx(),sel=document.getElementById('homeRelDetail');if(!sel)return;
              if(!c.ctype||c.ctype==='ALL'){sel.style.display='none';sel.innerHTML='<option value="'+DETAIL_ALL+'">सर्व माहिती</option>';sel.value=DETAIL_ALL;renderResult();return;}
              const d=dateFilter(data()),opts=relatedOptions(c,d);
              sel.innerHTML='<option value="">तपशील निवडा</option>'+opts.map(x=>`<option value="${E(x[0])}">${E(x[1])}</option>`).join('');
              sel.style.display=opts.length?'block':'none';sel.disabled=false;sel.value='';
              renderResult();
            }

            function section(title,rows){return `<div class="rel-section"><div class="rel-section-title">${E(title)}</div>${rows.map(r=>`<div class="rel-line"><b>${E(r[0])}:</b> ${E(r[1]===undefined||r[1]===''?'-':r[1])}</div>`).join('')}</div>`;}
            function listSection(title,items,fn){if(!items.length)return section(title,[['नोंद','उपलब्ध नाही']]);return `<div class="rel-section"><div class="rel-section-title">${E(title)} (${items.length})</div>${items.map((x,i)=>`<div style="border-top:1px solid #e8eef2;padding:7px 0">${fn(x,i)}</div>`).join('')}</div>`;}

            function reportHTML(){
              const c=ctx(),b=current(), title=(TYPE_LABELS[c.type]||'संबंधित')+' → '+(c.target==='__ALL__'?'सर्व':c.target);
              let h=`<div class="rel-head">${E(title)}</div>`;
              h+=section('सारांश',[["M.B.",b.mbs.length],["कामे",b.works.length],["Contractor / Agency",uniq(b.works.map(contractor).concat(b.bills.map(contractor),b.assigns.map(contractor))).length],["Bills",b.bills.length],["Transfer / History",b.transfers.length]]);
              h+=listSection('M.B. ची संपूर्ण माहिती',b.mbs,(m,i)=>[section('M.B. '+mbNo(m),[["M.B. क्रमांक",mbNo(m)],["Size",m.size||'-'],["Status",m.status||'-'],["प्राप्त दिनांक",D(m.receivedDate||m.date||m.createdAt)],["सध्या कुणाकडे",(()=>{try{return mbSummaryCurrentHolder(mbNo(m)).name||'-'}catch(e){return '-'}})()]])].join(''));
              h+=listSection('कामांची संपूर्ण माहिती',b.works,(w,i)=>`<b>${i+1}) ${E(workName(w)||'-')}</b>${section('काम',[["Work Name",workName(w)],['M.B.',w.mb||'-'],['JE',jeName(w)||'-'],['Contractor / Agency',contractor(w)||'-']])}`);
              h+=listSection('Contractor / Agency माहिती',uniq(b.works.map(contractor).concat(b.bills.map(contractor),b.assigns.map(contractor))).map(x=>({name:x})),(c0,i)=>{const co=c0.name;const ww=b.works.filter(x=>N(contractor(x))===N(co));const bb=b.bills.filter(x=>N(contractor(x))===N(co));return section(co,[["कामे",ww.length],["Bills",bb.length],["M.B.",uniq(ww.map(x=>x.mb).concat(bb.map(x=>x.mb))).join(', ')||'-']])});
              h+=listSection('Bill ची संपूर्ण माहिती',b.bills,(x,i)=>section((i+1)+') '+(billType(x)||'Bill'),[["Bill प्रकार",billType(x)||'-'],["Bill क्रमांक",billNo(x)||'-'],["Bill दिनांक",D(x.billDate||x.date||x.savedAt)],["M.B.",x.mb||'-'],["काम",workName(x)||'-'],["JE",jeName(x)||'-'],["Contractor / Agency",contractor(x)||'-'],["रक्कम",amount(x.amount)],["Payment Status",x.paymentStatus||'-']]));
              h+=listSection('Transfer / History',b.transfers,(x,i)=>section((i+1)+') M.B. '+(transferNo(x)||'-'),[["M.B.",transferNo(x)||'-'],["दिनांक",D(x.date||x.transferDate||x.savedAt)],["कोणाकडे",x.receiverName||x.receiver||x.to||x.name||'-'],["काम",x.workName||x.work||'-'],["JE",jeName(x)||'-'],["Contractor / Agency",contractor(x)||'-']]));
              return h;
            }

            function renderResult(){
              const box=document.getElementById('homeRelResult');if(!box)return;
              const c=ctx();
              if(!c.type){box.innerHTML='<div class="rel-empty">संबंधित प्रकार निवडा.</div>';return;}
              if(!c.target){box.innerHTML='<div class="rel-empty">मुख्य नोंद निवडा.</div>';return;}
              if(!c.ctype){box.innerHTML='<div class="rel-empty">संबंधित प्रकार निवडा.</div>';return;}
              if(c.ctype!=='ALL'&&!c.detail){box.innerHTML='<div class="rel-empty">पुढील तपशील निवडा.</div>';return;}
              box.innerHTML=reportHTML();
            }

            function printReport(){
              const c=ctx();
              if(!c.type||!c.target||!c.ctype||(c.ctype!=='ALL'&&!c.detail)){alert('कृपया Related Type → मुख्य नोंद → संबंधित प्रकार → तपशील पूर्ण निवडा.');return;}
              const pa=document.getElementById('printArea');if(!pa){window.print();return;}
              pa.innerHTML=`<div class="a4-page"><div class="a4-header"><div class="dept">सार्वजनिक बांधकाम विभाग</div><div class="system">मोजमाप पुस्तिका नियंत्रण प्रणाली</div><div class="report-title">M.B. SUMMARY — LINKED REPORT</div></div><div class="a4-meta"><span><b>निवड :</b> ${E((TYPE_LABELS[c.type]||'')+' → '+(c.target==='__ALL__'?'सर्व':c.target))}</span><span><b>कालावधी :</b> ${E(D(document.getElementById('homeRelFrom')?.value))} ते ${E(D(document.getElementById('homeRelTo')?.value))}</span></div>${reportHTML()}<div class="a4-footer">Created By : विठ्ठल कोकाटे पाटील</div></div>`;
              const old=document.title;document.title='MBMS M.B. Summary Linked Report';setTimeout(()=>window.print(),80);setTimeout(()=>document.title=old,1200);
            }

            function bind(){
              const type=document.getElementById('homeRelType'),target=document.getElementById('homeRelTarget'),comp=document.getElementById('homeRelComponent'),detail=document.getElementById('homeRelDetail'),from=document.getElementById('homeRelFrom'),to=document.getElementById('homeRelTo'),btn=document.querySelector('button[onclick="printHomeRelationshipReport()"]');
              if(!type||!target||!comp||!detail)return false;
