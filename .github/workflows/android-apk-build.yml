name: MBMS Final APK - Transfer Report Final

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:

  build:
    name: Build Final MBMS APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'


      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      - name: Install Android SDK 35
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"


      - name: Install Gradle 8.7
        shell: bash
        run: |
          set -e

          wget -q \
            https://services.gradle.org/distributions/gradle-8.7-bin.zip

          mkdir -p "$HOME/gradle"

          unzip -q \
            gradle-8.7-bin.zip \
            -d "$HOME/gradle"

          echo "$HOME/gradle/gradle-8.7/bin" >> "$GITHUB_PATH"

          "$HOME/gradle/gradle-8.7/bin/gradle" --version


      - name: Verify Java
        shell: bash
        run: |
          set -e

          java -version
          gradle --version


      - name: Find MBMS HTML
        shell: bash
        run: |
          set -e

          HTML_FILE=""

          for f in \
            "Measurement_Book_Management_System_FINAL_V120_TRANSFER_REPORT_FINAL.html" \
            "Measurement_Book_Management_System_FINAL_V118_PRINT_BACKUP_ANDROID.html" \
            "Measurement_Book_Management_System_FINAL_V115_MB_HISTORY_ONLY_DATE-6.html" \
            "Measurement_Book_Management_System_FINAL_V115_MB_HISTORY_ONLY_DATE.html" \
            "Measurement_Book_Management_System_FINAL_V115.html" \
            "V115.html" \
            "index.html"
          do
            if [ -f "$f" ]; then
              HTML_FILE="$f"
              break
            fi
          done

          if [ -z "$HTML_FILE" ]; then
            HTML_FILE=$(find . \
              -maxdepth 3 \
              -type f \
              -iname "*.html" \
              -not -path "./.git/*" \
              | head -n 1 || true)
          fi

          if [ -z "$HTML_FILE" ]; then
            echo "ERROR: MBMS HTML file not found."
            exit 1
          fi

          echo "HTML_FILE=$HTML_FILE" >> "$GITHUB_ENV"

          echo "Using HTML:"
          echo "$HTML_FILE"


      - name: Prepare Final MBMS HTML
        shell: bash
        run: |
          set -e

          mkdir -p mbms_work

          cp \
            "$HTML_FILE" \
            mbms_work/index.html

          test -s mbms_work/index.html

          echo "HTML size:"
          wc -c mbms_work/index.html


      - name: Apply Final Transfer Report
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path

          p = Path("mbms_work/index.html")

          text = p.read_text(encoding="utf-8")

          # =========================================================
          # FINAL TRANSFER REPORT PATCH
          #
          # IMPORTANT:
          # We do NOT search/replace the old generateTransferReport().
          # We append a new global function at the end of the HTML.
          # This safely overrides the original function.
          # =========================================================

          patch = r'''
          <style id="mbms-final-transfer-report-css">

          .transfer-report-table{
            width:100%;
            table-layout:fixed;
          }

          .transfer-report-table th:nth-child(1),
          .transfer-report-table td:nth-child(1){
            width:14mm;
          }

          .transfer-report-table th:nth-child(2),
          .transfer-report-table td:nth-child(2){
            width:55mm;
          }

          .transfer-report-table th:nth-child(3),
          .transfer-report-table td:nth-child(3){
            width:35mm;
          }

          .transfer-report-table th:nth-child(4),
          .transfer-report-table td:nth-child(4){
            width:74mm;
          }

          .transfer-report-table th,
          .transfer-report-table td{
            font-size:10pt;
          }

          .transfer-report-meta{
            display:flex;
            gap:8mm;
            align-items:flex-start;
            justify-content:space-between;
            font-size:10pt;
            margin:5mm 0;
          }

          .transfer-report-meta > span{
            flex:1;
          }

          .transfer-report-meta .transfer-current-holder{
            text-align:right;
          }

          .transfer-report-page .a4-footer{
            font-size:9pt;
          }

          </style>

          <script id="mbms-final-transfer-report-script">

          function transferReportPersonName(x){

            const type = String(
              x && (
                x.transferPartyType ||
                x.receiver ||
                ""
              )
            ).trim();

            let name = String(
              x && (
                x.receiverName ||
                x.receivedFromName ||
                x.receiver ||
                ""
              )
            ).trim();

            if(!name){
              return "-";
            }

            if(
              (
                type === "जेई" ||
                type.toUpperCase() === "JE" ||
                (
                  typeof norm === "function" &&
                  norm(type).includes("ज्युनियर")
                )
              ) &&
              !/^(श्री\.?|श्रीमती\.?|कु\.?)/.test(name)
            ){

              name = "श्री " + name;

            }

            return name;
          }


          function transferReportCurrentHolder(number){

            try{

              if(
                typeof mbSummaryCurrentHolder === "function"
              ){

                const h =
                  mbSummaryCurrentHolder(number);

                if(h && h.name){

                  return h.name;

                }
              }

            }catch(e){}


            try{

              const history =
                typeof getTransferHistory === "function"
                ?
                getTransferHistory().filter(
                  function(x){

                    const a =
                      x.number ||
                      x.mbNumber ||
                      x.mb ||
                      "";

                    if(typeof norm === "function"){
                      return norm(a) === norm(number);
                    }

                    return String(a) === String(number);

                  }
                )
                :
                [];


              if(!history.length){

                return "उपलब्ध M.B.";

              }


              const last =
                history[history.length - 1];


              if(
                String(
                  last.transferType || ""
                ).toUpperCase() === "GIVEN"
              ){

                let name =
                  String(
                    last.receiverName ||
                    last.receiver ||
                    ""
                  ).trim();


                if(!name){

                  name =
                    "संबंधित व्यक्ती / कार्यालय";

                }


                const type =
                  String(
                    last.transferPartyType ||
                    last.receiver ||
                    ""
                  ).trim();


                if(
                  (
                    type === "जेई" ||
                    type.toUpperCase() === "JE" ||
                    (
                      typeof norm === "function" &&
                      norm(type).includes("ज्युनियर")
                    )
                  ) &&
                  !/^(श्री\.?|श्रीमती\.?|कु\.?)/.test(name)
                ){

                  name = "श्री " + name;

                }


                return name;

              }


              if(
                String(
                  last.transferType || ""
                ).toUpperCase() === "RECEIVED"
              ){

                return "विभागीय कार्यालयात";

              }


              return "उपलब्ध M.B.";

            }catch(e){

              return "उपलब्ध M.B.";

            }
          }


          /*
           * FINAL OVERRIDE
           * This replaces the old generateTransferReport()
           * without editing/deleting the original function.
           */

          window.generateTransferReport = function(){

            try{

              const list =
                typeof getTransferHistory === "function"
                ?
                getTransferHistory()
                :
                [];


              if(!list.length){

                alert(
                  "Transfer List मध्ये कोणतीही नोंद नाही."
                );

                return;

              }


              let range = {
                valid:true
              };


              if(
                typeof reportDateRange === "function"
              ){

                range =
                  reportDateRange(
                    "transfer-report"
                  );

              }


              if(
                range &&
                range.valid === false
              ){

                if(
                  typeof reportDateError === "function"
                ){

                  alert(
                    reportDateError(range)
                  );

                }else{

                  alert(
                    "दिनांक कालावधी चुकीचा आहे."
                  );

                }

                return;

              }


              const select =
                document.getElementById(
                  "transferReportSelect"
                );


              if(!select){

                alert(
                  "Transfer Report निवड यादी सापडली नाही."
                );

                return;

              }


              const selected =
                select.value;


              if(selected === ""){

                alert(
                  "कृपया Report निवडा."
                );

                return;

              }


              let data = [];


              if(selected === "ALL"){

                data =
                  list.filter(
                    function(x){

                      if(
                        typeof reportDateAllowed !== "function"
                      ){

                        return true;

                      }

                      return reportDateAllowed(
                        typeof transferReportDate === "function"
                        ?
                        transferReportDate(x)
                        :
                        (
                          x.savedAt ||
                          ""
                        ),
                        range
                      );

                    }
                  );

              }else{

                const index =
                  Number(selected);

                if(
                  Number.isNaN(index) ||
                  !list[index]
                ){

                  alert(
                    "निवडलेली नोंद उपलब्ध नाही."
                  );

                  return;

                }


                if(
                  typeof reportDateAllowed === "function" &&
                  typeof transferReportDate === "function" &&
                  !reportDateAllowed(
                    transferReportDate(
                      list[index]
                    ),
                    range
                  )
                ){

                  alert(
                    "निवडलेली नोंद या दिनांक कालावधीत नाही."
                  );

                  return;

                }


                data = [
                  list[index]
                ];

              }


              if(!data.length){

                alert(
                  "या दिनांक कालावधीत Transfer नोंद उपलब्ध नाही."
                );

                return;

              }


              function esc(value){

                if(
                  typeof escapeHtml === "function"
                ){

                  return escapeHtml(
                    value == null
                    ?
                    ""
                    :
                    value
                  );

                }

                return String(
                  value == null
                  ?
                  ""
                  :
                  value
                )
                .replace(
                  /&/g,
                  "&amp;"
                )
                .replace(
                  /</g,
                  "&lt;"
                )
                .replace(
                  />/g,
                  "&gt;"
                )
                .replace(
                  /"/g,
                  "&quot;"
                )
                .replace(
                  /'/g,
                  "&#39;"
                );

              }


              const rows =
                data.map(
                  function(x,i){

                    return `
                      <tr class="a4-entry">

                        <td>${i + 1}</td>

                        <td>
                          ${esc(
                            x.number || ""
                          )}
                        </td>

                        <td>
                          ${esc(
                            x.size || ""
                          )}
                        </td>

                        <td>
                          ${esc(
                            transferReportPersonName(x)
                          )}
                        </td>

                      </tr>
                    `;

                  }
                ).join("");


              const reportText =
                selected === "ALL"
                ?
                "सर्व Transfer नोंदी"
                :
                "MB " +
                esc(
                  data[0].number || ""
                );


              const holder =
                selected === "ALL"
                ?
                "सध्या संबंधित M.B. संबंधित व्यक्ती / कार्यालयाकडे आहेत."
                :
                (
                  "सध्या ही M.B. " +
                  esc(
                    transferReportCurrentHolder(
                      data[0].number || ""
                    )
                  ) +
                  " यांच्याकडे आहे."
                );


              const printArea =
                document.getElementById(
                  "printArea"
                );


              if(!printArea){

                alert(
                  "Print Area सापडला नाही."
                );

                return;

              }


              printArea.innerHTML = `

                <div class="a4-page transfer-report-page">

                  <div class="a4-header">

                    <div class="dept">
                      सार्वजनिक बांधकाम विभाग
                    </div>

                    <div class="system">
                      मोजमाप पुस्तिका नियंत्रण प्रणाली
                    </div>

                    <div class="report-title">
                      M.B. TRANSFER REPORT
                    </div>

                  </div>


                  <div class="a4-meta transfer-report-meta">

                    <span>
                      <b>Report :</b>
                      ${reportText}
                    </span>

                    <span class="transfer-current-holder">
                      <b>
                        ${holder}
                      </b>
                    </span>

                  </div>


                  <table class="a4-table transfer-report-table">

                    <thead>

                      <tr>

                        <th>
                          अ.क्र.
                        </th>

                        <th>
                          MB क्रमांक
                        </th>

                        <th>
                          आकार
                        </th>

                        <th>
                          कुणाला दिली
                        </th>

                      </tr>

                    </thead>


                    <tbody>

                      ${rows}

                    </tbody>

                  </table>


                  <div class="a4-footer">
                    Created By विठ्ठल कोकाटे पाटील 8446556141
                  </div>

                </div>

              `;


              if(
                typeof closeTransferReport === "function"
              ){

                closeTransferReport();

              }


              window.print();


            }catch(error){

              console.error(
                "Final Transfer Report Error:",
                error
              );

              alert(
                "Transfer Report तयार करताना त्रुटी आली."
              );

            }

          };

          </script>
          '''


          # ---------------------------------------------------------
          # Insert patch immediately before </body>
          # ---------------------------------------------------------

          marker = "</body>"

          if marker.lower() not in text.lower():

              text += patch

          else:

              pos = text.lower().rfind(
                  marker.lower()
              )

              text = (
                  text[:pos]
                  +
                  patch
                  +
                  "\n"
                  +
                  text[pos:]
              )


          p.write_text(
              text,
              encoding="utf-8"
          )


          # ---------------------------------------------------------
          # VALIDATION
          # ---------------------------------------------------------

          checks = [

              "mbms-final-transfer-report-css",

              "mbms-final-transfer-report-script",

              "window.generateTransferReport",

              "transferReportPersonName",

              "transferReportCurrentHolder",

              "MB क्रमांक",

              "कुणाला दिली",

              "Created By विठ्ठल कोकाटे पाटील 8446556141"

          ]


          for item in checks:

              if item not in text:

                  raise SystemExit(
                      "ERROR: Required final marker missing: "
                      + item
                  )


          print(
              "FINAL TRANSFER REPORT PATCH PASSED."
          )

          print(
              "The original generateTransferReport() was NOT modified."
          )

          print(
              "A final global override was appended successfully."
          )

          print(
              "Final HTML size:"
          )

          print(
              p.stat().st_size
          )

          PY


      - name: Verify Final MBMS HTML
        shell: bash
        run: |
          set -e

          HTML="mbms_work/index.html"

          test -s "$HTML"

          grep -q "<html" "$HTML"

          grep -q \
            "mbmsSettingsSnapshot" \
            "$HTML"

          grep -q \
            "downloadSettingsBackup" \
            "$HTML"

          grep -q \
            "restoreSettingsBackup" \
            "$HTML"

          grep -q \
            "window.generateTransferReport" \
            "$HTML"

          grep -q \
            "transferReportPersonName" \
            "$HTML"

          grep -q \
            "transferReportCurrentHolder" \
            "$HTML"

          grep -q \
            "MB क्रमांक" \
            "$HTML"

          grep -q \
            "कुणाला दिली" \
            "$HTML"

          grep -q \
            "Created By विठ्ठल कोकाटे पाटील 8446556141" \
            "$HTML"

          grep -q \
            "transfer-report-table" \
            "$HTML"

          echo "FINAL MBMS HTML VALIDATION PASSED."

          wc -c "$HTML"


      - name: Create Android project
        shell: bash
        run: |
          set -e

          rm -rf \
            mbms_android \
            release

          mkdir -p \
            mbms_android/app/src/main/assets \
            mbms_android/app/src/main/java/com/mbms/app \
            mbms_android/app/src/main/res/values \
            release

          cp \
            mbms_work/index.html \
            mbms_android/app/src/main/assets/index.html


          cat > mbms_android/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(
                  RepositoriesMode.FAIL_ON_PROJECT_REPOS
              )

              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "MBMSAndroid"

          include(":app")
          EOF


          cat > mbms_android/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF


          cat > mbms_android/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=false
          android.nonTransitiveRClass=true
          EOF


          cat > mbms_android/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {

              namespace 'com.mbms.app'

              compileSdk 35

              defaultConfig {

                  applicationId 'com.mbms.app'

                  minSdk 26

                  targetSdk 35

                  versionCode 122

                  versionName 'V122'
              }

              buildTypes {

                  debug {

                      minifyEnabled false

                      shrinkResources false
                  }

                  release {

                      minifyEnabled false

                      shrinkResources false
                  }
              }

              compileOptions {

                  sourceCompatibility JavaVersion.VERSION_17

                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF


          # NO XML declaration here.
          cat > mbms_android/app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">MBMS</string>
          </resources>
          EOF


          # NO XML declaration here.
          cat > mbms_android/app/src/main/res/values/styles.xml <<'EOF'
          <resources>

              <style
                  name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">

                  <item name="android:fontFamily">
                      sans
                  </item>

                  <item name="android:colorAccent">
                      #1976D2
                  </item>

                  <item name="android:navigationBarColor">
                      #06458E
                  </item>

              </style>

          </resources>
          EOF


          cat > mbms_android/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest
              xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission
                  android:name="android.permission.INTERNET" />

              <uses-permission
                  android:name="android.permission.WRITE_EXTERNAL_STORAGE"
                  android:maxSdkVersion="28" />

              <application
                  android:allowBackup="true"
                  android:usesCleartextTraffic="true"
                  android:label="@string/app_name"
                  android:theme="@style/AppTheme"
                  android:hardwareAccelerated="true"
                  android:resizeableActivity="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait"
                      android:configChanges="orientation|screenSize|keyboardHidden">

                      <intent-filter>

                          <action
                              android:name="android.intent.action.MAIN" />

                          <category
                              android:name="android.intent.category.LAUNCHER" />

                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF


          cat > mbms_android/app/proguard-rules.pro <<'EOF'
          # MBMS
          EOF


      - name: Create MainActivity.java
        shell: bash
        run: |
          set -e

          cat > mbms_android/app/src/main/java/com/mbms/app/MainActivity.java <<'EOF'
          package com.mbms.app;

          import android.app.Activity;
          import android.content.ContentValues;
          import android.content.Context;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Environment;
          import android.provider.MediaStore;
          import android.print.PrintAttributes;
          import android.print.PrintDocumentAdapter;
          import android.print.PrintManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Toast;

          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.OutputStream;
          import java.nio.charset.StandardCharsets;

          public class MainActivity extends Activity {

              private static final int REQUEST_FILE = 9102;

              private WebView webView;

              private ValueCallback<Uri[]> filePathCallback;


              @Override
              protected void onCreate(
                      Bundle savedInstanceState) {

                  super.onCreate(savedInstanceState);

                  webView =
                          new WebView(this);

                  setContentView(webView);


                  WebSettings settings =
                          webView.getSettings();

                  settings.setJavaScriptEnabled(true);

                  settings.setDomStorageEnabled(true);

                  settings.setDatabaseEnabled(true);

                  settings.setAllowFileAccess(true);

                  settings.setAllowContentAccess(true);

                  settings.setBuiltInZoomControls(false);

                  settings.setDisplayZoomControls(false);

                  settings.setSupportZoom(false);

                  settings.setLoadWithOverviewMode(false);

                  settings.setUseWideViewPort(false);

                  settings.setTextZoom(100);


                  webView.addJavascriptInterface(
                          new AndroidBridge(),
                          "MBMSAndroid"
                  );


                  webView.setWebChromeClient(
                          new WebChromeClient() {

                              @Override
                              public boolean onShowFileChooser(
                                      WebView view,
                                      ValueCallback<Uri[]> callback,
                                      FileChooserParams params) {

                                  if(
                                      filePathCallback != null
                                  ) {

                                      filePathCallback
                                              .onReceiveValue(null);
                                  }


                                  filePathCallback =
                                          callback;


                                  try {

                                      Intent intent =
                                              new Intent(
                                                  Intent.ACTION_OPEN_DOCUMENT
                                              );


                                      intent.addCategory(
                                          Intent.CATEGORY_OPENABLE
                                      );


                                      intent.setType(
                                          "application/json"
                                      );


                                      startActivityForResult(
                                          intent,
                                          REQUEST_FILE
                                      );


                                      return true;


                                  } catch(Exception e) {

                                      filePathCallback =
                                              null;

                                      return false;
                                  }
                              }
                          }
                  );


                  webView.setWebViewClient(
                          new WebViewClient() {

                              @Override
                              public boolean
                              shouldOverrideUrlLoading(
                                      WebView view,
                                      WebResourceRequest request) {

                                  return false;
                              }


                              @Override
                              public void onPageFinished(
                                      WebView view,
                                      String url) {

                                  super.onPageFinished(
                                      view,
                                      url
                                  );

                                  installNativeBridge();
                              }
                          }
                  );


                  webView.loadUrl(
                      "file:///android_asset/index.html"
                  );
              }


              private void installNativeBridge() {

                  if(webView == null) {
                      return;
                  }


                  String js =
                          "(function(){"
                        + "try{"

                        + "window.print=function(){"
                        + "try{"
                        + "if(window.MBMSAndroid&&"
                        + "typeof window.MBMSAndroid.print"
                        + "==='function'){"
                        + "window.MBMSAndroid.print();"
                        + "return;"
                        + "}"
                        + "}catch(e){"
                        + "console.error(e);"
                        + "}"
                        + "};"


                        + "window.downloadSettingsBackup="
                        + "function(){"
                        + "try{"

                        + "var data="
                        + "JSON.stringify("
                        + "window.mbmsSettingsSnapshot(),"
                        + "null,2);"

                        + "var filename="
                        + "'MBMS_Backup_'"
                        + "+new Date()"
                        + ".toISOString()"
                        + ".slice(0,10)"
                        + "+'.json';"


                        + "if(window.MBMSAndroid&&"
                        + "typeof window.MBMSAndroid.saveBackup"
                        + "==='function'){"

                        + "window.MBMSAndroid.saveBackup("
                        + "data,filename);"

                        + "return;"
                        + "}"

                        + "}catch(e){"

                        + "alert("
                        + "'Backup Save मध्ये त्रुटी आली.'"
                        + ");"

                        + "}"
                        + "};"

                        + "}catch(e){"
                        + "console.error(e);"
                        + "}"
                        + "})();";


                  webView.evaluateJavascript(
                      js,
                      null
                  );
              }


              public class AndroidBridge {

                  @JavascriptInterface
                  public void print() {

                      runOnUiThread(
                          new Runnable() {

                              @Override
                              public void run() {

                                  try {

                                      PrintManager manager =
                                          (PrintManager)
                                          getSystemService(
                                              Context.PRINT_SERVICE
                                          );


                                      if(manager == null) {

                                          throw new Exception(
                                              "Print service unavailable"
                                          );
                                      }


                                      PrintDocumentAdapter adapter =
                                          webView
                                          .createPrintDocumentAdapter(
                                              "MBMS Report"
                                          );


                                      PrintAttributes attributes =
                                          new PrintAttributes.Builder()

                                          .setMediaSize(
                                              PrintAttributes.MediaSize.ISO_A4
                                          )

                                          .setMinMargins(
                                              PrintAttributes.Margins.NO_MARGINS
                                          )

                                          .build();


                                      manager.print(
                                          "MBMS Report",
                                          adapter,
                                          attributes
                                      );


                                  } catch(Exception e) {

                                      Toast.makeText(
                                          MainActivity.this,
                                          "Print सुरू करता आले नाही.",
                                          Toast.LENGTH_LONG
                                      ).show();
                                  }
                              }
                          }
                      );
                  }


                  @JavascriptInterface
                  public void saveBackup(
                          final String json,
                          final String filename) {

                      new Thread(
                          new Runnable() {

                              @Override
                              public void run() {

                                  boolean success =
                                          false;


                                  try {

                                      if(
                                          Build.VERSION.SDK_INT >= 29
                                      ) {

                                          ContentValues values =
                                              new ContentValues();


                                          values.put(
                                              MediaStore.Downloads.DISPLAY_NAME,
                                              filename
                                          );


                                          values.put(
                                              MediaStore.Downloads.MIME_TYPE,
                                              "application/json"
                                          );


                                          values.put(
                                              MediaStore.Downloads.RELATIVE_PATH,
                                              Environment.DIRECTORY_DOWNLOADS
                                          );


                                          values.put(
                                              MediaStore.Downloads.IS_PENDING,
                                              1
                                          );


                                          Uri uri =
                                              getContentResolver()
                                              .insert(
                                                  MediaStore.Downloads.EXTERNAL_CONTENT_URI,
                                                  values
                                              );


                                          if(uri == null) {

                                              throw new Exception(
                                                  "Unable to create backup"
                                              );
                                          }


                                          OutputStream output =
                                              getContentResolver()
                                              .openOutputStream(
                                                  uri
                                              );


                                          if(output == null) {

                                              throw new Exception(
                                                  "Unable to open backup"
                                              );
                                          }


                                          try {

                                              output.write(
                                                  json.getBytes(
                                                      StandardCharsets.UTF_8
                                                  )
                                              );

                                              output.flush();

                                          } finally {

                                              output.close();
                                          }


                                          ContentValues done =
                                              new ContentValues();


                                          done.put(
                                              MediaStore.Downloads.IS_PENDING,
                                              0
                                          );


                                          getContentResolver()
                                          .update(
                                              uri,
                                              done,
                                              null,
                                              null
                                          );


                                          success =
                                              true;


                                      } else {

                                          File directory =
                                              Environment
                                              .getExternalStoragePublicDirectory(
                                                  Environment
                                                  .DIRECTORY_DOWNLOADS
                                              );


                                          if(
                                              !directory.exists()
                                          ) {

                                              directory.mkdirs();
                                          }


                                          File file =
                                              new File(
                                                  directory,
                                                  filename
                                              );


                                          FileOutputStream output =
                                              new FileOutputStream(
                                                  file
                                              );


                                          try {

                                              output.write(
                                                  json.getBytes(
                                                      StandardCharsets.UTF_8
                                                  )
                                              );

                                              output.flush();

                                          } finally {

                                              output.close();
                                          }


                                          success =
                                              true;
                                      }


                                  } catch(Exception e) {

                                      e.printStackTrace();
                                  }


                                  final boolean result =
                                      success;


                                  runOnUiThread(
                                      new Runnable() {

                                          @Override
                                          public void run() {

                                              Toast.makeText(
                                                  MainActivity.this,

                                                  result
                                                  ?
                                                  "Backup Downloads मध्ये Save झाला."
                                                  :
                                                  "Backup Save मध्ये त्रुटी आली.",

                                                  Toast.LENGTH_LONG
                                              ).show();

                                          }
                                      }
                                  );
                              }
                          }
                      ).start();
                  }
              }


              @Override
              protected void onActivityResult(
                      int requestCode,
                      int resultCode,
                      Intent data) {

                  super.onActivityResult(
                      requestCode,
                      resultCode,
                      data
                  );


                  if(
                      requestCode != REQUEST_FILE
                  ) {

                      return;
                  }


                  if(
                      filePathCallback == null
                  ) {

                      return;
                  }


                  Uri[] results =
                          null;


                  if(
                      resultCode == RESULT_OK &&
                      data != null &&
                      data.getData() != null
                  ) {

                      results =
                          new Uri[]{
                              data.getData()
                          };
                  }


                  filePathCallback
                      .onReceiveValue(results);


                  filePathCallback =
                          null;
              }


              @Override
              public void onBackPressed() {

                  if(
                      webView != null &&
                      webView.canGoBack()
                  ) {

                      webView.goBack();

                  } else {

                      super.onBackPressed();
                  }
              }


              @Override
              protected void onDestroy() {

                  if(webView != null) {

                      webView.stopLoading();

                      webView.destroy();

                      webView =
                              null;
                  }


                  super.onDestroy();
              }
          }
          EOF


