name: MBMS V127 FINAL - M.B. Summary Linked Final - Stable

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Final MBMS APK
    runs-on: ubuntu-24.04

    steps:

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -e
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Install Gradle 8.7
        shell: bash
        run: |
          set -e
          wget -q \
            https://services.gradle.org/distributions/gradle-8.7-bin.zip
          mkdir -p "$HOME/gradle"
          unzip -q gradle-8.7-bin.zip -d "$HOME/gradle"
          echo "$HOME/gradle/gradle-8.7/bin" >> "$GITHUB_PATH"
          "$HOME/gradle/gradle-8.7/bin/gradle" --version

      - name: Verify Java and Gradle
        shell: bash
        run: |
          set -e
          java -version
          gradle --version

      - name: Find MBMS HTML
        shell: bash
        run: |
          set -e

          HTML_FILE=""

          for f in \
            "Measurement_Book_Management_System_FINAL_V120_TRANSFER_REPORT_FINAL.html" \
            "Measurement_Book_Management_System_FINAL_V118_PRINT_BACKUP_ANDROID.html" \
            "Measurement_Book_Management_System_FINAL_V115_MB_HISTORY_ONLY_DATE-6.html" \
            "Measurement_Book_Management_System_FINAL_V115_MB_HISTORY_ONLY_DATE.html" \
            "Measurement_Book_Management_System_FINAL_V115.html" \
            "V115.html" \
            "index.html"
          do
            if [ -f "$f" ]; then
              HTML_FILE="$f"
              break
            fi
          done

          if [ -z "$HTML_FILE" ]; then
            HTML_FILE=$(find . \
              -maxdepth 3 \
              -type f \
              -iname "*.html" \
              -not -path "./.git/*" \
              | head -n 1 || true)
          fi

          if [ -z "$HTML_FILE" ]; then
            echo "ERROR: MBMS HTML file not found."
            exit 1
          fi

          echo "HTML_FILE=$HTML_FILE" >> "$GITHUB_ENV"
          echo "Using HTML: $HTML_FILE"

      - name: Prepare Final MBMS HTML
        shell: bash
        run: |
          set -e

          mkdir -p mbms_work

          cp "$HTML_FILE" mbms_work/index.html

          test -s mbms_work/index.html

          echo "HTML size:"
          wc -c mbms_work/index.html

      - name: Apply ONLY Received JE List Correction
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path

          p = Path("mbms_work/index.html")
          text = p.read_text(encoding="utf-8")

          old1 = (
              "if(isJE){loadTransferJEs();"
              "if(je){je.value=sourceName;je.disabled=true;}}"
          )

          new1 = (
              "if(isJE){loadTransferJEs();"
              "if(je){je.value=sourceName;je.disabled=false;}}"
          )

          if old1 in text:
              text = text.replace(old1, new1, 1)
              print("Received JE dropdown remains enabled.")

          old2 = "if(isJE&&je)je.disabled=true;"
          new2 = "if(isJE&&je)je.disabled=false;"

          if old2 in text:
              text = text.replace(old2, new2, 1)
              print("Received JE secondary correction applied.")

          p.write_text(text, encoding="utf-8")

          print("ONLY RECEIVED -> JE CORRECTION COMPLETED.")
          PY

      - name: Verify Requested Correction
        shell: bash
        run: |
          set -e

          HTML="mbms_work/index.html"

          test -s "$HTML"

          grep -q "loadTransferJEs()" "$HTML"
          grep -q "transferFromJEName" "$HTML"
          grep -q "je.disabled=false" "$HTML"
          grep -q "if(isJE&&je)je.disabled=false;" "$HTML"

          echo "RECEIVED JE FULL LIST CORRECTION VERIFIED."

      - name: Verify MBMS Core Functions
        shell: bash
        run: |
          set -e

          HTML="mbms_work/index.html"

          grep -q "mbmsSettingsSnapshot" "$HTML"
          grep -q "downloadSettingsBackup" "$HTML"
          grep -q "restoreSettingsBackup" "$HTML"
          grep -q "generateTransferReport" "$HTML"
          grep -q "saveTransferMB" "$HTML"
          grep -q "getTransferHistory" "$HTML"

          echo "MBMS CORE FUNCTIONS VERIFIED."

      - name: Apply ONLY MB Summary Relationship and Detail Fix
        shell: bash
        run: |
          set -Eeuo pipefail

          cat > /tmp/mbms_summary_patch.js <<'PATCH_JS'
          /* V127 - ONLY HOME MB SUMMARY RELATIONSHIP REPORT FIX */
          (function(){
            'use strict';

            const ALL_DETAIL='__ALL_DETAIL__';
            const SMALL='__SMALL_MB__';
            const LARGE='__LARGE_MB__';
            const MBNO='__MBNO__::';

            function safeArray(v){
              return Array.isArray(v)?v:[];
            }

            function n(v){
              try{
                return hrNorm(v);
              }catch(e){
                try{
                  return norm(String(v??''));
                }catch(e2){
                  return String(v??'').trim().toLowerCase();
                }
              }
            }

            function s(v){
              return v==null?'':String(v);
            }

            function esc(v){
              try{
                return escapeHtml(v==null?'':String(v));
              }catch(e){
                return String(v??'');
              }
            }

            function date(v){
              try{
                return hrDate(v||'');
              }catch(e){
                try{
                  return billDateText(v||'')||'-';
                }catch(e2){
                  return v||'-';
                }
              }
            }

            function amount(v){
              try{
                return billAmountText(v);
              }catch(e){
                return '₹ 0.00';
              }
            }

            function uniqueSorted(values){
              return [...new Set(
                values
                  .map(v=>s(v).trim())
                  .filter(Boolean)
              )].sort(
                (a,b)=>a.localeCompare(
                  b,
                  undefined,
                  {
                    numeric:true,
                    sensitivity:'base'
                  }
                )
              );
            }

            function mbNo(m){
              return s(
                m?.number ||
                m?.mbNumber ||
                m?.mb ||
                ''
              ).trim();
            }

            function workName(w){
              return s(
                w?.name ||
                w?.work ||
                w?.workName ||
                ''
              ).trim();
            }

            function sizeKey(v){
              const x=n(v);

              if(
                x==='small' ||
                x.includes('small') ||
                x.includes('लहान')
              ){
                return 'SMALL';
              }

              if(
                x==='large' ||
                x.includes('large') ||
                x.includes('big') ||
                x.includes('मोठ')
              ){
                return 'LARGE';
              }

              return '';
            }

            function data(){
              return {
                mbs:safeArray(
                  window.mbs ||
                  window.mbData ||
                  window.measurementBooks
                ),
                jes:safeArray(
                  window.jes ||
                  window.jeList ||
                  window.juniorEngineers
                ),
                works:safeArray(
                  window.works ||
                  window.workList ||
                  window.workRecords
                ),
                assigns:safeArray(
                  window.assigns ||
                  window.mbAssignments ||
                  window.assignments
                ),
                transfers:safeArray(
                  window.transfers ||
                  window.transferHistory ||
                  window.mbTransfers
                ),
                bills:safeArray(
                  window.bills ||
                  window.billList ||
                  window.billRecords
                )
              };
            }

            function linkedByMB(d,numbers){

              const set=new Set(
                numbers
                  .filter(Boolean)
                  .map(n)
              );

              return {
                mbs:d.mbs.filter(
                  x=>set.has(n(mbNo(x)))
                ),

                works:d.works.filter(
                  x=>set.has(n(x?.mb))
                ),

                assigns:d.assigns.filter(
                  x=>set.has(n(x?.mb))
                ),

                bills:d.bills.filter(
                  x=>set.has(n(x?.mb))
                ),

                transfers:d.transfers.filter(
                  x=>set.has(
                    n(x?.number||x?.mb)
                  )
                )
              };
            }

            function context(){

              return {
                type:
                  document.getElementById(
                    'homeRelType'
                  )?.value || '',

                target:
                  document.getElementById(
                    'homeRelTarget'
                  )?.value || '',

                component:
                  document.getElementById(
                    'homeRelComponent'
                  )?.value || '',

                detail:
                  document.getElementById(
                    'homeRelDetail'
                  )?.value || ''
              };
            }

            function base(ctx,d){

              if(ctx.type==='MB'){

                const mbs=
                  ctx.target
                    ? d.mbs.filter(
                        x=>
                          n(mbNo(x))===
                          n(ctx.target)
                      )
                    : d.mbs;

                return linkedByMB(
                  d,
                  mbs.map(mbNo)
                );
              }

              if(ctx.type==='JE'){

                const works=d.works.filter(
                  x=>
                    !ctx.target ||
                    n(x?.je)===n(ctx.target)
                );

                const bills=d.bills.filter(
                  x=>
                    !ctx.target ||
                    n(x?.je)===n(ctx.target)
                );

                const assigns=d.assigns.filter(
                  x=>
                    !ctx.target ||
                    n(x?.je)===n(ctx.target)
                );

                const numbers=
                  uniqueSorted(
                    works.map(x=>x?.mb)
                    .concat(
                      bills.map(x=>x?.mb),
                      assigns.map(x=>x?.mb)
                    )
                  );

                const r=
                  linkedByMB(
                    d,
                    numbers
                  );

                r.works=works;
                r.bills=bills;
                r.assigns=assigns;

                return r;
              }

              if(ctx.type==='WORK'){

                const works=d.works.filter(
                  x=>
                    !ctx.target ||
                    n(workName(x))===
                    n(ctx.target)
                );

                const numbers=
                  uniqueSorted(
                    works.map(x=>x?.mb)
                  );

                const r=
                  linkedByMB(
                    d,
                    numbers
                  );

                r.works=works;

                return r;
              }

              if(ctx.type==='CONTRACTOR'){

                const works=d.works.filter(
                  x=>
                    !ctx.target ||
                    n(x?.contractor)===
                    n(ctx.target)
                );

                const bills=d.bills.filter(
                  x=>
                    !ctx.target ||
                    n(x?.contractor)===
                    n(ctx.target)
                );

                const assigns=d.assigns.filter(
                  x=>
                    !ctx.target ||
                    n(x?.contractor)===
                    n(ctx.target)
                );

                const numbers=
                  uniqueSorted(
                    works.map(x=>x?.mb)
                    .concat(
                      bills.map(x=>x?.mb),
                      assigns.map(x=>x?.mb)
                    )
                  );

                const r=
                  linkedByMB(
                    d,
                    numbers
                  );

                r.works=works;
                r.bills=bills;
                r.assigns=assigns;

                return r;
              }

              if(ctx.type==='BILL'){

                const bills=d.bills.filter(
                  x=>
                    !ctx.target ||
                    n(
                      x?.billNo||
                      x?.billType
                    )===
                    n(ctx.target)
                );

                const numbers=
                  uniqueSorted(
                    bills.map(x=>x?.mb)
                  );

                const r=
                  linkedByMB(
                    d,
                    numbers
                  );

                r.bills=bills;

                return r;
              }

              return {
                mbs:d.mbs,
                works:d.works,
                assigns:d.assigns,
                bills:d.bills,
                transfers:d.transfers
              };
            }

            function filterDetail(ctx,r){

              if(
                !ctx.component ||
                ctx.component==='ALL'
              ){
                return r;
              }

              if(ctx.component==='MB'){

                if(ctx.detail===SMALL){
                  r.mbs=r.mbs.filter(
                    x=>
                      sizeKey(x?.size)==='SMALL'
                  );
                }

                if(ctx.detail===LARGE){
                  r.mbs=r.mbs.filter(
                    x=>
                      sizeKey(x?.size)==='LARGE'
                  );
                }

                if(
                  ctx.detail &&
                  ctx.detail.startsWith(MBNO)
                ){
                  const no=
                    ctx.detail.slice(
                      MBNO.length
                    );

                  r.mbs=r.mbs.filter(
                    x=>n(mbNo(x))===n(no)
                  );
                }

                const set=
                  new Set(
                    r.mbs.map(
                      x=>n(mbNo(x))
                    )
                  );

                r.works=r.works.filter(
                  x=>set.has(n(x?.mb))
                );

                r.bills=r.bills.filter(
                  x=>set.has(n(x?.mb))
                );

                r.assigns=r.assigns.filter(
                  x=>set.has(n(x?.mb))
                );

                r.transfers=r.transfers.filter(
                  x=>
                    set.has(
                      n(
                        x?.number||
                        x?.mb
                      )
                    )
                );
              }

              if(ctx.component==='WORK'){

                if(
                  ctx.detail &&
                  ctx.detail!==ALL_DETAIL
                ){
                  r.works=r.works.filter(
                    x=>
                      n(workName(x))===
                      n(ctx.detail)
                  );
                }

                const set=
                  new Set(
                    r.works.map(
                      x=>n(x?.mb)
                    )
                  );

                r.mbs=r.mbs.filter(
                  x=>set.has(n(mbNo(x)))
                );

                r.bills=r.bills.filter(
                  x=>set.has(n(x?.mb))
                );

                r.assigns=r.assigns.filter(
                  x=>set.has(n(x?.mb))
                );

                r.transfers=r.transfers.filter(
                  x=>
                    set.has(
                      n(
                        x?.number||
                        x?.mb
                      )
                    )
                );
              }

              if(ctx.component==='JE'){

                if(
                  ctx.detail &&
                  ctx.detail!==ALL_DETAIL
                ){
                  r.works=r.works.filter(
                    x=>n(x?.je)===n(ctx.detail)
                  );

                  r.bills=r.bills.filter(
                    x=>n(x?.je)===n(ctx.detail)
                  );

                  r.assigns=r.assigns.filter(
                    x=>n(x?.je)===n(ctx.detail)
                  );
                }
              }

              if(ctx.component==='CONTRACTOR'){

                if(
                  ctx.detail &&
                  ctx.detail!==ALL_DETAIL
                ){
                  r.works=r.works.filter(
                    x=>
                      n(x?.contractor)===
                      n(ctx.detail)
                  );

                  r.bills=r.bills.filter(
                    x=>
                      n(x?.contractor)===
                      n(ctx.detail)
                  );

                  r.assigns=r.assigns.filter(
                    x=>
                      n(x?.contractor)===
                      n(ctx.detail)
                  );
                }
              }

              if(ctx.component==='BILL'){

                if(
                  ctx.detail &&
                  ctx.detail!==ALL_DETAIL
                ){
                  r.bills=r.bills.filter(
                    x=>
                      n(
                        x?.billType
                      )===
                      n(ctx.detail)
                  );
                }
              }

              return r;
            }

            function line(label,value){

              return (
                '<div style="display:grid;'
                +'grid-template-columns:145px 1fr;'
                +'gap:5px;padding:3px 0;'
                +'border-bottom:1px solid #edf1f4">'
                +'<b>'+esc(label)+'</b>'
                +'<span>'
                +esc(
                  value==null||
                  value===''
                    ? '-'
                    : value
                )
                +'</span>'
                +'</div>'
              );
            }

            function render(ctx,r){

              let html='';

              html+=
                '<div style="font-weight:900;'
                +'font-size:16px;margin-bottom:8px">'
                +'M.B. Summary — Linked Report'
                +'</div>';

              html+=
                '<div class="rel-section">'
                +'<div class="rel-section-title">'
                +'M.B. माहिती ('
                +r.mbs.length
                +')'
                +'</div>';

              if(r.mbs.length){

                html+=r.mbs.map(
                  (m,i)=>
                    '<div style="border-top:1px solid #e8eef2;'
                    +'padding:7px 0">'
                    +line('अ.क्र.',i+1)
                    +line(
                      'M.B. क्रमांक',
                      mbNo(m)
                    )
                    +line(
                      'M.B. प्रकार',
                      m?.size||'-'
                    )
                    +line(
                      'Status',
                      m?.status||'-'
                    )
                    +line(
                      'प्राप्त दिनांक',
                      date(
                        m?.receivedDate||
                        m?.date||
                        m?.createdAt
                      )
                    )
                    +'</div>'
                ).join('');

              }else{

                html+=
                  '<div class="rel-empty">'
                  +'M.B. माहिती उपलब्ध नाही.'
                  +'</div>';
              }

              html+='</div>';

              html+=
                '<div class="rel-section">'
                +'<div class="rel-section-title">'
                +'कामाची माहिती ('
                +r.works.length
                +')'
                +'</div>';

              if(r.works.length){

                html+=r.works.map(
                  (w,i)=>
                    '<div style="border-top:1px solid #e8eef2;'
                    +'padding:7px 0">'
                    +line('अ.क्र.',i+1)
                    +line(
                      'कामाचे नाव',
                      workName(w)
                    )
                    +line(
                      'M.B. क्रमांक',
                      w?.mb||'-'
                    )
                    +line(
                      'Junior Engineer',
                      w?.je||'-'
                    )
                    +line(
                      'Contractor / Agency',
                      w?.contractor||'-'
                    )
                    +'</div>'
                ).join('');

              }else{

                html+=
                  '<div class="rel-empty">'
                  +'कामाची माहिती उपलब्ध नाही.'
                  +'</div>';
              }

              html+='</div>';

              html+=
                '<div class="rel-section">'
                +'<div class="rel-section-title">'
                +'Bill माहिती ('
                +r.bills.length
                +')'
                +'</div>';

              if(r.bills.length){

                html+=r.bills.map(
                  (b,i)=>
                    '<div style="border-top:1px solid #e8eef2;'
                    +'padding:7px 0">'
                    +line('अ.क्र.',i+1)
                    +line(
                      'Bill प्रकार',
                      b?.billType||'-'
                    )
                    +line(
                      'Bill क्रमांक',
                      b?.billNo||'-'
                    )
                    +line(
                      'Bill दिनांक',
                      date(
                        b?.billDate||
                        b?.savedAt
                      )
                    )
                    +line(
                      'M.B. क्रमांक',
                      b?.mb||'-'
                    )
                    +line(
                      'कामाचे नाव',
                      workName(b)||'-'
                    )
                    +line(
                      'Junior Engineer',
                      b?.je||'-'
                    )
                    +line(
                      'Contractor / Agency',
                      b?.contractor||'-'
                    )
                    +line(
                      'Bill रक्कम',
                      amount(b?.amount)
                    )
                    +'</div>'
                ).join('');

              }else{

                html+=
                  '<div class="rel-empty">'
                  +'Bill माहिती उपलब्ध नाही.'
                  +'</div>';
              }

              html+='</div>';

              html+=
                '<div class="rel-section">'
                +'<div class="rel-section-title">'
                +'Transfer / History ('
                +r.transfers.length
                +')'
                +'</div>';

              if(r.transfers.length){

                html+=r.transfers.map(
                  (t,i)=>
                    '<div style="border-top:1px solid #e8eef2;'
                    +'padding:7px 0">'
                    +line('अ.क्र.',i+1)
                    +line(
                      'M.B. क्रमांक',
                      t?.number||
                      t?.mb||
                      '-'
                    )
                    +line(
                      'दिनांक',
                      date(
                        t?.date||
                        t?.transferDate||
                        t?.savedAt
                      )
                    )
                    +line(
                      'प्राप्तकर्ता',
                      t?.receiverName||
                      t?.name||
                      t?.receiver||
                      t?.to||
                      '-'
                    )
                    +line(
                      'प्रकार',
                      t?.recipientType||
                      t?.type||
                      '-'
                    )
                    +'</div>'
                ).join('');

              }else{

                html+=
                  '<div class="rel-empty">'
                  +'Transfer / History माहिती उपलब्ध नाही.'
                  +'</div>';
              }

              html+='</div>';

              return html;
            }

            function loadHomeRelDetailsV124(){

              const sel=
                document.getElementById(
                  'homeRelDetail'
                );

              if(!sel)return;

              const ctx=context();
              const d=data();
              const r=base(ctx,d);

              const options=[];

              if(ctx.component==='MB'){

                options.push(
                  ['__ALL_DETAIL__','सर्व M.B.'],
                  ['__SMALL_MB__','Small M.B.'],
                  ['__LARGE_MB__','Big M.B.']
                );

                uniqueSorted(
                  r.mbs.map(mbNo)
                ).forEach(
                  x=>
                    options.push(
                      [
                        MBNO+x,
                        'M.B. क्रमांक '+x
                      ]
                    )
                );
              }

              if(ctx.component==='WORK'){

                options.push(
                  [
                    ALL_DETAIL,
                    'सर्व कामे'
                  ]
                );

                uniqueSorted(
                  r.works.map(workName)
                ).forEach(
                  x=>
                    options.push([x,x])
                );
              }

              if(ctx.component==='JE'){

                options.push(
                  [
                    ALL_DETAIL,
                    'सर्व JE'
                  ]
                );

                uniqueSorted(
                  r.works.map(x=>x?.je)
                  .concat(
                    r.bills.map(x=>x?.je),
                    r.assigns.map(x=>x?.je)
                  )
                ).forEach(
                  x=>
                    options.push([x,x])
                );
              }

              if(ctx.component==='CONTRACTOR'){

                options.push(
                  [
                    ALL_DETAIL,
                    'सर्व Contractor / Agency'
                  ]
                );

                uniqueSorted(
                  r.works.map(x=>x?.contractor)
                  .concat(
                    r.bills.map(x=>x?.contractor),
                    r.assigns.map(x=>x?.contractor)
                  )
                ).forEach(
                  x=>
                    options.push([x,x])
                );
              }

              if(ctx.component==='BILL'){

                options.push(
                  [
                    ALL_DETAIL,
                    'सर्व Bill'
                  ]
                );

                uniqueSorted(
                  r.bills.map(
                    x=>x?.billType
                  )
                ).forEach(
                  x=>
                    options.push([x,x])
                );
              }

              sel.innerHTML=
                '<option value="">तपशील निवडा</option>'+
                options.map(
                  x=>
                    '<option value="'+
                    esc(x[0])+
                    '">'+
                    esc(x[1])+
                    '</option>'
                ).join('');

              sel.style.display=
                options.length
                  ? 'block'
                  : 'none';

              if(options.length){
                sel.value=options[0][0];
              }

              showHomeRelationshipV124();
            }

            function showHomeRelationshipV124(){

              const box=
                document.getElementById(
                  'homeRelResult'
                );

              if(!box)return;

              const ctx=context();

              if(!ctx.target){

                box.innerHTML=
                  '<div class="rel-empty">'
                  +'मुख्य नोंद निवडा.'
                  +'</div>';

                return;
              }

              const r=
                filterDetail(
                  ctx,
                  base(
                    ctx,
                    data()
                  )
                );

              box.innerHTML=
                render(
                  ctx,
                  r
                );
            }

            function printLinkedRelationshipReport(){

              const ctx=context();

              const r=
                filterDetail(
                  ctx,
                  base(
                    ctx,
                    data()
                  )
                );

              let printArea=
                document.getElementById(
                  'printArea'
                );

              if(!printArea){

                printArea=
                  document.createElement(
                    'div'
                  );

                printArea.id=
                  'printArea';

                document.body.appendChild(
                  printArea
                );
              }

              printArea.innerHTML=
                '<div style="background:#fff;'
                +'color:#111;padding:18mm;'
                +'box-sizing:border-box;'
                +'width:210mm;min-height:297mm">'
                +'<h2 style="text-align:center">'
                +'M.B. SUMMARY — LINKED REPORT'
                +'</h2>'
                +render(ctx,r)
                +'</div>';

              window.print();
            }

            window.loadHomeRelDetails=
              loadHomeRelDetailsV124;

            window.showHomeRelationship=
              showHomeRelationshipV124;

            window.printHomeRelationshipReport=
              printLinkedRelationshipReport;

            document.addEventListener(
              'change',
              function(e){

                if(
                  e.target?.id===
                    'homeRelDetail'
                ){
                  setTimeout(
                    showHomeRelationshipV124,
                    0
                  );
                }
              },
              true
            );

            window.mbmsV127SummaryFixLoaded=true;

          })();
          PATCH_JS

          python3 <<'PY'
          from pathlib import Path

          html_path=Path(
              "mbms_work/index.html"
          )

          patch_path=Path(
              "/tmp/mbms_summary_patch.js"
          )

          text=html_path.read_text(
              encoding="utf-8"
          )

          patch=patch_path.read_text(
              encoding="utf-8"
          ).rstrip()

          if "</script>" in patch.lower():
              raise SystemExit(
                  "ERROR: Unsafe </script> found in patch."
              )

          marker="</body>"

          pos=text.lower().rfind(
              marker.lower()
          )

          if pos < 0:
              raise SystemExit(
                  "ERROR: </body> marker not found."
              )

          script_block=(
              '<script id="V127_MBMS_SUMMARY_LINKED_FIX">\n'
              +patch+
              '\n</script>\n'
          )

          text=(
              text[:pos]+
              script_block+
              text[pos:]
          )

          html_path.write_text(
              text,
              encoding="utf-8"
          )

          print(
              "MB SUMMARY PATCH APPLIED INSIDE SCRIPT."
          )
          PY

      - name: Verify MB Summary Patch Placement
        shell: bash
        run: |
          set -Eeuo pipefail

          python3 <<'PY'
          from pathlib import Path

          text=Path(
              "mbms_work/index.html"
          ).read_text(
              encoding="utf-8"
          )

          opening=(
              '<script id="V127_MBMS_SUMMARY_LINKED_FIX">'
          )

          closing="</script>"

          pos=text.find(opening)

          if pos < 0:
              raise SystemExit(
                  "ERROR: MB Summary opening tag not found."
              )

          start=pos+len(opening)

          finish=text.find(
              closing,
              start
          )

          if finish < 0:
              raise SystemExit(
                  "ERROR: MB Summary closing tag not found."
              )

          body=text[start:finish]

          required=[
              "loadHomeRelDetailsV124",
              "showHomeRelationshipV124",
              "printLinkedRelationshipReport",
              "__SMALL_MB__",
              "__LARGE_MB__"
          ]

          missing=[
              x for x in required
              if x not in body
          ]

          if missing:
              raise SystemExit(
                  "ERROR: Missing MB Summary code: "+
                  ", ".join(missing)
              )

          if (
              "base64.b64decode" in text or
              "Incorrect padding" in text
          ):
              raise SystemExit(
                  "ERROR: Old broken Base64 patch detected."
              )

          print(
              "MB SUMMARY SCRIPT PLACEMENT VERIFIED."
          )

      - name: Validate Final HTML JavaScript
        shell: bash
        run: |
          set -Eeuo pipefail

          python3 <<'PY'
          from pathlib import Path
          import re

          text=Path(
              "mbms_work/index.html"
          ).read_text(
              encoding="utf-8"
          )

          scripts=re.findall(
              r"<script[^>]*>(.*?)</script>",
              text,
              flags=re.I|re.S
          )

          if not scripts:
              raise SystemExit(
                  "ERROR: No JavaScript blocks found."
              )

          for i,script in enumerate(scripts):

              Path(
                  f"/tmp/mbms_script_{i}.js"
              ).write_text(
                  script,
                  encoding="utf-8"
              )

          print(
              "Extracted",
              len(scripts),
              "JavaScript blocks."
          )
          PY

          for f in /tmp/mbms_script_*.js
          do
            node --check "$f"
          done

          echo "FINAL HTML JAVASCRIPT VALIDATION PASSED."

