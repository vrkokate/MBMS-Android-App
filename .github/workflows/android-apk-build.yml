              exit 1

          fi


          echo "Checking native bridge..."


          grep -q \
            "MBMSAndroid" \
            mbms_android/app/src/main/java/com/mbms/app/MainActivity.java


          grep -q \
            "saveBackup" \
            mbms_android/app/src/main/java/com/mbms/app/MainActivity.java


          grep -q \
            "requestRestore" \
            mbms_android/app/src/main/java/com/mbms/app/MainActivity.java


          grep -q \
            "createPrintDocumentAdapter" \
            mbms_android/app/src/main/java/com/mbms/app/MainActivity.java


