name: MBMS Final APK - Transfer Report Final

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Final MBMS APK
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # 1. Checkout
      # =========================================================
      - name: Checkout repository
        uses: actions/checkout@v7


      # =========================================================
      # 2. Java 17
      # =========================================================
      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'


      # =========================================================
      # 3. Android SDK
      # =========================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4


      - name: Install Android SDK
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"


      # =========================================================
      # 4. Gradle
      # =========================================================
      - name: Install Gradle 8.7
        run: |
          set -e

          wget -q \
            https://services.gradle.org/distributions/gradle-8.7-bin.zip

          unzip -q gradle-8.7-bin.zip -d "$HOME/gradle"

          echo "$HOME/gradle/gradle-8.7/bin" >> "$GITHUB_PATH"


      # =========================================================
      # 5. Find original V115 HTML
      # =========================================================
      - name: Find MBMS V115 HTML
        shell: bash
        run: |
          set -e

          SOURCE=""

          if [ -f "Measurement_Book_Management_System_FINAL_V115_MB_HISTORY_ONLY_DATE-6.html" ]; then
            SOURCE="Measurement_Book_Management_System_FINAL_V115_MB_HISTORY_ONLY_DATE-6.html"

          elif [ -f "Measurement_Book_Management_System_FINAL_V115_MB_HISTORY_ONLY_DATE.html" ]; then
            SOURCE="Measurement_Book_Management_System_FINAL_V115_MB_HISTORY_ONLY_DATE.html"

          elif [ -f "Measurement_Book_Management_System_FINAL_V115.html" ]; then
            SOURCE="Measurement_Book_Management_System_FINAL_V115.html"

          elif [ -f "V115.html" ]; then
            SOURCE="V115.html"

          elif [ -f "index.html" ]; then
            SOURCE="index.html"

          else
            SOURCE="$(find . -maxdepth 3 -type f -iname '*.html' | head -n 1 || true)"
          fi


          if [ -z "$SOURCE" ]; then
            echo "ERROR: No MBMS HTML file found."
            find . -maxdepth 3 -type f | sort
            exit 1
          fi


          echo "=========================================="
          echo "SOURCE HTML"
          echo "$SOURCE"
          echo "=========================================="


          cp "$SOURCE" /tmp/MBMS_BASE.html


          echo "HTML size:"
          wc -c /tmp/MBMS_BASE.html


      # =========================================================
      # 6. Create FINAL V120 Transfer Report HTML
      #
      # This modifies ONLY the Transfer Report portion.
      # Everything else from V115 is retained.
      # =========================================================
      - name: Apply Final Transfer Report changes
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path
          import re

          src = Path("/tmp/MBMS_BASE.html")
          dst = Path("/tmp/MBMS_FINAL.html")

          text = src.read_text(encoding="utf-8")

          # -----------------------------------------------------
          # Replace generateTransferReport() related block.
          # -----------------------------------------------------

          start = text.find("function openTransferReport()")

          if start == -1:
              raise SystemExit(
                  "ERROR: openTransferReport() not found."
              )

          end = text.find("function getWorkList()", start)

          if end == -1:
              raise SystemExit(
                  "ERROR: getWorkList() marker not found."
              )

          original_block = text[start:end]

          replacement = r'''function openTransferReport(){const list=getTransferHistory(),select=document.getElementById("transferReportSelect");if(!select)return;select.innerHTML='<option value="ALL">सर्व Transfer नोंदी</option>'+list.map((x,i)=>`<option value="${i}">${i+1}. MB ${escapeHtml(x.number||"")}</option>`).join("");document.getElementById("transferReportOverlay").style.display="flex";}
          function closeTransferReport(){const e=document.getElementById("transferReportOverlay");if(e)e.style.display="none";}

          function transferReportPersonName(x){
            const type=String(x?.transferPartyType||x?.receiver||'').trim();
            let name=String(x?.receiverName||x?.receivedFromName||x?.receiver||'').trim();

            if(!name)return '-';

            if(
              (
                type==='जेई' ||
                type.toUpperCase()==='JE' ||
                norm(type).includes('ज्युनियर')
              )
              &&
              !/^(श्री\.?|श्रीमती\.?|कु\.?)/.test(name)
            ){
              name='श्री '+name;
            }

            return name;
          }

          function transferReportCurrentHolder(number){

            try{

              const h=
                typeof mbSummaryCurrentHolder==='function'
                ?
                mbSummaryCurrentHolder(number)
                :
                null;

              if(h && h.name){
                return h.name;
              }

            }catch(e){}

            const history=
              getTransferHistory()
              .filter(
                x=>
                  norm(
                    x.number||
                    x.mbNumber||
                    x.mb||
                    ""
                  )
                  ===
                  norm(number||"")
              );

            if(!history.length){
              return 'उपलब्ध M.B.';
            }

            const last=
              history[history.length-1];

            if(
              String(
                last.transferType||''
              ).toUpperCase()==='GIVEN'
            ){

              let n=
                String(
                  last.receiverName||
                  last.receiver||
                  ''
                ).trim();

              if(!n){
                n=
                  'संबंधित व्यक्ती / कार्यालय';
              }

              const t=
                String(
                  last.transferPartyType||
                  last.receiver||
                  ''
                ).trim();

              if(
                (
                  t==='जेई' ||
                  t.toUpperCase()==='JE' ||
                  norm(t).includes('ज्युनियर')
                )
                &&
                !/^(श्री\.?|श्रीमती\.?|कु\.?)/.test(n)
              ){
                n='श्री '+n;
              }

              return n;
            }

            return 'उपलब्ध M.B.';
          }

          function generateTransferReport(){

            const list=
              getTransferHistory();

            const range=
              reportDateRange(
                "transfer-report"
              );

            if(!range.valid){
              return alert(
                reportDateError(range)
              );
            }

            if(!list.length){
              return alert(
                "Transfer List मध्ये कोणतीही नोंद नाही."
              );
            }

            const selected=
              document.getElementById(
                "transferReportSelect"
              ).value;

            if(selected===""){
              return alert(
                "कृपया Report निवडा."
              );
            }

            if(
              selected!=="ALL"
              &&
              !reportDateAllowed(
                transferReportDate(
                  list[Number(selected)]
                ),
                range
              )
            ){
              return alert(
                "निवडलेली नोंद या दिनांक कालावधीत नाही."
              );
            }

            const data=
              selected==="ALL"
              ?
              list.filter(
                x=>
                  reportDateAllowed(
                    transferReportDate(x),
                    range
                  )
              )
              :
              [
                list[Number(selected)]
              ];

            if(!data[0]){
              return alert(
                "निवडलेली नोंद उपलब्ध नाही."
              );
            }


            const rows=
              data.map(
                (x,i)=>
                  `<tr class="a4-entry">
                    <td>${i+1}</td>
                    <td>${escapeHtml(x.number||"")}</td>
                    <td>${escapeHtml(x.size||"")}</td>
                    <td>${escapeHtml(transferReportPersonName(x))}</td>
                  </tr>`
              ).join("");


            const reportText=
              selected==="ALL"
              ?
              "सर्व Transfer नोंदी"
              :
              "MB "+escapeHtml(
                data[0].number||""
              );


            const holderText=
              selected==="ALL"
              ?
              "सध्या संबंधित M.B. संबंधित व्यक्ती / कार्यालयाकडे आहेत."
              :
              `सध्या ही M.B. ${escapeHtml(
                transferReportCurrentHolder(
                  data[0].number||""
                )
              )} यांच्याकडे आहे.`;


            document.getElementById(
              "printArea"
            ).innerHTML=
              `<div class="a4-page transfer-report-page">

                <div class="a4-header">

                  <div class="dept">
                    सार्वजनिक बांधकाम विभाग
                  </div>

                  <div class="system">
                    मोजमाप पुस्तिका नियंत्रण प्रणाली
                  </div>

                  <div class="report-title">
                    M.B. TRANSFER REPORT
                  </div>

                </div>


                <div class="a4-meta transfer-report-meta">

                  <span>
                    <b>Report :</b>
                    ${reportText}
                  </span>

                  <span class="transfer-current-holder">
                    <b>${holderText}</b>
                  </span>

                </div>


                <table class="a4-table transfer-report-table">

                  <thead>

                    <tr>

                      <th>
                        अ.क्र.
                      </th>

                      <th>
                        MB क्रमांक
                      </th>

                      <th>
                        आकार
                      </th>

                      <th>
                        कुणाला दिली
                      </th>

                    </tr>

                  </thead>

                  <tbody>
                    ${rows}
                  </tbody>

                </table>


                <div class="a4-footer">
                  Created By विठ्ठल कोकाटे पाटील 8446556141
                </div>

              </div>`;


            closeTransferReport();

            window.print();
          }


          '''

          text = text[:start] + replacement + text[end:]


          # -----------------------------------------------------
          # Add only Transfer Report CSS.
          # -----------------------------------------------------

          css_marker = "/* ===== M.B. MODULE ===== */"

          css_pos = text.find(css_marker)

          if css_pos == -1:
              raise SystemExit(
                  "ERROR: CSS insertion marker not found."
              )

          css = r'''
          /* ===== FINAL TRANSFER REPORT CSS ===== */

          .transfer-report-table th:nth-child(1),
          .transfer-report-table td:nth-child(1){
              width:14mm;
          }

          .transfer-report-table th:nth-child(2),
          .transfer-report-table td:nth-child(2){
              width:55mm;
          }

          .transfer-report-table th:nth-child(3),
          .transfer-report-table td:nth-child(3){
              width:35mm;
          }

          .transfer-report-table th:nth-child(4),
          .transfer-report-table td:nth-child(4){
              width:74mm;
          }

          .transfer-report-table th,
          .transfer-report-table td{
              font-size:10pt;
          }

          .transfer-report-meta{
              gap:8mm;
              align-items:flex-start;
          }

          .transfer-report-meta>span{
              flex:1;
          }

          .transfer-report-meta .transfer-current-holder{
              text-align:right;
          }

          .transfer-report-page .a4-footer{
              font-size:9pt;
          }

          .a4-entry{
              break-inside:avoid;
              page-break-inside:avoid;
          }

          '''

          text = text[:css_pos] + css + text[css_pos:]


          # -----------------------------------------------------
          # Required verification strings
          # -----------------------------------------------------

          required = [
              "function transferReportPersonName",
              "function transferReportCurrentHolder",
              "M.B. TRANSFER REPORT",
              "transfer-report-table",
              "Created By विठ्ठल कोकाटे पाटील 8446556141",
              "सध्या ही M.B."
          ]

          for item in required:
              if item not in text:
                  raise SystemExit(
                      f"ERROR: Required final content missing: {item}"
                  )


          dst.write_text(
              text,
              encoding="utf-8"
          )

          print("FINAL V120 TRANSFER REPORT HTML CREATED")
          print("Source bytes :", src.stat().st_size)
          print("Final bytes  :", dst.stat().st_size)
          PY


      # =========================================================
      # 7. Verify final HTML
      # =========================================================
      - name: Verify Final MBMS HTML
        shell: bash
        run: |
          set -e

          FILE="/tmp/MBMS_FINAL.html"

          test -s "$FILE"

          grep -qi "<html" "$FILE"
          grep -qi "localStorage" "$FILE"
          grep -qi "M.B. TRANSFER REPORT" "$FILE"
          grep -qi "transfer-report-table" "$FILE"
          grep -qi "transferReportCurrentHolder" "$FILE"
          grep -qi "Created By विठ्ठल कोकाटे पाटील 8446556141" "$FILE"

          echo "=========================================="
          echo "FINAL HTML VERIFICATION PASSED"
          echo "=========================================="
          echo "Original V115 logic : PRESERVED"
          echo "Transfer Report     : UPDATED"
          echo "Current Holder      : INCLUDED"
          echo "Created By          : INCLUDED"
          echo "=========================================="


      # =========================================================
      # 8. Create Android project
      # =========================================================
      - name: Create Android project
        shell: bash
        run: |
          set -e

          rm -rf mbms_android

          mkdir -p \
            mbms_android/app/src/main/assets

          mkdir -p \
            mbms_android/app/src/main/java/com/mbms/v118

          mkdir -p \
            mbms_android/app/src/main/res/values

          cp \
            /tmp/MBMS_FINAL.html \
            mbms_android/app/src/main/assets/index.html


      # =========================================================
      # 9. settings.gradle
      # =========================================================
      - name: Create settings.gradle
        run: |
          cat > mbms_android/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(
                  RepositoriesMode.FAIL_ON_PROJECT_REPOS
              )

              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "MBMS-Final-Android"

          include(":app")
          EOF


      # =========================================================
      # 10. Root build.gradle
      # =========================================================
      - name: Create root build.gradle
        run: |
          cat > mbms_android/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF


      # =========================================================
      # 11. gradle.properties
      # =========================================================
      - name: Create gradle.properties
        run: |
          cat > mbms_android/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF


      # =========================================================
      # 12. app/build.gradle
      # =========================================================
      - name: Create app build.gradle
        run: |
          cat > mbms_android/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {

              namespace 'com.mbms.v118'

              compileSdk 35

              defaultConfig {

                  applicationId 'com.mbms.v118'

                  minSdk 26

                  targetSdk 35

                  versionCode 121

                  versionName "1.21"
              }

              buildTypes {

                  debug {

                      minifyEnabled false

                      shrinkResources false
                  }

                  release {

                      minifyEnabled false

                      shrinkResources false
                  }
              }
          }
          EOF


      # =========================================================
      # 13. AndroidManifest.xml
      # =========================================================
      - name: Create AndroidManifest.xml
        run: |
          cat > mbms_android/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <manifest
              xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission
                  android:name="android.permission.INTERNET" />

              <uses-permission
                  android:name="android.permission.WRITE_EXTERNAL_STORAGE"
                  android:maxSdkVersion="28" />

              <application

                  android:allowBackup="true"

                  android:hardwareAccelerated="true"

                  android:usesCleartextTraffic="true"

                  android:label="@string/app_name"

                  android:theme="@style/AppTheme"

                  android:resizeableActivity="true">

                  <activity

                      android:name=".MainActivity"

                      android:exported="true"

                      android:screenOrientation="portrait">

                      <intent-filter>

                          <action
                              android:name="android.intent.action.MAIN" />

                          <category
                              android:name="android.intent.category.LAUNCHER" />

                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF


      # =========================================================
      # 14. strings.xml
      # =========================================================
      - name: Create strings.xml
        run: |
          cat > mbms_android/app/src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <resources>

              <string name="app_name">
                  मोजमाप पुस्तिका नियंत्रण प्रणाली
              </string>

          </resources>
          EOF


      # =========================================================
      # 15. styles.xml
      # =========================================================
      - name: Create styles.xml
        run: |
          cat > mbms_android/app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <resources>

              <style
                  name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">

                  <item name="android:fontFamily">
                      sans
                  </item>

                  <item name="android:windowLightStatusBar">
                      false
                  </item>

                  <item name="android:statusBarColor">
                      #04366F
                  </item>

                  <item name="android:navigationBarColor">
                      #04366F
                  </item>

                  <item name="android:colorAccent">
                      #0755A5
                  </item>

              </style>

          </resources>
          EOF


      # =========================================================
      # 16. MainActivity.java
      #
      # Native Print
      # Native Backup Save
      # Native Backup Restore
      # =========================================================
      - name: Create MainActivity.java
        run: |
          cat > mbms_android/app/src/main/java/com/mbms/v118/MainActivity.java <<'EOF'
          package com.mbms.v118;

          import android.Manifest;
          import android.app.Activity;
          import android.content.ContentValues;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Environment;
          import android.provider.MediaStore;
          import android.print.PrintAttributes;
          import android.print.PrintDocumentAdapter;
          import android.print.PrintManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Toast;

          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.OutputStream;
          import java.nio.charset.StandardCharsets;


          public class MainActivity extends Activity {

              private static final int REQUEST_FILE_CHOOSER = 7001;

              private static final int REQUEST_WRITE_STORAGE = 7002;


              private WebView webView;

              private ValueCallback<Uri[]> filePathCallback;

              private String pendingBackupJson;

              private String pendingBackupName;


              @Override
              protected void onCreate(
                      Bundle savedInstanceState) {

                  super.onCreate(savedInstanceState);


                  getWindow().setStatusBarColor(
                          Color.rgb(4, 54, 111)
                  );


                  getWindow().setNavigationBarColor(
                          Color.rgb(4, 54, 111)
                  );


                  webView = new WebView(this);


                  WebSettings settings =
                          webView.getSettings();


                  settings.setJavaScriptEnabled(true);

                  settings.setDomStorageEnabled(true);

                  settings.setDatabaseEnabled(true);


                  settings.setAllowFileAccess(true);

                  settings.setAllowContentAccess(true);

                  settings.setAllowFileAccessFromFileURLs(true);

                  settings.setAllowUniversalAccessFromFileURLs(true);


                  settings.setBuiltInZoomControls(false);

                  settings.setDisplayZoomControls(false);

                  settings.setSupportZoom(false);

                  settings.setLoadWithOverviewMode(false);

                  settings.setUseWideViewPort(false);

                  settings.setJavaScriptCanOpenWindowsAutomatically(
                          true
                  );

                  settings.setSupportMultipleWindows(false);


                  // =====================================================
                  // File chooser
                  // =====================================================

                  webView.setWebChromeClient(
                          new WebChromeClient() {

                              @Override
                              public boolean onShowFileChooser(
                                      WebView view,
                                      ValueCallback<Uri[]> callback,
                                      FileChooserParams params) {

                                  if (
                                      filePathCallback != null
                                  ) {

                                      filePathCallback
                                              .onReceiveValue(null);
                                  }


                                  filePathCallback =
                                          callback;


                                  Intent intent =
                                          new Intent(
                                                  Intent.ACTION_OPEN_DOCUMENT
                                          );


                                  intent.addCategory(
                                          Intent.CATEGORY_OPENABLE
                                  );


                                  intent.setType(
                                          "application/json"
                                  );


                                  intent.putExtra(
                                          Intent.EXTRA_ALLOW_MULTIPLE,
                                          false
                                  );


                                  try {

                                      startActivityForResult(
                                              intent,
                                              REQUEST_FILE_CHOOSER
                                      );

                                  } catch (Exception e) {

                                      filePathCallback =
                                              null;

                                      return false;
                                  }


                                  return true;
                              }

                          }
                  );


                  // =====================================================
                  // WebView
                  // =====================================================

                  webView.setWebViewClient(
                          new WebViewClient() {

                              @Override
                              public boolean
                              shouldOverrideUrlLoading(
                                      WebView view,
                                      WebResourceRequest request) {

                                  return false;
                              }


                              @Override
                              public void onPageFinished(
                                      WebView view,
                                      String url) {

                                  super.onPageFinished(
                                          view,
                                          url
                                  );


                                  installNativePrintBridge(
                                          view
                                  );

                                  installBackupBridge(
                                          view
                                  );
                              }

                          }
                  );


                  // =====================================================
                  // JavaScript interfaces
                  // =====================================================

                  webView.addJavascriptInterface(
                          new AndroidPrintBridge(),
                          "AndroidPrint"
                  );


                  webView.addJavascriptInterface(
                          new AndroidBackupBridge(),
                          "AndroidBackup"
                  );


                  webView.setBackgroundColor(
                          Color.rgb(238, 246, 255)
                  );


                  setContentView(webView);


                  webView.loadUrl(
                          "file:///android_asset/index.html"
                  );
              }


              // ==========================================================
              // Print bridge
              // ==========================================================

              private void installNativePrintBridge(
                      WebView view) {

                  String js =
                          "javascript:(function(){"
                          + "try{"

                          + "window.print=function(){"

                          + "if(window.AndroidPrint){"
                          + "window.AndroidPrint.printPage();"
                          + "}"

                          + "};"

                          + "}catch(e){"
                          + "console.error(e);"
                          + "}"

                          + "})()";


                  view.evaluateJavascript(
                          js,
                          null
                  );
              }


              // ==========================================================
              // Backup bridge
              // ==========================================================

              private void installBackupBridge(
                      WebView view) {

                  String js =
                          "javascript:(function(){"
                          + "try{"

                          + "window.mbmsNativeSaveBackup=function(){"

                          + "try{"

                          + "if(typeof mbmsSettingsSnapshot!=='function'){"
                          + "alert('Backup function उपलब्ध नाही.');"
                          + "return;"
                          + "}"

                          + "var data=JSON.stringify("
                          + "mbmsSettingsSnapshot(),null,2"
                          + ");"

                          + "var d=new Date();"

                          + "var y=d.getFullYear();"

                          + "var m=String(d.getMonth()+1).padStart(2,'0');"

                          + "var day=String(d.getDate()).padStart(2,'0');"

                          + "var fn="
                          + "'MBMS_Backup_'+y+'-'+m+'-'+day+'.json';"

                          + "if(window.AndroidBackup){"

                          + "window.AndroidBackup.saveBackup("
                          + "data,fn"
                          + ");"

                          + "}"

                          + "}catch(e){"

                          + "console.error(e);"

                          + "alert('Backup Save करताना त्रुटी आली.');"

                          + "}"

                          + "};"


                          // ---------------------------------------------
                          // Restore text function
                          // ---------------------------------------------

