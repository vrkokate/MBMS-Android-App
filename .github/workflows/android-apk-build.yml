              if(!c.target){

                box.innerHTML=
                  '<div class="rel-empty">'+
                  'प्रथम मुख्य नोंद निवडा. '+
                  'JE साठी JE चे नाव निवडा.'+
                  '</div>';

                return;
              }

              if(!c.ctype){

                box.innerHTML=
                  '<div class="rel-empty">'+
                  'पुढील संबंधित माहिती निवडा.'+
