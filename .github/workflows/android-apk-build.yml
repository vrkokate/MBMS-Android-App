      - name: Verify generated Android project
        working-directory: mbms_android
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f settings.gradle
          test -f build.gradle
          test -f gradle.properties
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/mbms/app/MainActivity.java
          test -s app/src/main/assets/index.html
          echo "ANDROID PROJECT FILES VERIFIED."


      - name: Compile Android Java
        working-directory: mbms_android
        shell: bash
        run: |
          set -e

          for attempt in 1 2; do
            echo "Java compilation attempt $attempt/2"
            if gradle --no-daemon --stacktrace :app:compileDebugJavaWithJavac; then
              echo "JAVA COMPILATION PASSED."
              exit 0
            fi
            if [ "$attempt" -lt 2 ]; then
              echo "Java compilation failed; retrying after 5 seconds..."
              sleep 5
            fi
          done
          echo "ERROR: Java compilation failed after 2 attempts."
          exit 1


      - name: Build Final MBMS APK
        working-directory: mbms_android
        shell: bash
        run: |
          set -e

          for attempt in 1 2; do
            echo "APK build attempt $attempt/2"
            if gradle --no-daemon --stacktrace clean :app:assembleDebug; then
              echo "GRADLE APK BUILD PASSED."
              break
            fi
            if [ "$attempt" -lt 2 ]; then
              echo "APK build failed; retrying after 5 seconds..."
              sleep 5
            else
              echo "ERROR: APK build failed after 2 attempts."
              exit 1
            fi
          done

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"


          cp \
            "$APK" \
            "../release/MBMS-V131-FINAL-PRINT-AUDIT-HARDENED.apk"


          ls -lh \
            "../release/MBMS-V131-FINAL-PRINT-AUDIT-HARDENED.apk"


      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="release/MBMS-V131-FINAL-PRINT-AUDIT-HARDENED.apk"

          test -s "$APK"


          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify \
            --verbose \
            "$APK"


          unzip -t "$APK" >/dev/null


          sha256sum "$APK" \
            | tee release/SHA256.txt


          echo "APK SIGNATURE AND ZIP VERIFICATION PASSED."


      - name: Upload APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: MBMS-V131-FINAL-PRINT-AUDIT-HARDENED
          path: |
            release/MBMS-V131-FINAL-PRINT-AUDIT-HARDENED.apk
            release/SHA256.txt
          if-no-files-found: error
