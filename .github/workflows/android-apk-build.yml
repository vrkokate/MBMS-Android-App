                        + "return;"
                        + "}"

                        + "}catch(e){"

                        + "alert("
                        + "'Backup Save मध्ये त्रुटी आली.'"
                        + ");"

                        + "}"
                        + "};"

                        + "}catch(e){"
                        + "console.error(e);"
                        + "}"
                        + "})();";

                  webView.evaluateJavascript(
                      js,
                      null
                  );
              }

              public class AndroidBridge {

                  @JavascriptInterface
                  public void print() {

                      runOnUiThread(
                          new Runnable() {

                              @Override
                              public void run() {

                                  try {

                                      PrintManager manager =
                                          (PrintManager)
                                          getSystemService(
                                              Context.PRINT_SERVICE
                                          );

                                      if(manager == null) {

                                          throw new Exception(
                                              "Print service unavailable"
                                          );
                                      }

                                      PrintDocumentAdapter adapter =
                                          webView
                                          .createPrintDocumentAdapter(
                                              "MBMS Report"
                                          );

                                      PrintAttributes attributes =
                                          new PrintAttributes.Builder()

                                          .setMediaSize(
                                              PrintAttributes.MediaSize.ISO_A4
                                          )

                                          .setMinMargins(
                                              PrintAttributes.Margins.NO_MARGINS
                                          )

                                          .build();

                                      manager.print(
                                          "MBMS Report",
                                          adapter,
                                          attributes
                                      );

                                  } catch(Exception e) {

                                      Toast.makeText(
                                          MainActivity.this,
                                          "Print सुरू करता आले नाही.",
                                          Toast.LENGTH_LONG
                                      ).show();
                                  }
                              }
                          }
                      );
                  }

                  @JavascriptInterface
                  public void saveBackup(
                          final String json,
                          final String filename) {

                      new Thread(
                          new Runnable() {

                              @Override
                              public void run() {

                                  boolean success =
                                          false;

                                  try {

                                      if(
                                          Build.VERSION.SDK_INT >= 29
                                      ) {

                                          ContentValues values =
                                              new ContentValues();

                                          values.put(
                                              MediaStore.Downloads.DISPLAY_NAME,
                                              filename
                                          );

                                          values.put(
                                              MediaStore.Downloads.MIME_TYPE,
                                              "application/json"
                                          );

                                          values.put(
                                              MediaStore.Downloads.RELATIVE_PATH,
                                              Environment.DIRECTORY_DOWNLOADS
                                          );

                                          values.put(
                                              MediaStore.Downloads.IS_PENDING,
                                              1
                                          );

                                          Uri uri =
                                              getContentResolver()
                                              .insert(
                                                  MediaStore.Downloads.EXTERNAL_CONTENT_URI,
                                                  values
                                              );

                                          if(uri == null) {

                                              throw new Exception(
                                                  "Unable to create backup"
                                              );
                                          }

                                          OutputStream output =
                                              getContentResolver()
                                              .openOutputStream(
                                                  uri
                                              );

                                          if(output == null) {

                                              throw new Exception(
                                                  "Unable to open backup"
                                              );
                                          }

                                          try {

                                              output.write(
                                                  json.getBytes(
                                                      StandardCharsets.UTF_8
                                                  )
                                              );

                                              output.flush();

                                          } finally {

                                              output.close();
                                          }

                                          ContentValues done =
                                              new ContentValues();

                                          done.put(
                                              MediaStore.Downloads.IS_PENDING,
                                              0
                                          );

                                          getContentResolver()
                                          .update(
                                              uri,
                                              done,
                                              null,
                                              null
                                          );

                                          success = true;

                                      } else {

                                          throw new Exception(
                                              "Android version below 29 not supported."
                                          );
                                      }

                                  } catch(Exception e) {

                                      e.printStackTrace();
                                  }

                                  final boolean result =
                                      success;

                                  runOnUiThread(
                                      new Runnable() {

                                          @Override
                                          public void run() {

                                              Toast.makeText(
                                                  MainActivity.this,
                                                  result
                                                      ? "Backup Downloads मध्ये Save झाला."
                                                      : "Backup Save मध्ये त्रुटी आली.",
                                                  Toast.LENGTH_LONG
                                              ).show();
                                          }
                                      }
                                  );
                              }
                          }
                      ).start();
                  }
              }

              @Override
              protected void onActivityResult(
                      int requestCode,
                      int resultCode,
                      Intent data) {

                  super.onActivityResult(
                      requestCode,
                      resultCode,
                      data
                  );

                  if(
                      requestCode != REQUEST_FILE ||
                      filePathCallback == null
                  ) {
                      return;
                  }

                  Uri[] results = null;

                  if(
                      resultCode == RESULT_OK &&
                      data != null &&
                      data.getData() != null
                  ) {

                      results =
                          new Uri[]{
                              data.getData()
                          };
                  }

                  filePathCallback
                      .onReceiveValue(results);

                  filePathCallback = null;
              }

              @Override
              public void onBackPressed() {

                  if(
                      webView != null &&
                      webView.canGoBack()
                  ) {

                      webView.goBack();

                  } else {

                      super.onBackPressed();
                  }
              }

              @Override
              protected void onDestroy() {

                  if(webView != null) {

                      webView.stopLoading();

                      webView.destroy();

                      webView = null;
                  }

                  super.onDestroy();
              }
          }
          EOF


      - name: Validate Android project
        shell: bash
        run: |
          set -e

          test -s \
            mbms_android/settings.gradle

          test -s \
            mbms_android/build.gradle

          test -s \
            mbms_android/gradle.properties

          test -s \
            mbms_android/app/build.gradle

          test -s \
            mbms_android/app/src/main/AndroidManifest.xml

          test -s \
            mbms_android/app/src/main/java/com/mbms/app/MainActivity.java

          test -s \
            mbms_android/app/src/main/assets/index.html

          echo "ANDROID PROJECT FILES VERIFIED."


      - name: Verify generated Android project
        working-directory: mbms_android
        shell: bash
        run: |
          set -Eeuo pipefail

          test -f settings.gradle

          test -f build.gradle

          test -f gradle.properties

          test -f app/build.gradle

          test -f app/src/main/AndroidManifest.xml

          test -f app/src/main/java/com/mbms/app/MainActivity.java

          test -s app/src/main/assets/index.html

          echo "ANDROID PROJECT VERIFICATION PASSED."


      - name: Compile Android Java
        working-directory: mbms_android
        shell: bash
        run: |
          set -e

          for attempt in 1 2
          do

            echo \
              "Java compilation attempt $attempt/2"

            if gradle \
                --no-daemon \
                --stacktrace \
                :app:compileDebugJavaWithJavac
            then

              echo \
                "JAVA COMPILATION PASSED."

              exit 0

            fi

            if [ "$attempt" -lt 2 ]
            then
              echo \
                "Retrying Java compilation..."

              sleep 5
            fi

          done

          echo \
            "ERROR: Java compilation failed."

          exit 1


      - name: Build Final MBMS APK
        working-directory: mbms_android
        shell: bash
        run: |
          set -e

          for attempt in 1 2
          do

            echo \
              "APK build attempt $attempt/2"

            if gradle \
                --no-daemon \
                --stacktrace \
                clean \
                :app:assembleDebug
            then

              echo \
                "GRADLE APK BUILD PASSED."

              break

            fi

            if [ "$attempt" -lt 2 ]
            then

              echo \
                "APK build failed; retrying..."

              sleep 5

            else

              echo \
                "ERROR: APK build failed."

              exit 1

            fi

          done

          APK=
          "app/build/outputs/apk/debug/app-debug.apk"

          test -s \
            "app/build/outputs/apk/debug/app-debug.apk"

          cp \
            "app/build/outputs/apk/debug/app-debug.apk" \
            "../release/MBMS-V126-MB-SUMMARY-LINKED-STABLE.apk"

          ls -lh \
            "../release/MBMS-V126-MB-SUMMARY-LINKED-STABLE.apk"


      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK=
          "release/MBMS-V126-MB-SUMMARY-LINKED-STABLE.apk"

          test -s \
            "release/MBMS-V126-MB-SUMMARY-LINKED-STABLE.apk"

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify \
            --verbose \
            "release/MBMS-V126-MB-SUMMARY-LINKED-STABLE.apk"

          unzip -t \
            "release/MBMS-V126-MB-SUMMARY-LINKED-STABLE.apk" \
            >/dev/null

          sha256sum \
            "release/MBMS-V126-MB-SUMMARY-LINKED-STABLE.apk" \
            | tee release/SHA256.txt

          echo \
            "APK SIGNATURE AND ZIP VERIFICATION PASSED."


      - name: Upload APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: MBMS-V126-MB-SUMMARY-LINKED-STABLE

          path: |
            release/MBMS-V126-MB-SUMMARY-LINKED-STABLE.apk
            release/SHA256.txt

          if-no-files-found: error
