name: MBMS V118 Android APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    name: Build MBMS V118 APK
    runs-on: ubuntu-latest

    steps:

      # ---------------------------------------------------------
      # 1. Checkout
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v7

      # ---------------------------------------------------------
      # 2. Java
      # ---------------------------------------------------------
      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # ---------------------------------------------------------
      # 3. Android SDK
      # ---------------------------------------------------------
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      # ---------------------------------------------------------
      # 4. Install Gradle 8.7
      # ---------------------------------------------------------
      - name: Install Gradle 8.7
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip -d "$HOME/gradle"
          echo "$HOME/gradle/gradle-8.7/bin" >> "$GITHUB_PATH"
          gradle --version

      # ---------------------------------------------------------
      # 5. Locate MBMS HTML
      # ---------------------------------------------------------
      - name: Locate MBMS HTML
        shell: bash
        run: |
          set -e

          HTML=""

          for f in \
            "Measurement_Book_Management_System_FINAL_V118_PRINT_BACKUP_ANDROID.html" \
            "Measurement_Book_Management_System_FINAL_V115_MB_HISTORY_ONLY_DATE-6.html" \
            "Measurement_Book_Management_System_FINAL_V115.html" \
            "V115.html" \
            "index.html"
          do
            if [ -f "$f" ]; then
              HTML="$f"
              break
            fi
          done

          if [ -z "$HTML" ]; then
            HTML=$(find . -maxdepth 3 -type f -iname "*.html" | head -n 1 || true)
          fi

          if [ -z "$HTML" ]; then
            echo "ERROR: MBMS HTML file not found."
            exit 1
          fi

          echo "HTML_FILE=$HTML" >> "$GITHUB_ENV"
          echo "Using MBMS HTML: $HTML"

      # ---------------------------------------------------------
      # 6. Create V118 patch script
      # ---------------------------------------------------------
      - name: Create V118 patch script
        shell: bash
        run: |
          cat > patch_v118.py <<'PY'
          from pathlib import Path
          import sys

          src = Path(sys.argv[1])
          text = src.read_text(encoding="utf-8")

          original = text

          # =====================================================
          # PRINT TABLE CSS FIX
          # =====================================================

          old_css = """.a4-table{width:100%;border-collapse:collapse;font-size:10.5pt}
          .a4-table th,.a4-table td{border:1px solid #111;padding:3mm 2.5mm}
          .a4-table th{font-weight:800;text-align:center;background:#f1f1f1}
          .a4-table td:first-child{text-align:center;width:18mm}"""

          new_css = """.a4-table{width:100%;border-collapse:collapse;font-size:9.2pt;table-layout:fixed}
          .a4-table th,.a4-table td{border:1px solid #111;padding:2.5mm 1.8mm;vertical-align:top;overflow-wrap:anywhere;word-break:normal;line-height:1.25}
          .a4-table th{font-weight:800;text-align:center;background:#f1f1f1;vertical-align:middle}
          .a4-table td:first-child{text-align:center;width:14mm}
          .work-report-table th:nth-child(1),.work-report-table td:nth-child(1){width:9mm}
          .work-report-table th:nth-child(2),.work-report-table td:nth-child(2){width:31mm}
          .work-report-table th:nth-child(3),.work-report-table td:nth-child(3){width:28mm}
          .work-report-table th:nth-child(4),.work-report-table td:nth-child(4){width:27mm}
          .work-report-table th:nth-child(5),.work-report-table td:nth-child(5){width:23mm}
          .work-report-table th:nth-child(6),.work-report-table td:nth-child(6){width:19mm}
          .work-report-table th:nth-child(7),.work-report-table td:nth-child(7){width:22mm}
          .work-report-table th:nth-child(8),.work-report-table td:nth-child(8){width:23mm}"""

          if old_css in text:
              text = text.replace(old_css, new_css, 1)
              print("OK: print table CSS updated")
          elif "work-report-table th:nth-child(8)" in text:
              print("OK: print table CSS already updated")
          else:
              print("WARNING: print CSS block not found")

          # =====================================================
          # BACKUP RESTORE BUTTON
          # =====================================================

          old_button = """<button type="button" class="settings-tool-btn" onclick="document.getElementById('settingsBackupFile').click()">BACKUP RESTORE</button>"""

          new_button = """<button type="button" class="settings-tool-btn" onclick="startSettingsBackupRestore()">BACKUP RESTORE</button>"""

          if old_button in text:
              text = text.replace(old_button, new_button, 1)
              print("OK: restore button updated")

          # =====================================================
          # BACKUP FUNCTIONS
          # =====================================================

          old_backup = """function downloadSettingsBackup(){
            const data=JSON.stringify(mbmsSettingsSnapshot(),null,2);
            const blob=new Blob([data],{type:"application/json"});
            const url=URL.createObjectURL(blob);
            const a=document.createElement("a");a.href=url;a.download="MBMS_Backup_"+new Date().toISOString().slice(0,10)+".json";document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);
          }
          function restoreSettingsBackup(input){
            const file=input&&input.files&&input.files[0]; if(!file)return;
            const reader=new FileReader();
            reader.onload=function(){
              try{
                const obj=JSON.parse(reader.result);
                if(!obj||!obj.data||!Array.isArray(obj.data.mb)||!Array.isArray(obj.data.je)||!Array.isArray(obj.data.work)||!Array.isArray(obj.data.assignment)||!Array.isArray(obj.data.bills)||!Array.isArray(obj.data.transfer)) throw new Error("Invalid backup");
                const ok=confirm("Backup मधील पूर्ण data restore करायचा आहे का?\\n\\nसध्याचा MBMS data replace होईल.");
                if(!ok){input.value="";return;}
                saveMBs(obj.data.mb);saveJEs(obj.data.je);saveWorkList(obj.data.work);saveAssignments(obj.data.assignment);saveBills(obj.data.bills);saveTransferHistory(obj.data.transfer);
                try{renderMBSummary();}catch(e){}
                try{loadWorkOptions();renderWorkList();}catch(e){}
                try{loadAssignOptions();renderAssignments();}catch(e){}
                try{renderJEList();}catch(e){}
                refreshSettingsDataCheck();
                alert("Backup data यशस्वीपणे restore झाला आहे.");
              }catch(e){alert("ही valid MBMS backup file नाही.");}
              input.value="";
            };
            reader.readAsText(file);
          }"""

          new_backup = """function downloadSettingsBackup(){
            const data=JSON.stringify(mbmsSettingsSnapshot(),null,2);
            const filename="MBMS_Backup_"+new Date().toISOString().slice(0,10)+"_"+String(Date.now()).slice(-6)+".json";

            try{
              if(window.MBMSAndroid && typeof window.MBMSAndroid.saveBackup==="function"){
                window.MBMSAndroid.saveBackup(data,filename);
                return;
              }
            }catch(e){
              console.warn("Native backup save failed",e);
            }

            const blob=new Blob([data],{type:"application/json"});
            const url=URL.createObjectURL(blob);
            const a=document.createElement("a");
            a.href=url;
            a.download=filename;
            document.body.appendChild(a);
            a.click();
            a.remove();

            setTimeout(()=>URL.revokeObjectURL(url),1000);
          }

          function startSettingsBackupRestore(){
            try{
              if(window.MBMSAndroid && typeof window.MBMSAndroid.requestRestore==="function"){
                window.MBMSAndroid.requestRestore();
                return;
              }
            }catch(e){
              console.warn("Native restore picker failed",e);
            }

            const input=document.getElementById("settingsBackupFile");
            if(input) input.click();
          }

          function restoreSettingsBackupText(text,clearInput){
            try{
              const obj=JSON.parse(String(text||""));

              if(
                !obj ||
                !obj.data ||
                !Array.isArray(obj.data.mb) ||
                !Array.isArray(obj.data.je) ||
                !Array.isArray(obj.data.work) ||
                !Array.isArray(obj.data.assignment) ||
                !Array.isArray(obj.data.bills) ||
                !Array.isArray(obj.data.transfer)
              ){
                throw new Error("Invalid backup");
              }

              const ok=confirm(
                "Backup मधील पूर्ण data restore करायचा आहे का?\\n\\nसध्याचा MBMS data replace होईल."
              );

              if(!ok){
                if(clearInput) clearInput.value="";
                return false;
              }

              saveMBs(obj.data.mb);
              saveJEs(obj.data.je);
              saveWorkList(obj.data.work);
              saveAssignments(obj.data.assignment);
              saveBills(obj.data.bills);
              saveTransferHistory(obj.data.transfer);

              try{renderMBSummary();}catch(e){}
              try{loadWorkOptions();renderWorkList();}catch(e){}
              try{loadAssignOptions();renderAssignments();}catch(e){}
              try{renderJEList();}catch(e){}
              try{refreshSettingsDataCheck();}catch(e){}
              try{refreshSettingsAudit();}catch(e){}

              alert("Backup data यशस्वीपणे restore झाला आहे.");
              return true;

            }catch(e){
              alert("ही valid MBMS backup file नाही.");
              return false;
            }
          }

          function restoreSettingsBackup(input){
            const file=input&&input.files&&input.files[0];

            if(!file)return;

            const reader=new FileReader();

            reader.onload=function(){
              restoreSettingsBackupText(reader.result,input);
            };

            reader.readAsText(file);
          }"""

          if old_backup in text:
              text = text.replace(old_backup, new_backup, 1)
              print("OK: backup functions updated")
          elif "function startSettingsBackupRestore()" in text:
              print("OK: backup functions already updated")
          else:
              print("WARNING: old backup block not found")

          # =====================================================
          # WORK REPORT TABLE FIX
          # =====================================================

          old_report = """<div class="a4-meta"><span><b>Report :</b> ${selected==="ALL"?"\\u0938\\u0930\\u094D\\u0935 Work List":escapeHtml(data[0].name||"")}</span></div>
                <table class="a4-table">
                  <thead><tr><th>\\u0905.\\u0915\\u094D\\u0930.</th><th>\\u0915\\u093E\\u092E\\u093E\\u091A\\u0947 \\u0928\\u093E\\u0935</th><th>\\u0915\\u0949\\u0928\\u094D\\u091F\\u094D\\u0930\\u0945\\u0915\\u094D\\u091F\\u0930 / \\u090F\\u091C\\u0928\\u094D\\u0938\\u0940</th><th>JE \\u091A\\u0947 \\u0928\\u093E\\u0935</th><th>MB \\u0915\\u094D\\u0930\\u092E\\u093E\\u0902\\u0915</th></tr></thead>"""

          new_report = """<div class="a4-meta"><span><b>Report :</b> ${selected==="ALL"?"\\u0938\\u0930\\u094D\\u0935 Work List":escapeHtml(data[0].name||"")}</span><span><b>\\u0926\\u093F\\u0928\\u093E\\u0902\\u0915 :</b> ${new Date().toLocaleDateString("en-IN")}</span></div>
                <table class="a4-table work-report-table">
                  <thead><tr><th>\\u0905.\\u0915\\u094D\\u0930.</th><th>\\u0915\\u093E\\u092E\\u093E\\u091A\\u0947 \\u0928\\u093E\\u0935</th><th>\\u0915\\u0949\\u0928\\u094D\\u091F\\u094D\\u0930\\u0945\\u0915\\u094D\\u091F\\u0930 / \\u090F\\u091C\\u0928\\u094D\\u0938\\u0940</th><th>JE \\u091A\\u0947 \\u0928\\u093E\\u0935</th><th>MB \\u0915\\u094D\\u0930\\u092E\\u093E\\u0902\\u0915</th><th>\\u0915\\u093E\\u092E \\u092A\\u0942\\u0930\\u094D\\u0923?</th><th>Bill \\u092A\\u094D\\u0930\\u0915\\u093E\\u0930</th><th>Bill \\u0930\\u0915\\u094D\\u0915\\u092E (₹)</th></tr></thead>"""

          if old_report in text:
              text = text.replace(old_report, new_report, 1)
              print("OK: Work Report columns updated")
          elif "work-report-table" in text:
              print("OK: Work Report already updated")
          else:
              print("WARNING: Work Report block not found")

          # =====================================================
          # ANDROID NATIVE COMPATIBILITY
          # =====================================================

          marker = "V118_ANDROID_NATIVE_IO_PRINT_COMPAT"

          if marker not in text:

              native_js = r'''
          <!-- V118_ANDROID_NATIVE_IO_PRINT_COMPAT -->
          <script id="V118_ANDROID_NATIVE_IO_PRINT_COMPAT">
          (function(){
            "use strict";

            window.mbmsNativeRestoreBase64=function(b64){
              try{
                var raw=atob(String(b64||""));
                var bytes=new Uint8Array(raw.length);

                for(var i=0;i<raw.length;i++){
                  bytes[i]=raw.charCodeAt(i);
                }

                var json=new TextDecoder("utf-8").decode(bytes);

                if(typeof restoreSettingsBackupText==="function"){
                  restoreSettingsBackupText(json,null);
                }

              }catch(e){
                alert("Backup Restore करण्यात अडचण आली.");
                console.error(e);
              }
            };

            var oldPrint=window.print;

            window.print=function(){
              try{
                if(
                  window.MBMSAndroid &&
                  typeof window.MBMSAndroid.print==="function"
                ){
                  window.MBMSAndroid.print();
                  return;
                }
              }catch(e){
                console.warn("Native print failed",e);
              }

              if(typeof oldPrint==="function"){
                oldPrint.call(window);
              }
            };

          })();
          </script>
          '''

              text = text.replace("</body>", native_js + "\n</body>", 1)
              print("OK: Android native bridge added")

          # =====================================================
          # VERSION LABEL
          # =====================================================

          text = text.replace(
              '<span>V55</span>',
              '<span>V118 Android</span>',
              1
          )

          # =====================================================
          # SAVE
          # =====================================================

          if text == original:
              print("WARNING: No changes made to HTML")
          else:
              src.write_text(text,encoding="utf-8")
              print("SUCCESS: V118 HTML generated:",src)

          PY

      # ---------------------------------------------------------
      # 7. Apply V118 update
      # ---------------------------------------------------------
      - name: Apply V118 Print Backup Android update
        shell: bash
        run: |
          set -e

          mkdir -p mbms_source

          cp "$HTML_FILE" mbms_source/index.html

          python3 patch_v118.py mbms_source/index.html

          test -s mbms_source/index.html

          echo "HTML size:"
          wc -c mbms_source/index.html

          echo "Checking important V118 features..."

          grep -q "work-report-table" mbms_source/index.html
          grep -q "startSettingsBackupRestore" mbms_source/index.html
          grep -q "restoreSettingsBackupText" mbms_source/index.html
          grep -q "V118_ANDROID_NATIVE_IO_PRINT_COMPAT" mbms_source/index.html

          echo "V118 feature checks PASSED."

      # ---------------------------------------------------------
      # 8. Create Android project
      # ---------------------------------------------------------
      - name: Create Android project
        shell: bash
        run: |
          set -e

          rm -rf mbms_android

          mkdir -p mbms_android/app/src/main/java/com/mbms/app
          mkdir -p mbms_android/app/src/main/res/values
          mkdir -p mbms_android/app/src/main/assets

          cp mbms_source/index.html \
             mbms_android/app/src/main/assets/index.html

          cat > mbms_android/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "MBMSAndroid"
          include(":app")
          EOF

          cat > mbms_android/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF

          cat > mbms_android/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat > mbms_android/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.mbms.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.mbms.app'
                  minSdk 26
                  targetSdk 35
                  versionCode 118
                  versionName 'V118'
              }

              buildTypes {
                  debug {
                      minifyEnabled false
                  }

                  release {
                      minifyEnabled false
                      shrinkResources false
                  }
              }
          }
          EOF

          cat > mbms_android/app/proguard-rules.pro <<'EOF'
          # MBMS - no custom ProGuard rules required
          EOF

          cat > mbms_android/app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">Measurement Book Management System</string>
          </resources>
          EOF

          cat > mbms_android/app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#1976D2</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:navigationBarColor">#0D47A1</item>
                  <item name="android:statusBarColor">#1565C0</item>
              </style>
          </resources>
          EOF

          cat > mbms_android/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"
                  android:maxSdkVersion="28" />

              <application
                  android:allowBackup="true"
                  android:usesCleartextTraffic="true"
                  android:label="@string/app_name"
                  android:theme="@style/AppTheme"
                  android:supportsRtl="true">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>

              </application>
          </manifest>
          EOF

      # ---------------------------------------------------------
      # 9. MainActivity - Native Print + Backup + Restore
      # ---------------------------------------------------------
      - name: Create MainActivity
        shell: bash
        run: |
          cat > mbms_android/app/src/main/java/com/mbms/app/MainActivity.java <<'EOF'
          package com.mbms.app;

          import android.Manifest;
          import android.app.Activity;
          import android.content.ContentResolver;
          import android.content.ContentValues;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Environment;
          import android.provider.MediaStore;
          import android.print.PrintAttributes;
          import android.print.PrintManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Toast;

          import androidx.annotation.Nullable;
          import androidx.appcompat.app.AppCompatActivity;

          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.InputStream;
          import java.io.OutputStream;
          import java.nio.charset.StandardCharsets;
          import java.util.Base64;

          public class MainActivity extends Activity {

              private WebView webView;

              private static final int REQUEST_RESTORE = 7001;
              private static final int REQUEST_STORAGE = 7002;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  getWindow().setStatusBarColor(Color.rgb(21, 101, 192));
                  getWindow().setNavigationBarColor(Color.rgb(13, 71, 161));

                  webView = new WebView(this);

                  WebSettings settings = webView.getSettings();

                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);
                  settings.setJavaScriptCanOpenWindowsAutomatically(true);
                  settings.setSupportMultipleWindows(false);
                  settings.setBuiltInZoomControls(false);
                  settings.setDisplayZoomControls(false);

                  webView.setBackgroundColor(Color.WHITE);

                  webView.setWebViewClient(new WebViewClient());

                  webView.setWebChromeClient(new WebChromeClient());

                  webView.addJavascriptInterface(
                          new MBMSAndroidBridge(),
                          "MBMSAndroid"
                  );

                  setContentView(webView);

                  webView.loadUrl(
                          "file:///android_asset/index.html"
                  );
              }

              // --------------------------------------------------
              // Android bridge
              // --------------------------------------------------

              public class MBMSAndroidBridge {

                  @JavascriptInterface
                  public void saveBackup(
                          String json,
                          String filename
                  ) {
                      runOnUiThread(() -> {
                          saveBackupFile(json, filename);
                      });
                  }

                  @JavascriptInterface
                  public void requestRestore() {
                      runOnUiThread(() -> {
                          Intent intent = new Intent(Intent.ACTION_OPEN_DOCUMENT);
                          intent.addCategory(Intent.CATEGORY_OPENABLE);
                          intent.setType("application/json");
                          startActivityForResult(intent, REQUEST_RESTORE);
                      });
                  }

                  @JavascriptInterface
                  public void print() {
                      runOnUiThread(() -> {
                          printMBMS();
                      });
                  }
              }

              // --------------------------------------------------
              // BACKUP SAVE
              // --------------------------------------------------

              private void saveBackupFile(
                      String json,
                      String filename
              ) {

                  try {

                      if (filename == null || filename.trim().isEmpty()) {
                          filename =
                                  "MBMS_Backup_" +
                                  System.currentTimeMillis() +
                                  ".json";
                      }

                      if (!filename.toLowerCase().endsWith(".json")) {
                          filename += ".json";
                      }

                      byte[] data =
                              json.getBytes(StandardCharsets.UTF_8);

                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {

                          ContentResolver resolver =
                                  getContentResolver();

                          ContentValues values =
                                  new ContentValues();

                          values.put(
                                  MediaStore.Downloads.DISPLAY_NAME,
                                  filename
                          );

                          values.put(
                                  MediaStore.Downloads.MIME_TYPE,
                                  "application/json"
                          );

                          values.put(
                                  MediaStore.Downloads.RELATIVE_PATH,
                                  Environment.DIRECTORY_DOWNLOADS
                          );

                          Uri uri =
                                  resolver.insert(
                                          MediaStore.Downloads.EXTERNAL_CONTENT_URI,
                                          values
                                  );

                          if (uri == null) {
                              throw new Exception(
                                      "Downloads URI unavailable"
                              );
                          }

                          try (
                                  OutputStream out =
                                          resolver.openOutputStream(uri)
                          ) {
                              if (out == null) {
                                  throw new Exception(
                                          "Output stream unavailable"
                                  );
                              }

                              out.write(data);
                              out.flush();
                          }

                      } else {

                          if (
                                  Build.VERSION.SDK_INT >=
                                  Build.VERSION_CODES.M &&
                                  checkSelfPermission(
                                          Manifest.permission.WRITE_EXTERNAL_STORAGE
                                  ) != PackageManager.PERMISSION_GRANTED
                          ) {

                              requestPermissions(
                                      new String[]{
                                              Manifest.permission.WRITE_EXTERNAL_STORAGE
                                      },
                                      REQUEST_STORAGE
                              );

                              Toast.makeText(
                                      this,
                                      "Storage permission आवश्यक आहे. पुन्हा BACKUP SAVE करा.",
                                      Toast.LENGTH_LONG
                              ).show();

                              return;
                          }

                          File downloads =
                                  Environment.getExternalStoragePublicDirectory(
                                          Environment.DIRECTORY_DOWNLOADS
                                  );

                          if (!downloads.exists()) {
                              downloads.mkdirs();
                          }

                          File file =
                                  new File(downloads, filename);

                          try (
                                  FileOutputStream out =
                                          new FileOutputStream(file)
                          ) {
                              out.write(data);
                              out.flush();
                          }
                      }

                      Toast.makeText(
                              this,
                              "Backup Downloads मध्ये सेव्ह झाला.",
                              Toast.LENGTH_LONG
                      ).show();

                  } catch (Exception e) {

                      Toast.makeText(
                              this,
                              "Backup Save मध्ये त्रुटी: " +
                                      e.getMessage(),
                              Toast.LENGTH_LONG
                      ).show();
                  }
              }

              // --------------------------------------------------
              // BACKUP RESTORE
              // --------------------------------------------------

              @Override
              protected void onActivityResult(
                      int requestCode,
                      int resultCode,
                      @Nullable Intent data
              ) {

                  super.onActivityResult(
                          requestCode,
                          resultCode,
                          data
                  );

                  if (
                          requestCode == REQUEST_RESTORE &&
                          resultCode == RESULT_OK &&
                          data != null &&
                          data.getData() != null
                  ) {

                      Uri uri = data.getData();

                      try {

                          String json =
                                  readTextFromUri(uri);

                          String base64 =
                                  Base64.getEncoder().encodeToString(
                                          json.getBytes(
                                                  StandardCharsets.UTF_8
                                          )
                                  );

                          String js =
                                  "window.mbmsNativeRestoreBase64(" +
                                  "'" +
                                  base64.replace("'", "\\'") +
                                  "'" +
                                  ");";

                          webView.evaluateJavascript(
                                  js,
                                  null
                          );

                      } catch (Exception e) {

                          Toast.makeText(
                                  this,
                                  "Backup Restore मध्ये त्रुटी: " +
                                          e.getMessage(),
                                  Toast.LENGTH_LONG
                          ).show();
                      }
                  }
              }

              private String readTextFromUri(Uri uri)
                      throws Exception {

                  StringBuilder builder =
                          new StringBuilder();

                  try (
                          InputStream input =
                                  getContentResolver()
                                          .openInputStream(uri)
                  ) {

                      if (input == null) {
                          throw new Exception(
                                  "File open झाली नाही"
                          );
                      }

                      byte[] buffer =
                              new byte[8192];

                      int count;

                      while (
                              (count = input.read(buffer)) != -1
                      ) {

                          builder.append(
                                  new String(
                                          buffer,
                                          0,
                                          count,
                                          StandardCharsets.UTF_8
                                  )
                          );
                      }
                  }

                  return builder.toString();
              }

              // --------------------------------------------------
              // NATIVE PRINT
              // --------------------------------------------------

              private void printMBMS() {

                  try {

                      if (webView == null) {
                          return;
                      }

                      PrintManager printManager =
                              (PrintManager)
                                      getSystemService(
                                              PRINT_SERVICE
                                      );

                      if (printManager == null) {
                          throw new Exception(
                                  "Print service unavailable"
                          );
                      }

                      String jobName =
                              "MBMS Report";

                      android.print.PrintDocumentAdapter adapter =
                              webView.createPrintDocumentAdapter(
                                      jobName
                              );

                      printManager.print(
                              jobName,
                              adapter,
                              new PrintAttributes.Builder()
                                      .setMediaSize(
                                              PrintAttributes.MediaSize.ISO_A4
                                      )
                                      .setResolution(
                                              new PrintAttributes.Resolution(
                                                      "mbms",
                                                      "MBMS",
                                                      300,
                                                      300
                                              )
                                      )
                                      .setMinMargins(
                                              PrintAttributes.Margins.NO_MARGINS
                                      )
                                      .build()
                      );

                  } catch (Exception e) {

                      Toast.makeText(
                              this,
                              "Print सुरू करता आला नाही: " +
                                      e.getMessage(),
                              Toast.LENGTH_LONG
                      ).show();
                  }
              }

              // --------------------------------------------------
              // Android BACK button
              // --------------------------------------------------

              @Override
              public void onBackPressed() {

                  if (
                          webView != null &&
                          webView.canGoBack()
                  ) {

                      webView.goBack();

                  } else {

                      super.onBackPressed();
                  }
              }
          }
