import android.print.PrintManager;
import android.webkit.JsResult;
import android.webkit.JavascriptInterface;
import android.webkit.ValueCallback;
import android.webkit.WebChromeClient;
import android.webkit.WebSettings;
import android.webkit.WebView;
import android.webkit.WebViewClient;
import android.widget.Toast;
​import java.io.BufferedReader;
import java.io.File;
import java.io.FileOutputStream;
import java.io.InputStream;
import java.io.InputStreamReader;
import java.io.OutputStream;
import java.nio.charset.StandardCharsets;
​public class MainActivity extends Activity {
​private static final int FILE_CHOOSER_REQ = 8002;
private WebView webView;
private ValueCallback<Uri[]> filePathCallback;
​@Override
protected void onCreate(Bundle savedInstanceState) {
super.onCreate(savedInstanceState);
​webView = new WebView(this);
setContentView(webView);
​WebSettings settings = webView.getSettings();
settings.setJavaScriptEnabled(true);
settings.setDomStorageEnabled(true);
settings.setDatabaseEnabled(true);
settings.setAllowFileAccess(true);
settings.setAllowContentAccess(true);
settings.setTextZoom(100);
​AndroidBridge bridge = new AndroidBridge();
webView.addJavascriptInterface(bridge, "MBMSAndroid");
webView.addJavascriptInterface(bridge, "AndroidBridge");
​webView.setWebChromeClient(new WebChromeClient() {
@Override
public boolean onJsAlert(WebView view, String url, String message, final JsResult result) {
new AlertDialog.Builder(MainActivity.this)
.setTitle("MBMS")
.setMessage(message)
.setPositiveButton("OK", new DialogInterface.OnClickListener() {
public void onClick(DialogInterface dialog, int which) {
result.confirm();
}
})
.setCancelable(false)
.create()
.show();
return true;
}
​@Override
public boolean onJsConfirm(WebView view, String url, String message, final JsResult result) {
new AlertDialog.Builder(MainActivity.this)
.setTitle("खात्री करा")
.setMessage(message)
.setPositiveButton("होय", new DialogInterface.OnClickListener() {
public void onClick(DialogInterface dialog, int which) {
result.confirm();
}
})
.setNegativeButton("नाही", new DialogInterface.OnClickListener() {
public void onClick(DialogInterface dialog, int which) {
result.cancel();
}
})
.setCancelable(false)
.create()
.show();
return true;
}
​@Override
public boolean onShowFileChooser(WebView view, ValueCallback<Uri[]> callback, FileChooserParams params) {
if (filePathCallback != null) filePathCallback.onReceiveValue(null);
filePathCallback = callback;
Intent intent = new Intent(Intent.ACTION_GET_CONTENT);
intent.setType("/");
intent.addCategory(Intent.CATEGORY_OPENABLE);
startActivityForResult(Intent.createChooser(intent, "बॅकअप फाईल निवडा"), FILE_CHOOSER_REQ);
return true;
}
});
​webView.setWebViewClient(new WebViewClient() {
