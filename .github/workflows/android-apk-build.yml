            );

            const billType=
              document.getElementById(
                'homeRelBillType'
              );

            if(billType){
              billType.style.display='none';
            }

            window.mbmsV127SummaryFixLoaded=
              true;

          })();
          PATCH_JS

          python3 <<'PY'
          from pathlib import Path

          html_path = Path(
              "mbms_work/index.html"
          )

          patch_path = Path(
              "/tmp/mbms_summary_patch.js"
          )

          text = html_path.read_text(
              encoding="utf-8"
          )

          patch = patch_path.read_text(
              encoding="utf-8"
          ).rstrip()

          if "</script>" in patch.lower():
              raise SystemExit(
                  "ERROR: MB Summary patch contains unsafe </script>."
              )

          marker = "</body>"

          pos = text.lower().rfind(
              marker.lower()
          )

          if pos < 0:
              raise SystemExit(
                  "ERROR: </body> marker not found."
              )

          script_block = (
              '<script id="V127_MBMS_SUMMARY_LINKED_FIX">\n'
              + patch
              + '\n</script>\n'
          )

          text = (
              text[:pos]
              + script_block
              + text[pos:]
          )

          required = [
              "loadHomeRelDetailsV124",
              "showHomeRelationshipV124",
              "printLinkedRelationshipReport",
              "__SMALL_MB__",
              "__LARGE_MB__"
          ]

          for item in required:
              if item not in text:
                  raise SystemExit(
                      "ERROR: Missing MB Summary marker: "
                      + item
                  )

          html_path.write_text(
              text,
              encoding="utf-8"
          )

          print(
              "MB SUMMARY PATCH APPLIED."
          )

          print(
              "NO BASE64 USED."
          )

          print(
              "MB SUMMARY PATCH IS INSIDE <script>."
          )

          PY

      - name: Verify MB Summary Patch Placement
        shell: bash
        run: |
          set -Eeuo pipefail

          python3 <<'PY'
          from pathlib import Path

          text = Path(
              "mbms_work/index.html"
          ).read_text(
              encoding="utf-8"
          )

          opening = (
              '<script id="V127_MBMS_SUMMARY_LINKED_FIX">'
          )

          closing = "</script>"

          start_pos = text.find(
              opening
          )

          if start_pos < 0:
              raise SystemExit(
                  "ERROR: V127 MB Summary opening tag not found."
              )

          start =
          start_pos + len(opening)

          finish = text.find(
              closing,
              start
          )

          if finish < 0:
              raise SystemExit(
                  "ERROR: V127 MB Summary closing tag not found."
              )

          body = text[
              start:finish
          ]

          required = [
              "loadHomeRelDetailsV124",
              "showHomeRelationshipV124",
              "printLinkedRelationshipReport",
              "__SMALL_MB__",
              "__LARGE_MB__"
          ]

          missing = [
              x for x in required
              if x not in body
          ]

          if missing:
              raise SystemExit(
                  "ERROR: Missing MB Summary code: "
                  + ", ".join(missing)
              )

          if (
              "base64.b64decode" in text or
              "Incorrect padding" in text
          ):
              raise SystemExit(
                  "ERROR: Old broken Base64 patch detected."
              )

          print(
              "MB SUMMARY SCRIPT PLACEMENT VERIFIED."
          )

          print(
              "V127 MB Summary patch is inside executable <script>."
          )

          print(
              "NO BASE64 PATCH IS USED."
          )
          PY

      - name: Validate Final HTML JavaScript
        shell: bash
        run: |
          set -Eeuo pipefail

          python3 <<'PY'
          from pathlib import Path
          import re

          html = Path(
              "mbms_work/index.html"
          )

          text = html.read_text(
              encoding="utf-8"
          )

          scripts = re.findall(
              r"<script[^>]*>(.*?)</script>",
              text,
              flags=re.I | re.S
          )

          if not scripts:
              raise SystemExit(
                  "ERROR: No JavaScript blocks found."
              )

          for i, script in enumerate(scripts):

              Path(
                  f"/tmp/mbms_script_{i}.js"
              ).write_text(
                  script,
                  encoding="utf-8"
              )

          print(
              f"Extracted {len(scripts)} JavaScript blocks."
          )
          PY

          for f in /tmp/mbms_script_*.js
          do
            echo "Checking JavaScript: $f"
            node --check "$f"
          done

          test "$(grep -oi '</body>' mbms_work/index.html | wc -l)" -ge 1
          test "$(grep -oi '</html>' mbms_work/index.html | wc -l)" -ge 1

          echo "FINAL HTML JAVASCRIPT VALIDATION PASSED."

