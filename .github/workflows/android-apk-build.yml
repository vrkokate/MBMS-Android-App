name: MBMS Final APK - M.B. Summary Linked Final

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:

  build:
    name: Build Final MBMS APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'


      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      - name: Install Android SDK 35
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"


      - name: Install Gradle 8.7
        shell: bash
        run: |
          set -e

          wget -q \
            https://services.gradle.org/distributions/gradle-8.7-bin.zip

          mkdir -p "$HOME/gradle"

          unzip -q \
            gradle-8.7-bin.zip \
            -d "$HOME/gradle"

          echo "$HOME/gradle/gradle-8.7/bin" >> "$GITHUB_PATH"

          "$HOME/gradle/gradle-8.7/bin/gradle" --version


      - name: Verify Java and Gradle
        shell: bash
        run: |
          set -e

          java -version
          gradle --version


      - name: Find MBMS HTML
        shell: bash
        run: |
          set -e

          HTML_FILE=""

          for f in \
            "Measurement_Book_Management_System_FINAL_V120_TRANSFER_REPORT_FINAL.html" \
            "Measurement_Book_Management_System_FINAL_V118_PRINT_BACKUP_ANDROID.html" \
            "Measurement_Book_Management_System_FINAL_V115_MB_HISTORY_ONLY_DATE-6.html" \
            "Measurement_Book_Management_System_FINAL_V115_MB_HISTORY_ONLY_DATE.html" \
            "Measurement_Book_Management_System_FINAL_V115.html" \
            "V115.html" \
            "index.html"
          do
            if [ -f "$f" ]; then
              HTML_FILE="$f"
              break
            fi
          done

          if [ -z "$HTML_FILE" ]; then
            HTML_FILE=$(find . \
              -maxdepth 3 \
              -type f \
              -iname "*.html" \
              -not -path "./.git/*" \
              | head -n 1 || true)
          fi

          if [ -z "$HTML_FILE" ]; then
            echo "ERROR: MBMS HTML file not found."
            exit 1
          fi

          echo "HTML_FILE=$HTML_FILE" >> "$GITHUB_ENV"

          echo "Using HTML:"
          echo "$HTML_FILE"


      - name: Prepare Final MBMS HTML
        shell: bash
        run: |
          set -e

          mkdir -p mbms_work

          cp \
            "$HTML_FILE" \
            mbms_work/index.html

          test -s mbms_work/index.html

          echo "HTML size:"
          wc -c mbms_work/index.html


      - name: Apply ONLY Received JE List Correction
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path

          p = Path("mbms_work/index.html")

          text = p.read_text(encoding="utf-8")

          old1 = (
              "if(isJE){loadTransferJEs();"
              "if(je){je.value=sourceName;je.disabled=true;}}"
          )

          new1 = (
              "if(isJE){loadTransferJEs();"
              "if(je){je.value=sourceName;je.disabled=false;}}"
          )

          if old1 in text:
              text = text.replace(old1, new1, 1)
              print("Correction 1 applied.")

          old2 = "if(isJE&&je)je.disabled=true;"
          new2 = "if(isJE&&je)je.disabled=false;"

          if old2 in text:
              text = text.replace(old2, new2, 1)
              print("Correction 2 applied.")

          p.write_text(text, encoding="utf-8")

          print("ONLY JE LIST CORRECTION COMPLETED.")

          PY


      - name: Verify JE Selection Correction
        shell: bash
        run: |
          set -e

          HTML="mbms_work/index.html"

          test -s "$HTML"

          grep -q "loadTransferJEs" "$HTML"
          grep -q "transferFromJEName" "$HTML"
          grep -q "je.disabled=false" "$HTML"

          echo "JE SELECTION CORRECTION VERIFIED."


      - name: Apply ONLY MB Summary Linked Detail Fix
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path

          p = Path("mbms_work/index.html")
          text = p.read_text(encoding="utf-8")

          patch = r'''
          <script id="mbms-v124-summary-linked-fix">
          (function(){

            "use strict";

            /*
             * MBMS V124
             *
             * ONLY MB SUMMARY LINKED DETAIL FIX
             *
             * No existing data is deleted.
             * No existing storage is cleared.
             * No other MBMS tab is intentionally modified.
             */


            function getAllMBMSData(){

              const result = {
                mbs: [],
                jes: [],
                works: [],
                contractors: [],
                bills: [],
                transfers: []
              };


              try{

                if(Array.isArray(window.mbmsData?.mbs))
                  result.mbs = window.mbmsData.mbs;

              }catch(e){}


              try{

                if(Array.isArray(window.mbs))
                  result.mbs = window.mbs;

              }catch(e){}


              try{

                if(Array.isArray(window.jes))
                  result.jes = window.jes;

              }catch(e){}


              try{

                if(Array.isArray(window.works))
                  result.works = window.works;

              }catch(e){}


              try{

                if(Array.isArray(window.contractors))
                  result.contractors = window.contractors;

              }catch(e){}


              try{

                if(Array.isArray(window.bills))
                  result.bills = window.bills;

              }catch(e){}


              try{

                if(Array.isArray(window.transfers))
                  result.transfers = window.transfers;

              }catch(e){}


              return result;

            }


            function textValue(v){

              if(v === null || v === undefined)
                return "";

              return String(v).trim();

            }


            function firstValue(obj, keys){

              if(!obj)
                return "";

              for(const key of keys){

                if(
                  obj[key] !== undefined &&
                  obj[key] !== null &&
                  String(obj[key]).trim() !== ""
                ){

                  return String(obj[key]).trim();

                }

              }

              return "";

            }


            function getMBNumber(m){

              return firstValue(
                m,
                [
                  "number",
                  "mbNumber",
                  "mbNo",
                  "mb",
                  "क्रमांक"
                ]
              );

            }


            function getMBSize(m){

              return firstValue(
                m,
                [
                  "size",
                  "mbSize",
                  "type",
                  "mbType",
                  "प्रकार"
                ]
              );

            }


            function getWorkName(w){

              return firstValue(
                w,
                [
                  "workName",
                  "name",
                  "work",
                  "कामाचे नाव"
                ]
              );

            }


            function getJEName(j){

              return firstValue(
                j,
                [
                  "name",
                  "jeName",
                  "juniorEngineer",
                  "जेई",
                  "juniorEngineerName"
                ]
              );

            }


            function getContractorName(c){

              return firstValue(
                c,
                [
                  "name",
                  "contractorName",
                  "agencyName",
                  "contractor",
                  "कंत्राटदार"
                ]
              );

            }


            function getBillType(b){

              return firstValue(
                b,
                [
                  "billType",
                  "type",
                  "billName",
                  "बिल प्रकार"
                ]
              );

            }


            function getBillNumber(b){

              return firstValue(
                b,
                [
                  "billNumber",
                  "billNo",
                  "number",
                  "बिल क्रमांक"
                ]
              );

            }


            function linkedValue(obj, keys){

              return firstValue(obj, keys);

            }


            function findMB(data, number){

              const target =
                textValue(number);

              return data.mbs.filter(
                m =>
                  getMBNumber(m) === target
              );

            }


            function linkedMBNumbers(data, criteria){

              const numbers = new Set();

              data.mbs.forEach(
                m => {

                  const no =
                    getMBNumber(m);

                  if(no)
                    numbers.add(no);

                }
              );


              return [...numbers];

            }


            function createSummaryObject(){

              const data =
                getAllMBMSData();


              const result = {

                totalMB: data.mbs.length,

                smallMB:
                  data.mbs.filter(
                    m =>
                      /small|लहान/i.test(
                        getMBSize(m)
                      )
                  ).length,

                bigMB:
                  data.mbs.filter(
                    m =>
                      /big|large|मोठ/i.test(
                        getMBSize(m)
                      )
                  ).length,

                totalJE:
                  data.jes.length,

                totalWorks:
                  data.works.length,

                totalContractors:
                  data.contractors.length,

                totalBills:
                  data.bills.length

              };


              return result;

            }


            function buildDetailReport(type, selectedValue){

              const data =
                getAllMBMSData();


              const report = {

                type: type,

                selected:
                  selectedValue,

                summary:
                  createSummaryObject(),

                mb: [],

                je: [],

                work: [],

                contractor: [],

                bills: [],

                transfers: []

              };


              if(type === "MB"){

                report.mb =
                  findMB(
                    data,
                    selectedValue
                  );

              }


              if(type === "JE"){

                report.je =
                  data.jes.filter(
                    j =>
                      getJEName(j) ===
                      selectedValue
                  );

              }


              if(type === "WORK"){

                report.work =
                  data.works.filter(
                    w =>
                      getWorkName(w) ===
                      selectedValue
                  );

              }


              if(type === "CONTRACTOR"){

                report.contractor =
                  data.contractors.filter(
                    c =>
                      getContractorName(c) ===
                      selectedValue
                  );

              }


              if(type === "BILL"){

                report.bills =
                  data.bills.filter(
                    b =>
                      getBillType(b) ===
                      selectedValue ||
                      getBillNumber(b) ===
                      selectedValue
                  );

              }


              return report;

            }


            function exposeAPI(){

              window.MBMS_V124_Summary = {

                getData:
                  getAllMBMSData,

                getSummary:
                  createSummaryObject,

                buildReport:
                  buildDetailReport

              };

            }


            exposeAPI();


            /*
             * MB Summary helper:
             *
             * M.B. -> All / Small / Big
             */

            window.MBMS_V124_getMBByType =
              function(type){

                const data =
                  getAllMBMSData();

                const value =
                  textValue(type).toLowerCase();


                if(
                  value === "small" ||
                  value === "small mb" ||
                  value.includes("लहान")
                ){

                  return data.mbs.filter(
                    m =>
                      /small|लहान/i.test(
                        getMBSize(m)
                      )
                  );

                }


                if(
                  value === "big" ||
                  value === "large" ||
                  value === "big mb" ||
                  value.includes("मोठ")
                ){

                  return data.mbs.filter(
                    m =>
                      /big|large|मोठ/i.test(
                        getMBSize(m)
                      )
                  );

                }


                return data.mbs;

              };


            /*
             * Full linked information.
             *
             * Existing records are READ ONLY here.
             * Nothing is removed or overwritten.
             */

            window.MBMS_V124_getLinkedInformation =
              function(){

                const data =
                  getAllMBMSData();


                return {

                  juniorEngineers:
                    data.jes,

                  measurementBooks:
                    data.mbs,

                  works:
                    data.works,

                  contractors:
                    data.contractors,

                  bills:
                    data.bills,

                  transfers:
                    data.transfers

                };

              };


            console.log(
              "MBMS V124 MB Summary Linked Detail Fix loaded."
            );

          })();
          </script>
          '''


          marker = "</body>"

          lower = text.lower()

          pos =
              lower.rfind(
                marker.lower()
              )


          if pos < 0:

              text += patch

          else:

              text = (
                  text[:pos]
                  +
                  patch
                  +
                  "\n"
                  +
                  text[pos:]
              )


          p.write_text(
            text,
            encoding="utf-8"
          )


          required = [
            "mbms-v124-summary-linked-fix",
            "MBMS_V124_Summary",
            "MBMS_V124_getMBByType",
            "MBMS_V124_getLinkedInformation"
          ]


          for item in required:

            if item not in text:

              raise SystemExit(
                "ERROR: MB Summary patch missing: "
                + item
              )


          print(
            "ONLY MB SUMMARY LINKED DETAIL FIX APPLIED."
          )

          PY


      - name: Verify Final MBMS HTML
        shell: bash
        run: |
          set -e

          HTML="mbms_work/index.html"

          test -s "$HTML"

          grep -q "<html" "$HTML"

          grep -q \
            "mbmsSettingsSnapshot" \
            "$HTML"

          grep -q \
            "downloadSettingsBackup" \
            "$HTML"

          grep -q \
            "restoreSettingsBackup" \
            "$HTML"

          grep -q \
            "loadTransferJEs" \
            "$HTML"

          grep -q \
            "mbms-v124-summary-linked-fix" \
            "$HTML"

          grep -q \
            "MBMS_V124_Summary" \
            "$HTML"

          grep -q \
            "MBMS_V124_getMBByType" \
            "$HTML"

          grep -q \
            "MBMS_V124_getLinkedInformation" \
            "$HTML"

          echo "FINAL MBMS HTML VALIDATION PASSED."

          wc -c "$HTML"


      - name: Create Android project
        shell: bash
        run: |
          set -e

          rm -rf \
            mbms_android \
            release

          mkdir -p \
            mbms_android/app/src/main/assets \
            mbms_android/app/src/main/java/com/mbms/app \
            mbms_android/app/src/main/res/values \
            release

          cp \
            mbms_work/index.html \
            mbms_android/app/src/main/assets/index.html


          cat > mbms_android/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(
                  RepositoriesMode.FAIL_ON_PROJECT_REPOS
              )

              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "MBMSAndroid"

          include(":app")
          EOF


          cat > mbms_android/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF


          cat > mbms_android/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=false
          android.nonTransitiveRClass=true
          EOF


          cat > mbms_android/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {

              namespace 'com.mbms.app'

              compileSdk 35

              defaultConfig {

                  applicationId 'com.mbms.app'

                  minSdk 26

                  targetSdk 35

                  versionCode 124

                  versionName 'V124'
              }

              buildTypes {

                  debug {

                      minifyEnabled false

                      shrinkResources false
                  }

                  release {

                      minifyEnabled false

                      shrinkResources false
                  }
              }

              compileOptions {

                  sourceCompatibility JavaVersion.VERSION_17

                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF


          cat > mbms_android/app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">MBMS</string>
          </resources>
          EOF


          cat > mbms_android/app/src/main/res/values/styles.xml <<'EOF'
          <resources>

              <style
                  name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">

                  <item name="android:fontFamily">
                      sans
                  </item>

                  <item name="android:colorAccent">
                      #1976D2
                  </item>

                  <item name="android:navigationBarColor">
                      #06458E
                  </item>

              </style>

          </resources>
          EOF


          cat > mbms_android/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest
              xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission
                  android:name="android.permission.INTERNET" />

              <uses-permission
                  android:name="android.permission.WRITE_EXTERNAL_STORAGE"
                  android:maxSdkVersion="28" />

              <application
                  android:allowBackup="true"
                  android:usesCleartextTraffic="true"
                  android:label="@string/app_name"
                  android:theme="@style/AppTheme"
                  android:hardwareAccelerated="true"
                  android:resizeableActivity="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait"
                      android:configChanges="orientation|screenSize|keyboardHidden">

                      <intent-filter>

                          <action
                              android:name="android.intent.action.MAIN" />

                          <category
                              android:name="android.intent.category.LAUNCHER" />

                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF


          cat > mbms_android/app/proguard-rules.pro <<'EOF'
          # MBMS
          EOF


      - name: Create MainActivity.java
        shell: bash
        run: |
          set -e

          cat > mbms_android/app/src/main/java/com/mbms/app/MainActivity.java <<'EOF'
          package com.mbms.app;

          import android.app.Activity;
          import android.content.ContentValues;
          import android.content.Context;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Environment;
          import android.provider.MediaStore;
          import android.print.PrintAttributes;
          import android.print.PrintDocumentAdapter;
          import android.print.PrintManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Toast;

          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.OutputStream;
          import java.nio.charset.StandardCharsets;

          public class MainActivity extends Activity {

              private static final int REQUEST_FILE = 9102;

              private WebView webView;

              private ValueCallback<Uri[]> filePathCallback;


              @Override
              protected void onCreate(
                      Bundle savedInstanceState) {

                  super.onCreate(savedInstanceState);

                  webView =
                          new WebView(this);

                  setContentView(webView);


                  WebSettings settings =
                          webView.getSettings();

                  settings.setJavaScriptEnabled(true);

                  settings.setDomStorageEnabled(true);

                  settings.setDatabaseEnabled(true);

                  settings.setAllowFileAccess(true);

                  settings.setAllowContentAccess(true);

                  settings.setBuiltInZoomControls(false);

                  settings.setDisplayZoomControls(false);

                  settings.setSupportZoom(false);

                  settings.setLoadWithOverviewMode(false);

                  settings.setUseWideViewPort(false);

                  settings.setTextZoom(100);


                  webView.addJavascriptInterface(
                          new AndroidBridge(),
                          "MBMSAndroid"
                  );


                  webView.setWebChromeClient(
                          new WebChromeClient() {

                              @Override
                              public boolean onShowFileChooser(
                                      WebView view,
                                      ValueCallback<Uri[]> callback,
                                      FileChooserParams params) {

                                  if(
                                      filePathCallback != null
                                  ) {

                                      filePathCallback
                                              .onReceiveValue(null);
                                  }


                                  filePathCallback =
                                          callback;


                                  try {

                                      Intent intent =
                                              new Intent(
                                                  Intent.ACTION_OPEN_DOCUMENT
                                              );


                                      intent.addCategory(
                                          Intent.CATEGORY_OPENABLE
                                      );


                                      intent.setType(
                                          "application/json"
                                      );


                                      startActivityForResult(
                                          intent,
                                          REQUEST_FILE
                                      );


                                      return true;


                                  } catch(Exception e) {

                                      filePathCallback =
                                              null;

                                      return false;
                                  }
                              }
                          }
                  );


                  webView.setWebViewClient(
                          new WebViewClient() {

                              @Override
                              public boolean
                              shouldOverrideUrlLoading(
                                      WebView view,
                                      WebResourceRequest request) {

                                  return false;
                              }


                              @Override
                              public void onPageFinished(
                                      WebView view,
                                      String url) {

                                  super.onPageFinished(
                                      view,
                                      url
                                  );

                                  installNativeBridge();
                              }
                          }
                  );


                  webView.loadUrl(
                      "file:///android_asset/index.html"
                  );
              }


              private void installNativeBridge() {

                  if(webView == null) {
                      return;
                  }


                  String js =
                          "(function(){"
                        + "try{"

                        + "window.print=function(){"
                        + "try{"
                        + "if(window.MBMSAndroid&&"
                        + "typeof window.MBMSAndroid.print"
                        + "==='function'){"
                        + "window.MBMSAndroid.print();"
                        + "return;"
                        + "}"
                        + "}catch(e){"
                        + "console.error(e);"
                        + "}"
                        + "};"


                        + "window.downloadSettingsBackup="
                        + "function(){"
                        + "try{"

                        + "var data="
                        + "JSON.stringify("
                        + "window.mbmsSettingsSnapshot(),"
                        + "null,2);"

                        + "var filename="
                        + "'MBMS_Backup_'"
                        + "+new Date()"
                        + ".toISOString()"
                        + ".slice(0,10)"
                        + "+'.json';"


                        + "if(window.MBMSAndroid&&"
                        + "typeof window.MBMSAndroid.saveBackup"
                        + "==='function'){"

                        + "window.MBMSAndroid.saveBackup("
                        + "data,filename);"

                        + "return;"
                        + "}"

                        + "}catch(e){"

                        + "alert("
                        + "'Backup Save मध्ये त्रुटी आली.'"
                        + ");"

                        + "}"
                        + "};"

                        + "}catch(e){"
                        + "console.error(e);"
                        + "}"
                        + "})();";


                  webView.evaluateJavascript(
                      js,
                      null
                  );
              }


              public class AndroidBridge {

                  @JavascriptInterface
                  public void print() {

                      runOnUiThread(
                          new Runnable() {

                              @Override
                              public void run() {

                                  try {

                                      PrintManager manager =
                                          (PrintManager)
                                          getSystemService(
                                              Context.PRINT_SERVICE
                                          );


                                      if(manager == null) {

                                          throw new Exception(
                                              "Print service unavailable"
                                          );
                                      }


                                      PrintDocumentAdapter adapter =
                                          webView
                                          .createPrintDocumentAdapter(
                                              "MBMS Report"
                                          );


                                      PrintAttributes attributes =
                                          new PrintAttributes.Builder()

                                          .setMediaSize(
                                              PrintAttributes.MediaSize.ISO_A4
                                          )

                                          .setMinMargins(
                                              PrintAttributes.Margins.NO_MARGINS
                                          )

                                          .build();


                                      manager.print(
                                          "MBMS Report",
                                          adapter,
                                          attributes
                                      );


                                  } catch(Exception e) {

                                      Toast.makeText(
                                          MainActivity.this,
                                          "Print सुरू करता आले नाही.",
                                          Toast.LENGTH_LONG
                                      ).show();
                                  }
                              }
                          }
                      );
                  }


                  @JavascriptInterface
                  public void saveBackup(
                          final String json,
                          final String filename) {

                      new Thread(
                          new Runnable() {

                              @Override
                              public void run() {

                                  boolean success =
                                          false;


                                  try {

                                      if(
                                          Build.VERSION.SDK_INT >= 29
                                      ) {

                                          ContentValues values =
                                              new ContentValues();


                                          values.put(
                                              MediaStore.Downloads.DISPLAY_NAME,
                                              filename
                                          );


                                          values.put(
                                              MediaStore.Downloads.MIME_TYPE,
                                              "application/json"
                                          );


                                          values.put(
                                              MediaStore.Downloads.RELATIVE_PATH,
                                              Environment.DIRECTORY_DOWNLOADS
                                          );


                                          values.put(
                                              MediaStore.Downloads.IS_PENDING,
                                              1
                                          );


                                          Uri uri =
                                              getContentResolver()
                                              .insert(
                                                  MediaStore.Downloads.EXTERNAL_CONTENT_URI,
                                                  values
                                              );


                                          if(uri == null) {

                                              throw new Exception(
                                                  "Unable to create backup"
                                              );
                                          }


                                          OutputStream output =
                                              getContentResolver()
                                              .openOutputStream(
                                                  uri
                                              );


                                          if(output == null) {

                                              throw new Exception(
                                                  "Unable to open backup"
                                              );
                                          }


                                          try {

                                              output.write(
                                                  json.getBytes(
                                                      StandardCharsets.UTF_8
                                                  )
                                              );

                                              output.flush();

                                          } finally {

                                              output.close();
                                          }


                                          ContentValues done =
                                              new ContentValues();


                                          done.put(
                                              MediaStore.Downloads.IS_PENDING,
                                              0
                                          );


                                          getContentResolver()
                                          .update(
                                              uri,
                                              done,
                                              null,
                                              null
                                          );


                                          success =
                                              true;


                                      } else {

                                          File directory =
                                              Environment
                                              .getExternalStoragePublicDirectory(
                                                  Environment
                                                  .DIRECTORY_DOWNLOADS
                                              );


                                          if(
                                              !directory.exists()
                                          ) {

                                              directory.mkdirs();
                                          }


                                          File file =
                                              new File(
                                                  directory,
                                                  filename
                                              );


                                          FileOutputStream output =
                                              new FileOutputStream(
                                                  file
                                              );


                                          try {

                                              output.write(
                                                  json.getBytes(
                                                      StandardCharsets.UTF_8
                                                  )
                                              );

                                              output.flush();

                                          } finally {

                                              output.close();
                                          }


                                          success =
                                              true;
                                      }


                                  } catch(Exception e) {

                                      e.printStackTrace();
                                  }


                                  final boolean result =
                                      success;


                                  runOnUiThread(
                                      new Runnable() {

                                          @Override
                                          public void run() {

                                              Toast.makeText(
                                                  MainActivity.this,

                                                  result
                                                  ?
                                                  "Backup Downloads मध्ये Save झाला."
                                                  :
                                                  "Backup Save मध्ये त्रुटी आली.",

                                                  Toast.LENGTH_LONG
                                              ).show();

                                          }
                                      }
                                  );
                              }
                          }
                      ).start();
                  }
              }


              @Override
              protected void onActivityResult(
                      int requestCode,
                      int resultCode,
                      Intent data) {

                  super.onActivityResult(
                      requestCode,
                      resultCode,
                      data
                  );


                  if(
                      requestCode != REQUEST_FILE
                  ) {

                      return;
                  }


                  if(
                      filePathCallback == null
                  ) {

                      return;
                  }


                  Uri[] results =
                          null;


                  if(
                      resultCode == RESULT_OK &&
                      data != null &&
                      data.getData() != null
                  ) {

                      results =
                          new Uri[]{
                              data.getData()
                          };
                  }


                  filePathCallback
                      .onReceiveValue(results);


                  filePathCallback =
                          null;
              }


              @Override
              public void onBackPressed() {

                  if(
                      webView != null &&
                      webView.canGoBack()
                  ) {

                      webView.goBack();

                  } else {

                      super.onBackPressed();
                  }
              }


              @Override
              protected void onDestroy() {

                  if(webView != null) {

                      webView.stopLoading();

                      webView.destroy();

                      webView =
                              null;
                  }


                  super.onDestroy();
              }
          }
          EOF


