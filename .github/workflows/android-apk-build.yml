name: MBMS V128 FINAL - M.B. Summary Linked - Corrected

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v4

      - name: Install SDK
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Install Gradle
        shell: bash
        run: |
          set -euo pipefail

          wget -q \
            https://services.gradle.org/distributions/gradle-8.7-bin.zip

          mkdir -p "$HOME/gradle"

          unzip -q \
            gradle-8.7-bin.zip \
            -d "$HOME/gradle"

          echo "$HOME/gradle/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: Find and prepare HTML
        shell: bash
        run: |
          set -euo pipefail

          HTML_FILE=""

          for f in \
            Measurement_Book_Management_System_FINAL_V120_TRANSFER_REPORT_FINAL.html \
            Measurement_Book_Management_System_FINAL_V118_PRINT_BACKUP_ANDROID.html \
            Measurement_Book_Management_System_FINAL_V115_MB_HISTORY_ONLY_DATE-6.html \
            Measurement_Book_Management_System_FINAL_V115_MB_HISTORY_ONLY_DATE.html \
            Measurement_Book_Management_System_FINAL_V115.html \
            V115.html \
            index.html
          do
            if [ -f "$f" ]; then
              HTML_FILE="$f"
              break
            fi
          done

          if [ -z "$HTML_FILE" ]; then
            HTML_FILE=$(
              find . \
                -maxdepth 3 \
                -type f \
                -iname '*.html' \
                -not -path './.git/*' \
                | head -1 || true
            )
          fi

          if [ -z "$HTML_FILE" ]; then
            echo "ERROR: MBMS HTML file not found."
            exit 1
          fi

          echo "Using HTML file: $HTML_FILE"

          rm -rf mbms_work
          mkdir -p mbms_work

          cp "$HTML_FILE" mbms_work/index.html

          test -s mbms_work/index.html

      - name: Received to JE full list correction
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path

          path = Path("mbms_work/index.html")
          text = path.read_text(encoding="utf-8")

          replacements = [
              (
                  "if(isJE){loadTransferJEs();"
                  "if(je){je.value=sourceName;je.disabled=true;}}",
                  "if(isJE){loadTransferJEs();"
                  "if(je){je.value=sourceName;je.disabled=false;}}"
              ),
              (
                  "if(isJE&&je)je.disabled=true;",
                  "if(isJE&&je)je.disabled=false;"
              ),
          ]

          for old, new in replacements:
              text = text.replace(old, new)

          path.write_text(text, encoding="utf-8")

          print("Received -> JE full list correction applied.")
          PY

      - name: Add M.B. Summary linked selection fix
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/mbms_summary_patch.js <<'PATCH_JS'
          (function(){
            "use strict";

            const TYPE_LABELS={
              MB:"M.B.",
              JE:"Junior Engineer",
              WORK:"Work",
              CONTRACTOR:"Contractor / Agency",
              BILL:"Bill",
              TRANSFER:"Transfer / History"
            };

            const DETAIL_ALL="__ALL_DETAIL__";
            const MB_SMALL="__SMALL_MB__";
            const MB_LARGE="__LARGE_MB__";
            const MB_PREFIX="__MBNO__::";

            function A(v){
              return Array.isArray(v)?v:[];
            }

            function S(v){
              return v==null?"":String(v).trim();
            }

            function N(v){
              try{
                return hrNorm(v);
              }catch(e){
                return S(v)
                  .toLowerCase()
                  .replace(/\s+/g," ");
              }
            }

            function E(v){
              try{
                return escapeHtml(S(v));
              }catch(e){
                return S(v).replace(
                  /[&<>"']/g,
                  function(c){
                    return {
                      "&":"&amp;",
                      "<":"&lt;",
                      ">":"&gt;",
                      '"':"&quot;",
                      "'":"&#39;"
                    }[c];
                  }
                );
              }
            }

            function D(v){
              try{
                return hrDate(v||"");
              }catch(e){
                return S(v)||"-";
              }
            }

            function amount(v){
              try{
                return billAmountText(v);
              }catch(e){
                return "₹ "+
                  (Number(v)||0).toLocaleString(
                    "en-IN",
                    {
                      minimumFractionDigits:2,
                      maximumFractionDigits:2
                    }
                  );
              }
            }

            function uniq(a){
              return [
                ...new Set(
                  a.map(S).filter(Boolean)
                )
              ].sort(
                function(x,y){
                  return x.localeCompare(
                    y,
                    undefined,
                    {
                      numeric:true,
                      sensitivity:"base"
                    }
                  );
                }
              );
            }

            function mbNo(x){
              return S(
                x?.number ||
                x?.mbNumber ||
                x?.mb
              );
            }

            function workName(x){
              return S(
                x?.name ||
                x?.workName ||
                x?.work
              );
            }

            function jeName(x){
              return S(
                x?.je ||
                x?.jeName ||
                x?.juniorEngineer
              );
            }

            function contractor(x){
              return S(
                x?.contractor ||
                x?.agency ||
                x?.contractorName ||
                x?.agencyName
              );
            }

            function billType(x){
              return S(
                x?.billType ||
                x?.type ||
                x?.billName
              );
            }

            function billNo(x){
              return S(
                x?.billNo ||
                x?.number ||
                x?.billNumber
              );
            }

            function transferNo(x){
              return S(
                x?.number ||
                x?.mb ||
                x?.mbNumber
              );
            }

            function size(x){
              const z=N(x);

              if(
                z==="small" ||
                z.includes("small") ||
                z.includes("लहान")
              ){
                return "SMALL";
              }

              if(
                z==="large" ||
                z.includes("large") ||
                z.includes("big") ||
                z.includes("मोठ")
              ){
                return "LARGE";
              }

              return "";
            }

            function data(){
              try{
                const d=homeRelData();

                return {
                  mbs:A(d.mbs),
                  jes:A(d.jes),
                  works:A(d.works),
                  assigns:A(d.assigns),
                  transfers:A(d.transfers),
                  bills:A(d.bills)
                };

              }catch(e){

                return {
                  mbs:[],
                  jes:[],
                  works:[],
                  assigns:[],
                  transfers:[],
                  bills:[]
                };
              }
            }

            function dateFilter(d){

              const from=
                document.getElementById(
                  "homeRelFrom"
                )?.value||"";

              const to=
                document.getElementById(
                  "homeRelTo"
                )?.value||"";

              if(!from&&!to){
                return d;
              }

              return {
                mbs:d.mbs.filter(
                  x=>inRange(
                    x.receivedDate ||
                    x.date ||
                    x.createdAt,
                    from,
                    to
                  )
                ),

                /*
                 * JE master list is intentionally
                 * NOT date-filtered.
                 * This keeps the complete JE list available.
                 */
                jes:d.jes,

                works:d.works.filter(
                  x=>inRange(
                    x.createdAt ||
                    x.date ||
                    x.workDate,
                    from,
                    to
                  )
                ),

                assigns:d.assigns.filter(
                  x=>inRange(
                    x.date ||
                    x.assignedDate ||
                    x.createdAt,
                    from,
                    to
                  )
                ),

                transfers:d.transfers.filter(
                  x=>inRange(
                    x.date ||
                    x.transferDate ||
                    x.savedAt,
                    from,
                    to
                  )
                ),

                bills:d.bills.filter(
                  x=>inRange(
                    x.billDate ||
                    x.date ||
                    x.savedAt,
                    from,
                    to
                  )
                )
              };
            }

            function inRange(v,from,to){
              try{
                return homeRelInRange(
                  v,
                  from,
                  to
                );
              }catch(e){

                const k=S(v);

                return (
                  (!from||k>=from) &&
                  (!to||k<=to)
                );
              }
            }

            function ctx(){

              const type=
                document.getElementById(
                  "homeRelType"
                )?.value||"";

              const target=
                document.getElementById(
                  "homeRelTarget"
                )?.value||"";

              const cv=
                document.getElementById(
                  "homeRelComponent"
                )?.value||"";

              const parts=
                cv.split("::");

              return {
                type:type,
                target:target,
                ctype:parts[0]||"",
                cvalue:parts.slice(1).join("::"),
                detail:
                  document.getElementById(
                    "homeRelDetail"
                  )?.value||"",
                billType:
                  document.getElementById(
                    "homeRelBillType"
                  )?.value||""
              };
            }

            function linkedByMB(d,mbs){

              const set=
                new Set(
                  mbs.map(N).filter(Boolean)
                );

              return {
                mbs:d.mbs.filter(
                  x=>set.has(
                    N(mbNo(x))
                  )
                ),

                works:d.works.filter(
                  x=>set.has(
                    N(x?.mb)
                  )
                ),

                assigns:d.assigns.filter(
                  x=>set.has(
                    N(x?.mb)
                  )
                ),

                transfers:d.transfers.filter(
                  x=>set.has(
                    N(transferNo(x))
                  )
                ),

                bills:d.bills.filter(
                  x=>set.has(
                    N(x?.mb)
                  )
                )
              };
            }

            function baseFor(c,d){

              const all=
                c.target==="__ALL__";

              const t=N(c.target);

              if(c.type==="MB"){

                const mbs=
                  all
                  ? d.mbs
                  : d.mbs.filter(
                      x=>N(mbNo(x))===t
                    );

                return Object.assign(
                  {
                    jes:d.jes
                  },
                  linkedByMB(
                    d,
                    mbs.map(mbNo)
                  )
                );
              }

              if(c.type==="JE"){

                const works=
                  all
                  ? d.works
                  : d.works.filter(
                      x=>N(jeName(x))===t
                    );

                const bills=
                  all
                  ? d.bills
                  : d.bills.filter(
                      x=>N(jeName(x))===t
                    );

                const assigns=
                  all
                  ? d.assigns
                  : d.assigns.filter(
                      x=>N(jeName(x))===t
                    );

                const mbNumbers=
                  uniq(
                    works.map(x=>x?.mb)
                      .concat(
                        bills.map(x=>x?.mb),
                        assigns.map(x=>x?.mb)
                      )
                  );

                return {
                  mbs:d.mbs.filter(
                    x=>mbNumbers.some(
                      m=>N(mbNo(x))===N(m)
                    )
                  ),

                  works:works,

                  assigns:assigns,

                  transfers:d.transfers.filter(
                    x=>mbNumbers.some(
                      m=>N(transferNo(x))===N(m)
                    )
                  ),

                  bills:bills,

                  jes:d.jes
                };
              }

              if(c.type==="WORK"){

                const works=
                  all
                  ? d.works
                  : d.works.filter(
                      x=>N(workName(x))===t
                    );

                const names=
                  new Set(
                    works.map(
                      x=>N(workName(x))
                    )
                  );

                const bills=
                  all
                  ? d.bills
                  : d.bills.filter(
                      x=>
                        names.has(
                          N(workName(x))
                        ) ||
                        N(x?.work)===t
                    );

                const mbNumbers=
                  uniq(
                    works.map(x=>x?.mb)
                      .concat(
                        bills.map(x=>x?.mb)
                      )
                  );

                return {
                  mbs:d.mbs.filter(
                    x=>mbNumbers.some(
                      m=>N(mbNo(x))===N(m)
                    )
                  ),

                  works:works,

                  assigns:d.assigns.filter(
                    x=>mbNumbers.some(
                      m=>N(x?.mb)===N(m)
                    )
                  ),

                  transfers:d.transfers.filter(
                    x=>mbNumbers.some(
                      m=>N(transferNo(x))===N(m)
                    )
                  ),

                  bills:bills,

                  jes:d.jes
                };
              }

              if(c.type==="CONTRACTOR"){

                const works=
                  all
                  ? d.works
                  : d.works.filter(
                      x=>N(contractor(x))===t
                    );

                const bills=
                  all
                  ? d.bills
                  : d.bills.filter(
                      x=>N(contractor(x))===t
                    );

                const assigns=
                  all
                  ? d.assigns
                  : d.assigns.filter(
                      x=>N(contractor(x))===t
                    );

                const mbNumbers=
                  uniq(
                    works.map(x=>x?.mb)
                      .concat(
                        bills.map(x=>x?.mb),
                        assigns.map(x=>x?.mb)
                      )
                  );

                return {
                  mbs:d.mbs.filter(
                    x=>mbNumbers.some(
                      m=>N(mbNo(x))===N(m)
                    )
                  ),

                  works:works,

                  assigns:assigns,

                  transfers:d.transfers.filter(
                    x=>mbNumbers.some(
                      m=>N(transferNo(x))===N(m)
                    )
                  ),

                  bills:bills,

                  jes:d.jes
                };
              }

              if(c.type==="BILL"){

                const bills=
                  all
                  ? d.bills
                  : d.bills.filter(
                      x=>
                        N(billNo(x))===t ||
                        N(billType(x))===t
                    );

                const mbNumbers=
                  uniq(
                    bills.map(x=>x?.mb)
                  );

                return {
                  mbs:d.mbs.filter(
                    x=>mbNumbers.some(
                      m=>N(mbNo(x))===N(m)
                    )
                  ),

                  works:d.works.filter(
                    x=>
                      mbNumbers.some(
                        m=>N(x?.mb)===N(m)
                      ) ||
                      bills.some(
                        b=>
                          N(workName(b))===
                          N(workName(x))
                      )
                  ),

                  assigns:d.assigns.filter(
                    x=>mbNumbers.some(
                      m=>N(x?.mb)===N(m)
                    )
                  ),

                  transfers:d.transfers.filter(
                    x=>mbNumbers.some(
                      m=>N(transferNo(x))===N(m)
                    )
                  ),

                  bills:bills,

                  jes:d.jes
                };
              }

              if(c.type==="TRANSFER"){

                const transfers=
                  all
                  ? d.transfers
                  : d.transfers.filter(
                      x=>N(transferNo(x))===t
                    );

                const mbNumbers=
                  uniq(
                    transfers.map(
                      transferNo
                    )
                  );

                return {
                  mbs:d.mbs.filter(
                    x=>mbNumbers.some(
                      m=>N(mbNo(x))===N(m)
                    )
                  ),

                  works:d.works.filter(
                    x=>mbNumbers.some(
                      m=>N(x?.mb)===N(m)
                    )
                  ),

                  assigns:d.assigns.filter(
                    x=>mbNumbers.some(
                      m=>N(x?.mb)===N(m)
                    )
                  ),

                  transfers:transfers,

                  bills:d.bills.filter(
                    x=>mbNumbers.some(
                      m=>N(x?.mb)===N(m)
                    )
                  ),

                  jes:d.jes
                };
              }

              return {
                mbs:[],
                works:[],
                assigns:[],
                transfers:[],
                bills:[],
                jes:d.jes
              };
            }

            function applyComponentFilter(c,b){

              const detail=c.detail;

              if(
                c.ctype==="ALL" ||
                !c.ctype
              ){
                return b;
              }

              if(c.ctype==="MB"){

                let m=b.mbs;

                if(
                  detail===MB_SMALL
                ){
                  m=m.filter(
                    x=>size(x?.size)==="SMALL"
                  );
                }

                else if(
                  detail===MB_LARGE
                ){
                  m=m.filter(
                    x=>size(x?.size)==="LARGE"
                  );
                }

                else if(
                  detail.startsWith(MB_PREFIX)
                ){
                  m=m.filter(
                    x=>
                      N(mbNo(x))===
                      N(
                        detail.slice(
                          MB_PREFIX.length
                        )
                      )
                  );
                }

                return linkedByMB(
                  Object.assign(
                    {},
                    b,
                    {mbs:b.mbs}
                  ),
                  m.map(mbNo)
                );
              }

              if(
                c.ctype==="WORK" &&
                detail &&
                detail!==DETAIL_ALL
              ){

                const works=
                  b.works.filter(
                    x=>
                      N(workName(x))===
                      N(detail)
                  );

                const names=
                  new Set(
                    works.map(
                      x=>N(workName(x))
                    )
                  );

                return {
                  mbs:b.mbs.filter(
                    x=>works.some(
                      y=>N(y?.mb)===
                         N(mbNo(x))
                    )
                  ),

                  works:works,

                  assigns:b.assigns.filter(
                    x=>works.some(
                      y=>N(y?.mb)===
                         N(x?.mb)
                    )
                  ),

                  transfers:b.transfers.filter(
                    x=>works.some(
                      y=>N(y?.mb)===
                         N(transferNo(x))
                    )
                  ),

                  bills:b.bills.filter(
                    x=>names.has(
                      N(workName(x))
                    )
                  ),

                  jes:b.jes
                };
              }

              if(
                c.ctype==="JE" &&
                detail &&
                detail!==DETAIL_ALL
              ){

                const works=
                  b.works.filter(
                    x=>
                      N(jeName(x))===
                      N(detail)
                  );

                const bills=
                  b.bills.filter(
                    x=>
                      N(jeName(x))===
                      N(detail)
                  );

                const assigns=
                  b.assigns.filter(
                    x=>
                      N(jeName(x))===
                      N(detail)
                  );

                const mbNumbers=
                  uniq(
                    works.map(x=>x?.mb)
                      .concat(
                        bills.map(x=>x?.mb),
                        assigns.map(x=>x?.mb)
                      )
                  );

                return {
                  mbs:b.mbs.filter(
                    x=>mbNumbers.some(
                      m=>N(mbNo(x))===N(m)
                    )
                  ),

                  works:works,

                  assigns:assigns,

                  transfers:b.transfers.filter(
                    x=>mbNumbers.some(
                      m=>N(transferNo(x))===N(m)
                    )
                  ),

                  bills:bills,

                  jes:b.jes
                };
              }

              if(
                c.ctype==="CONTRACTOR" &&
                detail &&
                detail!==DETAIL_ALL
              ){

                const works=
                  b.works.filter(
                    x=>
                      N(contractor(x))===
                      N(detail)
                  );

                const bills=
                  b.bills.filter(
                    x=>
                      N(contractor(x))===
                      N(detail)
                  );

                const assigns=
                  b.assigns.filter(
                    x=>
                      N(contractor(x))===
                      N(detail)
                  );

                const mbNumbers=
                  uniq(
                    works.map(x=>x?.mb)
                      .concat(
                        bills.map(x=>x?.mb),
                        assigns.map(x=>x?.mb)
                      )
                  );

                return {
                  mbs:b.mbs.filter(
                    x=>mbNumbers.some(
                      m=>N(mbNo(x))===N(m)
                    )
                  ),

                  works:works,

                  assigns:assigns,

                  transfers:b.transfers.filter(
                    x=>mbNumbers.some(
                      m=>N(transferNo(x))===N(m)
                    )
                  ),

                  bills:bills,

                  jes:b.jes
                };
              }

              if(
                c.ctype==="BILL" &&
                detail &&
                detail!==DETAIL_ALL
              ){

                const bills=
                  b.bills.filter(
                    x=>
                      N(billType(x))===
                      N(detail) ||
                      N(billNo(x))===
                      N(detail)
                  );

                const mbNumbers=
                  uniq(
                    bills.map(x=>x?.mb)
                  );

                return {
                  mbs:b.mbs.filter(
                    x=>mbNumbers.some(
                      m=>N(mbNo(x))===N(m)
                    )
                  ),

                  works:b.works.filter(
                    x=>
                      mbNumbers.some(
                        m=>N(x?.mb)===N(m)
                      ) ||
                      bills.some(
                        bb=>
                          N(workName(bb))===
                          N(workName(x))
                      )
                  ),

                  assigns:b.assigns.filter(
                    x=>mbNumbers.some(
                      m=>N(x?.mb)===N(m)
                    )
                  ),

                  transfers:b.transfers.filter(
                    x=>mbNumbers.some(
                      m=>N(transferNo(x))===N(m)
                    )
                  ),

                  bills:bills,

                  jes:b.jes
                };
              }

              if(
                c.ctype==="TRANSFER"
              ){

                return {
                  mbs:b.mbs,
                  works:b.works,
                  assigns:b.assigns,
                  transfers:b.transfers,
                  bills:b.bills,
                  jes:b.jes
                };
              }

              return b;
            }

            function current(){

              const c=ctx();

              const d=
                dateFilter(
                  data()
                );

              const b=
                baseFor(
                  c,
                  d
                );

              return applyComponentFilter(
                c,
                b
              );
            }

            function relatedOptions(c,d){

              const b=
                baseFor(
                  c,
                  d
                );

              const o=[];

              if(c.ctype==="MB"){

                o.push(
                  [DETAIL_ALL,"सर्व M.B."],
                  [MB_SMALL,"Small M.B."],
                  [MB_LARGE,"Big M.B."]
                );

                uniq(
                  b.mbs.map(mbNo)
                ).forEach(
                  function(x){
                    o.push(
                      [
                        MB_PREFIX+x,
                        "M.B. क्रमांक "+x
                      ]
                    );
                  }
                );
              }

              else if(c.ctype==="WORK"){

                o.push(
                  [
                    DETAIL_ALL,
                    "सर्व कामे"
                  ]
                );

                uniq(
                  b.works.map(workName)
                ).forEach(
                  function(x){
                    o.push(
                      [x,x]
                    );
                  }
                );
              }

              else if(c.ctype==="JE"){

                o.push(
                  [
                    DETAIL_ALL,
                    "सर्व JE"
                  ]
                );

                uniq(
                  b.works
                    .map(jeName)
                    .concat(
                      b.bills.map(jeName),
                      b.assigns.map(jeName)
                    )
                ).forEach(
                  function(x){
                    o.push(
                      [x,x]
                    );
                  }
                );
              }

              else if(
                c.ctype==="CONTRACTOR"
              ){

                o.push(
                  [
                    DETAIL_ALL,
                    "सर्व Contractor / Agency"
                  ]
                );

                uniq(
                  b.works.map(contractor)
                    .concat(
                      b.bills.map(contractor),
                      b.assigns.map(contractor)
                    )
                ).forEach(
                  function(x){
                    o.push(
                      [x,x]
                    );
                  }
                );
              }

              else if(
                c.ctype==="BILL"
              ){

                o.push(
                  [
                    DETAIL_ALL,
                    "सर्व Bill"
                  ]
                );

                uniq(
                  b.bills.map(billType)
                    .concat(
                      b.bills.map(billNo)
                    )
                ).forEach(
                  function(x){
                    o.push(
                      [x,x]
                    );
                  }
                );
              }

              else if(
                c.ctype==="TRANSFER"
              ){

                o.push(
                  [
                    DETAIL_ALL,
                    "सर्व Transfer / History"
                  ]
                );

                uniq(
                  b.transfers.map(
                    transferNo
                  )
                ).forEach(
                  function(x){
                    o.push(
                      [
                        x,
                        "M.B. "+x+
                        " — Transfer History"
                      ]
                    );
                  }
                );
              }

              return o;
            }

