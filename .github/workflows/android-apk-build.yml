name: MBMS Android APK Build
​on:
workflow_dispatch:
push:
branches:
- main
​permissions:
contents: read
​jobs:
build:
name: Build Verified MBMS Android APK
runs-on: ubuntu-24.04
​steps:
- name: Checkout repository
uses: actions/checkout@v4
​- name: Setup Java 17
uses: actions/setup-java@v4
with:
distribution: temurin
java-version: '17'
​- name: Setup Android SDK
uses: android-actions/setup-android@v4
​- name: Install Android SDK Packages
shell: bash
run: |
set -e
yes | sdkmanager --licenses >/dev/null 2>&1 || true
sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
​- name: Setup Gradle 8.7
uses: gradle/actions/setup-gradle@v4
with:
gradle-version: '8.7'
​- name: Locate and Prepare HTML
shell: bash
run: |
set -e
mkdir -p mbms_work
​for z in *.zip; do
if [ -f "$z" ]; then
echo "Unpacking zip: $z"
unzip -q -o "$z" -d extracted_zip || true
fi
done
​TARGET_HTML=$(find . -type f -iname ".html" -not -path "./.git/" -exec ls -S {} + | head -n 1)
​if [ -z "$TARGET_HTML" ]; then
echo "ERROR: No HTML file found in repository."
exit 1
fi
​echo "Target HTML detected: $TARGET_HTML"
cp "$TARGET_HTML" mbms_work/index.html
test -s mbms_work/index.html
​- name: Apply Safe Non-Destructive Injections
shell: bash
run: |
set -e
python3 <<'PY'
from pathlib import Path
​html_file = Path("mbms_work/index.html")
raw_html = html_file.read_text(encoding="utf-8")
​master_styles = """
<style id="MBMS_JE_SAFE_STYLES">
/* १. हेडरमधील वरचे केशरी REPORT बटण सुरक्षितपणे लपवणे (HTML न तोडता) */
.header button.btn-warning,
.header .report-btn,
.top-bar button.report-btn,
header button.report-btn {
display: none !important;
visibility: hidden !important;
}
​/* २. A4 प्रिंट लेआउट दुरुस्ती */
