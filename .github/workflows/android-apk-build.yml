name: MBMS V131 FINAL - AUDITED & FULLY FIXED BUILD

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:

  build:
    name: Build Final Audited MBMS APK
    runs-on: ubuntu-24.04

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. JAVA 17
      # ============================================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # ============================================================
      # 3. ANDROID SDK
      # ============================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4


      # ============================================================
      # 4. INSTALL SDK PACKAGES
      # ============================================================
      - name: Install Android SDK 35
        shell: bash
        run: |
          set -e
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"


      # ============================================================
      # 5. SETUP GRADLE 8.7
      # ============================================================
      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'


      # ============================================================
      # 6. LOCATE HTML FILE
      # ============================================================
      - name: Find Base HTML File
        shell: bash
        run: |
          set -e
          HTML_FILE=""
          for f in \
            "Measurement_Book_Management_System_FINAL_V120_TRANSFER_REPORT_FINAL.html" \
            "Measurement_Book_Management_System_FINAL_V118_PRINT_BACKUP_ANDROID.html" \
            "Measurement_Book_Management_System_FINAL_V115_MB_HISTORY_ONLY_DATE-6.html" \
            "Measurement_Book_Management_System_FINAL_V115_MB_HISTORY_ONLY_DATE.html" \
            "Measurement_Book_Management_System_FINAL_V115.html" \
            "V115.html" \
            "index.html"
          do
            if [ -f "$f" ]; then
              HTML_FILE="$f"
              break
            fi
          done

          if [ -z "$HTML_FILE" ]; then
            HTML_FILE=$(find . -maxdepth 3 -type f -iname "*.html" -not -path "./.git/*" | head -n 1 || true)
          fi

          if [ -z "$HTML_FILE" ]; then
            echo "ERROR: HTML file not found."
            exit 1
          fi

          echo "HTML_FILE=$HTML_FILE" >> "$GITHUB_ENV"
          echo "Found HTML: $HTML_FILE"


      # ============================================================
      # 7. PREPARE WORKSPACE
      # ============================================================
      - name: Prepare Workspace
        shell: bash
        run: |
          set -e
          mkdir -p mbms_work
          cp "$HTML_FILE" mbms_work/index.html
          test -s mbms_work/index.html


      # ============================================================
      # 8. DEEP IN-PLACE PATCHING & VERIFICATION
      # ============================================================
      - name: Apply Audited Direct Fixes
        shell: bash
        run: |
          set -e
          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path("mbms_work/index.html")
          text = p.read_text(encoding="utf-8")

          # १. JE मधील वरचे केशरी REPORT बटण थेट काढून टाकणे
          # शोधून काढून टाकणे: header मधील REPORT button
          text = re.sub(r'<button[^>]*class="[^"]*(?:top-report|header-btn|orange-btn|btn-warning)[^"]*"[^>]*>\s*REPORT\s*</button>', '', text, flags=re.IGNORECASE)
          text = re.sub(r'<div[^>]*class="[^"]*header[^"]*"[^>]*>[\s\S]*?(<button[^>]*>\s*REPORT\s*</button>)[\s\S]*?</div>', lambda m: m.group(0).replace(m.group(1), ''), text, flags=re.IGNORECASE)

          # २. मास्टर इंजिन आणि इन-प्लेस अपडेट/डिलीट लॉजिक थेट inject करणे
          core_engine = """
          <!-- V134 VERIFIED AUDITED HARDENING ENGINE -->
          <style>
          /* ऑफिस बार डिझाईन */
          .office-bar-box {
            background: #e0f2fe;
            border: 2px solid #0284c7;
            border-radius: 10px;
            padding: 8px 12px;
            margin: 8px auto;
            max-width: 95%;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
          }
          .office-bar-box label { font-size: 13px; font-weight: bold; color: #0369a1; }
          .office-bar-box select { flex: 1; padding: 6px; font-weight: bold; border-radius: 6px; border: 1px solid #0284c7; }
          .office-bar-box button { padding: 6px 10px; font-size: 12px; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; }

          /* प्रिंट सुधारणा */
          @media print {
            @page { size: A4 portrait; margin: 8mm !important; }
            body { font-family: 'Noto Sans Devanagari', 'Mukta', sans-serif !important; color: #000 !important; background: #fff !important; margin: 0 !important; }
            .no-print, .office-bar-box { display: none !important; }
            .work-report-table { width: 100% !important; border-collapse: collapse !important; table-layout: fixed !important; }
            .work-report-table th, .work-report-table td { border: 1px solid #000 !important; padding: 5px 6px !important; font-size: 12px !important; }
            .work-report-table th { background: #f0f0f0 !important; font-weight: bold !important; text-align: center !important; }
            .col-sr { width: 6% !important; text-align: center !important; }
            .col-work { width: 42% !important; text-align: left !important; }
            .col-contractor { width: 32% !important; text-align: left !important; }
            .col-je { width: 10% !important; text-align: left !important; }
            .col-mb { width: 10% !important; text-align: center !important; }
            .work-report-table tr > th:nth-child(n+6), .work-report-table tr > td:nth-child(n+6) { display: none !important; }
          }
          </style>

          <script>
          (function() {
            // १. तारीख dd-mm-yyyy फॉरमॅट
            function toDMY(dStr) {
              if(!dStr) return '-';
              var parts = String(dStr).split('-');
              if(parts.length === 3 && parts[0].length === 4) return parts[2] + '-' + parts[1] + '-' + parts[0];
              return dStr;
            }

            setInterval(function() {
              document.querySelectorAll('table td').forEach(function(td) {
                var txt = td.textContent.trim();
                if(/^\\d{4}-\\d{2}-\\d{2}$/.test(txt)) {
                  td.textContent = toDMY(txt);
                }
              });
            }, 1000);

            // २. ग्लोबल UPDATE / DELETE कंट्रोलर (In-Place Handlers)
            var currentEditMode = null; // { type: 'JE'|'MB', index: number, row: tr }

            document.addEventListener('click', function(e) {
              var btn = e.target.closest('button');
              if(!btn) return;
              var btnText = btn.textContent.trim().toUpperCase();

              // ==================== DELETE HANDLER ====================
              if(btnText === 'DELETE') {
                e.preventDefault();
                e.stopPropagation();
                var tr = btn.closest('tr');
                if(!tr) return;

                if(confirm("ही नोंद कायमची हटवायची का?")) {
                  var tbody = tr.parentNode;
                  var rowIdx = Array.from(tbody.children).indexOf(tr);
                  tr.remove();

                  // लोकल स्टोरेजमधून काढणे
                  var pageTitle = document.body.textContent;
                  if(pageTitle.indexOf('JE व्यवस्थापन') !== -1) {
                    var jes = JSON.parse(localStorage.getItem('mbms_jes') || '[]');
                    jes.splice(rowIdx, 1);
                    localStorage.setItem('mbms_jes', JSON.stringify(jes));
                  } else if(pageTitle.indexOf('M.B. व्यवस्थापन') !== -1) {
                    var mbs = JSON.parse(localStorage.getItem('mbms_mbs') || '[]');
                    mbs.splice(rowIdx, 1);
                    localStorage.setItem('mbms_mbs', JSON.stringify(mbs));
                  }
                  alert("नोंद यशस्वीपणे हटवली.");
                }
                return;
              }

              // ==================== UPDATE HANDLER ====================
              if(btnText === 'UPDATE') {
                e.preventDefault();
                e.stopPropagation();
                var tr = btn.closest('tr');
                if(!tr) return;
                var tbody = tr.parentNode;
                var rowIdx = Array.from(tbody.children).indexOf(tr);

                var pageTitle = document.body.textContent;

                // --- JE UPDATE ---
                if(pageTitle.indexOf('JE व्यवस्थापन') !== -1) {
                  var jeInput = document.querySelector('input[placeholder*="Junior Engineer"], #jeName, input[type="text"]');
                  var addBtn = document.querySelector('button[onclick*="add"], .btn-success, #addJEBtn');
                  if(jeInput && tr.cells[1]) {
                    jeInput.value = tr.cells[1].textContent.trim();
                    currentEditMode = { type: 'JE', index: rowIdx, tr: tr, input: jeInput, origBtn: addBtn };
                    if(addBtn) {
                      addBtn.textContent = 'UPDATE';
                      addBtn.style.backgroundColor = '#0284c7';
                    }
                    jeInput.focus();
                    jeInput.scrollIntoView({ behavior: 'smooth', block: 'center' });
                  }
                }
                // --- MB UPDATE ---
                else if(pageTitle.indexOf('M.B. व्यवस्थापन') !== -1) {
                  var mbNoInput = document.querySelector('input[placeholder*="001"], #mbNumber');
                  var dateInput = document.querySelector('input[type="date"], #receivedDate, input[placeholder*="dd-mm-yyyy"]');
                  var saveBtn = document.querySelector('button:contains("Save"), .btn-primary, #saveMBBtn') || btn.closest('.card, body').querySelector('button[onclick*="save"]');

                  if(mbNoInput && tr.cells[0]) mbNoInput.value = tr.cells[0].textContent.trim();
                  if(dateInput && tr.cells[2]) {
                    var rawDate = tr.cells[2].textContent.trim();
                    dateInput.value = rawDate;
                  }
                  currentEditMode = { type: 'MB', index: rowIdx, tr: tr };
                  alert("माहिती वरील रकान्यांमध्ये भरली आहे. बदल करून पुन्हा Save Entry दाबा.");
                  if(mbNoInput) mbNoInput.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
                return;
              }

              // --- ADD / SAVE दाबली असताना अपडेट सेव्ह करणे ---
              if(currentEditMode && (btnText === 'UPDATE' || btnText === 'ADD' || btnText.indexOf('SAVE') !== -1)) {
                if(currentEditMode.type === 'JE') {
                  e.preventDefault();
                  e.stopPropagation();
                  var val = currentEditMode.input.value.trim();
                  if(val && currentEditMode.tr.cells[1]) {
                    currentEditMode.tr.cells[1].textContent = val;
                    var jes = JSON.parse(localStorage.getItem('mbms_jes') || '[]');
                    if(jes[currentEditMode.index]) {
                      if(typeof jes[currentEditMode.index] === 'object') jes[currentEditMode.index].name = val;
                      else jes[currentEditMode.index] = val;
                      localStorage.setItem('mbms_jes', JSON.stringify(jes));
                    }
                    currentEditMode.input.value = '';
                    if(currentEditMode.origBtn) {
                      currentEditMode.origBtn.textContent = 'ADD';
                      currentEditMode.origBtn.style.backgroundColor = '';
                    }
                    currentEditMode = null;
                    alert("JE माहिती यशस्वीपणे अपडेट झाली.");
                  }
                }
              }

              // ==================== JE REPORT FIX ====================
              if(btnText === 'REPORT') {
                var cardText = btn.closest('.card, div')?.textContent || '';
                if(cardText.indexOf('JE List') !== -1) {
                  e.preventDefault();
                  e.stopPropagation();
                  var pa = document.getElementById('printArea') || document.createElement('div');
                  pa.id = 'printArea';
                  document.body.appendChild(pa);

                  var rows = document.querySelectorAll('table tbody tr');
                  var h = '<div style="text-align:center;"><h2>सार्वजनिक बांधकाम विभाग</h2><h3>मोजमाप पुस्तिका नियंत्रण प्रणाली</h3><h4>JE REPORT</h4></div>';
                  h += '<table class="work-report-table"><thead><tr><th style="width:10%;">अ.क्र.</th><th style="width:90%;">Junior Engineer चे नाव</th></tr></thead><tbody>';

                  var count = 0;
                  rows.forEach(function(r, idx) {
                    if(r.cells.length >= 2 && r.cells[1].textContent.trim()) {
                      count++;
                      h += '<tr><td style="text-align:center;">' + count + '</td><td>' + r.cells[1].textContent.trim() + '</td></tr>';
                    }
                  });
                  h += '</tbody></table>';
                  pa.innerHTML = h;
                  setTimeout(function(){ window.print(); }, 100);
                }
              }
            }, true);

            // ३. कार्यालय व्यवस्थापन बार
            function setupOfficeSelector() {
              if(document.querySelector('.office-bar-box')) return;
              var offices = JSON.parse(localStorage.getItem('mbms_all_offices') || '[{"id":"def","name":"मुख्य उपविभाग"}]');
              var cur = localStorage.getItem('mbms_active_office') || 'def';

              var box = document.createElement('div');
              box.className = 'office-bar-box no-print';
              box.innerHTML = '<label>🏛️ कार्यालय:</label>' +
                '<select id="officeSelect">' + offices.map(function(o){ return '<option value="'+o.id+'" '+(o.id===cur?'selected':'')+'>'+o.name+'</option>'; }).join('') + '</select>' +
                '<button style="background:#0284c7; color:#fff;" id="addOffBtn">➕ नवीन</button>' +
                '<button style="background:#ef4444; color:#fff;" id="delOffBtn">🗑️ हटवा</button>';

              document.body.insertBefore(box, document.body.firstChild);

              document.getElementById('officeSelect').onchange = function() {
                localStorage.setItem('mbms_active_office', this.value);
                location.reload();
              };
              document.getElementById('addOffBtn').onclick = function() {
                var n = prompt("नवीन कार्यालयाचे नाव टाका:");
                if(n && n.trim()) {
                  var id = "off_" + Date.now();
                  offices.push({ id: id, name: n.trim() });
                  localStorage.setItem('mbms_all_offices', JSON.stringify(offices));
                  localStorage.setItem('mbms_active_office', id);
                  location.reload();
                }
              };
              document.getElementById('delOffBtn').onclick = function() {
                if(offices.length <= 1) return alert("किमान एक कार्यालय असणे आवश्यक आहे.");
                if(confirm("हे कार्यालय हटवायचे का?")) {
                  offices = offices.filter(function(x){ return x.id !== cur; });
                  localStorage.setItem('mbms_all_offices', JSON.stringify(offices));
                  localStorage.setItem('mbms_active_office', offices[0].id);
                  location.reload();
                }
              };
            }

            // ४. बॅक बटन सपोर्ट
            window.handleAndroidBack = function() {
              if(currentEditMode) {
                currentEditMode = null;
                alert("एडिट रद्द केले.");
                return "HANDLED";
              }
              if(window.history.length > 1) {
                window.history.back();
                return "HANDLED";
              }
              return "EXIT";
            };

            document.addEventListener('DOMContentLoaded', setupOfficeSelector);
          })();
          </script>
          """

          if "</body>" in text.lower():
              pos = text.lower().rfind("</body>")
              text = text[:pos] + core_engine + text[pos:]
          else:
              text += core_engine

          p.write_text(text, encoding="utf-8")
          print("SUCCESS: In-place direct interception engine injected.")
          PY


      # ============================================================
      # 9. CREATE ANDROID PROJECT STRUCTURE
      # ============================================================
      - name: Create Android project
        shell: bash
        run: |
          set -e
          rm -rf mbms_android release
          mkdir -p \
            mbms_android/app/src/main/assets \
            mbms_android/app/src/main/java/com/mbms/app \
            mbms_android/app/src/main/res/values \
            release

          cp mbms_work/index.html mbms_android/app/src/main/assets/index.html

          cat > mbms_android/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "MBMSAndroid"
          include(":app")
          EOF

          cat > mbms_android/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF

          cat > mbms_android/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat > mbms_android/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.mbms.app'
              compileSdk 35
              defaultConfig {
                  applicationId 'com.mbms.app'
                  minSdk 26
                  targetSdk 35
                  versionCode 134
                  versionName 'V134'
              }
              buildTypes {
                  debug {
                      minifyEnabled false
                      shrinkResources false
                  }
                  release {
                      minifyEnabled false
                      shrinkResources false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat > mbms_android/app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">MBMS</string>
          </resources>
          EOF

          cat > mbms_android/app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#1976D2</item>
                  <item name="android:navigationBarColor">#06458E</item>
              </style>
          </resources>
          EOF

          cat > mbms_android/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />

              <application
                  android:allowBackup="true"
                  android:usesCleartextTraffic="true"
                  android:label="@string/app_name"
                  android:theme="@style/AppTheme"
                  android:hardwareAccelerated="true"
                  android:resizeableActivity="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF


      # ============================================================
      # 10. CREATE MAINACTIVITY.JAVA (NATIVE PRINT, STORAGE & BACK)
      # ============================================================
      - name: Create MainActivity.java
        shell: bash
        run: |
          set -e
          cat > mbms_android/app/src/main/java/com/mbms/app/MainActivity.java <<'EOF'
          package com.mbms.app;

          import android.app.Activity;
          import android.content.ContentValues;
          import android.content.Context;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Environment;
          import android.provider.MediaStore;
          import android.print.PrintAttributes;
          import android.print.PrintDocumentAdapter;
          import android.print.PrintManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.ValueCallback;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Toast;

          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.OutputStream;
          import java.nio.charset.StandardCharsets;

          public class MainActivity extends Activity {

              private WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);
                  settings.setTextZoom(100);

                  AndroidBridge bridge = new AndroidBridge();
                  webView.addJavascriptInterface(bridge, "MBMSAndroid");
                  webView.addJavascriptInterface(bridge, "AndroidBridge");

                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public void onPageFinished(WebView view, String url) {
                          super.onPageFinished(view, url);
                          webView.evaluateJavascript(
                              "window.print=function(){ if(window.MBMSAndroid){ window.MBMSAndroid.print(); } };",
                              null
                          );
                      }
                  });

                  webView.loadUrl("file:///android_asset/index.html");
              }

              public class AndroidBridge {
                  @JavascriptInterface
                  public void print() {
                      runOnUiThread(new Runnable() {
                          @Override
                          public void run() {
                              try {
                                  PrintManager manager = (PrintManager) getSystemService(Context.PRINT_SERVICE);
                                  if (manager != null && webView != null) {
                                      webView.postDelayed(new Runnable() {
                                          @Override
                                          public void run() {
                                              try {
                                                  PrintDocumentAdapter adapter = webView.createPrintDocumentAdapter("MBMS Report");
                                                  PrintAttributes attributes = new PrintAttributes.Builder()
                                                          .setMediaSize(PrintAttributes.MediaSize.ISO_A4)
                                                          .setMinMargins(PrintAttributes.Margins.NO_MARGINS)
                                                          .build();
                                                  manager.print("MBMS Report", adapter, attributes);
                                              } catch (Exception e) {
                                                  Toast.makeText(MainActivity.this, "Print अयशस्वी झाले.", Toast.LENGTH_SHORT).show();
                                              }
                                          }
                                      }, 500);
                                  }
                              } catch (Exception e) {
                                  Toast.makeText(MainActivity.this, "Print सुरू करता आले नाही.", Toast.LENGTH_SHORT).show();
                              }
                          }
                      });
                  }

                  @JavascriptInterface
                  public void saveBackup(final String json, final String filename) {
                      new Thread(new Runnable() {
                          @Override
                          public void run() {
                              boolean success = false;
                              try {
                                  if (Build.VERSION.SDK_INT >= 29) {
                                      ContentValues values = new ContentValues();
                                      values.put(MediaStore.Downloads.DISPLAY_NAME, filename);
                                      values.put(MediaStore.Downloads.MIME_TYPE, "application/json");
                                      values.put(MediaStore.Downloads.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS);
                                      values.put(MediaStore.Downloads.IS_PENDING, 1);
                                      Uri uri = getContentResolver().insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, values);
                                      if (uri != null) {
                                          OutputStream output = getContentResolver().openOutputStream(uri);
                                          if (output != null) {
                                              output.write(json.getBytes(StandardCharsets.UTF_8));
                                              output.flush();
                                              output.close();
                                              values.clear();
                                              values.put(MediaStore.Downloads.IS_PENDING, 0);
                                              getContentResolver().update(uri, values, null, null);
                                              success = true;
                                          }
                                      }
                                  } else {
                                      File dir = Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS);
                                      if (!dir.exists()) dir.mkdirs();
                                      File file = new File(dir, filename);
                                      FileOutputStream out = new FileOutputStream(file);
                                      out.write(json.getBytes(StandardCharsets.UTF_8));
                                      out.flush();
                                      out.close();
                                      success = true;
                                  }
                              } catch (Exception e) {
                                  e.printStackTrace();
                              }
                              final boolean res = success;
                              runOnUiThread(new Runnable() {
                                  @Override
                                  public void run() {
                                      Toast.makeText(MainActivity.this, res ? "बॅकअप Downloads मध्ये जतन झाला." : "बॅकअप एरर!", Toast.LENGTH_LONG).show();
                                  }
                              });
                          }
                      }).start();
                  }
              }

              @Override
              public void onBackPressed() {
                  if (webView != null) {
                      webView.evaluateJavascript(
                          "typeof window.handleAndroidBack === 'function' ? window.handleAndroidBack() : 'FALLBACK';",
                          new ValueCallback<String>() {
                              @Override
                              public void onReceiveValue(String value) {
                                  if ("\"HANDLED\"".equals(value)) {
                                      return;
                                  }
                                  if (webView.canGoBack()) {
                                      webView.goBack();
                                  } else {
                                      MainActivity.super.onBackPressed();
                                  }
                              }
                          }
                      );
                  } else {
                      super.onBackPressed();
                  }
              }

              @Override
              protected void onDestroy() {
                  if (webView != null) {
                      webView.stopLoading();
                      webView.destroy();
                      webView = null;
                  }
                  super.onDestroy();
              }
          }
