name: MBMS V118 Android APK - PRINT BACKUP INSTALL FIX

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build MBMS V118 APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -e
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'

      - name: Verify Java and Gradle
        shell: bash
        run: |
          set -e
          java -version
          gradle --version

      - name: Locate original V115 HTML
        shell: bash
        run: |
          set -e

          HTML_FILE=""

          for f in \
            "Measurement_Book_Management_System_FINAL_V115_MB_HISTORY_ONLY_DATE-6.html" \
            "Measurement_Book_Management_System_FINAL_V115_MB_HISTORY_ONLY_DATE.html" \
            "Measurement_Book_Management_System_FINAL_V115.html" \
            "V115.html" \
            "index.html"
          do
            if [ -f "$f" ]; then
              HTML_FILE="$f"
              break
            fi
          done

          if [ -z "$HTML_FILE" ]; then
            HTML_FILE=$(find . -maxdepth 3 -type f -iname "*.html" -not -path "./.git/*" | head -n 1 || true)
          fi

          if [ -z "$HTML_FILE" ]; then
            echo "ERROR: Original V115 HTML not found."
            exit 1
          fi

          echo "HTML_FILE=$HTML_FILE" >> "$GITHUB_ENV"
          echo "Using: $HTML_FILE"

      - name: Verify original V115 HTML
        shell: bash
        run: |
          set -e

          test -s "$HTML_FILE"

          grep -q "mbmsSettingsSnapshot" "$HTML_FILE"
          grep -q "downloadSettingsBackup" "$HTML_FILE"
          grep -q "restoreSettingsBackup" "$HTML_FILE"

          echo "V115 HTML validation PASSED."

      - name: Create Android project directories
        shell: bash
        run: |
          set -e

          rm -rf mbms_android
          rm -rf release

          mkdir -p mbms_android/app/src/main/assets
          mkdir -p mbms_android/app/src/main/java/com/mbms/app
          mkdir -p mbms_android/app/src/main/res/values

          cp "$HTML_FILE" \
            mbms_android/app/src/main/assets/index.html

          test -s \
            mbms_android/app/src/main/assets/index.html

      - name: Create Gradle project
        shell: bash
        run: |
          set -e

          printf '%s\n' \
          'pluginManagement {' \
          '    repositories {' \
          '        google()' \
          '        mavenCentral()' \
          '        gradlePluginPortal()' \
          '    }' \
          '}' \
          '' \
          'dependencyResolutionManagement {' \
          '    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)' \
          '    repositories {' \
          '        google()' \
          '        mavenCentral()' \
          '    }' \
          '}' \
          '' \
          'rootProject.name = "MBMSAndroid"' \
          'include(":app")' \
          > mbms_android/settings.gradle

          printf '%s\n' \
          'plugins {' \
          "    id 'com.android.application' version '8.6.1' apply false" \
          '}' \
          > mbms_android/build.gradle

          printf '%s\n' \
          'org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8' \
          'android.useAndroidX=false' \
          'android.enableJetifier=false' \
          > mbms_android/gradle.properties

          printf '%s\n' \
          'plugins {' \
          "    id 'com.android.application'" \
          '}' \
          '' \
          'android {' \
          '    namespace '\''com.mbms.app'\''' \
          '    compileSdk 35' \
          '' \
          '    defaultConfig {' \
          "        applicationId 'com.mbms.app'" \
          '        minSdk 26' \
          '        targetSdk 35' \
          '        versionCode 2' \
          "        versionName '1.0.1'" \
          '    }' \
          '' \
          '    buildTypes {' \
          '        debug {' \
          '            minifyEnabled false' \
          '            shrinkResources false' \
          '        }' \
          '    }' \
          '' \
          '    compileOptions {' \
          '        sourceCompatibility JavaVersion.VERSION_17' \
          '        targetCompatibility JavaVersion.VERSION_17' \
          '    }' \
          '}' \
          > mbms_android/app/build.gradle

          printf '%s\n' \
          '<resources>' \
          '    <string name="app_name">Measurement Book Management System</string>' \
          '</resources>' \
          > mbms_android/app/src/main/res/values/strings.xml

          printf '%s\n' \
          '<resources>' \
          '    <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">' \
          '        <item name="android:fontFamily">sans</item>' \
          '        <item name="android:colorAccent">#1976D2</item>' \
          '        <item name="android:navigationBarColor">#06458E</item>' \
          '    </style>' \
          '</resources>' \
          > mbms_android/app/src/main/res/values/styles.xml

          printf '%s\n' \
          '<?xml version="1.0" encoding="utf-8"?>' \
          '<manifest xmlns:android="http://schemas.android.com/apk/res/android">' \
          '' \
          '    <uses-permission android:name="android.permission.INTERNET" />' \
          '' \
          '    <uses-permission' \
          '        android:name="android.permission.WRITE_EXTERNAL_STORAGE"' \
          '        android:maxSdkVersion="28" />' \
          '' \
          '    <application' \
          '        android:allowBackup="true"' \
          '        android:usesCleartextTraffic="true"' \
          '        android:label="@string/app_name"' \
          '        android:theme="@style/AppTheme"' \
          '        android:hardwareAccelerated="true"' \
          '        android:resizeableActivity="true">' \
          '' \
          '        <activity' \
          '            android:name=".MainActivity"' \
          '            android:exported="true"' \
          '            android:screenOrientation="portrait">' \
          '' \
          '            <intent-filter>' \
          '                <action android:name="android.intent.action.MAIN" />' \
          '                <category android:name="android.intent.category.LAUNCHER" />' \
          '            </intent-filter>' \
          '' \
          '        </activity>' \
          '' \
          '    </application>' \
          '' \
          '</manifest>' \
          > mbms_android/app/src/main/AndroidManifest.xml

          echo "Android project files created."

      - name: Create MainActivity
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          java = r'''package com.mbms.app;

import android.app.Activity;
import android.content.ContentValues;
import android.content.Context;
import android.content.Intent;
import android.net.Uri;
import android.os.Build;
import android.os.Bundle;
import android.os.Environment;
import android.provider.MediaStore;
import android.print.PrintAttributes;
import android.print.PrintDocumentAdapter;
import android.print.PrintManager;
import android.webkit.JavascriptInterface;
import android.webkit.WebChromeClient;
import android.webkit.WebResourceRequest;
import android.webkit.WebSettings;
import android.webkit.WebView;
import android.webkit.WebViewClient;
import android.webkit.ValueCallback;
import android.widget.Toast;

import java.io.ByteArrayOutputStream;
import java.io.File;
import java.io.FileOutputStream;
import java.io.InputStream;
import java.io.OutputStream;
import java.nio.charset.StandardCharsets;

public class MainActivity extends Activity {

    private static final int REQUEST_FILE = 9102;

    private WebView webView;
    private ValueCallback<Uri[]> filePathCallback;

    @Override
    protected void onCreate(Bundle savedInstanceState) {
        super.onCreate(savedInstanceState);

        webView = new WebView(this);
        setContentView(webView);

        WebSettings settings = webView.getSettings();

        settings.setJavaScriptEnabled(true);
        settings.setDomStorageEnabled(true);
        settings.setDatabaseEnabled(true);
        settings.setAllowFileAccess(true);
        settings.setAllowContentAccess(true);
        settings.setBuiltInZoomControls(false);
        settings.setDisplayZoomControls(false);
        settings.setSupportZoom(false);
        settings.setLoadWithOverviewMode(false);
        settings.setUseWideViewPort(false);
        settings.setTextZoom(100);

        webView.addJavascriptInterface(
                new AndroidBridge(),
                "MBMSAndroid"
        );

        webView.setWebChromeClient(new WebChromeClient() {

            @Override
            public boolean onShowFileChooser(
                    WebView view,
                    ValueCallback<Uri[]> callback,
                    FileChooserParams params) {

                if (filePathCallback != null) {
                    filePathCallback.onReceiveValue(null);
                }

                filePathCallback = callback;

                try {

                    Intent intent =
                            new Intent(
                                    Intent.ACTION_OPEN_DOCUMENT
                            );

                    intent.addCategory(
                            Intent.CATEGORY_OPENABLE
                    );

                    intent.setType(
                            "application/json"
                    );

                    startActivityForResult(
                            intent,
                            REQUEST_FILE
                    );

                    return true;

                } catch (Exception e) {

                    filePathCallback = null;
                    return false;
                }
            }
        });

        webView.setWebViewClient(
                new WebViewClient() {

                    @Override
                    public boolean shouldOverrideUrlLoading(
                            WebView view,
                            WebResourceRequest request) {

                        return false;
                    }

                    @Override
                    public void onPageFinished(
                            WebView view,
                            String url) {

                        super.onPageFinished(
                                view,
                                url
                        );

                        installNativeBridge();
                    }
                }
        );

        webView.loadUrl(
                "file:///android_asset/index.html"
        );
    }

    private void installNativeBridge() {

        String js =
                "(function(){"

                + "if(window.__MBMS_NATIVE_PRINT_BACKUP__)return;"
                + "window.__MBMS_NATIVE_PRINT_BACKUP__=true;"

                + "window.print=function(){"
                + "if(window.MBMSAndroid&&"
                + "typeof window.MBMSAndroid.print==='function'){"
                + "window.MBMSAndroid.print();"
                + "return;"
                + "}"
                + "};"

                + "window.downloadSettingsBackup=function(){"
                + "try{"
                + "var data=JSON.stringify("
                + "window.mbmsSettingsSnapshot(),null,2);"
                + "var filename='MBMS_Backup_'+"
                + "new Date().toISOString().slice(0,10)+'.json';"
                + "if(window.MBMSAndroid&&"
                + "typeof window.MBMSAndroid.saveBackup==='function'){"
                + "window.MBMSAndroid.saveBackup(data,filename);"
                + "return;"
                + "}"
                + "var blob=new Blob([data],"
                + "{type:'application/json'});"
                + "var url=URL.createObjectURL(blob);"
                + "var a=document.createElement('a');"
                + "a.href=url;"
                + "a.download=filename;"
                + "document.body.appendChild(a);"
                + "a.click();"
                + "a.remove();"
                + "setTimeout(function(){URL.revokeObjectURL(url);},1000);"
                + "}catch(e){"
                + "alert('Backup Save करण्यात अडचण आली.');"
                + "}"
                + "};"

                + "window.startSettingsBackupRestore=function(){"
                + "if(window.MBMSAndroid&&"
                + "typeof window.MBMSAndroid.requestRestore==='function'){"
                + "window.MBMSAndroid.requestRestore();"
                + "return;"
                + "}"
                + "var input=document.getElementById('settingsBackupFile');"
                + "if(input)input.click();"
                + "};"

                + "})();";

        webView.evaluateJavascript(js, null);
    }

    public class AndroidBridge {

        @JavascriptInterface
        public void print() {

            runOnUiThread(new Runnable() {

                @Override
                public void run() {

                    try {

                        PrintManager manager =
                                (PrintManager)
                                        getSystemService(
                                                Context.PRINT_SERVICE
                                        );

                        if (manager == null) {
                            throw new Exception(
                                    "Print service unavailable"
                            );
                        }

                        PrintDocumentAdapter adapter =
                                webView.createPrintDocumentAdapter(
                                        "MBMS Report"
                                );

                        PrintAttributes attributes =
                                new PrintAttributes.Builder()
                                        .setMediaSize(
                                                PrintAttributes
                                                        .MediaSize
                                                        .ISO_A4
                                        )
                                        .setMinMargins(
                                                PrintAttributes
                                                        .Margins
                                                        .NO_MARGINS
                                        )
                                        .build();

                        manager.print(
                                "MBMS Report",
                                adapter,
                                attributes
                        );

                    } catch (Exception e) {

                        Toast.makeText(
                                MainActivity.this,
                                "Print सुरू करता आले नाही.",
                                Toast.LENGTH_LONG
                        ).show();
                    }
                }
            });
        }

        @JavascriptInterface
        public void saveBackup(
                final String json,
                final String filename) {

            new Thread(new Runnable() {

                @Override
                public void run() {

                    boolean success = false;

                    try {

                        if (Build.VERSION.SDK_INT >= 29) {

                            ContentValues values =
                                    new ContentValues();

                            values.put(
                                    MediaStore.MediaColumns.DISPLAY_NAME,
                                    filename
                            );

                            values.put(
                                    MediaStore.MediaColumns.MIME_TYPE,
                                    "application/json"
                            );

                            values.put(
                                    MediaStore.MediaColumns.RELATIVE_PATH,
                                    Environment.DIRECTORY_DOWNLOADS
                            );

                            values.put(
                                    MediaStore.MediaColumns.IS_PENDING,
                                    1
                            );

                            Uri uri =
                                    getContentResolver().insert(
                                            MediaStore.Downloads
                                                    .EXTERNAL_CONTENT_URI,
                                            values
                                    );

                            if (uri == null) {
                                throw new Exception(
                                        "Unable to create backup"
                                );
                            }

                            OutputStream output =
                                    getContentResolver()
                                            .openOutputStream(uri);

                            if (output == null) {
                                throw new Exception(
                                        "Unable to open backup"
                                );
                            }

                            try {

                                output.write(
                                        json.getBytes(
                                                StandardCharsets.UTF_8
                                        )
                                );

                                output.flush();

                            } finally {

                                output.close();
                            }

                            ContentValues done =
                                    new ContentValues();

                            done.put(
                                    MediaStore.MediaColumns.IS_PENDING,
                                    0
                            );

                            getContentResolver().update(
                                    uri,
                                    done,
                                    null,
                                    null
                            );

                            success = true;

                        } else {

                            File downloads =
                                    Environment
                                            .getExternalStoragePublicDirectory(
                                                    Environment.DIRECTORY_DOWNLOADS
                                            );

                            if (!downloads.exists()) {
                                downloads.mkdirs();
                            }

                            File file =
                                    new File(
                                            downloads,
                                            filename
                                    );

                            FileOutputStream output =
                                    new FileOutputStream(file);

                            try {

                                output.write(
                                        json.getBytes(
                                                StandardCharsets.UTF_8
                                        )
                                );

                                output.flush();

                            } finally {

                                output.close();
                            }

                            success = true;
                        }

                    } catch (Exception e) {

                        e.printStackTrace();
                    }

                    final boolean result = success;

                    runOnUiThread(new Runnable() {

                        @Override
                        public void run() {

                            Toast.makeText(
                                    MainActivity.this,
                                    result
                                            ? "Backup Downloads मध्ये Save झाला."
                                            : "Backup Save करण्यात अडचण आली.",
                                    Toast.LENGTH_LONG
                            ).show();
                        }
                    });
                }
            }).start();
        }

        @JavascriptInterface
        public void requestRestore() {

            runOnUiThread(new Runnable() {

                @Override
                public void run() {

                    try {

                        Intent intent =
                                new Intent(
                                        Intent.ACTION_OPEN_DOCUMENT
                                );

                        intent.addCategory(
                                Intent.CATEGORY_OPENABLE
                        );

                        intent.setType(
                                "application/json"
                        );

                        startActivityForResult(
                                intent,
                                REQUEST_FILE
                        );

                    } catch (Exception e) {

                        Toast.makeText(
                                MainActivity.this,
                                "Backup Restore सुरू करता आले नाही.",
                                Toast.LENGTH_LONG
                        ).show();
                    }
                }
            });
        }
    }

    @Override
    protected void onActivityResult(
            int requestCode,
            int resultCode,
            Intent data) {

        super.onActivityResult(
                requestCode,
                resultCode,
                data
        );

        if (requestCode != REQUEST_FILE) {
            return;
        }

        if (filePathCallback == null) {
            return;
        }

        Uri[] results = null;

        if (resultCode == RESULT_OK &&
                data != null &&
                data.getData() != null) {

            results =
                    new Uri[]{
                            data.getData()
                    };
        }

        filePathCallback.onReceiveValue(results);
        filePathCallback = null;
    }

    @Override
    public void onBackPressed() {

        if (webView != null &&
                webView.canGoBack()) {

            webView.goBack();

        } else {

            super.onBackPressed();
        }
    }

    @Override
    protected void onDestroy() {

        if (webView != null) {
            webView.stopLoading();
            webView.destroy();
            webView = null;
        }

        super.onDestroy();
    }
}
'''

          Path(
              "mbms_android/app/src/main/java/com/mbms/app/MainActivity.java"
          ).write_text(java, encoding="utf-8")

          print("MainActivity created.")
          PY

      - name: Validate Android project
        shell: bash
        run: |
          set -e

          test -s mbms_android/settings.gradle
          test -s mbms_android/build.gradle
          test -s mbms_android/gradle.properties
          test -s mbms_android/app/build.gradle
          test -s mbms_android/app/src/main/AndroidManifest.xml
          test -s mbms_android/app/src/main/java/com/mbms/app/MainActivity.java
          test -s mbms_android/app/src/main/assets/index.html

          grep -q \
            "class MainActivity extends Activity" \
            mbms_android/app/src/main/java/com/mbms/app/MainActivity.java

          grep -q \
            "import android.print.PrintAttributes;" \
            mbms_android/app/src/main/java/com/mbms/app/MainActivity.java

          grep -q \
            "createPrintDocumentAdapter" \
            mbms_android/app/src/main/java/com/mbms/app/MainActivity.java

          grep -q \
            "saveBackup" \
            mbms_android/app/src/main/java/com/mbms/app/MainActivity.java

          grep -q \
            "requestRestore" \
            mbms_android/app/src/main/java/com/mbms/app/MainActivity.java

          grep -q \
            "applicationId 'com.mbms.app'" \
            mbms_android/app/build.gradle

          if grep -Riq "androidx.appcompat" mbms_android; then
            echo "ERROR: AppCompat detected."
            exit 1
          fi

          echo "Android project validation PASSED."

      - name: Create Gradle Wrapper
        working-directory: mbms_android
        shell: bash
        run: |
          set -e

          gradle wrapper \
            --gradle-version 8.7 \
            --distribution-type bin

          chmod +x gradlew

          ./gradlew --version

      - name: Compile MBMS Java
        working-directory: mbms_android
        shell: bash
        run: |
          set -e

          ./gradlew \
            --no-daemon \
            --stacktrace \
            :app:compileDebugJavaWithJavac

          echo "JAVA COMPILATION PASSED."

      - name: Build MBMS V118 Debug APK
        working-directory: mbms_android
        shell: bash
        run: |
          set -e

          ./gradlew \
            --no-daemon \
            --stacktrace \
            clean \
            :app:assembleDebug

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"

          mkdir -p ../release

          cp \
            "$APK" \
            "../release/MBMS-V118-PRINT-BACKUP-INSTALL-FIX.apk"

          echo "APK generated:"
          ls -lh \
            "../release/MBMS-V118-PRINT-BACKUP-INSTALL-FIX.apk"

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="release/MBMS-V118-PRINT-BACKUP-INSTALL-FIX.apk"

          test -s "$APK"

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify \
            --verbose \
            "$APK"

          unzip -t \
            "$APK" \
            >/dev/null

          sha256sum \
            "$APK" \
            | tee release/SHA256.txt

          echo "APK SIGNATURE AND ZIP VERIFICATION PASSED."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MBMS-V118-PRINT-BACKUP-INSTALL-FIX
          path: |
            release/MBMS-V118-PRINT-BACKUP-INSTALL-FIX.apk
            release/SHA256.txt
          if-no-files-found: error
