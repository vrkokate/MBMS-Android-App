"""
​master_script = """
<script id="MBMS_JE_SAFE_CONTROLLER">
(function() {
// १. वरचे केशरी REPORT बटण सुरक्षितपणे लपवणे
setInterval(function() {
document.querySelectorAll('button, a').forEach(function(b) {
if (b.textContent.trim().toUpperCase() === 'REPORT') {
var rect = b.getBoundingClientRect();
if (rect.top > 0 && rect.top < 70) {
b.style.display = 'none';
}
}
});
}, 300);
​// २. स्क्रीनवरील सर्व JE नावे १००% अचूक मिळवणे
function getJEListDirect() {
var names = [];
document.querySelectorAll('tr').forEach(function(tr) {
var tds = tr.querySelectorAll('td');
if (tds.length >= 2) {
var raw = tds[1].textContent.replace(/UPDATE|DELETE/gi, '').trim();
if (raw && raw !== 'JE नाव' && !raw.includes('Add केलेले नाही') && !raw.includes('उपलब्ध नाही')) {
if (!names.includes(raw)) names.push(raw);
}
}
});
​// जर टेबल स्ट्रक्चर सापडले नाही तर Action बटणांच्या पॅरेंटमधून शोधणे
if (names.length === 0) {
document.querySelectorAll('button').forEach(function(b) {
var txt = b.textContent.trim().toUpperCase();
if (txt === 'DELETE' || txt === 'UPDATE') {
var tr = b.closest('tr') || b.closest('[class*="row"]');
if (tr) {
var cl = tr.cloneNode(true);
cl.querySelectorAll('button').forEach(function(x){ x.remove(); });
var cleanTxt = cl.textContent.replace(/^\s*\d+\s*/, '').trim();
if (cleanTxt && cleanTxt.length > 1 && !names.includes(cleanTxt)) {
names.push(cleanTxt);
}
}
}
});
}
​// LocalStorage मधील JE शोधणे
if (names.length === 0) {
for (var i = 0; i < localStorage.length; i++) {
var k = localStorage.key(i);
try {
var arr = JSON.parse(localStorage.getItem(k));
if (Array.isArray(arr)) {
arr.forEach(function(item) {
var val = typeof item === 'object' ? (item.name || item.jeName || item.je) : item;
if (typeof val === 'string' && val.trim() && (k.toLowerCase().includes('je') || val.includes('श्री'))) {
if (!names.includes(val.trim())) names.push(val.trim());
}
});
}
} catch(e){}
}
}
return names;
}
​function syncStorageDelete(name) {
if (!name) return;
for (var i = 0; i < localStorage.length; i++) {
var k = localStorage.key(i);
try {
var arr = JSON.parse(localStorage.getItem(k));
if (Array.isArray(arr)) {
var res = arr.filter(function(x) {
var v = typeof x === 'object' ? (x.name || x.jeName || x.je) : x;
return v !== name;
});
if (res.length !== arr.length) {
localStorage.setItem(k, JSON.stringify(res));
}
}
} catch(e){}
}
}
​function syncStorageEdit(oldN, newN) {
if (!oldN || !newN) return;
for (var i = 0; i < localStorage.length; i++) {
var k = localStorage.key(i);
try {
var arr = JSON.parse(localStorage.getItem(k));
if (Array.isArray(arr)) {
var updated = false;
arr.forEach(function(x, idx) {
if (x === oldN) { arr[idx] = newN; updated = true; }
else if (typeof x === 'object' && (x.name === oldN || x.jeName === oldN)) {
if (x.name) x.name = newN;
if (x.jeName) x.jeName = newN;
updated = true;
}
});
if (updated) localStorage.setItem(k, JSON.stringify(arr));
}
} catch(e){}
}
}
​function renumberRows() {
var rows = document.querySelectorAll('table tbody tr');
rows.forEach(function(r, idx) {
var td = r.querySelector('td');
if (td) td.textContent = (idx + 1);
});
}
​// ३. इन-प्लेस UPDATE आणि DELETE लिसनर
var currentEditTr = null;
var currentOldName = null;
​document.addEventListener('click', function(e) {
var btn = e.target.closest('button, a');
if (!btn) return;
var action = (btn.textContent || '').trim().toUpperCase();
​// ---------- DELETE बटण ----------
if (action === 'DELETE') {
e.preventDefault();
e.stopPropagation();
var tr = btn.closest('tr') || btn.closest('[class*="row"]') || btn.parentElement.parentElement;
if (!tr) return;
​var name = '';
var tds = tr.querySelectorAll('td');
if (tds.length >= 2) {
name = tds[1].textContent.replace(/UPDATE|DELETE/gi, '').trim();
} else {
var cl = tr.cloneNode(true);
cl.querySelectorAll('button').forEach(function(b){ b.remove(); });
name = cl.textContent.replace(/^\s*\d+\s*/, '').trim();
}
​tr.remove();
renumberRows();
syncStorageDelete(name);
return;
}
​// ---------- UPDATE बटण (यादीतील) ----------
if (action === 'UPDATE') {
var isRow = btn.closest('tr') || btn.closest('tbody') || btn.closest('[class*="row"]');
if (isRow) {
e.preventDefault();
e.stopPropagation();
var trTarget = btn.closest('tr') || btn.closest('[class*="row"]') || btn.parentElement.parentElement;
if (!trTarget) return;
​var jeName = '';
var cells = trTarget.querySelectorAll('td');
if (cells.length >= 2) {
jeName = cells[1].textContent.replace(/UPDATE|DELETE/gi, '').trim();
}
​var input = document.querySelector('input[placeholder*="Junior Engineer"]') ||
document.querySelector('#jeName') ||
document.querySelector('input[type="text"]');
​var addBtn = Array.from(document.querySelectorAll('button')).find(function(b) {
var t = b.textContent.trim().toUpperCase();
return (t === 'ADD' || t === 'UPDATE') && b !== btn;
});
​if (input && jeName) {
input.value = jeName;
currentEditTr = trTarget;
currentOldName = jeName;
​if (addBtn) {
addBtn.textContent = 'UPDATE';
addBtn.style.backgroundColor = '#0284c7';
}
input.focus();
input.scrollIntoView({ behavior: 'smooth', block: 'center' });
}
return;
}
}
​// ---------- इनपुट समोरील ADD / UPDATE सेव्ह करणे ----------
if (currentEditTr && (action === 'UPDATE' || action === 'ADD')) {
var mainInput = document.querySelector('input[placeholder*="Junior Engineer"]') ||
document.querySelector('#jeName') ||
document.querySelector('input[type="text"]');
​if (mainInput && (btn.textContent.trim().toUpperCase() === 'UPDATE' || btn.closest('.card')?.contains(mainInput))) {
e.preventDefault();
e.stopPropagation();
var newVal = mainInput.value.trim();
if (newVal) {
var c = currentEditTr.querySelectorAll('td');
if (c.length >= 2) c[1].textContent = newVal;
syncStorageEdit(currentOldName, newVal);
​mainInput.value = '';
btn.textContent = 'ADD';
btn.style.backgroundColor = '';
currentEditTr = null;
currentOldName = null;
}
}
}
​// ---------- JE List मधील निळ्या REPORT बटणावर क्लिक ----------
if (action === 'REPORT') {
var rect = btn.getBoundingClientRect();
if (rect.top > 70) {
e.preventDefault();
e.stopPropagation();
printJEA4Report();
}
}
}, true);
​// ४. JE संपूर्ण A4 अहवाल जनरेटर
window.printJEA4Report = function() {
var pa = document.getElementById('printArea');
if (!pa) {
pa = document.createElement('div');
pa.id = 'printArea';
document.body.appendChild(pa);
}
​var list = getJEListDirect();
​var h = '<div class="report-header">';
h += '  <h2>सार्वजनिक बांधकाम विभाग</h2>';
h += '  <h3>मोजमाप पुस्तिका नियंत्रण प्रणाली</h3>';
h += '  <h4>JE REPORT</h4>';
h += '</div>';
h += '<div class="report-meta">';
h += '  <span><b>अहवाल :</b> सर्व कनिष्ठ अभियंता यादी</span>';
h += '  <span><b>दिनांक :</b> ' + new Date().toLocaleDateString('en-GB') + '</span>';
h += '</div>';
h += '<table class="print-table">';
h += '  <thead><tr>';
h += '    <th style="width:12%; text-align:center;">अ.क्र.</th>';
h += '    <th style="width:88%; text-align:left;">Junior Engineer चे नाव</th>';
h += '  </tr></thead>';
h += '  <tbody>';
​if (list.length === 0) {
h += '<tr><td colspan="2" style="text-align:center; padding:12px;">कोणतीही JE नोंद उपलब्ध नाही.</td></tr>';
} else {
for (var i = 0; i < list.length; i++) {
h += '<tr>';
h += '  <td style="text-align:center;">' + (i + 1) + '</td>';
h += '  <td style="text-align:left;">' + list[i] + '</td>';
h += '</tr>';
}
}
​h += '  </tbody>';
h += '</table>';
h += '<div class="report-footer">© सर्व हक्क राखीव - सार्वजनिक बांधकाम विभाग</div>';
​pa.innerHTML = h;
setTimeout(function(){ window.print(); }, 120);
};
​window.printJEReport = window.printJEA4Report;
})();
</script>
"""
​if "<head>" in raw_html.lower():
h_idx = raw_html.lower().find("<head>") + 6
raw_html = raw_html[:h_idx] + master_styles + raw_html[h_idx:]
else:
raw_html = master_styles + raw_html
​if "</body>" in raw_html.lower():
b_idx = raw_html.lower().rfind("</body>")
raw_html = raw_html[:b_idx] + master_script + raw_html[b_idx:]
else:
raw_html += master_script
​html_file.write_text(raw_html, encoding="utf-8")
print("SUCCESS: Injected non-destructive styles and controllers.")
PY
