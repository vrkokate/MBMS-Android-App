​master_script = """
<script id="MBMS_HARDENED_ENGINE">
(function() {
console.log("MBMS Hardened V136 Engine Initialized");
​// १. तारीख dd-mm-yyyy फॉरमॅट कन्व्हर्टर
function formatToDMY(dateVal) {
if(!dateVal) return '-';
var s = String(dateVal).trim();
if(/^\d{4}-\d{2}-\d{2}$/.test(s)) {
var p = s.split('-');
return p[2] + '-' + p[1] + '-' + p[0];
}
return s;
}
​function convertDatesInTables() {
document.querySelectorAll('table td').forEach(function(td) {
var t = td.textContent.trim();
if(/^\d{4}-\d{2}-\d{2}$/.test(t)) {
td.textContent = formatToDMY(t);
}
});
}
setInterval(convertDatesInTables, 800);
​// २. JE वरील वरचे केशरी REPORT बटण नष्ट करणे
function removeTopReportButton() {
var headers = document.querySelectorAll('.header, header, div[class*="header"]');
headers.forEach(function(h) {
var btns = h.querySelectorAll('button');
btns.forEach(function(b) {
if(b.textContent.trim().toUpperCase() === 'REPORT') {
b.remove();
}
});
});
}
setInterval(removeTopReportButton, 400);
​// ३. TRANSFER LIST मध्ये REPORT बटण जोडणे
function ensureTransferReportButton() {
var transferListTitle = Array.from(document.querySelectorAll('h2, h3, h4, h5, div, span')).find(function(el) {
return el.textContent.trim() === 'Transfer List' && !el.querySelector('button');
});
​if(transferListTitle && !document.getElementById('injectedTransferReportBtn')) {
var btn = document.createElement('button');
btn.id = 'injectedTransferReportBtn';
btn.className = 'transfer-report-btn';
btn.textContent = 'REPORT';
btn.style.marginLeft = '12px';
btn.onclick = function(e) {
e.preventDefault();
printTransferA4Report();
};
transferListTitle.appendChild(btn);
}
}
setInterval(ensureTransferReportButton, 600);
​// ४. इन-प्लेस UPDATE आणि DELETE इंजिन
var editSession = null;
​document.addEventListener('click', function(e) {
var btn = e.target.closest('button');
if(!btn) return;
var action = btn.textContent.trim().toUpperCase();
​// ---------- DELETE ACTION ----------
if(action === 'DELETE') {
e.preventDefault();
e.stopPropagation();
var tr = btn.closest('tr');
if(!tr) return;
​if(confirm("ही नोंद कायमची हटवायची का?")) {
var tbody = tr.parentNode;
var rowIdx = Array.from(tbody.children).indexOf(tr);
tr.remove();
​var pageTxt = document.body.textContent;
var storeKey = pageTxt.indexOf('JE व्यवस्थापन') !== -1 ? 'mbms_jes' :
pageTxt.indexOf('M.B. व्यवस्थापन') !== -1 ? 'mbms_mbs' : 'mbms_transfers';
try {
var list = JSON.parse(localStorage.getItem(storeKey) || '[]');
if(list.length > rowIdx) {
list.splice(rowIdx, 1);
localStorage.setItem(storeKey, JSON.stringify(list));
}
} catch(err){}
alert("नोंद यशस्वीरीत्या हटवली गेली.");
}
return;
}
​// ---------- UPDATE ACTION ----------
if(action === 'UPDATE') {
e.preventDefault();
e.stopPropagation();
var tr = btn.closest('tr');
if(!tr) return;
var tbody = tr.parentNode;
var rowIdx = Array.from(tbody.children).indexOf(tr);
var pageTxt = document.body.textContent;
​// १. JE टॅब अपडेट
if(pageTxt.indexOf('JE व्यवस्थापन') !== -1) {
var jeInput = document.querySelector('input[placeholder*="Junior Engineer"], #jeName, input[type="text"]');
var addBtn = document.querySelector('button[onclick*="add"], #addJEBtn, .btn-add') || document.querySelector('button:contains("ADD")');
if(jeInput && tr.cells[1]) {
jeInput.value = tr.cells[1].textContent.trim();
editSession = { type: 'JE', index: rowIdx, tr: tr, input: jeInput, btn: addBtn };
if(addBtn) {
addBtn.textContent = 'UPDATE';
addBtn.style.backgroundColor = '#0284c7';
}
jeInput.focus();
jeInput.scrollIntoView({ behavior: 'smooth', block: 'center' });
}
}
// २. MB टॅब अपडेट
else if(pageTxt.indexOf('M.B. व्यवस्थापन') !== -1) {
var mbNoInput = document.querySelector('input[placeholder*="001"], #mbNumber');
var dateInput = document.querySelector('input[type="date"], #receivedDate');
if(mbNoInput && tr.cells[0]) mbNoInput.value = tr.cells[0].textContent.trim();
if(dateInput && tr.cells[2]) dateInput.value = tr.cells[2].textContent.trim();
​alert("माहिती वरील रकान्यांमध्ये भरली आहे. बदल करून 'Save Entry' दाबा.");
if(mbNoInput) mbNoInput.scrollIntoView({ behavior: 'smooth', block: 'center' });
}
return;
}
​// ---------- सेव्ह / अपडेट कन्फर्म ----------
if(editSession && (action === 'UPDATE' || action === 'ADD')) {
if(editSession.type === 'JE') {
e.preventDefault();
e.stopPropagation();
var newName = editSession.input.value.trim();
if(newName && editSession.tr.cells[1]) {
editSession.tr.cells[1].textContent = newName;
try {
var jes = JSON.parse(localStorage.getItem('mbms_jes') || '[]');
if(jes[editSession.index]) {
if(typeof jes[editSession.index] === 'object') jes[editSession.index].name = newName;
else jes[editSession.index] = newName;
localStorage.setItem('mbms_jes', JSON.stringify(jes));
}
} catch(err){}
editSession.input.value = '';
if(editSession.btn) {
editSession.btn.textContent = 'ADD';
editSession.btn.style.backgroundColor = '';
}
editSession = null;
alert("कनिष्ठ अभियंत्याचे नाव यशस्वीपणे अपडेट झाले.");
}
}
}
​// ---------- JE REPORT बटण क्लिक ----------
if(action === 'REPORT') {
var parentCard = btn.closest('div')?.textContent || '';
if(parentCard.indexOf('JE List') !== -1) {
e.preventDefault();
e.stopPropagation();
printJEA4Report();
}
}
}, true);
​// ५. संपूर्ण अहवाल प्रिंट जनरेटर (A4)
function getPrintContainer() {
var pa = document.getElementById('printArea') || document.createElement('div');
pa.id = 'printArea';
document.body.appendChild(pa);
return pa;
}
​// अ. JE पूर्ण रिपोर्ट
window.printJEA4Report = function() {
var pa = getPrintContainer();
var rows = document.querySelectorAll('table tbody tr');
var list = [];
rows.forEach(function(r) {
if(r.cells.length >= 2 && r.cells[1].textContent.trim()) {
list.push(r.cells[1].textContent.trim());
}
});
​if(list.length === 0) {
try {
var stored = JSON.parse(localStorage.getItem('mbms_jes') || '[]');
stored.forEach(function(item) {
list.push(typeof item === 'object' ? (item.name || item.jeName) : item);
});
} catch(e){}
}
​var h = '<div class="report-header"><h2>सार्वजनिक बांधकाम विभाग</h2><h3>मोजमाप पुस्तिका नियंत्रण प्रणाली</h3><h4>JE REPORT</h4></div>';
h += '<div class="report-meta"><span><b>अहवाल :</b> सर्व कनिष्ठ अभियंता यादी</span><span><b>दिनांक :</b> ' + new Date().toLocaleDateString('en-GB') + '</span></div>';
h += '<table class="print-table"><thead><tr><th style="width:12%; text-align:center;">अ.क्र.</th><th style="width:88%; text-align:left;">Junior Engineer चे नाव</th></tr></thead><tbody>';
​if(list.length === 0) {
h += '<tr><td colspan="2" style="text-align:center; padding:12px;">कोणतीही JE नोंद उपलब्ध नाही.</td></tr>';
} else {
for(var i=0; i<list.length; i++) {
h += '<tr><td style="text-align:center;">' + (i+1) + '</td><td>' + list[i] + '</td></tr>';
}
}
h += '</tbody></table><div class="report-footer">© सर्व हक्क राखीव - सार्वजनिक बांधकाम विभाग</div>';
pa.innerHTML = h;
setTimeout(function(){ window.print(); }, 120);
};
​// ब. Transfer MB रिपोर्ट
window.printTransferA4Report = function() {
var pa = getPrintContainer();
var rows = document.querySelectorAll('table tbody tr');
var h = '<div class="report-header"><h2>सार्वजनिक बांधकाम विभाग</h2><h3>मोजमाप पुस्तिका नियंत्रण प्रणाली</h3><h4>TRANSFER MB REPORT</h4></div>';
h += '<div class="report-meta"><span><b>अहवाल :</b> सर्व Transfer नोंदी</span><span><b>दिनांक :</b> ' + new Date().toLocaleDateString('en-GB') + '</span></div>';
h += '<table class="print-table"><thead><tr><th style="width:8%; text-align:center;">अ.क्र.</th><th style="width:16%; text-align:center;">MB क्र.</th><th style="width:16%; text-align:center;">आकार</th><th style="width:60%; text-align:left;">स्थिती / तपशील</th></tr></thead><tbody>';
​var count = 0;
rows.forEach(function(r) {
if(r.cells.length >= 3) {
count++;
h += '<tr><td style="text-align:center;">' + count + '</td><td style="text-align:center;">' + r.cells[1].textContent.trim() + '</td><td style="text-align:center;">' + r.cells[2].textContent.trim() + '</td><td>' + (r.cells[3] ? r.cells[3].textContent.trim() : '-') + '</td></tr>';
}
});
​if(count === 0) {
h += '<tr><td colspan="4" style="text-align:center; padding:12px;">कोणतीही Transfer नोंद उपलब्ध नाही.</td></tr>';
}
h += '</tbody></table><div class="report-footer">© सर्व हक्क राखीव - सार्वजनिक बांधकाम विभाग</div>';
pa.innerHTML = h;
setTimeout(function(){ window.print(); }, 120);
};
​// ६. कार्यालय व्यवस्थापन बार
function renderOfficeControlBar() {
if(document.getElementById('mbmsOfficeBar')) return;
var offices = JSON.parse(localStorage.getItem('mbms_offices') || '[{"id":"off_default","name":"मुख्य उपविभाग"}]');
var current = localStorage.getItem('mbms_current_office') || 'off_default';
​var bar = document.createElement('div');
bar.id = 'mbmsOfficeBar';
bar.className = 'office-management-bar no-print';
bar.innerHTML = <label>🏛️ कार्यालय / उपविभाग:</label> <select id="officeSelector"> ${offices.map(function(o){ return '<option value="'+o.id+'" '+(o.id===current?'selected':'')+'>'+o.name+'</option>'; }).join('')} </select> <div class="office-btn-group"> <button type="button" class="btn-add-off" id="addNewOfficeBtn">➕ नवीन</button> <button type="button" class="btn-del-off" id="delOfficeBtn">🗑️ हटवा</button> </div>;
​document.body.insertBefore(bar, document.body.firstChild);
​document.getElementById('officeSelector').onchange = function() {
localStorage.setItem('mbms_current_office', this.value);
location.reload();
};
​document.getElementById('addNewOfficeBtn').onclick = function() {
var name = prompt("नवीन कार्यालयाचे नाव प्रविष्ट करा:");
if(name && name.trim()) {
var newId = "off_" + Date.now();
offices.push({ id: newId, name: name.trim() });
localStorage.setItem('mbms_offices', JSON.stringify(offices));
localStorage.setItem('mbms_current_office', newId);
location.reload();
}
};
​document.getElementById('delOfficeBtn').onclick = function() {
if(offices.length <= 1) return alert("किमान एक कार्यालय असणे आवश्यक आहे.");
if(confirm("निवडलेले कार्यालय आणि त्याचा सर्व डेटा कायमचा हटवायचा का?")) {
offices = offices.filter(function(x){ return x.id !== current; });
localStorage.setItem('mbms_offices', JSON.stringify(offices));
localStorage.setItem('mbms_current_office', offices[0].id);
location.reload();
}
};
}
​// ७. बॅकअप आणि रिस्टोअर
window.triggerFullBackup = function() {
try {
var snapshot = {};
for(var i=0; i<localStorage.length; i++) {
var k = localStorage.key(i);
snapshot[k] = localStorage.getItem(k);
}
var json = JSON.stringify(snapshot, null, 2);
var fname = "MBMS_Backup_" + new Date().toISOString().slice(0,10) + ".json";
if(window.MBMSAndroid && typeof window.MBMSAndroid.saveBackup === 'function') {
window.MBMSAndroid.saveBackup(json, fname);
} else {
var blob = new Blob([json], { type: "application/json" });
var url = URL.createObjectURL(blob);
var a = document.createElement('a');
a.href = url;
a.download = fname;
a.click();
alert("बॅकअप फाईल डाऊनलोड झाली.");
}
} catch(e) {
alert("बॅकअप त्रुटी: " + e.message);
}
};
​window.restoreFromBackupJSON = function(jsonText) {
try {
var parsed = JSON.parse(jsonText);
for(var key in parsed) {
localStorage.setItem(key, parsed[key]);
}
alert("डेटा यशस्वीरीत्या रिस्टोअर झाला!");
location.reload();
} catch(e) {
alert("अवैध बॅकअप फाईल!");
}
};
​// ८. हार्डवेअर बॅक बटन हँडलर
window.handleHardwareBack = function() {
if(editSession) {
if(editSession.input) editSession.input.value = '';
if(editSession.btn) {
editSession.btn.textContent = 'ADD';
editSession.btn.style.backgroundColor = '';
}
editSession = null;
alert("एडिट रद्द केले.");
return "HANDLED";
}
if(window.history.length > 1) {
window.history.back();
return "HANDLED";
}
return "EXIT";
};
​document.addEventListener('DOMContentLoaded', renderOfficeControlBar);
})();
</script>
"""
​if "<head>" in raw_html.lower():
h_idx = raw_html.lower().find("<head>") + 6
raw_html = raw_html[:h_idx] + master_styles + raw_html[h_idx:]
else:
raw_html = master_styles + raw_html
​if "</body>" in raw_html.lower():
b_idx = raw_html.lower().rfind("</body>")
raw_html = raw_html[:b_idx] + master_script + raw_html[b_idx:]
else:
raw_html += master_script
​html_file.write_text(raw_html, encoding="utf-8")
print("SUCCESS: In-place DOM rewriting and engine patching completed.")
PY
