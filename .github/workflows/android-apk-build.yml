          )

          if not scripts:
              raise SystemExit(
                  "ERROR: No JavaScript blocks found."
              )

          for i, script in enumerate(scripts):

              Path(
                  f"/tmp/mbms_script_{i}.js"
              ).write_text(
                  script,
                  encoding="utf-8"
              )

          print(
              f"Extracted {len(scripts)} JavaScript blocks."
          )
          PY

          for js in /tmp/mbms_script_*.js
          do
            node --check "$js"
          done

          grep -q \
            "V128_MBMS_SUMMARY_LINKED_FIX" \
            mbms_work/index.html

          grep -q \
            "जे चे नाव निवडा" \
            mbms_work/index.html

          grep -q \
            "सर्व JE" \
            mbms_work/index.html

          echo "FINAL HTML / JAVASCRIPT VALIDATION PASSED."

