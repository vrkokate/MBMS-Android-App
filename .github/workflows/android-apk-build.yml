                  safeArray(data.works);

                const bills=
                  safeArray(data.bills);

                const transfers=
                  safeArray(data.transfers);

                const small=
                  mbs.filter(
                    x=>sizeKey(x?.size)==='SMALL'
                  ).length;

                const large=
                  mbs.filter(
                    x=>sizeKey(x?.size)==='LARGE'
                  ).length;

                const totalAmount=
                  bills.reduce(
                    (sum,b)=>{
                      const raw=
                        String(
                          b?.amount||
                          0
                        ).replace(
                          /,/g,
                          ''
                        );

                      const num=
                        Number(
                          raw.replace(
                            /[^\d.-]/g,
                            ''
                          )
                        );

                      return sum+
                        (
                          Number.isFinite(num)
                            ? num
                            : 0
                        );
