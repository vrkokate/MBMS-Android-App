name: MBMS Final APK - Transfer Report Final

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:

    name: Build Final MBMS APK

    runs-on: ubuntu-latest

    steps:

      # =====================================================
      # 1. CHECKOUT
      # =====================================================

      - name: Checkout repository
        uses: actions/checkout@v7


      # =====================================================
      # 2. JAVA 17
      # =====================================================

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'


      # =====================================================
      # 3. ANDROID SDK
      # =====================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4


      - name: Install Android SDK
        run: |

          set -e

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"


      # =====================================================
      # 4. GRADLE 8.7
      # =====================================================

      - name: Install Gradle 8.7
        run: |

          set -e

          wget -q \
            https://services.gradle.org/distributions/gradle-8.7-bin.zip

          unzip -q \
            gradle-8.7-bin.zip \
            -d "$HOME/gradle"

          echo "$HOME/gradle/gradle-8.7/bin" >> "$GITHUB_PATH"


      # =====================================================
      # 5. FIND MBMS HTML
      # =====================================================

      - name: Find MBMS HTML
        shell: bash
        run: |

          set -e

          SOURCE=""

          if [ -f "Measurement_Book_Management_System_FINAL_V115_MB_HISTORY_ONLY_DATE-6.html" ]; then

            SOURCE="Measurement_Book_Management_System_FINAL_V115_MB_HISTORY_ONLY_DATE-6.html"

          elif [ -f "Measurement_Book_Management_System_FINAL_V115_MB_HISTORY_ONLY_DATE.html" ]; then

            SOURCE="Measurement_Book_Management_System_FINAL_V115_MB_HISTORY_ONLY_DATE.html"

          elif [ -f "Measurement_Book_Management_System_FINAL_V115.html" ]; then

            SOURCE="Measurement_Book_Management_System_FINAL_V115.html"

          elif [ -f "V115.html" ]; then

            SOURCE="V115.html"

          elif [ -f "index.html" ]; then

            SOURCE="index.html"

          else

            SOURCE="$(find . -maxdepth 3 -type f -iname '*.html' | head -n 1 || true)"

          fi


          if [ -z "$SOURCE" ]; then

            echo "ERROR: MBMS HTML file not found."

            echo ""
            echo "Repository files:"
            find . -maxdepth 3 -type f | sort

            exit 1

          fi


          echo "=========================================="
          echo "MBMS SOURCE HTML"
          echo "$SOURCE"
          echo "=========================================="


          cp "$SOURCE" /tmp/MBMS_BASE.html


          echo ""
          echo "HTML SIZE:"
          wc -c /tmp/MBMS_BASE.html


      # =====================================================
      # 6. CREATE FINAL HTML
      # =====================================================

      - name: Prepare Final MBMS HTML
        shell: bash
        run: |

          set -e

          cp \
            /tmp/MBMS_BASE.html \
            /tmp/MBMS_FINAL.html


          echo "=========================================="
          echo "FINAL MBMS HTML READY"
          echo "=========================================="

          wc -c /tmp/MBMS_FINAL.html


      # =====================================================
      # 7. VERIFY HTML
      # =====================================================

      - name: Verify Final MBMS HTML
        shell: bash
        run: |

          set -e

          FILE="/tmp/MBMS_FINAL.html"

          test -s "$FILE"

          grep -qi "<html" "$FILE"

          grep -qi "localStorage" "$FILE"

          echo "=========================================="
          echo "HTML VERIFICATION PASSED"
          echo "=========================================="


      # =====================================================
      # 8. CREATE ANDROID PROJECT
      # =====================================================

      - name: Create Android project
        shell: bash
        run: |

          set -e

          rm -rf mbms_android

          mkdir -p \
            mbms_android/app/src/main/assets

          mkdir -p \
            mbms_android/app/src/main/java/com/mbms/v118

          mkdir -p \
            mbms_android/app/src/main/res/values


          cp \
            /tmp/MBMS_FINAL.html \
            mbms_android/app/src/main/assets/index.html


      # =====================================================
      # 9. SETTINGS.GRADLE
      # =====================================================

      - name: Create settings.gradle
        run: |

          cat > mbms_android/settings.gradle <<'EOF'

          pluginManagement {

              repositories {

                  google()

                  mavenCentral()

                  gradlePluginPortal()
              }
          }


          dependencyResolutionManagement {

              repositoriesMode.set(
                  RepositoriesMode.FAIL_ON_PROJECT_REPOS
              )

              repositories {

                  google()

                  mavenCentral()
              }
          }


          rootProject.name =
              "MBMS-Final-Android"


          include(":app")

          EOF


      # =====================================================
      # 10. ROOT BUILD.GRADLE
      # =====================================================

      - name: Create root build.gradle
        run: |

          cat > mbms_android/build.gradle <<'EOF'

          plugins {

              id 'com.android.application' version '8.6.1' apply false

          }

          EOF


      # =====================================================
      # 11. GRADLE.PROPERTIES
      # =====================================================

      - name: Create gradle.properties
        run: |

          cat > mbms_android/gradle.properties <<'EOF'

          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

          android.useAndroidX=true

          android.nonTransitiveRClass=true

          EOF


      # =====================================================
      # 12. APP BUILD.GRADLE
      # =====================================================

      - name: Create app build.gradle
        run: |

          cat > mbms_android/app/build.gradle <<'EOF'

          plugins {

              id 'com.android.application'

          }


          android {

              namespace 'com.mbms.v118'

              compileSdk 35


              defaultConfig {

                  applicationId 'com.mbms.v118'

                  minSdk 26

                  targetSdk 35

                  versionCode 120

                  versionName "1.20"

              }


              buildTypes {

                  debug {

                      minifyEnabled false

                      shrinkResources false

                  }


                  release {

                      minifyEnabled false

                      shrinkResources false

                  }

              }

          }

          EOF


      # =====================================================
      # 13. ANDROID MANIFEST
      # =====================================================

      - name: Create AndroidManifest.xml
        run: |

          cat > mbms_android/app/src/main/AndroidManifest.xml <<'EOF'

          <?xml version="1.0" encoding="utf-8"?>

          <manifest
              xmlns:android="http://schemas.android.com/apk/res/android">


              <uses-permission
                  android:name="android.permission.INTERNET" />


              <uses-permission
                  android:name="android.permission.WRITE_EXTERNAL_STORAGE"
                  android:maxSdkVersion="28" />


              <application

                  android:allowBackup="true"

                  android:hardwareAccelerated="true"

                  android:usesCleartextTraffic="true"

                  android:label="@string/app_name"

                  android:theme="@style/AppTheme"

                  android:resizeableActivity="true">


                  <activity

                      android:name=".MainActivity"

                      android:exported="true"

                      android:screenOrientation="portrait">


                      <intent-filter>

                          <action
                              android:name="android.intent.action.MAIN" />

                          <category
                              android:name="android.intent.category.LAUNCHER" />

                      </intent-filter>


                  </activity>


              </application>


          </manifest>

          EOF


      # =====================================================
      # 14. STRINGS
      # =====================================================

      - name: Create strings.xml
        run: |

          cat > mbms_android/app/src/main/res/values/strings.xml <<'EOF'

          <?xml version="1.0" encoding="utf-8"?>

          <resources>

              <string name="app_name">
                  मोजमाप पुस्तिका नियंत्रण प्रणाली
              </string>

          </resources>

          EOF


      # =====================================================
      # 15. STYLES
      # =====================================================

      - name: Create styles.xml
        run: |

          cat > mbms_android/app/src/main/res/values/styles.xml <<'EOF'

          <?xml version="1.0" encoding="utf-8"?>

          <resources>


              <style
                  name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">


                  <item name="android:fontFamily">
                      sans
                  </item>


                  <item name="android:windowLightStatusBar">
                      false
                  </item>


                  <item name="android:statusBarColor">
                      #04366F
                  </item>


                  <item name="android:navigationBarColor">
                      #04366F
                  </item>


                  <item name="android:colorAccent">
                      #0755A5
                  </item>


              </style>


          </resources>

          EOF


      # =====================================================
      # 16. MAIN ACTIVITY
      # =====================================================

      - name: Create MainActivity.java
        run: |

          cat > mbms_android/app/src/main/java/com/mbms/v118/MainActivity.java <<'EOF'

          package com.mbms.v118;


          import android.app.Activity;

          import android.os.Bundle;

          import android.graphics.Color;

          import android.webkit.WebSettings;

          import android.webkit.WebView;

          import android.webkit.WebViewClient;


          public class MainActivity extends Activity {


              private WebView webView;


              @Override

              protected void onCreate(
                      Bundle savedInstanceState) {

                  super.onCreate(savedInstanceState);


                  getWindow().setStatusBarColor(
                      Color.rgb(4,54,111)
                  );


                  getWindow().setNavigationBarColor(
                      Color.rgb(4,54,111)
                  );


                  webView =
                      new WebView(this);


                  WebSettings settings =
                      webView.getSettings();


                  settings.setJavaScriptEnabled(
                      true
                  );


                  settings.setDomStorageEnabled(
                      true
                  );


                  settings.setDatabaseEnabled(
                      true
                  );


                  settings.setAllowFileAccess(
                      true
                  );


                  settings.setAllowContentAccess(
                      true
                  );


                  settings.setAllowFileAccessFromFileURLs(
                      true
                  );


                  settings.setAllowUniversalAccessFromFileURLs(
                      true
                  );


                  settings.setBuiltInZoomControls(
                      false
                  );


                  settings.setDisplayZoomControls(
                      false
                  );


                  settings.setSupportZoom(
                      false
                  );


                  settings.setJavaScriptCanOpenWindowsAutomatically(
                      true
                  );


                  webView.setWebViewClient(
                      new WebViewClient()
                  );


                  setContentView(
                      webView
                  );


                  webView.loadUrl(
                      "file:///android_asset/index.html"
                  );

              }


              @Override

              public void onBackPressed() {

                  if (
                      webView != null &&
                      webView.canGoBack()
                  ) {

                      webView.goBack();

                  } else {

                      super.onBackPressed();

                  }

              }


              @Override

              protected void onDestroy() {

                  if (webView != null) {

                      webView.destroy();

                      webView = null;

                  }


                  super.onDestroy();

              }

          }

          EOF


      # =====================================================
      # 17. PROGUARD
      # =====================================================

      - name: Create ProGuard rules
        run: |

          cat > mbms_android/app/proguard-rules.pro <<'EOF'

          # MBMS Final APK

          EOF


      # =====================================================
      # 18. VERIFY PROJECT
      # =====================================================

      - name: Verify Android project
        shell: bash
        run: |

          set -e


          test -s \
            mbms_android/app/src/main/assets/index.html


          test -s \
            mbms_android/app/src/main/java/com/mbms/v118/MainActivity.java


          test -s \
            mbms_android/app/src/main/AndroidManifest.xml


          test -s \
            mbms_android/app/build.gradle


          echo "=========================================="

          echo "ANDROID PROJECT VERIFICATION PASSED"

          echo "=========================================="


      # =====================================================
      # 19. CREATE GRADLE WRAPPER
      # =====================================================

      - name: Create Gradle Wrapper
        working-directory: mbms_android
        run: |

          set -e


          gradle wrapper \
            --gradle-version 8.7 \
            --distribution-type bin


          chmod +x gradlew


          ./gradlew --version


      # =====================================================
      # 20. JAVA COMPILE
      # =====================================================

      - name: Compile Android Java
        working-directory: mbms_android
        run: |

          set -e


          ./gradlew \
            --no-daemon \
            --stacktrace \
            :app:compileDebugJavaWithJavac


          echo "JAVA COMPILATION PASSED."


      # =====================================================
      # 21. BUILD APK
      # =====================================================

      - name: Build Final MBMS APK
        working-directory: mbms_android
        shell: bash
        run: |

          set -e


          ./gradlew \
            --no-daemon \
            --stacktrace \
            clean \
            :app:assembleDebug


          echo ""
          echo "=========================================="
          echo "GRADLE BUILD SUCCESSFUL"
          echo "=========================================="


          mkdir -p ../release


          cp \
            app/build/outputs/apk/debug/app-debug.apk \
            ../release/MBMS-Final-V120-Transfer-Report.apk


          echo ""
          echo "FINAL APK CREATED:"
          ls -lh \
            ../release/MBMS-Final-V120-Transfer-Report.apk


      # =====================================================
      # 22. VERIFY APK
      # =====================================================

      - name: Verify Final APK
        shell: bash
        run: |

          set -e


          APK="release/MBMS-Final-V120-Transfer-Report.apk"


          test -s "$APK"


          echo ""
          echo "APK FILE:"
          ls -lh "$APK"


          echo ""
          echo "APK SHA256:"


          sha256sum "$APK"


          echo ""
          echo "=========================================="
          echo "FINAL APK VERIFICATION PASSED"
          echo "=========================================="


      # =====================================================
      # 23. CREATE SHA256 FILE
      # =====================================================

      - name: Create SHA256 file
        shell: bash
        run: |

          set -e


          sha256sum \
            release/MBMS-Final-V120-Transfer-Report.apk \
            > release/SHA256.txt


          cat release/SHA256.txt


      # =====================================================
      # 24. UPLOAD APK ARTIFACT
      # =====================================================

      - name: Upload Final APK
        uses: actions/upload-artifact@v6
        with:

          name: MBMS-Final-V120-Transfer-Report-APK

          path: |

            release/MBMS-Final-V120-Transfer-Report.apk

            release/SHA256.txt

          if-no-files-found: error

          retention-days: 30


      # =====================================================
      # 25. FINAL SUCCESS
      # =====================================================

      - name: FINAL BUILD SUCCESS
        run: |

          echo ""

          echo "================================================"

          echo "       MBMS FINAL APK BUILD SUCCESS"

          echo "================================================"

          echo ""

          echo "APK BUILD        : SUCCESS"

          echo "APK PACKAGE      : SUCCESS"

          echo "APK ARTIFACT     : SUCCESS"

          echo "SHA256           : CREATED"

          echo ""

          echo "================================================"
