            window.loadHomeRelComponents=function(){renderComponents();};

            if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',bind);else bind();
          })();
          PATCH_JS
          python3 <<'PY'
          from pathlib import Path

          html_path = Path("mbms_work/index.html")
          patch_path = Path("/tmp/mbms_summary_patch.js")

          text = html_path.read_text(encoding="utf-8")
          patch = patch_path.read_text(encoding="utf-8").rstrip()

          # Refuse to proceed if the patch itself contains a raw script end tag.
          # That would terminate the injected script early.
          if "</script>" in patch.lower():
              raise SystemExit(
                  "ERROR: MB Summary patch contains an unsafe </script> token."
              )

          marker = "</body>"
          pos = text.lower().rfind(marker.lower())

          if pos < 0:
              raise SystemExit(
                  "ERROR: </body> marker not found; refusing unsafe patch."
              )

          script_block = (
              '<script id="V128_MBMS_SUMMARY_LINKED_FIX">\n'
              + patch
              + '\n</script>\n'
          )

          text = text[:pos] + script_block + text[pos:]

          required = [
              "V128 - ONLY M.B. SUMMARY LINKED DRILL-DOWN FIX",
              "loadHomeRelDetails",
              "showHomeRelationship",
              "window.printHomeRelationshipReport",
              "__SMALL_MB__",
              "__LARGE_MB__"
          ]

          for item in required:
              if item not in text:
                  raise SystemExit(
                      "ERROR: MB Summary patch marker missing: " + item
                  )

          html_path.write_text(text, encoding="utf-8")

          print("MB SUMMARY PATCH APPLIED INSIDE EXECUTABLE <script> BLOCK.")
          print("Base64 was not used.")
          print("Final HTML size:", html_path.stat().st_size)
          PY

