name: MBMS Final APK - Transfer Report

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Final MBMS APK
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # 1. Checkout repository
      # =========================================================
      - name: Checkout repository
        uses: actions/checkout@v7


      # =========================================================
      # 2. Java 17
      # =========================================================
      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'


      # =========================================================
      # 3. Android SDK
      # =========================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4


      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"


      # =========================================================
      # 4. Gradle 8.7
      # =========================================================
      - name: Install Gradle 8.7
        run: |
          wget -q \
            https://services.gradle.org/distributions/gradle-8.7-bin.zip

          unzip -q gradle-8.7-bin.zip -d "$HOME/gradle"

          echo "$HOME/gradle/gradle-8.7/bin" >> "$GITHUB_PATH"


      # =========================================================
      # 5. Select FINAL HTML
      # =========================================================
      - name: Select Final MBMS HTML
        shell: bash
        run: |
          set -e

          FINAL_HTML="Measurement_Book_Management_System_FINAL_V120_TRANSFER_REPORT_FINAL.html"

          if [ ! -f "$FINAL_HTML" ]; then
            echo "ERROR: Final V120 Transfer Report HTML not found."
            echo ""
            echo "Files available:"
            find . -maxdepth 2 -type f | sort
            exit 1
          fi

          echo "Using FINAL HTML:"
          echo "$FINAL_HTML"

          echo "HTML size:"
          wc -c "$FINAL_HTML"

          cp "$FINAL_HTML" /tmp/MBMS_FINAL.html


      # =========================================================
      # 6. Verify FINAL HTML
      # =========================================================
      - name: Verify Final HTML
        shell: bash
        run: |
          set -e

          FILE="/tmp/MBMS_FINAL.html"

          test -s "$FILE"

          grep -qi "<html" "$FILE"

          grep -qi "openTransferReport" "$FILE"

          grep -qi "M.B. TRANSFER REPORT" "$FILE"

          grep -qi "Created By विठ्ठल कोकाटे पाटील 8446556141" "$FILE"

          grep -qi "सध्या ही M.B." "$FILE"

          echo "=========================================="
          echo "FINAL HTML VERIFICATION PASSED"
          echo "=========================================="
          echo "Transfer Report : FOUND"
          echo "Current Holder  : FOUND"
          echo "Created By      : FOUND"
          echo "=========================================="


      # =========================================================
      # 7. Create Android project
      # =========================================================
      - name: Create Android project
        shell: bash
        run: |
          set -e

          rm -rf mbms_android

          mkdir -p mbms_android/app/src/main/assets

          mkdir -p \
            mbms_android/app/src/main/java/com/mbms/v118

          mkdir -p \
            mbms_android/app/src/main/res/values

          cp \
            /tmp/MBMS_FINAL.html \
            mbms_android/app/src/main/assets/index.html


      # =========================================================
      # 8. settings.gradle
      # =========================================================
      - name: Create settings.gradle
        run: |
          cat > mbms_android/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)

              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "MBMS-Final-Android"

          include(":app")
          EOF


      # =========================================================
      # 9. Root build.gradle
      # =========================================================
      - name: Create root build.gradle
        run: |
          cat > mbms_android/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF


      # =========================================================
      # 10. gradle.properties
      # =========================================================
      - name: Create gradle.properties
        run: |
          cat > mbms_android/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF


      # =========================================================
      # 11. app/build.gradle
      # =========================================================
      - name: Create app build.gradle
        run: |
          cat > mbms_android/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {

              namespace 'com.mbms.v118'

              compileSdk 35

              defaultConfig {

                  applicationId 'com.mbms.v118'

                  minSdk 26

                  targetSdk 35

                  versionCode 121

                  versionName "1.21"
              }

              buildTypes {

                  debug {

                      minifyEnabled false

                      shrinkResources false
                  }

                  release {

                      minifyEnabled false

                      shrinkResources false
                  }
              }
          }
          EOF


      # =========================================================
      # 12. AndroidManifest.xml
      # =========================================================
      - name: Create AndroidManifest.xml
        run: |
          cat > mbms_android/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <manifest
              xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission
                  android:name="android.permission.INTERNET" />

              <uses-permission
                  android:name="android.permission.WRITE_EXTERNAL_STORAGE"
                  android:maxSdkVersion="28" />

              <application

                  android:allowBackup="true"

                  android:hardwareAccelerated="true"

                  android:usesCleartextTraffic="true"

                  android:label="@string/app_name"

                  android:theme="@style/AppTheme"

                  android:resizeableActivity="true">

                  <activity

                      android:name=".MainActivity"

                      android:exported="true"

                      android:screenOrientation="portrait">

                      <intent-filter>

                          <action
                              android:name="android.intent.action.MAIN" />

                          <category
                              android:name="android.intent.category.LAUNCHER" />

                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF


      # =========================================================
      # 13. strings.xml
      # =========================================================
      - name: Create strings.xml
        run: |
          cat > mbms_android/app/src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <resources>

              <string name="app_name">
                  मोजमाप पुस्तिका नियंत्रण प्रणाली
              </string>

          </resources>
          EOF


      # =========================================================
      # 14. styles.xml
      # =========================================================
      - name: Create styles.xml
        run: |
          cat > mbms_android/app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <resources>

              <style
                  name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">

                  <item name="android:fontFamily">
                      sans
                  </item>

                  <item name="android:windowLightStatusBar">
                      false
                  </item>

                  <item name="android:statusBarColor">
                      #04366F
                  </item>

                  <item name="android:navigationBarColor">
                      #04366F
                  </item>

                  <item name="android:colorAccent">
                      #0755A5
                  </item>

              </style>

          </resources>
          EOF


      # =========================================================
      # 15. MainActivity.java
      # =========================================================
      - name: Create MainActivity.java
        run: |
          cat > mbms_android/app/src/main/java/com/mbms/v118/MainActivity.java <<'EOF'
          package com.mbms.v118;

          import android.Manifest;
          import android.app.Activity;
          import android.content.ContentResolver;
          import android.content.ContentValues;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Environment;
          import android.provider.MediaStore;
          import android.print.PrintAttributes;
          import android.print.PrintDocumentAdapter;
          import android.print.PrintManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Toast;

          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.OutputStream;
          import java.nio.charset.StandardCharsets;


          public class MainActivity extends Activity {

              private static final int REQUEST_FILE_CHOOSER = 7001;

              private static final int REQUEST_WRITE_STORAGE = 7002;


              private WebView webView;


              private ValueCallback<Uri[]> filePathCallback;


              private String pendingBackupJson;

              private String pendingBackupName;


              @Override
              protected void onCreate(Bundle savedInstanceState) {

                  super.onCreate(savedInstanceState);


                  getWindow().setStatusBarColor(
                          Color.rgb(4, 54, 111)
                  );


                  getWindow().setNavigationBarColor(
                          Color.rgb(4, 54, 111)
                  );


                  webView = new WebView(this);


                  WebSettings settings =
                          webView.getSettings();


                  settings.setJavaScriptEnabled(true);

                  settings.setDomStorageEnabled(true);

                  settings.setDatabaseEnabled(true);


                  settings.setAllowFileAccess(true);

                  settings.setAllowContentAccess(true);

                  settings.setAllowFileAccessFromFileURLs(true);

                  settings.setAllowUniversalAccessFromFileURLs(true);


                  settings.setBuiltInZoomControls(false);

                  settings.setDisplayZoomControls(false);

                  settings.setSupportZoom(false);

                  settings.setLoadWithOverviewMode(false);

                  settings.setUseWideViewPort(false);


                  settings.setJavaScriptCanOpenWindowsAutomatically(
                          true
                  );


                  settings.setSupportMultipleWindows(false);


                  // =====================================================
                  // WebChromeClient
                  // =====================================================

                  webView.setWebChromeClient(
                          new WebChromeClient() {

                              @Override
                              public boolean onShowFileChooser(
                                      WebView webView,
                                      ValueCallback<Uri[]> callback,
                                      FileChooserParams params) {

                                  if (filePathCallback != null) {

                                      filePathCallback.onReceiveValue(
                                              null
                                      );
                                  }


                                  filePathCallback = callback;


                                  Intent intent =
                                          new Intent(
                                                  Intent.ACTION_OPEN_DOCUMENT
                                          );


                                  intent.addCategory(
                                          Intent.CATEGORY_OPENABLE
                                  );


                                  intent.setType(
                                          "application/json"
                                  );


                                  intent.putExtra(
                                          Intent.EXTRA_ALLOW_MULTIPLE,
                                          false
                                  );


                                  try {

                                      startActivityForResult(
                                              intent,
                                              REQUEST_FILE_CHOOSER
                                      );

                                  } catch (Exception e) {

                                      filePathCallback = null;

                                      return false;
                                  }


                                  return true;
                              }
                          }
                  );


                  // =====================================================
                  // WebViewClient
                  // =====================================================

                  webView.setWebViewClient(
                          new WebViewClient() {

                              @Override
                              public boolean shouldOverrideUrlLoading(
                                      WebView view,
                                      WebResourceRequest request) {

                                  return false;
                              }


                              @Override
                              public void onPageFinished(
                                      WebView view,
                                      String url) {

                                  super.onPageFinished(
                                          view,
                                          url
                                  );


                                  installNativeBridges(view);
                              }
                          }
                  );


                  // =====================================================
                  // Native bridges
                  // =====================================================

                  webView.addJavascriptInterface(
                          new AndroidBackupBridge(),
                          "AndroidBackup"
                  );


                  webView.addJavascriptInterface(
                          new AndroidPrintBridge(),
                          "AndroidPrint"
                  );


                  webView.setBackgroundColor(
                          Color.rgb(238, 246, 255)
                  );


                  setContentView(webView);


                  webView.loadUrl(
                          "file:///android_asset/index.html"
                  );
              }


              // =========================================================
              // Inject native functions into existing V120 HTML
              // =========================================================

              private void installNativeBridges(WebView view) {


                  // =======================================================
                  // PRINT
                  // =======================================================

                  String printScript =
                          "javascript:(function(){"
                          + "try{"

                          + "window.print=function(){"

                          + "if(window.AndroidPrint){"
                          + "window.AndroidPrint.printPage();"
                          + "}"

                          + "};"

                          + "}catch(e){"
                          + "console.error(e);"
                          + "}"

                          + "})()";


                  view.evaluateJavascript(
                          printScript,
                          null
                  );


                  // =======================================================
                  // BACKUP SAVE
                  // =======================================================

                  String backupScript =
                          "javascript:(function(){"
                          + "try{"

                          + "if(typeof mbmsSettingsSnapshot!=='function'){"
                          + "return;"
                          + "}"

                          + "window.downloadSettingsBackup=function(){"

                          + "try{"

                          + "var data=JSON.stringify("
                          + "mbmsSettingsSnapshot(),null,2"
                          + ");"

                          + "var d=new Date();"

                          + "var y=d.getFullYear();"

                          + "var m=String(d.getMonth()+1).padStart(2,'0');"

                          + "var day=String(d.getDate()).padStart(2,'0');"

                          + "var filename="
                          + "'MBMS_Backup_'+y+'-'+m+'-'+day+'.json';"

                          + "if(window.AndroidBackup){"

                          + "window.AndroidBackup.saveBackup("
                          + "data,filename"
                          + ");"

                          + "}"

                          + "}catch(e){"

                          + "console.error(e);"

                          + "alert('Backup Save करताना त्रुटी आली.');"

                          + "}"

                          + "};"

                          + "}catch(e){"
                          + "console.error(e);"
                          + "}"

                          + "})()";


                  view.evaluateJavascript(
                          backupScript,
                          null
                  );
              }


              // =========================================================
              // SAVE BACKUP
              // =========================================================

              private void saveBackupToDownloads(
                      String json,
                      String fileName) {


                  if (json == null) {
                      json = "";
                  }


                  if (
                          fileName == null ||
                          fileName.trim().isEmpty()
                  ) {

                      fileName =
                              "MBMS_Backup.json";
                  }


                  final String finalJson =
                          json;


                  final String finalName =
                          fileName;


                  // -----------------------------------------------------
                  // Android 10+
                  // -----------------------------------------------------

                  if (
                          Build.VERSION.SDK_INT >=
                                  Build.VERSION_CODES.Q
                  ) {


                      try {

                          ContentValues values =
                                  new ContentValues();


                          values.put(
                                  MediaStore.Downloads.DISPLAY_NAME,
                                  finalName
                          );


                          values.put(
                                  MediaStore.Downloads.MIME_TYPE,
                                  "application/json"
                          );


                          values.put(
                                  MediaStore.Downloads.RELATIVE_PATH,
                                  Environment.DIRECTORY_DOWNLOADS
                          );


                          values.put(
                                  MediaStore.Downloads.IS_PENDING,
                                  1
                          );


                          Uri uri =
                                  getContentResolver().insert(
                                          MediaStore.Downloads
                                                  .EXTERNAL_CONTENT_URI,
                                          values
                                  );


                          if (uri == null) {

                              showToast(
                                      "Backup Save झाले नाही."
                              );

                              return;
                          }


                          OutputStream output =
                                  getContentResolver()
                                          .openOutputStream(uri);


                          if (output == null) {

                              getContentResolver().delete(
                                      uri,
                                      null,
                                      null
                              );

                              showToast(
                                      "Backup Save झाले नाही."
                              );

                              return;
                          }


                          try {

                              output.write(
                                      finalJson.getBytes(
                                              StandardCharsets.UTF_8
                                      )
                              );

                              output.flush();

                          } finally {

                              output.close();
                          }


                          ContentValues complete =
                                  new ContentValues();


                          complete.put(
                                  MediaStore.Downloads.IS_PENDING,
                                  0
                          );


                          getContentResolver().update(
                                  uri,
                                  complete,
                                  null,
                                  null
                          );


                          showToast(
                                  "Backup Save झाले. Downloads मध्ये पहा."
                          );


                      } catch (Exception e) {

                          e.printStackTrace();

                          showToast(
                                  "Backup Save करताना त्रुटी आली."
                          );
                      }


                      return;
                  }


                  // -----------------------------------------------------
                  // Android 8 / 9
                  // -----------------------------------------------------

                  if (
                          checkSelfPermission(
                                  Manifest.permission.WRITE_EXTERNAL_STORAGE
                          ) != PackageManager.PERMISSION_GRANTED
                  ) {


                      pendingBackupJson =
                              finalJson;

                      pendingBackupName =
                              finalName;


                      requestPermissions(
                              new String[]{
                                      Manifest.permission
                                              .WRITE_EXTERNAL_STORAGE
                              },
                              REQUEST_WRITE_STORAGE
                      );


                      return;
                  }


                  saveLegacyBackup(
                          finalJson,
                          finalName
                  );
              }


              // =========================================================
              // Legacy backup
              // =========================================================

              private void saveLegacyBackup(
                      String json,
                      String fileName) {

                  try {

                      File downloads =
                              Environment
                                      .getExternalStoragePublicDirectory(
                                              Environment
                                                      .DIRECTORY_DOWNLOADS
                                      );


                      if (!downloads.exists()) {

                          downloads.mkdirs();
                      }


                      File backup =
                              new File(
                                      downloads,
                                      fileName
                              );


                      FileOutputStream output =
                              new FileOutputStream(
                                      backup
                              );


                      try {

                          output.write(
                                  json.getBytes(
                                          StandardCharsets.UTF_8
                                  )
                          );

                          output.flush();

                      } finally {

                          output.close();
                      }


                      showToast(
                              "Backup Save झाले. Downloads मध्ये पहा."
                      );


                  } catch (Exception e) {

                      e.printStackTrace();

                      showToast(
                              "Backup Save करताना त्रुटी आली."
                      );
                  }
              }


              // =========================================================
              // File picker result
              // =========================================================

              @Override
              protected void onActivityResult(
                      int requestCode,
                      int resultCode,
                      Intent data) {

                  super.onActivityResult(
                          requestCode,
                          resultCode,
                          data
                  );


                  if (
                          requestCode ==
                                  REQUEST_FILE_CHOOSER
                  ) {


                      if (filePathCallback == null) {
                          return;
                      }


                      Uri[] results =
                              null;


                      if (
                              resultCode ==
                                      RESULT_OK &&
                              data != null
                      ) {


                          Uri uri =
                                  data.getData();


                          if (uri != null) {

                              results =
                                      new Uri[]{
                                              uri
                                      };
                          }
                      }


                      filePathCallback.onReceiveValue(
                              results
                      );


                      filePathCallback = null;
                  }
              }


              // =========================================================
              // Permission result
              // =========================================================

              @Override
              public void onRequestPermissionsResult(
                      int requestCode,
                      String[] permissions,
                      int[] grantResults) {

                  super.onRequestPermissionsResult(
                          requestCode,
                          permissions,
                          grantResults
                  );


                  if (
                          requestCode ==
                                  REQUEST_WRITE_STORAGE
                  ) {


                      if (
                              grantResults.length > 0 &&
                              grantResults[0] ==
                                      PackageManager.PERMISSION_GRANTED
                      ) {


                          if (
                                  pendingBackupJson != null
                          ) {

                              saveLegacyBackup(
                                      pendingBackupJson,
                                      pendingBackupName
                              );
                          }


                      } else {

                          showToast(
                                  "Storage permission आवश्यक आहे."
                          );
                      }


                      pendingBackupJson = null;

                      pendingBackupName = null;
                  }
              }


              // =========================================================
              // Toast
              // =========================================================

              private void showToast(
                      String message
              ) {

                  runOnUiThread(
                          () ->
                                  Toast.makeText(
                                          MainActivity.this,
                                          message,
                                          Toast.LENGTH_LONG
                                  ).show()
                  );
              }


              // =========================================================
              // NATIVE PRINT
              // =========================================================

              public void startPrintJob() {


                  if (webView == null) {
                      return;
                  }


                  PrintManager manager =
                          (PrintManager)
                                  getSystemService(
                                          Context.PRINT_SERVICE
                                  );


                  if (manager == null) {

                      showToast(
                              "Print Service उपलब्ध नाही."
                      );

                      return;
                  }


                  PrintDocumentAdapter adapter =
                          webView.createPrintDocumentAdapter(
                                  "MBMS Report"
                          );


                  PrintAttributes attributes =
                          new PrintAttributes.Builder()

                                  .setMediaSize(
                                          PrintAttributes.MediaSize.ISO_A4
                                  )

                                  .setMinMargins(
                                          PrintAttributes.Margins.NO_MARGINS
                                  )

                                  .setResolution(
                                          new PrintAttributes.Resolution(
                                                  "MBMS_PRINT",
                                                  "MBMS Print",
                                                  300,
                                                  300
                                          )
                                  )

                                  .build();


                  manager.print(
                          "MBMS Report",
                          adapter,
                          attributes
                  );
              }


              // =========================================================
              // Print bridge
              // =========================================================

              public class AndroidPrintBridge {

                  @JavascriptInterface
                  public void printPage() {

                      runOnUiThread(
                              () ->
                                      startPrintJob()
                      );
                  }
              }


              // =========================================================
              // Backup bridge
              // =========================================================

              public class AndroidBackupBridge {

                  @JavascriptInterface
                  public void saveBackup(
                          String json,
                          String fileName
                  ) {

                      runOnUiThread(
                              () ->
                                      saveBackupToDownloads(
                                              json,
                                              fileName
                                      )
                      );
                  }
              }


              // =========================================================
              // Back
              // =========================================================

              @Override
              public void onBackPressed() {

                  if (
                          webView != null &&
                          webView.canGoBack()
                  ) {

                      webView.goBack();

                  } else {

                      super.onBackPressed();
                  }
              }


              // =========================================================
              // Cleanup
              // =========================================================

              @Override
              protected void onDestroy() {

                  if (webView != null) {

                      webView.stopLoading();

                      webView.removeJavascriptInterface(
                              "AndroidBackup"
                      );

                      webView.removeJavascriptInterface(
                              "AndroidPrint"
                      );

                      webView.destroy();

                      webView = null;
                  }


                  super.onDestroy();
              }

          }
          EOF


      # =========================================================
      # 16. ProGuard
      # =========================================================
      - name: Create ProGuard rules
        run: |
          cat > mbms_android/app/proguard-rules.pro <<'EOF'
          # MBMS Final APK
          # Minification disabled.
          EOF


      # =========================================================
      # 17. Validate Android source
      # =========================================================
      - name: Validate Android source
        shell: bash
        run: |
          set -e

          test -s \
            mbms_android/app/src/main/assets/index.html

          test -s \
            mbms_android/app/src/main/java/com/mbms/v118/MainActivity.java

          test -s \
            mbms_android/app/src/main/AndroidManifest.xml

          grep -q "PrintManager" \
            mbms_android/app/src/main/java/com/mbms/v118/MainActivity.java

          grep -q "createPrintDocumentAdapter" \
            mbms_android/app/src/main/java/com/mbms/v118/MainActivity.java

          grep -q "AndroidBackupBridge" \
            mbms_android/app/src/main/java/com/mbms/v118/MainActivity.java

          grep -q "MediaStore.Downloads" \
            mbms_android/app/src/main/java/com/mbms/v118/MainActivity.java

          grep -q "onShowFileChooser" \
            mbms_android/app/src/main/java/com/mbms/v118/MainActivity.java

          echo "Android source validation PASSED."


      # =========================================================
      # 18. Create Gradle wrapper
      # =========================================================
      - name: Create Gradle Wrapper
        working-directory: mbms_android
        run: |
          set -e

          gradle wrapper \
            --gradle-version 8.7 \
            --distribution-type bin

          chmod +x gradlew

          ./gradlew --version


      # =========================================================
      # 19. Compile Java
      # =========================================================
      - name: Compile Android Java
        working-directory: mbms_android
        run: |
          set -e

          ./gradlew \
            --no-daemon \
            --stacktrace \
            :app:compileDebugJavaWithJavac

          echo "JAVA COMPILATION PASSED."


      # =========================================================
      # 20. Build APK
      # =========================================================
      - name: Build Final MBMS APK
        working-directory: mbms_android
        run: |
          set -e

          ./gradlew \
            --no-daemon \
            --stacktrace \
            clean \
            :app:assembleDebug

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"

          mkdir -p ../release

          cp "$APK" \
            "../release/MBMS-Final-V120-Transfer-Backup-Print.apk"

          ls -lh \
            "../release/MBMS-Final-V120-Transfer-Backup-Print.apk"


      # =========================================================
      # 21. Verify APK
      # =========================================================
      - name: Verify Final APK
        shell: bash
        run: |
          set -e

          APK="release/MBMS-Final-V120-Transfer-Backup-Print.apk"

          test -s "$APK"

          SIZE=$(stat -c%s "$APK")

          echo "Final APK size: $SIZE bytes"

          if [ "$SIZE" -lt 50000 ]; then
            echo "ERROR: APK is unexpectedly small."
            exit 1
          fi


          unzip -t "$APK" >/dev/null

          unzip -l "$APK" |
            grep -q "AndroidManifest.xml"

          unzip -l "$APK" |
            grep -q "classes.dex"


          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify \
            --verbose \
            "$APK"


          echo "=========================================="
          echo "FINAL APK VERIFICATION PASSED"
          echo "=========================================="


      # =========================================================
      # 22. SHA256
      # =========================================================
      - name: Generate SHA256
        shell: bash
        run: |
          set -e

          sha256sum \
            release/MBMS-Final-V120-Transfer-Backup-Print.apk \
            > release/SHA256.txt

          cat release/SHA256.txt


      # =========================================================
      # 23. Upload
      # =========================================================
      - name: Upload Final APK
        uses: actions/upload-artifact@v6
        with:
          name: MBMS-Final-V120-Transfer-Backup-Print
          path: |
            release/MBMS-Final-V120-Transfer-Backup-Print.apk
            release/SHA256.txt
          if-no-files-found: error
          retention-days: 30


      # =========================================================
      # 24. Success
      # =========================================================
      - name: FINAL BUILD SUCCESS
        run: |
          echo ""
          echo "================================================"
          echo "      MBMS FINAL APK BUILD SUCCESS"
          echo "================================================"
          echo ""
          echo "Final Transfer Report : INCLUDED"
          echo "Print / PDF           : INCLUDED"
          echo "Backup Save           : INCLUDED"
          echo "Backup Restore        : INCLUDED"
          echo "Original V115 logic   : PRESERVED"
          echo ""
          echo "Application ID        : com.mbms.v118"
          echo "Version Code          : 121"
          echo "Version Name          : 1.21"
          echo ""
          echo "================================================"
