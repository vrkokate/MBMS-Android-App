name: MBMS V119 Android APK - Native Print

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    name: Build MBMS V119 Print APK
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # 1. Checkout
      # =========================================================
      - name: Checkout repository
        uses: actions/checkout@v7

      # =========================================================
      # 2. Java 17
      # =========================================================
      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # =========================================================
      # 3. Android SDK
      # =========================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # =========================================================
      # 4. Gradle
      # =========================================================
      - name: Install Gradle 8.7
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip -d "$HOME/gradle"
          echo "$HOME/gradle/gradle-8.7/bin" >> "$GITHUB_PATH"

      # =========================================================
      # 5. Locate V115 HTML
      # =========================================================
      - name: Locate MBMS HTML
        shell: bash
        run: |
          set -e

          HTML=""

          for f in \
            "Measurement_Book_Management_System_FINAL_V115_MB_HISTORY_ONLY_DATE-6.html" \
            "Measurement_Book_Management_System_FINAL_V115_MB_HISTORY_ONLY_DATE.html" \
            "Measurement_Book_Management_System_FINAL_V115.html" \
            "V115.html" \
            "index.html"
          do
            if [ -f "$f" ]; then
              HTML="$f"
              break
            fi
          done

          if [ -z "$HTML" ]; then
            HTML=$(find . -maxdepth 3 -type f -iname "*.html" | head -1 || true)
          fi

          if [ -z "$HTML" ]; then
            echo "ERROR: MBMS HTML file not found."
            exit 1
          fi

          echo "Using HTML:"
          echo "$HTML"

          cp "$HTML" /tmp/MBMS_SOURCE.html

          echo "HTML size:"
          wc -c /tmp/MBMS_SOURCE.html

      # =========================================================
      # 6. Verify HTML
      # =========================================================
      - name: Verify MBMS HTML
        run: |
          set -e

          test -s /tmp/MBMS_SOURCE.html

          grep -qi "<html" /tmp/MBMS_SOURCE.html
          grep -qi "localStorage" /tmp/MBMS_SOURCE.html
          grep -qi "window.print" /tmp/MBMS_SOURCE.html
          grep -qi "printArea" /tmp/MBMS_SOURCE.html

          echo "=========================================="
          echo "MBMS HTML verification PASSED"
          echo "Report functions      : FOUND"
          echo "window.print()        : FOUND"
          echo "printArea             : FOUND"
          echo "localStorage          : FOUND"
          echo "=========================================="

      # =========================================================
      # 7. Create Android project
      # =========================================================
      - name: Create Android project
        shell: bash
        run: |
          set -e

          rm -rf mbms_android

          mkdir -p mbms_android
          mkdir -p mbms_android/app/src/main/java/com/mbms/v118
          mkdir -p mbms_android/app/src/main/assets
          mkdir -p mbms_android/app/src/main/res/values

          cp /tmp/MBMS_SOURCE.html \
             mbms_android/app/src/main/assets/index.html

      # =========================================================
      # 8. settings.gradle
      # =========================================================
      - name: Create settings.gradle
        run: |
          cat > mbms_android/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)

              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "MBMS-V119-Android"

          include(":app")
          EOF

      # =========================================================
      # 9. Root build.gradle
      # =========================================================
      - name: Create root build.gradle
        run: |
          cat > mbms_android/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF

      # =========================================================
      # 10. gradle.properties
      # =========================================================
      - name: Create gradle.properties
        run: |
          cat > mbms_android/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

      # =========================================================
      # 11. app/build.gradle
      # =========================================================
      - name: Create app build.gradle
        run: |
          cat > mbms_android/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {

              namespace 'com.mbms.v118'

              compileSdk 35

              defaultConfig {

                  applicationId 'com.mbms.v118'

                  minSdk 26

                  targetSdk 35

                  versionCode 119

                  versionName "1.19"

              }

              buildTypes {

                  debug {

                      minifyEnabled false

                      shrinkResources false

                  }

                  release {

                      minifyEnabled false

                      shrinkResources false

                  }

              }

              packaging {

                  resources {

                      excludes += [
                          "META-INF/LICENSE*",
                          "META-INF/NOTICE*"
                      ]

                  }

              }

          }
          EOF

      # =========================================================
      # 12. AndroidManifest.xml
      # =========================================================
      - name: Create AndroidManifest.xml
        run: |
          cat > mbms_android/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <manifest
              xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission
                  android:name="android.permission.INTERNET" />

              <application
                  android:allowBackup="true"
                  android:hardwareAccelerated="true"
                  android:usesCleartextTraffic="true"
                  android:label="@string/app_name"
                  android:theme="@style/AppTheme"
                  android:resizeableActivity="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait">

                      <intent-filter>

                          <action
                              android:name="android.intent.action.MAIN" />

                          <category
                              android:name="android.intent.category.LAUNCHER" />

                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

      # =========================================================
      # 13. strings.xml
      # =========================================================
      - name: Create strings.xml
        run: |
          cat > mbms_android/app/src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <resources>

              <string name="app_name">
                  मोजमाप पुस्तिका नियंत्रण प्रणाली
              </string>

          </resources>
          EOF

      # =========================================================
      # 14. styles.xml
      # =========================================================
      - name: Create styles.xml
        run: |
          cat > mbms_android/app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <resources>

              <style
                  name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">

                  <item name="android:fontFamily">sans</item>

                  <item name="android:windowLightStatusBar">
                      false
                  </item>

                  <item name="android:statusBarColor">
                      #04366F
                  </item>

                  <item name="android:navigationBarColor">
                      #04366F
                  </item>

                  <item name="android:colorAccent">
                      #0755A5
                  </item>

              </style>

          </resources>
          EOF

      # =========================================================
      # 15. MainActivity.java
      #
      # IMPORTANT:
      # This is the Native Android Print Fix.
      # JavaScript window.print() calls Android PrintManager.
      # =========================================================
      - name: Create MainActivity.java
        run: |
          cat > mbms_android/app/src/main/java/com/mbms/v118/MainActivity.java <<'EOF'
          package com.mbms.v118;

          import android.app.Activity;
          import android.content.Context;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.print.PrintAttributes;
          import android.print.PrintManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.view.Window;

          public class MainActivity extends Activity {

              private WebView webView;

              private int printJobCounter = 0;


              @Override
              protected void onCreate(Bundle savedInstanceState) {

                  super.onCreate(savedInstanceState);

                  Window window = getWindow();

                  window.setStatusBarColor(
                          Color.rgb(4, 54, 111)
                  );

                  window.setNavigationBarColor(
                          Color.rgb(4, 54, 111)
                  );


                  webView = new WebView(this);


                  WebSettings settings =
                          webView.getSettings();


                  // =====================================================
                  // JavaScript
                  // =====================================================

                  settings.setJavaScriptEnabled(true);


                  // =====================================================
                  // localStorage
                  // =====================================================

                  settings.setDomStorageEnabled(true);

                  settings.setDatabaseEnabled(true);


                  // =====================================================
                  // Local HTML file access
                  // =====================================================

                  settings.setAllowFileAccess(true);

                  settings.setAllowContentAccess(true);

                  settings.setAllowFileAccessFromFileURLs(true);

                  settings.setAllowUniversalAccessFromFileURLs(true);


                  // =====================================================
                  // Display
                  // =====================================================

                  settings.setBuiltInZoomControls(false);

                  settings.setDisplayZoomControls(false);

                  settings.setLoadWithOverviewMode(false);

                  settings.setUseWideViewPort(false);


                  settings.setJavaScriptCanOpenWindowsAutomatically(
                          true
                  );


                  settings.setSupportMultipleWindows(false);


                  // =====================================================
                  // WebChrome
                  // =====================================================

                  webView.setWebChromeClient(
                          new WebChromeClient()
                  );


                  // =====================================================
                  // WebView Client
                  // =====================================================

                  webView.setWebViewClient(
                          new WebViewClient() {

                              @Override
                              public boolean shouldOverrideUrlLoading(
                                      WebView view,
                                      WebResourceRequest request) {

                                  return false;
                              }


                              @Override
                              public void onPageFinished(
                                      WebView view,
                                      String url) {

                                  super.onPageFinished(
                                          view,
                                          url
                                  );

                                  installPrintBridge(view);
                              }

                          }
                  );


                  // =====================================================
                  // Native Android JavaScript Bridge
                  // =====================================================

                  webView.addJavascriptInterface(
                          new AndroidPrintBridge(this),
                          "AndroidPrint"
                  );


                  // =====================================================
                  // Background
                  // =====================================================

                  webView.setBackgroundColor(
                          Color.rgb(238, 246, 255)
                  );


                  // =====================================================
                  // Load MBMS
                  // =====================================================

                  webView.loadUrl(
                          "file:///android_asset/index.html"
                  );


                  setContentView(webView);
              }


              // ==========================================================
              // Replace window.print() with Android PrintManager
              // ==========================================================

              private void installPrintBridge(WebView view) {

                  String js =
                          "javascript:(function(){" +
                          "try{" +

                          "window.print=function(){" +
                          "if(window.AndroidPrint){" +
                          "window.AndroidPrint.printPage();" +
                          "}" +
                          "};" +

                          "}catch(e){" +
                          "console.error(e);" +
                          "}" +
                          "})()";


                  view.evaluateJavascript(
                          js,
                          null
                  );
              }


              // ==========================================================
              // Native Print
              // ==========================================================

              public void startPrintJob() {

                  if (webView == null) {
                      return;
                  }


                  printJobCounter++;


                  String jobName =
                          "MBMS Report " +
                          printJobCounter;


                  PrintManager printManager =
                          (PrintManager)
                                  getSystemService(
                                          Context.PRINT_SERVICE
                                  );


                  if (printManager == null) {
                      return;
                  }


                  PrintAttributes attributes =
                          new PrintAttributes.Builder()

                                  .setMediaSize(
                                          PrintAttributes.MediaSize.ISO_A4
                                  )

                                  .setMinMargins(
                                          PrintAttributes.Margins.NO_MARGINS
                                  )

                                  .setResolution(
                                          new PrintAttributes.Resolution(
                                                  "mbms_resolution",
                                                  "MBMS Print",
                                                  300,
                                                  300
                                          )
                                  )

                                  .build();


                  android.print.PrintDocumentAdapter adapter =
                          webView.createPrintDocumentAdapter(
                                  jobName
                          );


                  printManager.print(
                          jobName,
                          adapter,
                          attributes
                  );
              }


              // ==========================================================
              // Android Back Button
              // ==========================================================

              @Override
              public void onBackPressed() {

                  if (
                          webView != null &&
                          webView.canGoBack()
                  ) {

                      webView.goBack();

                  } else {

                      super.onBackPressed();

                  }
              }


              // ==========================================================
              // Cleanup
              // ==========================================================

              @Override
              protected void onDestroy() {

                  if (webView != null) {

                      webView.stopLoading();

                      webView.removeJavascriptInterface(
                              "AndroidPrint"
                      );

                      webView.destroy();
                  }

                  super.onDestroy();
              }


              // ==========================================================
              // JavaScript Interface
              // ==========================================================

              public static class AndroidPrintBridge {

                  private final MainActivity activity;


                  public AndroidPrintBridge(
                          MainActivity activity
                  ) {

                      this.activity = activity;
                  }


                  @JavascriptInterface
                  public void printPage() {

                      activity.runOnUiThread(
                              new Runnable() {

                                  @Override
                                  public void run() {

                                      activity.startPrintJob();

                                  }

                              }
                      );
                  }
              }

          }
          EOF

      # =========================================================
      # 16. ProGuard
      # =========================================================
      - name: Create proguard-rules.pro
        run: |
          cat > mbms_android/app/proguard-rules.pro <<'EOF'
          # MBMS V119
          # Code shrinking disabled.
          EOF

      # =========================================================
      # 17. Verify Android project
      # =========================================================
      - name: Verify Android project
        run: |
          set -e

          test -f mbms_android/app/src/main/assets/index.html

          test -f \
            mbms_android/app/src/main/java/com/mbms/v118/MainActivity.java

          test -f \
            mbms_android/app/src/main/AndroidManifest.xml

          test -f \
            mbms_android/app/build.gradle

          grep -q "AndroidPrint" \
            mbms_android/app/src/main/java/com/mbms/v118/MainActivity.java

          grep -q "PrintManager" \
            mbms_android/app/src/main/java/com/mbms/v118/MainActivity.java

          grep -q "ISO_A4" \
            mbms_android/app/src/main/java/com/mbms/v118/MainActivity.java

          echo "=========================================="
          echo "ANDROID PROJECT VERIFICATION PASSED"
          echo "Native Print Bridge : FOUND"
          echo "PrintManager        : FOUND"
          echo "A4                  : FOUND"
          echo "=========================================="

      # =========================================================
      # 18. Build
      # =========================================================
      - name: Build MBMS V119 APK
        working-directory: mbms_android
        run: |
          set -e

          gradle wrapper --gradle-version 8.7

          ./gradlew \
            --no-daemon \
            --stacktrace \
            :app:assembleDebug

      # =========================================================
      # 19. Verify APK
      # =========================================================
      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="mbms_android/app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          SIZE=$(stat -c%s "$APK")

          echo "APK size: $SIZE bytes"

          if [ "$SIZE" -lt 50000 ]; then
            echo "ERROR: APK unexpectedly small."
            exit 1
          fi

          echo "APK SHA256:"
          sha256sum "$APK"

          echo "APK verification PASSED."

      # =========================================================
      # 20. Prepare release
      # =========================================================
      - name: Prepare APK
        shell: bash
        run: |
          set -e

          mkdir -p release

          cp \
            mbms_android/app/build/outputs/apk/debug/app-debug.apk \
            release/MeasurementBookManagementSystem-V119-Print.apk

          sha256sum \
            release/MeasurementBookManagementSystem-V119-Print.apk \
            > release/SHA256.txt

          echo "Release prepared."

      # =========================================================
      # 21. Upload APK
      # =========================================================
      - name: Upload MBMS V119 APK
        uses: actions/upload-artifact@v6
        with:
          name: MeasurementBookManagementSystem-V119-Print-APK
          path: |
            release/MeasurementBookManagementSystem-V119-Print.apk
            release/SHA256.txt
          if-no-files-found: error

      # =========================================================
      # 22. Final success
      # =========================================================
      - name: Build Success
        run: |
          echo ""
          echo "=============================================="
          echo "       MBMS V119 BUILD SUCCESS"
          echo "=============================================="
          echo ""
          echo "Application ID : com.mbms.v118"
          echo "Version Code   : 119"
          echo "Version Name   : 1.19"
          echo ""
          echo "HTML            : V115 preserved"
          echo "localStorage    : preserved"
          echo "Native Print    : ENABLED"
          echo "Android Print   : ENABLED"
          echo "A4              : ENABLED"
          echo "Save as PDF     : ENABLED"
          echo ""
          echo "=============================================="
