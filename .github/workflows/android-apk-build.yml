name: MBMS V118 Android APK Build - FIXED

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    name: Build MBMS V118 APK
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # 1. CHECKOUT
      # =========================================================
      - name: Checkout repository
        uses: actions/checkout@v7

      # =========================================================
      # 2. JAVA 17
      # =========================================================
      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # =========================================================
      # 3. ANDROID SDK
      # =========================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # =========================================================
      # 4. GRADLE 8.7
      # =========================================================
      - name: Install Gradle 8.7
        shell: bash
        run: |
          set -e

          wget -q \
            https://services.gradle.org/distributions/gradle-8.7-bin.zip

          unzip -q \
            gradle-8.7-bin.zip \
            -d "$HOME/gradle"

          echo "$HOME/gradle/gradle-8.7/bin" >> "$GITHUB_PATH"

          gradle --version

      # =========================================================
      # 5. LOCATE MBMS HTML
      # =========================================================
      - name: Locate MBMS HTML
        shell: bash
        run: |
          set -e

          HTML=""

          for f in \
            "Measurement_Book_Management_System_FINAL_V118_PRINT_BACKUP_ANDROID.html" \
            "Measurement_Book_Management_System_FINAL_V115_MB_HISTORY_ONLY_DATE-6.html" \
            "Measurement_Book_Management_System_FINAL_V115.html" \
            "V115.html" \
            "index.html"
          do
            if [ -f "$f" ]; then
              HTML="$f"
              break
            fi
          done

          if [ -z "$HTML" ]; then
            HTML=$(find . -maxdepth 4 \
              -type f \
              -iname "*.html" \
              | head -n 1 || true)
          fi

          if [ -z "$HTML" ]; then
            echo "ERROR: MBMS HTML file not found."
            exit 1
          fi

          echo "HTML_FILE=$HTML" >> "$GITHUB_ENV"

          echo "=========================================="
          echo "Using MBMS HTML:"
          echo "$HTML"
          echo "=========================================="

      # =========================================================
      # 6. PREPARE V118 HTML
      # =========================================================
      - name: Prepare V118 MBMS HTML
        shell: bash
        run: |
          set -e

          mkdir -p mbms_source

          cp "$HTML_FILE" mbms_source/index.html

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("mbms_source/index.html")
          text = path.read_text(encoding="utf-8")

          # =====================================================
          # A4 PRINT CSS
          # =====================================================

          css_marker = ".work-report-table th:nth-child(8)"

          css = (
              ".a4-table{"
              "width:100%;"
              "border-collapse:collapse;"
              "font-size:9.2pt;"
              "table-layout:fixed"
              "}\n"

              ".a4-table th,.a4-table td{"
              "border:1px solid #111;"
              "padding:2.5mm 1.8mm;"
              "vertical-align:top;"
              "overflow-wrap:anywhere;"
              "word-break:normal;"
              "line-height:1.25"
              "}\n"

              ".a4-table th{"
              "font-weight:800;"
              "text-align:center;"
              "background:#f1f1f1;"
              "vertical-align:middle"
              "}\n"

              ".a4-table td:first-child{"
              "text-align:center;"
              "width:14mm"
              "}\n"

              ".work-report-table th:nth-child(1),"
              ".work-report-table td:nth-child(1){width:9mm}\n"

              ".work-report-table th:nth-child(2),"
              ".work-report-table td:nth-child(2){width:31mm}\n"

              ".work-report-table th:nth-child(3),"
              ".work-report-table td:nth-child(3){width:28mm}\n"

              ".work-report-table th:nth-child(4),"
              ".work-report-table td:nth-child(4){width:27mm}\n"

              ".work-report-table th:nth-child(5),"
              ".work-report-table td:nth-child(5){width:23mm}\n"

              ".work-report-table th:nth-child(6),"
              ".work-report-table td:nth-child(6){width:19mm}\n"

              ".work-report-table th:nth-child(7),"
              ".work-report-table td:nth-child(7){width:22mm}\n"

              ".work-report-table th:nth-child(8),"
              ".work-report-table td:nth-child(8){width:23mm}\n"
          )

          if css_marker not in text:
              old_css = re.compile(
                  r'\\.a4-table\\{[^}]*\\}\\s*'
                  r'\\.a4-table th,\\.a4-table td\\{[^}]*\\}\\s*'
                  r'\\.a4-table th\\{[^}]*\\}\\s*'
                  r'\\.a4-table td:first-child\\{[^}]*\\}',
                  re.S
              )

              new_text, count = old_css.subn(
                  css,
                  text,
                  count=1
              )

              if count == 1:
                  text = new_text
                  print("OK: Existing A4 CSS replaced.")
              else:
                  text = text.replace(
                      "</style>",
                      css + "\n</style>",
                      1
                  )
                  print("OK: A4 CSS added.")
          else:
              print("OK: A4 CSS already present.")

          # =====================================================
          # WORK REPORT TABLE CLASS
          # =====================================================

          if "work-report-table" not in text:
              text = text.replace(
                  '<table class="a4-table">',
                  '<table class="a4-table work-report-table">',
                  1
              )

          # =====================================================
          # WORK REPORT HEADER
          # =====================================================

          old_headers = [
              '<th>अ.क्र.</th><th>कामाचे नाव</th><th>कॉन्ट्रॅक्टर / एजन्सी</th><th>JE चे नाव</th><th>MB क्रमांक</th>',

              '<th>अ.क्र.</th><th>कामाचे नाव</th><th>कॉन्ट्रॅक्टर/एजन्सी</th><th>JE चे नाव</th><th>MB क्रमांक</th>'
          ]

          new_headers = (
              '<th>अ.क्र.</th>'
              '<th>कामाचे नाव</th>'
              '<th>कॉन्ट्रॅक्टर / एजन्सी</th>'
              '<th>JE चे नाव</th>'
              '<th>MB क्रमांक</th>'
              '<th>काम पूर्ण?</th>'
              '<th>Bill प्रकार</th>'
              '<th>Bill रक्कम (₹)</th>'
          )

          header_done = False

          for old in old_headers:
              if old in text:
                  text = text.replace(
                      old,
                      new_headers,
                      1
                  )
                  header_done = True
                  break

          if header_done:
              print("OK: Work Report header updated to 8 columns.")
          elif "Bill रक्कम (₹)" in text:
              print("OK: Work Report already has 8 columns.")
          else:
              print("WARNING: Work Report header not found.")

          # =====================================================
          # NATIVE ANDROID BRIDGE JAVASCRIPT
          # =====================================================

          if "V118_ANDROID_BACKUP_OVERRIDE" not in text:

              # Restore button
              text = text.replace(
                  'onclick="document.getElementById(\'settingsBackupFile\').click()"',
                  'onclick="startSettingsBackupRestore()"',
                  1
              )

              bridge = r'''
          <script id="V118_ANDROID_BACKUP_OVERRIDE">
          (function(){

            "use strict";

            /* ==================================================
               BACKUP SAVE
               ================================================== */

            window.downloadSettingsBackup = function(){

              try{

                var data =
                  JSON.stringify(
                    mbmsSettingsSnapshot(),
                    null,
                    2
                  );

                var filename =
                  "MBMS_Backup_" +
                  new Date().toISOString().slice(0,10) +
                  "_" +
                  String(Date.now()).slice(-6) +
                  ".json";

                if(
                  window.MBMSAndroid &&
                  typeof window.MBMSAndroid.saveBackup === "function"
                ){

                  window.MBMSAndroid.saveBackup(
                    data,
                    filename
                  );

                  return;
                }

                /* Browser fallback */

                var blob =
                  new Blob(
                    [data],
                    {type:"application/json"}
                  );

                var url =
                  URL.createObjectURL(blob);

                var a =
                  document.createElement("a");

                a.href = url;
                a.download = filename;

                document.body.appendChild(a);

                a.click();

                a.remove();

                setTimeout(
                  function(){
                    URL.revokeObjectURL(url);
                  },
                  1000
                );

              }catch(e){

                console.error(e);

                alert(
                  "Backup Save करण्यात अडचण आली."
                );

              }

            };


            /* ==================================================
               RESTORE PICKER
               ================================================== */

            window.startSettingsBackupRestore =
              function(){

                try{

                  if(
                    window.MBMSAndroid &&
                    typeof window.MBMSAndroid.requestRestore === "function"
                  ){

                    window.MBMSAndroid.requestRestore();

                    return;
                  }

                }catch(e){

                  console.warn(e);

                }

                var input =
                  document.getElementById(
                    "settingsBackupFile"
                  );

                if(input){
                  input.click();
                }

              };


            /* ==================================================
               RESTORE JSON
               ================================================== */

            window.restoreSettingsBackupText =
              function(
                text,
                clearInput
              ){

                try{

                  var obj =
                    JSON.parse(
                      String(text || "")
                    );

                  if(
                    !obj ||
                    !obj.data ||
                    !Array.isArray(obj.data.mb) ||
                    !Array.isArray(obj.data.je) ||
                    !Array.isArray(obj.data.work) ||
                    !Array.isArray(obj.data.assignment) ||
                    !Array.isArray(obj.data.bills) ||
                    !Array.isArray(obj.data.transfer)
                  ){

                    throw new Error(
                      "Invalid MBMS backup"
                    );

                  }


                  var ok =
                    confirm(
                      "Backup मधील पूर्ण data restore करायचा आहे का?\n\n" +
                      "सध्याचा MBMS data replace होईल."
                    );


                  if(!ok){

                    if(clearInput){
                      clearInput.value = "";
                    }

                    return false;

                  }


                  saveMBs(
                    obj.data.mb
                  );

                  saveJEs(
                    obj.data.je
                  );

                  saveWorkList(
                    obj.data.work
                  );

                  saveAssignments(
                    obj.data.assignment
                  );

                  saveBills(
                    obj.data.bills
                  );

                  saveTransferHistory(
                    obj.data.transfer
                  );


                  try{
                    renderMBSummary();
                  }catch(e){}


                  try{
                    loadWorkOptions();
                    renderWorkList();
                  }catch(e){}


                  try{
                    loadAssignOptions();
                    renderAssignments();
                  }catch(e){}


                  try{
                    renderJEList();
                  }catch(e){}


                  try{
                    refreshSettingsDataCheck();
                  }catch(e){}


                  try{
                    refreshSettingsAudit();
                  }catch(e){}


                  alert(
                    "Backup data यशस्वीपणे restore झाला आहे."
                  );


                  if(clearInput){
                    clearInput.value = "";
                  }


                  return true;


                }catch(e){

                  console.error(e);

                  alert(
                    "ही valid MBMS backup file नाही."
                  );

                  if(clearInput){
                    clearInput.value = "";
                  }

                  return false;

                }

              };


            /* ==================================================
               BROWSER FILE RESTORE
               ================================================== */

            window.restoreSettingsBackup =
              function(input){

                var file =
                  input &&
                  input.files &&
                  input.files[0];

                if(!file){
                  return;
                }


                var reader =
                  new FileReader();


                reader.onload =
                  function(){

                    window.restoreSettingsBackupText(
                      reader.result,
                      input
                    );

                  };


                reader.readAsText(file);

              };


            /* ==================================================
               NATIVE BASE64 RESTORE
               ================================================== */

            window.mbmsNativeRestoreBase64 =
              function(b64){

                try{

                  var raw =
                    atob(
                      String(b64 || "")
                    );


                  var bytes =
                    new Uint8Array(
                      raw.length
                    );


                  for(
                    var i=0;
                    i<raw.length;
                    i++
                  ){

                    bytes[i] =
                      raw.charCodeAt(i);

                  }


                  var json;


                  if(
                    typeof TextDecoder ===
                    "function"
                  ){

                    json =
                      new TextDecoder(
                        "utf-8"
                      ).decode(bytes);

                  }else{

                    var encoded = "";

                    for(
                      var j=0;
                      j<bytes.length;
                      j++
                    ){

                      encoded +=
                        "%" +
                        ("00" +
                        bytes[j].toString(16))
                        .slice(-2);

                    }

                    json =
                      decodeURIComponent(
                        encoded
                      );

                  }


                  window.restoreSettingsBackupText(
                    json,
                    null
                  );


                }catch(e){

                  console.error(e);

                  alert(
                    "Backup Restore करण्यात अडचण आली."
                  );

                }

              };


            /* ==================================================
               NATIVE PRINT
               ================================================== */

            var previousPrint =
              window.print;


            window.print =
              function(){

                try{

                  if(
                    window.MBMSAndroid &&
                    typeof window.MBMSAndroid.print === "function"
                  ){

                    window.MBMSAndroid.print();

                    return;
                  }

                }catch(e){

                  console.warn(e);

                }


                if(
                  typeof previousPrint ===
                  "function"
                ){

                  previousPrint.call(window);

                }

              };

          })();
          </script>
          '''

              text =
                  text.replace(
                      "</body>",
                      bridge + "\n</body>",
                      1
                  )

              print(
                  "OK: Native Print/Backup/Restore bridge added."
              )

          else:

              print(
                  "OK: Native bridge already present."
              )

          # =====================================================
          # VERSION LABEL
          # =====================================================

          text =
              text.replace(
                  "<span>V55</span>",
                  "<span>V118 Android</span>",
                  1
              )

          # =====================================================
          # SAVE
          # =====================================================

          path.write_text(
              text,
              encoding="utf-8"
          )

          print(
              "=========================================="
          )

          print(
              "V118 HTML prepared successfully."
          )

          print(
              "HTML size:",
              path.stat().st_size,
              "bytes"
          )

          print(
              "=========================================="
          )

          PY

          test -s mbms_source/index.html

          grep -q "work-report-table" \
            mbms_source/index.html

          grep -q "startSettingsBackupRestore" \
            mbms_source/index.html

          grep -q "restoreSettingsBackupText" \
            mbms_source/index.html

          grep -q "mbmsNativeRestoreBase64" \
            mbms_source/index.html

          grep -q "V118_ANDROID_BACKUP_OVERRIDE" \
            mbms_source/index.html

          echo "V118 HTML validation PASSED."

      # =========================================================
      # 7. CREATE ANDROID PROJECT
      # =========================================================
      - name: Create Android project
        shell: bash
        run: |
          set -e

          rm -rf mbms_android

          mkdir -p \
            mbms_android/app/src/main/java/com/mbms/app

          mkdir -p \
            mbms_android/app/src/main/res/values

          mkdir -p \
            mbms_android/app/src/main/assets

          cp \
            mbms_source/index.html \
            mbms_android/app/src/main/assets/index.html


          # ====================================================
          # SETTINGS
          # ====================================================

          cat > mbms_android/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(
                  RepositoriesMode.FAIL_ON_PROJECT_REPOS
              )

              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "MBMSAndroid"

          include(":app")
          EOF


          # ====================================================
          # ROOT BUILD
          # ====================================================

          cat > mbms_android/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF


          # ====================================================
          # GRADLE PROPERTIES
          # ====================================================

          cat > mbms_android/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=false
          android.nonTransitiveRClass=true
          EOF


          # ====================================================
          # APP BUILD
          # ====================================================

          cat > mbms_android/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {

              namespace 'com.mbms.app'

              compileSdk 35

              defaultConfig {

                  applicationId 'com.mbms.app'

                  minSdk 26

                  targetSdk 35

                  versionCode 118

                  versionName 'V118'

              }

              buildTypes {

                  debug {

                      minifyEnabled false

                  }

                  release {

                      minifyEnabled false

                      shrinkResources false

                  }

              }

              compileOptions {

                  sourceCompatibility JavaVersion.VERSION_17

                  targetCompatibility JavaVersion.VERSION_17

              }

          }
          EOF


          # ====================================================
          # PROGUARD
          # ====================================================

          cat > \
            mbms_android/app/proguard-rules.pro <<'EOF'
          # MBMS V118
          # No custom ProGuard rules required.
          EOF


          # ====================================================
          # STRINGS
          # ====================================================

          cat > \
            mbms_android/app/src/main/res/values/strings.xml <<'EOF'
          <resources>

              <string name="app_name">
                  Measurement Book Management System
              </string>

          </resources>
          EOF


          # ====================================================
          # STYLES
          # IMPORTANT: COMPLETE XML
          # ====================================================

          cat > \
            mbms_android/app/src/main/res/values/styles.xml <<'EOF'
          <resources>

              <style
                  name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">

                  <item name="android:fontFamily">
                      sans
                  </item>

                  <item name="android:colorAccent">
                      #1976D2
                  </item>

                  <item name="android:windowLightStatusBar">
                      false
                  </item>

                  <item name="android:navigationBarColor">
                      #0D47A1
                  </item>

              </style>

          </resources>
          EOF


          # ====================================================
          # MANIFEST
          # ====================================================

          cat > \
            mbms_android/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <manifest
              xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission
                  android:name="android.permission.INTERNET" />

              <uses-permission
                  android:name="android.permission.WRITE_EXTERNAL_STORAGE"
                  android:maxSdkVersion="28" />


              <application

                  android:allowBackup="true"

                  android:label="@string/app_name"

                  android:theme="@style/AppTheme"

                  android:usesCleartextTraffic="true">


                  <activity

                      android:name=".MainActivity"

                      android:screenOrientation="portrait"

                      android:exported="true">


                      <intent-filter>

                          <action
                              android:name="android.intent.action.MAIN" />

                          <category
                              android:name="android.intent.category.LAUNCHER" />

                      </intent-filter>


                  </activity>


              </application>

          </manifest>
          EOF


          # ====================================================
          # MAIN ACTIVITY
          # NO APPCOMPAT
          # ====================================================

          cat > \
            mbms_android/app/src/main/java/com/mbms/app/MainActivity.java <<'EOF'
          package com.mbms.app;

          import android.app.Activity;
          import android.app.DownloadManager;
          import android.app.PrintAttributes;
          import android.content.ActivityNotFoundException;
          import android.content.ContentValues;
          import android.content.Context;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.os.Environment;
          import android.provider.MediaStore;
          import android.print.PrintManager;
          import android.webkit.DownloadListener;
          import android.webkit.JavascriptInterface;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Toast;

          import java.io.ByteArrayOutputStream;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.InputStream;
          import java.io.OutputStream;
          import java.nio.charset.StandardCharsets;


          public class MainActivity extends Activity {


              private static final int REQUEST_RESTORE = 9101;

              private static final int REQUEST_FILE = 9102;


              private WebView webView;


              private ValueCallback<Uri[]> filePathCallback;


              @Override

              protected void onCreate(
                      Bundle savedInstanceState) {

                  super.onCreate(savedInstanceState);


                  webView =
                      new WebView(this);


                  setContentView(webView);


                  WebSettings settings =
                      webView.getSettings();


                  settings.setJavaScriptEnabled(true);

                  settings.setDomStorageEnabled(true);

                  settings.setAllowFileAccess(true);

                  settings.setAllowContentAccess(true);

                  settings.setBuiltInZoomControls(false);

                  settings.setDisplayZoomControls(false);

                  settings.setSupportZoom(false);

                  settings.setDatabaseEnabled(true);


                  webView.addJavascriptInterface(
                      new AndroidBridge(),
                      "MBMSAndroid"
                  );


                  webView.setWebViewClient(
                      new WebViewClient() {

                          @Override

                          public boolean shouldOverrideUrlLoading(
                                  WebView view,
                                  WebResourceRequest request) {

                              return false;

                          }

                      }
                  );


                  webView.setWebChromeClient(
                      new WebChromeClient() {

                          @Override

                          public boolean onShowFileChooser(

                                  WebView view,

                                  ValueCallback<Uri[]> callback,

                                  FileChooserParams params) {


                              if(
                                  filePathCallback != null
                              ){

                                  filePathCallback
                                      .onReceiveValue(null);

                              }


                              filePathCallback =
                                  callback;


                              try{

                                  Intent intent =
                                      new Intent(
                                          Intent.ACTION_OPEN_DOCUMENT
                                      );


                                  intent.addCategory(
                                      Intent.CATEGORY_OPENABLE
                                  );


                                  intent.setType("*/*");


                                  startActivityForResult(
                                      intent,
                                      REQUEST_FILE
                                  );


                                  return true;


                              }catch(Exception e){

                                  filePathCallback = null;

                                  return false;

                              }

                          }

                      }
                  );


                  webView.setDownloadListener(
                      new DownloadListener() {

                          @Override

                          public void onDownloadStart(

                                  String url,

                                  String userAgent,

                                  String contentDisposition,

                                  String mimeType,

                                  long contentLength) {


                              try{


                                  DownloadManager.Request request =
                                      new DownloadManager.Request(
                                          Uri.parse(url)
                                      );


                                  if(mimeType != null){

                                      request.setMimeType(
                                          mimeType
                                      );

                                  }


                                  request.setTitle(
                                      "MBMS Download"
                                  );


                                  request.setDescription(
                                      "MBMS file download"
                                  );


                                  request.setNotificationVisibility(

                                      DownloadManager.Request
                                          .VISIBILITY_VISIBLE_NOTIFY_COMPLETED

                                  );


                                  String extension =
                                      ".bin";


                                  if(
                                      mimeType != null &&
                                      mimeType
                                          .toLowerCase()
                                          .contains("json")
                                  ){

                                      extension =
                                          ".json";

                                  }


                                  request
                                      .setDestinationInExternalPublicDir(

                                          Environment
                                              .DIRECTORY_DOWNLOADS,

                                          "MBMS_Download_" +
                                          System.currentTimeMillis() +
                                          extension

                                      );


                                  DownloadManager dm =
                                      (DownloadManager)
                                          getSystemService(
                                              DOWNLOAD_SERVICE
                                          );


                                  if(dm != null){

                                      dm.enqueue(request);


                                      Toast.makeText(

                                          MainActivity.this,

                                          "Download सुरू झाले.",

                                          Toast.LENGTH_SHORT

                                      ).show();

                                  }


                              }catch(Exception e){

                                  Toast.makeText(

                                      MainActivity.this,

                                      "Download सुरू करता आले नाही.",

                                      Toast.LENGTH_LONG

                                  ).show();

                              }

                          }

                      }
                  );


                  webView.loadUrl(
                      "file:///android_asset/index.html"
                  );

              }


              /* =================================================
                 ANDROID BRIDGE
                 ================================================= */

              public class AndroidBridge {


                  /* =============================================
                     NATIVE PRINT
                     ============================================= */

                  @JavascriptInterface

                  public void print(){

                      runOnUiThread(
                          new Runnable() {

                              @Override

                              public void run(){

                                  try{


                                      PrintManager printManager =
                                          (PrintManager)
                                              getSystemService(
                                                  Context.PRINT_SERVICE
                                              );


                                      if(
                                          printManager == null
                                      ){

                                          throw new Exception(
                                              "PrintManager unavailable"
                                          );

                                      }


                                      String jobName =
                                          "MBMS Report";


                                      android.print
                                          .PrintDocumentAdapter adapter =
                                              webView
                                                  .createPrintDocumentAdapter(
                                                      jobName
                                                  );


                                      PrintAttributes attributes =
                                          new PrintAttributes
                                              .Builder()

                                              .setMediaSize(
                                                  PrintAttributes
                                                      .MediaSize
                                                      .ISO_A4
                                              )

                                              .setMinMargins(
                                                  PrintAttributes
                                                      .Margins
                                                      .NO_MARGINS
                                              )

                                              .build();


                                      printManager.print(

                                          jobName,

                                          adapter,

                                          attributes

                                      );


                                  }catch(Exception e){

                                      Toast.makeText(

                                          MainActivity.this,

                                          "Print सुरू करता आले नाही.",

                                          Toast.LENGTH_LONG

                                      ).show();

                                  }

                              }

                          }
                      );

                  }


                  /* =============================================
                     BACKUP SAVE
                     ============================================= */

                  @JavascriptInterface

                  public void saveBackup(

                          final String json,

                          final String filename){


                      new Thread(
                          new Runnable() {

                              @Override

                              public void run(){


                                  boolean success =
                                      false;


                                  try{


                                      if(
                                          android.os.Build.VERSION.SDK_INT
                                              >= 29
                                      ){


                                          ContentValues values =
                                              new ContentValues();


                                          values.put(

                                              MediaStore.MediaColumns
                                                  .DISPLAY_NAME,

                                              filename

                                          );


                                          values.put(

                                              MediaStore.MediaColumns
                                                  .MIME_TYPE,

                                              "application/json"

                                          );


                                          values.put(

                                              MediaStore.MediaColumns
                                                  .RELATIVE_PATH,

                                              Environment
                                                  .DIRECTORY_DOWNLOADS

                                          );


                                          values.put(

                                              MediaStore.MediaColumns
                                                  .IS_PENDING,

                                              1

                                          );


                                          Uri uri =
                                              getContentResolver()
                                                  .insert(

                                                      MediaStore
                                                          .Downloads
                                                          .EXTERNAL_CONTENT_URI,

                                                      values

                                                  );


                                          if(uri == null){

                                              throw new Exception(
                                                  "MediaStore insert failed"
                                              );

                                          }


                                          OutputStream output =
                                              getContentResolver()
                                                  .openOutputStream(
                                                      uri
                                                  );


                                          if(output == null){

                                              throw new Exception(
                                                  "Output stream unavailable"
                                              );

                                          }


                                          try{


                                              output.write(

                                                  json.getBytes(
                                                      StandardCharsets.UTF_8
                                                  )

                                              );


                                              output.flush();


                                          }finally{

                                              output.close();

                                          }


                                          ContentValues completed =
                                              new ContentValues();


                                          completed.put(

                                              MediaStore.MediaColumns
                                                  .IS_PENDING,

                                              0

                                          );


                                          getContentResolver()
                                              .update(

                                                  uri,

                                                  completed,

                                                  null,

                                                  null

                                              );


                                          success =
                                              true;


                                      }else{


                                          File dir =
                                              Environment
                                                  .getExternalStoragePublicDirectory(

                                                      Environment
                                                          .DIRECTORY_DOWNLOADS

                                                  );


                                          if(
                                              !dir.exists() &&
                                              !dir.mkdirs()
                                          ){

                                              throw new Exception(
                                                  "Cannot create Downloads"
                                              );

                                          }


                                          File file =
                                              new File(
                                                  dir,
                                                  filename
                                              );


                                          FileOutputStream output =
                                              new FileOutputStream(
                                                  file
                                              );


                                          try{


                                              output.write(

                                                  json.getBytes(
                                                      StandardCharsets.UTF_8
                                                  )

                                              );


                                              output.flush();


                                          }finally{

                                              output.close();

                                          }


                                          success =
                                              true;

                                      }


                                  }catch(Exception e){

                                      e.printStackTrace();

                                  }


                                  final boolean result =
                                      success;


                                  runOnUiThread(
                                      new Runnable() {

                                          @Override

                                          public void run(){


                                              Toast.makeText(

                                                  MainActivity.this,

                                                  result

                                                      ? "Backup Downloads मध्ये Save झाला."

                                                      : "Backup Save करण्यात अडचण आली.",

                                                  Toast.LENGTH_LONG

                                              ).show();


                                          }

                                      }
                                  );

                              }

                          }
                      ).start();

                  }


                  /* =============================================
                     BACKUP RESTORE PICKER
                     ============================================= */

                  @JavascriptInterface

                  public void requestRestore(){


                      runOnUiThread(
                          new Runnable() {

                              @Override

                              public void run(){


                                  try{


                                      Intent intent =
                                          new Intent(
                                              Intent.ACTION_OPEN_DOCUMENT
                                          );


                                      intent.addCategory(
                                          Intent.CATEGORY_OPENABLE
                                      );


                                      intent.setType(
                                          "application/json"
                                      );


                                      startActivityForResult(

                                          intent,

                                          REQUEST_RESTORE

                                      );


                                  }catch(
                                      ActivityNotFoundException e
                                  ){


                                      Intent intent =
                                          new Intent(
                                              Intent.ACTION_GET_CONTENT
                                          );


                                      intent.addCategory(
                                          Intent.CATEGORY_OPENABLE
                                      );


                                      intent.setType("*/*");


                                      startActivityForResult(

                                          intent,

                                          REQUEST_RESTORE

                                      );

                                  }

                              }

                          }
                      );

                  }

              }


              /* =================================================
                 READ SELECTED BACKUP FILE
                 ================================================= */

              private String readText(
                      Uri uri) throws Exception {


                  InputStream input =
                      getContentResolver()
                          .openInputStream(uri);


                  if(input == null){

                      throw new Exception(
                          "Cannot open selected file"
                      );

                  }


                  try{


                      ByteArrayOutputStream output =
                          new ByteArrayOutputStream();


                      byte[] buffer =
                          new byte[8192];


                      int count;


                      while(
                          (count = input.read(buffer))
                              != -1
                      ){

                          output.write(
                              buffer,
                              0,
                              count
                          );

                      }


                      return output.toString(
                          StandardCharsets.UTF_8.name()
                      );


                  }finally{

                      input.close();

                  }

              }


              /* =================================================
                 UTF-8 BASE64
                 ================================================= */

              private String base64Utf8(
                      String text){


                  return
                      android.util.Base64.encodeToString(

                          text.getBytes(
                              StandardCharsets.UTF_8
                          ),

                          android.util.Base64.NO_WRAP

                      );

              }


              /* =================================================
                 ACTIVITY RESULT
                 ================================================= */

              @Override

              protected void onActivityResult(

                      int requestCode,

                      int resultCode,

                      Intent data){


                  super.onActivityResult(

                      requestCode,

                      resultCode,

                      data

                  );


                  /* =============================================
                     MBMS BACKUP RESTORE
                     ============================================= */

                  if(
                      requestCode ==
                      REQUEST_RESTORE
                  ){


                      if(

                          resultCode ==
                          RESULT_OK &&

                          data != null &&

                          data.getData() != null

                      ){


                          try{


                              String json =
                                  readText(
                                      data.getData()
                                  );


                              String base64 =
                                  base64Utf8(
                                      json
                                  );


                              String safe =
                                  base64
                                      .replace(
                                          "\\",
                                          "\\\\"
                                      )
                                      .replace(
                                          "'",
                                          "\\'"
                                      );


                              webView.evaluateJavascript(

                                  "window.mbmsNativeRestoreBase64 && " +

                                  "window.mbmsNativeRestoreBase64('" +

                                  safe +

                                  "')",

                                  null

                              );


                          }catch(Exception e){


                              Toast.makeText(

                                  this,

                                  "Backup file वाचता आली नाही.",

                                  Toast.LENGTH_LONG

                              ).show();


                          }

                      }


                      return;

                  }


                  /* =============================================
                     HTML FILE PICKER
                     ============================================= */

                  if(
                      requestCode ==
                      REQUEST_FILE
                  ){


                      if(
                          filePathCallback == null
                      ){

                          return;

                      }


                      Uri[] results =
                          null;


                      if(

                          resultCode ==
                          RESULT_OK &&

                          data != null &&

                          data.getData() != null

                      ){

                          results =
                              new Uri[]{
                                  data.getData()
                              };

                      }


                      filePathCallback
                          .onReceiveValue(
                              results
                          );


                      filePathCallback =
                          null;

                  }

              }


              /* =================================================
                 ANDROID BACK BUTTON
                 ================================================= */

              @Override

              public void onBackPressed(){


                  if(

                      webView != null &&

                      webView.canGoBack()

                  ){

                      webView.goBack();


                  }else{


                      super.onBackPressed();

                  }

              }

          }
