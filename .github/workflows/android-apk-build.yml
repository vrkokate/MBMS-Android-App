            function addAllDetail(
              options,
              label
            ){
              options.push({
                value:ALL_DETAIL,
                label
              });
            }

            function loadHomeRelDetailsV126(){

              const ctx=
                getHomeRelationshipContext();

              const d=
                homeRelData();

              const sel=
                document.getElementById(
                  'homeRelDetail'
                );

              const bs=
                document.getElementById(
                  'homeRelBillType'
                );

              if(!sel){
                return;
              }

              const {
                target,
                ctype
              }=ctx;

              if(
                !target ||
                !ctype
              ){

                sel.style.display='none';
                sel.innerHTML='';

                if(bs){
                  bs.style.display='none';
                  bs.value='';
                }

                showHomeRelationshipV126();

                return;
              }

              if(bs){
                bs.style.display='none';
                bs.value='';
              }

              const base=
                baseForContext(
                  ctx,
                  d
                );

              const opts=[];

              if(ctype==='ALL'){

                sel.style.display='none';

                sel.innerHTML=
                  '<option value="' +
                  ALL_DETAIL +
                  '">सर्व माहिती</option>';

                sel.value=
                  ALL_DETAIL;

                showHomeRelationshipV126();

                return;
              }

              if(ctype==='MB'){

                addAllDetail(
                  opts,
                  'सर्व M.B.'
                );

                opts.push(
                  {
                    value:SMALL,
                    label:'Small M.B.'
                  },
                  {
                    value:LARGE,
                    label:'Big M.B.'
                  }
                );

                uniqueSorted(
                  base.mbs.map(
                    mbNo
                  )
                ).forEach(
                  x=>{
                    opts.push({
                      value:MBNO+x,
                      label:
                        'M.B. क्रमांक '+
                        x
                    });
                  }
                );

              }else if(ctype==='WORK'){

                addAllDetail(
                  opts,
                  'सर्व कामे'
                );

                uniqueSorted(
                  base.works.map(
                    workName
                  )
                ).forEach(
                  x=>{
                    opts.push({
                      value:x,
                      label:x
                    });
                  }
                );

              }else if(ctype==='JE'){

                addAllDetail(
                  opts,
                  'सर्व JE'
                );

                uniqueSorted(
                  base.works.map(
                    x=>x?.je
                  ).concat(
                    base.bills.map(
                      x=>x?.je
                    )
                  ).concat(
                    base.assigns.map(
                      x=>x?.je
                    )
                  )
                ).forEach(
                  x=>{
                    opts.push({
                      value:x,
                      label:x
                    });
                  }
                );

              }else if(
                ctype==='CONTRACTOR'
              ){

                addAllDetail(
                  opts,
                  'सर्व Contractor / Agency'
                );

                uniqueSorted(
                  base.works.map(
                    x=>x?.contractor
                  ).concat(
                    base.bills.map(
                      x=>x?.contractor
                    )
                  ).concat(
                    base.assigns.map(
                      x=>x?.contractor
                    )
                  )
                ).forEach(
                  x=>{
                    opts.push({
                      value:x,
                      label:x
                    });
                  }
                );

              }else if(ctype==='BILL'){

                addAllDetail(
                  opts,
                  'सर्व Bill'
                );

                uniqueSorted(
                  base.bills.map(
                    x=>x?.billType
                  )
                ).forEach(
                  x=>{
                    opts.push({
                      value:x,
                      label:x
                    });
                  }
                );

              }else if(
                ctype==='TRANSFER'
              ){

                addAllDetail(
                  opts,
                  'सर्व हस्तांतरण'
                );
              }

              sel.innerHTML=
                '<option value="">तपशील निवडा</option>'+
                opts.map(
                  o=>
                    '<option value="'+
                    esc(o.value)+
                    '">'+
                    esc(o.label)+
                    '</option>'
                ).join('');

              sel.style.display=
                opts.length
                  ? 'block'
                  : 'none';

              sel.value=
                opts.length
                  ? opts[0].value
                  : '';

              showHomeRelationshipV126();
            }

            function showHomeRelationshipV126(){

              const ctx=
                getHomeRelationshipContext();

              const box=
                document.getElementById(
                  'homeRelResult'
                );

              if(!box){
                return;
              }

              if(!ctx.target){

                box.innerHTML=
                  '<div class="rel-empty">'+
                  'मुख्य नोंद निवडा.'+
                  '</div>';

                return;
              }

              if(!ctx.ctype){

                box.innerHTML=
                  '<div class="rel-empty">'+
                  'संबंधित प्रकार निवडा.'+
                  '</div>';

                return;
              }

              const data=
                linkedData(ctx);

              box.innerHTML=
                '<div class="rel-head">'+
                esc(
                  currentScopeTitle(ctx)
                )+
                '</div>'+
                renderLinkedSections(
                  ctx,
                  data
                );
            }

            const originalLoadHomeRelComponents=
              window.loadHomeRelComponents;

            function loadHomeRelComponentsV126(){

              if(
                typeof originalLoadHomeRelComponents===
                'function'
              ){

                originalLoadHomeRelComponents();
              }

              const type=
                document.getElementById(
                  'homeRelType'
                )?.value ||
                '';

              const target=
                document.getElementById(
                  'homeRelTarget'
                )?.value ||
                '';

              const sel=
                document.getElementById(
                  'homeRelComponent'
                );

              if(
                !sel ||
                !target
              ){
                return;
              }

              /*
               * Every entity that can point to
               * a transfer must expose Transfer
               * history.
               *
