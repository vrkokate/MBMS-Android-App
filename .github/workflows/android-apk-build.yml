          python3 <<'PY'
          from pathlib import Path
          import re

          t=Path(
              "mbms_work/index.html"
          ).read_text(
              encoding="utf-8"
          )

          m=re.search(
              r'<script id="V128_MBMS_SUMMARY_LINKED_FIX">(.*?)</script>',
              t,
              re.S|re.I
          )

          if not m:
              raise SystemExit(
                  "V128 patch not found inside script"
              )

          Path(
              "/tmp/v128_patch_check.js"
          ).write_text(
              m.group(1),
              encoding="utf-8"
          )

          print("PATCH SCRIPT OK")
          PY

