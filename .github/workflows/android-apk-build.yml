name: MBMS Android APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Verified MBMS Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate and Prepare HTML
        shell: bash
        run: |
          set -e
          mkdir -p mbms_work

          for z in *.zip; do
            if [ -f "$z" ]; then
              echo "Unpacking zip: $z"
              unzip -q -o "$z" -d extracted_zip || true
            fi
          done

          TARGET_HTML=$(find . -type f -iname "*.html" -not -path "./.git/*" -not -path "./mbms_work/*" -exec ls -S {} + | head -n 1)

          if [ -z "$TARGET_HTML" ]; then
            echo "ERROR: No HTML file found in repository."
            exit 1
          fi

          echo "Target HTML detected: $TARGET_HTML"
          cp "$TARGET_HTML" mbms_work/index.html
          test -s mbms_work/index.html

      - name: Inject Complete Reports and Controls Engine
        shell: bash
        run: |
          set -e
          python3 <<'PY'
          from pathlib import Path

          html_file = Path("mbms_work/index.html")
          raw_html = html_file.read_text(encoding="utf-8")

          patch_code = """
          <!-- ==================== MBMS UNIFIED REPORTING ENGINE ==================== -->
          <style id="MBMS_PERFECT_PRINT_STYLES">
          @media print {
            @page {
              size: A4 portrait;
              margin: 8mm !important;
            }
            body {
              font-family: 'Noto Sans Devanagari', 'Mukta', 'Arial', sans-serif !important;
              color: #000 !important;
              background: #fff !important;
              margin: 0 !important;
              padding: 0 !important;
              -webkit-print-color-adjust: exact !important;
              print-color-adjust: exact !important;
            }
            body > *:not(#printArea) {
              display: none !important;
            }
            #printArea {
              display: block !important;
              width: 100% !important;
              margin: 0 !important;
              padding: 0 !important;
            }
            table.print-table {
              width: 100% !important;
              border-collapse: collapse !important;
              margin-top: 6px !important;
            }
            table.print-table th, table.print-table td {
              border: 1px solid #000 !important;
              padding: 5px 6px !important;
              font-size: 11px !important;
              line-height: 1.25 !important;
              word-wrap: break-word !important;
              vertical-align: middle !important;
            }
            table.print-table th {
              background-color: #f2f2f2 !important;
              font-weight: bold !important;
            }
          }
          </style>

          <div id="printArea" style="display: none;"></div>

          <script id="MBMS_MASTER_REPORTS_CONTROLLER">
          (function() {
            // १. वरचे केशरी REPORT बटण सुरक्षितपणे लपवणे
            setInterval(function() {
              document.querySelectorAll('button, a').forEach(function(b) {
                var text = (b.textContent || '').trim().toUpperCase();
                if (text === 'REPORT') {
                  var rect = b.getBoundingClientRect();
                  var bg = window.getComputedStyle(b).backgroundColor;
                  if (rect.top < 90 || bg.indexOf('255, 165') !== -1 || bg.indexOf('orange') !== -1) {
                    b.style.display = 'none';
                  }
                }
              });
            }, 300);

            // २. हार्डवेअर बॅक बटण हँडलर
            window.handleAndroidBack = function() {
              var openModal = document.querySelector('.modal.show, [class*="modal"][style*="display: block"]');
              if (openModal) {
                var closeBtn = openModal.querySelector('[data-dismiss="modal"], .close, button.btn-close');
                if (closeBtn) closeBtn.click();
                else openModal.style.display = 'none';
                return true;
              }
              var homeTab = document.querySelector('a[href*="home"], [data-tab*="home"], #home-tab');
              if (homeTab && !homeTab.classList.contains('active')) {
                homeTab.click();
                return true;
              }
              return false;
            };

            function getRecords(key) {
              try {
                return JSON.parse(localStorage.getItem(key)) || [];
              } catch(e) {
                return [];
              }
            }

            function triggerPrint(htmlContent) {
              var pa = document.getElementById("printArea");
              if (!pa) {
                pa = document.createElement("div");
                pa.id = "printArea";
                document.body.appendChild(pa);
              }
              pa.innerHTML = htmlContent;
              pa.style.display = "block";
              setTimeout(function() {
                window.print();
                setTimeout(function() { pa.style.display = "none"; }, 500);
              }, 180);
            }

            // १. मोजमाप पुस्तिका अहवाल (M.B. Report)
            window.generateMBReport = function(selectedFilter) {
              var mbList = getRecords("mb_records");
              var filtered = mbList.filter(function(item) {
                var s = (item.size || item.mbSize || item.type || "").trim().toLowerCase();
                if (selectedFilter === "small" || selectedFilter === "लहान M.B.") {
                  return s.includes("लहान") || s.includes("small");
                } else if (selectedFilter === "large" || selectedFilter === "मोठी M.B.") {
                  return s.includes("मोठी") || s.includes("large");
                }
                return true;
              });

              var h = '<div style="text-align: center; margin-bottom: 8px;">';
              h += '  <h2 style="margin: 0; font-size: 17px; font-weight: bold;">सार्वजनिक बांधकाम विभाग</h2>';
              h += '  <h3 style="margin: 3px 0 6px 0; font-size: 14px; text-decoration: underline;">मोजमाप पुस्तिका अहवाल</h3>';
              h += '</div>';
              h += '<div style="display: flex; justify-content: space-between; font-size: 11.5px; margin-bottom: 4px;">';
              h += '  <span><b>प्रकार:</b> ' + (selectedFilter || "सर्व M.B.") + '</span>';
              h += '  <span><b>दिनांक:</b> ' + new Date().toLocaleDateString('en-GB') + '</span>';
              h += '</div>';
              h += '<table class="print-table">';
              h += '  <thead><tr>';
              h += '    <th style="width: 1%; white-space: nowrap; text-align: center;">अ.क्र.</th>';
              h += '    <th style="width: 1%; white-space: nowrap; text-align: center;">M.B. क्रमांक</th>';
              h += '    <th style="width: 1%; white-space: nowrap; text-align: center;">M.B. ची साईज</th>';
              h += '    <th style="text-align: left;">सध्या कोणाकडे आहे (JE चे नाव)</th>';
              h += '  </tr></thead><tbody>';

              if (filtered.length === 0) {
                h += '<tr><td colspan="4" style="text-align: center; padding: 10px;">कोणतीही M.B. नोंद उपलब्ध नाही.</td></tr>';
              } else {
                for (var i = 0; i < filtered.length; i++) {
                  var r = filtered[i];
                  h += '<tr>';
                  h += '  <td style="text-align: center; white-space: nowrap;">' + (i + 1) + '</td>';
                  h += '  <td style="text-align: center; white-space: nowrap;">' + (r.mbNumber || r.mbNo || "-") + '</td>';
                  h += '  <td style="text-align: center; white-space: nowrap;">' + (r.size || r.mbSize || "लहान") + '</td>';
                  h += '  <td style="text-align: left;">' + (r.assignedTo || r.jeName || r.holder || "स्टॉकमध्ये उपलब्ध") + '</td>';
                  h += '</tr>';
                }
              }
              h += '</tbody></table>';
              triggerPrint(h);
            };

            // २. कनिष्ठ अभियंता अहवाल (JE Report)
            window.generateJEReport = function(selectedJE) {
              var list = getRecords("work_records").concat(getRecords("mb_records"));
              var filtered = list.filter(function(item) {
                var je = (item.jeName || item.assignedTo || item.je || "").trim().toLowerCase();
                if (!selectedJE || selectedJE === "all" || selectedJE === "सर्व JE") return true;
                return je.includes(selectedJE.trim().toLowerCase());
              });

              var h = '<div style="text-align: center; margin-bottom: 8px;">';
              h += '  <h2 style="margin: 0; font-size: 17px; font-weight: bold;">सार्वजनिक बांधकाम विभाग</h2>';
              h += '  <h3 style="margin: 3px 0 6px 0; font-size: 14px; text-decoration: underline;">कनिष्ठ अभियंता अहवाल</h3>';
              h += '</div>';
              h += '<div style="display: flex; justify-content: space-between; font-size: 11.5px; margin-bottom: 4px;">';
              h += '  <span><b>कनिष्ठ अभियंता:</b> ' + (selectedJE || "सर्व कनिष्ठ अभियंता") + '</span>';
              h += '  <span><b>दिनांक:</b> ' + new Date().toLocaleDateString('en-GB') + '</span>';
              h += '</div>';
              h += '<table class="print-table">';
              h += '  <thead><tr>';
              h += '    <th style="width: 1%; white-space: nowrap; text-align: center;">अ.क्र.</th>';
              h += '    <th style="width: 1%; white-space: nowrap; text-align: center;">M.B. क्रमांक</th>';
              h += '    <th style="width: 1%; white-space: nowrap; text-align: center;">M.B. साईज</th>';
              h += '    <th style="text-align: left; white-space: nowrap;">कॉन्ट्रॅक्टर / एजन्सीचे नाव</th>';
              h += '    <th style="text-align: left;">कामाचे नाव</th>';
              h += '  </tr></thead><tbody>';

              if (filtered.length === 0) {
                h += '<tr><td colspan="5" style="text-align: center; padding: 10px;">नोंद उपलब्ध नाही.</td></tr>';
              } else {
                for (var i = 0; i < filtered.length; i++) {
                  var item = filtered[i];
                  h += '<tr>';
                  h += '  <td style="text-align: center; white-space: nowrap;">' + (i + 1) + '</td>';
                  h += '  <td style="text-align: center; white-space: nowrap;">' + (item.mbNumber || item.mbNo || "-") + '</td>';
                  h += '  <td style="text-align: center; white-space: nowrap;">' + (item.size || item.mbSize || "लहान") + '</td>';
                  h += '  <td style="text-align: left; white-space: nowrap;">' + (item.contractor || item.agency || "-") + '</td>';
                  h += '  <td style="text-align: left;">' + (item.workName || item.work || "-") + '</td>';
                  h += '</tr>';
                }
              }
              h += '</tbody></table>';
              triggerPrint(h);
            };

            // ३. कामाचा अहवाल (Work Report)
            window.generateWorkReport = function(selectedWork) {
              var list = getRecords("work_records");
              var filtered = list.filter(function(item) {
                var w = (item.workName || item.work || "").trim().toLowerCase();
                if (!selectedWork || selectedWork === "all" || selectedWork === "सर्व कामे") return true;
                return w.includes(selectedWork.trim().toLowerCase());
              });

              var h = '<div style="text-align: center; margin-bottom: 8px;">';
              h += '  <h2 style="margin: 0; font-size: 17px; font-weight: bold;">सार्वजनिक बांधकाम विभाग</h2>';
              h += '  <h3 style="margin: 3px 0 6px 0; font-size: 14px; text-decoration: underline;">कामाचा अहवाल</h3>';
              h += '</div>';
              h += '<div style="display: flex; justify-content: space-between; font-size: 11.5px; margin-bottom: 4px;">';
              h += '  <span><b>कामाचे नाव:</b> ' + (selectedWork || "सर्व कामे") + '</span>';
              h += '  <span><b>दिनांक:</b> ' + new Date().toLocaleDateString('en-GB') + '</span>';
              h += '</div>';
              h += '<table class="print-table">';
              h += '  <thead><tr>';
              h += '    <th style="width: 1%; white-space: nowrap; text-align: center;">अ.क्र.</th>';
              h += '    <th style="text-align: left;">कामाचे नाव</th>';
              h += '    <th style="width: 1%; white-space: nowrap; text-align: center;">M.B. क्रमांक</th>';
              h += '    <th style="width: 1%; white-space: nowrap; text-align: center;">M.B. साईज</th>';
              h += '    <th style="text-align: left; white-space: nowrap;">कनिष्ठ अभियंता (JE)</th>';
              h += '    <th style="text-align: left; white-space: nowrap;">कॉन्ट्रॅक्टर / एजन्सी</th>';
              h += '  </tr></thead><tbody>';

              if (filtered.length === 0) {
                h += '<tr><td colspan="6" style="text-align: center; padding: 10px;">नोंद उपलब्ध नाही.</td></tr>';
              } else {
                for (var i = 0; i < filtered.length; i++) {
                  var r = filtered[i];
                  h += '<tr>';
                  h += '  <td style="text-align: center; white-space: nowrap;">' + (i + 1) + '</td>';
                  h += '  <td style="text-align: left;">' + (r.workName || r.work || "-") + '</td>';
                  h += '  <td style="text-align: center; white-space: nowrap;">' + (r.mbNumber || r.mbNo || "-") + '</td>';
                  h += '  <td style="text-align: center; white-space: nowrap;">' + (r.size || r.mbSize || "लहान") + '</td>';
                  h += '  <td style="text-align: left; white-space: nowrap;">' + (r.jeName || r.assignedTo || "-") + '</td>';
                  h += '  <td style="text-align: left; white-space: nowrap;">' + (r.contractor || r.agency || "-") + '</td>';
                  h += '</tr>';
                }
              }
              h += '</tbody></table>';
              triggerPrint(h);
            };

            // ४. बिल नोंद अहवाल (Bill Report)
            window.generateBillReport = function(selectedBill) {
              var list = getRecords("bill_records").concat(getRecords("work_records"));
              var total = 0;
              var h = '<div style="text-align: center; margin-bottom: 8px;">';
              h += '  <h2 style="margin: 0; font-size: 17px; font-weight: bold;">सार्वजनिक बांधकाम विभाग</h2>';
              h += '  <h3 style="margin: 3px 0 6px 0; font-size: 14px; text-decoration: underline;">बिल नोंद अहवाल</h3>';
              h += '</div>';
              h += '<div style="display: flex; justify-content: space-between; font-size: 11.5px; margin-bottom: 4px;">';
              h += '  <span><b>तपशील:</b> ' + (selectedBill || "सर्व बिले") + '</span>';
              h += '  <span><b>दिनांक:</b> ' + new Date().toLocaleDateString('en-GB') + '</span>';
              h += '</div>';
              h += '<table class="print-table">';
              h += '  <thead><tr>';
              h += '    <th style="width: 1%; white-space: nowrap; text-align: center;">अ.क्र.</th>';
              h += '    <th style="width: 1%; white-space: nowrap; text-align: right;">बिलाची रक्कम (₹)</th>';
              h += '    <th style="text-align: left; white-space: nowrap;">कॉन्ट्रॅक्टर / एजन्सी</th>';
              h += '    <th style="text-align: left; white-space: nowrap;">कनिष्ठ अभियंता (JE)</th>';
              h += '    <th style="width: 1%; white-space: nowrap; text-align: center;">M.B. क्रमांक</th>';
              h += '    <th style="width: 1%; white-space: nowrap; text-align: center;">M.B. साईज</th>';
              h += '    <th style="text-align: left;">कामाचे नाव</th>';
              h += '  </tr></thead><tbody>';

              if (list.length === 0) {
                h += '<tr><td colspan="7" style="text-align: center; padding: 10px;">नोंद उपलब्ध नाही.</td></tr>';
              } else {
                for (var i = 0; i < list.length; i++) {
                  var r = list[i];
                  var amt = parseFloat(r.billAmount || r.amount || 0) || 0;
                  total += amt;
                  h += '<tr>';
                  h += '  <td style="text-align: center; white-space: nowrap;">' + (i + 1) + '</td>';
                  h += '  <td style="text-align: right; font-weight: bold; white-space: nowrap;">' + (amt > 0 ? amt.toLocaleString('en-IN') : "-") + '</td>';
                  h += '  <td style="text-align: left; white-space: nowrap;">' + (r.contractor || r.agency || "-") + '</td>';
                  h += '  <td style="text-align: left; white-space: nowrap;">' + (r.jeName || r.assignedTo || "-") + '</td>';
                  h += '  <td style="text-align: center; white-space: nowrap;">' + (r.mbNumber || r.mbNo || "-") + '</td>';
                  h += '  <td style="text-align: center; white-space: nowrap;">' + (r.size || r.mbSize || "लहान") + '</td>';
                  h += '  <td style="text-align: left;">' + (r.workName || r.work || "-") + '</td>';
                  h += '</tr>';
                }
                if (total > 0) {
                  h += '<tr style="font-weight: bold; background: #fafafa;">';
                  h += '  <td style="text-align: center;">एकूण</td>';
                  h += '  <td style="text-align: right;">₹ ' + total.toLocaleString('en-IN') + '</td>';
                  h += '  <td colspan="5"></td></tr>';
                }
              }
              h += '</tbody></table>';
              triggerPrint(h);
            };

            // ५. कंत्राटदार अहवाल (Contractor Report)
            window.generateContractorReport = function(selectedContractor) {
              var list = getRecords("work_records");
              var filtered = list.filter(function(item) {
                var c = (item.contractor || item.agency || "").trim().toLowerCase();
                if (!selectedContractor || selectedContractor === "all" || selectedContractor === "सर्व कंत्राटदार") return true;
                return c.includes(selectedContractor.trim().toLowerCase());
              });

              var h = '<div style="text-align: center; margin-bottom: 8px;">';
              h += '  <h2 style="margin: 0; font-size: 17px; font-weight: bold;">सार्वजनिक बांधकाम विभाग</h2>';
              h += '  <h3 style="margin: 3px 0 6px 0; font-size: 14px; text-decoration: underline;">कंत्राटदार कार्य अहवाल</h3>';
              h += '</div>';
              h += '<div style="display: flex; justify-content: space-between; font-size: 11.5px; margin-bottom: 4px;">';
              h += '  <span><b>कंत्राटदार:</b> ' + (selectedContractor || "सर्व कंत्राटदार") + '</span>';
              h += '  <span><b>दिनांक:</b> ' + new Date().toLocaleDateString('en-GB') + '</span>';
              h += '</div>';
              h += '<table class="print-table">';
              h += '  <thead><tr>';
              h += '    <th style="width: 1%; white-space: nowrap; text-align: center;">अ.क्र.</th>';
              h += '    <th style="text-align: left; white-space: nowrap;">कॉन्ट्रॅक्टर / एजन्सीचे नाव</th>';
              h += '    <th style="text-align: left;">कामाचे नाव</th>';
              h += '    <th style="text-align: left; white-space: nowrap;">संबंधित कनिष्ठ अभियंता (JE)</th>';
              h += '    <th style="width: 1%; white-space: nowrap; text-align: center;">M.B. क्रमांक</th>';
              h += '    <th style="width: 1%; white-space: nowrap; text-align: center;">M.B. साईज</th>';
              h += '  </tr></thead><tbody>';

              if (filtered.length === 0) {
                h += '<tr><td colspan="6" style="text-align: center; padding: 10px;">नोंद उपलब्ध नाही.</td></tr>';
              } else {
                for (var i = 0; i < filtered.length; i++) {
                  var r = filtered[i];
                  h += '<tr>';
                  h += '  <td style="text-align: center; white-space: nowrap;">' + (i + 1) + '</td>';
                  h += '  <td style="text-align: left; white-space: nowrap;">' + (r.contractor || r.agency || "-") + '</td>';
                  h += '  <td style="text-align: left;">' + (r.workName || r.work || "-") + '</td>';
                  h += '  <td style="text-align: left; white-space: nowrap;">' + (r.jeName || r.assignedTo || "-") + '</td>';
                  h += '  <td style="text-align: center; white-space: nowrap;">' + (r.mbNumber || r.mbNo || "-") + '</td>';
                  h += '  <td style="text-align: center; white-space: nowrap;">' + (r.size || r.mbSize || "लहान") + '</td>';
                  h += '</tr>';
                }
              }
              h += '</tbody></table>';
              triggerPrint(h);
            };

            // ६. युनिव्हर्सल स्मार्ट सर्च (Universal Smart Search)
            window.handleUniversalSearch = function(query) {
              var q = (query || "").trim().toLowerCase();
              if (!q) {
                alert("कृपया M.B. क्रमांक किंवा नाव टाका.");
                return;
              }
              var works = getRecords("work_records");
              var isJE = works.some(function(item) {
                return (item.jeName || item.assignedTo || "").toLowerCase().includes(q);
              });
              if (isJE) {
                generateJEReport(query);
                return;
              }
              var mbs = getRecords("mb_records");
              var matched = works.filter(function(item) {
                return (item.mbNumber || item.mbNo || "").toLowerCase().includes(q);
              });

              var h = '<div style="text-align: center; margin-bottom: 8px;">';
              h += '  <h2 style="margin: 0; font-size: 17px; font-weight: bold;">सार्वजनिक बांधकाम विभाग</h2>';
              h += '  <h3 style="margin: 3px 0 6px 0; font-size: 14px; text-decoration: underline;">मोजमाप पुस्तिका सविस्तर नोंद अहवाल</h3>';
              h += '</div>';
              h += '<div style="display: flex; justify-content: space-between; font-size: 11.5px; margin-bottom: 4px;">';
              h += '  <span><b>शोध घटक:</b> ' + query + '</span>';
              h += '  <span><b>दिनांक:</b> ' + new Date().toLocaleDateString('en-GB') + '</span>';
              h += '</div>';
              h += '<table class="print-table">';
              h += '  <thead><tr>';
              h += '    <th style="width: 1%; white-space: nowrap; text-align: center;">अ.क्र.</th>';
              h += '    <th style="width: 1%; white-space: nowrap; text-align: center;">M.B. क्रमांक</th>';
              h += '    <th style="width: 1%; white-space: nowrap; text-align: center;">M.B. साईज</th>';
              h += '    <th style="text-align: left; white-space: nowrap;">सध्या कोणाकडे आहे (JE)</th>';
              h += '    <th style="text-align: left;">चालू असलेले कामाचे नाव</th>';
              h += '    <th style="text-align: left; white-space: nowrap;">कॉन्ट्रॅक्टर / एजन्सी</th>';
              h += '  </tr></thead><tbody>';

              if (matched.length > 0) {
                for (var i = 0; i < matched.length; i++) {
                  var r = matched[i];
                  h += '<tr>';
                  h += '  <td style="text-align: center; white-space: nowrap;">' + (i + 1) + '</td>';
                  h += '  <td style="text-align: center; white-space: nowrap;">' + (r.mbNumber || r.mbNo || query) + '</td>';
                  h += '  <td style="text-align: center; white-space: nowrap;">' + (r.size || r.mbSize || "लहान") + '</td>';
                  h += '  <td style="text-align: left; white-space: nowrap;">' + (r.jeName || r.assignedTo || "-") + '</td>';
                  h += '  <td style="text-align: left;">' + (r.workName || r.work || "-") + '</td>';
                  h += '  <td style="text-align: left; white-space: nowrap;">' + (r.contractor || r.agency || "-") + '</td>';
                  h += '</tr>';
                }
              } else {
                var singleMB = mbs.find(function(m){ return (m.mbNumber || m.mbNo || "").toLowerCase().includes(q); });
                if (singleMB) {
                  h += '<tr>';
                  h += '  <td style="text-align: center;">1</td>';
                  h += '  <td style="text-align: center;">' + (singleMB.mbNumber || singleMB.mbNo || query) + '</td>';
                  h += '  <td style="text-align: center;">' + (singleMB.size || singleMB.mbSize || "लहान") + '</td>';
                  h += '  <td style="text-align: left;">' + (singleMB.assignedTo || singleMB.jeName || "स्टॉकमध्ये उपलब्ध") + '</td>';
                  h += '  <td style="text-align: left;">सध्या कोणतेही काम जोडलेले नाही</td>';
                  h += '  <td style="text-align: left;">-</td>';
                  h += '</tr>';
                } else {
                  h += '<tr><td colspan="6" style="text-align: center; padding: 10px;">नोंद उपलब्ध नाही.</td></tr>';
                }
              }
              h += '</tbody></table>';
              triggerPrint(h);
            };

            // ७. ऑटोमॅटिक इव्हेंट लिसनर (REPORT / PRINT बटण क्लिक झाल्यावर)
            document.addEventListener("click", function(e) {
              var btn = e.target.closest("button, a");
              if (!btn) return;
              var t = (btn.textContent || btn.value || "").trim().toUpperCase();

              if (t.includes("REPORT") || t.includes("PRINT")) {
                var searchInput = document.querySelector('input[placeholder*="शोधा"], input[placeholder*="क्रमांक"]');
                if (searchInput && searchInput.value.trim().length > 0) {
                  e.preventDefault();
                  e.stopPropagation();
                  handleUniversalSearch(searchInput.value.trim());
                  return;
                }

                var selects = Array.from(document.querySelectorAll("select"));
                var mainSelect = selects.find(function(s) {
                  var v = (s.options[s.selectedIndex]?.text || s.value || "").toUpperCase();
                  return v.includes("M.B") || v.includes("JE") || v.includes("JUNIOR") || v.includes("काम") || v.includes("BILL") || v.includes("CONTRACTOR");
                });

                if (mainSelect) {
                  var selectedVal = (mainSelect.options[mainSelect.selectedIndex]?.text || mainSelect.value || "").toUpperCase();
                  e.preventDefault();
                  e.stopPropagation();

                  if (selectedVal.includes("M.B")) {
                    var sub = selects.find(function(s) {
                      var text = (s.options[s.selectedIndex]?.text || "").toUpperCase();
                      return text.includes("लहान") || text.includes("मोठी") || text.includes("सर्व M.B");
                    });
                    var type = sub ? (sub.options[sub.selectedIndex]?.text || "सर्व M.B.") : "सर्व M.B.";
                    generateMBReport(type);
                  } else if (selectedVal.includes("JE") || selectedVal.includes("JUNIOR")) {
                    generateJEReport("सर्व JE");
                  } else if (selectedVal.includes("काम") || selectedVal.includes("WORK")) {
                    generateWorkReport("सर्व कामे");
                  } else if (selectedVal.includes("BILL") || selectedVal.includes("बिल")) {
                    generateBillReport("सर्व बिले");
                  } else if (selectedVal.includes("CONTRACTOR") || selectedVal.includes("कंत्राटदार")) {
                    generateContractorReport("सर्व कंत्राटदार");
                  }
                }
              }
            }, true);
          })();
          </script>
          """

          if "</body>" in raw_html.lower():
              idx = raw_html.lower().rfind("</body>")
              raw_html = raw_html[:idx] + patch_code + raw_html[idx:]
          else:
              raw_html += patch_code

          html_file.write_text(raw_html, encoding="utf-8")
          print("SUCCESS: Unified Reporting & Print System Injected Successfully.")
          PY

      - name: Create Android project structure
        shell: bash
        run: |
          set -e
          rm -rf mbms_android release
          mkdir -p \
            mbms_android/app/src/main/assets \
            mbms_android/app/src/main/java/com/mbms/app \
            mbms_android/app/src/main/res/values \
            release

          cp mbms_work/index.html mbms_android/app/src/main/assets/index.html

          cat > mbms_android/settings.gradle <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal(); }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral(); }
          }
          rootProject.name = "MBMSAndroid"
          include(":app")
          EOF

          cat > mbms_android/build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.6.1' apply false }
          EOF

          cat > mbms_android/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat > mbms_android/app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.mbms.app'
              compileSdk 35
              defaultConfig {
                  applicationId 'com.mbms.app'
                  minSdk 26
                  targetSdk 35
                  versionCode 140
                  versionName 'V140'
              }
              buildTypes {
                  debug { minifyEnabled false; shrinkResources false }
                  release { minifyEnabled false; shrinkResources false }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat > mbms_android/app/src/main/res/values/strings.xml <<'EOF'
          <resources><string name="app_name">MBMS</string></resources>
          EOF

          cat > mbms_android/app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#1976D2</item>
                  <item name="android:navigationBarColor">#06458E</item>
              </style>
          </resources>
          EOF

          cat > mbms_android/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />

              <application
                  android:allowBackup="true"
                  android:usesCleartextTraffic="true"
                  android:label="@string/app_name"
                  android:theme="@style/AppTheme"
                  android:hardwareAccelerated="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

      - name: Generate MainActivity.java
        shell: bash
        run: |
          set -e
          cat > mbms_android/app/src/main/java/com/mbms/app/MainActivity.java <<'EOF'
          package com.mbms.app;

          import android.app.Activity;
          import android.content.Context;
          import android.os.Bundle;
          import android.print.PrintAttributes;
          import android.print.PrintDocumentAdapter;
          import android.print.PrintManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Toast;

          public class MainActivity extends Activity {

              private WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);
                  settings.setLoadWithOverviewMode(true);
                  settings.setUseWideViewPort(true);
                  settings.setTextZoom(100);

                  webView.setWebChromeClient(new WebChromeClient());

                  AndroidBridge bridge = new AndroidBridge();
                  webView.addJavascriptInterface(bridge, "MBMSAndroid");
                  webView.addJavascriptInterface(bridge, "AndroidBridge");

                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public void onPageFinished(WebView view, String url) {
                          super.onPageFinished(view, url);
                          webView.evaluateJavascript(
                              "window.print=function(){ if(window.MBMSAndroid) window.MBMSAndroid.print(); };",
                              null
                          );
                      }
                  });

                  webView.loadUrl("file:///android_asset/index.html");
              }

              public class AndroidBridge {
                  @JavascriptInterface
                  public void print() {
                      runOnUiThread(new Runnable() {
                          @Override
                          public void run() {
                              try {
                                  PrintManager manager = (PrintManager) getSystemService(Context.PRINT_SERVICE);
                                  if (manager != null && webView != null) {
                                      webView.postDelayed(new Runnable() {
                                          @Override
                                          public void run() {
                                              try {
                                                  PrintDocumentAdapter adapter = webView.createPrintDocumentAdapter("MBMS Report");
                                                  PrintAttributes attributes = new PrintAttributes.Builder()
                                                          .setMediaSize(PrintAttributes.MediaSize.ISO_A4)
                                                          .setMinMargins(PrintAttributes.Margins.NO_MARGINS)
                                                          .build();
                                                  manager.print("MBMS Report", adapter, attributes);
                                              } catch (Exception e) {
                                                  Toast.makeText(MainActivity.this, "Print अयशस्वी!", Toast.LENGTH_SHORT).show();
                                              }
                                          }
                                      }, 350);
                                  }
                              } catch (Exception e) {
                                  Toast.makeText(MainActivity.this, "Print सुरू करता आले नाही.", Toast.LENGTH_SHORT).show();
                              }
                          }
                      });
                  }
              }

              @Override
              public void onBackPressed() {
                  if (webView != null) {
                      webView.evaluateJavascript(
                          "(function(){ return (window.handleAndroidBack && window.handleAndroidBack()); })();",
                          value -> {
                              if (!"true".equals(value)) {
                                  if (webView.canGoBack()) {
                                      webView.goBack();
                                  } else {
                                      super.onBackPressed();
                                  }
                              }
                          }
                      );
                  } else {
                      super.onBackPressed();
                  }
              }

              @Override
              protected void onDestroy() {
                  if (webView != null) {
                      webView.stopLoading();
                      webView.destroy();
                      webView = null;
                  }
                  super.onDestroy();
              }
          }
          EOF

      - name: Setup Gradle 8.7
