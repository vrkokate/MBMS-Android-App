              // ==========================================================
              // Backup bridge
              // ==========================================================

              public class AndroidBackupBridge {

                  @JavascriptInterface
                  public void saveBackup(
                          String json,
                          String fileName) {

                      runOnUiThread(
                              () ->
                                      saveBackupToDownloads(
                                              json,
                                              fileName
                                      )
                      );
                  }
              }


              // ==========================================================
              // Backup save
              // ==========================================================

              private void saveBackupToDownloads(
                      String json,
                      String fileName) {

                  if(json==null){
                      json="";
                  }

                  if(
                      fileName==null ||
                      fileName.trim().isEmpty()
                  ){
                      fileName="MBMS_Backup.json";
                  }


                  final String finalJson=json;

                  final String finalName=fileName;


                  if(
                      Build.VERSION.SDK_INT >=
                      Build.VERSION_CODES.Q
                  ){

                      try{

                          ContentValues values =
                                  new ContentValues();

                          values.put(
                                  MediaStore.Downloads.DISPLAY_NAME,
                                  finalName
                          );

                          values.put(
                                  MediaStore.Downloads.MIME_TYPE,
                                  "application/json"
                          );

                          values.put(
                                  MediaStore.Downloads.RELATIVE_PATH,
                                  Environment.DIRECTORY_DOWNLOADS
                          );

                          values.put(
                                  MediaStore.Downloads.IS_PENDING,
                                  1
                          );


                          Uri uri =
                                  getContentResolver()
                                          .insert(
                                              MediaStore.Downloads
                                              .EXTERNAL_CONTENT_URI,
                                              values
                                          );


                          if(uri==null){
                              throw new Exception();
                          }


                          OutputStream out =
                                  getContentResolver()
                                      .openOutputStream(uri);


                          if(out==null){
                              throw new Exception();
                          }


                          try{

                              out.write(
                                  finalJson.getBytes(
                                      StandardCharsets.UTF_8
                                  )
                              );

                              out.flush();

                          }finally{

                              out.close();
                          }


                          ContentValues done =
                                  new ContentValues();

                          done.put(
                                  MediaStore.Downloads.IS_PENDING,
                                  0
                          );


                          getContentResolver().update(
                                  uri,
                                  done,
                                  null,
                                  null
                          );


                          showToast(
                              "Backup Save झाले. Downloads मध्ये पहा."
                          );


                      }catch(Exception e){

                          showToast(
                              "Backup Save करताना त्रुटी आली."
                          );
                      }


                      return;
                  }


                  if(
                      checkSelfPermission(
                          Manifest.permission.WRITE_EXTERNAL_STORAGE
                      ) !=
                      PackageManager.PERMISSION_GRANTED
                  ){

                      pendingBackupJson=finalJson;

                      pendingBackupName=finalName;

                      requestPermissions(
                          new String[]{
                              Manifest.permission
                                      .WRITE_EXTERNAL_STORAGE
                          },
                          REQUEST_WRITE_STORAGE
                      );

                      return;
                  }


                  saveLegacyBackup(
                      finalJson,
                      finalName
                  );
              }


              // ==========================================================
              // Legacy backup
              // ==========================================================

              private void saveLegacyBackup(
                      String json,
                      String fileName) {

                  try{

                      File downloads=
                          Environment
                              .getExternalStoragePublicDirectory(
                                  Environment.DIRECTORY_DOWNLOADS
                              );

                      if(!downloads.exists()){
                          downloads.mkdirs();
                      }


                      File file=
                          new File(
                              downloads,
                              fileName
                          );


                      FileOutputStream out=
                          new FileOutputStream(file);


                      try{

                          out.write(
                              json.getBytes(
                                  StandardCharsets.UTF_8
                              )
                          );

                          out.flush();

                      }finally{

                          out.close();
                      }


                      showToast(
                          "Backup Save झाले. Downloads मध्ये पहा."
                      );


                  }catch(Exception e){

                      showToast(
                          "Backup Save करताना त्रुटी आली."
                      );
                  }
              }


              // ==========================================================
              // Permission
              // ==========================================================

              @Override
              public void onRequestPermissionsResult(
                      int requestCode,
                      String[] permissions,
                      int[] grantResults) {

                  super.onRequestPermissionsResult(
                          requestCode,
                          permissions,
                          grantResults
                  );


                  if(
                      requestCode==
                      REQUEST_WRITE_STORAGE
                  ){

                      if(
                          grantResults.length>0 &&
                          grantResults[0]==
                          PackageManager.PERMISSION_GRANTED
                      ){

                          if(
                              pendingBackupJson!=null
                          ){

                              saveLegacyBackup(
                                  pendingBackupJson,
                                  pendingBackupName
                              );
                          }

                      }else{

                          showToast(
                              "Storage permission आवश्यक आहे."
                          );
                      }


                      pendingBackupJson=null;

                      pendingBackupName=null;
                  }
              }


              // ==========================================================
              // File picker
              // ==========================================================

              @Override
              protected void onActivityResult(
                      int requestCode,
                      int resultCode,
                      Intent data) {

                  super.onActivityResult(
                          requestCode,
                          resultCode,
                          data
                  );


                  if(
                      requestCode==
                      REQUEST_FILE_CHOOSER
                  ){

                      if(filePathCallback==null){
                          return;
                      }


                      Uri[] results=null;


                      if(
                          resultCode==RESULT_OK &&
                          data!=null
                      ){

                          Uri uri=data.getData();

                          if(uri!=null){

                              results=
                                  new Uri[]{uri};
                          }
                      }


                      filePathCallback
                          .onReceiveValue(results);

                      filePathCallback=null;
                  }
              }


              // ==========================================================
              // Toast
              // ==========================================================

              private void showToast(
                      String text) {

                  runOnUiThread(
                      () ->
                          Toast.makeText(
                              MainActivity.this,
                              text,
                              Toast.LENGTH_LONG
                          ).show()
                  );
              }


              // ==========================================================
              // Print
              // ==========================================================

              public void startPrintJob() {

                  if(webView==null){
                      return;
                  }


                  PrintManager manager=
                      (PrintManager)
                          getSystemService(
                              Context.PRINT_SERVICE
                          );


                  if(manager==null){

                      showToast(
                          "Print Service उपलब्ध नाही."
                      );

                      return;
                  }


                  PrintDocumentAdapter adapter=
                      webView.createPrintDocumentAdapter(
                          "MBMS Report"
                      );


                  PrintAttributes attributes=
                      new PrintAttributes.Builder()

                          .setMediaSize(
                              PrintAttributes.MediaSize.ISO_A4
                          )

                          .setMinMargins(
                              PrintAttributes.Margins.NO_MARGINS
                          )

                          .setResolution(
                              new PrintAttributes.Resolution(
                                  "MBMS_PRINT",
                                  "MBMS Print",
                                  300,
                                  300
                              )
                          )

                          .build();


                  manager.print(
                      "MBMS Report",
                      adapter,
                      attributes
                  );
              }


              // ==========================================================
              // Print bridge
              // ==========================================================

              public class AndroidPrintBridge {

                  @JavascriptInterface
                  public void printPage() {

                      runOnUiThread(
                          () ->
                              startPrintJob()
                      );
                  }
              }


              // ==========================================================
              // Extra native restore interface
              // ==========================================================

              public class MBMSAndroidBridge {

                  @JavascriptInterface
                  public void requestRestore() {

                      runOnUiThread(
                          () -> {

                              Intent intent =
                                  new Intent(
                                      Intent.ACTION_OPEN_DOCUMENT
                                  );

                              intent.addCategory(
                                  Intent.CATEGORY_OPENABLE
                              );

                              intent.setType(
                                  "application/json"
                              );

                              intent.putExtra(
                                  Intent.EXTRA_ALLOW_MULTIPLE,
                                  false
                              );

                              startActivityForResult(
                                  intent,
                                  REQUEST_FILE_CHOOSER
                              );
                          }
                      );
                  }
              }


              // ==========================================================
              // Install additional bridge
              // ==========================================================

              private void installRestoreBridge() {

                  if(webView==null){
                      return;
                  }

                  webView.addJavascriptInterface(
                      new MBMSAndroidBridge(),
                      "MBMSAndroid"
                  );
              }


              // ==========================================================
              // Page re-hook
              // ==========================================================

              private void ensureRestoreBridge() {

                  installRestoreBridge();
              }


              // ==========================================================
              // Back
              // ==========================================================

              @Override
              public void onBackPressed() {

                  if(
                      webView!=null &&
                      webView.canGoBack()
                  ){

                      webView.goBack();

                  }else{

                      super.onBackPressed();
                  }
              }


              // ==========================================================
              // Destroy
              // ==========================================================

              @Override
              protected void onDestroy() {

                  if(webView!=null){

                      webView.stopLoading();

                      webView.removeJavascriptInterface(
                          "AndroidPrint"
                      );

                      webView.removeJavascriptInterface(
                          "AndroidBackup"
                      );

                      webView.removeJavascriptInterface(
                          "MBMSAndroid"
                      );

                      webView.destroy();

                      webView=null;
                  }


                  super.onDestroy();
              }
          }
