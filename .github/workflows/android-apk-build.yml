            function bind(){

              const type=
                document.getElementById(
                  "homeRelType"
                );

              const target=
                document.getElementById(
                  "homeRelTarget"
                );

              const comp=
                document.getElementById(
                  "homeRelComponent"
                );

              const detail=
                document.getElementById(
                  "homeRelDetail"
                );

              const from=
                document.getElementById(
                  "homeRelFrom"
                );

              const to=
                document.getElementById(
                  "homeRelTo"
                );

              const btn=
                document.querySelector(
                  'button[onclick="printHomeRelationshipReport()"]'
                );

              if(
                !type ||
                !target ||
                !comp ||
                !detail
              ){
                return false;
              }

              renderType();

              type.onchange=
                function(){

                  renderTargets();

                  renderComponents();

                  renderResult();
                };

              target.onchange=
                function(){

                  renderComponents();

                  renderResult();
                };

              comp.onchange=
                function(){

                  renderDetails();
                };

              detail.onchange=
                function(){

                  renderResult();
                };

              if(from){

                from.onchange=
                  function(){

                    renderTargets();

                    renderComponents();

                    renderResult();
                  };
              }

              if(to){

                to.onchange=
                  function(){

                    renderTargets();

                    renderComponents();

                    renderResult();
                  };
              }

              if(btn){

                btn.onclick=
                  printReport;
              }

              target.disabled=true;
              comp.disabled=true;
              detail.style.display=
                "none";

              if(
                typeof homeRelRangeValid!=="function" ||
                homeRelRangeValid()
              ){
                renderResult();
              }

              return true;
            }

            window.loadHomeRelDetails=
              function(){
                renderDetails();
              };

            window.showHomeRelationship=
              function(){
                renderResult();
              };

            window.printHomeRelationshipReport=
              printReport;

            window.loadHomeRelTargets=
              function(){
                renderTargets();
                renderComponents();
                renderResult();
              };

            window.loadHomeRelComponents=
              function(){
                renderComponents();
                renderDetails();
              };

            if(
              document.readyState===
              "loading"
            ){

              document.addEventListener(
                "DOMContentLoaded",
                bind
              );

            }else{

              bind();
            }

          })();
