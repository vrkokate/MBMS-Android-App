            function renderDetails(){

              const c=ctx();

              const sel=
                document.getElementById(
                  "homeRelDetail"
                );

              if(!sel)return;

              if(
                !c.ctype ||
                c.ctype==="ALL"
              ){

                sel.style.display=
                  "none";

                sel.innerHTML=
                  '<option value="'+
                  DETAIL_ALL+
                  '">सर्व माहिती</option>';

                sel.value=
                  DETAIL_ALL;

                renderResult();

                return;
              }

              const d=
                dateFilter(
                  data()
                );

              const opts=
                relatedOptions(
                  c,
                  d
                );

              sel.innerHTML=
                '<option value="">तपशील निवडा</option>'+
                opts.map(
                  function(x){
                    return (
                      '<option value="'+
                      E(x[0])+
                      '">'+
                      E(x[1])+
                      '</option>'
                    );
                  }
                ).join("");

              sel.style.display=
                opts.length
                ? "block"
                : "none";

              sel.disabled=false;
              sel.value="";

              renderResult();
            }

            function section(
              title,
              rows
            ){

              return (
                '<div class="rel-section">'+
                  '<div class="rel-section-title">'+
                    E(title)+
                  '</div>'+
                  rows.map(
                    function(r){
                      return (
                        '<div class="rel-line">'+
                          '<b>'+
                          E(r[0])+
                          ':</b> '+
                          E(
                            r[1]===undefined ||
                            r[1]===""
                              ? "-"
                              : r[1]
                          )+
                        '</div>'
                      );
                    }
                  ).join("")+
                '</div>'
              );
            }

            function listSection(
              title,
              items,
              fn
            ){

              if(!items.length){

                return section(
                  title,
                  [
                    [
                      "नोंद",
                      "उपलब्ध नाही"
                    ]
                  ]
                );
              }

              return (
                '<div class="rel-section">'+
                  '<div class="rel-section-title">'+
                    E(title)+
                    " ("+
                    items.length+
                    ")"+
                  '</div>'+
                  items.map(
                    function(x,i){
                      return (
                        '<div style="border-top:1px solid #e8eef2;padding:7px 0">'+
                        fn(x,i)+
                        '</div>'
                      );
                    }
                  ).join("")+
                '</div>'
              );
            }

