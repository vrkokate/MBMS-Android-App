            function loadHomeRelDetailsV124(){

              const ctx=
                getHomeRelationshipContext();

              const d=
                homeRelData();

              const sel=
                document.getElementById(
                  'homeRelDetail'
                );

              const billType=
                document.getElementById(
                  'homeRelBillType'
                );

              if(!sel){
                return;
              }

              if(billType){
                billType.style.display='none';
                billType.value='';
              }

              if(
                !ctx.target ||
                !ctx.ctype
              ){

                sel.style.display='none';
                sel.innerHTML='';

                showHomeRelationshipV124();

                return;
              }

              const base=
                baseForContext(
                  ctx,
                  d
                );

              const opts=[];

              if(ctx.ctype==='ALL'){

                opts.push({
                  value:ALL_DETAIL,
                  label:'सर्व माहिती'
                });

              }else if(ctx.ctype==='MB'){

                opts.push(
                  {
                    value:ALL_DETAIL,
                    label:'सर्व M.B.'
                  },
                  {
                    value:SMALL,
                    label:'Small M.B.'
                  },
                  {
                    value:LARGE,
                    label:'Big M.B.'
                  }
                );

                uniqueSorted(
                  base.mbs.map(
                    mbNo
                  )
                ).forEach(
                  x=>{
                    opts.push({
                      value:
                        MBNO+x,
                      label:
                        'M.B. क्रमांक '+
                        x
                    });
                  }
                );

              }else if(ctx.ctype==='WORK'){

                opts.push({
                  value:ALL_DETAIL,
                  label:'सर्व कामे'
                });

                uniqueSorted(
                  base.works.map(
                    workName
                  )
                ).forEach(
                  x=>{
                    opts.push({
                      value:x,
                      label:x
                    });
                  }
                );

              }else if(ctx.ctype==='JE'){

                opts.push({
                  value:ALL_DETAIL,
                  label:'सर्व JE'
                });

                uniqueSorted(
                  base.works.map(
                    x=>x?.je
                  ).concat(
                    base.bills.map(
                      x=>x?.je
                    ),
                    base.assigns.map(
                      x=>x?.je
                    )
                  )
                ).forEach(
                  x=>{
                    opts.push({
                      value:x,
                      label:x
                    });
                  }
                );

              }else if(
                ctx.ctype==='CONTRACTOR'
              ){

                opts.push({
                  value:ALL_DETAIL,
                  label:
                    'सर्व Contractor / Agency'
                });

                uniqueSorted(
                  base.works.map(
                    x=>x?.contractor
                  ).concat(
                    base.bills.map(
                      x=>x?.contractor
                    ),
                    base.assigns.map(
                      x=>x?.contractor
                    )
                  )
                ).forEach(
                  x=>{
                    opts.push({
                      value:x,
                      label:x
                    });
                  }
                );

              }else if(ctx.ctype==='BILL'){

                opts.push({
                  value:ALL_DETAIL,
                  label:'सर्व Bill'
                });

                uniqueSorted(
                  base.bills.map(
                    x=>x?.billType
                  )
                ).forEach(
                  x=>{
                    opts.push({
                      value:x,
                      label:x
                    });
                  }
                );

              }else if(
                ctx.ctype==='TRANSFER'
              ){

                opts.push({
                  value:ALL_DETAIL,
                  label:'सर्व हस्तांतरण'
                });
              }

              sel.innerHTML=
                '<option value="">तपशील निवडा</option>'+
                opts.map(
                  o=>
                    '<option value="'+
                    esc(o.value)+
                    '">'+
                    esc(o.label)+
                    '</option>'
                ).join('');

              sel.style.display=
                opts.length
                  ? 'block'
                  : 'none';

              if(opts.length){
                sel.value=
                  opts[0].value;
              }

              showHomeRelationshipV124();
            }

            function showHomeRelationshipV124(){

              const ctx=
                getHomeRelationshipContext();

              const box=
                document.getElementById(
                  'homeRelResult'
                );

              if(!box){
                return;
              }

              if(!ctx.target){

                box.innerHTML=
                  '<div class="rel-empty">'
                  +'मुख्य नोंद निवडा.'
                  +'</div>';

                return;
              }

              if(!ctx.ctype){

                box.innerHTML=
                  '<div class="rel-empty">'
                  +'संबंधित प्रकार निवडा.'
                  +'</div>';

                return;
              }

              const data=
                linkedData(ctx);

              box.innerHTML=
                renderLinkedSections(
                  ctx,
                  data
                );
            }

