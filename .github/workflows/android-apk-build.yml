name: MBMS V136 FINAL - VERIFIED HARDENED BUILD
​on:
workflow_dispatch:
push:
branches:
- main
​permissions:
contents: read
​jobs:
​build:
name: Build Verified MBMS Android APK
runs-on: ubuntu-24.04
​steps:
​- name: Checkout repository
uses: actions/checkout@v4
​- name: Setup Java 17
uses: actions/setup-java@v4
with:
distribution: temurin
java-version: '17'
​- name: Setup Android SDK
uses: android-actions/setup-android@v4
​- name: Install Android SDK Packages
shell: bash
run: |
set -e
yes | sdkmanager --licenses >/dev/null 2>&1 || true
sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
​- name: Setup Gradle 8.7
uses: gradle/actions/setup-gradle@v4
with:
gradle-version: '8.7'
​- name: Locate and Prepare HTML
shell: bash
run: |
set -e
mkdir -p mbms_work
​# जर रिपोमध्ये ZIP असेल तर ती सर्वात आधी अनझिप करणे
for z in *.zip; do
if [ -f "$z" ]; then
echo "Unpacking repository zip: $z"
unzip -q -o "$z" -d extracted_zip || true
fi
done
​TARGET_HTML=""
TARGET_HTML=$(find . -type f -iname ".html" -not -path "./.git/" -exec ls -S {} + | head -n 1)
​if [ -z "$TARGET_HTML" ]; then
echo "ERROR: No HTML file found in repository."
exit 1
fi
​echo "Target HTML detected: $TARGET_HTML"
cp "$TARGET_HTML" mbms_work/index.html
test -s mbms_work/index.html
​- name: Apply Deep Root Fixes in HTML
shell: bash
run: |
set -e
python3 <<'PY'
from pathlib import Path
import re
​html_file = Path("mbms_work/index.html")
raw_html = html_file.read_text(encoding="utf-8")
​# १. JE टॅबमधील वरचे केशरी REPORT बटण नष्ट करणे
raw_html = re.sub(r'<button[^>]class="[^"](?:report-btn|header-btn|btn-warning|orange)[^"]"[^>]>\sREPORT\s</button>', '', raw_html, flags=re.I)
raw_html = re.sub(r'<div[^>]class="[^"](?:header|top-bar)[^"]"[^>]>[\s\S]?(<button[^>]>\sREPORT\s</button>)[\s\S]*?</div>', lambda m: m.group(0).replace(m.group(1), ''), raw_html, flags=re.I)
​# २. मास्टर स्टाईल आणि स्क्रिप्ट इंजेक्शन
master_styles = """
