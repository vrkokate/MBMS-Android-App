name: MBMS V126 FINAL - M.B. Summary Linked Final - Stable

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:

  build:
    name: Build Final MBMS APK
    runs-on: ubuntu-24.04

    steps:

      - name: Checkout repository
        uses: actions/checkout@v7


      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'


      - name: Setup Android SDK
        uses: android-actions/setup-android@v4


      - name: Install Android SDK 35
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"


      - name: Install Gradle 8.7
        shell: bash
        run: |
          set -e

          wget -q \
            https://services.gradle.org/distributions/gradle-8.7-bin.zip

          mkdir -p "$HOME/gradle"

          unzip -q \
            gradle-8.7-bin.zip \
            -d "$HOME/gradle"

          echo "$HOME/gradle/gradle-8.7/bin" >> "$GITHUB_PATH"

          "$HOME/gradle/gradle-8.7/bin/gradle" --version


      - name: Verify Java and Gradle
        shell: bash
        run: |
          set -e

          java -version
          gradle --version


      - name: Find MBMS HTML
        shell: bash
        run: |
          set -e

          HTML_FILE=""

          for f in \
            "Measurement_Book_Management_System_FINAL_V120_TRANSFER_REPORT_FINAL.html" \
            "Measurement_Book_Management_System_FINAL_V118_PRINT_BACKUP_ANDROID.html" \
            "Measurement_Book_Management_System_FINAL_V115_MB_HISTORY_ONLY_DATE-6.html" \
            "Measurement_Book_Management_System_FINAL_V115_MB_HISTORY_ONLY_DATE.html" \
            "Measurement_Book_Management_System_FINAL_V115.html" \
            "V115.html" \
            "index.html"
          do
            if [ -f "$f" ]; then
              HTML_FILE="$f"
              break
            fi
          done

          if [ -z "$HTML_FILE" ]; then
            HTML_FILE=$(find . \
              -maxdepth 3 \
              -type f \
              -iname "*.html" \
              -not -path "./.git/*" \
              | head -n 1 || true)
          fi

          if [ -z "$HTML_FILE" ]; then
            echo "ERROR: MBMS HTML file not found."
            exit 1
          fi

          echo "HTML_FILE=$HTML_FILE" >> "$GITHUB_ENV"

          echo "Using HTML:"
          echo "$HTML_FILE"


      - name: Prepare Final MBMS HTML
        shell: bash
        run: |
          set -e

          mkdir -p mbms_work

          cp \
            "$HTML_FILE" \
            mbms_work/index.html

          test -s mbms_work/index.html

          echo "HTML size:"
          wc -c mbms_work/index.html


      - name: Apply ONLY Received JE List Correction
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path

          p = Path("mbms_work/index.html")

          text = p.read_text(encoding="utf-8")

          old1 = (
              "if(isJE){loadTransferJEs();"
              "if(je){je.value=sourceName;je.disabled=true;}}"
          )

          new1 = (
              "if(isJE){loadTransferJEs();"
              "if(je){je.value=sourceName;je.disabled=false;}}"
          )

          if old1 in text:
              text = text.replace(
                  old1,
                  new1,
                  1
              )

              print(
                  "Received JE dropdown remains enabled."
              )

          old2 = "if(isJE&&je)je.disabled=true;"

          new2 = "if(isJE&&je)je.disabled=false;"

          if old2 in text:
              text = text.replace(
                  old2,
                  new2,
                  1
              )

              print(
                  "Received JE secondary correction applied."
              )

          p.write_text(
              text,
              encoding="utf-8"
          )

          print(
              "ONLY RECEIVED -> JE CORRECTION COMPLETED."
          )
          PY


      - name: Verify Requested JE Correction
        shell: bash
        run: |
          set -e

          HTML="mbms_work/index.html"

          test -s "$HTML"

          grep -q \
            "loadTransferJEs()" \
            "$HTML"

          grep -q \
            "je.disabled=false" \
            "$HTML"

          echo "RECEIVED JE FULL LIST CORRECTION VERIFIED."


      - name: Verify MBMS Core Functions
        shell: bash
        run: |
          set -e

          HTML="mbms_work/index.html"

          grep -q \
            "mbmsSettingsSnapshot" \
            "$HTML"

          grep -q \
            "downloadSettingsBackup" \
            "$HTML"

          grep -q \
            "restoreSettingsBackup" \
            "$HTML"

          grep -q \
            "generateTransferReport" \
            "$HTML"

          grep -q \
            "saveTransferMB" \
            "$HTML"

          grep -q \
            "getTransferHistory" \
            "$HTML"

          echo "MBMS CORE FUNCTIONS VERIFIED."


      - name: Apply ONLY MB Summary Relationship and Detail Fix
        shell: bash
        run: |
          set -Eeuo pipefail

          # IMPORTANT:
          # The previous version used Base64 and failed with:
          # binascii.Error: Incorrect padding
          #
          # This version intentionally does NOT use Base64.
          # The JavaScript patch is stored as plain text and then
          # inserted inside an executable <script> block.

          cat > /tmp/mbms_summary_patch.js <<'PATCH_JS'
          /* V124 - ONLY HOME MB SUMMARY RELATIONSHIP REPORT FIX */
          (function(){
            'use strict';

            const ALL_DETAIL='__ALL_DETAIL__';
            const SMALL='__SMALL_MB__';
            const LARGE='__LARGE_MB__';
            const MBNO='__MBNO__::';

            function safeArray(v){ return Array.isArray(v)?v:[]; }

            function n(v){
              try{
                return hrNorm(v);
              }catch(e){
                try{
                  return norm(String(v??''));
                }catch(e2){
                  return String(v??'').trim().toLowerCase();
                }
              }
            }

            function s(v){
              return v==null?'':String(v);
            }

            function esc(v){
              try{
                return escapeHtml(v==null?'':String(v));
              }catch(e){
                return String(v??'');
              }
            }

            function date(v){
              try{
                return hrDate(v||'');
              }catch(e){
                try{
                  return billDateText(v||'')||'-';
                }catch(e2){
                  return v||'-';
                }
              }
            }

            function amount(v){
              try{
                return billAmountText(v);
              }catch(e){
                return '₹ 0.00';
              }
            }

            function uniqueSorted(values){
              return [...new Set(
                values
                  .map(v=>s(v).trim())
                  .filter(Boolean)
              )].sort(
                (a,b)=>a.localeCompare(
                  b,
                  undefined,
                  {
                    numeric:true,
                    sensitivity:'base'
                  }
                )
              );
            }

            function mbNo(m){
              return s(
                m?.number ||
                m?.mbNumber ||
                m?.mb ||
                ''
              ).trim();
            }

            function workName(w){
              return s(
                w?.name ||
                w?.work ||
                w?.workName ||
                ''
              ).trim();
            }

            function holder(no){
              try{
                return mbSummaryCurrentHolder(no);
              }catch(e){
                return {
                  location:'available',
                  name:'उपलब्ध M.B.',
                  type:'AVAILABLE',
                  date:''
                };
              }
            }

            function holderName(no){
              const h=holder(no);

              if(h.location==='je'){
                return h.name||'JE';
              }

              if(h.location==='office'){
                return 'विभागीय कार्यालय';
              }

              if(h.location==='available'){
                return 'उपलब्ध M.B.';
              }

              return h.name||'इतर';
            }

            function sizeKey(v){
              const x=n(v);

              if(
                x==='small' ||
                x.includes('small') ||
                x.includes('लहान')
              ){
                return 'SMALL';
              }

              if(
                x==='large' ||
                x.includes('large') ||
                x.includes('big') ||
                x.includes('मोठ')
              ){
                return 'LARGE';
              }

              return '';
            }

            function emptySet(){
              return {
                mbs:[],
                jes:[],
                works:[],
                assigns:[],
                transfers:[],
                bills:[]
              };
            }

            function linkedByMB(d,numbers){
              const set=new Set(
                numbers
                  .filter(Boolean)
                  .map(n)
              );

              const out=emptySet();

              out.mbs=d.mbs.filter(
                x=>set.has(
                  n(mbNo(x))
                )
              );

              out.works=d.works.filter(
                x=>set.has(
                  n(x?.mb)
                )
              );

              out.assigns=d.assigns.filter(
                x=>set.has(
                  n(x?.mb)
                )
              );

              out.bills=d.bills.filter(
                x=>set.has(
                  n(x?.mb)
                )
              );

              out.transfers=d.transfers.filter(
                x=>set.has(
                  n(x?.number||x?.mb)
                )
              );

              return out;
            }

            function baseForContext(ctx,d){
              const out=emptySet();

              const target=
                ctx.target ||
                '__ALL__';

              const all=
                target==='__ALL__';

              if(ctx.type==='MB'){

                out.mbs=
                  all
                    ? d.mbs
                    : d.mbs.filter(
                        x=>
                          n(mbNo(x))===
                          n(target)
                      );

                const nums=
                  all
                    ? null
                    : new Set(
                        out.mbs
                          .map(mbNo)
                          .map(n)
                      );

                out.works=
                  all
                    ? d.works
                    : d.works.filter(
                        x=>nums.has(
                          n(x?.mb)
                        )
                      );

                out.assigns=
                  all
                    ? d.assigns
                    : d.assigns.filter(
                        x=>nums.has(
                          n(x?.mb)
                        )
                      );

                out.bills=
                  all
                    ? d.bills
                    : d.bills.filter(
                        x=>nums.has(
                          n(x?.mb)
                        )
                      );

                out.transfers=
                  all
                    ? d.transfers
                    : d.transfers.filter(
                        x=>nums.has(
                          n(x?.number||x?.mb)
                        )
                      );

                return out;
              }

              if(ctx.type==='JE'){

                out.works=
                  all
                    ? d.works
                    : d.works.filter(
                        x=>
                          n(x?.je)===
                          n(target)
                      );

                out.assigns=
                  all
                    ? d.assigns
                    : d.assigns.filter(
                        x=>
                          n(x?.je)===
                          n(target)
                      );

                out.bills=
                  all
                    ? d.bills
                    : d.bills.filter(
                        x=>
                          n(x?.je)===
                          n(target)
                      );

                const nums=
                  uniqueSorted(
                    out.works.map(
                      x=>x?.mb
                    ).concat(
                      out.assigns.map(
                        x=>x?.mb
                      ),
                      out.bills.map(
                        x=>x?.mb
                      )
                    )
                  );

                out.mbs=
                  nums.length
                    ? d.mbs.filter(
                        x=>
                          nums.includes(
                            mbNo(x)
                          )
                      )
                    : [];

                out.transfers=
                  nums.length
                    ? d.transfers.filter(
                        x=>
                          nums.includes(
                            s(
                              x?.number||
                              x?.mb
                            ).trim()
                          )
                      )
                    : [];

                return out;
              }

              if(ctx.type==='WORK'){

                out.works=
                  all
                    ? d.works
                    : d.works.filter(
                        x=>
                          n(
                            workName(x)
                          )===
                          n(target)
                      );

                const names=
                  new Set(
                    out.works.map(
                      x=>n(
                        workName(x)
                      )
                    )
                  );

                out.bills=
                  all
                    ? d.bills
                    : d.bills.filter(
                        x=>
                          names.has(
                            n(workName(x))
                          )
                      );

                const nums=
                  uniqueSorted(
                    out.works.map(
                      x=>x?.mb
                    ).concat(
                      out.bills.map(
                        x=>x?.mb
                      )
                    )
                  );

                out.mbs=
                  nums.length
                    ? d.mbs.filter(
                        x=>
                          nums.includes(
                            mbNo(x)
                          )
                      )
                    : [];

                out.assigns=
                  nums.length
                    ? d.assigns.filter(
                        x=>
                          nums.includes(
                            s(x?.mb).trim()
                          )
                      )
                    : [];

                out.transfers=
                  nums.length
                    ? d.transfers.filter(
                        x=>
                          nums.includes(
                            s(
                              x?.number||
                              x?.mb
                            ).trim()
                          )
                      )
                    : [];

                return out;
              }

              if(ctx.type==='CONTRACTOR'){

                out.works=
                  all
                    ? d.works
                    : d.works.filter(
                        x=>
                          n(x?.contractor)===
                          n(target)
                      );

                out.assigns=
                  all
                    ? d.assigns
                    : d.assigns.filter(
                        x=>
                          n(x?.contractor)===
                          n(target)
                      );

                out.bills=
                  all
                    ? d.bills
                    : d.bills.filter(
                        x=>
                          n(x?.contractor)===
                          n(target)
                      );

                const nums=
                  uniqueSorted(
                    out.works.map(
                      x=>x?.mb
                    ).concat(
                      out.assigns.map(
                        x=>x?.mb
                      ),
                      out.bills.map(
                        x=>x?.mb
                      )
                    )
                  );

                out.mbs=
                  nums.length
                    ? d.mbs.filter(
                        x=>
                          nums.includes(
                            mbNo(x)
                          )
                      )
                    : [];

                out.transfers=
                  nums.length
                    ? d.transfers.filter(
                        x=>
                          nums.includes(
                            s(
                              x?.number||
                              x?.mb
                            ).trim()
                          )
                      )
                    : [];

                return out;
              }

              out.bills=
                all
                  ? d.bills
                  : d.bills.filter(
                      x=>
                        n(
                          x?.billNo||
                          x?.billType
                        )===
                        n(target)
                    );

              const nums=
                uniqueSorted(
                  out.bills.map(
                    x=>x?.mb
                  )
                );

              out.mbs=
                nums.length
                  ? d.mbs.filter(
                      x=>
                        nums.includes(
                          mbNo(x)
                        )
                    )
                  : [];

              const mset=
                new Set(
                  nums.map(n)
                );

              out.works=
                all
                  ? d.works
                  : d.works.filter(
                      x=>
                        mset.has(
                          n(x?.mb)
                        ) ||
                        out.bills.some(
                          b=>
                            n(
                              workName(b)
                            )===
                            n(
                              workName(x)
                            )
                        )
                    );

              out.assigns=
                nums.length
                  ? d.assigns.filter(
                      x=>
                        mset.has(
                          n(x?.mb)
                        )
                    )
                  : [];

              out.transfers=
                nums.length
                  ? d.transfers.filter(
                      x=>
                        mset.has(
                          n(
                            x?.number||
                            x?.mb
                          )
                        )
                    )
                  : [];

              return out;
            }

            function filterByComponent(
              ctx,
              base,
              d
            ){
              const c=ctx.ctype;
              const detail=ctx.detail||'';

              const out={
                mbs:base.mbs.slice(),
                jes:base.jes.slice(),
                works:base.works.slice(),
                assigns:base.assigns.slice(),
                transfers:base.transfers.slice(),
                bills:base.bills.slice()
              };

              if(c==='ALL'){
                return out;
              }

              if(c==='MB'){

                if(
                  detail===SMALL ||
                  detail===LARGE
                ){

                  const wanted=
                    detail===SMALL
                      ? 'SMALL'
                      : 'LARGE';

                  out.mbs=
                    out.mbs.filter(
                      x=>
                        sizeKey(
                          x?.size
                        )===wanted
                    );

                }else if(
                  detail.startsWith(MBNO)
                ){

                  const selected=
                    detail.slice(
                      MBNO.length
                    );

                  out.mbs=
                    out.mbs.filter(
                      x=>
                        n(mbNo(x))===
                        n(selected)
                    );
                }

                const nums=
                  new Set(
                    out.mbs.map(
                      x=>n(mbNo(x))
                    )
                  );

                out.works=
                  out.works.filter(
                    x=>
                      nums.has(
                        n(x?.mb)
                      )
                  );

                out.assigns=
                  out.assigns.filter(
                    x=>
                      nums.has(
                        n(x?.mb)
                      )
                  );

                out.bills=
                  out.bills.filter(
                    x=>
                      nums.has(
                        n(x?.mb)
                      )
                  );

                out.transfers=
                  out.transfers.filter(
                    x=>
                      nums.has(
                        n(
                          x?.number||
                          x?.mb
                        )
                      )
                  );

                return out;
              }

              if(c==='WORK'){

                if(
                  detail &&
                  detail!==ALL_DETAIL
                ){

                  out.works=
                    out.works.filter(
                      x=>
                        n(
                          workName(x)
                        )===
                        n(detail)
                    );

                  out.bills=
                    out.bills.filter(
                      x=>
                        n(
                          workName(x)
                        )===
                        n(detail)
                    );
                }

                const nums=
                  new Set(
                    out.works.map(
                      x=>n(x?.mb)
                    ).concat(
                      out.bills.map(
                        x=>n(x?.mb)
                      )
                    )
                  );

                out.mbs=
                  out.mbs.filter(
                    x=>
                      nums.has(
                        n(mbNo(x))
                      )
                  );

                out.assigns=
                  out.assigns.filter(
                    x=>
                      nums.has(
                        n(x?.mb)
                      )
                  );

                out.transfers=
                  out.transfers.filter(
                    x=>
                      nums.has(
                        n(
                          x?.number||
                          x?.mb
                        )
                      )
                  );

                return out;
              }

              if(c==='JE'){

                if(
                  detail &&
                  detail!==ALL_DETAIL
                ){

                  out.works=
                    out.works.filter(
                      x=>
                        n(x?.je)===
                        n(detail)
                    );

                  out.assigns=
                    out.assigns.filter(
                      x=>
                        n(x?.je)===
                        n(detail)
                    );

                  out.bills=
                    out.bills.filter(
                      x=>
                        n(x?.je)===
                        n(detail)
                    );
                }

                const nums=
                  new Set(
                    out.works.map(
                      x=>n(x?.mb)
                    ).concat(
                      out.assigns.map(
                        x=>n(x?.mb)
                      ),
                      out.bills.map(
                        x=>n(x?.mb)
                      )
                    )
                  );

                out.mbs=
                  out.mbs.filter(
                    x=>
                      nums.has(
                        n(mbNo(x))
                      )
                  );

                out.transfers=
                  out.transfers.filter(
                    x=>
                      nums.has(
                        n(
                          x?.number||
                          x?.mb
                        )
                      )
                  );

                return out;
              }

              if(c==='CONTRACTOR'){

                if(
                  detail &&
                  detail!==ALL_DETAIL
                ){

                  out.works=
                    out.works.filter(
                      x=>
                        n(
                          x?.contractor
                        )===
                        n(detail)
                    );

                  out.assigns=
                    out.assigns.filter(
                      x=>
                        n(
                          x?.contractor
                        )===
                        n(detail)
                    );

                  out.bills=
                    out.bills.filter(
                      x=>
                        n(
                          x?.contractor
                        )===
                        n(detail)
                    );
                }

                const nums=
                  new Set(
                    out.works.map(
                      x=>n(x?.mb)
                    ).concat(
                      out.assigns.map(
                        x=>n(x?.mb)
                      ),
                      out.bills.map(
                        x=>n(x?.mb)
                      )
                    )
                  );

                out.mbs=
                  out.mbs.filter(
                    x=>
                      nums.has(
                        n(mbNo(x))
                      )
                  );

                out.transfers=
                  out.transfers.filter(
                    x=>
                      nums.has(
                        n(
                          x?.number||
                          x?.mb
                        )
                      )
                  );

                return out;
              }

              if(c==='BILL'){

                if(
                  detail &&
                  detail!==ALL_DETAIL
                ){

                  out.bills=
                    out.bills.filter(
                      x=>
                        n(x?.billType)===
                        n(detail)
                    );
                }

                const nums=
                  new Set(
                    out.bills.map(
                      x=>n(x?.mb)
                    )
                  );

                out.mbs=
                  out.mbs.filter(
                    x=>
                      nums.has(
                        n(mbNo(x))
                      )
                  );

                out.works=
                  out.works.filter(
                    x=>
                      nums.has(
                        n(x?.mb)
                      ) ||
                      out.bills.some(
                        b=>
                          n(
                            workName(b)
                          )===
                          n(
                            workName(x)
                          )
                      )
                  );

                out.assigns=
                  out.assigns.filter(
                    x=>
                      nums.has(
                        n(x?.mb)
                      )
                  );

                out.transfers=
                  out.transfers.filter(
                    x=>
                      nums.has(
                        n(
                          x?.number||
                          x?.mb
                        )
                      )
                  );

                return out;
              }

              if(c==='TRANSFER'){

                if(
                  detail &&
                  detail!==ALL_DETAIL
                ){

                  out.transfers=
                    out.transfers.filter(
                      x=>
                        n(
                          x?.number||
                          x?.mb
                        )===
                        n(detail)
                    );
                }

                const nums=
                  new Set(
                    out.transfers.map(
                      x=>
                        n(
                          x?.number||
                          x?.mb
                        )
                    )
                  );

                out.mbs=
                  out.mbs.filter(
                    x=>
                      nums.has(
                        n(mbNo(x))
                      )
                  );

                out.works=
                  out.works.filter(
                    x=>
                      nums.has(
                        n(x?.mb)
                      )
                  );

                out.assigns=
                  out.assigns.filter(
                    x=>
                      nums.has(
                        n(x?.mb)
                      )
                  );

                out.bills=
                  out.bills.filter(
                    x=>
                      nums.has(
                        n(x?.mb)
                      )
                  );

                return out;
              }

              return out;
            }

            function homeRelData(){

              const d={
                mbs:[],
                jes:[],
                works:[],
                assigns:[],
                transfers:[],
                bills:[]
              };

              try{
                d.mbs=safeArray(
                  window.mbs ||
                  window.mbData ||
                  window.measurementBooks
                );
              }catch(e){}

              try{
                d.jes=safeArray(
                  window.jes ||
                  window.jeList ||
                  window.juniorEngineers
                );
              }catch(e){}

              try{
                d.works=safeArray(
                  window.works ||
                  window.workList ||
                  window.workRecords
                );
              }catch(e){}

              try{
                d.assigns=safeArray(
                  window.assigns ||
                  window.mbAssignments ||
                  window.assignments
                );
              }catch(e){}

              try{
                d.transfers=safeArray(
                  window.transfers ||
                  window.transferHistory ||
                  window.mbTransfers
                );
              }catch(e){}

              try{
                d.bills=safeArray(
                  window.bills ||
                  window.billList ||
                  window.billRecords
                );
              }catch(e){}

              return d;
            }

            function getHomeRelationshipContext(){

              const type=
                document.getElementById(
                  'homeRelType'
                )?.value ||
                '';

              const target=
                document.getElementById(
                  'homeRelTarget'
                )?.value ||
                '';

              const ctype=
                document.getElementById(
                  'homeRelComponent'
                )?.value ||
                '';

              const detail=
                document.getElementById(
                  'homeRelDetail'
                )?.value ||
                '';

              return {
                type,
                target,
                ctype,
                detail
              };
            }

            function linkedData(ctx){

              const d=
                homeRelData();

              const base=
                baseForContext(
                  ctx,
                  d
                );

              return filterByComponent(
                ctx,
                base,
                d
              );
            }

            function currentScopeTitle(ctx){

              let title=
                'M.B. Summary';

              if(ctx.type==='JE'){
                title=
                  'Junior Engineer : '+
                  (ctx.target||'सर्व JE');
              }

              if(ctx.type==='MB'){
                title=
                  'M.B. : '+
                  (ctx.target||'सर्व M.B.');
              }

              if(ctx.type==='WORK'){
                title=
                  'काम : '+
                  (ctx.target||'सर्व कामे');
              }

              if(ctx.type==='CONTRACTOR'){
                title=
                  'Contractor / Agency : '+
                  (ctx.target||'सर्व');
              }

              if(ctx.type==='BILL'){
                title=
                  'Bill : '+
                  (ctx.target||'सर्व Bill');
              }

              return title;
            }

