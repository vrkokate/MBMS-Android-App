name: MBMS V126 FINAL - Stable APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Final MBMS APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle 8.7
        shell: bash
        run: |
          set -euo pipefail
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
          mkdir -p "$HOME/gradle"
          unzip -q gradle-8.7-bin.zip -d "$HOME/gradle"
          echo "$HOME/gradle/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: Find MBMS HTML
        shell: bash
        run: |
          set -euo pipefail
          HTML_FILE=""

          for f in \
            "Measurement_Book_Management_System_FINAL_V120_TRANSFER_REPORT_FINAL.html" \
            "Measurement_Book_Management_System_FINAL_V118_PRINT_BACKUP_ANDROID.html" \
            "Measurement_Book_Management_System_FINAL_V115_MB_HISTORY_ONLY_DATE-6.html" \
            "Measurement_Book_Management_System_FINAL_V115_MB_HISTORY_ONLY_DATE.html" \
            "Measurement_Book_Management_System_FINAL_V115.html" \
            "V115.html" \
            "index.html"
          do
            if [ -f "$f" ]; then
              HTML_FILE="$f"
              break
            fi
          done

          if [ -z "$HTML_FILE" ]; then
            HTML_FILE="$(
              find . \
                -maxdepth 3 \
                -type f \
                -iname '*.html' \
                -not -path './.git/*' \
                | head -n 1 || true
            )"
          fi

          if [ -z "$HTML_FILE" ]; then
            echo "ERROR: MBMS HTML file not found."
            exit 1
          fi

          echo "HTML_FILE=$HTML_FILE" >> "$GITHUB_ENV"
          echo "Using: $HTML_FILE"

      - name: Prepare MBMS HTML
        shell: bash
        run: |
          set -euo pipefail

          rm -rf mbms_work release mbms_android

          mkdir -p mbms_work release

          cp "$HTML_FILE" mbms_work/index.html

          test -s mbms_work/index.html

      - name: Apply ONLY Received to JE correction
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path

          p = Path("mbms_work/index.html")

          text = p.read_text(
              encoding="utf-8"
          )

          text = text.replace(
              "if(isJE){loadTransferJEs();if(je){je.value=sourceName;je.disabled=true;}}",
              "if(isJE){loadTransferJEs();if(je){je.value=sourceName;je.disabled=false;}}",
              1
          )

          text = text.replace(
              "if(isJE&&je)je.disabled=true;",
              "if(isJE&&je)je.disabled=false;",
              1
          )

          p.write_text(
              text,
              encoding="utf-8"
          )

          print(
              "Received -> JE correction applied."
          )
          PY

      - name: Apply ONLY MB Summary Relationship Fix
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path
          import base64
          import gzip

          p = Path(
              "mbms_work/index.html"
          )

          text = p.read_text(
              encoding="utf-8"
          )

          encoded = ''''''
          
          patch = gzip.decompress(
              base64.b64decode(encoded)
          ).decode("utf-8")

          marker = "</body>"

          pos = text.lower().rfind(
              marker.lower()
          )

          if pos < 0:
              raise SystemExit(
                  "ERROR: </body> marker not found."
              )

          script = (
              '<script id="V126_MBMS_SUMMARY_LINKED_FIX">\n'
              + patch
              + '\n</script>\n'
          )

          text = (
              text[:pos]
              + script
              + text[pos:]
          )

          p.write_text(
              text,
              encoding="utf-8"
          )

          print(
              "MB Summary relationship fix applied."
          )
          PY

      - name: Validate final HTML and JavaScript
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path
          import re

          text = Path(
              "mbms_work/index.html"
          ).read_text(
              encoding="utf-8"
          )

          required = [
              "V126_MBMS_SUMMARY_LINKED_FIX",
              "printLinkedRelationshipReport",
              "loadHomeRelDetailsV124",
              "mbmsV126TransferLinkFixLoaded",
              "je.disabled=false"
          ]

          for item in required:
              if item not in text:
                  raise SystemExit(
                      "ERROR: Missing required marker: "
                      + item
                  )

          scripts = re.findall(
              r"<script[^>]*>(.*?)</script>",
              text,
              flags=re.I | re.S
          )

          if not scripts:
              raise SystemExit(
                  "ERROR: No JavaScript blocks found."
              )

          for i, script in enumerate(scripts):
              Path(
                  f"/tmp/mbms_{i}.js"
              ).write_text(
                  script,
                  encoding="utf-8"
              )

          print(
              "JavaScript blocks:",
              len(scripts)
          )
          PY

          for f in /tmp/mbms_*.js
          do
            node --check "$f"
          done

          echo "FINAL HTML/JAVASCRIPT VALIDATION PASSED."

      - name: Create Android project
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p \
            mbms_android/app/src/main/assets \
            mbms_android/app/src/main/java/com/mbms/app \
            mbms_android/app/src/main/res/values

          cp \
            mbms_work/index.html \
            mbms_android/app/src/main/assets/index.html

          cat > mbms_android/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(
                  RepositoriesMode.FAIL_ON_PROJECT_REPOS
              )

              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = 'MBMSAndroid'

          include ':app'
          EOF

          cat > mbms_android/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
                  version '8.6.1'
                  apply false
          }
          EOF

          cat > mbms_android/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=false
          android.nonTransitiveRClass=true
          EOF

          cat > mbms_android/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.mbms.app'

              compileSdk 35

              defaultConfig {
                  applicationId 'com.mbms.app'

                  minSdk 26
                  targetSdk 35

                  versionCode 126
                  versionName 'V126'
              }

              buildTypes {
                  debug {
                      minifyEnabled false
                      shrinkResources false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat > mbms_android/app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">MBMS</string>
          </resources>
          EOF

          cat > mbms_android/app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style
                  name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">

                  <item name="android:fontFamily">
                      sans
                  </item>

              </style>
          </resources>
          EOF

          cat > mbms_android/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest
              xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission
                  android:name="android.permission.INTERNET" />

              <application
                  android:allowBackup="true"
                  android:usesCleartextTraffic="true"
                  android:label="@string/app_name"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait"
                      android:configChanges="orientation|screenSize|keyboardHidden">

                      <intent-filter>

                          <action
                              android:name="android.intent.action.MAIN" />

                          <category
                              android:name="android.intent.category.LAUNCHER" />

                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

      - name: Create MainActivity.java
        shell: bash
        run: |
          set -euo pipefail

          cat > mbms_android/app/src/main/java/com/mbms/app/MainActivity.java <<'EOF'
          package com.mbms.app;

          import android.app.Activity;
          import android.content.ContentValues;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Environment;
          import android.provider.MediaStore;
          import android.print.PrintAttributes;
          import android.print.PrintDocumentAdapter;
          import android.print.PrintManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Toast;

          import java.io.File;
          import java.io.FileOutputStream;
          import java.nio.charset.StandardCharsets;

          public class MainActivity extends Activity {

              private WebView webView;

              private ValueCallback<Uri[]> filePathCallback;

              private static final int REQUEST_FILE = 9102;

              @Override
              protected void onCreate(Bundle savedInstanceState) {

                  super.onCreate(savedInstanceState);

                  webView = new WebView(this);

                  setContentView(webView);

                  WebSettings settings =
                      webView.getSettings();

                  settings.setJavaScriptEnabled(true);

                  settings.setDomStorageEnabled(true);

                  settings.setDatabaseEnabled(true);

                  settings.setAllowFileAccess(true);

                  settings.setAllowContentAccess(true);

                  settings.setBuiltInZoomControls(false);

                  settings.setDisplayZoomControls(false);

                  settings.setSupportZoom(false);

                  webView.addJavascriptInterface(
                      new AndroidBridge(),
                      "MBMSAndroid"
                  );

                  webView.setWebChromeClient(
                      new WebChromeClient() {

                          @Override
                          public boolean onShowFileChooser(
                              WebView view,
                              ValueCallback<Uri[]> callback,
                              FileChooserParams params) {

                              if (filePathCallback != null) {
                                  filePathCallback
                                      .onReceiveValue(null);
                              }

                              filePathCallback = callback;

                              try {

                                  Intent intent =
                                      new Intent(
                                          Intent.ACTION_OPEN_DOCUMENT
                                      );

                                  intent.addCategory(
                                      Intent.CATEGORY_OPENABLE
                                  );

                                  intent.setType(
                                      "application/json"
                                  );

                                  startActivityForResult(
                                      intent,
                                      REQUEST_FILE
                                  );

                                  return true;

                              } catch (Exception e) {

                                  filePathCallback = null;

                                  return false;
                              }
                          }
                      }
                  );

                  webView.setWebViewClient(
                      new WebViewClient() {

                          @Override
                          public boolean shouldOverrideUrlLoading(
                              WebView view,
                              WebResourceRequest request) {

                              return false;
                          }
                      }
                  );

                  webView.loadUrl(
                      "file:///android_asset/index.html"
                  );
              }

              @JavascriptInterface
              public void print() {

                  runOnUiThread(
                      new Runnable() {

                          @Override
                          public void run() {

                              try {

                                  PrintManager manager =
                                      (PrintManager)
                                          getSystemService(
                                              PRINT_SERVICE
                                          );

                                  PrintDocumentAdapter adapter =
                                      webView
                                          .createPrintDocumentAdapter(
                                              "MBMS_Report"
                                          );

                                  manager.print(
                                      "MBMS Report",
                                      adapter,
                                      new PrintAttributes.Builder()
                                          .setMediaSize(
                                              PrintAttributes.MediaSize.ISO_A4
                                          )
                                          .setMinMargins(
                                              PrintAttributes.Margins.NO_MARGINS
                                          )
                                          .build()
                                  );

                              } catch (Exception e) {

                                  Toast.makeText(
                                      MainActivity.this,
                                      "Print मध्ये त्रुटी आली.",
                                      Toast.LENGTH_LONG
                                  ).show();
                              }
                          }
                      }
                  );
              }

              @JavascriptInterface
              public void saveBackup(
                  final String json,
                  final String filename) {

                  new Thread(
                      new Runnable() {

                          @Override
                          public void run() {

                              boolean success = false;

                              try {

                                  if (Build.VERSION.SDK_INT >= 29) {

                                      ContentValues values =
                                          new ContentValues();

                                      values.put(
                                          MediaStore.Downloads.DISPLAY_NAME,
                                          filename
                                      );

                                      values.put(
                                          MediaStore.Downloads.MIME_TYPE,
                                          "application/json"
                                      );

                                      values.put(
                                          MediaStore.Downloads.RELATIVE_PATH,
                                          Environment.DIRECTORY_DOWNLOADS
                                      );

                                      values.put(
                                          MediaStore.Downloads.IS_PENDING,
                                          1
                                      );

                                      Uri uri =
                                          getContentResolver()
                                              .insert(
                                                  MediaStore.Downloads.EXTERNAL_CONTENT_URI,
                                                  values
                                              );

                                      if (uri != null) {

                                          java.io.OutputStream output =
                                              getContentResolver()
                                                  .openOutputStream(uri);

                                          if (output != null) {

                                              output.write(
                                                  json.getBytes(
                                                      StandardCharsets.UTF_8
                                                  )
                                              );

                                              output.flush();

                                              output.close();

                                              success = true;
                                          }

                                          ContentValues done =
                                              new ContentValues();

                                          done.put(
                                              MediaStore.Downloads.IS_PENDING,
                                              0
                                          );

                                          getContentResolver()
                                              .update(
                                                  uri,
                                                  done,
                                                  null,
                                                  null
                                              );

                                      }

                                  } else {

                                      File directory =
                                          Environment
                                              .getExternalStoragePublicDirectory(
                                                  Environment
                                                      .DIRECTORY_DOWNLOADS
                                              );

                                      if (!directory.exists()) {
                                          directory.mkdirs();
                                      }

                                      File file =
                                          new File(
                                              directory,
                                              filename
                                          );

                                      FileOutputStream output =
                                          new FileOutputStream(file);

                                      output.write(
                                          json.getBytes(
                                              StandardCharsets.UTF_8
                                          )
                                      );

                                      output.flush();

                                      output.close();

                                      success = true;
                                  }

                              } catch (Exception e) {

                                  e.printStackTrace();
                              }

                              final boolean result =
                                  success;

                              runOnUiThread(
                                  new Runnable() {

                                      @Override
                                      public void run() {

                                          Toast.makeText(
                                              MainActivity.this,
                                              result
                                                  ? "Backup Downloads मध्ये Save झाला."
                                                  : "Backup Save मध्ये त्रुटी आली.",
                                              Toast.LENGTH_LONG
                                          ).show();

                                      }
                                  }
                              );
                          }
                      }
                  ).start();
              }

              private class AndroidBridge {

                  @JavascriptInterface
                  public void print() {
                      MainActivity.this.print();
                  }

                  @JavascriptInterface
                  public void saveBackup(
                      String json,
                      String filename) {

                      MainActivity.this.saveBackup(
                          json,
                          filename
                      );
                  }
              }

              @Override
              protected void onActivityResult(
                  int requestCode,
                  int resultCode,
                  Intent data) {

                  super.onActivityResult(
                      requestCode,
                      resultCode,
                      data
                  );

                  if (
                      requestCode != REQUEST_FILE ||
                      filePathCallback == null
                  ) {
                      return;
                  }

                  Uri[] results = null;

                  if (
                      resultCode == RESULT_OK &&
                      data != null &&
                      data.getData() != null
                  ) {

                      results =
                          new Uri[]{
                              data.getData()
                          };
                  }

                  filePathCallback
                      .onReceiveValue(results);

                  filePathCallback = null;
              }

              @Override
              public void onBackPressed() {

                  if (
                      webView != null &&
                      webView.canGoBack()
                  ) {

                      webView.goBack();

                  } else {

                      super.onBackPressed();
                  }
              }

              @Override
              protected void onDestroy() {

                  if (webView != null) {

                      webView.stopLoading();

                      webView.destroy();

                      webView = null;
                  }

                  super.onDestroy();
              }
          }
          EOF

      - name: Verify Android project
        shell: bash
        run: |
          set -euo pipefail

          test -s \
            mbms_android/app/src/main/assets/index.html

          test -s \
            mbms_android/app/src/main/AndroidManifest.xml

          test -s \
            mbms_android/app/src/main/java/com/mbms/app/MainActivity.java

          echo "ANDROID PROJECT VALIDATION PASSED."

      - name: Compile Android Java
        working-directory: mbms_android
        shell: bash
        run: |
          set -euo pipefail

          gradle \
            --no-daemon \
            --stacktrace \
            :app:compileDebugJavaWithJavac

      - name: Build Final MBMS APK
        working-directory: mbms_android
        shell: bash
        run: |
          set -euo pipefail

          gradle \
            --no-daemon \
            --stacktrace \
            clean \
            :app:assembleDebug

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"

          cp \
            "$APK" \
            "../release/MBMS-V126-MB-SUMMARY-LINKED-STABLE.apk"

          ls -lh \
            "../release/MBMS-V126-MB-SUMMARY-LINKED-STABLE.apk"

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="release/MBMS-V126-MB-SUMMARY-LINKED-STABLE.apk"

          test -s "$APK"

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify \
            --verbose \
            "$APK"

          unzip -t \
            "$APK" \
            >/dev/null

          sha256sum \
            "$APK" \
            | tee release/SHA256.txt

          echo "APK VERIFIED SUCCESSFULLY."

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: MBMS-V126-MB-SUMMARY-LINKED-STABLE

          path: |
            release/MBMS-V126-MB-SUMMARY-LINKED-STABLE.apk
            release/SHA256.txt

          if-no-files-found: error
