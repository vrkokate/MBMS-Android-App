            function getHomeRelationshipContext(){

              const type=
                document.getElementById(
                  'homeRelType'
                )?.value || '';

              const target=
                document.getElementById(
                  'homeRelTarget'
                )?.value || '';

              const ctype=
                document.getElementById(
                  'homeRelComponent'
                )?.value || '';

              const detail=
                document.getElementById(
                  'homeRelDetail'
                )?.value || '';

              const from=
                document.getElementById(
                  'homeRelFromDate'
                )?.value || '';

              const to=
                document.getElementById(
                  'homeRelToDate'
                )?.value || '';

              return {
                type,
                target,
                ctype,
                detail,
                from,
                to
              };
            }

            function dateInRange(v,from,to){

              if(!from && !to){
                return true;
              }

              const raw=s(v);

              if(!raw){
                return false;
              }

              const d=new Date(raw);

              if(Number.isNaN(d.getTime())){
                return true;
              }

              if(from){

                const f=
                  new Date(from+'T00:00:00');

                if(
                  !Number.isNaN(f.getTime()) &&
                  d<f
                ){
                  return false;
                }
              }

              if(to){

                const t=
                  new Date(to+'T23:59:59');

                if(
                  !Number.isNaN(t.getTime()) &&
                  d>t
                ){
                  return false;
                }
              }

              return true;
            }

            function filterDateRange(data,ctx){

              if(!ctx.from && !ctx.to){
                return data;
              }

              const out={
                mbs: data.mbs.slice(),
                jes: data.jes.slice(),
                works: data.works.slice(),
                assigns: data.assigns.slice(),
                transfers: data.transfers.slice(),
                bills: data.bills.slice()
              };

              out.mbs=
                out.mbs.filter(
                  x=>dateInRange(
                    x?.date||
                    x?.mbDate||
                    x?.createdAt||
                    x?.savedAt,
                    ctx.from,
                    ctx.to
                  )
                );

              out.works=
                out.works.filter(
                  x=>dateInRange(
                    x?.date||
                    x?.workDate||
                    x?.createdAt||
                    x?.savedAt,
                    ctx.from,
                    ctx.to
                  )
                );

              out.assigns=
                out.assigns.filter(
                  x=>dateInRange(
                    x?.date||
                    x?.assignDate||
                    x?.createdAt||
                    x?.savedAt,
                    ctx.from,
                    ctx.to
                  )
                );

              out.transfers=
                out.transfers.filter(
                  x=>dateInRange(
                    x?.date||
                    x?.transferDate||
                    x?.createdAt||
                    x?.savedAt,
                    ctx.from,
                    ctx.to
                  )
                );

              out.bills=
                out.bills.filter(
                  x=>dateInRange(
                    x?.billDate||
                    x?.date||
                    x?.createdAt||
                    x?.savedAt,
                    ctx.from,
                    ctx.to
                  )
                );

              return out;
            }

            function linkedData(ctx){

              const d=
                filterDateRange(
                  homeRelData(),
                  ctx
                );

              const base=
                baseForContext(
                  ctx,
                  d
                );

              return filterByComponent(
                ctx,
                base,
                d
              );
            }

            function currentScopeTitle(ctx){

              let title='M.B. Summary';

              if(ctx.type==='JE'){
                title=
                  'Junior Engineer : '+
                  (ctx.target||'सर्व JE');
              }

              if(ctx.type==='MB'){
                title=
                  'M.B. : '+
                  (ctx.target||'सर्व M.B.');
              }

              if(ctx.type==='WORK'){
                title=
                  'काम : '+
                  (ctx.target||'सर्व कामे');
              }

              if(ctx.type==='CONTRACTOR'){
                title=
                  'Contractor / Agency : '+
                  (ctx.target||'सर्व');
              }

              if(ctx.type==='BILL'){
                title=
                  'Bill : '+
                  (ctx.target||'सर्व Bill');
              }

              return title;
            }

            function billStatusText(v){

              const x=n(v);

              if(
                x.includes('paid') ||
                x.includes('अदा')
              ){
                return 'अदा';
              }

              if(
                x.includes('pending') ||
                x.includes('प्रलंबित')
              ){
                return 'प्रलंबित';
              }

              return s(v)||'-';
            }

