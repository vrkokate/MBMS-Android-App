name: MBMS Android APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Verified MBMS Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate and Prepare HTML
        shell: bash
        run: |
          set -e
          mkdir -p mbms_work

          for z in *.zip; do
            if [ -f "$z" ]; then
              echo "Unpacking zip: $z"
              unzip -q -o "$z" -d extracted_zip || true
            fi
          done

          TARGET_HTML=$(find . -type f -iname "*.html" -not -path "./.git/*" -not -path "./mbms_work/*" -exec ls -S {} + | head -n 1)

          if [ -z "$TARGET_HTML" ]; then
            echo "ERROR: No HTML file found in repository."
            exit 1
          fi

          echo "Target HTML detected: $TARGET_HTML"
          cp "$TARGET_HTML" mbms_work/index.html
          test -s mbms_work/index.html

      - name: Restore Original Look and Apply Only Internal Logic
        shell: bash
        run: |
          set -e
          python3 <<'PY'
          from pathlib import Path
          import re

          html_file = Path("mbms_work/index.html")
          raw_html = html_file.read_text(encoding="utf-8")

          # १. मूळ लूक बदलणारा आधीचा कोणताही टॅब कोड काढून टाकणे
          raw_html = re.sub(r'<!-- ==================== MBMS FINAL UNIFIED SYSTEM ==================== -->[\s\S]*?<!-- ==================== END ==================== -->', '', raw_html)

          # २. वरचे केशरी REPORT बटण काढून टाकणे
          raw_html = re.sub(r'<button[^>]*class="[^"]*btn-warning[^"]*"[^>]*>[\s\S]*?REPORT[\s\S]*?</button>', '', raw_html, flags=re.I)
          raw_html = re.sub(r'<button[^>]*style="[^"]*background[^"]*(?:#ff9800|orange|rgb\(255,\s*152,\s*0\))[^"]*"[^>]*>[\s\S]*?REPORT[\s\S]*?</button>', '', raw_html, flags=re.I)

          patch_code = """
          <!-- ==================== ORIGINAL LOOK PRESERVED ENGINE ==================== -->
          <style id="MBMS_ORIGINAL_LOOK_FIX">
          /* हेडरमधील अनावश्यक केशरी REPORT बटण लपवणे */
          header button:contains("REPORT"),
          .navbar button:contains("REPORT"),
          div[class*="header"] button:contains("REPORT") {
            display: none !important;
          }

          @media print {
            @page { size: A4 portrait; margin: 8mm !important; }
            body { background: #fff !important; color: #000 !important; }
            body > *:not(#printArea) { display: none !important; }
            #printArea { display: block !important; width: 100% !important; }
            table.print-table { width: 100% !important; border-collapse: collapse !important; margin-top: 6px !important; }
            table.print-table th, table.print-table td { border: 1px solid #000 !important; padding: 5px 6px !important; font-size: 11px !important; }
            table.print-table th { background: #eee !important; font-weight: bold !important; }
          }
          </style>

          <div id="printArea" style="display: none;"></div>

          <script id="MBMS_ORIGINAL_CONTROLLER">
          (function() {
            // १. M.B. List मधील दिनांक dd-mm-yyyy करणे
            setInterval(function() {
              document.querySelectorAll('table td, [class*="row"] div').forEach(function(td) {
                var t = td.textContent.trim();
                var m = t.match(/^(\\d{4})[-/](\\d{2})[-/](\\d{2})$/);
                if (m) {
                  td.textContent = m[3] + '-' + m[2] + '-' + m[1];
                }
              });

              // वरचे रिपोर्ट बटण काढणे
              document.querySelectorAll('button, a').forEach(function(b) {
                var txt = (b.textContent || b.value || '').trim().toUpperCase();
                if (txt === 'REPORT' && b.getBoundingClientRect().top < 85) {
                  b.remove();
                }
              });
            }, 250);

            // २. M.B. निवडल्यानंतर उपघटकात 'सर्व M.B., लहान M.B., मोठी M.B.' ठेवणे
            function syncOriginalDropdowns() {
              var selects = Array.from(document.querySelectorAll('select'));
              if (selects.length >= 2) {
                var mainSelect = selects.find(function(s) {
                  return (s.options[s.selectedIndex]?.text || s.value || '').trim().toUpperCase().includes('M.B');
                });

                if (mainSelect) {
                  var subSelect = selects.find(function(s) {
                    return s !== mainSelect && ((s.options[0]?.text || '').includes('M.B') || (s.options[0]?.text || '').includes('सर्व'));
                  });

                  if (subSelect) {
                    var currentTexts = Array.from(subSelect.options).map(function(o){ return o.text.trim(); });
                    if (!currentTexts.includes('लहान M.B.') || !currentTexts.includes('मोठी M.B.')) {
                      var cur = subSelect.value;
                      subSelect.innerHTML = '';
                      subSelect.add(new Option('सर्व M.B.', 'सर्व M.B.'));
                      subSelect.add(new Option('लहान M.B.', 'लहान M.B.'));
                      subSelect.add(new Option('मोठी M.B.', 'मोठी M.B.'));
                      if (cur === 'लहान M.B.' || cur === 'मोठी M.B.') subSelect.value = cur;
                    }
                  }
                }
              }
            }
            setInterval(syncOriginalDropdowns, 300);

            // ३. अहवाल जनरेशन
            document.addEventListener('click', function(e) {
              var btn = e.target.closest('button, a');
              if (!btn) return;
              var t = (btn.textContent || btn.value || '').trim().toUpperCase();

              if (t.includes('REPORT') || t.includes('PRINT')) {
                var pa = document.getElementById('printArea');
                if (pa) {
                  var selectedFilter = 'सर्व M.B.';
                  document.querySelectorAll('select').forEach(function(s) {
                    var v = (s.options[s.selectedIndex]?.text || '').trim();
                    if (v === 'लहान M.B.' || v === 'मोठी M.B.' || v === 'सर्व M.B.') {
                      selectedFilter = v;
                    }
                  });

                  var mbList = [];
                  try { mbList = JSON.parse(localStorage.getItem('mb_records')) || []; } catch(err){}

                  var filtered = mbList.filter(function(item) {
                    var s = (item.size || item.mbSize || item.type || '').trim().toLowerCase();
                    if (selectedFilter === 'लहान M.B.') return s.includes('लहान') || s.includes('small');
                    if (selectedFilter === 'मोठी M.B.') return s.includes('मोठी') || s.includes('large');
                    return true;
                  });

                  e.preventDefault();
                  e.stopPropagation();

                  var h = '<div style="text-align: center; margin-bottom: 8px;">';
                  h += '  <h2 style="margin: 0; font-size: 17px; font-weight: bold;">सार्वजनिक बांधकाम विभाग</h2>';
                  h += '  <h3 style="margin: 3px 0 6px 0; font-size: 14px; text-decoration: underline;">मोजमाप पुस्तिका अहवाल</h3>';
                  h += '</div>';
                  h += '<div style="display: flex; justify-content: space-between; font-size: 11.5px; margin-bottom: 4px;">';
                  h += '  <span><b>निवड:</b> ' + selectedFilter + '</span>';
                  h += '  <span><b>दिनांक:</b> ' + new Date().toLocaleDateString('en-GB') + '</span>';
                  h += '</div>';
                  h += '<table class="print-table"><thead><tr>';
                  h += '  <th style="width: 1%; white-space: nowrap; text-align: center;">अ.क्र.</th>';
                  h += '  <th style="width: 1%; white-space: nowrap; text-align: center;">M.B. क्रमांक</th>';
                  h += '  <th style="width: 1%; white-space: nowrap; text-align: center;">M.B. ची साईज</th>';
                  h += '  <th style="text-align: left;">सध्या कोणाकडे आहे (JE चे नाव)</th>';
                  h += '</tr></thead><tbody>';

                  if (filtered.length === 0) {
                    h += '<tr><td colspan="4" style="text-align: center; padding: 10px;">नोंद उपलब्ध नाही.</td></tr>';
                  } else {
                    for (var i = 0; i < filtered.length; i++) {
                      var r = filtered[i];
                      h += '<tr>';
                      h += '  <td style="text-align: center;">' + (i + 1) + '</td>';
                      h += '  <td style="text-align: center;">' + (r.mbNumber || r.mbNo || "-") + '</td>';
                      h += '  <td style="text-align: center;">' + (r.size || r.mbSize || "लहान") + '</td>';
                      h += '  <td style="text-align: left;">' + (r.assignedTo || r.jeName || "स्टॉकमध्ये उपलब्ध") + '</td>';
                      h += '</tr>';
                    }
                  }
                  h += '</tbody></table>';

                  pa.innerHTML = h;
                  pa.style.display = 'block';
                  setTimeout(function() {
                    window.print();
                    setTimeout(function() { pa.style.display = 'none'; }, 500);
                  }, 150);
                }
              }
            }, true);

            // ४. बॅकअप व रिस्टोअर
            document.addEventListener('click', function(e) {
              var btn = e.target.closest('button, a');
              if (!btn) return;
              var t = (btn.textContent || btn.value || '').trim().toUpperCase();

              if (t.includes('BACKUP SAVE') || t === 'BACKUP') {
                e.preventDefault();
                e.stopPropagation();
                var data = {};
                for (var i = 0; i < localStorage.length; i++) {
                  var k = localStorage.key(i);
                  data[k] = localStorage.getItem(k);
                }
                var json = JSON.stringify(data, null, 2);
                if (window.MBMSAndroid && window.MBMSAndroid.saveBackupToDownloads) {
                  window.MBMSAndroid.saveBackupToDownloads(json);
                }
                return;
              }

              if (t.includes('BACKUP RESTORE') || t === 'RESTORE') {
                e.preventDefault();
                e.stopPropagation();
                if (window.MBMSAndroid && window.MBMSAndroid.openBackupPicker) {
                  window.MBMSAndroid.openBackupPicker();
                }
                return;
              }
            }, true);

            window.applyRestoredData = function(jsonStr) {
              try {
                var obj = JSON.parse(jsonStr);
                for (var key in obj) {
                  localStorage.setItem(key, obj[key]);
                }
                alert('डेटा १००% यशस्वीपणे पूर्ववत (Restore) झाला आहे!');
                location.reload();
              } catch(err) {
                alert('त्रुटी: फाईल वाचता आली नाही!');
              }
            };
          })();
          </script>
          """

          if "</body>" in raw_html.lower():
              idx = raw_html.lower().rfind("</body>")
              raw_html = raw_html[:idx] + patch_code + raw_html[idx:]
          else:
              raw_html += patch_code

          html_file.write_text(raw_html, encoding="utf-8")
          print("SUCCESS: Original Look Restored.")
          PY

      - name: Create Android project structure
        shell: bash
        run: |
          set -e
          rm -rf mbms_android release
          mkdir -p \
            mbms_android/app/src/main/assets \
            mbms_android/app/src/main/java/com/mbms/app \
            mbms_android/app/src/main/res/values \
            release

          cp mbms_work/index.html mbms_android/app/src/main/assets/index.html

          cat > mbms_android/settings.gradle <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal(); }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral(); }
          }
          rootProject.name = "MBMSAndroid"
          include(":app")
          EOF

          cat > mbms_android/build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.6.1' apply false }
          EOF

          cat > mbms_android/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat > mbms_android/app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.mbms.app'
              compileSdk 35
              defaultConfig {
                  applicationId 'com.mbms.app'
                  minSdk 24
                  targetSdk 35
                  versionCode 155
                  versionName 'V155'
              }
              buildTypes {
                  debug {
                      minifyEnabled false
                      shrinkResources false
                      debuggable true
                  }
                  release {
                      minifyEnabled false
                      shrinkResources false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat > mbms_android/app/src/main/res/values/strings.xml <<'EOF'
          <resources><string name="app_name">MBMS</string></resources>
          EOF

          cat > mbms_android/app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#1976D2</item>
                  <item name="android:navigationBarColor">#06458E</item>
              </style>
          </resources>
          EOF

          cat > mbms_android/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />

              <application
                  android:allowBackup="true"
                  android:usesCleartextTraffic="true"
                  android:label="@string/app_name"
                  android:theme="@style/AppTheme"
                  android:hardwareAccelerated="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

      - name: Generate MainActivity.java
        shell: bash
        run: |
          set -e
          cat > mbms_android/app/src/main/java/com/mbms/app/MainActivity.java <<'EOF'
          package com.mbms.app;

          import android.app.Activity;
          import android.content.ContentValues;
          import android.content.Context;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Environment;
          import android.print.PrintAttributes;
          import android.print.PrintDocumentAdapter;
          import android.print.PrintManager;
          import android.provider.MediaStore;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Toast;

          import java.io.BufferedReader;
          import java.io.InputStream;
          import java.io.InputStreamReader;
          import java.io.OutputStream;
          import java.nio.charset.StandardCharsets;
          import java.text.SimpleDateFormat;
          import java.util.Date;
          import java.util.Locale;

          public class MainActivity extends Activity {

              private WebView webView;
              private static final int PICK_BACKUP_FILE_REQ = 1001;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);
                  settings.setLoadWithOverviewMode(true);
                  settings.setUseWideViewPort(true);
                  settings.setTextZoom(100);

                  webView.setWebChromeClient(new WebChromeClient());

                  AndroidBridge bridge = new AndroidBridge();
                  webView.addJavascriptInterface(bridge, "MBMSAndroid");
                  webView.addJavascriptInterface(bridge, "AndroidBridge");

                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public void onPageFinished(WebView view, String url) {
                          super.onPageFinished(view, url);
                          webView.evaluateJavascript(
                              "window.print=function(){ if(window.MBMSAndroid) window.MBMSAndroid.print(); };",
                              null
                          );
                      }
                  });

                  webView.loadUrl("file:///android_asset/index.html");
              }

              public class AndroidBridge {

                  @JavascriptInterface
                  public void saveBackupToDownloads(String jsonString) {
                      runOnUiThread(() -> {
                          try {
                              String timeStamp = new SimpleDateFormat("yyyyMMdd_HHmmss", Locale.getDefault()).format(new Date());
                              String fileName = "MBMS_Backup_" + timeStamp + ".json";

                              OutputStream fos;
                              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                                  ContentValues resolver = new ContentValues();
                                  resolver.put(MediaStore.MediaColumns.DISPLAY_NAME, fileName);
                                  resolver.put(MediaStore.MediaColumns.MIME_TYPE, "application/json");
                                  resolver.put(MediaStore.MediaColumns.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS);
                                  Uri contentUri = getContentResolver().insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, resolver);
                                  fos = getContentResolver().openOutputStream(contentUri);
                              } else {
                                  java.io.File file = new java.io.File(Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS), fileName);
                                  fos = new java.io.FileOutputStream(file);
                              }

                              if (fos != null) {
                                  fos.write(jsonString.getBytes(StandardCharsets.UTF_8));
                                  fos.close();
                                  Toast.makeText(MainActivity.this, "बॅकअप Downloads मध्ये सेव्ह झाला!", Toast.LENGTH_LONG).show();
                              }
                          } catch (Exception e) {
                              Toast.makeText(MainActivity.this, "बॅकअप त्रुटी: " + e.getMessage(), Toast.LENGTH_SHORT).show();
                          }
                      });
                  }

                  @JavascriptInterface
                  public void openBackupPicker() {
                      runOnUiThread(() -> {
                          try {
                              Intent intent = new Intent(Intent.ACTION_GET_CONTENT);
                              intent.setType("*/*");
                              intent.addCategory(Intent.CATEGORY_OPENABLE);
                              startActivityForResult(Intent.createChooser(intent, "बॅकअप JSON निवडा"), PICK_BACKUP_FILE_REQ);
                          } catch (Exception e) {
                              Toast.makeText(MainActivity.this, "पिकर उघडता आले नाही.", Toast.LENGTH_SHORT).show();
                          }
                      });
                  }

                  @JavascriptInterface
                  public void print() {
                      runOnUiThread(() -> {
                          try {
                              PrintManager manager = (PrintManager) getSystemService(Context.PRINT_SERVICE);
                              if (manager != null && webView != null) {
                                  webView.postDelayed(() -> {
                                      try {
                                          PrintDocumentAdapter adapter = webView.createPrintDocumentAdapter("MBMS Report");
                                          PrintAttributes attributes = new PrintAttributes.Builder()
                                                  .setMediaSize(PrintAttributes.MediaSize.ISO_A4)
                                                  .setMinMargins(PrintAttributes.Margins.NO_MARGINS)
                                                  .build();
                                          manager.print("MBMS Report", adapter, attributes);
                                      } catch (Exception e) {
                                          Toast.makeText(MainActivity.this, "Print अयशस्वी!", Toast.LENGTH_SHORT).show();
                                      }
                                  }, 350);
                              }
                          } catch (Exception e) {
                              Toast.makeText(MainActivity.this, "Print अयशस्वी.", Toast.LENGTH_SHORT).show();
                          }
                      });
                  }
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);
                  if (requestCode == PICK_BACKUP_FILE_REQ && resultCode == RESULT_OK && data != null) {
                      Uri uri = data.getData();
                      if (uri != null) {
                          try {
                              InputStream is = getContentResolver().openInputStream(uri);
                              BufferedReader reader = new BufferedReader(new InputStreamReader(is, StandardCharsets.UTF_8));
                              StringBuilder sb = new StringBuilder();
                              String line;
                              while ((line = reader.readLine()) != null) {
                                  sb.append(line);
                              }
                              is.close();

                              String content = sb.toString();
                              String safe = android.util.Base64.encodeToString(content.getBytes(StandardCharsets.UTF_8), android.util.Base64.NO_WRAP);
                              webView.evaluateJavascript(
                                  "(function(){ var dec = decodeURIComponent(escape(atob('" + safe + "'))); window.applyRestoredData(dec); })();",
                                  null
                              );
                          } catch (Exception e) {
                              Toast.makeText(this, "फाईल वाचता आली नाही!", Toast.LENGTH_SHORT).show();
                          }
                      }
                  }
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }

              @Override
              protected void onDestroy() {
                  if (webView != null) {
                      webView.stopLoading();
                      webView.destroy();
                      webView = null;
                  }
                  super.onDestroy();
              }
          }
          EOF

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Assemble Final Debug APK
        working-directory: mbms_android
        shell: bash
        run: |
          set -e
          gradle --no-daemon clean :app:assembleDebug

          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          cp "$APK" "../release/MBMS-ORIGINAL-LOOK-V155.apk"
          ls -lh "../release/MBMS-ORIGINAL-LOOK-V155.apk"

      - name: Upload Final APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MBMS-ORIGINAL-LOOK-V155-APK
          path: release/MBMS-ORIGINAL-LOOK-V155.apk
          if-no-files-found: error
