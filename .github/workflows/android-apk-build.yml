name: MBMS V131 FINAL - COMPLETE HARDENED BUILD

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:

  build:
    name: Build Final MBMS APK
    runs-on: ubuntu-24.04

    steps:

      # ============================================================
      # 1. CHECKOUT REPOSITORY
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. SETUP JAVA 17
      # ============================================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # ============================================================
      # 3. SETUP ANDROID SDK
      # ============================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4


      # ============================================================
      # 4. INSTALL SDK PACKAGES
      # ============================================================
      - name: Install Android SDK 35
        shell: bash
        run: |
          set -e
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"


      # ============================================================
      # 5. SETUP GRADLE 8.7
      # ============================================================
      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'


      # ============================================================
      # 6. LOCATE BASE HTML
      # ============================================================
      - name: Find Base HTML File
        shell: bash
        run: |
          set -e
          HTML_FILE=""
          for f in \
            "Measurement_Book_Management_System_FINAL_V120_TRANSFER_REPORT_FINAL.html" \
            "Measurement_Book_Management_System_FINAL_V118_PRINT_BACKUP_ANDROID.html" \
            "Measurement_Book_Management_System_FINAL_V115_MB_HISTORY_ONLY_DATE-6.html" \
            "Measurement_Book_Management_System_FINAL_V115_MB_HISTORY_ONLY_DATE.html" \
            "Measurement_Book_Management_System_FINAL_V115.html" \
            "V115.html" \
            "index.html"
          do
            if [ -f "$f" ]; then
              HTML_FILE="$f"
              break
            fi
          done

          if [ -z "$HTML_FILE" ]; then
            HTML_FILE=$(find . -maxdepth 3 -type f -iname "*.html" -not -path "./.git/*" | head -n 1 || true)
          fi

          if [ -z "$HTML_FILE" ]; then
            echo "ERROR: HTML file not found."
            exit 1
          fi

          echo "HTML_FILE=$HTML_FILE" >> "$GITHUB_ENV"
          echo "Found HTML: $HTML_FILE"


      # ============================================================
      # 7. PREPARE DIRECTORY
      # ============================================================
      - name: Prepare Workspace
        shell: bash
        run: |
          set -e
          mkdir -p mbms_work
          cp "$HTML_FILE" mbms_work/index.html
          test -s mbms_work/index.html


      # ============================================================
      # 8. APPLY ALL FIXES (JE, MB, DATES, IN-PLACE UPDATE & PRINT)
      # ============================================================
      - name: Inject Master Logic and Fixes
        shell: bash
        run: |
          set -e
          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path("mbms_work/index.html")
          text = p.read_text(encoding="utf-8")

          # १. JE टॅबमधील वरचे केशरी Report बटण काढणे
          text = re.sub(r'<button[^>]*class="[^"]*report-btn[^"]*"[^>]*>\s*REPORT\s*</button>', '', text, flags=re.IGNORECASE)
          text = re.sub(r'<button[^>]*id="jeTopReportBtn"[^>]*>.*?</button>', '', text, flags=re.IGNORECASE)

          patch_code = """
          <!-- ======================================================= -->
          <!-- MASTER FIXES: JE, MB DATES, IN-PLACE UPDATE, A4 PRINT -->
          <!-- ======================================================= -->
          <style id="MASTER_CUSTOM_FIX_STYLES">
          /* सिंगल कॅलेंडर इनपुट बॉक्स */
          input[type="date"] {
            position: relative;
            padding: 8px 10px;
            font-size: 14px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            background: #fff;
            color: #1e293b;
            width: 100%;
            box-sizing: border-box;
          }
          input[type="date"]::-webkit-calendar-picker-indicator {
            cursor: pointer;
            filter: invert(0.3);
          }

          /* ऑफिस बार डिझाईन */
          .office-bar-container {
            background: #e0f2fe;
            border: 2px solid #0284c7;
            border-radius: 10px;
            padding: 10px;
            margin: 8px auto;
            max-width: 96%;
          }
          .office-bar-title {
            font-size: 13px;
            font-weight: bold;
            color: #0369a1;
            margin-bottom: 5px;
          }
          .office-select-row {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
          }
          .office-select-row select {
            flex: 1;
            min-width: 180px;
            padding: 6px;
            border-radius: 6px;
            border: 1px solid #0284c7;
            font-weight: bold;
          }
          .office-btn {
            padding: 6px 10px;
            border-radius: 6px;
            border: none;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
          }
          .btn-office-add { background: #0284c7; color: #fff; }
          .btn-office-del { background: #ef4444; color: #fff; }

          /* A4 प्रिंट दुरुस्ती */
          @media print {
            @page {
              size: A4 portrait;
              margin: 8mm 8mm 8mm 8mm !important;
            }
            body {
              font-family: 'Noto Sans Devanagari', 'Mukta', 'Arial', sans-serif !important;
              color: #000 !important;
              background: #fff !important;
              margin: 0 !important;
              padding: 0 !important;
              -webkit-print-color-adjust: exact !important;
              print-color-adjust: exact !important;
            }
            .no-print, .office-bar-container { display: none !important; }
            .report-header { text-align: center !important; margin: 0 0 6px 0 !important; }
            .report-header h2 { margin: 0 !important; font-size: 16px !important; font-weight: bold !important; }
            .report-header h3 { margin: 2px 0 !important; font-size: 14px !important; }
            .report-header h4 { margin: 2px 0 6px 0 !important; font-size: 13px !important; text-decoration: underline !important; }
            .report-meta {
              display: flex !important;
              justify-content: space-between !important;
              font-size: 11.5px !important;
              margin-bottom: 5px !important;
              border-bottom: 1.2px solid #000 !important;
              padding-bottom: 3px !important;
            }
            table.work-report-table, table.print-table {
              width: 100% !important;
              border-collapse: collapse !important;
              table-layout: fixed !important;
              margin-top: 4px !important;
            }
            table.work-report-table thead, table.print-table thead { display: table-header-group !important; }
            table.work-report-table tr, table.print-table tr { page-break-inside: avoid !important; }
            table.work-report-table th, table.work-report-table td,
            table.print-table th, table.print-table td {
              border: 1px solid #000 !important;
              padding: 4px 6px !important;
              font-size: 12px !important;
              line-height: 1.3 !important;
              word-wrap: break-word !important;
              vertical-align: middle !important;
            }
            table.work-report-table th, table.print-table th { background-color: #f0f0f0 !important; font-weight: bold !important; text-align: center !important; }
            
            /* अचूक ५ कॉलम रुंदी */
            .col-sr { width: 6% !important; text-align: center !important; }
            .col-work { width: 42% !important; text-align: left !important; }
            .col-contractor { width: 32% !important; text-align: left !important; }
            .col-je { width: 10% !important; text-align: left !important; }
            .col-mb { width: 10% !important; text-align: center !important; white-space: nowrap !important; }

            /* शेवटचे अतिरिक्त कॉलम लपवणे */
            table.work-report-table tr > th:nth-child(n+6),
            table.work-report-table tr > td:nth-child(n+6) { display: none !important; }

            .report-footer {
              position: fixed !important;
              bottom: 0 !important;
              left: 0 !important;
              right: 0 !important;
              text-align: center !important;
              font-size: 10px !important;
              border-top: 1px solid #777 !important;
              padding-top: 2px !important;
            }
          }
          </style>

          <script id="MASTER_CONTROL_SCRIPT">
          (function(){
            // तारीख फॉरमॅट dd-mm-yyyy मध्ये रूपांतरित करणे
            window.formatDateDMY = function(dateStr) {
              if(!dateStr) return '-';
              var d = new Date(dateStr);
              if(isNaN(d.getTime())) {
                var parts = String(dateStr).split('-');
                if(parts.length === 3 && parts[0].length === 4) return parts[2] + '-' + parts[1] + '-' + parts[0];
                return dateStr;
              }
              var day = String(d.getDate()).padStart(2, '0');
              var month = String(d.getMonth() + 1).padStart(2, '0');
              var year = d.getFullYear();
              return day + '-' + month + '-' + year;
            };

            // तारीख रकाने दुरुस्त करणे (dd-mm-yyyy)
            function enforceDateFormatInTables() {
              var rows = document.querySelectorAll('table tr');
              rows.forEach(function(row) {
                var cells = row.querySelectorAll('td');
                cells.forEach(function(cell) {
                  var val = cell.textContent.trim();
                  if (/^\\d{4}-\\d{2}-\\d{2}$/.test(val)) {
                    cell.textContent = window.formatDateDMY(val);
                  }
                });
              });
            }
            setInterval(enforceDateFormatInTables, 1500);

            // ==========================================
            // JE IN-PLACE UPDATE & DELETE & REPORT
            // ==========================================
            window.jeEditingIndex = -1;

            window.setupJEHandlers = function() {
              var jeTable = document.querySelector('.je-table, #jeTable, table');
              var jeInput = document.querySelector('input[placeholder*="Junior Engineer"], #jeNameInput');
              var jeAddBtn = document.querySelector('button[onclick*="addJE"], .btn-add-je, #addJEBtn');

              if(!jeInput || !jeTable) return;

              // इन-प्लेस डिलीट आणि अपडेट लिसनर
              jeTable.onclick = function(e) {
                var btn = e.target.closest('button');
                if(!btn) return;
                var text = btn.textContent.trim().toUpperCase();
                var tr = btn.closest('tr');
                if(!tr) return;
                var rowIndex = tr.rowIndex - 1; // excluding thead

                if(text.indexOf('UPDATE') !== -1 || text.indexOf('EDIT') !== -1) {
                  e.preventDefault();
                  var nameCell = tr.cells[1];
                  if(nameCell) {
                    jeInput.value = nameCell.textContent.trim();
                    window.jeEditingIndex = rowIndex;
                    if(jeAddBtn) {
                      jeAddBtn.textContent = 'UPDATE';
                      jeAddBtn.style.backgroundColor = '#0284c7';
                    }
                    jeInput.focus();
                  }
                } else if(text.indexOf('DELETE') !== -1) {
                  e.preventDefault();
                  if(confirm("ही JE नोंद कायमची हटवायची का?")) {
                    tr.remove();
                    // LocalStorage मधून काढून टाकणे
                    try {
                      var jes = JSON.parse(localStorage.getItem('mbms_jes') || '[]');
                      jes.splice(rowIndex, 1);
                      localStorage.setItem('mbms_jes', JSON.stringify(jes));
                    } catch(err){}
                  }
                }
              };

              if(jeAddBtn) {
                var origClick = jeAddBtn.onclick;
                jeAddBtn.onclick = function(ev) {
                  if(window.jeEditingIndex > -1) {
                    ev.preventDefault();
                    var tr = jeTable.querySelectorAll('tbody tr')[window.jeEditingIndex];
                    if(tr && tr.cells[1]) {
                      tr.cells[1].textContent = jeInput.value.trim();
                      try {
                        var jes = JSON.parse(localStorage.getItem('mbms_jes') || '[]');
                        if(jes[window.jeEditingIndex]) {
                          if(typeof jes[window.jeEditingIndex] === 'object') jes[window.jeEditingIndex].name = jeInput.value.trim();
                          else jes[window.jeEditingIndex] = jeInput.value.trim();
                          localStorage.setItem('mbms_jes', JSON.stringify(jes));
                        }
                      } catch(err){}
                    }
                    window.jeEditingIndex = -1;
                    jeInput.value = '';
                    jeAddBtn.textContent = 'ADD';
                    jeAddBtn.style.backgroundColor = '';
                    return;
                  }
                  if(origClick) origClick.call(this, ev);
                };
              }
            };

            // JE अहवाल (सर्व नोंदी अचूक दिसणे)
            window.printJEFullReport = function() {
              var pa = document.getElementById('printArea') || document.createElement('div');
              pa.id = 'printArea';
              document.body.appendChild(pa);

              var rows = document.querySelectorAll('#jeTable tbody tr, .je-table tbody tr');
              var list = [];
              rows.forEach(function(r) {
                if(r.cells.length >= 2) list.push(r.cells[1].textContent.trim());
              });

              if(list.length === 0) {
                try {
                  var stored = JSON.parse(localStorage.getItem('mbms_jes') || '[]');
                  stored.forEach(function(it) {
                    list.push(typeof it === 'object' ? (it.name || it.jeName) : it);
                  });
                } catch(e){}
              }

              var h = '<div class="report-header"><h2>सार्वजनिक बांधकाम विभाग</h2><h3>मोजमाप पुस्तिका नियंत्रण प्रणाली</h3><h4>JE REPORT</h4></div>';
              h += '<div class="report-meta"><span><b>Report :</b> सर्व Junior Engineer</span><span><b>दिनांक :</b> ' + new Date().toLocaleDateString('en-GB') + '</span></div>';
              h += '<table class="print-table"><thead><tr><th style="width:10%; text-align:center;">अ.क्र.</th><th style="width:90%; text-align:left;">Junior Engineer चे नाव</th></tr></thead><tbody>';
              if(list.length === 0) {
                h += '<tr><td colspan="2" style="text-align:center; padding:10px;">कोणतीही JE नोंद उपलब्ध नाही.</td></tr>';
              } else {
                for(var i=0; i<list.length; i++) {
                  h += '<tr><td style="text-align:center;">' + (i+1) + '</td><td>' + list[i] + '</td></tr>';
                }
              }
              h += '</tbody></table><div class="report-footer">© सर्व हक्क राखीव - सार्वजनिक बांधकाम विभाग</div>';
              pa.innerHTML = h;
              setTimeout(function(){ window.print(); }, 120);
            };

            // JE List मधील निळ्या Report बटणाला जोडणे
            document.addEventListener('click', function(e) {
              var t = e.target;
              if(t && t.tagName === 'BUTTON' && t.textContent.trim() === 'REPORT') {
                var parentCard = t.closest('.card, .tab-pane, div');
                if(parentCard && parentCard.textContent.indexOf('JE List') !== -1) {
                  e.preventDefault();
                  e.stopPropagation();
                  window.printJEFullReport();
                }
              }
            }, true);

            // ==========================================
            // BACK BUTTON NATIVE LISTENER (FOR ANDROID)
            // ==========================================
            window.handleAndroidBack = function() {
              // १. जर प्रिंट किंवा मोडल उघडे असेल तर आधी ते बंद करा
              var modal = document.querySelector('.modal.show, .dialog.open, [style*="display: block"]');
              if(modal && modal.id !== 'appRoot') {
                var closeBtn = modal.querySelector('.close, [data-dismiss="modal"], button:contains("Close")');
                if(closeBtn) { closeBtn.click(); return "HANDLED"; }
                modal.style.display = 'none';
                return "HANDLED";
              }
              // २. जर फॉर्म एडिट मोडमध्ये असेल तर रद्द करा
              if(window.jeEditingIndex > -1) {
                window.jeEditingIndex = -1;
                var jeInput = document.querySelector('input[placeholder*="Junior Engineer"], #jeNameInput');
                var jeAddBtn = document.querySelector('button[onclick*="addJE"], .btn-add-je, #addJEBtn');
                if(jeInput) jeInput.value = '';
                if(jeAddBtn) { jeAddBtn.textContent = 'ADD'; jeAddBtn.style.backgroundColor = ''; }
                return "HANDLED";
              }
              // ३. ॲपमध्ये बॅक जाण्यासाठी History गो बॅक
              if(window.history.length > 1) {
                window.history.back();
                return "HANDLED";
              }
              return "EXIT";
            };

            document.addEventListener('DOMContentLoaded', function(){
              setupJEHandlers();
            });
          })();
          </script>
          """

          if "</body>" in text.lower():
              pos = text.lower().rfind("</body>")
              text = text[:pos] + patch_code + text[pos:]
          else:
              text += patch_code

          p.write_text(text, encoding="utf-8")
          print("Patched: JE buttons, single calendar, date formats and back listeners injected.")
          PY


      # ============================================================
      # 9. CREATE ANDROID PROJECT
      # ============================================================
      - name: Create Android project structure
        shell: bash
        run: |
          set -e
          rm -rf mbms_android release
          mkdir -p \
            mbms_android/app/src/main/assets \
            mbms_android/app/src/main/java/com/mbms/app \
            mbms_android/app/src/main/res/values \
            release

          cp mbms_work/index.html mbms_android/app/src/main/assets/index.html

          cat > mbms_android/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "MBMSAndroid"
          include(":app")
          EOF

          cat > mbms_android/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF

          cat > mbms_android/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat > mbms_android/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.mbms.app'
              compileSdk 35
              defaultConfig {
                  applicationId 'com.mbms.app'
                  minSdk 26
                  targetSdk 35
                  versionCode 133
                  versionName 'V133'
              }
              buildTypes {
                  debug {
                      minifyEnabled false
                      shrinkResources false
                  }
                  release {
                      minifyEnabled false
                      shrinkResources false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat > mbms_android/app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">MBMS</string>
          </resources>
          EOF

          cat > mbms_android/app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#1976D2</item>
                  <item name="android:navigationBarColor">#06458E</item>
              </style>
          </resources>
          EOF

          cat > mbms_android/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />

              <application
                  android:allowBackup="true"
                  android:usesCleartextTraffic="true"
                  android:label="@string/app_name"
                  android:theme="@style/AppTheme"
                  android:hardwareAccelerated="true"
                  android:resizeableActivity="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF


      # ============================================================
      # 10. CREATE MAINACTIVITY.JAVA WITH HARDWARE BACK BUTTON
      # ============================================================
      - name: Create MainActivity.java
        shell: bash
        run: |
          set -e
          cat > mbms_android/app/src/main/java/com/mbms/app/MainActivity.java <<'EOF'
          package com.mbms.app;

          import android.app.Activity;
          import android.content.Context;
          import android.os.Bundle;
          import android.print.PrintAttributes;
          import android.print.PrintDocumentAdapter;
          import android.print.PrintManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.ValueCallback;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Toast;

          public class MainActivity extends Activity {

              private WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);
                  settings.setTextZoom(100);

                  AndroidBridge bridge = new AndroidBridge();
                  webView.addJavascriptInterface(bridge, "MBMSAndroid");
                  webView.addJavascriptInterface(bridge, "AndroidBridge");

                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public void onPageFinished(WebView view, String url) {
                          super.onPageFinished(view, url);
                          webView.evaluateJavascript(
                              "window.print=function(){ if(window.MBMSAndroid){ window.MBMSAndroid.print(); } };",
                              null
                          );
                      }
                  });

                  webView.loadUrl("file:///android_asset/index.html");
              }

              public class AndroidBridge {
                  @JavascriptInterface
                  public void print() {
                      runOnUiThread(new Runnable() {
                          @Override
                          public void run() {
                              try {
                                  PrintManager manager = (PrintManager) getSystemService(Context.PRINT_SERVICE);
                                  if (manager != null && webView != null) {
                                      webView.postDelayed(new Runnable() {
                                          @Override
                                          public void run() {
                                              try {
                                                  PrintDocumentAdapter adapter = webView.createPrintDocumentAdapter("MBMS Report");
                                                  PrintAttributes attributes = new PrintAttributes.Builder()
                                                          .setMediaSize(PrintAttributes.MediaSize.ISO_A4)
                                                          .setMinMargins(PrintAttributes.Margins.NO_MARGINS)
                                                          .build();
                                                  manager.print("MBMS Report", adapter, attributes);
                                              } catch (Exception e) {
                                                  Toast.makeText(MainActivity.this, "Print अयशस्वी झाले.", Toast.LENGTH_SHORT).show();
                                              }
                                          }
                                      }, 500);
                                  }
                              } catch (Exception e) {
                                  Toast.makeText(MainActivity.this, "Print सुरू करता आले नाही.", Toast.LENGTH_SHORT).show();
                              }
                          }
                      });
                  }
              }

              // मोबाईलचे हार्डवेअर बॅक बटन हाताळणे (Back Button Fix)
              @Override
              public void onBackPressed() {
                  if (webView != null) {
                      webView.evaluateJavascript(
                          "typeof window.handleAndroidBack === 'function' ? window.handleAndroidBack() : 'FALLBACK';",
                          new ValueCallback<String>() {
                              @Override
                              public void onReceiveValue(String value) {
                                  if ("\"HANDLED\"".equals(value)) {
                                      // बॅक ॲक्शन JavaScript ने यशस्वीपणे हाताळली (उदा. मोडल बंद केला किंवा मागे नेले)
                                      return;
                                  }
                                  if (webView.canGoBack()) {
                                      webView.goBack();
                                  } else {
                                      MainActivity.super.onBackPressed();
                                  }
                              }
                          }
                      );
                  } else {
                      super.onBackPressed();
                  }
              }

              @Override
              protected void onDestroy() {
                  if (webView != null) {
                      webView.stopLoading();
                      webView.destroy();
                      webView = null;
                  }
                  super.onDestroy();
              }
          }
          EOF


      # ============================================================
      # 11. BUILD APK
      # ============================================================
      - name: Build Multi-Office MBMS APK
        working-directory: mbms_android
        shell: bash
        run: |
          set -e
          gradle --no-daemon --stacktrace clean :app:assembleDebug

          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          cp "$APK" "../release/MBMS-V133-FULL-HARDENED.apk"
          ls -lh "../release/MBMS-V133-FULL-HARDENED.apk"


      # ============================================================
      # 12. UPLOAD APK ARTIFACT
      # ============================================================
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MBMS-V133-FULL-HARDENED-APK
          path: release/MBMS-V133-FULL-HARDENED.apk
          if-no-files-found: error
