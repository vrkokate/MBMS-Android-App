name: MBMS V118 Android APK - FINAL

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build MBMS V118 APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle 8.7
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip
          echo "$PWD/gradle-8.7/bin" >> "$GITHUB_PATH"
          gradle --version

      - name: Locate MBMS HTML
        shell: bash
        run: |
          set -e

          HTML_FILE=""

          for f in \
            "Measurement_Book_Management_System_FINAL_V115_MB_HISTORY_ONLY_DATE-6.html" \
            "Measurement_Book_Management_System_FINAL_V115.html" \
            "V115.html" \
            "index.html"
          do
            if [ -f "$f" ]; then
              HTML_FILE="$f"
              break
            fi
          done

          if [ -z "$HTML_FILE" ]; then
            HTML_FILE=$(find . -maxdepth 3 -type f -name "*.html" \
              ! -path "./app/*" \
              ! -path "./.git/*" | head -n 1)
          fi

          if [ -z "$HTML_FILE" ]; then
            echo "ERROR: MBMS HTML file not found."
            exit 1
          fi

          echo "Using HTML: $HTML_FILE"
          cp "$HTML_FILE" mbms_source.html

      - name: Validate MBMS HTML
        run: |
          test -s mbms_source.html
          echo "MBMS HTML OK"
          wc -c mbms_source.html

      - name: Create Android project
        shell: bash
        run: |
          set -e

          rm -rf mbms_android

          mkdir -p mbms_android/app/src/main/java/com/mbms/app
          mkdir -p mbms_android/app/src/main/assets
          mkdir -p mbms_android/app/src/main/res/drawable
          mkdir -p mbms_android/app/src/main/res/mipmap-hdpi
          mkdir -p mbms_android/app/src/main/res/mipmap-mdpi
          mkdir -p mbms_android/app/src/main/res/mipmap-xhdpi
          mkdir -p mbms_android/app/src/main/res/mipmap-xxhdpi
          mkdir -p mbms_android/app/src/main/res/mipmap-xxxhdpi

          cp mbms_source.html \
            mbms_android/app/src/main/assets/index.html

      - name: Apply Android Print and Backup bridge
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("mbms_android/app/src/main/assets/index.html")
          s = p.read_text(encoding="utf-8")

          # ---------------------------------------------------------
          # WORK REPORT HEADER FIX
          # ---------------------------------------------------------

          old_header = """<th>अ.क्र.</th>
          <th>कामाचे नाव</th>
          <th>कॉन्ट्रॅक्टर / एजन्सी</th>
          <th>JE चे नाव</th>
          <th>MB क्रमांक</th>"""

          new_header = """<th>अ.क्र.</th>
          <th>कामाचे नाव</th>
          <th>कॉन्ट्रॅक्टर / एजन्सी</th>
          <th>JE चे नाव</th>
          <th>MB क्रमांक</th>
          <th>काम पूर्ण?</th>
          <th>Bill प्रकार</th>
          <th>Bill रक्कम (₹)</th>"""

          if old_header in s:
              s = s.replace(old_header, new_header)

          # ---------------------------------------------------------
          # NATIVE BACKUP SAVE
          # ---------------------------------------------------------

          old_backup = """function downloadSettingsBackup(){
            const data=JSON.stringify(mbmsSettingsSnapshot(),null,2);
            const blob=new Blob([data],{type:"application/json"});
            const url=URL.createObjectURL(blob);
            const a=document.createElement("a");a.href=url;
            a.download="MBMS_Backup_"+new Date().toISOString().slice(0,10)+".json";
            document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);
          }"""

          new_backup = """function downloadSettingsBackup(){
            try{
              const data=JSON.stringify(mbmsSettingsSnapshot(),null,2);
              const filename="MBMS_Backup_"+new Date().toISOString().slice(0,10)+".json";

              if(window.MBMSAndroid &&
                 typeof window.MBMSAndroid.saveBackup==="function"){
                window.MBMSAndroid.saveBackup(data,filename);
                return;
              }

              const blob=new Blob([data],{type:"application/json"});
              const url=URL.createObjectURL(blob);
              const a=document.createElement("a");
              a.href=url;
              a.download=filename;
              document.body.appendChild(a);
              a.click();
              a.remove();
              setTimeout(function(){
                URL.revokeObjectURL(url);
              },1000);
            }catch(e){
              alert("Backup Save error: "+e);
            }
          }"""

          if old_backup in s:
              s = s.replace(old_backup, new_backup)

          # ---------------------------------------------------------
          # NATIVE RESTORE REQUEST
          # ---------------------------------------------------------

          marker = "window.mbmsNativeRestoreBase64"

          if marker not in s:
              inject = r"""
<script>
(function(){

window.mbmsNativeRestoreBase64=function(base64){

  try{

    var binary=atob(base64);
    var bytes=new Uint8Array(binary.length);

    for(var i=0;i<binary.length;i++){
      bytes[i]=binary.charCodeAt(i);
    }

    var text=new TextDecoder("utf-8").decode(bytes);

    if(typeof restoreSettingsBackupText==="function"){
      restoreSettingsBackupText(text,null);
      return;
    }

    var data=JSON.parse(text);

    if(!data || typeof data!=="object"){
      throw new Error("Invalid backup file");
    }

    if(typeof restoreSettingsBackup==="function"){
      alert("Backup restore data received. Please use the existing restore process.");
    }

  }catch(e){

    alert("Backup Restore error: "+e.message);

  }

};

window.startSettingsBackupRestore=function(){

  if(window.MBMSAndroid &&
     typeof window.MBMSAndroid.requestRestore==="function"){

    window.MBMSAndroid.requestRestore();
    return;
  }

  var input=document.getElementById("settingsBackupFile");

  if(input){
    input.click();
  }

};

})();
</script>
"""
              s += inject

          # ---------------------------------------------------------
          # PRINT OVERRIDE
          # ---------------------------------------------------------

          if "MBMSAndroid.print" not in s:
              s += r"""
<script>
(function(){

  var nativePrint=window.print;

  window.print=function(){

    try{

      if(window.MBMSAndroid &&
         typeof window.MBMSAndroid.print==="function"){

        window.MBMSAndroid.print();
        return;

      }

    }catch(e){}

    if(typeof nativePrint==="function"){
      nativePrint.call(window);
    }

  };

})();
</script>
"""

          # ---------------------------------------------------------
          # A4 TABLE FIX
          # ---------------------------------------------------------

          if ".work-report-table" not in s:

              s += r"""
<style>

.a4-table{
  width:100%;
  border-collapse:collapse;
  font-size:9.2pt;
  table-layout:fixed;
}

.a4-table th,
.a4-table td{
  padding:2.5mm 1.8mm;
  vertical-align:top;
  overflow-wrap:anywhere;
  word-break:normal;
  line-height:1.25;
}

.a4-table th{
  vertical-align:middle;
}

.work-report-table th:nth-child(1),
.work-report-table td:nth-child(1){
  width:8%;
}

.work-report-table th:nth-child(2),
.work-report-table td:nth-child(2){
  width:22%;
}

.work-report-table th:nth-child(3),
.work-report-table td:nth-child(3){
  width:16%;
}

.work-report-table th:nth-child(4),
.work-report-table td:nth-child(4){
  width:13%;
}

.work-report-table th:nth-child(5),
.work-report-table td:nth-child(5){
  width:11%;
}

.work-report-table th:nth-child(6),
.work-report-table td:nth-child(6){
  width:9%;
}

.work-report-table th:nth-child(7),
.work-report-table td:nth-child(7){
  width:10%;
}

.work-report-table th:nth-child(8),
.work-report-table td:nth-child(8){
  width:11%;
}

@page{
  size:A4 portrait;
  margin:10mm;
}

</style>
"""

          p.write_text(s,encoding="utf-8")
          print("Android bridge patch completed.")

      - name: Create Gradle settings
        working-directory: mbms_android
        run: |
          cat > settings.gradle <<'EOF'
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = "MBMS_V118"
include(":app")
EOF

      - name: Create root build.gradle
        working-directory: mbms_android
        run: |
          cat > build.gradle <<'EOF'
plugins {
    id 'com.android.application' version '8.6.1' apply false
}
EOF

      - name: Create gradle.properties
        working-directory: mbms_android
        run: |
          cat > gradle.properties <<'EOF'
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=false
android.enableJetifier=false
EOF

      - name: Create app build.gradle
        working-directory: mbms_android
        run: |
          cat > app/build.gradle <<'EOF'
plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mbms.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.mbms.app'
        minSdk 26
        targetSdk 35
        versionCode 118
        versionName '1.18'
    }

    buildTypes {
        debug {
            debuggable false
            minifyEnabled false
            shrinkResources false
        }

        release {
            minifyEnabled false
            shrinkResources false
        }
    }
}

EOF

      - name: Create Android icon
        shell: bash
        run: |
          set -e

          ICON=""

          for f in \
            "MBMS_V118_Icon_1024.png" \
            "MBMS_Icon.png" \
            "icon.png"
          do
            if [ -f "$f" ]; then
              ICON="$f"
              break
            fi
          done

          if [ -n "$ICON" ]; then
            echo "Using supplied icon: $ICON"

            cp "$ICON" mbms_android/app/src/main/res/drawable/mbms_icon.png

          else
            echo "No custom icon found."
            echo "Creating safe fallback icon."

            python3 - <<'PY'
          from PIL import Image, ImageDraw

          img = Image.new("RGBA",(1024,1024),(20,20,20,255))
          d = ImageDraw.Draw(img)

          d.rounded_rectangle(
              (80,80,944,944),
              radius=180,
              fill=(30,120,70,255)
          )

          d.text(
              (270,410),
              "MBMS",
              fill=(255,255,255,255)
          )

          img.save(
              "mbms_android/app/src/main/res/drawable/mbms_icon.png"
          )
          PY
          fi

      - name: Create AndroidManifest
        working-directory: mbms_android
        run: |
          cat > app/src/main/AndroidManifest.xml <<'EOF'
<?xml version="1.0" encoding="utf-8"?>

<manifest xmlns:android="http://schemas.android.com/apk/res/android">

    <uses-permission android:name="android.permission.INTERNET" />

    <application
        android:allowBackup="false"
        android:usesCleartextTraffic="true"
        android:label="मोजमाप पुस्तिका नियंत्रण प्रणाली"
        android:icon="@drawable/mbms_icon"
        android:roundIcon="@drawable/mbms_icon"
        android:supportsRtl="true"
        android:theme="@style/AppTheme">

        <activity
            android:name=".MainActivity"
            android:screenOrientation="portrait"
            android:exported="true">

            <intent-filter>
                <action android:name="android.intent.action.MAIN" />
                <category android:name="android.intent.category.LAUNCHER" />
            </intent-filter>

        </activity>

    </application>

</manifest>
EOF

      - name: Create styles
        working-directory: mbms_android
        run: |
          mkdir -p app/src/main/res/values

          cat > app/src/main/res/values/styles.xml <<'EOF'
<?xml version="1.0" encoding="utf-8"?>

<resources>

    <style name="AppTheme"
        parent="@android:style/Theme.Material.Light.NoActionBar">

        <item name="android:fontFamily">sans</item>
        <item name="android:colorAccent">#1565C0</item>
        <item name="android:navigationBarColor">#000000</item>
        <item name="android:statusBarColor">#000000</item>
        <item name="android:windowLightStatusBar">false</item>

    </style>

</resources>
EOF

      - name: Create MainActivity
        working-directory: mbms_android
        run: |
          cat > app/src/main/java/com/mbms/app/MainActivity.java <<'EOF'
package com.mbms.app;

import android.app.Activity;
import android.os.Bundle;
import android.os.Environment;
import android.print.PrintAttributes;
import android.print.PrintDocumentAdapter;
import android.print.PrintManager;
import android.content.Context;
import android.content.Intent;
import android.net.Uri;
import android.provider.Settings;
import android.webkit.JavascriptInterface;
import android.webkit.ValueCallback;
import android.webkit.WebChromeClient;
import android.webkit.WebResourceRequest;
import android.webkit.WebView;
import android.webkit.WebViewClient;
import android.widget.Toast;

import java.io.ByteArrayOutputStream;
import java.io.File;
import java.io.FileOutputStream;
import java.io.InputStream;
import java.io.OutputStream;

import android.util.Base64;

public class MainActivity extends Activity {

    private WebView webView;

    private static final int RESTORE_REQUEST = 7001;

    @Override
    protected void onCreate(Bundle savedInstanceState) {
        super.onCreate(savedInstanceState);

        webView = new WebView(this);

        webView.getSettings().setJavaScriptEnabled(true);
        webView.getSettings().setDomStorageEnabled(true);
        webView.getSettings().setAllowFileAccess(true);
        webView.getSettings().setAllowContentAccess(true);
        webView.getSettings().setBuiltInZoomControls(false);
        webView.getSettings().setDisplayZoomControls(false);

        webView.setWebViewClient(new WebViewClient() {

            @Override
            public boolean shouldOverrideUrlLoading(
                    WebView view,
                    WebResourceRequest request) {

                return false;
            }

        });

        webView.setWebChromeClient(new WebChromeClient() {

            @Override
            public boolean onShowFileChooser(
                    WebView webView,
                    ValueCallback<Uri[]> filePathCallback,
                    FileChooserParams fileChooserParams) {

                return false;
            }

        });

        webView.addJavascriptInterface(
                new AndroidBridge(),
                "MBMSAndroid"
        );

        webView.loadUrl("file:///android_asset/index.html");

        setContentView(webView);
    }

    public class AndroidBridge {

        @JavascriptInterface
        public void print() {

            runOnUiThread(() -> {

                try {

                    PrintManager printManager =
                            (PrintManager) getSystemService(
                                    Context.PRINT_SERVICE
                            );

                    PrintDocumentAdapter adapter =
                            webView.createPrintDocumentAdapter(
                                    "MBMS Report"
                            );

                    PrintAttributes attributes =
                            new PrintAttributes.Builder()
                                    .setMediaSize(
                                            PrintAttributes.MediaSize.ISO_A4
                                    )
                                    .setMinMargins(
                                            PrintAttributes.Margins.NO_MARGINS
                                    )
                                    .build();

                    printManager.print(
                            "MBMS Report",
                            adapter,
                            attributes
                    );

                } catch (Exception e) {

                    Toast.makeText(
                            MainActivity.this,
                            "Print error: " + e.getMessage(),
                            Toast.LENGTH_LONG
                    ).show();

                }

            });
        }

        @JavascriptInterface
        public void saveBackup(
                String json,
                String filename) {

            try {

                if (filename == null ||
                        filename.trim().length() == 0) {

                    filename = "MBMS_Backup.json";
                }

                filename = filename.replaceAll(
                        "[^a-zA-Z0-9._-]",
                        "_"
                );

                if (android.os.Build.VERSION.SDK_INT >= 29) {

                    android.content.ContentValues values =
                            new android.content.ContentValues();

                    values.put(
                            android.provider.MediaStore.Downloads.DISPLAY_NAME,
                            filename
                    );

                    values.put(
                            android.provider.MediaStore.Downloads.MIME_TYPE,
                            "application/json"
                    );

                    values.put(
                            android.provider.MediaStore.Downloads.IS_PENDING,
                            1
                    );

                    Uri uri = getContentResolver().insert(
                            android.provider.MediaStore.Downloads.EXTERNAL_CONTENT_URI,
                            values
                    );

                    if (uri == null) {
                        throw new Exception(
                                "Cannot create Downloads file"
                        );
                    }

                    try (OutputStream out =
                                 getContentResolver()
                                         .openOutputStream(uri)) {

                        if (out == null) {
                            throw new Exception(
                                    "Cannot open output stream"
                            );
                        }

                        out.write(
                                json.getBytes(
                                        java.nio.charset.StandardCharsets.UTF_8
                                )
                        );

                    }

                    values.clear();

                    values.put(
                            android.provider.MediaStore.Downloads.IS_PENDING,
                            0
                    );

                    getContentResolver().update(
                            uri,
                            values,
                            null,
                            null
                    );

                } else {

                    File downloads =
                            Environment.getExternalStoragePublicDirectory(
                                    Environment.DIRECTORY_DOWNLOADS
                            );

                    if (!downloads.exists()) {
                        downloads.mkdirs();
                    }

                    File file =
                            new File(downloads, filename);

                    try (FileOutputStream out =
                                 new FileOutputStream(file)) {

                        out.write(
                                json.getBytes(
                                        java.nio.charset.StandardCharsets.UTF_8
                                )
                        );
                    }
                }

                runOnUiThread(() ->
                        Toast.makeText(
                                MainActivity.this,
                                "Backup Downloads मध्ये Save झाला.",
                                Toast.LENGTH_LONG
                        ).show()
                );

            } catch (Exception e) {

                runOnUiThread(() ->
                        Toast.makeText(
                                MainActivity.this,
                                "Backup Save error: "
                                        + e.getMessage(),
                                Toast.LENGTH_LONG
                        ).show()
                );
            }
        }

        @JavascriptInterface
        public void requestRestore() {

            runOnUiThread(() -> {

                try {

                    Intent intent =
                            new Intent(Intent.ACTION_OPEN_DOCUMENT);

                    intent.addCategory(
                            Intent.CATEGORY_OPENABLE
                    );

                    intent.setType(
                            "application/json"
                    );

                    startActivityForResult(
                            intent,
                            RESTORE_REQUEST
                    );

                } catch (Exception e) {

                    Toast.makeText(
                            MainActivity.this,
                            "Restore file picker error",
                            Toast.LENGTH_LONG
                    ).show();

                }

            });
        }
    }

    @Override
    protected void onActivityResult(
            int requestCode,
            int resultCode,
            Intent data) {

        super.onActivityResult(
                requestCode,
                resultCode,
                data
        );

        if (requestCode != RESTORE_REQUEST ||
                resultCode != RESULT_OK ||
                data == null ||
                data.getData() == null) {

            return;
        }

        Uri uri = data.getData();

        try {

            InputStream input =
                    getContentResolver()
                            .openInputStream(uri);

            if (input == null) {
                throw new Exception(
                        "Cannot read selected file"
                );
            }

            ByteArrayOutputStream output =
                    new ByteArrayOutputStream();

            byte[] buffer = new byte[8192];

            int n;

            while ((n = input.read(buffer)) != -1) {
                output.write(buffer, 0, n);
            }

            input.close();

            String json =
                    output.toString("UTF-8");

            String base64 =
                    Base64.encodeToString(
                            json.getBytes("UTF-8"),
                            Base64.NO_WRAP
                    );

            String escaped =
                    base64.replace(
                            "\\",
                            "\\\\"
                    ).replace(
                            "'",
                            "\\'"
                    );

            runOnUiThread(() -> {

                webView.evaluateJavascript(
                        "if(window.mbmsNativeRestoreBase64)" +
                        "{window.mbmsNativeRestoreBase64('" +
                        escaped +
                        "');}",
                        null
                );

            });

        } catch (Exception e) {

            Toast.makeText(
                    this,
                    "Backup Restore error: "
                            + e.getMessage(),
                    Toast.LENGTH_LONG
            ).show();
        }
    }

    @Override
    public void onBackPressed() {

        if (webView != null &&
                webView.canGoBack()) {

            webView.goBack();

        } else {

            super.onBackPressed();
        }
    }
}
EOF

      - name: Validate Android source
        working-directory: mbms_android
        run: |
          test -s app/src/main/java/com/mbms/app/MainActivity.java
          test -s app/src/main/AndroidManifest.xml
          test -s app/src/main/assets/index.html

          echo "Android source validation OK"

      - name: Create Gradle Wrapper
        working-directory: mbms_android
        run: |
          gradle wrapper --gradle-version 8.7

      - name: Clean Gradle
        working-directory: mbms_android
        run: |
          ./gradlew clean --no-daemon

      - name: Build MBMS V118 APK
        working-directory: mbms_android
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        working-directory: mbms_android
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"
          test -s "$APK"

          echo "APK created successfully"
          ls -lh "$APK"

      - name: Prepare APK
        shell: bash
        run: |
          mkdir -p output

          cp mbms_android/app/build/outputs/apk/debug/app-debug.apk \
             output/MBMS-V118-Android.apk

          sha256sum output/MBMS-V118-Android.apk \
             > output/SHA256.txt

      - name: Upload MBMS V118 APK
        uses: actions/upload-artifact@v4
        with:
          name: MBMS-V118-Android-APK
          path: output/
          if-no-files-found: error
