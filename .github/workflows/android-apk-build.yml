name: MBMS Android APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Verified MBMS Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate and Prepare HTML
        shell: bash
        run: |
          set -e
          mkdir -p mbms_work

          for z in *.zip; do
            if [ -f "$z" ]; then
              echo "Unpacking zip: $z"
              unzip -q -o "$z" -d extracted_zip || true
            fi
          done

          TARGET_HTML=$(find . -type f -iname "*.html" -not -path "./.git/*" -not -path "./mbms_work/*" -exec ls -S {} + | head -n 1)

          if [ -z "$TARGET_HTML" ]; then
            echo "ERROR: No HTML file found in repository."
            exit 1
          fi

          echo "Target HTML detected: $TARGET_HTML"
          cp "$TARGET_HTML" mbms_work/index.html
          test -s mbms_work/index.html

      - name: Inject Exactly Requested 2 Fixes (MB Dynamic Filter & DD-MM-YYYY Date)
        shell: bash
        run: |
          set -e
          python3 <<'PY'
          from pathlib import Path

          html_file = Path("mbms_work/index.html")
          raw_html = html_file.read_text(encoding="utf-8")

          patch_code = """
          <!-- ==================== EXACT 2 FIXES ENGINE ==================== -->
          <style id="MBMS_EXACT_STYLES">
          @media print {
            @page { size: A4 portrait; margin: 8mm !important; }
            body { background: #fff !important; color: #000 !important; }
            body > *:not(#printArea) { display: none !important; }
            #printArea { display: block !important; width: 100% !important; }
            table.print-table { width: 100% !important; border-collapse: collapse !important; }
            table.print-table th, table.print-table td { border: 1px solid #000 !important; padding: 5px !important; font-size: 11px !important; }
            table.print-table th { background: #eee !important; font-weight: bold !important; }
          }
          </style>

          <div id="printArea" style="display: none;"></div>

          <script id="MBMS_EXACT_CONTROLLER">
          (function() {
            // १. बदल क्र. २: M.B. List मधील दिनांक dd-mm-yyyy फॉरमॅटमध्ये करणे
            function fixTableDateFormat() {
              document.querySelectorAll('table tr td, [class*="table"] tr td').forEach(function(td) {
                var txt = td.textContent.trim();
                // yyyy-mm-dd तपासणे (उदा. 2026-09-19)
                var dateMatch = txt.match(/^(\\d{4})[-/](\\d{2})[-/](\\d{2})$/);
                if (dateMatch) {
                  td.textContent = dateMatch[3] + '-' + dateMatch[2] + '-' + dateMatch[1];
                }
              });
            }
            setInterval(fixTableDateFormat, 300);

            // २. बदल क्र. १: M.B. निवडल्यानंतर खाली नवीन ऑप्शन तयार करणे (सर्व, लहान, मोठी)
            function initMBDropdownFix() {
              var selects = Array.from(document.querySelectorAll('select'));
              var mbSelect = selects.find(function(s) {
                return (s.options[s.selectedIndex]?.text || s.value || '').trim().toUpperCase() === 'M.B.';
              });

              if (mbSelect && !document.getElementById('injectedMBTypeContainer')) {
                var container = document.createElement('div');
                container.id = 'injectedMBTypeContainer';
                container.style.cssText = 'margin-top: 10px; margin-bottom: 10px; width: 100%;';
                
                var newSelect = document.createElement('select');
                newSelect.id = 'injectedMBTypeSelect';
                newSelect.className = mbSelect.className;
                newSelect.style.cssText = 'width: 100%; height: 40px; border-radius: 8px; border: 1px solid #cfd8dc; padding: 0 10px; font-size: 13px; background: #fff;';
                
                newSelect.innerHTML = '<option value="सर्व M.B.">सर्व M.B.</option>' +
                                      '<option value="लहान M.B.">लहान M.B.</option>' +
                                      '<option value="मोठी M.B.">मोठी M.B.</option>';
                
                container.appendChild(newSelect);
                mbSelect.parentElement.insertAdjacentElement('afterend', container);

                // M.B. बदलल्यावर दिसणे/लपवणे
                mbSelect.addEventListener('change', function() {
                  var v = (this.options[this.selectedIndex]?.text || this.value || '').trim().toUpperCase();
                  container.style.display = (v === 'M.B.') ? 'block' : 'none';
                });
              }
            }
            setInterval(initMBDropdownFix, 400);

            // ३. अहवाल जनरेशन (नवीन पर्यायानुसार)
            document.addEventListener('click', function(e) {
              var btn = e.target.closest('button, a');
              if (!btn) return;
              var t = (btn.textContent || btn.value || '').trim().toUpperCase();

              if (t.includes('REPORT') || t.includes('PRINT')) {
                var dynamicSelect = document.getElementById('injectedMBTypeSelect');
                var filterType = dynamicSelect ? dynamicSelect.value : 'सर्व M.B.';

                // जर M.B. चे रिपोर्ट बटण असेल तर त्यानुसार फिल्टर करणे
                var mbList = [];
                try {
                  mbList = JSON.parse(localStorage.getItem('mb_records')) || [];
                } catch(err) { mbList = []; }

                var filtered = mbList.filter(function(item) {
                  var s = (item.size || item.mbSize || item.type || '').trim().toLowerCase();
                  if (filterType === 'लहान M.B.') return s.includes('लहान') || s.includes('small');
                  if (filterType === 'मोठी M.B.') return s.includes('मोठी') || s.includes('large');
                  return true;
                });

                var pa = document.getElementById('printArea');
                if (pa) {
                  e.preventDefault();
                  e.stopPropagation();

                  var h = '<div style="text-align: center; margin-bottom: 8px;">';
                  h += '  <h2 style="margin: 0; font-size: 17px; font-weight: bold;">सार्वजनिक बांधकाम विभाग</h2>';
                  h += '  <h3 style="margin: 3px 0 6px 0; font-size: 14px; text-decoration: underline;">मोजमाप पुस्तिका अहवाल</h3>';
                  h += '</div>';
                  h += '<div style="display: flex; justify-content: space-between; font-size: 11.5px; margin-bottom: 4px;">';
                  h += '  <span><b>निवड:</b> ' + filterType + '</span>';
                  h += '  <span><b>दिनांक:</b> ' + new Date().toLocaleDateString('en-GB') + '</span>';
                  h += '</div>';
                  h += '<table class="print-table">';
                  h += '  <thead><tr>';
                  h += '    <th style="width: 1%; white-space: nowrap; text-align: center;">अ.क्र.</th>';
                  h += '    <th style="width: 1%; white-space: nowrap; text-align: center;">M.B. क्रमांक</th>';
                  h += '    <th style="width: 1%; white-space: nowrap; text-align: center;">M.B. साईज</th>';
                  h += '    <th style="text-align: left;">सध्या कोणाकडे आहे (JE चे नाव)</th>';
                  h += '  </tr></thead><tbody>';

                  if (filtered.length === 0) {
                    h += '<tr><td colspan="4" style="text-align: center; padding: 10px;">नोंद उपलब्ध नाही.</td></tr>';
                  } else {
                    for (var i = 0; i < filtered.length; i++) {
                      var r = filtered[i];
                      h += '<tr>';
                      h += '  <td style="text-align: center;">' + (i + 1) + '</td>';
                      h += '  <td style="text-align: center;">' + (r.mbNumber || r.mbNo || "-") + '</td>';
                      h += '  <td style="text-align: center;">' + (r.size || r.mbSize || "लहान") + '</td>';
                      h += '  <td style="text-align: left;">' + (r.assignedTo || r.jeName || "स्टॉकमध्ये उपलब्ध") + '</td>';
                      h += '</tr>';
                    }
                  }
                  h += '</tbody></table>';

                  pa.innerHTML = h;
                  pa.style.display = 'block';
                  setTimeout(function() {
                    window.print();
                    setTimeout(function() { pa.style.display = 'none'; }, 500);
                  }, 150);
                }
              }
            }, true);
          })();
          </script>
          """

          if "</body>" in raw_html.lower():
              idx = raw_html.lower().rfind("</body>")
              raw_html = raw_html[:idx] + patch_code + raw_html[idx:]
          else:
              raw_html += patch_code

          html_file.write_text(raw_html, encoding="utf-8")
          print("SUCCESS: 2 Fixes Injected.")
          PY

      - name: Create Android project structure
        shell: bash
        run: |
          set -e
          rm -rf mbms_android release
          mkdir -p \
            mbms_android/app/src/main/assets \
            mbms_android/app/src/main/java/com/mbms/app \
            mbms_android/app/src/main/res/values \
            release

          cp mbms_work/index.html mbms_android/app/src/main/assets/index.html

          cat > mbms_android/settings.gradle <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal(); }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral(); }
          }
          rootProject.name = "MBMSAndroid"
          include(":app")
          EOF

          cat > mbms_android/build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.6.1' apply false }
          EOF

          cat > mbms_android/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat > mbms_android/app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.mbms.app'
              compileSdk 35
              defaultConfig {
                  applicationId 'com.mbms.app'
                  minSdk 26
                  targetSdk 35
                  versionCode 144
                  versionName 'V144'
              }
              buildTypes {
                  debug { minifyEnabled false; shrinkResources false }
                  release { minifyEnabled false; shrinkResources false }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat > mbms_android/app/src/main/res/values/strings.xml <<'EOF'
          <resources><string name="app_name">MBMS</string></resources>
          EOF

          cat > mbms_android/app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#1976D2</item>
                  <item name="android:navigationBarColor">#06458E</item>
              </style>
          </resources>
          EOF

          cat > mbms_android/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />

              <application
                  android:allowBackup="true"
                  android:usesCleartextTraffic="true"
                  android:label="@string/app_name"
                  android:theme="@style/AppTheme"
                  android:hardwareAccelerated="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

      - name: Generate MainActivity.java with Working Backup and Restore
        shell: bash
        run: |
          set -e
          cat > mbms_android/app/src/main/java/com/mbms/app/MainActivity.java <<'EOF'
          package com.mbms.app;

          import android.app.Activity;
          import android.content.ContentValues;
          import android.content.Context;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Environment;
          import android.print.PrintAttributes;
          import android.print.PrintDocumentAdapter;
          import android.print.PrintManager;
          import android.provider.MediaStore;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Toast;

          import java.io.BufferedReader;
          import java.io.InputStream;
          import java.io.InputStreamReader;
          import java.io.OutputStream;
          import java.nio.charset.StandardCharsets;
          import java.text.SimpleDateFormat;
          import java.util.Date;
          import java.util.Locale;

          public class MainActivity extends Activity {

              private WebView webView;
              private static final int PICK_BACKUP_FILE_REQ = 1001;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);
                  settings.setTextZoom(100);

                  webView.setWebChromeClient(new WebChromeClient());

                  AndroidBridge bridge = new AndroidBridge();
                  webView.addJavascriptInterface(bridge, "MBMSAndroid");
                  webView.addJavascriptInterface(bridge, "AndroidBridge");

                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public void onPageFinished(WebView view, String url) {
                          super.onPageFinished(view, url);
                          webView.evaluateJavascript(
                              "window.print=function(){ if(window.MBMSAndroid) window.MBMSAndroid.print(); };",
                              null
                          );
                      }
                  });

                  webView.loadUrl("file:///android_asset/index.html");
              }

              public class AndroidBridge {

                  @JavascriptInterface
                  public void saveBackupToDownloads(String jsonString) {
                      runOnUiThread(() -> {
                          try {
                              String timeStamp = new SimpleDateFormat("yyyyMMdd_HHmmss", Locale.getDefault()).format(new Date());
                              String fileName = "MBMS_Backup_" + timeStamp + ".json";

                              OutputStream fos;
                              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                                  ContentValues resolver = new ContentValues();
                                  resolver.put(MediaStore.MediaColumns.DISPLAY_NAME, fileName);
                                  resolver.put(MediaStore.MediaColumns.MIME_TYPE, "application/json");
                                  resolver.put(MediaStore.MediaColumns.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS);
                                  Uri contentUri = getContentResolver().insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, resolver);
                                  fos = getContentResolver().openOutputStream(contentUri);
                              } else {
                                  java.io.File file = new java.io.File(Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS), fileName);
                                  fos = new java.io.FileOutputStream(file);
                              }

                              if (fos != null) {
                                  fos.write(jsonString.getBytes(StandardCharsets.UTF_8));
                                  fos.close();
                                  Toast.makeText(MainActivity.this, "बॅकअप Downloads फोल्डरमध्ये सेव्ह झाला: " + fileName, Toast.LENGTH_LONG).show();
                              }
                          } catch (Exception e) {
                              Toast.makeText(MainActivity.this, "बॅकअप अयशस्वी: " + e.getMessage(), Toast.LENGTH_SHORT).show();
                          }
                      });
                  }

                  @JavascriptInterface
                  public void openBackupPicker() {
                      runOnUiThread(() -> {
                          try {
                              Intent intent = new Intent(Intent.ACTION_GET_CONTENT);
                              intent.setType("*/*");
                              intent.addCategory(Intent.CATEGORY_OPENABLE);
                              startActivityForResult(Intent.createChooser(intent, "बॅकअप JSON फाईल निवडा"), PICK_BACKUP_FILE_REQ);
                          } catch (Exception e) {
                              Toast.makeText(MainActivity.this, "फाईल पिकर उघडता आले नाही.", Toast.LENGTH_SHORT).show();
                          }
                      });
                  }

                  @JavascriptInterface
                  public void print() {
                      runOnUiThread(() -> {
                          try {
                              PrintManager manager = (PrintManager) getSystemService(Context.PRINT_SERVICE);
                              if (manager != null && webView != null) {
                                  webView.postDelayed(() -> {
                                      try {
                                          PrintDocumentAdapter adapter = webView.createPrintDocumentAdapter("MBMS Report");
                                          PrintAttributes attributes = new PrintAttributes.Builder()
                                                  .setMediaSize(PrintAttributes.MediaSize.ISO_A4)
                                                  .setMinMargins(PrintAttributes.Margins.NO_MARGINS)
                                                  .build();
                                          manager.print("MBMS Report", adapter, attributes);
                                      } catch (Exception e) {
                                          Toast.makeText(MainActivity.this, "Print अयशस्वी!", Toast.LENGTH_SHORT).show();
                                      }
                                  }, 350);
                              }
                          } catch (Exception e) {
                              Toast.makeText(MainActivity.this, "Print अयशस्वी.", Toast.LENGTH_SHORT).show();
                          }
                      });
                  }
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);
                  if (requestCode == PICK_BACKUP_FILE_REQ && resultCode == RESULT_OK && data != null) {
                      Uri uri = data.getData();
                      if (uri != null) {
                          try {
                              InputStream is = getContentResolver().openInputStream(uri);
                              BufferedReader reader = new BufferedReader(new InputStreamReader(is, StandardCharsets.UTF_8));
                              StringBuilder sb = new StringBuilder();
                              String line;
                              while ((line = reader.readLine()) != null) {
                                  sb.append(line);
                              }
                              is.close();

                              String content = sb.toString();
                              String safeContent = android.util.Base64.encodeToString(content.getBytes(StandardCharsets.UTF_8), android.util.Base64.NO_WRAP);

                              webView.evaluateJavascript(
                                  "(function(){ var decoded = decodeURIComponent(escape(atob('" + safeContent + "'))); window.applyRestoredData(decoded); })();",
                                  null
                              );
                          } catch (Exception e) {
                              Toast.makeText(this, "फाईल वाचता आली नाही: " + e.getMessage(), Toast.LENGTH_SHORT).show();
                          }
                      }
                  }
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }

              @Override
              protected void onDestroy() {
                  if (webView != null) {
                      webView.stopLoading();
                      webView.destroy();
                      webView = null;
                  }
                  super.onDestroy();
              }
          }
          EOF

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Assemble Final Debug APK
        working-directory: mbms_android
        shell: bash
        run: |
          set -e
          gradle --no-daemon --stacktrace clean :app:assembleDebug

          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          cp "$APK" "../release/MBMS-V144-EXACT-2-FIXES.apk"
          ls -lh "../release/MBMS-V144-EXACT-2-FIXES.apk"

      - name: Upload Final APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MBMS-V144-EXACT-2-FIXES-APK
          path: release/MBMS-V144-EXACT-2-FIXES.apk
          if-no-files-found: error
