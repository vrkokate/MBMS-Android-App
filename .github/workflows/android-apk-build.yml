name: MBMS APK - Received JE Full List Final

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:

  build:
    name: Build Final MBMS APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'


      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      - name: Install Android SDK 35
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"


      - name: Install Gradle 8.7
        shell: bash
        run: |
          set -e

          wget -q \
            https://services.gradle.org/distributions/gradle-8.7-bin.zip

          mkdir -p "$HOME/gradle"

          unzip -q \
            gradle-8.7-bin.zip \
            -d "$HOME/gradle"

          echo "$HOME/gradle/gradle-8.7/bin" >> "$GITHUB_PATH"

          "$HOME/gradle/gradle-8.7/bin/gradle" --version


      - name: Verify Java and Gradle
        shell: bash
        run: |
          set -e

          java -version
          gradle --version


      - name: Find MBMS HTML
        shell: bash
        run: |
          set -e

          HTML_FILE=""

          for f in \
            "Measurement_Book_Management_System_FINAL_V121_RECEIVED_JE_FULL_LIST_FINAL.html" \
            "Measurement_Book_Management_System_FINAL_V120_TRANSFER_REPORT_FINAL.html" \
            "Measurement_Book_Management_System_FINAL_V118_PRINT_BACKUP_ANDROID.html" \
            "Measurement_Book_Management_System_FINAL_V115_MB_HISTORY_ONLY_DATE-6.html" \
            "Measurement_Book_Management_System_FINAL_V115_MB_HISTORY_ONLY_DATE.html" \
            "Measurement_Book_Management_System_FINAL_V115.html" \
            "V115.html" \
            "index.html"
          do
            if [ -f "$f" ]; then
              HTML_FILE="$f"
              break
            fi
          done

          if [ -z "$HTML_FILE" ]; then
            HTML_FILE=$(find . \
              -maxdepth 3 \
              -type f \
              -iname "*.html" \
              -not -path "./.git/*" \
              | head -n 1 || true)
          fi

          if [ -z "$HTML_FILE" ]; then
            echo "ERROR: MBMS HTML file not found."
            exit 1
          fi

          echo "HTML_FILE=$HTML_FILE" >> "$GITHUB_ENV"

          echo "Using HTML:"
          echo "$HTML_FILE"


      - name: Prepare Final MBMS HTML
        shell: bash
        run: |
          set -e

          mkdir -p mbms_work

          cp \
            "$HTML_FILE" \
            mbms_work/index.html

          test -s mbms_work/index.html

          echo "HTML size:"
          wc -c mbms_work/index.html


      - name: Apply ONLY Received JE List Correction
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path

          p = Path("mbms_work/index.html")

          text = p.read_text(encoding="utf-8")

          # ---------------------------------------------------------
          # ONLY REQUESTED CORRECTION
          #
          # RECEIVED -> JE -> JE Name
          #
          # Existing code was disabling the JE dropdown:
          #
          # if(isJE){loadTransferJEs();if(je){
          #     je.value=sourceName;
          #     je.disabled=true;
          # }}
          #
          # Now the complete JE list remains selectable.
          # ---------------------------------------------------------

          old1 = (
              "if(isJE){loadTransferJEs();"
              "if(je){je.value=sourceName;je.disabled=true;}}"
          )

          new1 = (
              "if(isJE){loadTransferJEs();"
              "if(je){je.value=sourceName;je.disabled=false;}}"
          )

          if old1 in text:

              text = text.replace(
                  old1,
                  new1,
                  1
              )

              print(
                  "Correction 1 applied: "
                  "Received JE dropdown remains enabled."
              )

          # ---------------------------------------------------------
          # Second safety correction:
          # updateTransferMode() also disabled the JE dropdown.
          # ---------------------------------------------------------

          old2 = "if(isJE&&je)je.disabled=true;"

          new2 = "if(isJE&&je)je.disabled=false;"

          if old2 in text:

              text = text.replace(
                  old2,
                  new2,
                  1
              )

              print(
                  "Correction 2 applied: "
                  "Received JE dropdown remains enabled."
              )

          # ---------------------------------------------------------
          # DO NOT modify any other functionality.
          # ---------------------------------------------------------

          p.write_text(
              text,
              encoding="utf-8"
          )

          print("ONLY JE LIST CORRECTION COMPLETED.")
          print("Final HTML size:")
          print(p.stat().st_size)

          PY


      - name: Verify Requested Correction
        shell: bash
        run: |
          set -e

          HTML="mbms_work/index.html"

          test -s "$HTML"

          grep -q \
            "loadTransferJEs()" \
            "$HTML"

          grep -q \
            "transferFromJEName" \
            "$HTML"

          grep -q \
            "je.disabled=false" \
            "$HTML"

          grep -q \
            "if(isJE&&je)je.disabled=false;" \
            "$HTML"

          echo "RECEIVED JE FULL LIST CORRECTION VERIFIED."


      - name: Verify MBMS Core Functions
        shell: bash
        run: |
          set -e

          HTML="mbms_work/index.html"

          grep -q \
            "mbmsSettingsSnapshot" \
            "$HTML"

          grep -q \
            "downloadSettingsBackup" \
            "$HTML"

          grep -q \
            "restoreSettingsBackup" \
            "$HTML"

          grep -q \
            "generateTransferReport" \
            "$HTML"

          grep -q \
            "saveTransferMB" \
            "$HTML"

          grep -q \
            "getTransferHistory" \
            "$HTML"

          echo "MBMS CORE FUNCTIONS VERIFIED."


      - name: Create Android project
        shell: bash
        run: |
          set -e

          rm -rf \
            mbms_android \
            release

          mkdir -p \
            mbms_android/app/src/main/assets \
            mbms_android/app/src/main/java/com/mbms/app \
            mbms_android/app/src/main/res/values \
            release

          cp \
            mbms_work/index.html \
            mbms_android/app/src/main/assets/index.html


          cat > mbms_android/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(
                  RepositoriesMode.FAIL_ON_PROJECT_REPOS
              )

              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "MBMSAndroid"

          include(":app")
          EOF


          cat > mbms_android/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF


          cat > mbms_android/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=false
          android.nonTransitiveRClass=true
          EOF


          cat > mbms_android/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {

              namespace 'com.mbms.app'

              compileSdk 35

              defaultConfig {

                  applicationId 'com.mbms.app'

                  minSdk 26

                  targetSdk 35

                  versionCode 123

                  versionName 'V123'
              }

              buildTypes {

                  debug {

                      minifyEnabled false

                      shrinkResources false
                  }

                  release {

                      minifyEnabled false

                      shrinkResources false
                  }
              }

              compileOptions {

                  sourceCompatibility JavaVersion.VERSION_17

                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF


          cat > mbms_android/app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">MBMS</string>
          </resources>
          EOF


          cat > mbms_android/app/src/main/res/values/styles.xml <<'EOF'
          <resources>

              <style
                  name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">

                  <item name="android:fontFamily">
                      sans
                  </item>

                  <item name="android:colorAccent">
                      #1976D2
                  </item>

                  <item name="android:navigationBarColor">
                      #06458E
                  </item>

              </style>

          </resources>
          EOF


          cat > mbms_android/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest
              xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission
                  android:name="android.permission.INTERNET" />

              <uses-permission
                  android:name="android.permission.WRITE_EXTERNAL_STORAGE"
                  android:maxSdkVersion="28" />

              <application
                  android:allowBackup="true"
                  android:usesCleartextTraffic="true"
                  android:label="@string/app_name"
                  android:theme="@style/AppTheme"
                  android:hardwareAccelerated="true"
                  android:resizeableActivity="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait"
                      android:configChanges="orientation|screenSize|keyboardHidden">

                      <intent-filter>

                          <action
                              android:name="android.intent.action.MAIN" />

                          <category
                              android:name="android.intent.category.LAUNCHER" />

                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF


          cat > mbms_android/app/proguard-rules.pro <<'EOF'
          # MBMS
          EOF


      - name: Create MainActivity.java
        shell: bash
        run: |
          set -e

          cat > mbms_android/app/src/main/java/com/mbms/app/MainActivity.java <<'EOF'
          package com.mbms.app;

          import android.app.Activity;
          import android.content.ContentValues;
          import android.content.Context;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Environment;
          import android.provider.MediaStore;
          import android.print.PrintAttributes;
          import android.print.PrintDocumentAdapter;
          import android.print.PrintManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Toast;

          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.OutputStream;
          import java.nio.charset.StandardCharsets;

          public class MainActivity extends Activity {

              private static final int REQUEST_FILE = 9102;

              private WebView webView;

              private ValueCallback<Uri[]> filePathCallback;


              @Override
              protected void onCreate(
                      Bundle savedInstanceState) {

                  super.onCreate(savedInstanceState);

                  webView =
                          new WebView(this);

                  setContentView(webView);


                  WebSettings settings =
                          webView.getSettings();

                  settings.setJavaScriptEnabled(true);

                  settings.setDomStorageEnabled(true);

                  settings.setDatabaseEnabled(true);

                  settings.setAllowFileAccess(true);

                  settings.setAllowContentAccess(true);

                  settings.setBuiltInZoomControls(false);

                  settings.setDisplayZoomControls(false);

                  settings.setSupportZoom(false);

                  settings.setLoadWithOverviewMode(false);

                  settings.setUseWideViewPort(false);

                  settings.setTextZoom(100);


                  webView.addJavascriptInterface(
                          new AndroidBridge(),
                          "MBMSAndroid"
                  );


                  webView.setWebChromeClient(
                          new WebChromeClient() {

                              @Override
                              public boolean onShowFileChooser(
                                      WebView view,
                                      ValueCallback<Uri[]> callback,
                                      FileChooserParams params) {

                                  if(
                                      filePathCallback != null
                                  ) {

                                      filePathCallback
                                              .onReceiveValue(null);
                                  }


                                  filePathCallback =
                                          callback;


                                  try {

                                      Intent intent =
                                              new Intent(
                                                  Intent.ACTION_OPEN_DOCUMENT
                                              );


                                      intent.addCategory(
                                          Intent.CATEGORY_OPENABLE
                                      );


                                      intent.setType(
                                          "application/json"
                                      );


                                      startActivityForResult(
                                          intent,
                                          REQUEST_FILE
                                      );


                                      return true;


                                  } catch(Exception e) {

                                      filePathCallback =
                                              null;

                                      return false;
                                  }
                              }
                          }
                  );


                  webView.setWebViewClient(
                          new WebViewClient() {

                              @Override
                              public boolean
                              shouldOverrideUrlLoading(
                                      WebView view,
                                      WebResourceRequest request) {

                                  return false;
                              }


                              @Override
                              public void onPageFinished(
                                      WebView view,
                                      String url) {

                                  super.onPageFinished(
                                      view,
                                      url
                                  );

                                  installNativeBridge();
                              }
                          }
                  );


                  webView.loadUrl(
                      "file:///android_asset/index.html"
                  );
              }


              private void installNativeBridge() {

                  if(webView == null) {
                      return;
                  }


                  String js =
                          "(function(){"
                        + "try{"

                        + "window.print=function(){"
                        + "try{"
                        + "if(window.MBMSAndroid&&"
                        + "typeof window.MBMSAndroid.print"
                        + "==='function'){"
                        + "window.MBMSAndroid.print();"
                        + "return;"
                        + "}"
                        + "}catch(e){"
                        + "console.error(e);"
                        + "}"
                        + "};"


                        + "window.downloadSettingsBackup="
                        + "function(){"
                        + "try{"

                        + "var data="
                        + "JSON.stringify("
                        + "window.mbmsSettingsSnapshot(),"
                        + "null,2);"

                        + "var filename="
                        + "'MBMS_Backup_'"
                        + "+new Date()"
                        + ".toISOString()"
                        + ".slice(0,10)"
                        + "+'.json';"


                        + "if(window.MBMSAndroid&&"
                        + "typeof window.MBMSAndroid.saveBackup"
                        + "==='function'){"

                        + "window.MBMSAndroid.saveBackup("
                        + "data,filename);"

                        + "return;"
                        + "}"

                        + "}catch(e){"

                        + "alert("
                        + "'Backup Save मध्ये त्रुटी आली.'"
                        + ");"

                        + "}"
                        + "};"

                        + "}catch(e){"
                        + "console.error(e);"
                        + "}"
                        + "})();";


                  webView.evaluateJavascript(
                      js,
                      null
                  );
              }


              public class AndroidBridge {

                  @JavascriptInterface
                  public void print() {

                      runOnUiThread(
                          new Runnable() {

                              @Override
                              public void run() {

                                  try {

                                      PrintManager manager =
                                          (PrintManager)
                                          getSystemService(
                                              Context.PRINT_SERVICE
                                          );


                                      if(manager == null) {

                                          throw new Exception(
                                              "Print service unavailable"
                                          );
                                      }


                                      PrintDocumentAdapter adapter =
                                          webView
                                          .createPrintDocumentAdapter(
                                              "MBMS Report"
                                          );


                                      PrintAttributes attributes =
                                          new PrintAttributes.Builder()

                                          .setMediaSize(
                                              PrintAttributes.MediaSize.ISO_A4
                                          )

                                          .setMinMargins(
                                              PrintAttributes.Margins.NO_MARGINS
                                          )

                                          .build();


                                      manager.print(
                                          "MBMS Report",
                                          adapter,
                                          attributes
                                      );


                                  } catch(Exception e) {

                                      Toast.makeText(
                                          MainActivity.this,
                                          "Print सुरू करता आले नाही.",
                                          Toast.LENGTH_LONG
                                      ).show();
                                  }
                              }
                          }
                      );
                  }


                  @JavascriptInterface
                  public void saveBackup(
                          final String json,
                          final String filename) {

                      new Thread(
                          new Runnable() {

                              @Override
                              public void run() {

                                  boolean success =
                                          false;


                                  try {

                                      if(
                                          Build.VERSION.SDK_INT >= 29
                                      ) {

                                          ContentValues values =
                                              new ContentValues();


                                          values.put(
                                              MediaStore.Downloads.DISPLAY_NAME,
                                              filename
                                          );


                                          values.put(
                                              MediaStore.Downloads.MIME_TYPE,
                                              "application/json"
                                          );


                                          values.put(
                                              MediaStore.Downloads.RELATIVE_PATH,
                                              Environment.DIRECTORY_DOWNLOADS
                                          );


                                          values.put(
                                              MediaStore.Downloads.IS_PENDING,
                                              1
                                          );


                                          Uri uri =
                                              getContentResolver()
                                              .insert(
                                                  MediaStore.Downloads.EXTERNAL_CONTENT_URI,
                                                  values
                                              );


                                          if(uri == null) {

                                              throw new Exception(
                                                  "Unable to create backup"
                                              );
                                          }


                                          OutputStream output =
                                              getContentResolver()
                                              .openOutputStream(
                                                  uri
                                              );


                                          if(output == null) {

                                              throw new Exception(
                                                  "Unable to open backup"
                                              );
                                          }


                                          try {

                                              output.write(
                                                  json.getBytes(
                                                      StandardCharsets.UTF_8
                                                  )
                                              );

                                              output.flush();

                                          } finally {

                                              output.close();
                                          }


                                          ContentValues done =
                                              new ContentValues();


                                          done.put(
                                              MediaStore.Downloads.IS_PENDING,
                                              0
                                          );


                                          getContentResolver()
                                          .update(
                                              uri,
                                              done,
                                              null,
                                              null
                                          );


                                          success =
                                              true;


                                      } else {

                                          File directory =
                                              Environment
                                              .getExternalStoragePublicDirectory(
                                                  Environment
                                                  .DIRECTORY_DOWNLOADS
                                              );


                                          if(
                                              !directory.exists()
                                          ) {

                                              directory.mkdirs();
                                          }


                                          File file =
                                              new File(
                                                  directory,
                                                  filename
                                              );


                                          FileOutputStream output =
                                              new FileOutputStream(
                                                  file
                                              );


                                          try {

                                              output.write(
                                                  json.getBytes(
                                                      StandardCharsets.UTF_8
                                                  )
                                              );

                                              output.flush();

                                          } finally {

                                              output.close();
                                          }


                                          success =
                                              true;
                                      }


                                  } catch(Exception e) {

                                      e.printStackTrace();
                                  }


                                  final boolean result =
                                      success;


                                  runOnUiThread(
                                      new Runnable() {

                                          @Override
                                          public void run() {

                                              Toast.makeText(
                                                  MainActivity.this,

                                                  result
                                                  ?
                                                  "Backup Downloads मध्ये Save झाला."
                                                  :
                                                  "Backup Save मध्ये त्रुटी आली.",

                                                  Toast.LENGTH_LONG
                                              ).show();

                                          }
                                      }
                                  );
                              }
                          }
                      ).start();
                  }
              }


              @Override
              protected void onActivityResult(
                      int requestCode,
                      int resultCode,
                      Intent data) {

                  super.onActivityResult(
                      requestCode,
                      resultCode,
                      data
                  );


                  if(
                      requestCode != REQUEST_FILE
                  ) {

                      return;
                  }


                  if(
                      filePathCallback == null
                  ) {

                      return;
                  }


                  Uri[] results =
                          null;


                  if(
                      resultCode == RESULT_OK &&
                      data != null &&
                      data.getData() != null
                  ) {

                      results =
                          new Uri[]{
                              data.getData()
                          };
                  }


                  filePathCallback
                      .onReceiveValue(results);


                  filePathCallback =
                          null;
              }


              @Override
              public void onBackPressed() {

                  if(
                      webView != null &&
                      webView.canGoBack()
                  ) {

                      webView.goBack();

                  } else {

                      super.onBackPressed();
                  }
              }


              @Override
              protected void onDestroy() {

                  if(webView != null) {

                      webView.stopLoading();

                      webView.destroy();

                      webView =
                              null;
                  }


                  super.onDestroy();
              }
          }
          EOF


      - name: Verify Android project
        shell: bash
        run: |
          set -e

          test -s \
            mbms_android/settings.gradle

          test -s \
            mbms_android/build.gradle

          test -s \
            mbms_android/app/build.gradle

          test -s \
            mbms_android/app/src/main/AndroidManifest.xml

          test -s \
            mbms_android/app/src/main/java/com/mbms/app/MainActivity.java

          test -s \
            mbms_android/app/src/main/res/values/strings.xml

          test -s \
            mbms_android/app/src/main/res/values/styles.xml

          test -s \
            mbms_android/app/src/main/assets/index.html


          python3 <<'PY'
          import xml.etree.ElementTree as ET

          files = [
              "mbms_android/app/src/main/res/values/strings.xml",
              "mbms_android/app/src/main/res/values/styles.xml",
              "mbms_android/app/src/main/AndroidManifest.xml"
          ]

          for f in files:
              ET.parse(f)
              print("XML OK:", f)

          PY


          echo "ANDROID PROJECT VALIDATION PASSED."


      - name: Create Gradle Wrapper
        working-directory: mbms_android
        shell: bash
        run: |
          set -e

          gradle wrapper \
            --gradle-version 8.7 \
            --distribution-type bin

          chmod +x gradlew

          ./gradlew --version


      - name: Compile Android Java
        working-directory: mbms_android
        shell: bash
        run: |
          set -e

          ./gradlew \
            --no-daemon \
            --stacktrace \
            :app:compileDebugJavaWithJavac

          echo "JAVA COMPILATION PASSED."


      - name: Build Final MBMS APK
        working-directory: mbms_android
        shell: bash
        run: |
          set -e

          ./gradlew \
            --no-daemon \
            --stacktrace \
            clean \
            :app:assembleDebug

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"


          cp \
            "$APK" \
            "../release/MBMS-V123-RECEIVED-JE-FULL-LIST.apk"


          ls -lh \
            "../release/MBMS-V123-RECEIVED-JE-FULL-LIST.apk"


      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="release/MBMS-V123-RECEIVED-JE-FULL-LIST.apk"

          test -s "$APK"


          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify \
            --verbose \
            "$APK"


          unzip -t "$APK" >/dev/null


          sha256sum "$APK" \
            | tee release/SHA256.txt


          echo "APK SIGNATURE AND ZIP VERIFICATION PASSED."


      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MBMS-V123-RECEIVED-JE-FULL-LIST
          path: |
            release/MBMS-V123-RECEIVED-JE-FULL-LIST.apk
            release/SHA256.txt
          if-no-files-found: error
