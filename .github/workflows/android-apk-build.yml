name: MBMS V131 FINAL - PRINT AUDIT HARDENED

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:

  build:
    name: Build Final MBMS APK
    runs-on: ubuntu-24.04

    steps:

      # ============================================================
      # 1. CHECKOUT REPOSITORY
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. SETUP JAVA 17
      # ============================================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # ============================================================
      # 3. SETUP ANDROID SDK
      # ============================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4


      # ============================================================
      # 4. INSTALL SDK PACKAGES
      # ============================================================
      - name: Install Android SDK 35
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"


      # ============================================================
      # 5. SETUP GRADLE 8.7
      # ============================================================
      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'


      # ============================================================
      # 6. VERIFY JAVA & GRADLE
      # ============================================================
      - name: Verify Java and Gradle
        shell: bash
        run: |
          set -e

          java -version
          gradle --version


      # ============================================================
      # 7. LOCATE HTML FILE
      # ============================================================
      - name: Find MBMS HTML
        shell: bash
        run: |
          set -e

          HTML_FILE=""

          for f in \
            "Measurement_Book_Management_System_FINAL_V120_TRANSFER_REPORT_FINAL.html" \
            "Measurement_Book_Management_System_FINAL_V118_PRINT_BACKUP_ANDROID.html" \
            "Measurement_Book_Management_System_FINAL_V115_MB_HISTORY_ONLY_DATE-6.html" \
            "Measurement_Book_Management_System_FINAL_V115_MB_HISTORY_ONLY_DATE.html" \
            "Measurement_Book_Management_System_FINAL_V115.html" \
            "V115.html" \
            "index.html"
          do
            if [ -f "$f" ]; then
              HTML_FILE="$f"
              break
            fi
          done

          if [ -z "$HTML_FILE" ]; then
            HTML_FILE=$(find . \
              -maxdepth 3 \
              -type f \
              -iname "*.html" \
              -not -path "./.git/*" \
              | head -n 1 || true)
          fi

          if [ -z "$HTML_FILE" ]; then
            echo "ERROR: MBMS HTML file not found."
            exit 1
          fi

          echo "HTML_FILE=$HTML_FILE" >> "$GITHUB_ENV"
          echo "Using HTML: $HTML_FILE"


      # ============================================================
      # 8. PREPARE HTML DIRECTORY
      # ============================================================
      - name: Prepare Final MBMS HTML
        shell: bash
        run: |
          set -e

          mkdir -p mbms_work

          cp \
            "$HTML_FILE" \
            mbms_work/index.html

          test -s mbms_work/index.html
          echo "HTML size: $(wc -c < mbms_work/index.html)"


      # ============================================================
      # 9. APPLY WORK LIST 5-COLUMN A4 PRINT FIX
      # ============================================================
      - name: Apply Work List 5-Column A4 Print Fix
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path("mbms_work/index.html")
          text = p.read_text(encoding="utf-8")

          print_patch = """
          <!-- V131 WORK LIST 5-COLUMN A4 PRINT HARDENED PATCH -->
          <style>
          @media print {
            @page {
              size: A4 portrait;
              margin: 12mm 10mm 15mm 10mm !important;
            }
            body {
              font-family: 'Noto Sans Devanagari', 'Mukta', 'Arial', sans-serif !important;
              color: #000 !important;
              background: #fff !important;
              -webkit-print-color-adjust: exact !important;
              print-color-adjust: exact !important;
            }
            .no-print { display: none !important; }
            .work-report-table {
              width: 100% !important;
              border-collapse: collapse !important;
              table-layout: fixed !important;
              margin-top: 10px !important;
              page-break-inside: auto !important;
            }
            .work-report-table thead {
              display: table-header-group !important;
            }
            .work-report-table tr {
              page-break-inside: avoid !important;
            }
            .work-report-table th,
            .work-report-table td {
              border: 1px solid #000 !important;
              padding: 6px 8px !important;
              font-size: 13px !important;
              line-height: 1.4 !important;
              word-wrap: break-word !important;
              overflow-wrap: break-word !important;
              vertical-align: middle !important;
            }
            .work-report-table th {
              background-color: #f2f2f2 !important;
              font-weight: bold !important;
              text-align: center !important;
            }
            .col-sr { width: 6% !important; text-align: center !important; }
            .col-work { width: 34% !important; text-align: left !important; }
            .col-contractor { width: 28% !important; text-align: left !important; }
            .col-je { width: 20% !important; text-align: left !important; }
            .col-mb { width: 12% !important; text-align: center !important; white-space: nowrap !important; }
          }
          </style>
          <script id="WORK_LIST_PRINT_FIX">
          window.printWorkListReportA4 = function(works, title, fromDate, toDate) {
            var pa = document.getElementById('printArea');
            if (!pa) {
              pa = document.createElement('div');
              pa.id = 'printArea';
              document.body.appendChild(pa);
            }
            var h = '';
            h += '<div style="text-align:center; margin-bottom:12px;">';
            h += '  <h2 style="margin:0; font-size:18px;">सार्वजनिक बांधकाम विभाग</h2>';
            h += '  <h3 style="margin:4px 0; font-size:15px;">मोजमाप पुस्तिका नियंत्रण प्रणाली</h3>';
            h += '  <h4 style="margin:4px 0 10px 0; font-size:14px; text-decoration:underline;">WORK LIST REPORT</h4>';
            h += '</div>';
            h += '<div style="display:flex; justify-content:space-between; font-size:12px; margin-bottom:6px; border-bottom:1px solid #000; padding-bottom:4px;">';
            h += '  <span><b>Report :</b> ' + (title || 'सर्व Work List') + '</span>';
            h += '  <span><b>दिनांक :</b> ' + (fromDate && toDate ? (fromDate + ' ते ' + toDate) : new Date().toLocaleDateString('en-GB')) + '</span>';
            h += '</div>';
            h += '<table class="work-report-table">';
            h += '  <thead><tr>';
            h += '    <th class="col-sr">अ.क्र.</th>';
            h += '    <th class="col-work">कामाचे नाव</th>';
            h += '    <th class="col-contractor">कॉन्ट्रॅक्टर / एजन्सीचे नाव</th>';
            h += '    <th class="col-je">ज्युनियर इंजिनिअर</th>';
            h += '    <th class="col-mb">MB क्रमांक</th>';
            h += '  </tr></thead>';
            h += '  <tbody>';
            var list = Array.isArray(works) ? works : [];
            if(list.length === 0){
              h += '<tr><td colspan="5" style="text-align:center; padding:15px;">कोणतीही नोंद उपलब्ध नाही.</td></tr>';
            } else {
              for(var i=0; i<list.length; i++){
                var w = list[i];
                var wn = w.workName || w.name || w.work || '-';
                var co = w.contractor || w.agency || w.contractorName || '-';
                var je = w.je || w.jeName || w.juniorEngineer || '-';
                var mb = w.mb || w.number || w.mbNumber || '-';
                h += '<tr>';
                h += '  <td class="col-sr">' + (i+1) + '</td>';
                h += '  <td class="col-work">' + wn + '</td>';
                h += '  <td class="col-contractor">' + co + '</td>';
                h += '  <td class="col-je">' + je + '</td>';
                h += '  <td class="col-mb">' + mb + '</td>';
                h += '</tr>';
              }
            }
            h += '  </tbody></table>';
            h += '<div style="position:fixed; bottom:0; left:0; right:0; text-align:center; font-size:11px; border-top:1px solid #888; padding-top:4px;">';
            h += '  © सर्व हक्क राखीव - सार्वजनिक बांधकाम विभाग';
            h += '</div>';
            pa.innerHTML = h;
            setTimeout(function(){ window.print(); }, 120);
          };
          </script>
          """

          if "</body>" in text.lower():
              pos = text.lower().rfind("</body>")
              text = text[:pos] + print_patch + text[pos:]
          else:
              text += print_patch

          p.write_text(text, encoding="utf-8")
          print("Work List 5-Column A4 format successfully injected.")
          PY


      # ============================================================
      # 10. CREATE ANDROID PROJECT DIRECTORIES
      # ============================================================
      - name: Create Android project
        shell: bash
        run: |
          set -e

          rm -rf mbms_android release
          mkdir -p \
            mbms_android/app/src/main/assets \
            mbms_android/app/src/main/java/com/mbms/app \
            mbms_android/app/src/main/res/values \
            release

          cp mbms_work/index.html mbms_android/app/src/main/assets/index.html

          cat > mbms_android/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "MBMSAndroid"
          include(":app")
          EOF

          cat > mbms_android/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF

          cat > mbms_android/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat > mbms_android/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.mbms.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.mbms.app'
                  minSdk 26
                  targetSdk 35
                  versionCode 131
                  versionName 'V131'
              }

              buildTypes {
                  debug {
                      minifyEnabled false
                      shrinkResources false
                  }
                  release {
                      minifyEnabled false
                      shrinkResources false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat > mbms_android/app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">MBMS</string>
          </resources>
          EOF

          cat > mbms_android/app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#1976D2</item>
                  <item name="android:navigationBarColor">#06458E</item>
              </style>
          </resources>
          EOF

          cat > mbms_android/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />

              <application
                  android:allowBackup="true"
                  android:usesCleartextTraffic="true"
                  android:label="@string/app_name"
                  android:theme="@style/AppTheme"
                  android:hardwareAccelerated="true"
                  android:resizeableActivity="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF


      # ============================================================
      # 11. CREATE MAINACTIVITY.JAVA
      # ============================================================
      - name: Create MainActivity.java
        shell: bash
        run: |
          set -e

          cat > mbms_android/app/src/main/java/com/mbms/app/MainActivity.java <<'EOF'
          package com.mbms.app;

          import android.app.Activity;
          import android.content.Context;
          import android.os.Bundle;
          import android.print.PrintAttributes;
          import android.print.PrintDocumentAdapter;
          import android.print.PrintManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Toast;

          public class MainActivity extends Activity {

              private WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);
                  settings.setTextZoom(100);

                  AndroidBridge bridge = new AndroidBridge();
                  webView.addJavascriptInterface(bridge, "MBMSAndroid");
                  webView.addJavascriptInterface(bridge, "AndroidBridge");

                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public void onPageFinished(WebView view, String url) {
                          super.onPageFinished(view, url);
                          webView.evaluateJavascript(
                              "window.print=function(){ if(window.MBMSAndroid){ window.MBMSAndroid.print(); } };",
                              null
                          );
                      }
                  });

                  webView.loadUrl("file:///android_asset/index.html");
              }

              public class AndroidBridge {
                  @JavascriptInterface
                  public void print() {
                      runOnUiThread(new Runnable() {
                          @Override
                          public void run() {
                              try {
                                  PrintManager manager = (PrintManager) getSystemService(Context.PRINT_SERVICE);
                                  if (manager != null && webView != null) {
                                      webView.postDelayed(new Runnable() {
                                          @Override
                                          public void run() {
                                              try {
                                                  PrintDocumentAdapter adapter = webView.createPrintDocumentAdapter("MBMS Report");
                                                  PrintAttributes attributes = new PrintAttributes.Builder()
                                                          .setMediaSize(PrintAttributes.MediaSize.ISO_A4)
                                                          .setMinMargins(PrintAttributes.Margins.NO_MARGINS)
                                                          .build();
                                                  manager.print("MBMS Report", adapter, attributes);
                                              } catch (Exception e) {
                                                  Toast.makeText(MainActivity.this, "Print अयशस्वी झाले.", Toast.LENGTH_SHORT).show();
                                              }
                                          }
                                      }, 500);
                                  }
                              } catch (Exception e) {
                                  Toast.makeText(MainActivity.this, "Print सुरू करता आले नाही.", Toast.LENGTH_SHORT).show();
                              }
                          }
                      });
                  }
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }

              @Override
              protected void onDestroy() {
                  if (webView != null) {
                      webView.stopLoading();
                      webView.destroy();
                      webView = null;
                  }
                  super.onDestroy();
              }
          }
          EOF


      # ============================================================
      # 12. BUILD APK
      # ============================================================
      - name: Build Final MBMS APK
        working-directory: mbms_android
        shell: bash
        run: |
          set -e

          gradle --no-daemon --stacktrace clean :app:assembleDebug

          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"

          cp "$APK" "../release/MBMS-V131-FINAL.apk"
          ls -lh "../release/MBMS-V131-FINAL.apk"


      # ============================================================
      # 13. UPLOAD APK ARTIFACT
      # ============================================================
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MBMS-V131-FINAL-APK
          path: release/MBMS-V131-FINAL.apk
          if-no-files-found: error
