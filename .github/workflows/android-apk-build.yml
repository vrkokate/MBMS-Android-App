name: MBMS Android APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Verified MBMS Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate and Prepare HTML
        shell: bash
        run: |
          set -e
          mkdir -p mbms_work

          for z in *.zip; do
            if [ -f "$z" ]; then
              echo "Unpacking zip: $z"
              unzip -q -o "$z" -d extracted_zip || true
            fi
          done

          TARGET_HTML=$(find . -type f -iname "*.html" -not -path "./.git/*" -not -path "./mbms_work/*" -exec ls -S {} + | head -n 1)

          if [ -z "$TARGET_HTML" ]; then
            echo "ERROR: No HTML file found in repository."
            exit 1
          fi

          echo "Target HTML detected: $TARGET_HTML"
          cp "$TARGET_HTML" mbms_work/index.html
          test -s mbms_work/index.html

      - name: Inject Final 5-Tab Architecture, Date Format and Report Engine
        shell: bash
        run: |
          set -e
          python3 <<'PY'
          from pathlib import Path
          import re

          html_file = Path("mbms_work/index.html")
          raw_html = html_file.read_text(encoding="utf-8")

          # १. हेडरमधील केशरी REPORT बटण थेट काढणे
          raw_html = re.sub(r'<button[^>]*class="[^"]*btn-warning[^"]*"[^>]*>[\s\S]*?REPORT[\s\S]*?</button>', '', raw_html, flags=re.I)
          raw_html = re.sub(r'<button[^>]*style="[^"]*background[^"]*(?:#ff9800|orange|rgb\(255,\s*152,\s*0\))[^"]*"[^>]*>[\s\S]*?REPORT[\s\S]*?</button>', '', raw_html, flags=re.I)

          patch_code = """
          <!-- ==================== MBMS FINAL UNIFIED SYSTEM ==================== -->
          <style id="MBMS_FINAL_STYLES">
          /* इतर उप-पानांवरील अनावश्यक रिपोर्ट बटणे लपवणे */
          header button:contains("REPORT"),
          .navbar button:contains("REPORT"),
          .card button:contains("REPORT"),
          button[class*="report"]:not(#mainDashboardReportBtn):not(.btn-report-main) {
            display: none !important;
          }

          /* ५ टॅबची नेव्हिगेशन पट्टी */
          #mbmsTopTabBar {
            display: flex !important;
            background-color: #06458e !important;
            overflow-x: auto !important;
            white-space: nowrap !important;
            position: sticky !important;
            top: 0 !important;
            z-index: 9999 !important;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2) !important;
          }
          .mbms-nav-tab-btn {
            flex: 1 !important;
            min-width: 70px !important;
            padding: 12px 6px !important;
            background: transparent !important;
            border: none !important;
            color: #d1e2f7 !important;
            font-size: 13px !important;
            font-weight: bold !important;
            text-align: center !important;
            cursor: pointer !important;
            border-bottom: 3px solid transparent !important;
          }
          .mbms-nav-tab-btn.active {
            background-color: #043166 !important;
            color: #ffffff !important;
            border-bottom: 3px solid #ffca28 !important;
          }
          .tab-content-container {
            display: none;
            padding: 15px;
          }
          .tab-content-container.active {
            display: block;
          }
          .placeholder-box {
            background: #fff;
            border-radius: 12px;
            padding: 40px 20px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            margin-top: 15px;
          }

          @media print {
            @page { size: A4 portrait; margin: 8mm !important; }
            body { background: #fff !important; color: #000 !important; }
            body > *:not(#printArea) { display: none !important; }
            #printArea { display: block !important; width: 100% !important; }
            table.print-table { width: 100% !important; border-collapse: collapse !important; margin-top: 6px !important; }
            table.print-table th, table.print-table td { border: 1px solid #000 !important; padding: 5px 6px !important; font-size: 11px !important; }
            table.print-table th { background: #eee !important; font-weight: bold !important; }
          }
          </style>

          <div id="printArea" style="display: none;"></div>

          <script id="MBMS_FINAL_LOGIC">
          (function() {
            // १. मुख्य ५ टॅबची रचना तयार करणे
            function buildFiveTabs() {
              if (document.getElementById('mbmsTopTabBar')) return;

              var bar = document.createElement('div');
              bar.id = 'mbmsTopTabBar';
              bar.innerHTML = '<button class="mbms-nav-tab-btn" onclick="window.switchMbmsTab(event, \\'tabEst\\')">एस्टॅब्लिशमेंट</button>' +
                              '<button class="mbms-nav-tab-btn" onclick="window.switchMbmsTab(event, \\'tabPay\\')">Pay</button>' +
                              '<button class="mbms-nav-tab-btn active" onclick="window.switchMbmsTab(event, \\'tabMBMain\\')">MB</button>' +
                              '<button class="mbms-nav-tab-btn" onclick="window.switchMbmsTab(event, \\'tabFour\\')">टॅब ४</button>' +
                              '<button class="mbms-nav-tab-btn" onclick="window.switchMbmsTab(event, \\'tabFive\\')">टॅब ५</button>';

              var bodyChildren = Array.from(document.body.children);
              var mbWrapper = document.createElement('div');
              mbWrapper.id = 'tabMBMain';
              mbWrapper.className = 'tab-content-container active';

              bodyChildren.forEach(function(child) {
                if (child.tagName !== 'SCRIPT' && child.tagName !== 'STYLE' && child.id !== 'printArea') {
                  mbWrapper.appendChild(child);
                }
              });

              var tabEst = document.createElement('div');
              tabEst.id = 'tabEst';
              tabEst.className = 'tab-content-container';
              tabEst.innerHTML = '<div class="placeholder-box"><h3>एस्टॅब्लिशमेंट (आस्थापना विभाग)</h3><p style="margin-top:8px;color:#666;">येथे आस्थापना विभागाचे कामकाज सुरक्षितपणे जोडता येईल.</p></div>';

              var tabPay = document.createElement('div');
              tabPay.id = 'tabPay';
              tabPay.className = 'tab-content-container';
              tabPay.innerHTML = '<div class="placeholder-box"><h3>Pay (वेतन व देयके विभाग)</h3><p style="margin-top:8px;color:#666;">येथे वेतन व देयके संबंधित कामकाज जोडता येईल.</p></div>';

              var tabFour = document.createElement('div');
              tabFour.id = 'tabFour';
              tabFour.className = 'tab-content-container';
              tabFour.innerHTML = '<div class="placeholder-box"><h3>टॅब ४</h3><p style="margin-top:8px;color:#666;">येथे भविष्यातील नवीन विभाग जोडता येईल.</p></div>';

              var tabFive = document.createElement('div');
              tabFive.id = 'tabFive';
              tabFive.className = 'tab-content-container';
              tabFive.innerHTML = '<div class="placeholder-box"><h3>टॅब ५</h3><p style="margin-top:8px;color:#666;">येथे इतर कार्यप्रणाली जोडता येईल.</p></div>';

              document.body.insertBefore(bar, document.body.firstChild);
              document.body.appendChild(mbWrapper);
              document.body.appendChild(tabEst);
              document.body.appendChild(tabPay);
              document.body.appendChild(tabFour);
              document.body.appendChild(tabFive);
            }

            window.switchMbmsTab = function(evt, tabId) {
              document.querySelectorAll('.tab-content-container').forEach(function(c){ c.classList.remove('active'); });
              document.querySelectorAll('.mbms-nav-tab-btn').forEach(function(b){ b.classList.remove('active'); });
              var el = document.getElementById(tabId);
              if (el) el.classList.add('active');
              if (evt && evt.currentTarget) evt.currentTarget.classList.add('active');
            };

            setTimeout(buildFiveTabs, 100);

            // २. दिनांक dd-mm-yyyy करणे आणि अनावश्यक बटणे काढणे
            setInterval(function() {
              document.querySelectorAll('table td, [class*="row"] div').forEach(function(td) {
                var t = td.textContent.trim();
                var m = t.match(/^(\\d{4})[-/](\\d{2})[-/](\\d{2})$/);
                if (m) {
                  td.textContent = m[3] + '-' + m[2] + '-' + m[1];
                }
              });

              document.querySelectorAll('button, a').forEach(function(b) {
                var txt = (b.textContent || b.value || '').trim().toUpperCase();
                if (txt === 'REPORT') {
                  if (b.getBoundingClientRect().top < 85 || (!b.classList.contains('btn-report-main') && !b.textContent.includes('PRINT'))) {
                    b.style.setProperty('display', 'none', 'important');
                    b.remove();
                  }
                }
              });
            }, 250);

            function getStorageData(key) {
              try { return JSON.parse(localStorage.getItem(key)) || []; } catch(e) { return []; }
            }

            // ३. मुख्य डॅशबोर्डवर अचूक ४ मुख्य घटक व उपघटक भरणे
            function syncMainReportDropdowns() {
              var selects = Array.from(document.querySelectorAll('#tabMBMain select'));
              if (selects.length >= 2) {
                var mainSel = selects[0];
                var subSel = selects[1];

                var expectedMain = ['M.B.', 'JE', 'कामाचे नाव', 'कॉन्ट्रॅक्टर चे नाव'];
                var currentOpts = Array.from(mainSel.options).map(function(o){ return o.text.trim(); });

                if (JSON.stringify(currentOpts) !== JSON.stringify(expectedMain)) {
                  var curVal = mainSel.value;
                  mainSel.innerHTML = '';
                  expectedMain.forEach(function(opt) {
                    var o = document.createElement('option');
                    o.value = opt;
                    o.text = opt;
                    mainSel.appendChild(o);
                  });
                  if (expectedMain.includes(curVal)) mainSel.value = curVal;
                }

                var activeMain = mainSel.value;
                var subOptions = [];

                if (activeMain === 'M.B.') {
                  subOptions = ['सर्व M.B.', 'लहान M.B.', 'मोठी M.B.'];
                  var mbList = getStorageData('mb_records');
                  mbList.forEach(function(m){
                    var no = m.mbNumber || m.mbNo;
                    if (no && !subOptions.includes(no)) subOptions.push(no);
                  });
                } else if (activeMain === 'JE') {
                  subOptions = ['सर्व JE'];
                  var jes = getStorageData('je_records');
                  jes.forEach(function(j){
                    var n = typeof j === 'object' ? (j.name || j.jeName) : j;
                    if (n && !subOptions.includes(n)) subOptions.push(n);
                  });
                } else if (activeMain === 'कामाचे नाव') {
                  subOptions = ['सर्व कामे'];
                  var works = getStorageData('work_records');
                  works.forEach(function(w){
                    var wn = w.workName || w.work;
                    if (wn && !subOptions.includes(wn)) subOptions.push(wn);
                  });
                } else if (activeMain === 'कॉन्ट्रॅक्टर चे नाव') {
                  subOptions = ['सर्व कॉन्ट्रॅक्टर'];
                  var works2 = getStorageData('work_records');
                  works2.forEach(function(w){
                    var c = w.contractor || w.agency;
                    if (c && !subOptions.includes(c)) subOptions.push(c);
                  });
                }

                var currentSubOpts = Array.from(subSel.options).map(function(o){ return o.text.trim(); });
                if (JSON.stringify(currentSubOpts) !== JSON.stringify(subOptions)) {
                  var curSub = subSel.value;
                  subSel.innerHTML = '';
                  subOptions.forEach(function(opt) {
                    var o = document.createElement('option');
                    o.value = opt;
                    o.text = opt;
                    subSel.appendChild(o);
                  });
                  if (subOptions.includes(curSub)) subSel.value = curSub;
                }
              }
            }
            setInterval(syncMainReportDropdowns, 300);

            // ४. अहवाल जनरेशन फंक्शन (केवळ मुख्य REPORT / PRINT बटणावरून)
            function triggerA4Print(h) {
              var pa = document.getElementById('printArea');
              if (!pa) {
                pa = document.createElement('div');
                pa.id = 'printArea';
                document.body.appendChild(pa);
              }
              pa.innerHTML = h;
              pa.style.display = 'block';
              setTimeout(function() {
                window.print();
                setTimeout(function() { pa.style.display = 'none'; }, 500);
              }, 150);
            }

            document.addEventListener('click', function(e) {
              var btn = e.target.closest('button, a');
              if (!btn) return;
              var t = (btn.textContent || btn.value || '').trim().toUpperCase();

              if (t.includes('REPORT') || t.includes('PRINT')) {
                var selects = Array.from(document.querySelectorAll('#tabMBMain select'));
                if (selects.length >= 2) {
                  e.preventDefault();
                  e.stopPropagation();

                  var mainVal = selects[0].value;
                  var subVal = selects[1].value;
                  var today = new Date().toLocaleDateString('en-GB');

                  var works = getStorageData('work_records');
                  var mbs = getStorageData('mb_records');

                  // M.B. अहवाल
                  if (mainVal === 'M.B.') {
                    var filteredMB = mbs.filter(function(m) {
                      var sz = (m.size || m.mbSize || 'लहान').trim();
                      var no = (m.mbNumber || m.mbNo || '').trim();
                      if (subVal === 'लहान M.B.') return sz.includes('लहान');
                      if (subVal === 'मोठी M.B.') return sz.includes('मोठी');
                      if (subVal !== 'सर्व M.B.') return no === subVal;
                      return true;
                    });

                    var h = '<div style="text-align: center; margin-bottom: 8px;">';
                    h += '  <h2 style="margin: 0; font-size: 17px; font-weight: bold;">सार्वजनिक बांधकाम विभाग</h2>';
                    h += '  <h3 style="margin: 3px 0 6px 0; font-size: 14px; text-decoration: underline;">मोजमाप पुस्तिका अहवाल</h3>';
                    h += '</div>';
                    h += '<div style="display: flex; justify-content: space-between; font-size: 11.5px; margin-bottom: 4px;">';
                    h += '  <span><b>तपशील:</b> ' + subVal + '</span><span><b>दिनांक:</b> ' + today + '</span>';
                    h += '</div><table class="print-table"><thead><tr>';
                    h += '  <th style="width:1%; white-space:nowrap;">अ.क्र.</th>';
                    h += '  <th style="width:1%; white-space:nowrap;">M.B. क्रमांक</th>';
                    h += '  <th style="width:1%; white-space:nowrap;">M.B. साईज</th>';
                    h += '  <th style="text-align:left;">सध्या कोणाकडे आहे (JE)</th>';
                    h += '  <th style="text-align:left;">कामाचे नाव</th>';
                    h += '  <th style="width:1%; white-space:nowrap;">प्राप्त दिनांक</th>';
                    h += '</tr></thead><tbody>';

                    if (filteredMB.length === 0) {
                      h += '<tr><td colspan="6" style="text-align:center; padding:10px;">नोंद उपलब्ध नाही.</td></tr>';
                    } else {
                      for (var i = 0; i < filteredMB.length; i++) {
                        var item = filteredMB[i];
                        var rawDate = item.date || item.receiveDate || '-';
                        var dm = rawDate.match(/^(\\d{4})[-/](\\d{2})[-/](\\d{2})$/);
                        var formattedDate = dm ? (dm[3] + '-' + dm[2] + '-' + dm[1]) : rawDate;

                        h += '<tr>';
                        h += '  <td style="text-align:center;">' + (i + 1) + '</td>';
                        h += '  <td style="text-align:center;">' + (item.mbNumber || item.mbNo || '-') + '</td>';
                        h += '  <td style="text-align:center;">' + (item.size || item.mbSize || 'लहान') + '</td>';
                        h += '  <td>' + (item.assignedTo || item.jeName || 'स्टॉकमध्ये उपलब्ध') + '</td>';
                        h += '  <td>' + (item.workName || item.work || '-') + '</td>';
                        h += '  <td style="text-align:center;">' + formattedDate + '</td>';
                        h += '</tr>';
                      }
                    }
                    h += '</tbody></table>';
                    triggerA4Print(h);
                  }

                  // JE अहवाल
                  else if (mainVal === 'JE') {
                    var filteredJE = works.filter(function(w) {
                      if (subVal === 'सर्व JE') return true;
                      return (w.jeName || w.assignedTo || '').trim().toLowerCase() === subVal.trim().toLowerCase();
                    });

                    var h = '<div style="text-align:center; margin-bottom:8px;">';
                    h += '  <h2 style="margin:0; font-size:17px; font-weight:bold;">सार्वजनिक बांधकाम विभाग</h2>';
                    h += '  <h3 style="margin:3px 0 6px 0; font-size:14px; text-decoration:underline;">कनिष्ठ अभियंता अहवाल</h3>';
                    h += '</div>';
                    h += '<div style="display:flex; justify-content:space-between; font-size:11.5px; margin-bottom:4px;">';
                    h += '  <span><b>कनिष्ठ अभियंता:</b> ' + subVal + '</span><span><b>दिनांक:</b> ' + today + '</span>';
                    h += '</div><table class="print-table"><thead><tr>';
                    h += '  <th style="width:1%; white-space:nowrap;">अ.क्र.</th>';
                    h += '  <th>कनिष्ठ अभियंता चे नाव</th>';
                    h += '  <th style="width:1%; white-space:nowrap;">M.B. क्रमांक</th>';
                    h += '  <th style="width:1%; white-space:nowrap;">M.B. साईज</th>';
                    h += '  <th>कामाचे नाव</th>';
                    h += '  <th>कॉन्ट्रॅक्टर चे नाव</th>';
                    h += '</tr></thead><tbody>';

                    if (filteredJE.length === 0) {
                      h += '<tr><td colspan="6" style="text-align:center; padding:10px;">नोंद उपलब्ध नाही.</td></tr>';
                    } else {
                      for (var i = 0; i < filteredJE.length; i++) {
                        var w = filteredJE[i];
                        h += '<tr>';
                        h += '  <td style="text-align:center;">' + (i + 1) + '</td>';
                        h += '  <td>' + (w.jeName || w.assignedTo || '-') + '</td>';
                        h += '  <td style="text-align:center;">' + (w.mbNumber || w.mbNo || '-') + '</td>';
                        h += '  <td style="text-align:center;">' + (w.size || w.mbSize || 'लहान') + '</td>';
                        h += '  <td>' + (w.workName || w.work || '-') + '</td>';
                        h += '  <td>' + (w.contractor || w.agency || '-') + '</td>';
                        h += '</tr>';
                      }
                    }
                    h += '</tbody></table>';
                    triggerA4Print(h);
                  }

                  // कामाचे नाव अहवाल
                  else if (mainVal === 'कामाचे नाव') {
                    var filteredWorks = works.filter(function(w) {
                      if (subVal === 'सर्व कामे') return true;
                      return (w.workName || w.work || '').trim().toLowerCase() === subVal.trim().toLowerCase();
                    });

                    var h = '<div style="text-align:center; margin-bottom:8px;">';
                    h += '  <h2 style="margin:0; font-size:17px; font-weight:bold;">सार्वजनिक बांधकाम विभाग</h2>';
                    h += '  <h3 style="margin:3px 0 6px 0; font-size:14px; text-decoration:underline;">कामाचा सविस्तर अहवाल</h3>';
                    h += '</div>';
                    h += '<div style="display:flex; justify-content:space-between; font-size:11.5px; margin-bottom:4px;">';
                    h += '  <span><b>काम:</b> ' + subVal + '</span><span><b>दिनांक:</b> ' + today + '</span>';
                    h += '</div><table class="print-table"><thead><tr>';
                    h += '  <th style="width:1%; white-space:nowrap;">अ.क्र.</th>';
                    h += '  <th>कामाचे नाव</th>';
                    h += '  <th style="width:1%; white-space:nowrap;">M.B. क्रमांक</th>';
                    h += '  <th style="width:1%; white-space:nowrap;">M.B. साईज</th>';
                    h += '  <th>कनिष्ठ अभियंता (JE)</th>';
                    h += '  <th>कंत्राटदार / एजन्सी</th>';
                    h += '</tr></thead><tbody>';

                    if (filteredWorks.length === 0) {
                      h += '<tr><td colspan="6" style="text-align:center; padding:10px;">नोंद उपलब्ध नाही.</td></tr>';
                    } else {
                      for (var i = 0; i < filteredWorks.length; i++) {
                        var w = filteredWorks[i];
                        h += '<tr>';
                        h += '  <td style="text-align:center;">' + (i + 1) + '</td>';
                        h += '  <td>' + (w.workName || w.work || '-') + '</td>';
                        h += '  <td style="text-align:center;">' + (w.mbNumber || w.mbNo || '-') + '</td>';
                        h += '  <td style="text-align:center;">' + (w.size || w.mbSize || 'लहान') + '</td>';
                        h += '  <td>' + (w.jeName || w.assignedTo || '-') + '</td>';
                        h += '  <td>' + (w.contractor || w.agency || '-') + '</td>';
                        h += '</tr>';
                      }
                    }
                    h += '</tbody></table>';
                    triggerA4Print(h);
                  }

                  // कॉन्ट्रॅक्टर चे नाव अहवाल
                  else if (mainVal === 'कॉन्ट्रॅक्टर चे नाव') {
                    var filteredContractors = works.filter(function(w) {
                      if (subVal === 'सर्व कॉन्ट्रॅक्टर') return true;
                      return (w.contractor || w.agency || '').trim().toLowerCase() === subVal.trim().toLowerCase();
                    });

                    var h = '<div style="text-align:center; margin-bottom:8px;">';
                    h += '  <h2 style="margin:0; font-size:17px; font-weight:bold;">सार्वजनिक बांधकाम विभाग</h2>';
                    h += '  <h3 style="margin:3px 0 6px 0; font-size:14px; text-decoration:underline;">कंत्राटदार कार्य अहवाल</h3>';
                    h += '</div>';
                    h += '<div style="display:flex; justify-content:space-between; font-size:11.5px; margin-bottom:4px;">';
                    h += '  <span><b>कंत्राटदार:</b> ' + subVal + '</span><span><b>दिनांक:</b> ' + today + '</span>';
                    h += '</div><table class="print-table"><thead><tr>';
                    h += '  <th style="width:1%; white-space:nowrap;">अ.क्र.</th>';
                    h += '  <th>कॉन्ट्रॅक्टर / एजन्सीचे नाव</th>';
                    h += '  <th>कामाचे नाव</th>';
                    h += '  <th>कनिष्ठ अभियंता (JE)</th>';
                    h += '  <th style="width:1%; white-space:nowrap;">M.B. क्रमांक</th>';
                    h += '  <th style="width:1%; white-space:nowrap;">M.B. साईज</th>';
                    h += '</tr></thead><tbody>';

                    if (filteredContractors.length === 0) {
                      h += '<tr><td colspan="6" style="text-align:center; padding:10px;">नोंद उपलब्ध नाही.</td></tr>';
                    } else {
                      for (var i = 0; i < filteredContractors.length; i++) {
                        var w = filteredContractors[i];
                        h += '<tr>';
                        h += '  <td style="text-align:center;">' + (i + 1) + '</td>';
                        h += '  <td>' + (w.contractor || w.agency || '-') + '</td>';
                        h += '  <td>' + (w.workName || w.work || '-') + '</td>';
                        h += '  <td>' + (w.jeName || w.assignedTo || '-') + '</td>';
                        h += '  <td style="text-align:center;">' + (w.mbNumber || w.mbNo || '-') + '</td>';
                        h += '  <td style="text-align:center;">' + (w.size || w.mbSize || 'लहान') + '</td>';
                        h += '</tr>';
                      }
                    }
                    h += '</tbody></table>';
                    triggerA4Print(h);
                  }
                }
              }
            }, true);

            // ५. बॅकअप व रिस्टोअर इव्हेंट्स
            document.addEventListener('click', function(e) {
              var btn = e.target.closest('button, a');
              if (!btn) return;
              var t = (btn.textContent || btn.value || '').trim().toUpperCase();

              if (t.includes('BACKUP SAVE') || t === 'BACKUP') {
                e.preventDefault();
                e.stopPropagation();
                var data = {};
                for (var i = 0; i < localStorage.length; i++) {
                  var k = localStorage.key(i);
                  data[k] = localStorage.getItem(k);
                }
                var json = JSON.stringify(data, null, 2);
                if (window.MBMSAndroid && window.MBMSAndroid.saveBackupToDownloads) {
                  window.MBMSAndroid.saveBackupToDownloads(json);
                }
                return;
              }

              if (t.includes('BACKUP RESTORE') || t === 'RESTORE') {
                e.preventDefault();
                e.stopPropagation();
                if (window.MBMSAndroid && window.MBMSAndroid.openBackupPicker) {
                  window.MBMSAndroid.openBackupPicker();
                }
                return;
              }
            }, true);

            window.applyRestoredData = function(jsonStr) {
              try {
                var obj = JSON.parse(jsonStr);
                for (var key in obj) {
                  localStorage.setItem(key, obj[key]);
                }
                alert('डेटा १००% यशस्वीपणे पूर्ववत (Restore) झाला आहे!');
                location.reload();
              } catch(err) {
                alert('त्रुटी: अवैध फाईल!');
              }
            };
          })();
          </script>
          """

          if "</body>" in raw_html.lower():
              idx = raw_html.lower().rfind("</body>")
              raw_html = raw_html[:idx] + patch_code + raw_html[idx:]
          else:
              raw_html += patch_code

          html_file.write_text(raw_html, encoding="utf-8")
          print("SUCCESS: Unified Architecture Applied.")
          PY

      - name: Create Android project structure
        shell: bash
        run: |
          set -e
          rm -rf mbms_android release
          mkdir -p \
            mbms_android/app/src/main/assets \
            mbms_android/app/src/main/java/com/mbms/app \
            mbms_android/app/src/main/res/values \
            release

          cp mbms_work/index.html mbms_android/app/src/main/assets/index.html

          cat > mbms_android/settings.gradle <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal(); }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral(); }
          }
          rootProject.name = "MBMSAndroid"
          include(":app")
          EOF

          cat > mbms_android/build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.6.1' apply false }
          EOF

          cat > mbms_android/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat > mbms_android/app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.mbms.app'
              compileSdk 35
              defaultConfig {
                  applicationId 'com.mbms.app'
                  minSdk 24
                  targetSdk 35
                  versionCode 152
                  versionName 'V152'
              }
              buildTypes {
                  debug {
                      minifyEnabled false
                      shrinkResources false
