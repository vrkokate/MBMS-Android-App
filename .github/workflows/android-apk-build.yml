name: MBMS Android APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    name: Build MBMS V115 APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'

      - name: Find MBMS HTML
        shell: bash
        run: |
          set -e

          HTML_FILE=""

          if [ -f "Measurement_Book_Management_System_FINAL_V115_MB_HISTORY_ONLY_DATE-6.html" ]; then
            HTML_FILE="Measurement_Book_Management_System_FINAL_V115_MB_HISTORY_ONLY_DATE-6.html"
          elif [ -f "Measurement_Book_Management_System_FINAL_V115.html" ]; then
            HTML_FILE="Measurement_Book_Management_System_FINAL_V115.html"
          elif [ -f "V115.html" ]; then
            HTML_FILE="V115.html"
          elif [ -f "index.html" ]; then
            HTML_FILE="index.html"
          else
            HTML_FILE="$(find . -maxdepth 2 -type f -iname '*.html' | head -n 1)"
          fi

          if [ -z "$HTML_FILE" ]; then
            echo "ERROR: MBMS HTML file not found."
            exit 1
          fi

          echo "HTML file found: $HTML_FILE"

          SIZE=$(wc -c < "$HTML_FILE")
          echo "HTML size: $SIZE bytes"

          if [ "$SIZE" -lt 10000 ]; then
            echo "ERROR: HTML file is unexpectedly small."
            exit 1
          fi

          echo "MBMS_HTML=$HTML_FILE" >> "$GITHUB_ENV"

      - name: Validate V115 HTML
        shell: bash
        run: |
          set -e

          FILE="$MBMS_HTML"

          grep -qi "<html" "$FILE"
          grep -qi "</html>" "$FILE"

          echo "V115 HTML validation PASSED."

      - name: Create Android project
        shell: bash
        run: |
          set -e

          rm -rf mbms_android

          mkdir -p mbms_android/app/src/main/assets
          mkdir -p mbms_android/app/src/main/java/com/mbms/app
          mkdir -p mbms_android/app/src/main/res/values

          cp "$MBMS_HTML" \
            mbms_android/app/src/main/assets/index.html

      - name: Create Android project files
        shell: bash
        run: |

          cat > mbms_android/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "MBMS-Android-App"
          include(":app")
          EOF

          cat > mbms_android/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF

          cat > mbms_android/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat > mbms_android/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.mbms.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.mbms.app'
                  minSdk 26
                  targetSdk 35
                  versionCode 115
                  versionName '1.15'
              }

              buildTypes {
                  debug {
                      minifyEnabled false
                  }

                  release {
                      minifyEnabled false
                      shrinkResources false
                      proguardFiles(
                          getDefaultProguardFile('proguard-android-optimize.txt'),
                          'proguard-rules.pro'
                      )
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat > mbms_android/app/proguard-rules.pro <<'EOF'
          # MBMS WebView application
          EOF

          cat > mbms_android/app/src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">MBMS</string>
          </resources>
          EOF

          cat > mbms_android/app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:statusBarColor">#1565C0</item>
                  <item name="android:navigationBarColor">#000000</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>
          </resources>
          EOF

          cat > mbms_android/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:allowBackup="true"
                  android:hardwareAccelerated="true"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cat > mbms_android/app/src/main/java/com/mbms/app/MainActivity.java <<'EOF'
          package com.mbms.app;

          import android.annotation.SuppressLint;
          import android.app.Activity;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {

              private WebView webView;

              @SuppressLint("SetJavaScriptEnabled")
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  getWindow().setStatusBarColor(
                          Color.rgb(21, 101, 192)
                  );

                  getWindow().setNavigationBarColor(
                          Color.BLACK
                  );

                  webView = new WebView(this);

                  WebSettings settings = webView.getSettings();

                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);
                  settings.setDatabaseEnabled(true);
                  settings.setBuiltInZoomControls(false);
                  settings.setDisplayZoomControls(false);
                  settings.setSupportZoom(false);
                  settings.setLoadWithOverviewMode(false);
                  settings.setUseWideViewPort(false);

                  webView.setWebViewClient(new WebViewClient());
                  webView.setWebChromeClient(new WebChromeClient());

                  webView.setVerticalScrollBarEnabled(false);
                  webView.setHorizontalScrollBarEnabled(false);

                  setContentView(webView);

                  webView.loadUrl(
                          "file:///android_asset/index.html"
                  );
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }

              @Override
              protected void onDestroy() {
                  if (webView != null) {
                      webView.loadUrl("about:blank");
                      webView.stopLoading();
                      webView.setWebChromeClient(null);
                      webView.setWebViewClient(null);
                      webView.destroy();
                      webView = null;
                  }

                  super.onDestroy();
              }
          }
          EOF

      - name: Verify Android project
        shell: bash
        run: |
          set -e

          test -s mbms_android/app/src/main/assets/index.html
          test -f mbms_android/settings.gradle
          test -f mbms_android/build.gradle
          test -f mbms_android/app/build.gradle
          test -f mbms_android/app/src/main/AndroidManifest.xml
          test -f mbms_android/app/src/main/java/com/mbms/app/MainActivity.java

          echo "Android project verification PASSED."

      - name: Build MBMS Debug APK
        working-directory: mbms_android
        run: |
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="mbms_android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          echo "APK created:"
          ls -lh "$APK"

          echo "Checking APK ZIP integrity..."

          unzip -t "$APK" >/dev/null

          echo "APK ZIP integrity PASSED."

          echo "Checking APK contents..."

          unzip -l "$APK" | grep -q "AndroidManifest.xml"
          unzip -l "$APK" | grep -q "classes.dex"

          echo "APK structure verification PASSED."

          echo "SHA-256:"
          sha256sum "$APK"

      - name: Prepare APK
        shell: bash
        run: |
          set -e

          mkdir -p release

          cp \
            mbms_android/app/build/outputs/apk/debug/app-debug.apk \
            release/MeasurementBookManagementSystem-V115.apk

          sha256sum \
            release/MeasurementBookManagementSystem-V115.apk \
            > release/SHA256.txt

          echo "Release prepared:"
          ls -lh release

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: MeasurementBookManagementSystem-V115-APK
          path: release/
          if-no-files-found: error
          retention-days: 30

      - name: Build Success
        run: |
          echo "========================================"
          echo " MBMS V115 APK BUILD SUCCESSFUL"
          echo "========================================"
          echo "APK: MeasurementBookManagementSystem-V115.apk"
          echo "========================================"
