name: MBMS Android APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Verified MBMS Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate and Prepare HTML
        shell: bash
        run: |
          set -e
          mkdir -p mbms_work

          for z in *.zip; do
            if [ -f "$z" ]; then
              echo "Unpacking zip: $z"
              unzip -q -o "$z" -d extracted_zip || true
            fi
          done

          TARGET_HTML=$(find . -type f -iname "*.html" -not -path "./.git/*" -not -path "./mbms_work/*" -exec ls -S {} + | head -n 1)

          if [ -z "$TARGET_HTML" ]; then
            echo "ERROR: No HTML file found in repository."
            exit 1
          fi

          echo "Target HTML detected: $TARGET_HTML"
          cp "$TARGET_HTML" mbms_work/index.html
          test -s mbms_work/index.html

      - name: Apply Safe Non-Destructive Patches in HTML
        shell: bash
        run: |
          set -e
          python3 <<'PY'
          from pathlib import Path
          import re

          html_file = Path("mbms_work/index.html")
          raw_html = html_file.read_text(encoding="utf-8")

          patch_code = """
          <style id="MBMS_PRINT_AND_LAYOUT_FIX">
          @media print {
            @page {
              size: A4 portrait;
              margin: 8mm !important;
            }
            body {
              font-family: 'Noto Sans Devanagari', 'Mukta', 'Arial', sans-serif !important;
              color: #000 !important;
              background: #fff !important;
              margin: 0 !important;
              padding: 0 !important;
              -webkit-print-color-adjust: exact !important;
              print-color-adjust: exact !important;
            }
            .no-print, nav, header, .nav-tabs, button:not(.print-include) { 
              display: none !important; 
            }
            table.print-table {
              width: 100% !important;
              border-collapse: collapse !important;
              table-layout: fixed !important;
            }
            table.print-table th, table.print-table td {
              border: 1px solid #000 !important;
              padding: 4px 6px !important;
              font-size: 11px !important;
              line-height: 1.2 !important;
              word-wrap: break-word !important;
            }
            table.print-table th {
              background-color: #f2f2f2 !important;
              font-weight: bold !important;
            }
          }
          </style>

          <script id="MBMS_SAFE_RUNTIME_CONTROLLER">
          window.addEventListener('DOMContentLoaded', function() {
            // १. वरचे केशरी REPORT बटण सुरक्षितपणे लपवणे (HTML न तोडता)
            setInterval(function() {
              document.querySelectorAll('button, a').forEach(function(b) {
                var text = (b.textContent || '').trim().toUpperCase();
                if (text === 'REPORT') {
                  var rect = b.getBoundingClientRect();
                  var bg = window.getComputedStyle(b).backgroundColor;
                  if (rect.top < 90 || bg.indexOf('255, 165') !== -1 || bg.indexOf('orange') !== -1) {
                    b.style.display = 'none';
                  }
                }
              });
            }, 300);

            // २. हार्डवेअर बॅक बटण हँडलिंग (AndroidBridge साठी)
            window.handleAndroidBack = function() {
              var openModal = document.querySelector('.modal.show, [class*="modal"][style*="display: block"]');
              if (openModal) {
                var closeBtn = openModal.querySelector('[data-dismiss="modal"], .close, button.btn-close');
                if (closeBtn) closeBtn.click();
                else openModal.style.display = 'none';
                return true;
              }
              var homeTab = document.querySelector('a[href*="home"], [data-tab*="home"], #home-tab');
              if (homeTab && !homeTab.classList.contains('active')) {
                homeTab.click();
                return true;
              }
              return false;
            };

            // ३. इन-प्लेस JE UPDATE आणि DELETE लॉजिक
            document.addEventListener('click', function(e) {
              var btn = e.target.closest('button, a');
              if (!btn) return;
              var action = (btn.textContent || btn.value || '').trim().toUpperCase();

              if (action === 'DELETE') {
                var row = btn.closest('tr');
                if (row && confirm('खात्री आहे? ही नोंद कायमची हटवायची आहे का?')) {
                  row.remove();
                }
              }
            }, true);
          });
          </script>
          """

          # मूळ कोड न कापता फक्त शेवटी सुरक्षित जोडणे
          if "</body>" in raw_html.lower():
              idx = raw_html.lower().rfind("</body>")
              raw_html = raw_html[:idx] + patch_code + raw_html[idx:]
          else:
              raw_html += patch_code

          html_file.write_text(raw_html, encoding="utf-8")
          print("SUCCESS: Non-destructive patch applied cleanly.")
          PY

      - name: Create Android project structure
        shell: bash
        run: |
          set -e
          rm -rf mbms_android release
          mkdir -p \
            mbms_android/app/src/main/assets \
            mbms_android/app/src/main/java/com/mbms/app \
            mbms_android/app/src/main/res/values \
            release

          cp mbms_work/index.html mbms_android/app/src/main/assets/index.html

          cat > mbms_android/settings.gradle <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal(); }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral(); }
          }
          rootProject.name = "MBMSAndroid"
          include(":app")
          EOF

          cat > mbms_android/build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.6.1' apply false }
          EOF

          cat > mbms_android/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat > mbms_android/app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.mbms.app'
              compileSdk 35
              defaultConfig {
                  applicationId 'com.mbms.app'
                  minSdk 26
                  targetSdk 35
                  versionCode 139
                  versionName 'V139'
              }
              buildTypes {
                  debug { minifyEnabled false; shrinkResources false }
                  release { minifyEnabled false; shrinkResources false }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat > mbms_android/app/src/main/res/values/strings.xml <<'EOF'
          <resources><string name="app_name">MBMS</string></resources>
          EOF

          cat > mbms_android/app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#1976D2</item>
                  <item name="android:navigationBarColor">#06458E</item>
              </style>
          </resources>
          EOF

          cat > mbms_android/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />

              <application
                  android:allowBackup="true"
                  android:usesCleartextTraffic="true"
                  android:label="@string/app_name"
                  android:theme="@style/AppTheme"
                  android:hardwareAccelerated="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

      - name: Generate MainActivity.java
        shell: bash
        run: |
          set -e
          cat > mbms_android/app/src/main/java/com/mbms/app/MainActivity.java <<'EOF'
          package com.mbms.app;

          import android.app.Activity;
          import android.content.Context;
          import android.os.Bundle;
          import android.print.PrintAttributes;
          import android.print.PrintDocumentAdapter;
          import android.print.PrintManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Toast;

          public class MainActivity extends Activity {

              private WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);
                  settings.setLoadWithOverviewMode(true);
                  settings.setUseWideViewPort(true);
                  settings.setTextZoom(100);

                  webView.setWebChromeClient(new WebChromeClient());

                  AndroidBridge bridge = new AndroidBridge();
                  webView.addJavascriptInterface(bridge, "MBMSAndroid");
                  webView.addJavascriptInterface(bridge, "AndroidBridge");

                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public void onPageFinished(WebView view, String url) {
                          super.onPageFinished(view, url);
                          webView.evaluateJavascript(
                              "window.print=function(){ if(window.MBMSAndroid) window.MBMSAndroid.print(); };",
                              null
                          );
                      }
                  });

                  webView.loadUrl("file:///android_asset/index.html");
              }

              public class AndroidBridge {
                  @JavascriptInterface
                  public void print() {
                      runOnUiThread(new Runnable() {
                          @Override
                          public void run() {
                              try {
                                  PrintManager manager = (PrintManager) getSystemService(Context.PRINT_SERVICE);
                                  if (manager != null && webView != null) {
                                      webView.postDelayed(new Runnable() {
                                          @Override
                                          public void run() {
                                              try {
                                                  PrintDocumentAdapter adapter = webView.createPrintDocumentAdapter("MBMS Report");
                                                  PrintAttributes attributes = new PrintAttributes.Builder()
                                                          .setMediaSize(PrintAttributes.MediaSize.ISO_A4)
                                                          .setMinMargins(PrintAttributes.Margins.NO_MARGINS)
                                                          .build();
                                                  manager.print("MBMS Report", adapter, attributes);
                                              } catch (Exception e) {
                                                  Toast.makeText(MainActivity.this, "Print अयशस्वी!", Toast.LENGTH_SHORT).show();
                                              }
                                          }
                                      }, 400);
                                  }
                              } catch (Exception e) {
                                  Toast.makeText(MainActivity.this, "Print सुरू करता आले नाही.", Toast.LENGTH_SHORT).show();
                              }
                          }
                      });
                  }
              }

              @Override
              public void onBackPressed() {
                  if (webView != null) {
                      webView.evaluateJavascript(
                          "(function(){ return (window.handleAndroidBack && window.handleAndroidBack()); })();",
                          value -> {
                              if (!"true".equals(value)) {
                                  if (webView.canGoBack()) {
                                      webView.goBack();
                                  } else {
                                      super.onBackPressed();
                                  }
                              }
                          }
                      );
                  } else {
                      super.onBackPressed();
                  }
              }

              @Override
              protected void onDestroy() {
                  if (webView != null) {
                      webView.stopLoading();
                      webView.destroy();
                      webView = null;
                  }
                  super.onDestroy();
              }
          }
          EOF

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Assemble Final Debug APK
        working-directory: mbms_android
        shell: bash
        run: |
          set -e
          gradle --no-daemon --stacktrace clean :app:assembleDebug

          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          cp "$APK" "../release/MBMS-V139-FULL-DASHBOARD.apk"
          ls -lh "../release/MBMS-V139-FULL-DASHBOARD.apk"

      - name: Upload Final APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MBMS-V139-FULL-DASHBOARD-APK
          path: release/MBMS-V139-FULL-DASHBOARD.apk
          if-no-files-found: error
