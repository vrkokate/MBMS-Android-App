name: MBMS V118 Android APK Build - FINAL STABLE

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:

  build-apk:

    name: Build MBMS V118 APK

    runs-on: ubuntu-latest

    steps:

      # =====================================================
      # 1. CHECKOUT
      # =====================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # =====================================================
      # 2. JAVA 17
      # =====================================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # =====================================================
      # 3. ANDROID SDK
      # =====================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |

          set -e

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "Android SDK READY"


      # =====================================================
      # 4. GRADLE 8.7
      # =====================================================

      - name: Install Gradle 8.7
        shell: bash
        run: |

          set -e

          wget -q \
            https://services.gradle.org/distributions/gradle-8.7-bin.zip

          unzip -q \
            gradle-8.7-bin.zip \
            -d "$HOME/gradle"

          echo "$HOME/gradle/gradle-8.7/bin" \
            >> "$GITHUB_PATH"

          "$HOME/gradle/gradle-8.7/bin/gradle" \
            --version


      # =====================================================
      # 5. LOCATE ORIGINAL MBMS HTML
      #
      # IMPORTANT:
      # We prefer the previously successful V115 baseline.
      # We do NOT require a V118 HTML filename.
      # =====================================================

      - name: Locate MBMS HTML
        shell: bash
        run: |

          set -e

          HTML_FILE=""


          # -------------------------------------------------
          # Previously successful MBMS baseline
          # -------------------------------------------------

          for f in \
            "Measurement_Book_Management_System_FINAL_V115_MB_HISTORY_ONLY_DATE-6.html" \
            "Measurement_Book_Management_System_FINAL_V115.html" \
            "V115.html"
          do

            if [ -f "$f" ]; then

              HTML_FILE="$f"

              break

            fi

          done


          # -------------------------------------------------
          # If V115 is not present, accept V118
          # -------------------------------------------------

          if [ -z "$HTML_FILE" ]; then

            for f in \
              "Measurement_Book_Management_System_FINAL_V118_PRINT_BACKUP_ANDROID.html" \
              "Measurement_Book_Management_System_FINAL_V118.html" \
              "V118.html"
            do

              if [ -f "$f" ]; then

                HTML_FILE="$f"

                break

              fi

            done

          fi


          # -------------------------------------------------
          # Last safe fallback: any HTML in repository
          # -------------------------------------------------

          if [ -z "$HTML_FILE" ]; then

            HTML_FILE=$(find . \
              -type f \
              -iname "*.html" \
              -not -path "./.git/*" \
              | head -n 1 || true)

          fi


          if [ -z "$HTML_FILE" ]; then

            echo "ERROR: No MBMS HTML file found."

            echo ""
            echo "Available repository files:"

            find . \
              -maxdepth 4 \
              -type f \
              -not -path "./.git/*" \
              | sort \
              | head -n 300

            exit 1

          fi


          echo "=========================================="

          echo "MBMS HTML FOUND"

          echo "=========================================="

          echo "$HTML_FILE"

          echo "=========================================="


          echo "HTML_FILE=$HTML_FILE" \
            >> "$GITHUB_ENV"


      # =====================================================
      # 6. CREATE PROJECT DIRECTORIES
      # =====================================================

      - name: Create Android project directories
        shell: bash
        run: |

          set -e

          rm -rf mbms_android

          rm -rf release

          mkdir -p \
            mbms_android/app/src/main/java/com/mbms/app

          mkdir -p \
            mbms_android/app/src/main/res/values

          mkdir -p \
            mbms_android/app/src/main/assets


      # =====================================================
      # 7. COPY ORIGINAL MBMS HTML
      #
      # NO destructive HTML patching.
      # =====================================================

      - name: Prepare MBMS HTML
        shell: bash
        run: |

          set -e

          cp \
            "$HTML_FILE" \
            mbms_android/app/src/main/assets/index.html


          test -s \
            mbms_android/app/src/main/assets/index.html


          echo "MBMS HTML size:"

          wc -c \
            mbms_android/app/src/main/assets/index.html


          echo ""
          echo "Checking original MBMS functions..."


          grep -q \
            "function generateWorkReport" \
            mbms_android/app/src/main/assets/index.html


          grep -q \
            "function downloadSettingsBackup" \
            mbms_android/app/src/main/assets/index.html


          grep -q \
            "function restoreSettingsBackup" \
            mbms_android/app/src/main/assets/index.html


          echo "Original MBMS HTML validation PASSED."


      # =====================================================
      # 8. SETTINGS.GRADLE
      # =====================================================

      - name: Create settings.gradle
        shell: bash
        run: |

          cat > mbms_android/settings.gradle <<'EOF'

          pluginManagement {

              repositories {

                  google()

                  mavenCentral()

                  gradlePluginPortal()

              }

          }


          dependencyResolutionManagement {

              repositoriesMode.set(
                  RepositoriesMode.FAIL_ON_PROJECT_REPOS
              )

              repositories {

                  google()

                  mavenCentral()

              }

          }


          rootProject.name = "MBMSAndroid"

          include(":app")

          EOF


      # =====================================================
      # 9. ROOT BUILD.GRADLE
      # =====================================================

      - name: Create root build.gradle
        shell: bash
        run: |

          cat > mbms_android/build.gradle <<'EOF'

          plugins {

              id 'com.android.application' version '8.6.1' apply false

          }

          EOF


      # =====================================================
      # 10. GRADLE PROPERTIES
      # =====================================================

      - name: Create gradle.properties
        shell: bash
        run: |

          cat > mbms_android/gradle.properties <<'EOF'

          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

          EOF


      # =====================================================
      # 11. APP BUILD.GRADLE
      # =====================================================

      - name: Create app build.gradle
        shell: bash
        run: |

          cat > mbms_android/app/build.gradle <<'EOF'

          plugins {

              id 'com.android.application'

          }


          android {

              namespace 'com.mbms.app'

              compileSdk 35


              defaultConfig {

                  applicationId 'com.mbms.app'

                  minSdk 26

                  targetSdk 35

                  versionCode 118

                  versionName 'V118'

              }


              buildTypes {

                  debug {

                      minifyEnabled false

                  }


                  release {

                      minifyEnabled false

                      shrinkResources false

                  }

              }


              compileOptions {

                  sourceCompatibility JavaVersion.VERSION_17

                  targetCompatibility JavaVersion.VERSION_17

              }

          }

          EOF


      # =====================================================
      # 12. STRINGS
      # =====================================================

      - name: Create strings.xml
        shell: bash
        run: |

          cat > mbms_android/app/src/main/res/values/strings.xml <<'EOF'

          <resources>

              <string name="app_name">
                  Measurement Book Management System
              </string>

          </resources>

          EOF


      # =====================================================
      # 13. STYLES
      # =====================================================

      - name: Create styles.xml
        shell: bash
        run: |

          cat > mbms_android/app/src/main/res/values/styles.xml <<'EOF'

          <resources>

              <style
                  name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">

                  <item name="android:fontFamily">
                      sans
                  </item>

                  <item name="android:colorAccent">
                      #1976D2
                  </item>

                  <item name="android:navigationBarColor">
                      #0D47A1
                  </item>

              </style>

          </resources>

          EOF


      # =====================================================
      # 14. ANDROID MANIFEST
      # =====================================================

      - name: Create AndroidManifest.xml
        shell: bash
        run: |

          cat > mbms_android/app/src/main/AndroidManifest.xml <<'EOF'

          <?xml version="1.0" encoding="utf-8"?>

          <manifest
              xmlns:android="http://schemas.android.com/apk/res/android">


              <application

                  android:allowBackup="true"

                  android:label="@string/app_name"

                  android:theme="@style/AppTheme"

                  android:usesCleartextTraffic="true">


                  <activity

                      android:name=".MainActivity"

                      android:screenOrientation="portrait"

                      android:exported="true">


                      <intent-filter>

                          <action
                              android:name="android.intent.action.MAIN" />

                          <category
                              android:name="android.intent.category.LAUNCHER" />

                      </intent-filter>


                  </activity>


              </application>


          </manifest>

          EOF


      # =====================================================
      # 15. MAIN ACTIVITY
      #
      # Native Android bridge:
      # PRINT
      # BACKUP SAVE
      # BACKUP RESTORE
      # FILE PICKER
      # =====================================================

      - name: Create MainActivity.java
        shell: bash
        run: |

          cat > mbms_android/app/src/main/java/com/mbms/app/MainActivity.java <<'EOF'

          package com.mbms.app;


          import android.app.Activity;
          import android.content.ContentValues;
          import android.content.Context;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Environment;
          import android.provider.MediaStore;
          import android.print.PrintAttributes;
          import android.print.PrintManager;
          import android.webkit.DownloadListener;
          import android.webkit.JavascriptInterface;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Toast;


          import java.io.ByteArrayOutputStream;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.InputStream;
          import java.io.OutputStream;
          import java.nio.charset.StandardCharsets;


          public class MainActivity extends Activity {


              private static final int REQUEST_RESTORE = 9101;

              private static final int REQUEST_FILE = 9102;


              private WebView webView;

              private ValueCallback<Uri[]> filePathCallback;


              @Override
              protected void onCreate(
                      Bundle savedInstanceState) {


                  super.onCreate(savedInstanceState);


                  webView = new WebView(this);

                  setContentView(webView);


                  WebSettings settings =
                          webView.getSettings();


                  settings.setJavaScriptEnabled(true);

                  settings.setDomStorageEnabled(true);

                  settings.setAllowFileAccess(true);

                  settings.setAllowContentAccess(true);

                  settings.setBuiltInZoomControls(false);

                  settings.setDisplayZoomControls(false);

                  settings.setSupportZoom(false);


                  webView.setWebViewClient(
                          new WebViewClient());


                  webView.addJavascriptInterface(

                          new AndroidBridge(),

                          "MBMSAndroid");


                  webView.setWebChromeClient(

                          new WebChromeClient() {

                              @Override
                              public boolean onShowFileChooser(

                                      WebView view,

                                      ValueCallback<Uri[]> callback,

                                      FileChooserParams params) {


                                  if (filePathCallback != null) {

                                      filePathCallback
                                              .onReceiveValue(null);

                                  }


                                  filePathCallback = callback;


                                  try {

                                      Intent intent =
                                              new Intent(
                                                  Intent.ACTION_OPEN_DOCUMENT);


                                      intent.addCategory(
                                              Intent.CATEGORY_OPENABLE);


                                      intent.setType("*/*");


                                      startActivityForResult(

                                              intent,

                                              REQUEST_FILE);


                                      return true;

                                  }

                                  catch (Exception e) {

                                      filePathCallback = null;

                                      return false;

                                  }

                              }

                          });


                  webView.setDownloadListener(

                          new DownloadListener() {

                              @Override
                              public void onDownloadStart(

                                      String url,

                                      String userAgent,

                                      String contentDisposition,

                                      String mimeType,

                                      long contentLength) {


                                  try {

                                      Intent intent =
                                              new Intent(
                                                  Intent.ACTION_VIEW);

                                      intent.setData(
                                              Uri.parse(url));

                                      startActivity(intent);

                                  }

                                  catch (Exception e) {

                                      Toast.makeText(

                                              MainActivity.this,

                                              "Download सुरू करता आले नाही.",

                                              Toast.LENGTH_LONG).show();

                                  }

                              }

                          });


                  webView.setBackgroundColor(
                          android.graphics.Color.WHITE);


                  webView.loadUrl(
                          "file:///android_asset/index.html");

              }


              // =================================================
              // PAGE FINISHED
              // Inject only Android compatibility layer.
              // Original MBMS HTML remains unchanged.
              // =================================================

              private void injectAndroidCompatibility() {


                  if (webView == null) {
                      return;
                  }


                  String script =

                          "(function(){"

                        + "if(window.__MBMS_ANDROID_V118__)return;"

                        + "window.__MBMS_ANDROID_V118__=true;"

                        + ""

                        + "var style=document.createElement('style');"

                        + "style.id='MBMS_ANDROID_V118_STYLE';"

                        + "style.textContent="

                        + "'@media print{'"

                        + "+'@page{size:A4 portrait;margin:0}'"

                        + "+'html,body{width:210mm;background:#fff}'"

                        + "+'.a4-page{width:210mm;min-height:297mm;box-sizing:border-box}'"

                        + "+'.a4-table{width:100%;border-collapse:collapse;'"

                        + "font-size:9.2pt;table-layout:fixed}'"

                        + "+'.a4-table th,.a4-table td{'"

                        + "border:1px solid #111;padding:2.5mm 1.8mm;'"

                        + "vertical-align:top;overflow-wrap:anywhere;'"

                        + "line-height:1.25}'"

                        + "+'.a4-table th{text-align:center;vertical-align:middle}'"

                        + "+'.work-report-table th:nth-child(1),'"

                        + "+'.work-report-table td:nth-child(1){width:9mm}'"

                        + "+'.work-report-table th:nth-child(2),'"

                        + "+'.work-report-table td:nth-child(2){width:31mm}'"

                        + "+'.work-report-table th:nth-child(3),'"

                        + "+'.work-report-table td:nth-child(3){width:28mm}'"

                        + "+'.work-report-table th:nth-child(4),'"

                        + "+'.work-report-table td:nth-child(4){width:27mm}'"

                        + "+'.work-report-table th:nth-child(5),'"

                        + "+'.work-report-table td:nth-child(5){width:23mm}'"

                        + "+'.work-report-table th:nth-child(6),'"

                        + "+'.work-report-table td:nth-child(6){width:19mm}'"

                        + "+'.work-report-table th:nth-child(7),'"

                        + "+'.work-report-table td:nth-child(7){width:22mm}'"

                        + "+'.work-report-table th:nth-child(8),'"

                        + "+'.work-report-table td:nth-child(8){width:23mm}'"

                        + "+'}';"

                        + "document.head.appendChild(style);"

                        + ""

                        + "function fixReport(){"

                        + "var area=document.getElementById('printArea');"

                        + "if(!area)return;"

                        + "var tables=area.querySelectorAll('table.a4-table');"

                        + "for(var i=0;i<tables.length;i++){"

                        + "var table=tables[i];"

                        + "var bodyRow=table.querySelector('tbody tr');"

                        + "var headRow=table.querySelector('thead tr');"

                        + "if(!bodyRow||!headRow)continue;"

                        + "var cells=bodyRow.querySelectorAll('td');"

                        + "table.classList.add('work-report-table');"

                        + "var labels=["

                        + "'अ.क्र.',"

                        + "'कामाचे नाव',"

                        + "'कॉन्ट्रॅक्टर / एजन्सी',"

                        + "'JE चे नाव',"

                        + "'MB क्रमांक',"

                        + "'काम पूर्ण?',"

                        + "'Bill प्रकार',"

                        + "'Bill रक्कम (₹)'"

                        + "];"

                        + "while(headRow.children.length<cells.length){"

                        + "var th=document.createElement('th');"

                        + "th.textContent=labels[headRow.children.length]||'';"

                        + "headRow.appendChild(th);"

                        + "}"

                        + "}"

                        + "}"

                        + ""

                        + "fixReport();"

                        + ""

                        + "var printArea="

                        + "document.getElementById('printArea');"

                        + "if(printArea){"

                        + "new MutationObserver(function(){"

                        + "fixReport();"

                        + "}).observe(printArea,{childList:true,subtree:true});"

                        + "}"

                        + ""

                        + "window.print=function(){"

                        + "try{"

                        + "if(window.MBMSAndroid&&"

                        + "typeof window.MBMSAndroid.print==='function'){"

                        + "fixReport();"

                        + "window.MBMSAndroid.print();"

                        + "return;"

                        + "}"

                        + "}catch(e){}"

                        + "};"

                        + ""

                        + "window.downloadSettingsBackup=function(){"

                        + "try{"

                        + "var data=JSON.stringify("

                        + "window.mbmsSettingsSnapshot(),null,2);"

                        + "var filename="

                        + "'MBMS_Backup_'"

                        + "+new Date().toISOString().slice(0,10)"

                        + "+'_'+Date.now()+'.json';"

                        + "if(window.MBMSAndroid&&"

                        + "typeof window.MBMSAndroid.saveBackup==='function'){"

                        + "window.MBMSAndroid.saveBackup(data,filename);"

                        + "return;"

                        + "}"

                        + "}catch(e){"

                        + "alert('Backup Save करण्यात अडचण आली.');"

                        + "}"

                        + "};"

                        + ""

                        + "window.restoreSettingsBackupText=function(text){"

                        + "try{"

                        + "var obj=JSON.parse(String(text||''));"

                        + "if(!obj||!obj.data||"

                        + "!Array.isArray(obj.data.mb)||"

                        + "!Array.isArray(obj.data.je)||"

                        + "!Array.isArray(obj.data.work)||"

                        + "!Array.isArray(obj.data.assignment)||"

                        + "!Array.isArray(obj.data.bills)||"

                        + "!Array.isArray(obj.data.transfer)){"

                        + "throw new Error('Invalid backup');"

                        + "}"

                        + "if(!confirm("

                        + "'Backup मधील पूर्ण data restore करायचा आहे का?\\n\\n'"

                        + "+'सध्याचा MBMS data replace होईल.'"

                        + ")){return;}"

                        + "saveMBs(obj.data.mb);"

                        + "saveJEs(obj.data.je);"

                        + "saveWorkList(obj.data.work);"

                        + "saveAssignments(obj.data.assignment);"

                        + "saveBills(obj.data.bills);"

                        + "saveTransferHistory(obj.data.transfer);"

                        + "try{renderMBSummary();}catch(e){}"

                        + "try{loadWorkOptions();renderWorkList();}catch(e){}"

                        + "try{loadAssignOptions();renderAssignments();}catch(e){}"

                        + "try{renderJEList();}catch(e){}"

                        + "try{refreshSettingsDataCheck();}catch(e){}"

                        + "alert('Backup data यशस्वीपणे restore झाला आहे.');"

                        + "}catch(e){"

                        + "alert('ही valid MBMS backup file नाही.');"

                        + "}"

                        + "};"

                        + ""

                        + "window.mbmsNativeRestoreBase64=function(b64){"

                        + "try{"

                        + "var raw=atob(String(b64||''));"

                        + "var bytes=new Uint8Array(raw.length);"

                        + "for(var i=0;i<raw.length;i++){"

                        + "bytes[i]=raw.charCodeAt(i);"

                        + "}"

                        + "var json=new TextDecoder('utf-8').decode(bytes);"

                        + "window.restoreSettingsBackupText(json);"

                        + "}catch(e){"

                        + "alert('Backup Restore करण्यात अडचण आली.');"

                        + "}"

                        + "};"

                        + ""

                        + "var buttons=document.querySelectorAll('button');"

                        + "for(var b=0;b<buttons.length;b++){"

                        + "var label=(buttons[b].textContent||'').trim().toUpperCase();"

                        + "if(label==='BACKUP RESTORE'){"

                        + "buttons[b].onclick=function(){"

                        + "if(window.MBMSAndroid&&"

                        + "typeof window.MBMSAndroid.requestRestore==='function'){"

                        + "window.MBMSAndroid.requestRestore();"

                        + "}else{"

                        + "var input=document.getElementById('settingsBackupFile');"

                        + "if(input)input.click();"

                        + "}"

                        + "};"

                        + "}"

                        + "}"

                        + ""

                        + "})();";


                  webView.evaluateJavascript(
                          script,
                          null);
              }


              public class AndroidBridge {


                  @JavascriptInterface
                  public void print() {


                      runOnUiThread(

                              new Runnable() {

                          @Override
                          public void run() {


                              try {


                                  PrintManager manager =

                                          (PrintManager)

                                          getSystemService(

                                              Context.PRINT_SERVICE);


                                  if (manager == null) {

                                      throw new Exception(
                                              "Print service unavailable");

                                  }


                                  android.print.PrintDocumentAdapter adapter =

                                          webView.createPrintDocumentAdapter(

                                              "MBMS Report");


                                  PrintAttributes attributes =

                                          new PrintAttributes.Builder()

                                              .setMediaSize(

                                                  PrintAttributes
                                                      .MediaSize
                                                      .ISO_A4)

                                              .setMinMargins(

                                                  PrintAttributes
                                                      .Margins
                                                      .NO_MARGINS)

                                              .build();


                                  manager.print(

                                      "MBMS Report",

                                      adapter,

                                      attributes);

                              }

                              catch (Exception e) {


                                  Toast.makeText(

                                      MainActivity.this,

                                      "Print सुरू करता आले नाही.",

                                      Toast.LENGTH_LONG).show();

                              }

                          }

                      });

                  }


                  @JavascriptInterface
                  public void saveBackup(

                          final String json,

                          final String filename) {


                      new Thread(

                              new Runnable() {

                          @Override
                          public void run() {


                              boolean success = false;


                              try {


                                  if (Build.VERSION.SDK_INT >= 29) {


                                      ContentValues values =
                                              new ContentValues();


                                      values.put(

                                          MediaStore.MediaColumns
                                              .DISPLAY_NAME,

                                          filename);


                                      values.put(

                                          MediaStore.MediaColumns
                                              .MIME_TYPE,

                                          "application/json");


                                      values.put(

                                          MediaStore.MediaColumns
                                              .RELATIVE_PATH,

                                          Environment
                                              .DIRECTORY_DOWNLOADS);


                                      values.put(

                                          MediaStore.MediaColumns
                                              .IS_PENDING,

                                          1);


                                      Uri uri =

                                          getContentResolver().insert(

                                              MediaStore
                                                  .Downloads
                                                  .EXTERNAL_CONTENT_URI,

                                              values);


                                      if (uri == null) {

                                          throw new Exception(
                                              "MediaStore insert failed");

                                      }


                                      OutputStream output =

                                          getContentResolver()
                                              .openOutputStream(uri);


                                      if (output == null) {

                                          throw new Exception(
                                              "Output stream unavailable");

                                      }


                                      try {

                                          output.write(

                                              json.getBytes(
                                                  StandardCharsets.UTF_8));

                                          output.flush();

                                      }

                                      finally {

                                          output.close();

                                      }


                                      ContentValues done =
                                              new ContentValues();


                                      done.put(

                                          MediaStore.MediaColumns
                                              .IS_PENDING,

                                          0);


                                      getContentResolver().update(

                                          uri,

                                          done,

                                          null,

                                          null);


                                      success = true;

                                  }

                                  else {


                                      File directory =

                                          Environment
                                              .getExternalStoragePublicDirectory(

                                                  Environment
                                                      .DIRECTORY_DOWNLOADS);


                                      if (!directory.exists() &&
                                          !directory.mkdirs()) {

                                          throw new Exception(
                                              "Downloads unavailable");

                                      }


                                      File file =

                                          new File(
                                              directory,
                                              filename);


                                      FileOutputStream output =

                                          new FileOutputStream(file);


                                      try {

                                          output.write(

                                              json.getBytes(
                                                  StandardCharsets.UTF_8));

                                          output.flush();

                                      }

                                      finally {

                                          output.close();

                                      }


                                      success = true;

                                  }


                              }

                              catch (Exception e) {

                                  e.printStackTrace();

                              }


                              final boolean result =
                                      success;


                              runOnUiThread(

                                      new Runnable() {

                                  @Override
                                  public void run() {


                                      Toast.makeText(

                                          MainActivity.this,

                                          result

                                              ? "Backup Downloads मध्ये Save झाला."

                                              : "Backup Save करण्यात अडचण आली.",

                                          Toast.LENGTH_LONG).show();

                                  }

                              });

                          }

                      }).start();

                  }


                  @JavascriptInterface
                  public void requestRestore() {


                      runOnUiThread(

                              new Runnable() {

                          @Override
                          public void run() {


                              try {


                                  Intent intent =

                                      new Intent(
                                          Intent.ACTION_OPEN_DOCUMENT);


                                  intent.addCategory(

                                      Intent.CATEGORY_OPENABLE);


                                  intent.setType(
                                      "application/json");


                                  startActivityForResult(

                                      intent,

                                      REQUEST_RESTORE);

                              }

                              catch (Exception e) {


                                  Toast.makeText(

                                      MainActivity.this,

                                      "Backup Restore सुरू करता आले नाही.",

                                      Toast.LENGTH_LONG).show();

                              }

                          }

                      });

                  }

              }


              private String readText(Uri uri)
                      throws Exception {


                  InputStream input =

                      getContentResolver()
                          .openInputStream(uri);


                  if (input == null) {

                      throw new Exception(
                          "Cannot open backup file");

                  }


                  try {


                      ByteArrayOutputStream output =

                          new ByteArrayOutputStream();


                      byte[] buffer =
                          new byte[8192];


                      int count;


                      while ((count =
                          input.read(buffer)) != -1) {

                          output.write(
                              buffer,
                              0,
                              count);

                      }


                      return output.toString(
                          StandardCharsets.UTF_8.name());

                  }

                  finally {

                      input.close();

                  }

              }


              private String base64Utf8(String text) {


                  return android.util.Base64
                      .encodeToString(

                          text.getBytes(
                              StandardCharsets.UTF_8),

                          android.util.Base64.NO_WRAP);

              }


              @Override
              protected void onActivityResult(

                      int requestCode,

                      int resultCode,

                      Intent data) {


                  super.onActivityResult(

                      requestCode,
                      resultCode,
                      data);


                  if (requestCode == REQUEST_RESTORE) {


                      if (resultCode == RESULT_OK &&
                          data != null &&
                          data.getData() != null) {


                          try {


                              String json =
                                  readText(
                                      data.getData());


                              String encoded =
                                  base64Utf8(json);


                              String js =

                                  "(function(){"

                                + "if(window.mbmsNativeRestoreBase64){"

                                + "window.mbmsNativeRestoreBase64('"

                                + encoded

                                + "');"

                                + "}"

                                + "})();";


                              webView.evaluateJavascript(
                                  js,
                                  null);

                          }

                          catch (Exception e) {


                              Toast.makeText(

                                  this,

                                  "Backup file वाचता आली नाही.",

                                  Toast.LENGTH_LONG).show();

                          }

                      }


                      return;

                  }


                  if (requestCode == REQUEST_FILE) {


                      if (filePathCallback == null) {

                          return;

                      }


                      Uri[] results = null;


                      if (resultCode == RESULT_OK &&
                          data != null &&
                          data.getData() != null) {


                          results = new Uri[]{

                              data.getData()

                          };

                      }


                      filePathCallback.onReceiveValue(
                          results);


                      filePathCallback = null;

                  }

              }


              @Override
              protected void onResume() {

                  super.onResume();

                  if (webView != null) {

                      webView.postDelayed(

                          new Runnable() {

                              @Override
                              public void run() {

                                  injectAndroidCompatibility();

                              }

                          },

                          300);

                  }

              }


              @Override
              public void onBackPressed() {


                  if (webView != null &&
                      webView.canGoBack()) {

                      webView.goBack();

                  }

                  else {

                      super.onBackPressed();

                  }

              }

          }

