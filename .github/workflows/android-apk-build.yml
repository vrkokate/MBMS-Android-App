            function section(
              title,
              rows
            ){

              return (
                '<div class="rel-section">'+
                  '<div class="rel-section-title">'+
                    E(title)+
                  '</div>'+
                  rows.map(
                    function(r){
                      return (
                        '<div class="rel-line">'+
                          '<b>'+
                          E(r[0])+
                          ':</b> '+
                          E(
                            r[1]===undefined ||
                            r[1]===""
                              ? "-"
                              : r[1]
                          )+
                        '</div>'
                      );
                    }
                  ).join("")+
                '</div>'
              );
            }

            function listSection(
              title,
              items,
              fn
            ){

              if(!items.length){

                return section(
                  title,
                  [
                    [
                      "नोंद",
                      "उपलब्ध नाही"
                    ]
                  ]
                );
              }

              return (
                '<div class="rel-section">'+
                  '<div class="rel-section-title">'+
                    E(title)+
                    " ("+
                    items.length+
                    ")"+
                  '</div>'+
                  items.map(
                    function(x,i){
                      return (
                        '<div style="border-top:1px solid #e8eef2;padding:7px 0">'+
                        fn(x,i)+
                        '</div>'
                      );
                    }
                  ).join("")+
                '</div>'
              );
            }

            function reportHTML(){

              const c=ctx();

              const b=current();

              const title=
                (
                  TYPE_LABELS[c.type] ||
                  "संबंधित"
                )+
                " → "+
                (
                  c.target==="__ALL__"
                    ? "सर्व"
                    : c.target
                );

              let h=
                '<div class="rel-head">'+
                E(title)+
                '</div>';

              h+=section(
                "सारांश",
                [
                  ["M.B.",b.mbs.length],
                  ["कामे",b.works.length],
                  [
                    "Contractor / Agency",
                    uniq(
                      b.works.map(contractor)
                        .concat(
                          b.bills.map(contractor),
                          b.assigns.map(contractor)
                        )
                    ).length
                  ],
                  ["Bills",b.bills.length],
                  [
                    "Transfer / History",
                    b.transfers.length
                  ]
                ]
              );

              h+=listSection(
                "M.B. ची संपूर्ण माहिती",
                b.mbs,
                function(m,i){

                  return section(
                    "M.B. "+mbNo(m),
                    [
                      [
                        "M.B. क्रमांक",
                        mbNo(m)
                      ],
                      [
                        "Size",
                        m.size||"-"
                      ],
                      [
                        "Status",
                        m.status||"-"
                      ],
                      [
                        "प्राप्त दिनांक",
                        D(
                          m.receivedDate ||
                          m.date ||
                          m.createdAt
                        )
                      ],
                      [
                        "सध्या कुणाकडे",
                        (
                          function(){
                            try{
                              return (
                                mbSummaryCurrentHolder(
                                  mbNo(m)
                                ).name||
                                "-"
                              );
                            }catch(e){
                              return "-";
                            }
                          }
                        )()
                      ]
                    ]
                  );
                }
              );

              h+=listSection(
                "कामांची संपूर्ण माहिती",
                b.works,
                function(w,i){

                  return (
                    "<b>"+
                    (i+1)+
                    ") "+
                    E(
                      workName(w)||
                      "-"
                    )+
                    "</b>"+
                    section(
                      "काम",
                      [
                        [
                          "Work Name",
                          workName(w)
                        ],
                        [
                          "M.B.",
                          w.mb||"-"
                        ],
                        [
                          "JE",
                          jeName(w)||"-"
                        ],
                        [
                          "Contractor / Agency",
                          contractor(w)||"-"
                        ]
                      ]
                    )
                  );
                }
              );

              const contractors=
                uniq(
                  b.works.map(contractor)
                    .concat(
                      b.bills.map(contractor),
                      b.assigns.map(contractor)
                    )
                );

              h+=listSection(
                "Contractor / Agency माहिती",
                contractors.map(
                  function(x){
                    return {
                      name:x
                    };
                  }
                ),
                function(c0,i){

                  const co=c0.name;

                  const works=
                    b.works.filter(
                      x=>
                        N(contractor(x))===
                        N(co)
                    );

                  const bills=
                    b.bills.filter(
                      x=>
                        N(contractor(x))===
                        N(co)
                    );

                  return section(
                    co,
                    [
                      [
                        "कामे",
                        works.length
                      ],
                      [
                        "Bills",
                        bills.length
                      ],
                      [
                        "M.B.",
                        uniq(
                          works.map(
                            x=>x.mb
                          ).concat(
                            bills.map(
                              x=>x.mb
                            )
                          )
                        ).join(", ")||
                        "-"
                      ]
                    ]
                  );
                }
              );

              h+=listSection(
                "Bill ची संपूर्ण माहिती",
                b.bills,
                function(x,i){

                  return section(
                    (
                      i+1+
                      ") "+
                      (
                        billType(x)||
                        "Bill"
                      )
                    ),
                    [
                      [
                        "Bill प्रकार",
                        billType(x)||"-"
                      ],
                      [
                        "Bill क्रमांक",
                        billNo(x)||"-"
                      ],
                      [
                        "Bill दिनांक",
                        D(
                          x.billDate ||
                          x.date ||
                          x.savedAt
                        )
                      ],
                      [
                        "M.B.",
                        x.mb||"-"
                      ],
                      [
                        "काम",
                        workName(x)||"-"
                      ],
                      [
                        "JE",
                        jeName(x)||"-"
                      ],
                      [
                        "Contractor / Agency",
                        contractor(x)||"-"
                      ],
                      [
                        "रक्कम",
                        amount(x.amount)
                      ],
                      [
                        "Payment Status",
                        x.paymentStatus||"-"
                      ]
                    ]
                  );
                }
              );

              h+=listSection(
                "Transfer / History",
                b.transfers,
                function(x,i){

                  return section(
                    (
                      i+1+
                      ") M.B. "+
                      (
                        transferNo(x)||
                        "-"
                      )
                    ),
                    [
                      [
                        "M.B.",
                        transferNo(x)||"-"
                      ],
                      [
                        "दिनांक",
                        D(
                          x.date ||
                          x.transferDate ||
                          x.savedAt
                        )
                      ],
                      [
                        "कोणाकडे",
                        x.receiverName ||
                        x.receiver ||
                        x.to ||
                        x.name ||
                        "-"
                      ],
                      [
                        "काम",
                        x.workName ||
                        x.work ||
                        "-"
                      ],
                      [
                        "JE",
                        jeName(x)||"-"
                      ],
                      [
                        "Contractor / Agency",
                        contractor(x)||"-"
                      ]
                    ]
                  );
                }
              );

              return h;
            }

            function renderResult(){

              const box=
