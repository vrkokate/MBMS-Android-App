name: MBMS V118 Android APK - Print Fix

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    name: Build MBMS V118 Print APK
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # 1. Checkout
      # =========================================================
      - name: Checkout repository
        uses: actions/checkout@v7

      # =========================================================
      # 2. Java 17
      # =========================================================
      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # =========================================================
      # 3. Android SDK
      # =========================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" \
                     "platforms;android-35" \
                     "build-tools;35.0.0"

      # =========================================================
      # 4. Install Gradle 8.7
      # =========================================================
      - name: Install Gradle 8.7
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip -d "$HOME/gradle"
          echo "$HOME/gradle/gradle-8.7/bin" >> "$GITHUB_PATH"

      # =========================================================
      # 5. Locate MBMS HTML
      # =========================================================
      - name: Locate MBMS HTML
        shell: bash
        run: |
          set -e

          HTML=""

          for f in \
            "Measurement_Book_Management_System_FINAL_V115_MB_HISTORY_ONLY_DATE-6.html" \
            "Measurement_Book_Management_System_FINAL_V115_MB_HISTORY_ONLY_DATE.html" \
            "Measurement_Book_Management_System_FINAL_V115.html" \
            "V115.html" \
            "index.html"
          do
            if [ -f "$f" ]; then
              HTML="$f"
              break
            fi
          done

          if [ -z "$HTML" ]; then
            HTML=$(find . -maxdepth 3 -type f -iname "*.html" | head -1 || true)
          fi

          if [ -z "$HTML" ]; then
            echo "ERROR: MBMS HTML file not found."
            exit 1
          fi

          SIZE=$(wc -c < "$HTML")

          if [ "$SIZE" -lt 100000 ]; then
            echo "WARNING: HTML size is only $SIZE bytes."
          fi

          echo "MBMS HTML found:"
          echo "$HTML"
          echo "HTML size: $SIZE bytes"

          cp "$HTML" /tmp/MBMS_SOURCE.html

      # =========================================================
      # 6. Verify important MBMS content
      # =========================================================
      - name: Verify MBMS source
        run: |
          set -e

          test -s /tmp/MBMS_SOURCE.html

          grep -qi "<html" /tmp/MBMS_SOURCE.html
          grep -qi "localStorage" /tmp/MBMS_SOURCE.html

          echo "MBMS HTML verification PASSED."

      # =========================================================
      # 7. Create Android project
      # =========================================================
      - name: Create Android project
        shell: bash
        run: |
          set -e

          rm -rf mbms_android

          mkdir -p mbms_android
          mkdir -p mbms_android/app/src/main/java/com/mbms/v118
          mkdir -p mbms_android/app/src/main/assets
          mkdir -p mbms_android/app/src/main/res/values

          cp /tmp/MBMS_SOURCE.html \
            mbms_android/app/src/main/assets/index.html

      # =========================================================
      # 8. settings.gradle
      # =========================================================
      - name: Create settings.gradle
        run: |
          cat > mbms_android/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "MBMS-V118-Android"
          include(":app")
          EOF

      # =========================================================
      # 9. Root build.gradle
      # =========================================================
      - name: Create root build.gradle
        run: |
          cat > mbms_android/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF

      # =========================================================
      # 10. gradle.properties
      # =========================================================
      - name: Create gradle.properties
        run: |
          cat > mbms_android/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

      # =========================================================
      # 11. app/build.gradle
      # =========================================================
      - name: Create app build.gradle
        run: |
          cat > mbms_android/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.mbms.v118'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.mbms.v118'
                  minSdk 26
                  targetSdk 35
                  versionCode 118
                  versionName "1.18"
              }

              buildTypes {
                  debug {
                      minifyEnabled false
                      shrinkResources false
                  }

                  release {
                      minifyEnabled false
                      shrinkResources false
                  }
              }

              packaging {
                  resources {
                      excludes += [
                          "META-INF/LICENSE*",
                          "META-INF/NOTICE*"
                      ]
                  }
              }
          }
          EOF

      # =========================================================
      # 12. AndroidManifest.xml
      # =========================================================
      - name: Create AndroidManifest.xml
        run: |
          cat > mbms_android/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:allowBackup="true"
                  android:usesCleartextTraffic="true"
                  android:label="@string/app_name"
                  android:theme="@style/AppTheme"
                  android:hardwareAccelerated="true"
                  android:resizeableActivity="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

      # =========================================================
      # 13. strings.xml
      # =========================================================
      - name: Create strings.xml
        run: |
          cat > mbms_android/app/src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">मोजमाप पुस्तिका नियंत्रण प्रणाली</string>
          </resources>
          EOF

      # =========================================================
      # 14. styles.xml
      # =========================================================
      - name: Create styles.xml
        run: |
          cat > mbms_android/app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>

              <style name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">

                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:statusBarColor">#04366F</item>
                  <item name="android:navigationBarColor">#04366F</item>
                  <item name="android:colorAccent">#0755A5</item>

              </style>

          </resources>
          EOF

      # =========================================================
      # 15. MainActivity.java
      # =========================================================
      - name: Create MainActivity.java
        run: |
          cat > mbms_android/app/src/main/java/com/mbms/v118/MainActivity.java <<'EOF'
          package com.mbms.v118;

          import android.app.Activity;
          import android.os.Bundle;
          import android.view.Window;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {

              private WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  Window window = getWindow();
                  window.setStatusBarColor(
                          android.graphics.Color.rgb(4, 54, 111)
                  );
                  window.setNavigationBarColor(
                          android.graphics.Color.rgb(4, 54, 111)
                  );

                  webView = new WebView(this);

                  WebSettings settings = webView.getSettings();

                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);

                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);

                  settings.setAllowFileAccessFromFileURLs(true);
                  settings.setAllowUniversalAccessFromFileURLs(true);

                  settings.setBuiltInZoomControls(false);
                  settings.setDisplayZoomControls(false);

                  settings.setLoadWithOverviewMode(false);
                  settings.setUseWideViewPort(false);

                  settings.setJavaScriptCanOpenWindowsAutomatically(true);
                  settings.setSupportMultipleWindows(false);

                  webView.setWebChromeClient(new WebChromeClient());

                  webView.setWebViewClient(new WebViewClient() {

                      @Override
                      public boolean shouldOverrideUrlLoading(
                              WebView view,
                              WebResourceRequest request) {

                          return false;
                      }
                  });

                  webView.setBackgroundColor(
                          android.graphics.Color.rgb(238, 246, 255)
                  );

                  webView.loadUrl(
                          "file:///android_asset/index.html"
                  );

                  setContentView(webView);
              }

              @Override
              public void onBackPressed() {

                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }

              @Override
              protected void onDestroy() {

                  if (webView != null) {
                      webView.stopLoading();
                      webView.destroy();
                  }

                  super.onDestroy();
              }
          }
          EOF

      # =========================================================
      # 16. ProGuard
      # =========================================================
      - name: Create proguard rules
        run: |
          cat > mbms_android/app/proguard-rules.pro <<'EOF'
          # MBMS V118
          # No code shrinking required.
          EOF

      # =========================================================
      # 17. Verify Android project
      # =========================================================
      - name: Verify Android project
        run: |
          set -e

          test -f mbms_android/app/src/main/assets/index.html
          test -f mbms_android/app/src/main/java/com/mbms/v118/MainActivity.java
          test -f mbms_android/app/src/main/AndroidManifest.xml
          test -f mbms_android/app/build.gradle

          echo "Android project verification PASSED."

      # =========================================================
      # 18. Build APK
      # =========================================================
      - name: Build MBMS V118 APK
        working-directory: mbms_android
        run: |
          set -e

          gradle wrapper --gradle-version 8.7

          ./gradlew --no-daemon --stacktrace :app:assembleDebug

      # =========================================================
      # 19. Verify APK
      # =========================================================
      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="mbms_android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          SIZE=$(stat -c%s "$APK")

          echo "APK size: $SIZE bytes"

          if [ "$SIZE" -lt 50000 ]; then
            echo "ERROR: APK is unexpectedly small."
            exit 1
          fi

          sha256sum "$APK"

          echo "APK verification PASSED."

      # =========================================================
      # 20. Prepare release
      # =========================================================
      - name: Prepare APK
        shell: bash
        run: |
          set -e

          mkdir -p release

          cp \
            mbms_android/app/build/outputs/apk/debug/app-debug.apk \
            release/MeasurementBookManagementSystem-V118-Print.apk

          sha256sum \
            release/MeasurementBookManagementSystem-V118-Print.apk \
            > release/SHA256.txt

          echo "Release prepared."

      # =========================================================
      # 21. Upload APK
      # =========================================================
      - name: Upload MBMS V118 APK
        uses: actions/upload-artifact@v6
        with:
          name: MeasurementBookManagementSystem-V118-Print-APK
          path: |
            release/MeasurementBookManagementSystem-V118-Print.apk
            release/SHA256.txt
          if-no-files-found: error

      # =========================================================
      # 22. Success
      # =========================================================
      - name: Build Success
        run: |
          echo "=========================================="
          echo "MBMS V118 APK BUILD SUCCESS"
          echo "=========================================="
          echo "Application ID: com.mbms.v118"
          echo "Version Code : 118"
          echo "Version Name : 1.18"
          echo "Print/Report : Included from MBMS HTML"
          echo "=========================================="
