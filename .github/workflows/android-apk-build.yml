          marker = "</body>"
          lower = text.lower()
          pos = lower.rfind(marker.lower())

          script_patch = (
              '<script id="V126_HOME_MB_SUMMARY_LINKED_FIX">\n'
              + patch.strip()
              + '\n</script>\n'
          )

          if pos < 0:
              raise SystemExit(
                  "ERROR: </body> marker not found; refusing unsafe HTML patch."
              )

          text = (
              text[:pos]
              + script_patch
              + text[pos:]
          )

          required = [
              "mbmsV126SummaryFixLoaded",
              "loadHomeRelDetailsV126",
              "showHomeRelationshipV126",
              "printLinkedRelationshipReport",
              "__SMALL_MB__",
              "__LARGE_MB__",
              "V126_HOME_MB_SUMMARY_LINKED_FIX"
          ]

          for item in required:

              if item not in text:

                  raise SystemExit(
                      "ERROR: MB Summary patch marker missing: " +
                      item
                  )

          p.write_text(
              text,
              encoding="utf-8"
          )

          print(
              "ONLY MB SUMMARY RELATIONSHIP/DETAIL FIX APPLIED."
          )

          print(
              "Existing MBMS storage/data was not modified by this patch."
          )

          print(
              "Final HTML size:",
              p.stat().st_size
