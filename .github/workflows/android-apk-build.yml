                  "ERROR: No JavaScript blocks found."
              )

          for i, script in enumerate(scripts):
              Path(
                  f"/tmp/mbms_script_{i}.js"
              ).write_text(
                  script,
                  encoding="utf-8"
              )

          print(
              f"Extracted {len(scripts)} JavaScript blocks."
          )
          PY

