name: MBMS V120 Android APK - Backup + Print Fix

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    name: Build MBMS V120 Backup Print APK
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # 1. Checkout
      # =========================================================
      - name: Checkout repository
        uses: actions/checkout@v7

      # =========================================================
      # 2. Java 17
      # =========================================================
      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # =========================================================
      # 3. Android SDK
      # =========================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # =========================================================
      # 4. Gradle 8.7
      # =========================================================
      - name: Install Gradle 8.7
        run: |
          wget -q \
            https://services.gradle.org/distributions/gradle-8.7-bin.zip

          unzip -q gradle-8.7-bin.zip -d "$HOME/gradle"

          echo "$HOME/gradle/gradle-8.7/bin" >> "$GITHUB_PATH"

      # =========================================================
      # 5. Find original V115 HTML
      # =========================================================
      - name: Locate original MBMS V115 HTML
        shell: bash
        run: |
          set -e

          HTML=""

          for f in \
            "Measurement_Book_Management_System_FINAL_V115_MB_HISTORY_ONLY_DATE-6.html" \
            "Measurement_Book_Management_System_FINAL_V115_MB_HISTORY_ONLY_DATE.html" \
            "Measurement_Book_Management_System_FINAL_V115.html" \
            "V115.html" \
            "index.html"
          do
            if [ -f "$f" ]; then
              HTML="$f"
              break
            fi
          done

          if [ -z "$HTML" ]; then
            HTML=$(find . -maxdepth 3 -type f -iname "*.html" | head -1 || true)
          fi

          if [ -z "$HTML" ]; then
            echo "ERROR: MBMS V115 HTML not found."
            exit 1
          fi

          echo "Using source:"
          echo "$HTML"

          cp "$HTML" /tmp/MBMS_SOURCE.html

          echo "Source size:"
          wc -c /tmp/MBMS_SOURCE.html

      # =========================================================
      # 6. Verify original source
      # =========================================================
      - name: Verify V115 source
        shell: bash
        run: |
          set -e

          test -s /tmp/MBMS_SOURCE.html

          grep -qi "<html" /tmp/MBMS_SOURCE.html
          grep -qi "localStorage" /tmp/MBMS_SOURCE.html
          grep -qi "downloadSettingsBackup" /tmp/MBMS_SOURCE.html
          grep -qi "restoreSettingsBackup" /tmp/MBMS_SOURCE.html
          grep -qi "settingsBackupFile" /tmp/MBMS_SOURCE.html
          grep -qi "window.print" /tmp/MBMS_SOURCE.html

          echo "=========================================="
          echo "V115 SOURCE VERIFICATION PASSED"
          echo "Backup Save       : FOUND"
          echo "Backup Restore    : FOUND"
          echo "File Input        : FOUND"
          echo "Print             : FOUND"
          echo "=========================================="

      # =========================================================
      # 7. Create Android project
      # =========================================================
      - name: Create Android project
        shell: bash
        run: |
          set -e

          rm -rf mbms_android

          mkdir -p mbms_android
          mkdir -p mbms_android/app/src/main/assets
          mkdir -p mbms_android/app/src/main/java/com/mbms/v118
          mkdir -p mbms_android/app/src/main/res/values

          cp /tmp/MBMS_SOURCE.html \
            mbms_android/app/src/main/assets/index.html

      # =========================================================
      # 8. settings.gradle
      # =========================================================
      - name: Create settings.gradle
        run: |
          cat > mbms_android/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)

              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "MBMS-V120-Android"

          include(":app")
          EOF

      # =========================================================
      # 9. Root build.gradle
      # =========================================================
      - name: Create root build.gradle
        run: |
          cat > mbms_android/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF

      # =========================================================
      # 10. gradle.properties
      # =========================================================
      - name: Create gradle.properties
        run: |
          cat > mbms_android/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

      # =========================================================
      # 11. app/build.gradle
      # =========================================================
      - name: Create app build.gradle
        run: |
          cat > mbms_android/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {

              namespace 'com.mbms.v118'

              compileSdk 35

              defaultConfig {

                  applicationId 'com.mbms.v118'

                  minSdk 26

                  targetSdk 35

                  versionCode 120

                  versionName "1.20"

              }

              buildTypes {

                  debug {

                      minifyEnabled false

                      shrinkResources false

                  }

                  release {

                      minifyEnabled false

                      shrinkResources false

                  }

              }

              packaging {

                  resources {

                      excludes += [
                          "META-INF/LICENSE*",
                          "META-INF/NOTICE*"
                      ]

                  }

              }

          }
          EOF

      # =========================================================
      # 12. AndroidManifest.xml
      # =========================================================
      - name: Create AndroidManifest.xml
        run: |
          cat > mbms_android/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <manifest
              xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission
                  android:name="android.permission.INTERNET" />

              <!-- Needed only on Android 8 and older -->
              <uses-permission
                  android:name="android.permission.WRITE_EXTERNAL_STORAGE"
                  android:maxSdkVersion="28" />

              <application

                  android:allowBackup="true"

                  android:hardwareAccelerated="true"

                  android:usesCleartextTraffic="true"

                  android:label="@string/app_name"

                  android:theme="@style/AppTheme"

                  android:resizeableActivity="true">


                  <activity

                      android:name=".MainActivity"

                      android:exported="true"

                      android:screenOrientation="portrait">


                      <intent-filter>

                          <action
                              android:name="android.intent.action.MAIN" />

                          <category
                              android:name="android.intent.category.LAUNCHER" />

                      </intent-filter>


                  </activity>

              </application>

          </manifest>
          EOF

      # =========================================================
      # 13. strings.xml
      # =========================================================
      - name: Create strings.xml
        run: |
          cat > mbms_android/app/src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <resources>

              <string name="app_name">
                  मोजमाप पुस्तिका नियंत्रण प्रणाली
              </string>

          </resources>
          EOF

      # =========================================================
      # 14. styles.xml
      # =========================================================
      - name: Create styles.xml
        run: |
          cat > mbms_android/app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <resources>

              <style
                  name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">

                  <item name="android:fontFamily">
                      sans
                  </item>

                  <item name="android:windowLightStatusBar">
                      false
                  </item>

                  <item name="android:statusBarColor">
                      #04366F
                  </item>

                  <item name="android:navigationBarColor">
                      #04366F
                  </item>

                  <item name="android:colorAccent">
                      #0755A5
                  </item>

              </style>

          </resources>
          EOF

      # =========================================================
      # 15. MainActivity.java
      # =========================================================
      - name: Create MainActivity.java
        run: |
          cat > mbms_android/app/src/main/java/com/mbms/v118/MainActivity.java <<'EOF'
          package com.mbms.v118;

          import android.Manifest;
          import android.app.Activity;
          import android.content.ContentResolver;
          import android.content.ContentValues;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Environment;
          import android.provider.MediaStore;
          import android.print.PrintAttributes;
          import android.print.PrintDocumentAdapter;
          import android.print.PrintManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Toast;

          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.OutputStream;
          import java.nio.charset.StandardCharsets;


          public class MainActivity extends Activity {


              private static final int REQUEST_FILE_CHOOSER = 7001;

              private static final int REQUEST_WRITE_STORAGE = 7002;


              private WebView webView;


              private ValueCallback<Uri[]> filePathCallback;


              private String pendingBackupJson;

              private String pendingBackupName;


              private int printJobCounter = 0;


              // =========================================================
              // Activity create
              // =========================================================

              @Override
              protected void onCreate(Bundle savedInstanceState) {

                  super.onCreate(savedInstanceState);


                  getWindow().setStatusBarColor(
                          Color.rgb(4, 54, 111)
                  );


                  getWindow().setNavigationBarColor(
                          Color.rgb(4, 54, 111)
                  );


                  webView = new WebView(this);


                  WebSettings settings =
                          webView.getSettings();


                  // -----------------------------------------------------
                  // JavaScript
                  // -----------------------------------------------------

                  settings.setJavaScriptEnabled(true);


                  // -----------------------------------------------------
                  // localStorage
                  // -----------------------------------------------------

                  settings.setDomStorageEnabled(true);

                  settings.setDatabaseEnabled(true);


                  // -----------------------------------------------------
                  // Local file access
                  // -----------------------------------------------------

                  settings.setAllowFileAccess(true);

                  settings.setAllowContentAccess(true);

                  settings.setAllowFileAccessFromFileURLs(true);

                  settings.setAllowUniversalAccessFromFileURLs(true);


                  // -----------------------------------------------------
                  // Display
                  // -----------------------------------------------------

                  settings.setBuiltInZoomControls(false);

                  settings.setDisplayZoomControls(false);

                  settings.setSupportZoom(false);

                  settings.setLoadWithOverviewMode(false);

                  settings.setUseWideViewPort(false);


                  settings.setJavaScriptCanOpenWindowsAutomatically(
                          true
                  );


                  settings.setSupportMultipleWindows(false);


                  // -----------------------------------------------------
                  // WebChromeClient
                  // -----------------------------------------------------

                  webView.setWebChromeClient(
                          new WebChromeClient() {

                              @Override
                              public boolean onShowFileChooser(
                                      WebView webView,
                                      ValueCallback<Uri[]> callback,
                                      FileChooserParams params) {

                                  if (filePathCallback != null) {

                                      filePathCallback.onReceiveValue(
                                              null
                                      );
                                  }


                                  filePathCallback = callback;


                                  Intent intent =
                                          new Intent(
                                                  Intent.ACTION_OPEN_DOCUMENT
                                          );


                                  intent.addCategory(
                                          Intent.CATEGORY_OPENABLE
                                  );


                                  intent.setType(
                                          "application/json"
                                  );


                                  intent.putExtra(
                                          Intent.EXTRA_ALLOW_MULTIPLE,
                                          false
                                  );


                                  try {

                                      startActivityForResult(
                                              intent,
                                              REQUEST_FILE_CHOOSER
                                      );

                                  } catch (Exception e) {

                                      filePathCallback = null;

                                      return false;
                                  }


                                  return true;
                              }

                          }
                  );


                  // -----------------------------------------------------
                  // WebViewClient
                  // -----------------------------------------------------

                  webView.setWebViewClient(
                          new WebViewClient() {

                              @Override
                              public boolean shouldOverrideUrlLoading(
                                      WebView view,
                                      WebResourceRequest request) {

                                  return false;
                              }


                              @Override
                              public void onPageFinished(
                                      WebView view,
                                      String url) {

                                  super.onPageFinished(
                                          view,
                                          url
                                  );


                                  installNativeBridges(view);
                              }

                          }
                  );


                  // -----------------------------------------------------
                  // JavaScript Interfaces
                  // -----------------------------------------------------

                  webView.addJavascriptInterface(
                          new AndroidBackupBridge(this),
                          "AndroidBackup"
                  );


                  webView.addJavascriptInterface(
                          new AndroidPrintBridge(this),
                          "AndroidPrint"
                  );


                  webView.setBackgroundColor(
                          Color.rgb(238, 246, 255)
                  );


                  setContentView(webView);


                  webView.loadUrl(
                          "file:///android_asset/index.html"
                  );
              }


              // =========================================================
              // Install JavaScript bridges
              // =========================================================

              private void installNativeBridges(WebView view) {


                  // -----------------------------------------------------
                  // PRINT
                  // -----------------------------------------------------

                  String printJs =
                          "javascript:(function(){"
                          + "try{"
                          + "window.print=function(){"
                          + "if(window.AndroidPrint){"
                          + "window.AndroidPrint.printPage();"
                          + "}"
                          + "};"
                          + "}catch(e){"
                          + "console.error(e);"
                          + "}"
                          + "})()";


                  view.evaluateJavascript(
                          printJs,
                          null
                  );


                  // -----------------------------------------------------
                  // BACKUP SAVE
                  //
                  // Replace only the save mechanism.
                  // Existing MBMS data snapshot remains untouched.
                  // -----------------------------------------------------

                  String backupJs =
                          "javascript:(function(){"
                          + "try{"

                          + "if(typeof mbmsSettingsSnapshot!=='function'){"
                          + "console.error('mbmsSettingsSnapshot missing');"
                          + "return;"
                          + "}"

                          + "window.downloadSettingsBackup=function(){"

                          + "try{"

                          + "var data=JSON.stringify("
                          + "mbmsSettingsSnapshot(),"
                          + "null,2"
                          + ");"

                          + "var d=new Date();"

                          + "var y=d.getFullYear();"

                          + "var m=String(d.getMonth()+1).padStart(2,'0');"

                          + "var day=String(d.getDate()).padStart(2,'0');"

                          + "var filename='MBMS_Backup_'"
                          + "+y+'-'+m+'-'+day+'.json';"

                          + "if(window.AndroidBackup){"

                          + "window.AndroidBackup.saveBackup("
                          + "data,filename"
                          + ");"

                          + "}"

                          + "}catch(e){"

                          + "console.error('Backup Save:',e);"

                          + "alert('Backup Save करताना तांत्रिक त्रुटी आली.');"

                          + "}"

                          + "};"

                          + "}catch(e){"
                          + "console.error(e);"
                          + "}"
                          + "})()";


                  view.evaluateJavascript(
                          backupJs,
                          null
                  );
              }


              // =========================================================
              // NATIVE BACKUP SAVE
              // =========================================================

              private void saveBackupToDownloads(
                      String json,
                      String fileName) {


                  if (json == null) {
                      json = "";
                  }


                  if (fileName == null ||
                          fileName.trim().isEmpty()) {

                      fileName =
                              "MBMS_Backup.json";
                  }


                  final String finalJson = json;

                  final String finalName =
                          fileName;


                  // -----------------------------------------------------
                  // Android 10+
                  // Scoped Storage / MediaStore
                  // -----------------------------------------------------

                  if (Build.VERSION.SDK_INT >=
                          Build.VERSION_CODES.Q) {


                      try {

                          ContentResolver resolver =
                                  getContentResolver();


                          ContentValues values =
                                  new ContentValues();


                          values.put(
                                  MediaStore.Downloads.DISPLAY_NAME,
                                  finalName
                          );


                          values.put(
                                  MediaStore.Downloads.MIME_TYPE,
                                  "application/json"
                          );


                          values.put(
                                  MediaStore.Downloads.RELATIVE_PATH,
                                  Environment.DIRECTORY_DOWNLOADS
                          );


                          values.put(
                                  MediaStore.Downloads.IS_PENDING,
                                  1
                          );


                          Uri uri =
                                  resolver.insert(
                                          MediaStore.Downloads.EXTERNAL_CONTENT_URI,
                                          values
                                  );


                          if (uri == null) {

                              showToast(
                                      "Backup Save झाले नाही."
                              );

                              return;
                          }


                          try (
                                  OutputStream output =
                                          resolver.openOutputStream(uri)
                          ) {

                              if (output == null) {

                                  resolver.delete(
                                          uri,
                                          null,
                                          null
                                  );

                                  showToast(
                                          "Backup Save झाले नाही."
                                  );

                                  return;
                              }


                              output.write(
                                      finalJson.getBytes(
                                              StandardCharsets.UTF_8
                                      )
                              );

                              output.flush();
                          }


                          ContentValues complete =
                                  new ContentValues();


                          complete.put(
                                  MediaStore.Downloads.IS_PENDING,
                                  0
                          );


                          resolver.update(
                                  uri,
                                  complete,
                                  null,
                                  null
                          );


                          showToast(
                                  "Backup Save झाले. Downloads मध्ये पहा."
                          );


                      } catch (Exception e) {

                          e.printStackTrace();


                          showToast(
                                  "Backup Save करताना त्रुटी आली."
                          );
                      }


                      return;
                  }


                  // -----------------------------------------------------
                  // Android 8/9 fallback
                  // -----------------------------------------------------

                  if (
                          checkSelfPermission(
                                  Manifest.permission.WRITE_EXTERNAL_STORAGE
                          ) != PackageManager.PERMISSION_GRANTED
                  ) {


                      pendingBackupJson =
                              finalJson;


                      pendingBackupName =
                              finalName;


                      requestPermissions(
                              new String[]{
                                      Manifest.permission
                                              .WRITE_EXTERNAL_STORAGE
                              },
                              REQUEST_WRITE_STORAGE
                      );


                      return;
                  }


                  saveLegacyBackup(
                          finalJson,
                          finalName
                  );
              }


              // =========================================================
              // Legacy Android backup
              // =========================================================

              private void saveLegacyBackup(
                      String json,
                      String fileName) {

                  try {

                      File downloads =
                              Environment.getExternalStoragePublicDirectory(
                                      Environment.DIRECTORY_DOWNLOADS
                              );


                      if (!downloads.exists()) {

                          downloads.mkdirs();
                      }


                      File backupFile =
                              new File(
                                      downloads,
                                      fileName
                              );


                      try (
                              FileOutputStream output =
                                      new FileOutputStream(
                                              backupFile
                                      )
                      ) {

                          output.write(
                                  json.getBytes(
                                          StandardCharsets.UTF_8
                                  )
                          );

                          output.flush();
                      }


                      showToast(
                              "Backup Save झाले. Downloads मध्ये पहा."
                      );


                  } catch (Exception e) {

                      e.printStackTrace();


                      showToast(
                              "Backup Save करताना त्रुटी आली."
                      );
                  }
              }


              // =========================================================
              // File Picker result
              // =========================================================

              @Override
              protected void onActivityResult(
                      int requestCode,
                      int resultCode,
                      Intent data) {

                  super.onActivityResult(
                          requestCode,
                          resultCode,
                          data
                  );


                  if (
                          requestCode ==
                                  REQUEST_FILE_CHOOSER
                  ) {


                      if (filePathCallback == null) {
                          return;
                      }


                      Uri[] results = null;


                      if (
                              resultCode ==
                                      RESULT_OK &&
                              data != null
                      ) {


                          Uri uri =
                                  data.getData();


                          if (uri != null) {

                              results =
                                      new Uri[]{
                                              uri
                                      };
                          }
                      }


                      filePathCallback.onReceiveValue(
                              results
                      );


                      filePathCallback = null;
                  }
              }


              // =========================================================
              // Runtime permission result
              // =========================================================

              @Override
              public void onRequestPermissionsResult(
                      int requestCode,
                      String[] permissions,
                      int[] grantResults) {

                  super.onRequestPermissionsResult(
                          requestCode,
                          permissions,
                          grantResults
                  );


                  if (
                          requestCode ==
                                  REQUEST_WRITE_STORAGE
                  ) {


                      if (
                              grantResults.length > 0 &&
                              grantResults[0] ==
                                      PackageManager.PERMISSION_GRANTED
                      ) {


                          if (
                                  pendingBackupJson != null
                          ) {

                              saveLegacyBackup(
                                      pendingBackupJson,
                                      pendingBackupName
                              );
                          }


                      } else {


                          showToast(
                                  "Storage permission आवश्यक आहे."
                          );
                      }


                      pendingBackupJson = null;

                      pendingBackupName = null;
                  }
              }


              // =========================================================
              // Toast
              // =========================================================

              private void showToast(
                      String message
              ) {

                  runOnUiThread(
                          () -> Toast.makeText(
                                  MainActivity.this,
                                  message,
                                  Toast.LENGTH_LONG
                          ).show()
                  );
              }


              // =========================================================
              // NATIVE PRINT
              // =========================================================

              public void startPrintJob() {


                  if (webView == null) {
                      return;
                  }


                  printJobCounter++;


                  String jobName =
                          "MBMS Report " +
                          printJobCounter;


                  PrintManager printManager =
                          (PrintManager)
                                  getSystemService(
                                          Context.PRINT_SERVICE
                                  );


                  if (printManager == null) {

                      showToast(
                              "Print Service उपलब्ध नाही."
                      );

                      return;
                  }


                  PrintDocumentAdapter adapter =
                          webView.createPrintDocumentAdapter(
                                  jobName
                          );


                  PrintAttributes attributes =
                          new PrintAttributes.Builder()

                                  .setMediaSize(
                                          PrintAttributes.MediaSize.ISO_A4
                                  )

                                  .setMinMargins(
                                          PrintAttributes.Margins.NO_MARGINS
                                  )

                                  .setResolution(
                                          new PrintAttributes.Resolution(
                                                  "MBMS_PRINT",
                                                  "MBMS Print",
                                                  300,
                                                  300
                                          )
                                  )

                                  .build();


                  printManager.print(
                          jobName,
                          adapter,
                          attributes
                  );
              }


              // =========================================================
              // Android Print bridge
              // =========================================================

              public static class AndroidPrintBridge {


                  private final MainActivity activity;


                  public AndroidPrintBridge(
                          MainActivity activity
                  ) {

                      this.activity =
                              activity;
                  }


                  @JavascriptInterface
                  public void printPage() {

                      activity.runOnUiThread(
                              () -> activity.startPrintJob()
                      );
                  }
              }


              // =========================================================
              // Android Backup bridge
              // =========================================================

              public static class AndroidBackupBridge {


                  private final MainActivity activity;


                  public AndroidBackupBridge(
                          MainActivity activity
                  ) {

                      this.activity =
                              activity;
                  }


                  @JavascriptInterface
                  public void saveBackup(
                          String json,
                          String fileName
                  ) {

                      activity.runOnUiThread(
                              () -> activity.saveBackupToDownloads(
                                      json,
                                      fileName
                              )
                      );
                  }
              }


              // =========================================================
              // Android Back
              // =========================================================

              @Override
              public void onBackPressed() {


                  if (
                          webView != null &&
                          webView.canGoBack()
                  ) {

                      webView.goBack();

                  } else {

                      super.onBackPressed();
                  }
              }


              // =========================================================
              // Cleanup
              // =========================================================

              @Override
              protected void onDestroy() {


                  if (webView != null) {

                      webView.stopLoading();


                      webView.removeJavascriptInterface(
                              "AndroidBackup"
                      );


                      webView.removeJavascriptInterface(
                              "AndroidPrint"
                      );


                      webView.destroy();


                      webView =
                              null;
                  }


                  super.onDestroy();
              }

          }
          EOF

      # =========================================================
      # 16. ProGuard
      # =========================================================
      - name: Create proguard-rules.pro
        run: |
          cat > mbms_android/app/proguard-rules.pro <<'EOF'
          # MBMS V120
          # Code shrinking disabled.
          EOF

      # =========================================================
      # 17. Verify project
      # =========================================================
      - name: Verify Android project
        shell: bash
        run: |
          set -e

          test -s \
            mbms_android/app/src/main/assets/index.html

          test -f \
            mbms_android/app/src/main/AndroidManifest.xml

          test -f \
            mbms_android/app/src/main/java/com/mbms/v118/MainActivity.java

          test -f \
            mbms_android/app/build.gradle

          echo "Android project files PASSED."

      # =========================================================
      # 18. Verify Backup / Print implementation
      # =========================================================
      - name: Verify Native Backup and Print
        shell: bash
        run: |
          set -e

          FILE="mbms_android/app/src/main/java/com/mbms/v118/MainActivity.java"

          grep -q "AndroidBackupBridge" "$FILE"
          grep -q "saveBackup" "$FILE"
          grep -q "MediaStore.Downloads" "$FILE"
          grep -q "ACTION_OPEN_DOCUMENT" "$FILE"
          grep -q "onShowFileChooser" "$FILE"
          grep -q "AndroidPrintBridge" "$FILE"
          grep -q "PrintManager" "$FILE"
          grep -q "createPrintDocumentAdapter" "$FILE"
          grep -q "ISO_A4" "$FILE"

          echo "=========================================="
          echo "NATIVE BACKUP + PRINT VERIFICATION PASSED"
          echo "Backup Save       : FOUND"
          echo "Downloads Save    : FOUND"
          echo "File Picker       : FOUND"
          echo "Backup Restore    : FOUND"
          echo "PrintManager      : FOUND"
          echo "A4 Print          : FOUND"
          echo "=========================================="

      # =========================================================
      # 19. Build APK
      # =========================================================
      - name: Build MBMS V120 APK
        working-directory: mbms_android
        run: |
          set -e

          gradle wrapper --gradle-version 8.7

          ./gradlew \
            --no-daemon \
            --stacktrace \
            :app:assembleDebug

      # =========================================================
      # 20. Verify APK
      # =========================================================
      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="mbms_android/app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          SIZE=$(stat -c%s "$APK")

          echo "APK size: $SIZE bytes"

          if [ "$SIZE" -lt 50000 ]; then
            echo "ERROR: APK unexpectedly small."
            exit 1
          fi

          unzip -t "$APK" >/dev/null

          unzip -l "$APK" |
            grep -q "AndroidManifest.xml"

          unzip -l "$APK" |
            grep -q "classes.dex"

          sha256sum "$APK"

          echo "APK verification PASSED."

      # =========================================================
      # 21. Prepare release
      # =========================================================
      - name: Prepare V120 APK
        shell: bash
        run: |
          set -e

          mkdir -p release

          cp \
            mbms_android/app/build/outputs/apk/debug/app-debug.apk \
            release/MeasurementBookManagementSystem-V120-Backup-Print.apk

          sha256sum \
            release/MeasurementBookManagementSystem-V120-Backup-Print.apk \
            > release/SHA256.txt

          ls -lh release

      # =========================================================
      # 22. Upload artifact
      # =========================================================
      - name: Upload V120 APK
        uses: actions/upload-artifact@v6
        with:
          name: MeasurementBookManagementSystem-V120-Backup-Print-APK
          path: |
            release/MeasurementBookManagementSystem-V120-Backup-Print.apk
            release/SHA256.txt
          if-no-files-found: error
          retention-days: 30

      # =========================================================
      # 23. Final success
      # =========================================================
      - name: Build Success
        run: |
          echo ""
          echo "================================================"
          echo "       MBMS V120 BUILD SUCCESSFUL"
          echo "================================================"
          echo ""
          echo "V115 HTML               : PRESERVED"
          echo "Existing Features       : PRESERVED"
          echo ""
          echo "Backup Save             : NATIVE DOWNLOADS"
          echo "Backup Restore          : NATIVE FILE PICKER"
          echo "Print                   : NATIVE PRINTMANAGER"
          echo "A4                      : ENABLED"
          echo "Save as PDF             : ANDROID PRINT SCREEN"
          echo ""
          echo "Application ID          : com.mbms.v118"
          echo "Version Code            : 120"
          echo "Version Name            : 1.20"
          echo ""
          echo "================================================"
