          from pathlib import Path

          html_path = Path(
              "mbms_work/index.html"
          )

          patch_path = Path(
              "/tmp/mbms_summary_patch.js"
          )

          text = html_path.read_text(
              encoding="utf-8"
          )

          patch = patch_path.read_text(
              encoding="utf-8"
          ).rstrip()

          if "</script>" in patch.lower():
              raise SystemExit(
                  "ERROR: Patch contains raw </script> token."
              )

          marker = "</body>"

          pos = text.lower().rfind(
              marker.lower()
          )

          if pos < 0:
              raise SystemExit(
                  "ERROR: </body> marker not found."
              )

          script_block = (
              '<script id="V126_MBMS_SUMMARY_LINKED_FIX">\n'
              + patch
              + '\n</script>\n'
          )

          text = (
              text[:pos]
              + script_block
              + text[pos:]
          )

          html_path.write_text(
              text,
              encoding="utf-8"
          )

          print(
              "MB SUMMARY PATCH APPLIED."
          )

          print(
              "NO BASE64 USED."
          )
          PY


      - name: Verify MB Summary Patch Placement
        shell: bash
        run: |
          set -Eeuo pipefail

          python3 <<'PY'
          from pathlib import Path
          import re

          text = Path(
              "mbms_work/index.html"
          ).read_text(
              encoding="utf-8"
          )

          required = [
              "V126_MBMS_SUMMARY_LINKED_FIX",
              "mbmsV126SummaryFixLoaded",
              "loadHomeRelDetailsV124",
              "showHomeRelationshipV124",
              "printLinkedRelationshipReport",
              "__SMALL_MB__",
              "__LARGE_MB__"
          ]

          for item in required:
              if item not in text:
                  raise SystemExit(
                      "ERROR: Missing MB Summary marker: " +
                      item
                  )

          blocks = re.findall(
              r"<script[^>]*>(.*?)</script>",
              text,
              flags=re.I | re.S
          )

          if not any(
              "V126_MBMS_SUMMARY_LINKED_FIX" in b
              for b in blocks
          ):
              raise SystemExit(
                  "ERROR: MB Summary fix is not inside a <script> block."
              )

          if "base64.b64decode" in text:
              raise SystemExit(
                  "ERROR: Broken Base64 code is still present."
              )

          print(
              "MB SUMMARY SCRIPT PLACEMENT VERIFIED."
          )
          PY


      - name: Validate Final HTML JavaScript
        shell: bash
        run: |
          set -Eeuo pipefail

          python3 <<'PY'
          from pathlib import Path
          import re

          html = Path(
              "mbms_work/index.html"
          )

          text = html.read_text(
              encoding="utf-8"
          )

          scripts = re.findall(
              r"<script[^>]*>(.*?)</script>",
              text,
              flags=re.I | re.S
          )

          if not scripts:
              raise SystemExit(
                  "ERROR: No JavaScript blocks found."
              )

          for i, script in enumerate(scripts):

              Path(
                  f"/tmp/mbms_script_{i}.js"
              ).write_text(
                  script,
                  encoding="utf-8"
              )

          print(
              f"Extracted {len(scripts)} JavaScript blocks."
          )
          PY

          for f in /tmp/mbms_script_*.js
          do
            echo "Checking $f"
            node --check "$f"
          done

          test -n \
            "$(grep -oi '</body>' mbms_work/index.html | head -n 1)"

          test -n \
            "$(grep -oi '</html>' mbms_work/index.html | head -n 1)"

          echo "FINAL HTML JAVASCRIPT VALIDATION PASSED."


