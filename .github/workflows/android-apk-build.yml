          cat > mbms_android/app/src/main/java/com/mbms/app/MainActivity.java <<'EOF'
          package com.mbms.app;

          import android.app.Activity;

          import android.os.Build;
          import android.os.Bundle;
          import android.os.Environment;

          import android.content.ContentValues;
          import android.content.Intent;

          import android.net.Uri;

          import android.provider.MediaStore;

          import android.webkit.JavascriptInterface;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          import android.print.PrintAttributes;
          import android.print.PrintManager;

          import android.widget.Toast;

          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.OutputStream;

          import java.nio.charset.StandardCharsets;


          public class MainActivity extends Activity {

              private WebView webView;

              private ValueCallback<Uri[]> filePathCallback;

              private static final int REQUEST_FILE = 7001;


              @Override
              protected void onCreate(
                      Bundle savedInstanceState) {

                  super.onCreate(
                          savedInstanceState
                  );


                  webView = new WebView(
                          this
                  );


                  WebSettings settings =
                          webView.getSettings();

                  settings.setJavaScriptEnabled(
                          true
                  );

                  settings.setDomStorageEnabled(
                          true
                  );

                  settings.setDatabaseEnabled(
                          true
                  );

                  settings.setAllowFileAccess(
                          true
                  );

                  settings.setAllowContentAccess(
                          true
                  );

                  settings.setSupportZoom(
                          false
                  );


                  webView.setWebViewClient(
                          new WebViewClient()
                  );


                  webView.setWebChromeClient(
                          new WebChromeClient() {

                              @Override
                              public boolean onShowFileChooser(
                                      WebView view,
                                      ValueCallback<Uri[]> callback,
                                      WebChromeClient.FileChooserParams params) {

                                  if (
                                          filePathCallback !=
                                          null
                                  ) {
                                      filePathCallback
                                              .onReceiveValue(
                                                      null
                                              );
                                  }

                                  filePathCallback =
                                          callback;

                                  try {

                                      Intent intent =
                                              params.createIntent();

                                      startActivityForResult(
                                              intent,
                                              REQUEST_FILE
                                      );

                                      return true;

                                  } catch (
                                          Exception e
                                  ) {

                                      filePathCallback =
                                              null;

                                      return false;
                                  }
                              }
                          }
                  );


                  webView.addJavascriptInterface(
                          new AndroidBridge(),
                          "AndroidBridge"
                  );


                  webView.loadUrl(
                          "file:///android_asset/index.html"
                  );


                  setContentView(
                          webView
                  );
              }


              public class AndroidBridge {

                  @JavascriptInterface
                  public void print() {

                      runOnUiThread(
                              new Runnable() {

                                  @Override
                                  public void run() {

                                      try {

                                          PrintManager manager =
                                                  (PrintManager)
                                                          getSystemService(
                                                                  PRINT_SERVICE
                                                          );

                                          if (
                                                  manager ==
                                                  null
                                          ) {
                                              return;
                                          }

                                          manager.print(
                                                  "MBMS",
                                                  webView
                                                          .createPrintDocumentAdapter(
                                                                  "MBMS"
                                                          ),
                                                  new PrintAttributes
                                                          .Builder()
                                                          .build()
                                          );

                                      } catch (
                                              Exception e
                                      ) {

                                          Toast.makeText(
                                                  MainActivity.this,
                                                  "Print Error: " +
                                                          e.getMessage(),
                                                  Toast.LENGTH_LONG
                                          ).show();
                                      }
                                  }
                              }
                      );
                  }


                  @JavascriptInterface
                  public void saveBackup(
                          String filename,
                          String json) {

                      new Thread(
                              new Runnable() {

                                  @Override
                                  public void run() {

                                      boolean success =
                                              false;

                                      try {

                                          if (
                                                  Build.VERSION.SDK_INT >=
                                                          Build.VERSION_CODES.Q
                                          ) {

                                              ContentValues values =
                                                      new ContentValues();

                                              values.put(
                                                      MediaStore.Downloads
                                                              .DISPLAY_NAME,
                                                      filename
                                              );

                                              values.put(
                                                      MediaStore.Downloads
                                                              .MIME_TYPE,
                                                      "application/json"
                                              );

                                              values.put(
                                                      MediaStore.Downloads
                                                              .RELATIVE_PATH,
                                                      Environment
                                                              .DIRECTORY_DOWNLOADS
                                              );

                                              Uri uri =
                                                      getContentResolver()
                                                              .insert(
                                                                      MediaStore
                                                                              .Downloads
                                                                              .EXTERNAL_CONTENT_URI,
                                                                      values
                                                              );

                                              if (
                                                      uri !=
                                                      null
                                              ) {

                                                  try (
                                                          OutputStream output =
                                                                  getContentResolver()
                                                                          .openOutputStream(
                                                                                  uri
                                                                          )
                                                  ) {

                                                      if (
                                                              output !=
                                                              null
                                                      ) {

                                                          output.write(
                                                                  json.getBytes(
                                                                          StandardCharsets.UTF_8
                                                                  )
                                                          );

                                                          output.flush();

                                                          success =
                                                                  true;
                                                      }
                                                  }
                                              }

                                          } else {

                                              File directory =
                                                      Environment
                                                              .getExternalStoragePublicDirectory(
                                                                      Environment
                                                                              .DIRECTORY_DOWNLOADS
                                                              );

                                              if (
                                                      !directory.exists()
                                              ) {
                                                  directory.mkdirs();
                                              }

                                              File file =
                                                      new File(
                                                              directory,
                                                              filename
                                                      );

                                              try (
                                                      FileOutputStream output =
                                                              new FileOutputStream(
                                                                      file
                                                              )
                                              ) {

                                                  output.write(
                                                          json.getBytes(
                                                                  StandardCharsets.UTF_8
                                                          )
                                                  );

                                                  output.flush();

                                                  success =
                                                          true;
                                              }
                                          }

                                      } catch (
                                              Exception e
                                      ) {

                                          e.printStackTrace();
                                      }


                                      final boolean result =
                                              success;


                                      runOnUiThread(
                                              new Runnable() {

                                                  @Override
                                                  public void run() {

                                                      Toast.makeText(
                                                              MainActivity.this,
                                                              result
                                                                      ? "Backup Downloads मध्ये Save झाला."
                                                                      : "Backup Save मध्ये त्रुटी आली.",
                                                              Toast.LENGTH_LONG
                                                      ).show();
                                                  }
                                              }
                                      );
                                  }
                              }
                      ).start();
                  }
              }


              @Override
              protected void onActivityResult(
                      int requestCode,
                      int resultCode,
                      Intent data) {

                  super.onActivityResult(
                          requestCode,
                          resultCode,
                          data
                  );


                  if (
                          requestCode ==
                                  REQUEST_FILE &&
                          filePathCallback !=
                                  null
                  ) {

                      Uri[] results =
                              null;

                      if (
                              resultCode ==
                                      RESULT_OK &&
                              data != null &&
                              data.getData() !=
                                      null
                      ) {

                          results =
                                  new Uri[]{
                                          data.getData()
                                  };
                      }

                      filePathCallback
                              .onReceiveValue(
                                      results
                              );

                      filePathCallback =
                              null;
                  }
              }


              @Override
              public void onBackPressed() {

                  if (
                          webView != null &&
                          webView.canGoBack()
                  ) {

                      webView.goBack();

                  } else {

                      super.onBackPressed();
                  }
              }
          }
          EOF

