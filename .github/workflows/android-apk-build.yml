            mbms_android/app/src/main/res/values/strings.xml


          test -s \
            mbms_android/app/src/main/assets/index.html


          test -s \
            mbms_android/app/src/main/assets/bridge.js


          echo "Checking Activity..."


          grep -q \
            "class MainActivity extends Activity" \
            mbms_android/app/src/main/java/com/mbms/app/MainActivity.java


          echo "Checking AppCompat..."


          if grep -Riq \
              "androidx.appcompat" \
              mbms_android
          then

