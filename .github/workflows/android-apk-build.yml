name: MBMS V130 FINAL - ALL REPORTS PRINT PDF FIXED

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:

  build:
    name: Build Final MBMS APK
    runs-on: ubuntu-24.04

    steps:

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -e
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Install Gradle 8.7
        shell: bash
        run: |
          set -e
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
          mkdir -p "$HOME/gradle"
          unzip -q gradle-8.7-bin.zip -d "$HOME/gradle"
          echo "$HOME/gradle/gradle-8.7/bin" >> "$GITHUB_PATH"
          "$HOME/gradle/gradle-8.7/bin/gradle" --version

      - name: Verify Java and Gradle
        shell: bash
        run: |
          set -e
          java -version
          gradle --version

      - name: Find MBMS HTML
        shell: bash
        run: |
          set -e

          HTML_FILE=""

          for f in \
            "Measurement_Book_Management_System_FINAL_V120_TRANSFER_REPORT_FINAL.html" \
            "Measurement_Book_Management_System_FINAL_V118_PRINT_BACKUP_ANDROID.html" \
            "Measurement_Book_Management_System_FINAL_V115_MB_HISTORY_ONLY_DATE-6.html" \
            "Measurement_Book_Management_System_FINAL_V115_MB_HISTORY_ONLY_DATE.html" \
            "Measurement_Book_Management_System_FINAL_V115.html" \
            "V115.html" \
            "index.html"
          do
            if [ -f "$f" ]; then
              HTML_FILE="$f"
              break
            fi
          done

          if [ -z "$HTML_FILE" ]; then
            HTML_FILE=$(find . \
              -maxdepth 3 \
              -type f \
              -iname "*.html" \
              -not -path "./.git/*" \
              | head -n 1 || true)
          fi

          if [ -z "$HTML_FILE" ]; then
            echo "ERROR: MBMS HTML file not found."
            exit 1
          fi

          echo "HTML_FILE=$HTML_FILE" >> "$GITHUB_ENV"
          echo "Using HTML: $HTML_FILE"

      - name: Prepare Final MBMS HTML
        shell: bash
        run: |
          set -e
          mkdir -p mbms_work
          cp "$HTML_FILE" mbms_work/index.html
          test -s mbms_work/index.html
          wc -c mbms_work/index.html

      - name: Apply ONLY Received JE List Correction
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path

          p = Path("mbms_work/index.html")
          text = p.read_text(encoding="utf-8")

          old1 = (
              "if(isJE){loadTransferJEs();"
              "if(je){je.value=sourceName;je.disabled=true;}}"
          )

          new1 = (
              "if(isJE){loadTransferJEs();"
              "if(je){je.value=sourceName;je.disabled=false;}}"
          )

          if old1 in text:
              text = text.replace(old1, new1, 1)
              print("Received JE correction applied.")

          old2 = "if(isJE&&je)je.disabled=true;"
          new2 = "if(isJE&&je)je.disabled=false;"

          if old2 in text:
              text = text.replace(old2, new2, 1)
              print("Received JE secondary correction applied.")

          p.write_text(text, encoding="utf-8")
          print("JE correction completed.")

          PY

      - name: Verify Requested Correction
        shell: bash
        run: |
          set -e

          HTML="mbms_work/index.html"

          test -s "$HTML"
          grep -q "loadTransferJEs()" "$HTML"
          grep -q "transferFromJEName" "$HTML"
          grep -q "je.disabled=false" "$HTML"

          echo "RECEIVED JE FULL LIST CORRECTION VERIFIED."

      - name: Verify MBMS Core Functions
        shell: bash
        run: |
          set -e

          HTML="mbms_work/index.html"

          grep -q "mbmsSettingsSnapshot" "$HTML"
          grep -q "downloadSettingsBackup" "$HTML"
          grep -q "restoreSettingsBackup" "$HTML"
          grep -q "generateTransferReport" "$HTML"
          grep -q "saveTransferMB" "$HTML"
          grep -q "getTransferHistory" "$HTML"

          echo "MBMS CORE FUNCTIONS VERIFIED."

      - name: Apply ONLY MB Summary Relationship and Detail Fix
        shell: bash
        run: |
          set -Eeuo pipefail

          cat > /tmp/mbms_summary_patch.js <<'PATCH_JS'
          (function(){
            'use strict';

            const TYPE_LABELS={
              MB:'M.B.',
              JE:'Junior Engineer',
              WORK:'कामाचे नाव',
              CONTRACTOR:'Contractor / Agency',
              BILL:'Bill',
              TRANSFER:'Transfer / History'
            };

            const DETAIL_ALL='__ALL_DETAIL__';
            const MB_SMALL='__SMALL_MB__';
            const MB_LARGE='__LARGE_MB__';
            const MB_PREFIX='__MBNO__::';

            function A(v){return Array.isArray(v)?v:[];}
            function S(v){return v==null?'':String(v).trim();}
            function N(v){
              try{return hrNorm(v);}
              catch(e){return S(v).toLowerCase().replace(/\s+/g,' ');}
            }
            function E(v){
              try{return escapeHtml(S(v));}
              catch(e){
                return S(v).replace(/[&<>"']/g,function(c){
                  return ({
                    '&':'&amp;',
                    '<':'&lt;',
                    '>':'&gt;',
                    '"':'&quot;',
                    "'":'&#39;'
                  })[c];
                });
              }
            }
            function D(v){
              try{return hrDate(v||'');}
              catch(e){return S(v)||'-';}
            }
            function amount(v){
              try{return billAmountText(v);}
              catch(e){
                return '₹ '+(Number(v)||0).toLocaleString(
                  'en-IN',
                  {
                    minimumFractionDigits:2,
                    maximumFractionDigits:2
                  }
                );
              }
            }
            function uniq(a){
              return [...new Set(
                a.map(S).filter(Boolean)
              )].sort(
                (x,y)=>x.localeCompare(
                  y,
                  undefined,
                  {
                    numeric:true,
                    sensitivity:'base'
                  }
                )
              );
            }
            function mbNo(x){
              return S(x?.number||x?.mbNumber||x?.mb);
            }
            function workName(x){
              return S(x?.name||x?.workName||x?.work);
            }
            function jeName(x){
              return S(x?.je||x?.jeName||x?.juniorEngineer);
            }
            function contractor(x){
              return S(
                x?.contractor||
                x?.agency||
                x?.contractorName||
                x?.agencyName
              );
            }
            function billType(x){
              return S(
                x?.billType||
                x?.type||
                x?.billName
              );
            }
            function billNo(x){
              return S(
                x?.billNo||
                x?.number||
                x?.billNumber
              );
            }
            function transferNo(x){
              return S(
                x?.number||
                x?.mb||
                x?.mbNumber
              );
            }
            function size(x){
              const z=N(x);
              if(
                z==='small'||
                z.includes('small')||
                z.includes('लहान')
              ) return 'SMALL';

              if(
                z==='large'||
                z.includes('large')||
                z.includes('big')||
                z.includes('मोठ')
              ) return 'LARGE';

              return '';
            }

            function data(){
              try{
                const d=homeRelData();

                return {
                  mbs:A(d.mbs),
                  jes:A(d.jes),
                  works:A(d.works),
                  assigns:A(d.assigns),
                  transfers:A(d.transfers),
                  bills:A(d.bills)
                };
              }catch(e){
                return {
                  mbs:[],
                  jes:[],
                  works:[],
                  assigns:[],
                  transfers:[],
                  bills:[]
                };
              }
            }

            function ctx(){
              const type=
                document.getElementById('homeRelType')?.value||'';

              const target=
                document.getElementById('homeRelTarget')?.value||'';

              const cv=
                document.getElementById('homeRelComponent')?.value||'';

              const parts=cv.split('::');

              return {
                type,
                target,
                ctype:parts[0]||'',
                cvalue:parts.slice(1).join('::'),
                detail:
                  document.getElementById('homeRelDetail')?.value||'',
                billType:
                  document.getElementById('homeRelBillType')?.value||''
              };
            }

            function inRange(v,from,to){
              try{
                return homeRelInRange(v,from,to);
              }catch(e){
                return true;
              }
            }

            function dates(){
              const from=
                document.getElementById('homeRelFrom')?.value||'';

              const to=
                document.getElementById('homeRelTo')?.value||'';

              return {from,to};
            }

            function linkedByMB(d,mb){
              const k=N(mb);

              const mbs=d.mbs.filter(
                x=>N(mbNo(x))===k
              );

              const works=d.works.filter(
                x=>N(
                  x?.mbNumber||
                  x?.mbNo||
                  x?.mb
                )===k
              );

              const assigns=d.assigns.filter(
                x=>N(
                  x?.mbNumber||
                  x?.mbNo||
                  x?.mb
                )===k
              );

              const transfers=d.transfers.filter(
                x=>N(
                  transferNo(x)
                )===k
              );

              const bills=d.bills.filter(
                x=>N(
                  x?.mbNumber||
                  x?.mbNo||
                  x?.mb
                )===k
              );

              return {
                mbs,
                works,
                assigns,
                transfers,
                bills
              };
            }

            function baseFor(type,d){
              if(type==='MB'){
                return d.mbs;
              }

              if(type==='JE'){
                return d.jes;
              }

              if(type==='WORK'){
                return d.works;
              }

              if(type==='CONTRACTOR'){
                return [
                  ...d.works,
                  ...d.bills,
                  ...d.assigns
                ];
              }

              if(type==='BILL'){
                return d.bills;
              }

              if(type==='TRANSFER'){
                return d.transfers;
              }

              return [];
            }

            function option(value,label){
              return '<option value="'+
                E(value)+
                '">'+
                E(label)+
                '</option>';
            }

            function renderTargets(){
              const d=data();
              const c=ctx();

              const el=
                document.getElementById('homeRelTarget');

              if(!el)return;

              let values=[];

              if(c.type==='MB'){
                values=[
                  ['ALL','सर्व M.B.'],
                  [MB_SMALL,'Small M.B.'],
                  [MB_LARGE,'Large M.B.'],
                  ...uniq(d.mbs.map(mbNo))
                    .map(x=>[
                      MB_PREFIX+x,
                      x
                    ])
                ];
              }

              else if(c.type==='JE'){
                values=[
                  ['ALL','सर्व JE'],
                  ...uniq(
                    d.jes.map(jeName)
                      .concat(
                        d.works.map(jeName)
                      )
                      .concat(
                        d.bills.map(jeName)
                      )
                  ).map(x=>[x,x])
                ];
              }

              else if(c.type==='WORK'){
                values=[
                  ['ALL','सर्व कामे'],
                  ...uniq(
                    d.works.map(workName)
                  ).map(x=>[x,x])
                ];
              }

              else if(c.type==='CONTRACTOR'){
                values=[
                  ['ALL','सर्व Contractor / Agency'],
                  ...uniq(
                    d.works.map(contractor)
                      .concat(
                        d.bills.map(contractor)
                      )
                  ).map(x=>[x,x])
                ];
              }

              else if(c.type==='BILL'){
                values=[
                  ['ALL','सर्व Bill'],
                  ...uniq(
                    d.bills.map(
                      x=>billType(x)+' '+billNo(x)
                    )
                  ).map(x=>[x,x])
                ];
              }

              else if(c.type==='TRANSFER'){
                values=[
                  ['ALL','सर्व Transfer / History'],
                  ...uniq(
                    d.transfers.map(transferNo)
                  ).map(x=>[x,x])
                ];
              }

              el.innerHTML=values.map(
                x=>option(x[0],x[1])
              ).join('');

              renderComponents();
            }

            function renderComponents(){
              const d=data();
              const c=ctx();

              const el=
                document.getElementById('homeRelComponent');

              if(!el)return;

              let values=[
                ['ALL','सर्व संबंधित माहिती']
              ];

              if(c.type==='MB'){
                values.push(
                  ['JE','Junior Engineer'],
                  ['WORK','Work Name'],
                  ['CONTRACTOR','Contractor / Agency'],
                  ['BILL','Bill'],
                  ['TRANSFER','Transfer / History']
                );
              }

              else if(c.type==='JE'){
                values.push(
                  ['MB','M.B.'],
                  ['WORK','Work Name'],
                  ['CONTRACTOR','Contractor / Agency'],
                  ['BILL','Bill'],
                  ['TRANSFER','Transfer / History']
                );
              }

              else if(c.type==='WORK'){
                values.push(
                  ['MB','M.B.'],
                  ['JE','Junior Engineer'],
                  ['CONTRACTOR','Contractor / Agency'],
                  ['BILL','Bill']
                );
              }

              else if(c.type==='CONTRACTOR'){
                values.push(
                  ['WORK','Work Name'],
                  ['MB','M.B.'],
                  ['JE','Junior Engineer'],
                  ['BILL','Bill']
                );
              }

              else if(c.type==='BILL'){
                values.push(
                  ['MB','M.B.'],
                  ['WORK','Work Name'],
                  ['CONTRACTOR','Contractor / Agency'],
                  ['JE','Junior Engineer'],
                  ['TRANSFER','Transfer / History']
                );
              }

              else if(c.type==='TRANSFER'){
                values.push(
                  ['MB','M.B.'],
                  ['JE','Junior Engineer'],
                  ['WORK','Work Name'],
                  ['CONTRACTOR','Contractor / Agency'],
                  ['BILL','Bill']
                );
              }

              el.innerHTML=values.map(
                x=>option(
                  x[0],
                  x[1]
                )
              ).join('');

              renderDetails();
            }

            function selectedBase(){
              const d=data();
              const c=ctx();

              let arr=[];

              if(c.type==='MB'){
                if(c.target==='ALL'){
                  arr=d.mbs;
                }
                else if(c.target===MB_SMALL){
                  arr=d.mbs.filter(
                    x=>size(x)==='SMALL'
                  );
                }
                else if(c.target===MB_LARGE){
                  arr=d.mbs.filter(
                    x=>size(x)==='LARGE'
                  );
                }
                else if(c.target.startsWith(MB_PREFIX)){
                  const mb=
                    c.target.slice(
                      MB_PREFIX.length
                    );

                  arr=d.mbs.filter(
                    x=>N(mbNo(x))===N(mb)
                  );
                }
              }

              else if(c.type==='JE'){
                if(c.target==='ALL'){
                  arr=baseFor('JE',d);
                }else{
                  arr=baseFor('JE',d).filter(
                    x=>N(jeName(x))===N(c.target)
                  );
                }
              }

              else if(c.type==='WORK'){
                if(c.target==='ALL'){
                  arr=d.works;
                }else{
                  arr=d.works.filter(
                    x=>N(workName(x))===N(c.target)
                  );
                }
              }

              else if(c.type==='CONTRACTOR'){
                if(c.target==='ALL'){
                  arr=baseFor(
                    'CONTRACTOR',
                    d
                  );
                }else{
                  arr=baseFor(
                    'CONTRACTOR',
                    d
                  ).filter(
                    x=>N(contractor(x))===N(c.target)
                  );
                }
              }

              else if(c.type==='BILL'){
                if(c.target==='ALL'){
                  arr=d.bills;
                }else{
                  arr=d.bills.filter(
                    x=>N(
                      billType(x)+' '+billNo(x)
                    )===N(c.target)
                  );
                }
              }

              else if(c.type==='TRANSFER'){
                if(c.target==='ALL'){
                  arr=d.transfers;
                }else{
                  arr=d.transfers.filter(
                    x=>N(
                      transferNo(x)
                    )===N(c.target)
                  );
                }
              }

              return arr;
            }

            function renderDetails(){
              const d=data();
              const c=ctx();

              const el=
                document.getElementById('homeRelDetail');

              if(!el)return;

              let values=[
                ['__
