name: MBMS V128 FINAL - M.B. Summary Linked - Corrected

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v4

      - name: Install SDK
        run: |
          set -e
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Install Gradle
        run: |
          set -e
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
          mkdir -p "$HOME/gradle"
          unzip -q gradle-8.7-bin.zip -d "$HOME/gradle"
          echo "$HOME/gradle/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: Find and prepare HTML
        run: |
          set -euo pipefail

          HTML_FILE=""

          for f in \
            Measurement_Book_Management_System_FINAL_V120_TRANSFER_REPORT_FINAL.html \
            Measurement_Book_Management_System_FINAL_V118_PRINT_BACKUP_ANDROID.html \
            Measurement_Book_Management_System_FINAL_V115_MB_HISTORY_ONLY_DATE-6.html \
            Measurement_Book_Management_System_FINAL_V115_MB_HISTORY_ONLY_DATE.html \
            Measurement_Book_Management_System_FINAL_V115.html \
            V115.html \
            index.html
          do
            if [ -f "$f" ]; then
              HTML_FILE="$f"
              break
            fi
          done

          if [ -z "$HTML_FILE" ]; then
            HTML_FILE=$(find . \
              -maxdepth 3 \
              -type f \
              -iname '*.html' \
              -not -path './.git/*' \
              | head -1 || true)
          fi

          if [ -z "$HTML_FILE" ]; then
            echo "ERROR: MBMS HTML file not found."
            exit 1
          fi

          echo "HTML_FILE=$HTML_FILE" >> "$GITHUB_ENV"

          mkdir -p mbms_work

          cp "$HTML_FILE" mbms_work/index.html

          test -s mbms_work/index.html

      - name: Received -> JE full list correction
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path

          p = Path("mbms_work/index.html")
          text = p.read_text(encoding="utf-8")

          old1 = (
              "if(isJE){loadTransferJEs();"
              "if(je){je.value=sourceName;je.disabled=true;}}"
          )

          new1 = (
              "if(isJE){loadTransferJEs();"
              "if(je){je.value=sourceName;je.disabled=false;}}"
          )

          text = text.replace(old1, new1, 1)

          old2 = "if(isJE&&je)je.disabled=true;"
          new2 = "if(isJE&&je)je.disabled=false;"

          text = text.replace(old2, new2, 1)

          p.write_text(text, encoding="utf-8")

          print("Received -> JE full list correction applied.")
          PY

          grep -q "if(isJE&&je)je.disabled=false;" \
            mbms_work/index.html

      - name: Core function checks
        run: |
          set -euo pipefail

          for x in \
            mbmsSettingsSnapshot \
            downloadSettingsBackup \
            restoreSettingsBackup \
            generateTransferReport \
            saveTransferMB \
            getTransferHistory
          do
            grep -q "$x" mbms_work/index.html || {
              echo "Missing required function: $x"
              exit 1
            }
          done

      - name: Create Android project
        run: |
          set -euo pipefail

          rm -rf mbms_android release

          mkdir -p \
            mbms_android/app/src/main/java/com/mbms/app \
            mbms_android/app/src/main/res/values \
            mbms_android/app/src/main/assets \
            release

          cp \
            mbms_work/index.html \
            mbms_android/app/src/main/assets/index.html

          cat > mbms_android/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(
                  RepositoriesMode.FAIL_ON_PROJECT_REPOS
              )

              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "MBMS-V128"

          include(":app")
          EOF

          cat > mbms_android/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF

          cat > mbms_android/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat > mbms_android/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.mbms.app'

              compileSdk 35

              defaultConfig {
                  applicationId 'com.mbms.app'
                  minSdk 26
                  targetSdk 35
                  versionCode 128
                  versionName 'V128'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat > mbms_android/app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">Measurement Book Management System</string>
          </resources>
          EOF

          cat > mbms_android/app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style
                  name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">

                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#176aa4</item>

              </style>
          </resources>
          EOF

          cat > mbms_android/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest
              xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission
                  android:name="android.permission.READ_MEDIA_IMAGES" />

              <application
                  android:theme="@style/AppTheme"
                  android:label="@string/app_name"
                  android:allowBackup="true"
                  android:supportsRtl="true">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">

                      <intent-filter>
                          <action
                              android:name="android.intent.action.MAIN" />

                          <category
                              android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cat > mbms_android/app/src/main/java/com/mbms/app/MainActivity.java <<'EOF'
          package com.mbms.app;

          import android.app.Activity;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Environment;

          import android.content.Intent;
          import android.content.ContentValues;

          import android.net.Uri;

          import android.provider.MediaStore;

          import android.webkit.WebView;
          import android.webkit.WebSettings;
          import android.webkit.WebViewClient;
          import android.webkit.WebChromeClient;
          import android.webkit.ValueCallback;
          import android.webkit.JavascriptInterface;

          import android.print.PrintAttributes;
          import android.print.PrintManager;

          import android.graphics.Color;

          import android.widget.Toast;

          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.OutputStream;

          import java.nio.charset.StandardCharsets;

          public class MainActivity extends Activity {

              private WebView webView;

              private static final int REQUEST_FILE = 7001;

              private ValueCallback<Uri[]> filePathCallback;


              @Override
              protected void onCreate(Bundle savedInstanceState) {

                  super.onCreate(savedInstanceState);


                  webView = new WebView(this);

                  webView.setBackgroundColor(Color.WHITE);


                  WebSettings settings =
                          webView.getSettings();

                  settings.setJavaScriptEnabled(true);

                  settings.setDomStorageEnabled(true);

                  settings.setDatabaseEnabled(true);

                  settings.setAllowFileAccess(true);

                  settings.setAllowContentAccess(true);

                  settings.setSupportZoom(false);


                  webView.setWebChromeClient(
                          new WebChromeClient() {

                              @Override
                              public boolean onShowFileChooser(
                                      WebView view,
                                      ValueCallback<Uri[]> callback,
                                      WebChromeClient.FileChooserParams params) {

                                  if (filePathCallback != null) {
                                      filePathCallback = null;
                                  }

                                  filePathCallback = callback;

                                  try {

                                      Intent intent =
                                              params.createIntent();

                                      startActivityForResult(
                                              intent,
                                              REQUEST_FILE
                                      );

                                  } catch (Exception e) {

                                      filePathCallback = null;

                                      return false;
                                  }

                                  return true;
                              }
                          }
                  );


                  webView.addJavascriptInterface(
                          new Object() {

                              @JavascriptInterface
                              public void print() {

                                  runOnUiThread(
                                          () -> {

                                              try {

                                                  PrintManager manager =
                                                          (PrintManager)
                                                                  getSystemService(
                                                                          PRINT_SERVICE
                                                                  );

                                                  if (manager == null) {
                                                      return;
                                                  }

                                                  manager.print(
                                                          "MBMS",
                                                          webView
                                                                  .createPrintDocumentAdapter(
                                                                          "MBMS"
                                                                  ),
                                                          new PrintAttributes
                                                                  .Builder()
                                                                  .build()
                                                  );

                                              } catch (Exception e) {

                                                  e.printStackTrace();

                                              }
                                          }
                                  );
                              }


                              @JavascriptInterface
                              public void saveBackup(
                                      String filename,
                                      String json) {

                                  new Thread(
                                          () -> {

                                              boolean success = false;

                                              try {

                                                  if (
                                                          Build.VERSION.SDK_INT >=
                                                                  Build.VERSION_CODES.Q
                                                  ) {

                                                      ContentValues values =
                                                              new ContentValues();

                                                      values.put(
                                                              MediaStore.Downloads
                                                                      .DISPLAY_NAME,
                                                              filename
                                                      );

                                                      values.put(
                                                              MediaStore.Downloads
                                                                      .MIME_TYPE,
                                                              "application/json"
                                                      );

                                                      values.put(
                                                              MediaStore.Downloads
                                                                      .RELATIVE_PATH,
                                                              Environment
                                                                      .DIRECTORY_DOWNLOADS
                                                      );

                                                      Uri uri =
                                                              getContentResolver()
                                                                      .insert(
                                                                              MediaStore.Downloads
                                                                                      .EXTERNAL_CONTENT_URI,
                                                                              values
                                                                      );

                                                      if (uri != null) {

                                                          try (
                                                                  OutputStream output =
                                                                          getContentResolver()
                                                                                  .openOutputStream(
                                                                                          uri
                                                                                  )
                                                          ) {

                                                              if (output != null) {

                                                                  output.write(
                                                                          json.getBytes(
                                                                                  StandardCharsets.UTF_8
                                                                          )
                                                                  );

                                                                  output.flush();

                                                                  success = true;
                                                              }
                                                          }
                                                      }

                                                  } else {

                                                      File directory =
                                                              Environment
                                                                      .getExternalStoragePublicDirectory(
                                                                              Environment
                                                                                      .DIRECTORY_DOWNLOADS
                                                                      );

                                                      if (!directory.exists()) {
                                                          directory.mkdirs();
                                                      }

                                                      File file =
                                                              new File(
                                                                      directory,
                                                                      filename
                                                              );

                                                      try (
                                                              FileOutputStream output =
                                                                      new FileOutputStream(
                                                                              file
                                                                      )
                                                      ) {

                                                          output.write(
                                                                  json.getBytes(
                                                                          StandardCharsets.UTF_8
                                                                  )
                                                          );

                                                          output.flush();

                                                          success = true;
                                                      }
                                                  }

                                              } catch (Exception e) {

                                                  e.printStackTrace();
                                              }


                                              boolean result = success;


                                              runOnUiThread(
                                                      () ->
                                                              Toast.makeText(
                                                                      MainActivity.this,
                                                                      result
                                                                              ? "Backup Downloads मध्ये Save झाला."
                                                                              : "Backup Save मध्ये त्रुटी आली.",
                                                                      Toast.LENGTH_LONG
                                                              ).show()
                                              );

                                          }
                                  ).start();
                              }

                          },
                          "AndroidBridge"
                  );


                  webView.setWebViewClient(
                          new WebViewClient()
                  );


                  webView.loadUrl(
                          "file:///android_asset/index.html"
                  );


                  setContentView(webView);
              }


              @Override
              protected void onActivityResult(
                      int requestCode,
                      int resultCode,
                      Intent data) {

                  super.onActivityResult(
                          requestCode,
                          resultCode,
                          data
                  );


                  if (
                          requestCode == REQUEST_FILE &&
                          filePathCallback != null
                  ) {

                      Uri[] results = null;


                      if (
                              resultCode == RESULT_OK &&
                              data != null &&
                              data.getData() != null
                      ) {

                          results =
                                  new Uri[]{
                                          data.getData()
                                  };
                      }


                      filePathCallback.onReceiveValue(
                              results
                      );


                      filePathCallback = null;
                  }
              }


              @Override
              public void onBackPressed() {

                  if (
                          webView != null &&
                          webView.canGoBack()
                  ) {

                      webView.goBack();

                  } else {

                      super.onBackPressed();
                  }
              }
          }
          EOF

          cd mbms_android

          gradle \
            --no-daemon \
            --stacktrace \
            :app:assembleDebug

          cd ..

          cp \
            mbms_android/app/build/outputs/apk/debug/app-debug.apk \
            release/MBMS-V128-MB-SUMMARY-LINKED-CORRECTED.apk

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify \
            release/MBMS-V128-MB-SUMMARY-LINKED-CORRECTED.apk

          sha256sum \
            release/MBMS-V128-MB-SUMMARY-LINKED-CORRECTED.apk \
            | tee release/SHA256.txt

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: MBMS-V128-MB-SUMMARY-LINKED-CORRECTED
          path: release/*
          if-no-files-found: error
