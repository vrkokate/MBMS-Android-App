name: MBMS V128 FINAL - M.B. Summary Linked - Corrected

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v4

      - name: Install SDK
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
          mkdir -p "$HOME/gradle"
          unzip -q gradle-8.7-bin.zip -d "$HOME/gradle"
          echo "$HOME/gradle/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: Find and prepare HTML
        run: |
          set -euo pipefail

          HTML_FILE=""

          for f in \
            Measurement_Book_Management_System_FINAL_V120_TRANSFER_REPORT_FINAL.html \
            Measurement_Book_Management_System_FINAL_V118_PRINT_BACKUP_ANDROID.html \
            Measurement_Book_Management_System_FINAL_V115_MB_HISTORY_ONLY_DATE-6.html \
            Measurement_Book_Management_System_FINAL_V115_MB_HISTORY_ONLY_DATE.html \
            Measurement_Book_Management_System_FINAL_V115.html \
            V115.html \
            index.html
          do
            [ -f "$f" ] && HTML_FILE="$f" && break
          done

          [ -n "$HTML_FILE" ] || \
            HTML_FILE=$(find . -maxdepth 3 -type f -iname '*.html' \
            -not -path './.git/*' | head -1 || true)

          [ -n "$HTML_FILE" ] || {
            echo "ERROR: HTML not found"
            exit 1
          }

          echo "HTML_FILE=$HTML_FILE" >> "$GITHUB_ENV"

          mkdir -p mbms_work
          cp "$HTML_FILE" mbms_work/index.html

          test -s mbms_work/index.html

      - name: Received -> JE full list correction
        run: |
          python3 <<'PY'
          from pathlib import Path

          p = Path("mbms_work/index.html")
          t = p.read_text(encoding="utf-8")

          t = t.replace(
              "if(isJE){loadTransferJEs();if(je){je.value=sourceName;je.disabled=true;}}",
              "if(isJE){loadTransferJEs();if(je){je.value=sourceName;je.disabled=false;}}",
              1
          )

          t = t.replace(
              "if(isJE&&je)je.disabled=true;",
              "if(isJE&&je)je.disabled=false;",
              1
          )

          p.write_text(t, encoding="utf-8")
          PY

          grep -q \
            "if(isJE&&je)je.disabled=false;" \
            mbms_work/index.html

      - name: Core function checks
        run: |
          set -e

          for x in \
            mbmsSettingsSnapshot \
            downloadSettingsBackup \
            restoreSettingsBackup \
            generateTransferReport \
            saveTransferMB \
            getTransferHistory
          do
            grep -q "$x" mbms_work/index.html || {
              echo "Missing $x"
              exit 1
            }
          done

      - name: Apply M.B. Summary linked fix
        run: |
          set -Eeuo pipefail

          cat > /tmp/mbms_summary_patch.js <<'PATCH_JS'
          /* V128 - ONLY M.B. SUMMARY LINKED DRILL-DOWN FIX */
          (function(){
            'use strict';

            const TYPE_LABELS={
              MB:'M.B.',
              JE:'Junior Engineer',
              WORK:'कामाचे नाव',
              CONTRACTOR:'Contractor / Agency',
              BILL:'Bill',
              TRANSFER:'Transfer / History'
            };

            const DETAIL_ALL='__ALL_DETAIL__';
            const MB_SMALL='__SMALL_MB__';
            const MB_LARGE='__LARGE_MB__';
            const MB_PREFIX='__MBNO__::';

            function A(v){
              return Array.isArray(v)?v:[];
            }

            function S(v){
              return v==null?'':String(v).trim();
            }

            function N(v){
              try{
                return hrNorm(v);
              }catch(e){
                return S(v)
                  .toLowerCase()
                  .replace(/\s+/g,' ');
              }
            }

            function E(v){
              try{
                return escapeHtml(S(v));
              }catch(e){
                return S(v).replace(
                  /[&<>"']/g,
                  function(c){
                    return ({
                      '&':'&amp;',
                      '<':'&lt;',
                      '>':'&gt;',
                      '"':'&quot;',
                      "'":'&#39;'
                    })[c];
                  }
                );
              }
            }

            function D(v){
              try{
                return hrDate(v||'');
              }catch(e){
                return S(v)||'-';
              }
            }

            function amount(v){
              try{
                return billAmountText(v);
              }catch(e){
                return '₹ '+(Number(v)||0).toLocaleString(
                  'en-IN',
                  {
                    minimumFractionDigits:2,
                    maximumFractionDigits:2
                  }
                );
              }
            }

            function uniq(a){
              return [...new Set(
                a.map(S).filter(Boolean)
              )].sort(
                (x,y)=>
                  x.localeCompare(
                    y,
                    undefined,
                    {
                      numeric:true,
                      sensitivity:'base'
                    }
                  )
              );
            }

            function mbNo(x){
              return S(
                x?.number ||
                x?.mbNumber ||
                x?.mb
              );
            }

            function workName(x){
              return S(
                x?.name ||
                x?.workName ||
                x?.work
              );
            }

            function jeName(x){
              return S(
                x?.je ||
                x?.jeName ||
                x?.juniorEngineer
              );
            }

            function contractor(x){
              return S(
                x?.contractor ||
                x?.agency ||
                x?.contractorName ||
                x?.agencyName
              );
            }

            function billType(x){
              return S(
                x?.billType ||
                x?.type ||
                x?.billName
              );
            }

            function billNo(x){
              return S(
                x?.billNo ||
                x?.number ||
                x?.billNumber
              );
            }

            function transferNo(x){
              return S(
                x?.number ||
                x?.mb ||
                x?.mbNumber
              );
            }

            function size(x){
              const z=N(x);

              if(
                z==='small' ||
                z.includes('small') ||
                z.includes('लहान')
              ){
                return 'SMALL';
              }

              if(
                z==='large' ||
                z.includes('large') ||
                z.includes('big') ||
                z.includes('मोठ')
              ){
                return 'LARGE';
              }

              return '';
            }

            function data(){
              try{
                const d=homeRelData();

                return {
                  mbs:A(d.mbs),
                  jes:A(d.jes),
                  works:A(d.works),
                  assigns:A(d.assigns),
                  transfers:A(d.transfers),
                  bills:A(d.bills)
                };
              }catch(e){
                return {
                  mbs:[],
                  jes:[],
                  works:[],
                  assigns:[],
                  transfers:[],
                  bills:[]
                };
              }
            }

            function ctx(){
              const type=
                document.getElementById(
                  'homeRelType'
                )?.value||'';

              const target=
                document.getElementById(
                  'homeRelTarget'
                )?.value||'';

              const cv=
                document.getElementById(
                  'homeRelComponent'
                )?.value||'';

              const parts=cv.split('::');

              return {
                type,
                target,
                ctype:parts[0]||'',
                cvalue:parts.slice(1).join('::'),
                detail:
                  document.getElementById(
                    'homeRelDetail'
                  )?.value||'',
                billType:
                  document.getElementById(
                    'homeRelBillType'
                  )?.value||''
              };
            }

            function inRange(v,from,to){
              try{
                return homeRelInRange(
                  v,
                  from,
                  to
                );
              }catch(e){
                const k=S(v);

                return (
                  (!from||k>=from) &&
                  (!to||k<=to)
                );
              }
            }

            function dateFilter(d){
              const from=
                document.getElementById(
                  'homeRelFrom'
                )?.value||'';

              const to=
                document.getElementById(
                  'homeRelTo'
                )?.value||'';

              if(!from&&!to){
                return d;
              }

              return {
                mbs:d.mbs.filter(
                  x=>
                    inRange(
                      x.receivedDate||
                      x.date||
                      x.createdAt,
                      from,
                      to
                    )
                ),

                jes:d.jes,

                works:d.works.filter(
                  x=>
                    inRange(
                      x.createdAt||
                      x.date||
                      x.workDate,
                      from,
                      to
                    )
                ),

                assigns:d.assigns.filter(
                  x=>
                    inRange(
                      x.date||
                      x.assignedDate||
                      x.createdAt,
                      from,
                      to
                    )
                ),

                transfers:d.transfers.filter(
                  x=>
                    inRange(
                      x.date||
                      x.transferDate||
                      x.savedAt,
                      from,
                      to
                    )
                ),

                bills:d.bills.filter(
                  x=>
                    inRange(
                      x.billDate||
                      x.date||
                      x.savedAt,
                      from,
                      to
                    )
                )
              };
            }

            function linkedByMB(d,mbs){
              const set=new Set(
                mbs.map(N).filter(Boolean)
              );

              return {
                mbs:d.mbs.filter(
                  x=>set.has(N(mbNo(x)))
                ),

                works:d.works.filter(
                  x=>set.has(N(x?.mb))
                ),

                assigns:d.assigns.filter(
                  x=>set.has(N(x?.mb))
                ),

                transfers:d.transfers.filter(
                  x=>set.has(N(transferNo(x)))
                ),

                bills:d.bills.filter(
                  x=>set.has(N(x?.mb))
                )
              };
            }

            function baseFor(c,d){
              const all=c.target==='__ALL__';
              const t=N(c.target);

              let out={
                mbs:[],
                works:[],
                assigns:[],
                transfers:[],
                bills:[],
                jes:d.jes
              };

              if(c.type==='MB'){
                out.mbs=
                  all
                    ? d.mbs
                    : d.mbs.filter(
                        x=>N(mbNo(x))===t
                      );

                return Object.assign(
                  out,
                  linkedByMB(
                    d,
                    out.mbs.map(mbNo)
                  )
                );
              }

              if(c.type==='JE'){
                const w=
                  all
                    ? d.works
                    : d.works.filter(
                        x=>N(jeName(x))===t
                      );

                const b=
                  all
                    ? d.bills
                    : d.bills.filter(
                        x=>N(jeName(x))===t
                      );

                const a=
                  all
                    ? d.assigns
                    : d.assigns.filter(
                        x=>N(jeName(x))===t
                      );

                const mbs=uniq(
                  w.map(x=>x?.mb)
                    .concat(
                      b.map(x=>x?.mb),
                      a.map(x=>x?.mb)
                    )
                );

                return {
                  mbs:d.mbs.filter(
                    x=>
                      mbs.some(
                        m=>N(mbNo(x))===N(m)
                      )
                  ),
                  works:w,
                  assigns:a,
                  transfers:d.transfers.filter(
                    x=>
                      mbs.some(
                        m=>N(transferNo(x))===N(m)
                      )
                  ),
                  bills:b,
                  jes:d.jes
                };
              }

              if(c.type==='WORK'){
                const w=
                  all
                    ? d.works
                    : d.works.filter(
                        x=>N(workName(x))===t
                      );

                const names=new Set(
                  w.map(x=>N(workName(x)))
                );

                const b=
                  all
                    ? d.bills
                    : d.bills.filter(
                        x=>
                          names.has(
                            N(workName(x))
                          ) ||
                          N(x?.work)===t
                      );

                const mbs=uniq(
                  w.map(x=>x?.mb)
                    .concat(
                      b.map(x=>x?.mb)
                    )
                );

                return {
                  mbs:d.mbs.filter(
                    x=>
                      mbs.some(
                        m=>N(mbNo(x))===N(m)
                      )
                  ),
                  works:w,
                  assigns:d.assigns.filter(
                    x=>
                      mbs.some(
                        m=>N(x?.mb)===N(m)
                      )
                  ),
                  transfers:d.transfers.filter(
                    x=>
                      mbs.some(
                        m=>N(transferNo(x))===N(m)
                      )
                  ),
                  bills:b,
                  jes:d.jes
                };
              }

              if(c.type==='CONTRACTOR'){
                const w=
                  all
                    ? d.works
                    : d.works.filter(
                        x=>N(contractor(x))===t
                      );

                const b=
                  all
                    ? d.bills
                    : d.bills.filter(
                        x=>N(contractor(x))===t
                      );

                const a=
                  all
                    ? d.assigns
                    : d.assigns.filter(
                        x=>N(contractor(x))===t
                      );

                const mbs=uniq(
                  w.map(x=>x?.mb)
                    .concat(
                      b.map(x=>x?.mb),
                      a.map(x=>x?.mb)
                    )
                );

                return {
                  mbs:d.mbs.filter(
                    x=>
                      mbs.some(
                        m=>N(mbNo(x))===N(m)
                      )
                  ),
                  works:w,
                  assigns:a,
                  transfers:d.transfers.filter(
                    x=>
                      mbs.some(
                        m=>N(transferNo(x))===N(m)
                      )
                  ),
                  bills:b,
                  jes:d.jes
                };
              }

              if(c.type==='BILL'){
                const b=
                  all
                    ? d.bills
                    : d.bills.filter(
                        x=>
                          N(billNo(x))===t ||
                          N(billType(x))===t
                      );

                const mbs=uniq(
                  b.map(x=>x?.mb)
                );

                return {
                  mbs:d.mbs.filter(
                    x=>
                      mbs.some(
                        m=>N(mbNo(x))===N(m)
                      )
                  ),

                  works:d.works.filter(
                    x=>
                      mbs.some(
                        m=>N(x?.mb)===N(m)
                      ) ||
                      b.some(
                        bb=>
                          N(workName(bb))===
                          N(workName(x))
                      )
                  ),

                  assigns:d.assigns.filter(
                    x=>
                      mbs.some(
                        m=>N(x?.mb)===N(m)
                      )
                  ),

                  transfers:d.transfers.filter(
                    x=>
                      mbs.some(
                        m=>N(transferNo(x))===N(m)
                      )
                  ),

                  bills:b,
                  jes:d.jes
                };
              }

              if(c.type==='TRANSFER'){
                const tr=
                  all
                    ? d.transfers
                    : d.transfers.filter(
                        x=>
                          N(transferNo(x))===t
                      );

                const mbs=uniq(
                  tr.map(transferNo)
                );

                return {
                  mbs:d.mbs.filter(
                    x=>
                      mbs.some(
                        m=>N(mbNo(x))===N(m)
                      )
                  ),

                  works:d.works.filter(
                    x=>
                      mbs.some(
                        m=>N(x?.mb)===N(m)
                      )
                  ),

                  assigns:d.assigns.filter(
                    x=>
                      mbs.some(
                        m=>N(x?.mb)===N(m)
                      )
                  ],

                  transfers:tr,

                  bills:d.bills.filter(
                    x=>
                      mbs.some(
                        m=>N(x?.mb)===N(m)
                      )
                  ),

                  jes:d.jes
                };
              }

              return out;
            }

            function applyComponentFilter(c,b){
              const detail=c.detail;

              if(
                c.ctype==='ALL' ||
                !c.ctype
              ){
                return b;
              }

              if(c.ctype==='MB'){
                let m=b.mbs;

                if(detail===MB_SMALL){
                  m=m.filter(
                    x=>size(x?.size)==='SMALL'
                  );
                }
                else if(detail===MB_LARGE){
                  m=m.filter(
                    x=>size(x?.size)==='LARGE'
                  );
                }
                else if(
                  detail.startsWith(MB_PREFIX)
                ){
                  m=m.filter(
                    x=>
                      N(mbNo(x))===
                      N(
                        detail.slice(
                          MB_PREFIX.length
                        )
                      )
                  );
                }

                return linkedByMB(
                  Object.assign(
                    {},
                    b,
                    {mbs:b.mbs}
                  ),
                  m.map(mbNo)
                );
              }

              if(
                c.ctype==='WORK' &&
                detail &&
                detail!==DETAIL_ALL
              ){
                const w=b.works.filter(
                  x=>N(workName(x))===N(detail)
                );

                const names=new Set(
                  w.map(x=>N(workName(x)))
                );

                return {
                  mbs:b.mbs.filter(
                    x=>
                      w.some(
                        y=>
                          N(y?.mb)===
                          N(mbNo(x))
                      )
                  ),

                  works:w,

                  assigns:b.assigns.filter(
                    x=>
                      w.some(
                        y=>
                          N(y?.mb)===
                          N(x?.mb)
                      )
                  ),

                  transfers:b.transfers.filter(
                    x=>
                      w.some(
                        y=>
                          N(y?.mb)===
                          N(transferNo(x))
                      )
                  ),

                  bills:b.bills.filter(
                    x=>
                      names.has(
                        N(workName(x))
                      )
                  ),

                  jes:b.jes
                };
              }

              if(
                c.ctype==='JE' &&
                detail &&
                detail!==DETAIL_ALL
              ){
                const w=b.works.filter(
                  x=>N(jeName(x))===N(detail)
                );

                const bills=b.bills.filter(
                  x=>N(jeName(x))===N(detail)
                );

                const nums=uniq(
                  w.map(x=>x?.mb)
                    .concat(
                      bills.map(x=>x?.mb)
                    )
                );

                return {
                  mbs:b.mbs.filter(
                    x=>
                      nums.some(
                        m=>N(mbNo(x))===N(m)
                      )
                  ),

                  works:w,

                  assigns:b.assigns.filter(
                    x=>
                      nums.some(
                        m=>N(x?.mb)===N(m)
                      )
                  ),

                  transfers:b.transfers.filter(
                    x=>
                      nums.some(
                        m=>N(transferNo(x))===N(m)
                      )
                  ),

                  bills,

                  jes:b.jes
                };
              }

              if(
                c.ctype==='CONTRACTOR' &&
                detail &&
                detail!==DETAIL_ALL
              ){
                const w=b.works.filter(
                  x=>N(contractor(x))===N(detail)
                );

                const bills=b.bills.filter(
                  x=>N(contractor(x))===N(detail)
                );

                const nums=uniq(
                  w.map(x=>x?.mb)
                    .concat(
                      bills.map(x=>x?.mb)
                    )
                );

                return {
                  mbs:b.mbs.filter(
                    x=>
                      nums.some(
                        m=>N(mbNo(x))===N(m)
                      )
                  ),

                  works:w,

                  assigns:b.assigns.filter(
                    x=>
                      nums.some(
                        m=>N(x?.mb)===N(m)
                      )
                  ),

                  transfers:b.transfers.filter(
                    x=>
                      nums.some(
                        m=>N(transferNo(x))===N(m)
                      )
                  ),

                  bills,

                  jes:b.jes
                };
              }

              if(
                c.ctype==='BILL' &&
                detail &&
                detail!==DETAIL_ALL
              ){
                const bills=b.bills.filter(
                  x=>
                    N(billType(x))===N(detail) ||
                    N(billNo(x))===N(detail)
                );

                const nums=uniq(
                  bills.map(x=>x?.mb)
                );

                return {
                  mbs:b.mbs.filter(
                    x=>
                      nums.some(
                        m=>N(mbNo(x))===N(m)
                      )
                  ),

                  works:b.works.filter(
                    x=>
                      nums.some(
                        m=>N(x?.mb)===N(m)
                      ) ||
                      bills.some(
                        bb=>
                          N(workName(bb))===
                          N(workName(x))
                      )
                  ),

                  assigns:b.assigns.filter(
                    x=>
                      nums.some(
                        m=>N(x?.mb)===N(m)
                      )
                  ),

                  transfers:b.transfers.filter(
                    x=>
                      nums.some(
                        m=>N(transferNo(x))===N(m)
                      )
                  ],

                  bills,

                  jes:b.jes
                };
              }

              return b;
            }

            function current(){
              return applyComponentFilter(
                ctx(),
                dateFilter(
                  baseFor(
                    ctx(),
                    data()
                  )
                )
              );
            }

            function relatedOptions(c,d){
              const b=baseFor(c,d);
              const o=[];

              if(c.ctype==='MB'){
                o.push(
                  [DETAIL_ALL,'सर्व M.B.'],
                  [MB_SMALL,'Small M.B.'],
                  [MB_LARGE,'Big M.B.']
                );

                uniq(
                  b.mbs.map(mbNo)
                ).forEach(
                  x=>
                    o.push(
                      [
                        MB_PREFIX+x,
                        'M.B. क्रमांक '+x
                      ]
                    )
                );
              }

              else if(c.ctype==='WORK'){
                o.push(
                  [DETAIL_ALL,'सर्व कामे']
                );

                uniq(
                  b.works.map(workName)
                ).forEach(
                  x=>o.push([x,x])
                );
              }

              else if(c.ctype==='JE'){
                o.push(
                  [DETAIL_ALL,'सर्व JE']
                );

                uniq(
                  b.works.map(jeName)
                    .concat(
                      b.bills.map(jeName),
                      b.assigns.map(jeName)
                    )
                ).forEach(
                  x=>o.push([x,x])
                );
              }

              else if(c.ctype==='CONTRACTOR'){
                o.push(
                  [
                    DETAIL_ALL,
                    'सर्व Contractor / Agency'
                  ]
                );

                uniq(
                  b.works.map(contractor)
                    .concat(
                      b.bills.map(contractor),
                      b.assigns.map(contractor)
                    )
                ).forEach(
                  x=>o.push([x,x])
                );
              }

              else if(c.ctype==='BILL'){
                o.push(
                  [DETAIL_ALL,'सर्व Bill']
                );

                uniq(
                  b.bills.map(billType)
                    .concat(
                      b.bills.map(billNo)
                    )
                ).forEach(
                  x=>o.push([x,x])
                );
              }

              else if(c.ctype==='TRANSFER'){
                o.push(
                  [
                    DETAIL_ALL,
                    'सर्व Transfer / History'
                  ]
                );

                uniq(
                  b.transfers.map(transferNo)
                ).forEach(
                  x=>
                    o.push(
                      [
                        x,
                        'M.B. '+x+
                        ' — Transfer History'
                      ]
                    )
                );
              }

              return o;
            }

            function componentOptions(c){
              const map={
                MB:[
                  ['ALL','सर्व माहिती'],
                  ['WORK','कामाचे नाव'],
                  ['JE','JE चे नाव'],
                  ['CONTRACTOR','Contractor / Agency'],
                  ['BILL','Bill'],
                  ['TRANSFER','Transfer / History']
                ],

                JE:[
                  ['ALL','सर्व माहिती'],
                  ['WORK','कामाचे नाव'],
                  ['MB','M.B.'],
                  ['CONTRACTOR','Contractor / Agency'],
                  ['BILL','Bill'],
                  ['TRANSFER','Transfer / History']
                ],

                WORK:[
                  ['ALL','सर्व माहिती'],
                  ['JE','JE चे नाव'],
                  ['MB','M.B.'],
                  ['CONTRACTOR','Contractor / Agency'],
                  ['BILL','Bill'],
                  ['TRANSFER','Transfer / History']
                ],

                CONTRACTOR:[
                  ['ALL','सर्व माहिती'],
                  ['WORK','कामाचे नाव'],
                  ['JE','JE चे नाव'],
                  ['MB','M.B.'],
                  ['BILL','Bill'],
                  ['TRANSFER','Transfer / History']
                ],

                BILL:[
                  ['ALL','सर्व माहिती'],
                  ['MB','M.B.'],
                  ['WORK','कामाचे नाव'],
                  ['JE','JE चे नाव'],
                  ['CONTRACTOR','Contractor / Agency'],
                  ['TRANSFER','Transfer / History']
                ],

                TRANSFER:[
                  ['ALL','सर्व माहिती'],
                  ['MB','M.B.'],
                  ['WORK','कामाचे नाव'],
                  ['JE','JE चे नाव'],
                  ['CONTRACTOR','Contractor / Agency'],
                  ['BILL','Bill']
                ]
              };

              return map[c.type]||[];
            }

            function renderType(){
              const type=
                document.getElementById(
                  'homeRelType'
                );

              if(!type)return;

              type.innerHTML=
                '<option value="">संबंधित प्रकार निवडा</option>'+
                Object.keys(TYPE_LABELS)
                  .map(
                    k=>
                      `<option value="${k}">${E(TYPE_LABELS[k])}</option>`
                  )
                  .join('');

              type.disabled=false;
            }

            function renderTargets(){
              const c=ctx();

              const sel=
                document.getElementById(
                  'homeRelTarget'
                );

              if(!sel)return;

              if(
                typeof homeRelRangeValid==='function' &&
                !homeRelRangeValid()
              ){
                sel.innerHTML=
                  '<option value="">दिनांक कालावधी निवडा</option>';

                sel.disabled=true;

                return;
              }

              const d=dateFilter(data());

              const arrays={
                MB:
                  uniq(
                    d.mbs.map(mbNo)
                      .concat(
                        d.works.map(x=>x?.mb),
                        d.bills.map(x=>x?.mb),
                        d.assigns.map(x=>x?.mb),
                        d.transfers.map(transferNo)
                      )
                  ),

                JE:
                  uniq(
                    d.jes.map(S)
                      .concat(
                        d.works.map(jeName),
                        d.bills.map(jeName),
                        d.assigns.map(jeName)
                      )
                  ),

                WORK:
                  uniq(
                    d.works.map(workName)
                      .concat(
                        d.bills.map(workName)
                      )
                  ),

                CONTRACTOR:
                  uniq(
                    d.works.map(contractor)
                      .concat(
                        d.assigns.map(contractor),
                        d.bills.map(contractor)
                      )
                  ),

                BILL:
                  uniq(
                    d.bills.map(billNo)
                      .concat(
                        d.bills.map(billType)
                      )
                  ),

                TRANSFER:
                  uniq(
                    d.transfers.map(transferNo)
                  )
              };

              const list=
                arrays[c.type]||[];

              sel.innerHTML=
                '<option value="__ALL__">'+
                E(
                  TYPE_LABELS[c.type]||
                  'सर्व'
                )+
                ' — सर्व</option>'+
                list.map(
                  x=>
                    `<option value="${E(x)}">${E(x)}</option>`
                ).join('');

              sel.disabled=false;
              sel.value='__ALL__';
            }

            function renderComponents(){
              const c=ctx();

              const sel=
                document.getElementById(
                  'homeRelComponent'
                );

              const detail=
                document.getElementById(
                  'homeRelDetail'
                );

              if(!sel)return;

              const opts=
                componentOptions(c);

              sel.innerHTML=
                '<option value="">संबंधित प्रकार निवडा</option>'+
                opts.map(
                  x=>
                    `<option value="${x[0]}::${x[0]}">${E(x[1])}</option>`
                ).join('');

              sel.disabled=
                !c.target ||
                !c.type;

              if(detail){
                detail.style.display='none';

                detail.innerHTML=
                  '<option value="">तपशील निवडा</option>';

                detail.value='';
              }

              const bs=
                document.getElementById(
                  'homeRelBillType'
                );

              if(bs){
                bs.style.display='none';
                bs.value='';
              }
            }

            function renderDetails(){
              const c=ctx();

              const sel=
                document.getElementById(
                  'homeRelDetail'
                );

              if(!sel)return;

              if(
                !c.ctype ||
                c.ctype==='ALL'
              ){
                sel.style.display='none';

                sel.innerHTML=
                  '<option value="'+
                  DETAIL_ALL+
                  '">सर्व माहिती</option>';

                sel.value=DETAIL_ALL;

                renderResult();

                return;
              }

              const d=
                dateFilter(
                  data()
                );

              const opts=
                relatedOptions(
                  c,
                  d
                );

              sel.innerHTML=
                '<option value="">तपशील निवडा</option>'+
                opts.map(
                  x=>
                    `<option value="${E(x[0])}">${E(x[1])}</option>`
                ).join('');

              sel.style.display=
                opts.length
                  ? 'block'
                  : 'none';

              sel.disabled=false;
              sel.value='';

              renderResult();
            }

            function section(title,rows){
              return `
                <div class="rel-section">
                  <div class="rel-section-title">
                    ${E(title)}
                  </div>
                  ${
                    rows.map(
                      r=>
                        `<div class="rel-line">
                          <b>${E(r[0])}:</b>
                          ${E(
                            r[1]===undefined ||
                            r[1]===''
                              ? '-'
                              : r[1]
                          )}
                        </div>`
                    ).join('')
                  }
                </div>
              `;
            }

            function listSection(title,items,fn){
              if(!items.length){
                return section(
                  title,
                  [
                    [
                      'नोंद',
                      'उपलब्ध नाही'
                    ]
                  ]
                );
              }

              return `
                <div class="rel-section">
                  <div class="rel-section-title">
                    ${E(title)}
                    (${items.length})
                  </div>

                  ${
                    items.map(
                      (x,i)=>
                        `<div style="border-top:1px solid #e8eef2;padding:7px 0">
                          ${fn(x,i)}
                        </div>`
                    ).join('')
                  }
                </div>
              `;
            }

            function reportHTML(){
              const c=ctx();
              const b=current();

              const title=
                (TYPE_LABELS[c.type]||
                'संबंधित')+
                ' → '+
                (
                  c.target==='__ALL__'
                    ? 'सर्व'
                    : c.target
                );

              let h=
                `<div class="rel-head">${E(title)}</div>`;

              h+=section(
                'सारांश',
                [
                  ['M.B.',b.mbs.length],
                  ['कामे',b.works.length],
                  [
                    'Contractor / Agency',
                    uniq(
                      b.works.map(contractor)
                        .concat(
                          b.bills.map(contractor),
                          b.assigns.map(contractor)
                        )
                    ).length
                  ],
                  ['Bills',b.bills.length],
                  [
                    'Transfer / History',
                    b.transfers.length
                  ]
                ]
              );

              h+=listSection(
                'M.B. ची संपूर्ण माहिती',
                b.mbs,
                (m,i)=>
                  section(
                    'M.B. '+mbNo(m),
                    [
                      [
                        'M.B. क्रमांक',
                        mbNo(m)
                      ],
                      [
                        'Size',
                        m.size||'-'
                      ],
                      [
                        'Status',
                        m.status||'-'
                      ],
                      [
                        'प्राप्त दिनांक',
                        D(
                          m.receivedDate||
                          m.date||
                          m.createdAt
                        )
                      ],
                      [
                        'सध्या कुणाकडे',
                        (()=>{
                          try{
                            return (
                              mbSummaryCurrentHolder(
                                mbNo(m)
                              ).name||'-'
                            );
                          }catch(e){
                            return '-';
                          }
                        })()
                      ]
                    ]
                  )
              );

              h+=listSection(
                'कामांची संपूर्ण माहिती',
                b.works,
                (w,i)=>
                  `<b>${i+1}) ${E(
                    workName(w)||'-'
                  )}</b>`+
                  section(
                    'काम',
                    [
                      [
                        'Work Name',
                        workName(w)
                      ],
                      [
                        'M.B.',
                        w.mb||'-'
                      ],
                      [
                        'JE',
                        jeName(w)||'-'
                      ],
                      [
                        'Contractor / Agency',
                        contractor(w)||'-'
                      ]
                    ]
                  )
              );

              h+=listSection(
                'Contractor / Agency माहिती',
                uniq(
                  b.works.map(contractor)
                    .concat(
                      b.bills.map(contractor),
                      b.assigns.map(contractor)
                    )
                ).map(
                  x=>({name:x})
                ),
                (c0,i)=>{
                  const co=c0.name;

                  const ww=
                    b.works.filter(
                      x=>
                        N(contractor(x))===
                        N(co)
                    );

                  const bb=
                    b.bills.filter(
                      x=>
                        N(contractor(x))===
                        N(co)
                    );

                  return section(
                    co,
                    [
                      [
                        'कामे',
                        ww.length
                      ],
                      [
                        'Bills',
                        bb.length
                      ],
                      [
                        'M.B.',
                        uniq(
                          ww.map(x=>x.mb)
                            .concat(
                              bb.map(x=>x.mb)
                            )
                        ).join(', ')||'-'
                      ]
                    ]
                  );
                }
              );

              h+=listSection(
                'Bill ची संपूर्ण माहिती',
                b.bills,
                (x,i)=>
                  section(
                    (i+1)+') '+
                    (
                      billType(x)||
                      'Bill'
                    ),
                    [
                      [
                        'Bill प्रकार',
                        billType(x)||'-'
                      ],
                      [
                        'Bill क्रमांक',
                        billNo(x)||'-'
                      ],
                      [
                        'Bill दिनांक',
                        D(
                          x.billDate||
                          x.date||
                          x.savedAt
                        )
                      ],
                      [
                        'M.B.',
                        x.mb||'-'
                      ],
                      [
                        'काम',
                        workName(x)||'-'
                      ],
                      [
                        'JE',
                        jeName(x)||'-'
                      ],
                      [
                        'Contractor / Agency',
                        contractor(x)||'-'
                      ],
                      [
                        'रक्कम',
                        amount(x.amount)
                      ],
                      [
                        'Payment Status',
                        x.paymentStatus||'-'
                      ]
                    ]
                  )
              );

              h+=listSection(
                'Transfer / History',
                b.transfers,
                (x,i)=>
                  section(
                    (i+1)+
                    ') M.B. '+
                    (
                      transferNo(x)||'-'
                    ),
                    [
                      [
                        'M.B.',
                        transferNo(x)||'-'
                      ],
                      [
                        'दिनांक',
                        D(
                          x.date||
                          x.transferDate||
                          x.savedAt
                        )
                      ],
                      [
                        'कोणाकडे',
                        x.receiverName||
                        x.receiver||
                        x.to||
                        x.name||
                        '-'
                      ],
                      [
                        'काम',
                        x.workName||
                        x.work||
                        '-'
                      ],
                      [
                        'JE',
                        jeName(x)||'-'
                      ],
                      [
                        'Contractor / Agency',
                        contractor(x)||'-'
                      ]
                    ]
                  )
              );

              return h;
            }

            function renderResult(){
              const box=
                document.getElementById(
                  'homeRelResult'
                );

              if(!box)return;

              const c=ctx();

              if(!c.type){
                box.innerHTML=
                  '<div class="rel-empty">'+
                  'संबंधित प्रकार निवडा.'+
                  '</div>';
                return;
              }

              if(!c.target){
                box.innerHTML=
                  '<div class="rel-empty">'+
                  'मुख्य नोंद निवडा.'+
                  '</div>';
                return;
              }

              if(!c.ctype){
                box.innerHTML=
                  '<div class="rel-empty">'+
                  'संबंधित प्रकार निवडा.'+
                  '</div>';
                return;
              }

              if(
                c.ctype!=='ALL' &&
                !c.detail
              ){
                box.innerHTML=
                  '<div class="rel-empty">'+
                  'पुढील तपशील निवडा.'+
                  '</div>';
                return;
              }

              box.innerHTML=
                reportHTML();
            }

            function printReport(){
              const c=ctx();

              if(
                !c.type ||
                !c.target ||
                !c.ctype ||
                (
                  c.ctype!=='ALL' &&
                  !c.detail
                )
              ){
                alert(
                  'कृपया Related Type → मुख्य नोंद → संबंधित प्रकार → तपशील पूर्ण निवडा.'
                );
                return;
              }

              const pa=
                document.getElementById(
                  'printArea'
                );

              if(!pa){
                if(
                  window.AndroidBridge &&
                  typeof window.AndroidBridge.print===
                    'function'
                ){
                  window.AndroidBridge.print();
                }else{
                  window.print();
                }
                return;
              }

              pa.innerHTML=
                `<div class="a4-page">

                  <div class="a4-header">

                    <div class="dept">
                      सार्वजनिक बांधकाम विभाग
                    </div>

                    <div class="system">
                      मोजमाप पुस्तिका नियंत्रण प्रणाली
                    </div>

                    <div class="report-title">
                      M.B. SUMMARY — LINKED REPORT
                    </div>

                  </div>

                  <div class="a4-meta">

                    <span>
                      <b>निवड :</b>
                      ${E(
                        (
                          TYPE_LABELS[c.type]||
                          ''
                        )+
                        ' → '+
                        (
                          c.target==='__ALL__'
                            ? 'सर्व'
                            : c.target
                        )
                      )}
                    </span>

                    <span>
                      <b>कालावधी :</b>
                      ${E(
                        D(
                          document.getElementById(
                            'homeRelFrom'
                          )?.value
                        )
                      )}
                      ते
                      ${E(
                        D(
                          document.getElementById(
                            'homeRelTo'
                          )?.value
                        )
                      )}
                    </span>

                  </div>

                  ${reportHTML()}

                  <div class="a4-footer">
                    Created By : विठ्ठल कोकाटे पाटील
                  </div>

                </div>`;

              const old=document.title;

              document.title=
                'MBMS M.B. Summary Linked Report';

              setTimeout(
                ()=>{
                  if(
                    window.AndroidBridge &&
                    typeof window.AndroidBridge.print===
                      'function'
                  ){
                    window.AndroidBridge.print();
                  }else{
                    window.print();
                  }
                },
                120
              );

              setTimeout(
                ()=>{
                  document.title=old;
                },
                1200
              );
            }

            function bind(){
              const type=
                document.getElementById(
                  'homeRelType'
                );

              const target=
                document.getElementById(
                  'homeRelTarget'
                );

              const comp=
                document.getElementById(
                  'homeRelComponent'
                );

              const detail=
                document.getElementById(
                  'homeRelDetail'
                );

              const from=
                document.getElementById(
                  'homeRelFrom'
                );

              const to=
                document.getElementById(
                  'homeRelTo'
                );

              const btn=
                document.querySelector(
                  'button[onclick="printHomeRelationshipReport()"]'
                );

              if(
                !type ||
                !target ||
                !comp ||
                !detail
              ){
                return false;
              }

              renderType();

              type.onchange=
                function(){
                  renderTargets();
                  renderComponents();
                  renderResult();
                };

              target.onchange=
                function(){
                  renderComponents();
                  renderResult();
                };

              comp.onchange=
                function(){
                  renderDetails();
                };

              detail.onchange=
                function(){
                  renderResult();
                };

              if(from){
                from.onchange=
                  function(){
                    renderTargets();
                    renderComponents();
                    renderResult();
                  };
              }

              if(to){
                to.onchange=
                  function(){
                    renderTargets();
                    renderComponents();
                    renderResult();
                  };
              }

              if(btn){
                btn.onclick=printReport;
              }

              target.disabled=true;
              comp.disabled=true;
              detail.style.display='none';

              if(
                typeof homeRelRangeValid!=='function' ||
                homeRelRangeValid()
              ){
                renderResult();
              }

              return true;
            }

            window.loadHomeRelDetails=
              function(){
                renderDetails();
              };

            window.showHomeRelationship=
              function(){
                renderResult();
              };

            window.printHomeRelationshipReport=
              printReport;

            window.loadHomeRelTargets=
              function(){
                renderTargets();
                renderComponents();
                renderResult();
              };

            window.loadHomeRelComponents=
              function(){
                renderComponents();
              };

            if(
              document.readyState==='loading'
            ){
              document.addEventListener(
                'DOMContentLoaded',
                bind
              );
            }else{
              bind();
            }

          })();
          PATCH_JS

          python3 <<'PY'
          from pathlib import Path
          import re

          p=Path("mbms_work/index.html")
          t=p.read_text(encoding="utf-8")

          patch=Path(
              "/tmp/mbms_summary_patch.js"
          ).read_text(
              encoding="utf-8"
          )

          tag=(
              '<script id="V128_MBMS_SUMMARY_LINKED_FIX">\n'
              + patch
              + '\n</script>\n'
          )

          i=t.lower().rfind("</body>")

          if i<0:
              raise SystemExit(
                  "ERROR: </body> not found"
              )

          t=t[:i]+tag+t[i:]

          p.write_text(
              t,
              encoding="utf-8"
          )

          print(
              "V128 summary patch inserted before </body>."
          )
          PY

      - name: Validate patched HTML JavaScript
