}
.no-print { display: none !important; }
​.report-header { text-align: center !important; margin: 0 0 6px 0 !important; }
.report-header h2 { margin: 0 !important; font-size: 16px !important; font-weight: bold !important; }
.report-header h3 { margin: 2px 0 !important; font-size: 14px !important; }
.report-header h4 { margin: 2px 0 6px 0 !important; font-size: 13px !important; text-decoration: underline !important; }
​.report-meta {
