name: MBMS V118 Android APK Build - FINAL STABLE V2

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:

  build-apk:

    name: Build MBMS V118 APK

    runs-on: ubuntu-latest

    steps:

      # =====================================================
      # 1. CHECKOUT
      # =====================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # =====================================================
      # 2. JAVA 17
      # =====================================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # =====================================================
      # 3. ANDROID SDK
      # =====================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      - name: Install Android SDK packages
        shell: bash
        run: |

          set -e

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "Android SDK READY"


      # =====================================================
      # 4. GRADLE 8.7
      # =====================================================

      - name: Install Gradle 8.7
        shell: bash
        run: |

          set -e

          wget -q \
            https://services.gradle.org/distributions/gradle-8.7-bin.zip

          unzip -q \
            gradle-8.7-bin.zip \
            -d "$HOME/gradle"

          echo "$HOME/gradle/gradle-8.7/bin" \
            >> "$GITHUB_PATH"

          "$HOME/gradle/gradle-8.7/bin/gradle" \
            --version


      # =====================================================
      # 5. FIND ORIGINAL MBMS HTML
      # =====================================================

      - name: Locate MBMS HTML
        shell: bash
        run: |

          set -e

          HTML_FILE=""


          # -------------------------------------------------
          # First preference:
          # previous successful MBMS baseline
          # -------------------------------------------------

          for f in \
            "Measurement_Book_Management_System_FINAL_V115_MB_HISTORY_ONLY_DATE-6.html" \
            "Measurement_Book_Management_System_FINAL_V115.html" \
            "V115.html"
          do

            if [ -f "$f" ]; then

              HTML_FILE="$f"

              break

            fi

          done


          # -------------------------------------------------
          # Second preference:
          # V118 HTML if present
          # -------------------------------------------------

          if [ -z "$HTML_FILE" ]; then

            for f in \
              "Measurement_Book_Management_System_FINAL_V118_PRINT_BACKUP_ANDROID.html" \
              "Measurement_Book_Management_System_FINAL_V118.html" \
              "V118.html"
            do

              if [ -f "$f" ]; then

                HTML_FILE="$f"

                break

              fi

            done

          fi


          # -------------------------------------------------
          # Last fallback:
          # any HTML in repository
          # -------------------------------------------------

          if [ -z "$HTML_FILE" ]; then

            HTML_FILE=$(
              find . \
                -type f \
                -iname "*.html" \
                -not -path "./.git/*" \
                | head -n 1 \
                || true
            )

          fi


          if [ -z "$HTML_FILE" ]; then

            echo "ERROR: No HTML file found."

            find . \
              -maxdepth 4 \
              -type f \
              -not -path "./.git/*" \
              | sort \
              | head -n 300

            exit 1

          fi


          echo "=========================================="

          echo "MBMS HTML FOUND"

          echo "$HTML_FILE"

          echo "=========================================="


          echo "HTML_FILE=$HTML_FILE" \
            >> "$GITHUB_ENV"


      # =====================================================
      # 6. CREATE ANDROID PROJECT
      # =====================================================

      - name: Create Android project
        shell: bash
        run: |

          set -e

          rm -rf mbms_android

          rm -rf release


          mkdir -p \
            mbms_android/app/src/main/java/com/mbms/app


          mkdir -p \
            mbms_android/app/src/main/res/values


          mkdir -p \
            mbms_android/app/src/main/assets


          cp \
            "$HTML_FILE" \
            mbms_android/app/src/main/assets/index.html


          test -s \
            mbms_android/app/src/main/assets/index.html


          echo "MBMS HTML copied."


      # =====================================================
      # 7. SETTINGS.GRADLE
      # =====================================================

      - name: Create settings.gradle
        shell: bash
        run: |

          cat > mbms_android/settings.gradle <<'EOF'

          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(
                  RepositoriesMode.FAIL_ON_PROJECT_REPOS
              )

              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "MBMSAndroid"

          include(":app")

          EOF


      # =====================================================
      # 8. ROOT BUILD.GRADLE
      # =====================================================

      - name: Create root build.gradle
        shell: bash
        run: |

          cat > mbms_android/build.gradle <<'EOF'

          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }

          EOF


      # =====================================================
      # 9. GRADLE PROPERTIES
      # =====================================================

      - name: Create gradle.properties
        shell: bash
        run: |

          cat > mbms_android/gradle.properties <<'EOF'

          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

          EOF


      # =====================================================
      # 10. APP BUILD.GRADLE
      # =====================================================

      - name: Create app build.gradle
        shell: bash
        run: |

          cat > mbms_android/app/build.gradle <<'EOF'

          plugins {
              id 'com.android.application'
          }

          android {

              namespace 'com.mbms.app'

              compileSdk 35

              defaultConfig {

                  applicationId 'com.mbms.app'

                  minSdk 26

                  targetSdk 35

                  versionCode 118

                  versionName 'V118'

              }

              buildTypes {

                  debug {

                      minifyEnabled false

                  }

                  release {

                      minifyEnabled false

                      shrinkResources false

                  }

              }

              compileOptions {

                  sourceCompatibility JavaVersion.VERSION_17

                  targetCompatibility JavaVersion.VERSION_17

              }

          }

          EOF


      # =====================================================
      # 11. STRINGS.XML
      # =====================================================

      - name: Create strings.xml
        shell: bash
        run: |

          cat > mbms_android/app/src/main/res/values/strings.xml <<'EOF'

          <resources>
              <string name="app_name">Measurement Book Management System</string>
          </resources>

          EOF


      # =====================================================
      # 12. STYLES.XML
      # =====================================================

      - name: Create styles.xml
        shell: bash
        run: |

          cat > mbms_android/app/src/main/res/values/styles.xml <<'EOF'

          <resources>

              <style
                  name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">

                  <item name="android:fontFamily">sans</item>

                  <item name="android:colorAccent">#1976D2</item>

                  <item name="android:navigationBarColor">#0D47A1</item>

              </style>

          </resources>

          EOF


      # =====================================================
      # 13. ANDROID MANIFEST
      #
      # IMPORTANT:
      # NO XML DECLARATION
      # NO BLANK LINE BEFORE <manifest>
      # =====================================================

      - name: Create AndroidManifest.xml
        shell: bash
        run: |

          cat > mbms_android/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:theme="@style/AppTheme"
                  android:usesCleartextTraffic="true">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">

                      <intent-filter>

                          <action
                              android:name="android.intent.action.MAIN" />

                          <category
                              android:name="android.intent.category.LAUNCHER" />

                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF


      # =====================================================
      # 14. MAIN ACTIVITY
      # =====================================================

      - name: Create MainActivity.java
        shell: bash
        run: |

          cat > mbms_android/app/src/main/java/com/mbms/app/MainActivity.java <<'EOF'

          package com.mbms.app;

          import android.app.Activity;
          import android.content.ContentValues;
          import android.content.Context;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Environment;
          import android.provider.MediaStore;
          import android.print.PrintAttributes;
          import android.print.PrintManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Toast;

          import java.io.ByteArrayOutputStream;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.InputStream;
          import java.io.OutputStream;
          import java.nio.charset.StandardCharsets;


          public class MainActivity extends Activity {


              private static final int REQUEST_RESTORE = 9101;

              private static final int REQUEST_FILE = 9102;


              private WebView webView;

              private ValueCallback<Uri[]> filePathCallback;


              @Override
              protected void onCreate(
                      Bundle savedInstanceState) {

                  super.onCreate(savedInstanceState);


                  webView = new WebView(this);

                  setContentView(webView);


                  WebSettings settings =
                          webView.getSettings();


                  settings.setJavaScriptEnabled(true);

                  settings.setDomStorageEnabled(true);

                  settings.setAllowFileAccess(true);

                  settings.setAllowContentAccess(true);

                  settings.setBuiltInZoomControls(false);

                  settings.setDisplayZoomControls(false);

                  settings.setSupportZoom(false);


                  webView.setWebViewClient(
                          new WebViewClient());


                  webView.addJavascriptInterface(
                          new AndroidBridge(),
                          "MBMSAndroid");


                  webView.setWebChromeClient(
                          new WebChromeClient() {

                              @Override
                              public boolean onShowFileChooser(

                                      WebView view,

                                      ValueCallback<Uri[]> callback,

                                      FileChooserParams params) {


                                  if (
                                      filePathCallback != null
                                  ) {

                                      filePathCallback
                                          .onReceiveValue(null);

                                  }


                                  filePathCallback =
                                      callback;


                                  try {

                                      Intent intent =
                                          new Intent(
                                              Intent.ACTION_OPEN_DOCUMENT);

                                      intent.addCategory(
                                          Intent.CATEGORY_OPENABLE);

                                      intent.setType("*/*");


                                      startActivityForResult(

                                          intent,

                                          REQUEST_FILE);


                                      return true;

                                  }

                                  catch (Exception e) {

                                      filePathCallback =
                                          null;

                                      return false;

                                  }

                              }

                          });


                  webView.loadUrl(
                          "file:///android_asset/index.html");

              }


              // =================================================
              // ANDROID BRIDGE
              // =================================================

              public final class AndroidBridge {


                  // =============================================
                  // NATIVE PRINT
                  // =============================================

                  @JavascriptInterface
                  public void print() {


                      runOnUiThread(
                              new Runnable() {

                          @Override
                          public void run() {


                              try {


                                  PrintManager manager =

                                      (PrintManager)
                                      getSystemService(
                                          Context.PRINT_SERVICE);


                                  if (manager == null) {

                                      throw new Exception(
                                          "Print service unavailable");

                                  }


                                  android.print.PrintDocumentAdapter adapter =

                                      webView
                                          .createPrintDocumentAdapter(
                                              "MBMS Report");


                                  PrintAttributes attributes =

                                      new PrintAttributes.Builder()

                                          .setMediaSize(

                                              PrintAttributes
                                                  .MediaSize
                                                  .ISO_A4)

                                          .setMinMargins(

                                              PrintAttributes
                                                  .Margins
                                                  .NO_MARGINS)

                                          .build();


                                  manager.print(

                                      "MBMS Report",

                                      adapter,

                                      attributes);


                              }

                              catch (Exception e) {


                                  Toast.makeText(

                                      MainActivity.this,

                                      "Print सुरू करता आले नाही.",

                                      Toast.LENGTH_LONG

                                  ).show();

                              }

                          }

                      });

                  }


                  // =============================================
                  // BACKUP SAVE
                  // =============================================

                  @JavascriptInterface
                  public void saveBackup(

                          final String json,

                          final String filename) {


                      new Thread(

                          new Runnable() {

                              @Override
                              public void run() {


                                  boolean success = false;


                                  try {


                                      if (

                                          Build.VERSION.SDK_INT >= 29

                                      ) {


                                          ContentValues values =
                                              new ContentValues();


                                          values.put(

                                              MediaStore.MediaColumns
                                                  .DISPLAY_NAME,

                                              filename);


                                          values.put(

                                              MediaStore.MediaColumns
                                                  .MIME_TYPE,

                                              "application/json");


                                          values.put(

                                              MediaStore.MediaColumns
                                                  .RELATIVE_PATH,

                                              Environment
                                                  .DIRECTORY_DOWNLOADS);


                                          values.put(

                                              MediaStore.MediaColumns
                                                  .IS_PENDING,

                                              1);


                                          Uri uri =

                                              getContentResolver()
                                                  .insert(

                                                      MediaStore
                                                          .Downloads
                                                          .EXTERNAL_CONTENT_URI,

                                                      values);


                                          if (uri == null) {

                                              throw new Exception(
                                                  "MediaStore insert failed");

                                          }


                                          OutputStream output =

                                              getContentResolver()
                                                  .openOutputStream(uri);


                                          if (output == null) {

                                              throw new Exception(
                                                  "Output stream unavailable");

                                          }


                                          try {


                                              output.write(

                                                  json.getBytes(

                                                      StandardCharsets.UTF_8

                                                  )

                                              );


                                              output.flush();


                                          }

                                          finally {

                                              output.close();

                                          }


                                          ContentValues done =
                                              new ContentValues();


                                          done.put(

                                              MediaStore.MediaColumns
                                                  .IS_PENDING,

                                              0);


                                          getContentResolver()
                                              .update(

                                                  uri,

                                                  done,

                                                  null,

                                                  null

                                              );


                                          success = true;

                                      }

                                      else {


                                          File directory =

                                              Environment
                                                  .getExternalStoragePublicDirectory(

                                                      Environment
                                                          .DIRECTORY_DOWNLOADS

                                                  );


                                          if (

                                              !directory.exists() &&

                                              !directory.mkdirs()

                                          ) {

                                              throw new Exception(
                                                  "Downloads unavailable");

                                          }


                                          File file =

                                              new File(

                                                  directory,

                                                  filename

                                              );


                                          FileOutputStream output =

                                              new FileOutputStream(
                                                  file
                                              );


                                          try {

                                              output.write(

                                                  json.getBytes(

                                                      StandardCharsets.UTF_8

                                                  )

                                              );


                                              output.flush();


                                          }

                                          finally {

                                              output.close();

                                          }


                                          success = true;

                                      }


                                  }

                                  catch (Exception e) {

                                      e.printStackTrace();

                                  }


                                  final boolean result =
                                      success;


                                  runOnUiThread(

                                      new Runnable() {

                                          @Override
                                          public void run() {


                                              Toast.makeText(

                                                  MainActivity.this,

                                                  result

                                                      ? "Backup Downloads मध्ये Save झाला."

                                                      : "Backup Save करण्यात अडचण आली.",

                                                  Toast.LENGTH_LONG

                                              ).show();

                                          }

                                      }

                                  );

                              }

                          }

                      ).start();

                  }


                  // =============================================
                  // BACKUP RESTORE
                  // =============================================

                  @JavascriptInterface
                  public void requestRestore() {


                      runOnUiThread(

                          new Runnable() {

                              @Override
                              public void run() {


                                  try {


                                      Intent intent =

                                          new Intent(

                                              Intent.ACTION_OPEN_DOCUMENT

                                          );


                                      intent.addCategory(

                                          Intent.CATEGORY_OPENABLE

                                      );


                                      intent.setType(

                                          "application/json"

                                      );


                                      startActivityForResult(

                                          intent,

                                          REQUEST_RESTORE

                                      );


                                  }

                                  catch (Exception e) {


                                      Toast.makeText(

                                          MainActivity.this,

                                          "Backup Restore सुरू करता आले नाही.",

                                          Toast.LENGTH_LONG

                                      ).show();

                                  }

                              }

                          }

                      );

                  }

              }


              // =================================================
              // READ BACKUP FILE
              // =================================================

              private String readText(
                      Uri uri
              ) throws Exception {


                  InputStream input =

                      getContentResolver()
                          .openInputStream(uri);


                  if (input == null) {

                      throw new Exception(
                          "Cannot open backup file"
                      );

                  }


                  try {


                      ByteArrayOutputStream output =

                          new ByteArrayOutputStream();


                      byte[] buffer =
                          new byte[8192];


                      int count;


                      while (

                          (count =
                              input.read(buffer)) != -1

                      ) {


                          output.write(

                              buffer,

                              0,

                              count

                          );

                      }


                      return output.toString(

                          StandardCharsets.UTF_8.name()

                      );


                  }

                  finally {

                      input.close();

                  }

              }


              // =================================================
              // BASE64
              // =================================================

              private String base64Utf8(
                      String text
              ) {


                  return android.util.Base64

                      .encodeToString(

                          text.getBytes(

                              StandardCharsets.UTF_8

                          ),

                          android.util.Base64.NO_WRAP

                      );

              }


              // =================================================
              // ACTIVITY RESULT
              // =================================================

              @Override
              protected void onActivityResult(

                      int requestCode,

                      int resultCode,

                      Intent data

              ) {


                  super.onActivityResult(

                      requestCode,

                      resultCode,

                      data

                  );


                  if (

                      requestCode ==
                      REQUEST_RESTORE

                  ) {


                      if (

                          resultCode ==
                          RESULT_OK &&

                          data != null &&

                          data.getData() != null

                      ) {


                          try {


                              String json =

                                  readText(

                                      data.getData()

                                  );


                              String encoded =

                                  base64Utf8(

                                      json

                                  );


                              String javascript =

                                  "(function(){"

                                  +

                                  "if(window.mbmsNativeRestoreBase64){"

                                  +

                                  "window.mbmsNativeRestoreBase64('"

                                  +

                                  encoded

                                  +

                                  "');"

                                  +

                                  "}"

                                  +

                                  "})();";


                              webView.evaluateJavascript(

                                  javascript,

                                  null

                              );


                          }

                          catch (Exception e) {


                              Toast.makeText(

                                  this,

                                  "Backup file वाचता आली नाही.",

                                  Toast.LENGTH_LONG

                              ).show();

                          }

                      }


                      return;

                  }


                  if (

                      requestCode ==
                      REQUEST_FILE

                  ) {


                      if (
                          filePathCallback == null
                      ) {

                          return;

                      }


                      Uri[] results = null;


                      if (

                          resultCode ==
                          RESULT_OK &&

                          data != null &&

                          data.getData() != null

                      ) {


                          results =
                              new Uri[]{

                                  data.getData()

                              };

                      }


                      filePathCallback
                          .onReceiveValue(
                              results
                          );


                      filePathCallback =
                          null;

                  }

              }


              // =================================================
              // BACK BUTTON
              // =================================================

              @Override
              public void onBackPressed() {


                  if (

                      webView != null &&

                      webView.canGoBack()

                  ) {


                      webView.goBack();

                  }

                  else {


                      super.onBackPressed();

                  }

              }

          }

          EOF


      # =====================================================
      # 16. VALIDATE MANIFEST
      # =====================================================

      - name: Validate AndroidManifest
        shell: bash
        run: |

          set -e

          MANIFEST="mbms_android/app/src/main/AndroidManifest.xml"


          test -s "$MANIFEST"


          FIRST_LINE=$(head -n 1 "$MANIFEST")


          if [ "$FIRST_LINE" != \
              '<manifest xmlns:android="http://schemas.android.com/apk/res/android">' ]; then

              echo "ERROR: AndroidManifest first line is invalid."

              echo "First line:"
              printf '%s\n' "$FIRST_LINE"

              exit 1

          fi


          grep -q \
            'android:name=".MainActivity"' \
            "$MANIFEST"


          grep -q \
            'android:exported="true"' \
            "$MANIFEST"


          echo "AndroidManifest validation PASSED."


      # =====================================================
      # 17. VALIDATE JAVA SOURCE
      # =====================================================

      - name: Validate Java source
        shell: bash
        run: |

          set -e

          JAVA_FILE="mbms_android/app/src/main/java/com/mbms/app/MainActivity.java"


          test -s "$JAVA_FILE"


          grep -q \
            "import android.print.PrintAttributes;" \
            "$JAVA_FILE"


          if grep -q \
            "import android.app.PrintAttributes;" \
            "$JAVA_FILE"; then

              echo "ERROR: Wrong PrintAttributes import."

              exit 1

          fi


          grep -q \
            "class MainActivity extends Activity" \
            "$JAVA_FILE"


          grep -q \
            "createPrintDocumentAdapter" \
            "$JAVA_FILE"


          grep -q \
            "saveBackup" \
            "$JAVA_FILE"


          grep -q \
            "requestRestore" \
            "$JAVA_FILE"


          echo "Java source validation PASSED."


      # =====================================================
      # 18. VALIDATE GRADLE CONFIGURATION
      # =====================================================

      - name: Validate Gradle configuration
        shell: bash
        run: |

          set -e


          grep -q \
            "com.android.application' version '8.6.1' apply false" \
            mbms_android/build.gradle


          grep -q \
            "compileSdk 35" \
            mbms_android/app/build.gradle


          grep -q \
            "minSdk 26" \
            mbms_android/app/build.gradle


          grep -q \
            "targetSdk 35" \
            mbms_android/app/build.gradle


          if grep -Riq \
              "androidx.appcompat" \
              mbms_android; then

              echo "ERROR: AppCompat found."

              exit 1

          fi


          if grep -Riq \
              "implementation.*appcompat" \
              mbms_android; then

              echo "ERROR: AppCompat dependency found."

              exit 1

          fi


          echo "Gradle configuration validation PASSED."


      # =====================================================
      # 19. CREATE GRADLE WRAPPER
      # =====================================================

      - name: Create Gradle Wrapper
        working-directory: mbms_android
        shell: bash
        run: |

          set -e


          gradle wrapper \
            --gradle-version 8.7 \
            --distribution-type bin


          chmod +x gradlew


          test -s gradlew


          ./gradlew --version


      # =====================================================
      # 20. COMPILE JAVA
      # =====================================================

      - name: Compile MBMS Java
        working-directory: mbms_android
        shell: bash
        run: |

          set -e


          ./gradlew \
            --no-daemon \
            --stacktrace \
            :app:compileDebugJavaWithJavac


          echo "JAVA COMPILATION PASSED."


      # =====================================================
      # 21. BUILD APK
      # =====================================================

      - name: Build MBMS V118 Debug APK
        working-directory: mbms_android
        shell: bash
        run: |

          set -e


          ./gradlew \
            --no-daemon \
            --stacktrace \
            clean \
            assembleDebug


          APK="app/build/outputs/apk/debug/app-debug.apk"


          test -s "$APK"


          mkdir -p ../release


          cp \
            "$APK" \
            "../release/MBMS-V118-Android.apk"


          echo ""
          echo "=========================================="

          echo "MBMS V118 APK GENERATED"

          echo "=========================================="


          ls -lh \
            "../release/MBMS-V118-Android.apk"


      # =====================================================
      # 22. VERIFY APK
      # =====================================================

      - name: Verify APK
        shell: bash
        run: |

          set -e


          APK="release/MBMS-V118-Android.apk"


          test -s "$APK"


          echo "APK size:"

          ls -lh "$APK"


          echo ""

          echo "APK ZIP integrity:"


          unzip -t \
            "$APK" \
            >/dev/null


          echo "APK ZIP integrity PASSED."


          echo ""

          echo "APK SHA256:"


          sha256sum \
            "$APK" \
            | tee \
              release/SHA256.txt


          echo ""

          echo "APK VERIFICATION PASSED."


      # =====================================================
      # 23. UPLOAD
      # =====================================================

      - name: Upload MBMS V118 APK
        uses: actions/upload-artifact@v4

        with:

          name: MBMS-V118-Android-APK

          path: |

            release/MBMS-V118-Android.apk

            release/SHA256.txt

          if-no-files-found: error
