                    });
                  }
                );

              }else if(
                ctype==='WORK'
              ){

                opts.push({
                  value:
                    ALL_DETAIL,
                  label:
                    'सर्व कामे'
                });

                uniqueSorted(
                  base.works.map(
                    workName
                  )
                ).forEach(
                  x=>{
                    opts.push({
                      value:x,
                      label:x
                    });
                  }
                );

              }else if(
                ctype==='JE'
              ){

                opts.push({
                  value:
                    ALL_DETAIL,
                  label:
                    'सर्व JE'
                });

                uniqueSorted(
                  base.works.map(
                    x=>x?.je
                  ).concat(
                    base.bills.map(
                      x=>x?.je
                    ),
                    base.assigns.map(
                      x=>x?.je
                    )
                  )
                ).forEach(
                  x=>{
                    opts.push({
                      value:x,
                      label:x
                    });
                  }
                );

              }else if(
                ctype==='CONTRACTOR'
              ){

                opts.push({
                  value:
                    ALL_DETAIL,
                  label:
                    'सर्व Contractor / Agency'
                });

                uniqueSorted(
                  base.works.map(
                    x=>x?.contractor
                  ).concat(
                    base.bills.map(
                      x=>x?.contractor
                    ),
                    base.assigns.map(
                      x=>x?.contractor
                    )
                  )
                ).forEach(
                  x=>{
                    opts.push({
                      value:x,
                      label:x
                    });
                  }
                );

              }else if(
                ctype==='BILL'
              ){

                opts.push({
                  value:
                    ALL_DETAIL,
                  label:
                    'सर्व Bill'
                });

                uniqueSorted(
                  base.bills.map(
                    x=>x?.billType
                  )
                ).forEach(
                  x=>{
                    opts.push({
                      value:x,
                      label:x
                    });
                  }
                );

              }else if(
                ctype==='TRANSFER'
              ){

                opts.push({
                  value:
                    ALL_DETAIL,
                  label:
                    'सर्व हस्तांतरण'
                });
              }

              sel.innerHTML=
                '<option value="">तपशील निवडा</option>'+
                opts.map(
                  o=>
                    '<option value="'+
                    esc(o.value)+
