name: MBMS V131 FINAL - MULTI-OFFICE HARDENED BUILD

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:

  build:
    name: Build Final Multi-Office MBMS APK
    runs-on: ubuntu-24.04

    steps:

      # ============================================================
      # 1. CHECKOUT REPOSITORY
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. SETUP JAVA 17
      # ============================================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # ============================================================
      # 3. SETUP ANDROID SDK
      # ============================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4


      # ============================================================
      # 4. INSTALL SDK PACKAGES
      # ============================================================
      - name: Install Android SDK 35
        shell: bash
        run: |
          set -e
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"


      # ============================================================
      # 5. SETUP GRADLE 8.7
      # ============================================================
      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'


      # ============================================================
      # 6. LOCATE BASE HTML
      # ============================================================
      - name: Find Base HTML File
        shell: bash
        run: |
          set -e
          HTML_FILE=""
          for f in \
            "Measurement_Book_Management_System_FINAL_V120_TRANSFER_REPORT_FINAL.html" \
            "Measurement_Book_Management_System_FINAL_V118_PRINT_BACKUP_ANDROID.html" \
            "Measurement_Book_Management_System_FINAL_V115_MB_HISTORY_ONLY_DATE-6.html" \
            "Measurement_Book_Management_System_FINAL_V115_MB_HISTORY_ONLY_DATE.html" \
            "Measurement_Book_Management_System_FINAL_V115.html" \
            "V115.html" \
            "index.html"
          do
            if [ -f "$f" ]; then
              HTML_FILE="$f"
              break
            fi
          done

          if [ -z "$HTML_FILE" ]; then
            HTML_FILE=$(find . -maxdepth 3 -type f -iname "*.html" -not -path "./.git/*" | head -n 1 || true)
          fi

          if [ -z "$HTML_FILE" ]; then
            echo "ERROR: HTML file not found."
            exit 1
          fi

          echo "HTML_FILE=$HTML_FILE" >> "$GITHUB_ENV"
          echo "Found HTML: $HTML_FILE"


      # ============================================================
      # 7. PREPARE DIRECTORY
      # ============================================================
      - name: Prepare Workspace
        shell: bash
        run: |
          set -e
          mkdir -p mbms_work
          cp "$HTML_FILE" mbms_work/index.html
          test -s mbms_work/index.html


      # ============================================================
      # 8. APPLY COMPLETE MULTI-OFFICE & HARDENED PRINT PATCH
      # ============================================================
      - name: Inject Multi-Office Engine & Print Fixes
        shell: bash
        run: |
          set -e
          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path("mbms_work/index.html")
          text = p.read_text(encoding="utf-8")

          patch_code = """
          <!-- ======================================================= -->
          <!-- MULTI-OFFICE SYSTEM & HARDENED PRINT ENGINE V131 -->
          <!-- ======================================================= -->
          <style id="MULTI_OFFICE_PRINT_STYLES">
          /* Office Selector Card on Top */
          .office-bar-container {
            background: #e0f2fe;
            border: 2px solid #0284c7;
            border-radius: 12px;
            padding: 12px;
            margin: 10px auto;
            max-width: 96%;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
          }
          .office-bar-title {
            font-size: 14px;
            font-weight: bold;
            color: #0369a1;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
          }
          .office-select-row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
          }
          .office-select-row select {
            flex: 1;
            min-width: 200px;
            padding: 8px 10px;
            border-radius: 6px;
            border: 1.5px solid #0284c7;
            font-size: 14px;
            font-weight: bold;
            color: #0f172a;
            background: #fff;
          }
          .office-btn {
            padding: 7px 12px;
            border-radius: 6px;
            border: none;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
          }
          .btn-office-add { background: #0284c7; color: #fff; }
          .btn-office-del { background: #ef4444; color: #fff; }
          .office-lock-notice {
            background: #fef2f2;
            border: 1px solid #f87171;
            color: #991b1b;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            margin: 15px auto;
            max-width: 96%;
            font-size: 14px;
            font-weight: bold;
          }

          /* Print Settings */
          @media print {
            @page {
              size: A4 portrait;
              margin: 8mm 8mm 8mm 8mm !important;
            }
            body {
              font-family: 'Noto Sans Devanagari', 'Mukta', 'Arial', sans-serif !important;
              color: #000 !important;
              background: #fff !important;
              margin: 0 !important;
              padding: 0 !important;
              -webkit-print-color-adjust: exact !important;
              print-color-adjust: exact !important;
            }
            .no-print, .office-bar-container, .office-lock-notice {
              display: none !important;
            }
            .report-header {
              text-align: center !important;
              margin: 0 0 6px 0 !important;
            }
            .report-header h2 { margin: 0 !important; font-size: 16px !important; font-weight: bold !important; }
            .report-header h3 { margin: 2px 0 !important; font-size: 14px !important; }
            .report-header h4 { margin: 2px 0 6px 0 !important; font-size: 13px !important; text-decoration: underline !important; }
            .report-meta {
              display: flex !important;
              justify-content: space-between !important;
              font-size: 11.5px !important;
              margin-bottom: 5px !important;
              border-bottom: 1.2px solid #000 !important;
              padding-bottom: 3px !important;
            }
            table.work-report-table, table.print-table {
              width: 100% !important;
              border-collapse: collapse !important;
              table-layout: fixed !important;
              margin-top: 4px !important;
            }
            table.work-report-table thead, table.print-table thead {
              display: table-header-group !important;
            }
            table.work-report-table tr, table.print-table tr {
              page-break-inside: avoid !important;
            }
            table.work-report-table th, table.work-report-table td,
            table.print-table th, table.print-table td {
              border: 1px solid #000 !important;
              padding: 4px 6px !important;
              font-size: 12px !important;
              line-height: 1.3 !important;
              word-wrap: break-word !important;
              overflow-wrap: break-word !important;
              vertical-align: middle !important;
            }
            table.work-report-table th, table.print-table th {
              background-color: #f0f0f0 !important;
              font-weight: bold !important;
              text-align: center !important;
            }

            /* Work List स्तम्भहरूको चौडाइ */
            .col-sr { width: 6% !important; text-align: center !important; }
            .col-work { width: 42% !important; text-align: left !important; }
            .col-contractor { width: 32% !important; text-align: left !important; }
            .col-je { width: 10% !important; text-align: left !important; }
            .col-mb { width: 10% !important; text-align: center !important; white-space: nowrap !important; }

            /* अतिरिक्त स्तम्भहरू हटाउने */
            table.work-report-table tr > th:nth-child(n+6),
            table.work-report-table tr > td:nth-child(n+6) {
              display: none !important;
            }

            .report-footer {
              position: fixed !important;
              bottom: 0 !important;
              left: 0 !important;
              right: 0 !important;
              text-align: center !important;
              font-size: 10px !important;
              border-top: 1px solid #777 !important;
              padding-top: 2px !important;
            }
          }
          </style>

          <script id="MULTI_OFFICE_CONTROLLER">
          (function() {
            var OFFICES_KEY = "mbms_offices_list";
            var CURRENT_OFFICE_KEY = "mbms_current_office_id";

            function getOffices() {
              try {
                var d = localStorage.getItem(OFFICES_KEY);
                return d ? JSON.parse(d) : [];
              } catch(e) { return []; }
            }

            function saveOffices(list) {
              localStorage.setItem(OFFICES_KEY, JSON.stringify(list));
            }

            function getCurrentOffice() {
              return localStorage.getItem(CURRENT_OFFICE_KEY) || "";
            }

            function setCurrentOffice(id) {
              localStorage.setItem(CURRENT_OFFICE_KEY, id);
              location.reload();
            }

            // कार्यालय पट्टी थप्ने
            function renderOfficeBar() {
              var offices = getOffices();
              var current = getCurrentOffice();

              // यदि कुनै कार्यालय छैन भने पूर्वनिर्धारित कार्यालय थप्ने
              if (offices.length === 0) {
                offices = [{ id: "off_default", name: "मुख्य उपविभाग (Default)" }];
                saveOffices(offices);
                current = "off_default";
                localStorage.setItem(CURRENT_OFFICE_KEY, current);
              }

              var container = document.createElement("div");
              container.className = "office-bar-container";
              container.innerHTML = `
                <div class="office-bar-title">🏛️ चालू कार्यालय / उपविभाग व्यवस्थापन</div>
                <div class="office-select-row">
                  <select id="mbms_office_selector"></select>
                  <button type="button" class="office-btn btn-office-add" id="mbms_add_office_btn">➕ नवीन कार्यालय</button>
                  <button type="button" class="office-btn btn-office-del" id="mbms_del_office_btn">🗑️ हटवा</button>
                </div>
              `;

              var bodyFirst = document.body.firstChild;
              document.body.insertBefore(container, bodyFirst);

              var sel = document.getElementById("mbms_office_selector");
              sel.innerHTML = '<option value="">-- कार्यालय निवडा --</option>' +
                offices.map(function(o) {
                  return '<option value="' + o.id + '"' + (o.id === current ? ' selected' : '') + '>' + o.name + '</option>';
                }).join('');

              sel.onchange = function() {
                if (this.value) setCurrentOffice(this.value);
              };

              document.getElementById("mbms_add_office_btn").onclick = function() {
                var name = prompt("नवीन कार्यालयाचे नाव प्रविष्ट करा:");
                if (name && name.trim()) {
                  var id = "off_" + Date.now();
                  offices.push({ id: id, name: name.trim() });
                  saveOffices(offices);
                  setCurrentOffice(id);
                }
              };

              document.getElementById("mbms_del_office_btn").onclick = function() {
                if (!current) return alert("हटवण्यासाठी कार्यालय निवडा.");
                if (offices.length <= 1) return alert("किमान एक कार्यालय असणे आवश्यक आहे.");
                if (confirm("हे कार्यालय आणि त्याचा सर्व डेटा कायमचा हटवायचा का?")) {
                  offices = offices.filter(function(o) { return o.id !== current; });
                  saveOffices(offices);
                  setCurrentOffice(offices[0].id);
                }
              };
            }

            // प्रिन्ट हेल्पर
            function getPrintArea() {
              var pa = document.getElementById('printArea');
              if (!pa) {
                pa = document.createElement('div');
                pa.id = 'printArea';
                document.body.appendChild(pa);
              }
              return pa;
            }

            // १. Work List 5-Column Clean Print
            window.printWorkListCleanReport = function(works, title, fromDate, toDate) {
              var pa = getPrintArea();
              var h = '';
              h += '<div class="report-header">';
              h += '  <h2>सार्वजनिक बांधकाम विभाग</h2>';
              h += '  <h3>मोजमाप पुस्तिका नियंत्रण प्रणाली</h3>';
              h += '  <h4>WORK LIST REPORT</h4>';
              h += '</div>';
              h += '<div class="report-meta">';
              h += '  <span><b>Report :</b> ' + (title || 'सर्व Work List') + '</span>';
              h += '  <span><b>दिनांक :</b> ' + (fromDate && toDate ? (fromDate + ' ते ' + toDate) : new Date().toLocaleDateString('en-GB')) + '</span>';
              h += '</div>';
              h += '<table class="work-report-table">';
              h += '  <thead><tr>';
              h += '    <th class="col-sr">अ.क्र.</th>';
              h += '    <th class="col-work">कामाचे नाव</th>';
              h += '    <th class="col-contractor">कॉन्ट्रॅक्टर / एजन्सी</th>';
              h += '    <th class="col-je">JE नाव</th>';
              h += '    <th class="col-mb">MB क्र.</th>';
              h += '  </tr></thead><tbody>';

              var list = Array.isArray(works) ? works : [];
              if (list.length === 0) {
                h += '<tr><td colspan="5" style="text-align:center; padding:10px;">कोणतीही नोंद उपलब्ध नाही.</td></tr>';
              } else {
                for (var i = 0; i < list.length; i++) {
                  var w = list[i];
                  h += '<tr>';
                  h += '  <td class="col-sr">' + (i + 1) + '</td>';
                  h += '  <td class="col-work">' + (w.workName || w.name || w.work || '-') + '</td>';
                  h += '  <td class="col-contractor">' + (w.contractor || w.agency || w.contractorName || '-') + '</td>';
                  h += '  <td class="col-je">' + (w.je || w.jeName || w.juniorEngineer || '-') + '</td>';
                  h += '  <td class="col-mb">' + (w.mb || w.number || w.mbNumber || '-') + '</td>';
                  h += '</tr>';
                }
              }
              h += '</tbody></table>';
              h += '<div class="report-footer">© सर्व हक्क राखीव - सार्वजनिक बांधकाम विभाग</div>';
              pa.innerHTML = h;
              setTimeout(function(){ window.print(); }, 120);
            };

            // २. JE Report दुरुस्ती
            window.fixAndPrintJEReport = function() {
              var jes = [];
              try {
                if (typeof getJEList === 'function') jes = getJEList();
                else if (localStorage.getItem('mbms_jes')) jes = JSON.parse(localStorage.getItem('mbms_jes'));
                else if (typeof homeRelData === 'function') jes = homeRelData().jes || [];
              } catch(e) { jes = []; }

              var pa = getPrintArea();
              var h = '<div class="report-header"><h2>सार्वजनिक बांधकाम विभाग</h2><h3>मोजमाप पुस्तिका नियंत्रण प्रणाली</h3><h4>JE REPORT</h4></div>';
              h += '<div class="report-meta"><span><b>Report :</b> सर्व JE</span><span><b>दिनांक :</b> ' + new Date().toLocaleDateString('en-GB') + '</span></div>';
              h += '<table class="print-table"><thead><tr><th style="width:10%; text-align:center;">अ.क्र.</th><th style="width:90%; text-align:left;">Junior Engineer चे नाव</th></tr></thead><tbody>';
              if (!jes || jes.length === 0) {
                h += '<tr><td colspan="2" style="text-align:center; padding:10px;">कोणतीही JE नोंद उपलब्ध नाही.</td></tr>';
              } else {
                for (var i = 0; i < jes.length; i++) {
                  var name = typeof jes[i] === 'object' ? (jes[i].name || jes[i].jeName || '-') : jes[i];
                  h += '<tr><td style="text-align:center;">' + (i + 1) + '</td><td>' + name + '</td></tr>';
                }
              }
              h += '</tbody></table><div class="report-footer">© सर्व हक्क राखीव - सार्वजनिक बांधकाम विभाग</div>';
              pa.innerHTML = h;
              setTimeout(function(){ window.print(); }, 120);
            };

            // ३. Transfer Report दुरुस्ती
            window.fixAndPrintTransferReport = function() {
              var trs = [];
              try {
                if (typeof getTransferHistory === 'function') trs = getTransferHistory();
                else if (localStorage.getItem('mbms_transfers')) trs = JSON.parse(localStorage.getItem('mbms_transfers'));
              } catch(e) { trs = []; }

              var fromD = document.getElementById('transferReportFrom')?.value || '';
              var toD = document.getElementById('transferReportTo')?.value || '';
              var pa = getPrintArea();
              var h = '<div class="report-header"><h2>सार्वजनिक बांधकाम विभाग</h2><h3>मोजमाप पुस्तिका नियंत्रण प्रणाली</h3><h4>TRANSFER MB REPORT</h4></div>';
              h += '<div class="report-meta"><span><b>Report :</b> सर्व Transfer नोंदी</span><span><b>दिनांक :</b> ' + (fromD && toD ? (fromD + ' ते ' + toD) : new Date().toLocaleDateString('en-GB')) + '</span></div>';
              h += '<table class="print-table"><thead><tr><th style="width:7%; text-align:center;">अ.क्र.</th><th style="width:14%; text-align:center;">MB क्र.</th><th style="width:14%; text-align:center;">दिनांक</th><th style="width:25%; text-align:left;">कोणाकडे</th><th style="width:40%; text-align:left;">कामाचे नाव</th></tr></thead><tbody>';
              if (!trs || trs.length === 0) {
                h += '<tr><td colspan="5" style="text-align:center; padding:10px;">कोणतीही Transfer नोंद उपलब्ध नाही.</td></tr>';
              } else {
                for (var i = 0; i < trs.length; i++) {
                  var t = trs[i];
                  h += '<tr><td style="text-align:center;">' + (i+1) + '</td><td style="text-align:center;">' + (t.number || t.mb || '-') + '</td><td style="text-align:center;">' + (t.date || t.transferDate || '-') + '</td><td>' + (t.receiverName || t.to || '-') + '</td><td>' + (t.workName || t.work || '-') + '</td></tr>';
                }
              }
              h += '</tbody></table><div class="report-footer">© सर्व हक्क राखीव - सार्वजनिक बांधकाम विभाग</div>';
              pa.innerHTML = h;
              setTimeout(function(){ window.print(); }, 120);
            };

            document.addEventListener("DOMContentLoaded", renderOfficeBar);
          })();
          </script>
          """

          if "</body>" in text.lower():
              pos = text.lower().rfind("</body>")
              text = text[:pos] + patch_code + text[pos:]
          else:
              text += patch_code

          p.write_text(text, encoding="utf-8")
          print("SUCCESS: Multi-office controller and hardened print engine injected.")
          PY


      # ============================================================
      # 9. CREATE ANDROID PROJECT
      # ============================================================
      - name: Create Android project structure
        shell: bash
        run: |
          set -e
          rm -rf mbms_android release
          mkdir -p \
            mbms_android/app/src/main/assets \
            mbms_android/app/src/main/java/com/mbms/app \
            mbms_android/app/src/main/res/values \
            release

          cp mbms_work/index.html mbms_android/app/src/main/assets/index.html

          cat > mbms_android/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "MBMSAndroid"
          include(":app")
          EOF

          cat > mbms_android/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF

          cat > mbms_android/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat > mbms_android/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.mbms.app'
              compileSdk 35
              defaultConfig {
                  applicationId 'com.mbms.app'
                  minSdk 26
                  targetSdk 35
                  versionCode 132
                  versionName 'V132'
              }
              buildTypes {
                  debug {
                      minifyEnabled false
                      shrinkResources false
                  }
                  release {
                      minifyEnabled false
                      shrinkResources false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat > mbms_android/app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">MBMS</string>
          </resources>
          EOF

          cat > mbms_android/app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#1976D2</item>
                  <item name="android:navigationBarColor">#06458E</item>
              </style>
          </resources>
          EOF

          cat > mbms_android/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />

              <application
                  android:allowBackup="true"
                  android:usesCleartextTraffic="true"
                  android:label="@string/app_name"
                  android:theme="@style/AppTheme"
                  android:hardwareAccelerated="true"
                  android:resizeableActivity="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF


      # ============================================================
      # 10. CREATE MAINACTIVITY.JAVA WITH NATIVE BACKUP & PRINT
      # ============================================================
      - name: Create MainActivity.java
        shell: bash
        run: |
          set -e
          cat > mbms_android/app/src/main/java/com/mbms/app/MainActivity.java <<'EOF'
          package com.mbms.app;

          import android.app.Activity;
          import android.content.Context;
          import android.os.Bundle;
          import android.print.PrintAttributes;
          import android.print.PrintDocumentAdapter;
          import android.print.PrintManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Toast;

          public class MainActivity extends Activity {

              private WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);
                  settings.setTextZoom(100);

                  AndroidBridge bridge = new AndroidBridge();
                  webView.addJavascriptInterface(bridge, "MBMSAndroid");
                  webView.addJavascriptInterface(bridge, "AndroidBridge");

                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public void onPageFinished(WebView view, String url) {
                          super.onPageFinished(view, url);
                          webView.evaluateJavascript(
                              "window.print=function(){ if(window.MBMSAndroid){ window.MBMSAndroid.print(); } };",
                              null
                          );
                      }
                  });

                  webView.loadUrl("file:///android_asset/index.html");
              }

              public class AndroidBridge {
                  @JavascriptInterface
                  public void print() {
                      runOnUiThread(new Runnable() {
                          @Override
                          public void run() {
                              try {
                                  PrintManager manager = (PrintManager) getSystemService(Context.PRINT_SERVICE);
                                  if (manager != null && webView != null) {
                                      webView.postDelayed(new Runnable() {
                                          @Override
                                          public void run() {
                                              try {
                                                  PrintDocumentAdapter adapter = webView.createPrintDocumentAdapter("MBMS Report");
                                                  PrintAttributes attributes = new PrintAttributes.Builder()
                                                          .setMediaSize(PrintAttributes.MediaSize.ISO_A4)
                                                          .setMinMargins(PrintAttributes.Margins.NO_MARGINS)
                                                          .build();
                                                  manager.print("MBMS Report", adapter, attributes);
                                              } catch (Exception e) {
                                                  Toast.makeText(MainActivity.this, "Print अयशस्वी झाले.", Toast.LENGTH_SHORT).show();
                                              }
                                          }
                                      }, 500);
                                  }
                              } catch (Exception e) {
                                  Toast.makeText(MainActivity.this, "Print सुरू करता आले नाही.", Toast.LENGTH_SHORT).show();
                              }
                          }
                      });
                  }
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }

              @Override
              protected void onDestroy() {
                  if (webView != null) {
                      webView.stopLoading();
                      webView.destroy();
                      webView = null;
                  }
                  super.onDestroy();
              }
          }
          EOF


