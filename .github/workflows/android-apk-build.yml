      - name: Create Gradle Wrapper
        working-directory: mbms_android
        shell: bash
        run: |
          set -e

          gradle wrapper \
            --gradle-version 8.7 \
            --distribution-type bin

          chmod +x gradlew

          ./gradlew --version


      - name: Compile Android Java
        working-directory: mbms_android
        shell: bash
        run: |
          set -e

          ./gradlew \
            --no-daemon \
            --stacktrace \
            :app:compileDebugJavaWithJavac

          echo "JAVA COMPILATION PASSED."


      - name: Build Final MBMS APK
        working-directory: mbms_android
        shell: bash
        run: |
          set -e

          ./gradlew \
            --no-daemon \
            --stacktrace \
            clean \
            :app:assembleDebug

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"


          cp \
            "$APK" \
            "../release/MBMS-V124-MB-SUMMARY-LINKED.apk"


          ls -lh \
            "../release/MBMS-V124-MB-SUMMARY-LINKED.apk"


      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="release/MBMS-V124-MB-SUMMARY-LINKED.apk"

          test -s "$APK"


          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify \
            --verbose \
            "$APK"


          unzip -t "$APK" >/dev/null


          sha256sum "$APK" \
            | tee release/SHA256.txt


          echo "APK SIGNATURE AND ZIP VERIFICATION PASSED."


      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MBMS-V124-MB-SUMMARY-LINKED
          path: |
            release/MBMS-V124-MB-SUMMARY-LINKED.apk
            release/SHA256.txt
          if-no-files-found: error
